id: mihub.lung.screening.ctdiVol.v0.1
uuid: d1b04231-6f35-5fbe-9d81-7de6f802cb09
name: ctdiVol
label_de: Volumen-CT-Dosisindex (CTDIvol) der Spiral-LDCT
definition_de: Mittlerer CTDIvol der Spiralaufnahme (mGy, ohne Übersicht) aus dem Dosisbericht; Definitionsmerkmal
  der LDCT (≤ 1,3 mGy).
phase: screening
category: messwert
datatype: Quantity
cardinality: 1..*
unit: mGy
value_set:
  binding_strength: preferred
  standard_binding_status: mapped
  notes: 'Element-Code DICOM DCM 113830 Mean CTDIvol (im CT-Dosisbericht/RDSR unter 113829 CT Dose innerhalb
    von 113819 CT Acquisition, TID 10013), Einheit UCUM mGy wie im MII-Slice CTDIvol; RadLex RID12357
    und NCIt C101138 als zusätzliche Element-Mappings. Methode: der CT Acquisition Type trennt das Spiral-Bestrahlungsereignis
    (SNOMED 116152004) von der Übersichtsaufnahme (DCM 113805 Constant Angle Acquisition); maßgeblich
    ist der CTDIvol der Spiralaufnahme ohne Übersicht. Für Constant-Angle-Ereignisse fordert das RDSR
    keinen CT-Dose-Container, ein Übersichts-CTDIvol ist dort daher ggf. nicht verfügbar. Kein LOINC-
    oder SNOMED-CT-Observable für CTDIvol. Editionen: MII TermServ, DICOM 2025.3, RadLex 4.2, NCIt 25.6,
    SNOMED CT 20260701, UCUM 1.0.1; Stand 2026-10-15. Rollen der Codes: dicom-dcm|113830 = element; radlex|RID12357
    = element; ncit|C101138 = element; snomed-ct|116152004 = methode; dicom-dcm|113805 = methode.'
  codings:
  - system: dicom-dcm
    code: '113830'
    display: Mean CTDIvol
  - system: radlex
    code: RID12357
    display: volume CT dose index
  - system: ncit
    code: C101138
    display: Computed Tomography Dose Index Volume
  - system: snomed-ct
    code: '116152004'
    display: Spiral computed tomography scan
  - system: dicom-dcm
    code: '113805'
    display: Constant Angle Acquisition
standard_mappings:
- standard: fhir-mii-kds
  profile_or_url: https://www.medizininformatik-initiative.de/fhir/ext/modul-bildgebung/StructureDefinition/mii-ex-bildgebung-modalitaet-ct
  resource: ImagingStudy
  path: ImagingStudy.series.extension:modalitaetCT.extension:CTDIvol
  notes: 'de.medizininformatikinitiative.kerndatensatz.bildgebung#2026.0.0, stabil. Direkte Abbildung
    des Werts: Sub-Extension CTDIvol 0..1, valueQuantity mit unit milligray, system http://unitsofmeasure.org,
    code mGy; eingebunden in mii-pr-bildgebung-bildgebungsstudie als series.extension:modalitaetCT 0..1.
    Der Wert hängt an der Serie, nicht am Bestrahlungsereignis: Spiralserie wählen, Übersichtsaufnahme
    ausschließen. Konformität (≤ 1,3 mGy) und Überschreitungsgrund fehlen im Profil. DCM 113830 ist im
    Profil nicht hinterlegt (Identifikation über die Extension-URL).'
- standard: fhir-mii-kds
  profile_or_url: https://www.medizininformatik-initiative.de/fhir/ext/modul-bildgebung/StructureDefinition/mii-ex-bildgebung-modalitaet-ct
  resource: ImagingStudy
  path: ImagingStudy.series.extension:modalitaetCT.extension:CTDIvol
  notes: de.medizininformatikinitiative.kerndatensatz.bildgebung#2027.0.0-ballot.1, Ballot. Gegenüber
    2026.0.0 unverändert (Sub-Extensions CTDIvol, KVP, exposureTime, exposure, xRayTubeCurrent, convolutionalKernel;
    Pattern mGy).
- standard: dicom-sr
  profile_or_url: https://dicom.nema.org/medical/dicom/current/output/chtml/part16/sect_TID_10013.html
  path: TID 10011 (113701 X-Ray Radiation Dose Report) > TID 10013 CT Irradiation Event Data > 113819
    CT Acquisition > 113829 CT Dose > 113830 Mean CTDIvol (NUM, mGy)
  notes: DICOM PS3.16 2026d, nicht-FHIR. Primärquelle des Werts ist das CT-RDSR (SOP Class X-Ray Radiation
    Dose SR 1.2.840.10008.5.1.4.1.1.88.67) mit einer Angabe je Bestrahlungsereignis. Maßgeblich ist das
    Ereignis mit CT Acquisition Type Spiral (SNOMED 116152004). Der Container 113829 CT Dose ist nur gefordert,
    wenn das Ereignis keine Constant Angle Acquisition (113805, Übersichtsaufnahme) ist.
- standard: other
  profile_or_url: http://hl7.org/fhir/uv/radiation-dose-summary/StructureDefinition/radiation-dose-summary
  resource: Observation
  path: Observation.component
  notes: 'hl7.fhir.uv.radiation-dose-summary#1.0.0, stabil (HL7/IHE, international). Dosiszusammenfassung
    je Untersuchung aus dem RDSR: code-Pattern LOINC 73569-6, partOf:imagingStudyRef 1..1 MS, performer:irradiationAuthorizingPerson
    1..1 MS (passt zur Strahlenschutzverantwortlichen), value[x] string 1..1 MS – jede Instanz braucht
    also zusätzlich eine textuelle Dosiszusammenfassung. component.code extensible an component-radiation-dose-summary-vs
    (für CT nur DCM 113813 DLP); 113830 als zusätzlicher component.code mit valueQuantity in mGy zulässig.'
- standard: other
  profile_or_url: http://hl7.eu/fhir/imaging/StructureDefinition/ObservationRadiationDoseEuImaging
  resource: Observation
  path: Observation.component
  notes: hl7.fhir.eu.imaging#1.0.0-ballot, Ballot (SD-Status draft). Code LOINC 73569-6, partOf:study
    1..1, value[x] string 1..1, component.code nur example-gebunden; CTDIvol nur als freie Komponente.
    Schwächer als die MII-Extension; Ausblick (EHDS).
