issues:
- 'Verbindlichkeit nach Gegenprüfung: mittelbar. Definitionsmerkmal der LDCT (LuKrFrühErkV § 1 Abs. 1
  S. 1 Nr. 1 und S. 2) mit Einhaltungspflicht nach § 4 Abs. 1 S. 2 und Anlage; Aufzeichnung der Exposition
  nach StrlSchG § 85 Abs. 1 S. 2 Nr. 3 Buchst. a (ohne bestimmte Dosisgröße).'
- 'Umsetzung: eigenständig (isPartOf ldctExamination). Kardinalität 0..* (1 je LDCT bzw. Spiral-Bestrahlungsereignis),
  unit mGy; isPartOf ldctExamination. Mapping: …/fhir/ext/modul-bildgebung/StructureDefinition/mii-ex-bildgebung-modalitaet-ct
  (Slice CTDIvol) bzw. DICOM TID 10013. Konformität (≤ 1,3 mGy) und ggf. den Grund einer Überschreitung
  (Körperstatur) hier als Attribut führen (statt des verworfenen ctdiVolExceedanceJustification). Optional
  den CTDIvol der Übersichtsaufnahme als Komponente (Anlage: ≤ 0,2 × angestrebter Spiral-CTDIvol). Fundstelle
  präzisieren: § 1 Abs. 1 S. 1 Nr. 1 und S. 2. Codesysteme dicom-dcm und ncit im Repo ergänzen.'
- Konformität mit dem Grenzwert (≤ 1,3 mGy) und ein Überschreitungsgrund (Körperstatur) haben keinen Standardcode
  und kein Profilelement; sie sind als lokale Attribute dieses Elements zu führen.
- Die Bedingung der Anlage für die Übersichtsaufnahme (≤ 0,2 × angestrebter Spiral-CTDIvol) ist ohne Datenquelle,
  weil das RDSR für Constant-Angle-Ereignisse keinen CT-Dose-Container fordert; Quelle bzw. Verzicht ist
  zu klären.
- Die MII-Extension hängt an der Serie statt am Bestrahlungsereignis; die Zuordnung der Spiralserie ist
  festzulegen.
- Kardinalität 0..* (eine Angabe je LDCT bzw. Spiral-Bestrahlungsereignis) statt 1..1; Fundstelle auf
  LuKrFrühErkV § 1 Abs. 1 S. 1 Nr. 1 und S. 2 präzisieren.
- Die Systemschlüssel dicom-dcm, radlex und ncit sind in der Terminologieprüfung des Repos (SYSTEM_URL)
  zu hinterlegen.
- Das ACR LCSR & IPN Data Dictionary (#143 CTDIvol) ist ohne stabile URL und deshalb nicht als Mapping
  aufgenommen.
- Kardinalität laut Quelle 0..* (1 je LDCT).
