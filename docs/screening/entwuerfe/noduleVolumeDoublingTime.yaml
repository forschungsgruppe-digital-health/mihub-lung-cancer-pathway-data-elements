id: mihub.lung.screening.noduleVolumeDoublingTime.v0.1
uuid: fb1c6d66-b2e7-501f-adef-0e52095cd508
name: noduleVolumeDoublingTime
label_de: Volumenverdopplungszeit (VDT) des Rundherds
definition_de: Volumenverdopplungszeit in Tagen aus zwei oder mehr Volumina, mit Vergleichsuntersuchung,
  Software und Methode.
phase: screening
category: messwert
datatype: Quantity
cardinality: 0..*
unit: d
value_set:
  binding_strength: preferred
  standard_binding_status: mapped
  notes: 'Element-Code (Observation.code) ist NCIt C113268 |Volume Doubling Time| (''The number of days
    that it takes for a nodule to double in volume''); Einheit UCUM d. SNOMED CT, LOINC und DICOM DCM
    enthalten kein Konzept für die Volumenverdopplungszeit. Gespeichert wird nur der Rohwert in Tagen,
    keine fassungsabhängigen Schwellen (V-Lung-RADS 600 Tage, ESTI, NELSON). Das Berechnungsverfahren
    (Zwei-Punkt-Formel oder Regression über alle Zeitpunkte) steht in Observation.method (lokal), die
    Segmentierungssoftware in Observation.device. Editionen: NCIt 25.6.0-e, UCUM (MII TermServ); SNOMED
    CT INT 20260701 und LOINC 2.83 ohne passendes Konzept; Stand 2026-10-15. Rollen der Codes: ncit|C113268
    = element.'
  codings:
  - system: ncit
    code: C113268
    display: Volume Doubling Time
standard_mappings:
- standard: fhir-mii-kds
  profile_or_url: https://www.medizininformatik-initiative.de/fhir/ext/modul-bildgebung/StructureDefinition/mii-pr-bildgebung-radiologische-beobachtung
  resource: Observation
  path: Observation.code; Observation.value[x]; Observation.derivedFrom; Observation.method; Observation.device
  notes: 'de.medizininformatikinitiative.kerndatensatz.bildgebung#2026.0.0, stabil (Hauptziel). Element
    als hasMember der Rundherd-Observation. code mit NCIt C113268 im offenen Slicing; ein SNOMED-Code
    müsste Clinical finding sein. value[x] erlaubt Quantity (UCUM d). derivedFrom 0..* MS → Volumen-Observations
    beider Zeitpunkte bzw. ImagingStudy der Vergleichsuntersuchung. method 0..1 und device 0..1 sind vorhanden,
    aber nicht MS; beide projektseitig als Pflicht fordern (ESTI: Software und Verfahren).'
- standard: fhir-mii-kds
  profile_or_url: https://www.medizininformatik-initiative.de/fhir/ext/modul-bildgebung/StructureDefinition/mii-pr-bildgebung-radiologische-messung
  resource: Observation
  path: Observation.valueQuantity; Observation.method; Observation.derivedFrom; Observation.device; Observation.code
  notes: de.medizininformatikinitiative.kerndatensatz.bildgebung#2027.0.0-ballot.1, Ballot (Zielbild).
    valueQuantity mit UCUM-System-Pattern ('d'); method 0..1 MS für Zwei-Punkt-Formel bzw. Regression;
    derivedFrom 0..* MS (Observation, ImagingStudy); device 0..1, nicht MS. NCIt C113268 als Coding im
    offenen Slicing; für einen SNOMED-code gilt der Bindungskonflikt des sct-Slices (Clinical finding,
    defektes System-Pattern). Schwellen nicht im Profil speichern.
- standard: fhir-r4-base
  profile_or_url: http://hl7.org/fhir/StructureDefinition/Observation
  resource: Observation
  path: Observation.valueQuantity; Observation.derivedFrom; Observation.method; Observation.device
  notes: 'hl7.fhir.r4.core#4.0.1, stabil; nur Fallback. Abgeleiteter Wert: derivedFrom → mindestens zwei
    Volumen-Observations (noduleSizeMeasurement), method = Berechnungsverfahren, device = Segmentierungssoftware
    (ESTI: dieselbe Software in der Verlaufskontrolle). Für die Einbettung in den MII-Befundbaum das MII-Profil
    vorziehen.'
- standard: dicom-sr
  profile_or_url: https://dicom.nema.org/medical/dicom/current/output/chtml/part16/chapter_A.html#sect_TID_1500
  resource: TID 1500 Measurement Report (Measurement Groups mit Tracking Identifier/UID)
  path: Measurement Group je Rundherd und Zeitpunkt; abgeleitete Messung über Tracking UID verknüpft
  notes: DICOM PS3.16 2026d, nicht-FHIR. Die Struktur trägt abgeleitete Messungen ('together with any
    derived measurements') und die Herdverknüpfung über Untersuchungen (Tracking UID). PS3.16 Annex D
    enthält keinen Konzeptnamen für die Volumenverdopplungszeit; Kodierung nur über NCIt bzw. lokal.
care_process:
  trigger: Rundherd mit mindestens zwei Volumenmessungen (Vergleichsuntersuchung)
  responsible_role: Befunder (CAD-Berechnung)
