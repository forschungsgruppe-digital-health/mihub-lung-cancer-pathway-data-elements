issues:
- 'Verbindlichkeit nach Gegenprüfung: Leitlinie. S3 Empf. 5.8/5.9 mit Tab. 17 (V-Lung-RADS: VDT-Schwelle
  600 Tage); die Berechnung ist als CAD-Funktion vorgeschrieben (Anlage), ein eigenes Befundfeld nicht.'
- 'Umsetzung: Teil von pulmonaryNoduleFinding. isPartOf pulmonaryNoduleFinding; abgeleitet aus mindestens
  zwei Volumina (noduleSizeMeasurement), der Vergleichsuntersuchung (ImagingStudy) und der CAD-Software
  (Device); Methode (Zwei-Punkt-Formel oder Regression) als Observation.method; Einheit UCUM d. Nur den
  Rohwert speichern, keine fassungsabhängigen Schwellen (V-Lung-RADS 600 Tage, ESTI 250/400/500 Tage,
  NELSON 400/600 Tage). „ncit“ fehlt in scripts/verify-terminology.py und tx.fhir.org kennt C113268 nicht:
  SYSTEM_URL ergänzen oder standard_binding_status pending-mapping. Deutsche Primärquellen ergänzen (Anlage
  zu § 4, S3 Empf. 5.8 und 5.9).'
- SNOMED CT, LOINC und DICOM DCM enthalten kein Konzept für die Volumenverdopplungszeit; ein Konzeptantrag
  (SNOMED-Observable bzw. LOINC-Term) ist zu erwägen.
- Für das Berechnungsverfahren (Zwei-Punkt-Formel, Regression über alle Zeitpunkte) existiert kein Standardcode;
  ein lokales CodeSystem ist festzulegen.
- Observation.method und Observation.device sind in den MII-Profilen nicht MS und müssen projektseitig
  als Pflicht gefordert werden.
- Deutsche Primärquellen (Anlage zu § 4 LuKrFrühErkV, S3 Empf. 5.8 und 5.9) sind als Belege zu ergänzen.
