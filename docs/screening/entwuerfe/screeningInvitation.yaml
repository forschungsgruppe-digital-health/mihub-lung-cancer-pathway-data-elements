id: mihub.lung.screening.screeningInvitation.v0.1
uuid: 36fd91bb-159d-5830-8752-ce638d14dd5d
name: screeningInvitation
label_de: Aufforderung, Wiedereinladung, Erinnerung (Recall)
definition_de: Aufforderung, Wiedereinladung oder Erinnerung mit Zeitpunkt, Kanal, auffordernder Stelle
  und Anlass (Erstaufforderung, Jahresrunde, Kontroll-LDCT, Neubewertung).
phase: screening
category: kontakt-visite
datatype: string
cardinality: 0..*
value_set:
  binding_strength: example
  standard_binding_status: mapped
  notes: 'MII TermServ, SNOMED CT 20260701, LOINC 2.83, HL7 v3 ParticipationMode 4.0.0, HL7 CommunicationCategory
    1.0.0; Stand 2026-10-15. Das Ereignis wird als FHIR Communication modelliert. Elementcode (Communication.category
    bzw. topic) ist 308535007 ''Screening call'', das nur Früherkennungs-Einladungen umfasst; 310422005
    ''Prevention/screening invitation'' ist breiter (schließt Impf- und Monitoring-Einladungen ein) und
    nur Rückfallkodierung. Antwortwerte Kanal: entweder die SNOMED-Prozeduren 185534005 (Brief), 185535006
    (Telefon), 185536007 (mündlich), alle unter 308535007, oder - passend zu Communication.medium - v3
    ParticipationMode MAILWRIT (Brief), PHONE (Telefon), FACE (mündlich in der Praxis; VERBAL wäre Oberbegriff
    inkl. Telefon), EMAILWRIT (E-Mail), MSGWRIT (App-/Push-Nachricht), ONLINEWRIT (Portalnachricht). CommunicationCategory
    ''reminder'' kennzeichnet Wiedereinladung und Erinnerung. Ziel der Aufforderung (Communication.reasonCode
    bzw. about) ist 275981009; das frühere 724167008 ''Lung cancer screening'' ist inaktiv und per SAME_AS
    durch 275981009 ersetzt. Dokumenttyp des Einladungsschreibens (DocumentReference.type) ist LOINC 108276-7.
    Der Anlass (Erstaufforderung, Jahresrunde, Kontroll-LDCT, Neubewertung) hat keinen Standardcode und
    wird lokal kodiert. Binding example, weil weder Programm noch Rechtsgrundlage ein Einladungsverfahren
    vorgeben. Rollen der Codes: snomed-ct|308535007 = element; snomed-ct|310422005 = element; snomed-ct|185534005
    = wert; snomed-ct|185535006 = wert; snomed-ct|185536007 = wert; http://terminology.hl7.org/CodeSystem/v3-ParticipationMode|MAILWRIT
    = wert; http://terminology.hl7.org/CodeSystem/v3-ParticipationMode|PHONE = wert; http://terminology.hl7.org/CodeSystem/v3-ParticipationMode|FACE
    = wert; http://terminology.hl7.org/CodeSystem/v3-ParticipationMode|EMAILWRIT = wert; http://terminology.hl7.org/CodeSystem/v3-ParticipationMode|MSGWRIT
    = wert; http://terminology.hl7.org/CodeSystem/v3-ParticipationMode|ONLINEWRIT = wert; http://terminology.hl7.org/CodeSystem/communication-category|reminder
    = wert; snomed-ct|275981009 = wert; loinc|108276-7 = dokumentklasse; local-no-standard-binding|erstaufforderung
    = wert; local-no-standard-binding|jahresrunde = wert; local-no-standard-binding|kontroll-ldct = wert;
    local-no-standard-binding|neubewertung = wert.'
