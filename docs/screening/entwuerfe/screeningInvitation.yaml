issues:
- 'Verbindlichkeit nach Gegenprüfung: keine. Kein gesetzliches Einladungs- oder Recall-Verfahren (Maßnahme
  nach § 25, kein Programm nach § 25a SGB V). S3 Tab. 14 Nr. 1 gilt nur für ein künftiges § 25a-Programm;
  S3 Kap. 5.1.4.5 (Hintergrund) hält Erinnerungen für erforderlich.'
- 'Umsetzung: eigenständig, optional (pfad- und portalspezifisch). Als Übermittlungsereignis modellieren
  (Communication: sent, medium, sender, reasonCode) statt dateTime. Kanal über SNOMED 185534005/185535006/185536007,
  lokal ergänzt um Portal/App; Anlass lokal (Erstaufforderung, Jahresrunde, Kontroll-LDCT, Neubewertung).
  Anlässe belegen mit KFE-RL § 38 Abs. 1, § 42 Abs. 3 Nr. 1, S3 Empf. 5.6 und KFE-RL § 43 Abs. 2 S. 2
  Nr. 2. Fälligkeit nicht hier speichern, sondern aus recommendedControlInterval bzw. plannedFollowUpAppointment
  ableiten. S3 Tab. 14 Nr. 1 nur als Ausblick zitieren; in notes festhalten, dass das heutige Programm
  kein Einladungsverfahren hat.'
- Der Anlass der Aufforderung (Erstaufforderung, Jahresrunde, Kontroll-LDCT, Neubewertung) hat weder in
  SNOMED CT noch in LOINC oder HL7 einen Code; die lokalen Codes müssen fachlich bestätigt und als CodeSystem
  veröffentlicht werden.
- Es ist festzulegen, ob der Kanal über Communication.medium (v3 ParticipationMode) oder über die SNOMED-Prozeduren
  185534005/185535006/185536007 geführt wird; empfohlen wird medium für den Kanal und SNOMED nur für category/topic.
- Für den Portal- bzw. App-Kanal ist zwischen MSGWRIT (App- oder Push-Nachricht) und ONLINEWRIT (Portalnachricht)
  zu entscheiden.
- SNOMED CT 20260701 hat kein lungen- oder LDCT-spezifisches Einladungs- oder Recall-Konzept; 308535007
  ist der engste verfügbare Code.
- Es gibt kein deutsches FHIR-Profil (MII KDS, KBV-Basis, gematik ePA, ISiK) für eine Screening-Einladung.
  ISiKNachricht (de.gematik.isik-terminplanung#4.0.3) ist ungeeignet, weil es einen Empfänger vom Typ
  Practitioner oder HealthcareService verlangt und damit eine Einladung der Praxis an die Patient:in nicht
  konform abbildet; das Profil fehlt zudem in de.gematik.isik#6.0.0.
- Der Datentyp sollte von dateTime auf Reference(Communication) umgestellt werden, damit Zeitpunkt, Kanal,
  auffordernde Stelle und Anlass gemeinsam erfasst werden.
- Das heutige Programm (Maßnahme nach § 25 SGB V) hat kein gesetzliches Einladungsverfahren; S3-LL Tab.
  14 Nr. 1 gilt nur für ein künftiges Programm nach § 25a SGB V.
- Die NHS Lung Cancer Screening Data Set (LCSDS) v1.0 soll Einladungsangaben enthalten, die Spezifikation
  war jedoch nicht abrufbar und ist nicht zugeordnet.
