standard_mappings:
- standard: fhir-r4-base
  profile_or_url: http://hl7.org/fhir/StructureDefinition/Communication
  resource: Communication
  path: Communication.sent
  notes: 'hl7.fhir.r4.core#4.0.1, Ressource Trial Use (FMM 2). Hauptziel, weil kein nationales Profil
    passt. Die Einladung ist ein stattgefundenes Übermittlungsereignis: sent (0..1 dateTime) = Zeitpunkt,
    status 1..1 (event-status, required), medium 0..* (example v3-ParticipationMode) = Kanal, category
    bzw. topic (example) = 308535007 bzw. SNOMED-Kanalprozedur und ''reminder'', reasonCode (example clinical-findings)
    = lokaler Anlass bzw. 275981009, sender = Praxis (Practitioner, PractitionerRole oder Organization),
    recipient und subject = Patient:in. basedOn verweist auf CommunicationRequest oder Appointment, wenn
    die Fälligkeit geplant war.'
- standard: fhir-r4-base
  profile_or_url: http://hl7.org/fhir/StructureDefinition/CommunicationRequest
  resource: CommunicationRequest
  path: CommunicationRequest.occurrenceDateTime
  notes: 'hl7.fhir.r4.core#4.0.1, Trial Use; optional und sekundär. Bildet einen fälligen, noch nicht
    versandten Recall ab: occurrence[x] (dateTime oder Period) = geplanter Zeitpunkt, medium wie bei Communication,
    requester = Praxis. reasonCode ist hier an v3-ActReason (http://terminology.hl7.org/CodeSystem/v3-ActReason,
    example) gebunden, nicht an clinical-findings; der lokale Anlass-Code ist trotzdem zulässig. Die Fälligkeit
    selbst wird aus recommendedControlInterval bzw. plannedFollowUpAppointment abgeleitet.'
- standard: openehr-archetype
  profile_or_url: https://raw.githubusercontent.com/openEHR/CKM-mirror/master/local/archetypes/entry/action/openEHR-EHR-ACTION.screening.v0.adl
  resource: openEHR-EHR-ACTION.screening.v0
  path: ism_transition careflow_step at0002 'Screening planned' bzw. at0003 'Screening scheduled'; /description[at0026]/items[at0028]
    Reason
  notes: openEHR CKM, Revision 0.0.1-alpha, lifecycle in_development, nicht-FHIR; nur nicht-bindendes
    Referenzmuster. Kein Careflow-Schritt für Einladung oder Recall; Annäherung über 'Screening planned'
    mit Reason als Anlass, ein abgelehntes Angebot über at0030 'Screening declined'. Kanal und auffordernde
    Stelle fehlen.
