issues:
- 'Verbindlichkeit nach Gegenprüfung: Pflicht. LuKrFrühErkV § 2 Abs. 1 S. 1 Nr. 3 Buchst. b; KFE-RL §
  39 Nr. 1 („das Vorliegen des medizinischen Eignungsprofils“). Der Inhalt ist nicht legaldefiniert (S3
  Empf. 5.5, EK).'
- 'Umsetzung: eigenständig. Lokale Werteliste: geeignet | nicht geeignet | geeignet mit Hinweis auf erhöhtes
  Risiko von Überdiagnose und Übertherapie (S3 Empf. 5.5/5.6); standard_binding_status no-standard-found.
  762713009 als Elementcode streichen; einen CCI-Wert über standardizedAssessmentScore erfassen. Belege
  per Verweis anbinden (dependsOn comorbidity, ecogPerformanceStatus u. a.); inhaltlich verwandt mit curativeRecurrencePotential.
  Teilmapping SNOMED 713671003 prüfen. Die Fälligkeit der Wiederholung als Attribut führen (eligibilityProfileReviewDueDate).
  Hinweis: S3 zitiert „§ 2 Abs. 1 Satz 3“, richtig ist Satz 1 Nr. 3 Buchst. b.'
- Ein Standardcode für das Element ('medizinische Eignung für Lungenkrebs-Früherkennung bzw. kurativ intendierte
  Behandlung') fehlt ebenso wie Befundkonzepte für 'geeignet für kurativ intendierte Therapie' und 'geeignet
  mit erhöhtem Risiko von Überdiagnose/Übertherapie'; ein Antrag bei SNOMED International bzw. dem deutschen
  NRC ist zu prüfen.
- Kein nationales oder internationales FHIR-Profil bildet das medizinische Eignungsprofil nach LuKrFrühErkV
  § 2 Abs. 1 S. 1 Nr. 3 Buchst. b ab; der Inhalt ist nicht legaldefiniert (S3 Empf. 5.5, EK).
- Die lokalen Codes der Werteliste sind vorläufige Platzhalter und noch fachlich abzustimmen.
- Ob die Fälligkeit der Wiederholungsprüfung (eligibilityProfileReviewDueDate) als Attribut dieses Elements
  geführt wird, ist zu entscheiden.
- openEHR-Instrumente (charlson_comorbidity_index.v2, clinical_frailty_scale.v1) könnten Belege abbilden;
  ihre Pfade sind noch nicht ausgewertet.
- Die S3-Leitlinie zitiert 'LuKrFrühErkV § 2 Abs. 1 Satz 3'; richtig ist Satz 1 Nr. 3 Buchst. b – im Element
  korrekt zitieren.
