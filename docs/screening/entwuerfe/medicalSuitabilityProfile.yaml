id: mihub.lung.screening.medicalSuitabilityProfile.v0.1
uuid: 82747b76-f73c-5851-a027-97f276c9ecb8
name: medicalSuitabilityProfile
label_de: Medizinisches Eignungsprofil
definition_de: Ärztliche Beurteilung der Eignung für kurativ intendierte Behandlung und ausreichender
  Lebenserwartung, inkl. hoher Komorbiditätslast.
phase: screening
category: assessment
datatype: CodeableConcept
cardinality: 1..1
value_set:
  binding_strength: example
  standard_binding_status: pending-mapping
  notes: 'SNOMED CT INT 20260701 (MII TermServ), Stand 2026-10-15. Antwortwerte als lokale Werteliste:
    geeignet | nicht geeignet | geeignet mit Hinweis auf erhöhtes Risiko von Überdiagnose und Übertherapie
    (S3 Empf. 5.5/5.6, EK). Nur Teilmappings existieren: 713671003 Medically fit for surgery (equivalence
    narrower, nur OP-Fähigkeit, nicht für ''geeignet'' insgesamt) und 1303301003 Not suitable for procedure
    due to disease (für ''nicht geeignet'' wegen Erkrankung bzw. Komorbidität). Kein Element-Code: Ein
    Observable für die medizinische Eignung zur Früherkennung bzw. zur kurativ intendierten Behandlung
    gibt es nicht; Observation.code bleibt lokal. 762713009 Charlson Comorbidity Index ist ein Instrument
    und kein Element-Code; ein CCI-Wert wird in standardizedAssessmentScore erfasst. Belege (comorbidity,
    ecogPerformanceStatus, CCI) werden per dependsOn bzw. derivedFrom angebunden, nicht im Element kodiert.
    1303300002 (Alter) gehört als Absagegrund zu eligibilityCheckResult. Rollen der Codes: local-no-standard-binding|suitable
    = wert; local-no-standard-binding|not-suitable = wert; local-no-standard-binding|suitable-with-overdiagnosis-risk
    = wert; snomed-ct|713671003 = wert; snomed-ct|1303301003 = wert.'
  codings:
  - system: local-no-standard-binding
    code: suitable
    display: geeignet
  - system: local-no-standard-binding
    code: not-suitable
    display: nicht geeignet
  - system: local-no-standard-binding
    code: suitable-with-overdiagnosis-risk
    display: geeignet mit Hinweis auf erhöhtes Risiko von Überdiagnose und Übertherapie
  - system: snomed-ct
    code: '713671003'
    display: Medically fit for surgery
  - system: snomed-ct
    code: '1303301003'
    display: Not suitable for procedure due to disease
standard_mappings:
- standard: fhir-r4-base
  profile_or_url: http://hl7.org/fhir/StructureDefinition/Observation
  resource: Observation
  path: Observation.value[x]
  notes: 'hl7.fhir.r4.core#4.0.1 (stabil). Hauptziel mangels Fachprofil: valueCodeableConcept mit der
    lokalen Werteliste, code lokal (762713009 nicht als code). derivedFrom 0..* verweist auf comorbidity,
    ecogPerformanceStatus und einen CCI-Score. Die Fälligkeit der erneuten Prüfung ist kein Observation-Element
    (Task bzw. ServiceRequest, siehe eligibilityProfileReviewDueDate).'
- standard: fhir-r4-base
  profile_or_url: http://hl7.org/fhir/StructureDefinition/ClinicalImpression
  resource: ClinicalImpression
  path: ClinicalImpression.summary; ClinicalImpression.finding.itemCodeableConcept; ClinicalImpression.investigation.item
  notes: 'hl7.fhir.r4.core#4.0.1 (Ressource mit SD-Status draft, geringer Reifegrad). Alternative für
    eine ärztliche Gesamtbeurteilung: investigation.item (0..*) referenziert die Belege, summary (string)
    bzw. finding.itemCodeableConcept (example) das Urteil, effective[x]/date das Prüfdatum. Kein Element
    für die nächste Fälligkeit.'
- standard: mcode
  profile_or_url: http://hl7.org/fhir/us/mcode/StructureDefinition/mcode-comorbidities
  resource: Observation
  path: Observation.extension:comorbidConditionPresent; Observation.value[x]
  notes: 'hl7.fhir.us.mcode#4.0.0 (stabil; US-Muster auf Basis US Core Simple Observation). Nur Teilabbildung
    der Komorbiditätslast, nicht des Eignungsurteils: code per Pattern SNOMED 398192003, Extensions comorbidConditionPresent/-Absent
    0..* MS, value[x] (Quantity|integer) für einen Index wie den CCI.'
- standard: other
  profile_or_url: https://hl7.lt/fhir/lung/Questionnaire/questionnaire-pre-ldct-lt-lung
  resource: Questionnaire
  path: 'group ''grp-functional-status'': items ''self-care'' (Do you serve yourself?), ''bedridden''
    (Bedridden/chairbound)'
  notes: 'HL7 Litauen, Lung-IG 0.0.1 (CI-Build https://build.fhir.org/ig/HL7LT/ig-lt-lung/, kein publiziertes
    Paket). Nur Teilabbildung: Funktionsstatus als Eignungsbeleg vor der LDCT; die ConceptMap des IG bildet
    ihn auf eine Funktionsstatus-Observation ab. Kein Gesamturteil zur Eignung.'
- standard: other
  profile_or_url: https://nrdrsupport.acr.org/support/solutions/articles/11000041247
  resource: ACR LCSR & IPN Data Dictionary
  path: Item 131 'Other comorbidities listed on patient record that limit life expectancy' (Mehrfachauswahl;
    131.1 Freitext)
  notes: ACR LCSR & IPN Data Dictionary 2026-05-28 (nicht-FHIR, Register USA), S. 22, Abschnitt Appropriateness
    of Screening. Erfasst lebenszeitbegrenzende Komorbiditäten als Beleg (COPD, Emphysema, Pulmonary Fibrosis,
    CAD, CHF, PVD, Lung Cancer, Cancer other than lung cancer, Other); kein Gesamturteil 'geeignet'.
