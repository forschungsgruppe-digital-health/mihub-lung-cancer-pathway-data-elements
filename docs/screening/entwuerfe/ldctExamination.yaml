uuid: 4b3b7a32-3528-5a00-887c-3ba13abeec74
name: ldctExamination
label_de: Niedrigdosis-CT des Thorax zur Früherkennung (Durchführung)
definition_de: Durchgeführte LDCT nach § 4 und Anlage mit Zeitpunkt, Art, Einrichtung und Verweis auf
  die DICOM-Studie; Bezug für Fristen und Intervalle.
phase: screening
category: bildgebung
datatype: string
cardinality: 1..*
value_set:
  binding_strength: preferred
  standard_binding_status: mapped
  notes: 'Element-Code (Procedure.code): SNOMED 713548006 Low dose computed tomography of thorax (Spezialisierung
    von 169069000 CT of chest, dem Element-Code von ctThoraxScan), präziser 16334891000119106 ohne Kontrastmittel
    (Anlage zu § 4 LuKrFrühErkV sieht kein KM vor); beide liegen unter 363679005 Imaging und 71388002
    Procedure. LOINC 79086-5 als Auftrags- bzw. Studiencode (ServiceRequest.code, ImagingStudy.procedureCode).
    OPS 3-202 nur als Mapping: es gibt keinen LDCT-spezifischen OPS-Kode, die Früherkennung wird vertragsärztlich
    über EBM abgerechnet. Methode/Kontext: SNOMED 275981009 Screening for malignant neoplasm of lung (z.
    B. ServiceRequest oder EpisodeOfCare), nicht Code der Durchführung. Dokumentklasse KDL DG020103 CT-Befund
    nur für den zugehörigen Befundbericht. EBM 01871 (Niedrigdosis-CT zur Früherkennung, Erst- und Regel-LDCT)
    und 01872 (Kontroll-LDCT) nur als Abrechnungsbezug. Binding preferred, weil je nach System (Procedure
    oder ImagingStudy) unterschiedliche Codes geführt werden. Editionen: MII TermServ, SNOMED CT 20260701,
    LOINC 2.83, OPS 2026, KDL 2025; Stand 2026-10-15. Rollen der Codes: snomed-ct|713548006 = element;
    snomed-ct|16334891000119106 = element; loinc|79086-5 = element; ops|3-202 = element; snomed-ct|275981009
    = methode; kdl|DG020103 = dokumentklasse.'
  codings:
