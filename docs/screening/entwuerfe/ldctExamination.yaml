    display: Native Computertomographie des Thorax
  - system: snomed-ct
    code: '275981009'
    display: Screening for malignant neoplasm of lung
  - system: kdl
    code: DG020103
    display: CT-Befund
standard_mappings:
- standard: fhir-mii-kds
  profile_or_url: https://www.medizininformatik-initiative.de/fhir/ext/modul-bildgebung/StructureDefinition/mii-pr-bildgebung-bildgebungsprozedur
  resource: Procedure
  path: Procedure.performed[x]
  notes: 'de.medizininformatikinitiative.kerndatensatz.bildgebung#2026.0.0, stabil. Hauptziel: eine Procedure
    je LDCT (Erst-, Regel- oder Kontroll-LDCT), Durchführungszeitpunkt in performed[x] 1..1 MS. code.coding:sct
    required an mii-vs-bildgebung-imaging-procedure-code-sct (< 363679005; 713548006 enthalten), code.coding:ops
    für 3-202, code.coding:loinc required an das LOINC/RSNA-Radiology-Playbook-ValueSet (Zugehörigkeit
    von 79086-5 offen). basedOn 1..* MS auf mii-pr-bildgebung-anforderung-bildgebung: die Screening-Anforderung
    muss als ServiceRequest vorliegen. Extension durchfuehrungsabsicht (required, procedures-intend) mit
    SNOMED 129428001 Preventive intent. Die Untersuchungsart ist im Profil nicht vorgesehen (siehe screeningExaminationType).'
- standard: fhir-mii-kds
  profile_or_url: https://www.medizininformatik-initiative.de/fhir/ext/modul-bildgebung/StructureDefinition/mii-pr-bildgebung-bildgebungsprozedur
  resource: Procedure
  path: Procedure.performed[x]
  notes: de.medizininformatikinitiative.kerndatensatz.bildgebung#2027.0.0-ballot.1, Ballot. Für dieses
    Element im Wesentlichen wie 2026.0.0; die Slices performedDateTime und performedPeriod sind MS, basedOn
    1..* MS. Bei Wechsel auf das Release 2027 nur die Paketversion nachziehen.
- standard: fhir-mii-kds
  profile_or_url: https://www.medizininformatik-initiative.de/fhir/ext/modul-bildgebung/StructureDefinition/mii-pr-bildgebung-bildgebungsstudie
  resource: ImagingStudy
  path: ImagingStudy.started
  notes: 'de.medizininformatikinitiative.kerndatensatz.bildgebung#2026.0.0, stabil. DICOM-Studienverweis
    der LDCT: started 0..1 MS, procedureReference 0..1 MS auf die Bildgebungsprozedur, series.modality
    1..1 MS (required, DICOM CID 33, CT); CT-Technik je Serie über series.extension:modalitaetCT (siehe
    ctdiVol, ldctAcquisitionParameters). Wie beim Bestandselement ctThoraxScan.'
- standard: fhir-isik
  profile_or_url: https://gematik.de/fhir/isik/StructureDefinition/ISiKProzedur
  resource: Procedure
  path: Procedure.performed[x]
  notes: 'de.gematik.isik#6.0.0, stabil. Nachrangig, nur wenn ein Krankenhaus die LDCT durchführt und
