issues:
- 'Verbindlichkeit nach Gegenprüfung: Pflicht. Dokumentation der Durchführung (KFE-RL § 44 S. 1); Aufzeichnung
  von Zeitpunkt und Art der Anwendung (StrlSchG § 85 Abs. 1 S. 2 Nr. 2); Anforderungen nach LuKrFrühErkV
  § 4 Abs. 1 mit Anlage.'
- 'Umsetzung: Spezialisierung von ctThoraxScan (followup). specializes mihub.lung.followup.ctThoraxScan.v0.1.
  Datentyp Reference (Procedure/ImagingStudy) oder Definition auf den Durchführungszeitpunkt beschränken;
  Kardinalität 0..* (eine je Runde). EBM-GOP nicht als Konzeptcode (01871 Regel-LDCT, 01872 Kontroll-LDCT
  nur als Abrechnungsbezug). Mapping MII KDS Bildgebung 2026.0.0: …/fhir/ext/modul-bildgebung/StructureDefinition/mii-pr-bildgebung-bildgebungsprozedur
  bzw. -bildgebungsstudie (ImagingStudy.started). „Art“ als Anwendungsart nach § 85 StrlSchG präzisieren;
  die Untersuchungsart gehört zu screeningExaminationType. Einrichtung und DICOM-Studienverweis sind nicht
  gesetzlich gefordert. Für die 12-Monats-Prüfung zählt jede befundungsgeeignete Lungen-CT (lastQualifyingChestCtDate).'
- Der Datentyp ist auf Reference(Procedure/ImagingStudy) umzustellen oder die Definition auf den Durchführungszeitpunkt
  zu beschränken; Kardinalität 0..* (eine LDCT je Runde) statt 1..1.
- Ob LOINC 79086-5 im LOINC/RSNA-Radiology-Playbook-ValueSet des MII-Profils liegt, ist offen; das ValueSet
  steht auf dem MII TermServ nicht zur Verfügung.
- Die „Art der Anwendung“ nach § 85 StrlSchG ist zu präzisieren und von der Untersuchungsart (screeningExaminationType)
  abzugrenzen; ein Standardcode dafür fehlt.
- Es gibt keinen OPS-Kode für die Niedrigdosis-CT zur Früherkennung (OPS 2026 kennt „Niedrigdosis“ nur
  bei PET/CT bzw. SPECT/CT).
- Kein Profil bildet Screening-Runde, Konformität mit § 4 und Anlage LuKrFrühErkV oder die 12-Monats-Regel
  (lastQualifyingChestCtDate) ab.
- Das MII-Profil verlangt basedOn auf eine Bildgebungsanforderung; die Screening-Anforderung ist als ServiceRequest
  zu modellieren.
- Kardinalität laut Quelle 0..* (1 je Runde).
