id: mihub.lung.screening.resultTransmissionConsentReferrer.v0.1
uuid: 7379c26e-d418-55cd-8439-91c99a8a3a64
name: resultTransmissionConsentReferrer
label_de: Einwilligung in die Befundübermittlung an die berichterstellende Praxis
definition_de: Einwilligung, dass der Befundbericht auch an die berichterstellende Praxis geht; ohne Einwilligung
  erhält ihn nur die versicherte Person.
phase: screening
category: administrativ
datatype: string
cardinality: 1..1
value_set:
  binding_strength: example
  standard_binding_status: mapped
  notes: 'Elementcode bei Modellierung als Observation: SNOMED CT 413909005 Consent status for record
    sharing. Antwortwerte: ''erteilt'' = 425691002 Consent given for electronic record sharing, ''verweigert''
    = 414859005 No consent for electronic record sharing (beide nur Annäherungen, weil ''record sharing''
    die Übermittlung des Befundberichts an die Praxis nur ungefähr trifft), ''widerrufen'' = lokaler Code
    (im FHIR Consent alternativ status inactive). Dokumentklassen: LOINC 64292-6 (auch Consent.category)
    und KDL AM050107 für die schriftliche Einwilligung. Binding example wegen der Annäherungen. Bevorzugte
    Abbildung ist ein FHIR Consent mit Empfänger-Qualifier (berichterstellende Praxis | Zweitbefunder
    | Einrichtung mit Voraufnahmen) und Datum; ein Boolean reicht wegen ''widerrufen'' und des Empfängers
    nicht aus. MII TermServ, SNOMED CT International 20260701, LOINC 2.83, KDL 2025, Stand 2026-10-15.
    Rollen der Codes: snomed-ct|413909005 = element; snomed-ct|425691002 = wert; snomed-ct|414859005 =
    wert; local-no-standard-binding|widerrufen = wert; loinc|64292-6 = dokumentklasse; kdl|AM050107 =
    dokumentklasse.'
  codings:
  - system: snomed-ct
    code: '413909005'
    display: Consent status for record sharing
  - system: snomed-ct
    code: '425691002'
    display: Consent given for electronic record sharing
  - system: snomed-ct
    code: '414859005'
    display: No consent for electronic record sharing
  - system: local-no-standard-binding
    code: widerrufen
    display: Einwilligung widerrufen
  - system: loinc
    code: 64292-6
    display: Release of Information Consent Document
  - system: kdl
    code: AM050107
    display: Schweigepflichtentbindung
standard_mappings:
- standard: fhir-mii-kds
  profile_or_url: https://www.medizininformatik-initiative.de/fhir/ext/modul-dokument/StructureDefinition/mii-pr-dokument-dokument
  resource: DocumentReference
  path: DocumentReference.type.coding:KDL (AM050107); DocumentReference.type.coding:LNC (64292-6); DocumentReference.type.coding:XDS
    (EINW); DocumentReference.category.coding:XDS (ADM); DocumentReference.content.attachment
  notes: de.medizininformatikinitiative.kerndatensatz.dokument#2026.0.1, stabil; für die schriftliche
    Einwilligung bzw. Schweigepflichtentbindung als Dokument. 64292-6 steht in c80-doc-typecodes (REQUIRED
    für type.coding:LNC). KDL AM050107 wird laut DVMD-ConceptMap auf EINW abgebildet; die IHE-D-Definition
    von EINW nennt ausdrücklich die 'Einwilligung zur Datenweitergabe'.
- standard: ihe-xds
  profile_or_url: http://ihe-d.de/ValueSets/IHEXDStypeCode
  resource: XDS DocumentEntry (Einwilligungsdokument)
  path: DocumentEntry.classCode = ADM; DocumentEntry.typeCode = EINW; DocumentEntry.eventCodeList = KDL
    AM050107
  notes: de.ihe-d.terminology#3.0.1, nicht-FHIR (XDS-Metadaten); konsistent mit der DVMD-ConceptMap. Gilt
    ebenso für ePA MHD (de.gematik.epa.mhd#1.1.3; epa-xds-class-code-vs/epa-xds-type-code-vs enthalten
    die IHE-D-Codes unter urn:oid:1.3.6.1.4.1.19376.3.276.1.5.8 bzw. .5.9) und ISiKDokumentenMetadaten.
- standard: fhir-r4-base
  profile_or_url: http://hl7.org/fhir/StructureDefinition/Consent
  resource: Consent
  path: Consent.scope (http://terminology.hl7.org/CodeSystem/consentscope#patient-privacy); Consent.category
    (LOINC 64292-6; optional http://terminology.hl7.org/CodeSystem/v3-ActCode#IDSCL); Consent.status;
    Consent.provision.type; Consent.provision.actor.role / actor.reference; Consent.provision.action (http://terminology.hl7.org/CodeSystem/consentaction#disclose);
    Consent.dateTime
  notes: 'hl7.fhir.r4.core#4.0.1, stabil. category ist EXTENSIBLE an consent-category gebunden; das ValueSet
    enthält LOINC 64292-6 und über v3-ActConsentType auch v3-ActCode IDSCL ''information disclosure''
    als zusätzliche Kategorie. provision.action disclose ist example-gebunden und nur in der Basis zulässig
    (nicht in IHE PCF). Werte: erteilt = provision.type permit bzw. status active, verweigert = deny bzw.
    status rejected, widerrufen = status inactive. provision.actor trägt den Empfänger (berichterstellende
    Praxis | Zweitbefunder | Einrichtung mit Voraufnahmen).'
- standard: other
  profile_or_url: https://profiles.ihe.net/ITI/PCF/StructureDefinition/IHE.PCF.consentIntermediate
  resource: Consent
  path: Consent.scope (Pattern patient-privacy); Consent.category (z. B. LOINC 64292-6); Consent.patient;
    Consent.performer; Consent.organization; Consent.dateTime; Consent.source[x]; Consent.policy bzw.
    Consent.policyRule; Consent.provision.type (permit | deny); Consent.provision.actor.role (Pattern
    http://terminology.hl7.org/CodeSystem/v3-ParticipationType#IRCP); Consent.provision.actor.reference;
    Consent.provision.data:rData (→ Befundbericht)
  notes: 'ihe.iti.pcf#1.1.0 (IHE ITI Privacy Consent on FHIR, Trial Implementation), internationales Profil
    ohne deutsche Festlegung. Passt zum Empfänger-Qualifier: je Empfänger ein actor mit Rolle IRCP ''information
    recipient'', provision.type permit/deny für erteilt/verweigert, Widerruf über status inactive bzw.
    neue Version; provision.data (meaning related bzw. instance) begrenzt die Freigabe auf den Befundbericht.
    Pflicht: patient, performer, organization, dateTime, source[x], provision mit type sowie actor.reference.
    policy.uri ist nur innerhalb von policy 1..1; ppc-1 verlangt policy oder policyRule. provision.action
    ist in PCF verboten (0..0).'
- standard: openehr-archetype
  profile_or_url: https://ckm.openehr.org/ckm/archetypes/1013.1.1303
  resource: openEHR-EHR-ACTION.informed_consent.v0
  path: Careflow-Schritte provided / refused / withdrawn; 'Consent description'
  notes: openEHR CKM 1013.1.1303, Revision 0.0.1-alpha, in_development (Draft), nicht-FHIR; breites, nicht
    publiziertes Mapping. Der Zweck umfasst laut ADL auch Einwilligungen zu einer 'Aktivität im Zusammenhang
    mit dem Gesundheitswesen'; einen Empfänger-Qualifier gibt es nicht.
