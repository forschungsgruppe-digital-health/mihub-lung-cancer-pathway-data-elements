issues:
- 'Verbindlichkeit nach Gegenprüfung: bedingt. Übermittlung des strukturierten Befundberichts an die berichterstellende
  Ärzt:in nur bei Einwilligung (KFE-RL § 42 Abs. 2 S. 2); ohne Einwilligung nur an die Person (S. 1).'
- 'Umsetzung: eigenständig; Ausbau zum gemeinsamen Einwilligungselement (nimmt providerDataExchangeConsent
  auf). Zum gemeinsamen Einwilligungselement für Datenweitergaben ausbauen, mit Empfänger-Qualifier: berichterstellende
  Praxis | Zweitbefunder | Einrichtung mit Voraufnahmen. Werte erteilt | verweigert | widerrufen (lokal)
  plus Datum, oder Reference auf FHIR Consent (category LOINC 64292-6, provision.actor = Empfänger); Dokument
  KDL AM050107. Die Pflicht ist bedingt: An die Praxis wird nur bei „erteilt“ übermittelt. Im BPMN ist
  die Rückmeldung an die Praxis (Event_13jgib0) unbedingt modelliert.'
- Es fehlt ein spezifisches Konzept 'Einwilligung in die Übermittlung des Screening-Befunds an die berichterstellende
  Ärzt:in'; die SNOMED-Werte zu 'record sharing' sind nur Annäherungen.
- Die Empfängertypen (berichterstellende Praxis nach KFE-RL § 43, Zweitbefunder, Einrichtung mit Voraufnahmen)
  und die Zwecke nach KFE-RL § 42 Abs. 2 sind nicht standardkodiert; v3-ParticipationType IRCP kennzeichnet
  nur die Rolle 'Empfänger', die Typen bleiben lokal.
- Der Datentyp boolean des Kandidaten reicht nicht aus; zu entscheiden ist zwischen CodeableConcept plus
  Datum und einer Reference auf FHIR Consent sowie über die Zusammenführung mit providerDataExchangeConsent
  zu einem gemeinsamen Einwilligungselement.
- Kein deutsches Profil (MII KDS, ISiK, KBV, ePA) bildet eine Einwilligung in die Datenübermittlung an
  eine bestimmte behandelnde Ärzt:in ab; MII KDS Consent ist auf Forschung (Broad Consent) festgelegt.
  Den Bezug auf genau den strukturierten Befundbericht kann nur IHE PCF über provision.data herstellen.
- Im BPMN ist die Rückmeldung an die Praxis (Event_13jgib0) unbedingt modelliert, obwohl sie nur bei erteilter
  Einwilligung erfolgen darf.
