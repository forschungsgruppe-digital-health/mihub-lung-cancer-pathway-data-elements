issues:
- 'Verbindlichkeit nach Gegenprüfung: Leitlinie. Lung-RADS v2022 Note 15 (S-Modifikator „may“); DRG/DGP/DGT-Supplement
  Tab. S1 Anm. 15 (klinisch relevant = abklärungsbedürftig) i. V. m. S3 Empf. 5.9. LuKrFrühErkV und KFE-RL
  regeln Nebenbefunde nicht.'
- 'Umsetzung: eigenständig (Befundgruppe). Auf S-relevante Nebenbefunde begrenzen, die eine weitere Abklärung
  erfordern; Koronarkalk und Emphysem sind eigene Routinefelder (specializes incidentalFinding). Als Befundgruppe:
  Befundcode (Binding < 404684003 |Clinical finding|, extensible; ILA nur als Beispielwert), Ausprägung,
  Status neu/vorbekannt (Lung-RADS Note 15b; fehlt in der deutschen V-Lung-RADS-Fassung), Empfehlung;
  optional Qualifier 261087003 |Incidental|. Die Notiz „Mitteilung nur nach Einwilligung und Vereinbarung“
  streichen oder belegen: einschlägig ist nur KFE-RL § 42 Abs. 2 S. 2 (Übermittlung des gesamten Befundberichts
  an die Praxis). Bestätigte Diagnosen bleiben in comorbidity. Bezug zu lungRadsCategory (S) und clarificationReferral.
  Beispielbefunde und Schwellen mit O’Dowd et al. 2023, Tab. 2 belegen.'
- Für den Status neu/vorbekannt (Lung-RADS Note 15b; in der deutschen V-Lung-RADS-Fassung nicht enthalten)
  gibt es weder einen Standardcode noch ein Profilelement.
- 1381861002 (ILA) setzt SNOMED CT INT ab 2025-12-01 voraus und ist im MII-Bildgebungsrelease 2026.0.0
  (SCT 20250701) nicht bindungskonform; bis zum Release 2027 ist ein Elternkonzept oder ein lokaler Code
  nötig.
- SNOMED CT und LOINC haben kein Observable 'incidental imaging finding'; der Element-Code stützt sich
  auf RadLex.
- Der Umfang ist auf S-relevante, abklärungsbedürftige Nebenbefunde zu begrenzen; Beispielbefunde und
  Schwellen sind mit O'Dowd et al. 2023 (Tab. 2) zu belegen.
- Die Notiz 'Mitteilung nur nach Einwilligung und Vereinbarung' ist zu streichen oder zu belegen; einschlägig
  ist nur KFE-RL § 42 Abs. 2 S. 2 (Übermittlung des gesamten Befundberichts an die Praxis).
- Kein Profil unterscheidet Neben- und Hauptbefund.
