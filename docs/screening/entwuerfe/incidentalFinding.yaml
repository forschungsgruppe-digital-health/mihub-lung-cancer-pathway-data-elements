id: mihub.lung.screening.incidentalFinding.v0.1
uuid: 2cb04ba7-3cf5-545b-ba8e-5622072e975a
name: incidentalFinding
label_de: Klinisch relevanter Nebenbefund mit Empfehlung
definition_de: Relevanter Nebenbefund ohne Lungenkrebsbezug (z. B. ILA, Aortenaneurysma, Schilddrüse)
  mit Ausprägung, neu/vorbekannt und Empfehlung.
phase: screening
category: befund
datatype: CodeableConcept
cardinality: 0..*
value_set:
  binding_strength: extensible
  standard_binding_status: mapped
  notes: 'Element-Code ist RadLex RID50142 |incidental imaging finding| (''finding that requires non-routine
    communication with the referring clinician'', entspricht ''klinisch relevant = abklärungsbedürftig'');
    SNOMED CT und LOINC haben kein entsprechendes Observable. Antwortwerte: Befundcode extensible an den
    ValueSet-Ausdruck < 404684003 |Clinical finding|; Beispielwerte 1381861002 |Interstitial lung abnormality|
    (setzt SNOMED CT INT ab 2025-12-01 voraus), 433068007 |Aneurysm of thoracic aorta|, 237495005 |Thyroid
    nodule|. 261087003 |Incidental| ist ein optionaler Qualifier (nicht Observation.code). RadLex RID50143
    ist der Element-Code des Teilattributs Empfehlung. Koronarkalk und Emphysem sind eigene Routinefelder;
    bestätigte Diagnosen bleiben in comorbidity. Editionen: SNOMED CT INT 20260701, RadLex 4.2 (MII TermServ);
    Stand 2026-10-15. Rollen der Codes: radlex|RID50142 = element; snomed-ct|1381861002 = wert; snomed-ct|433068007
    = wert; snomed-ct|237495005 = wert; snomed-ct|261087003 = methode; radlex|RID50143 = element.'
  codings:
  - system: radlex
    code: RID50142
    display: incidental imaging finding
  - system: snomed-ct
    code: '1381861002'
    display: Interstitial lung abnormality
  - system: snomed-ct
    code: '433068007'
    display: Aneurysm of thoracic aorta
  - system: snomed-ct
    code: '237495005'
    display: Thyroid nodule
  - system: snomed-ct
    code: '261087003'
    display: Incidental
  - system: radlex
    code: RID50143
    display: recommendation for incidental finding
standard_mappings:
- standard: fhir-mii-kds
  profile_or_url: https://www.medizininformatik-initiative.de/fhir/ext/modul-bildgebung/StructureDefinition/mii-pr-bildgebung-radiologische-beobachtung
  resource: Observation
  path: Observation.code.coding:sct; Observation.value[x]; Observation.bodySite; Observation.interpretation;
    Observation.note
  notes: 'de.medizininformatikinitiative.kerndatensatz.bildgebung#2026.0.0, stabil. Der Befundcode steht
    im sct-Slice von code, der REQUIRED (nicht extensible) an < 404684003 |Clinical finding| in SNOMED
    CT 20250701 gebunden ist. 1381861002 (ILA) ist in SNOMED CT INT 20250701 nicht enthalten und daher
    im Release 2026.0.0 nicht konform; dort bleibt nur ein Elternkonzept (z. B. 301230006) oder ein lokaler
    Code. Erst der Ballot 2027 (SCT 20260701) enthält ILA. value[x] 1..1: Ausprägung bzw. Status neu/vorbekannt
    (lokale Codes); 261087003 nur über component bzw. interpretation (0..*, extensible). bodySite REQUIRED
    < 123037004.'
- standard: fhir-mii-kds
  profile_or_url: https://www.medizininformatik-initiative.de/fhir/ext/modul-bildgebung/StructureDefinition/mii-pr-bildgebung-behandlungsempfehlung
  resource: CarePlan
  path: CarePlan.description; CarePlan.supportingInfo; CarePlan.activity; CarePlan.addresses
  notes: 'de.medizininformatikinitiative.kerndatensatz.bildgebung#2026.0.0, stabil. Empfehlung zum Nebenbefund:
    description 0..1 MS als Text; supportingInfo 0..* MS zeigt nur auf mii-pr-bildgebung-radiologischer-befund,
    nicht auf die einzelne Nebenbefund-Observation – den Bezug zum Einzelbefund über addresses (Condition)
    bzw. lokal herstellen. Strukturierte Maßnahme ggf. in activity (nicht MS). Bezug zu clarificationReferral.'
- standard: fhir-mii-kds
  profile_or_url: https://www.medizininformatik-initiative.de/fhir/core/modul-diagnose/StructureDefinition/Diagnose
  resource: Condition
  path: Condition.code.coding:sct; Condition.verificationStatus; Condition.bodySite
  notes: de.medizininformatikinitiative.kerndatensatz.base#2026.0.1, stabil. Nur wenn der Nebenbefund
    in die Problemliste übernommen wird. code.coding:sct 0..1 MS REQUIRED diagnoses-sct (is-a 404684003,
    272379006, 243796009; SCT 20250701); verificationStatus 0..1 MS REQUIRED (z. B. provisional).
- standard: fhir-isik
  profile_or_url: https://gematik.de/fhir/isik/StructureDefinition/ISiKDiagnose
  resource: Condition
  path: Condition.code.coding:SNOMED-CT; Condition.bodySite
  notes: de.gematik.isik#6.0.0, stabil. Nur für die krankenhausseitige Übernahme als Diagnose; Slice SNOMED-CT
    REQUIRED an https://gematik.de/fhir/isik/ValueSet/DiagnosesSCT (is-a 404684003, 272379006, 243796009);
    bodySite MS.
- standard: other
  profile_or_url: http://hl7.eu/fhir/imaging/StructureDefinition/DiagnosticReportEuImaging
  resource: DiagnosticReport
  path: DiagnosticReport.extension:finding (HL7IDRFinding → ObservationFindingEuImaging); DiagnosticReport.extension:recommendation
    (HL7IDRRecommendation → CarePlan/ServiceRequest)
  notes: hl7.fhir.eu.imaging#1.0.0-ballot, Ballot/draft (EHDS-Zielbild). Befund und Empfehlung als getrennte,
    verknüpfte Bestandteile des Bildbefunds (beide MS); extension:composition 1..1 ist Pflicht.
- standard: other
  profile_or_url: http://ncicb.nci.nih.gov/xml/owl/EVS/Thesaurus.owl#C187663
  resource: NCIt-Konzept 'Incidental Finding'
  path: C187663
  notes: NCIt 25.6.0-e (MII TermServ). Nur Mapping für den Element-Code ('An abnormality noted on diagnostic
    testing that was not related to the reason that prompted the analysis').
- standard: other
  profile_or_url: https://api3.rsna.org/radelement/v1/elements/RDE1704
  resource: RSNA/ACR RadElement RDE1704 'Significant finding' (Set RDES267)
  path: RDE1704
  notes: RSNA RadElement API (Stand 2026-10-15), Published (2024-05-31), nicht-FHIR. Werte absent/present/indeterminate/unknown;
    bildet nur den S-Modifikator (Flag) ab, nicht den einzelnen Nebenbefund – Teilbezug, Hauptmapping
    bei lungRadsCategory.
- standard: openehr-archetype
  profile_or_url: openEHR-EHR-CLUSTER.imaging_exam.v1
  resource: CLUSTER (in OBSERVATION.imaging_exam_result.v1)
  path: at0001 Body structure; at0004 Imaging findings; at0006 Impression; imaging_exam_result at0059
    Recommendation
  notes: openEHR CKM-Mirror (Commit e72871205f, 2026-10-15), published, nicht-FHIR. Je Körperstruktur
    ein Befund-Cluster; Empfehlung auf Ebene des Untersuchungsergebnisses.
