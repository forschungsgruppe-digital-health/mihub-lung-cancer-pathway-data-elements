id: mihub.lung.screening.screeningExaminationType.v0.1
uuid: 899d4ba3-224d-5a52-a9d7-b2152d73f1ee
name: screeningExaminationType
label_de: Art der Früherkennungsuntersuchung und Runde
definition_de: 'Einordnung der LDCT: Erstuntersuchung, reguläre Folgeuntersuchung, vorgezogene Kontrolle
  oder Kurzintervall (Lung-RADS 0), mit Rundennummer.'
phase: screening
category: versorgungskontext
datatype: CodeableConcept
cardinality: 1..*
value_set:
  binding_strength: example
  standard_binding_status: no-standard-found
  notes: 'Antwortwerte (lokal, local-no-standard-binding): Erst-LDCT, Regel-LDCT (frühestens 12 Monate
    nach der Voruntersuchung) und Kontroll-LDCT nach kontrollbedürftigem Befund (§ 2 Abs. 2 LuKrFrühErkV);
    Unterscheidung Erst-/Folgeuntersuchung nach § 4 Abs. 2 LuKrFrühErkV und KFE-RL § 38. Kein eigener
    Element-Code; das Element ist ein Attribut von ldctExamination. SNOMED CT 20260701, LOINC 2.83 und
    RadLex 4.2 enthalten kein Konzept für Screening-Rundentypen; RadLex RID49571 baseline, RID50144 12-month
    follow-up procedure und RID35965 follow-up procedure sowie RadElement RDE1703 Baseline study sind
    nur Näherungs-Mappings (RID35965 trennt Regel- und Kontroll-LDCT nicht; RID50144 meint ein festes
    12-Monats-Intervall). EBM 01871/01872 unterscheiden nur Kontroll- von Nicht-Kontroll-LDCT. „Kurzintervall
    (Lung-RADS 0)“ ist bewusst kein Wert. Die Rundennummer wird aus screeningEpisode abgeleitet, nicht
    kodiert. Binding example, solange die lokalen Codes Platzhalter sind. MII TermServ, Stand 2026-10-15.
    Rollen der Codes: local-no-standard-binding|erst-ldct = wert; local-no-standard-binding|regel-ldct
    = wert; local-no-standard-binding|kontroll-ldct = wert.'
  codings:
  - system: local-no-standard-binding
    code: erst-ldct
    display: Erst-LDCT (Baseline)
  - system: local-no-standard-binding
    code: regel-ldct
    display: Regel-LDCT (Folgeuntersuchung frühestens 12 Monate nach der Voruntersuchung)
  - system: local-no-standard-binding
    code: kontroll-ldct
    display: Kontroll-LDCT nach kontrollbedürftigem Befund (§ 2 Abs. 2 LuKrFrühErkV)
standard_mappings:
- standard: fhir-mii-kds
  profile_or_url: https://www.medizininformatik-initiative.de/fhir/ext/modul-bildgebung/StructureDefinition/mii-pr-bildgebung-bildgebungsprozedur
  resource: Procedure
  path: Procedure.extension:durchfuehrungsabsicht
  notes: de.medizininformatikinitiative.kerndatensatz.bildgebung#2026.0.0, stabil; Extension https://www.medizininformatik-initiative.de/fhir/core/modul-prozedur/StructureDefinition/Durchfuehrungsabsicht
    aus de.medizininformatikinitiative.kerndatensatz.base#2026.0.1. value Coding required an procedures-intend
    (9 SNOMED-Codes, u. a. 129428001 Preventive intent). Deckt nur „präventiv“ ab, nicht Erst-, Regel-
    oder Kontroll-LDCT, und ist wegen des required-Bindings nicht erweiterbar. Für die Untersuchungsart
    ist eine eigene Extension oder ein zusätzliches Coding auf der Procedure nötig.
- standard: other
  profile_or_url: http://fhir.de/StructureDefinition/chargeitem-de-ebm
  resource: ChargeItem
  path: ChargeItem.code.coding:ebm
  notes: 'de.basisprofil.r4#1.6.0, stabil. Indirekte Ableitung über die Abrechnung: GOP 01871 „Niedrigdosis-CT
    zur Früherkennung von Lungenkrebs“ (Erst- oder Regel-LDCT), GOP 01872 Kontroll-LDCT, nur abrechenbar
    mit Angabe eines Kontrollintervalls unter 12 Monaten in Monaten. Unterscheidet nur Kontroll- von Nicht-Kontroll-LDCT;
    Erst-LDCT ist nicht erkennbar. Das Kontrollintervall hat im Profil kein eigenes Element. Nur Mapping,
    kein Wertcode.'
- standard: other
  profile_or_url: http://radlex.org
  path: RID49571 baseline (≈ Erst-LDCT); RID50144 12-month follow-up procedure (≈ Regel-LDCT); RID35965
    follow-up procedure (Folgeuntersuchung allgemein)
  notes: 'RadLex 4.2 (auf dem MII TermServ), Terminologie, nicht-FHIR. Nur Näherungs-Mappings: RID49571
    ist ein Status-Deskriptor (Parent RID5683), kein Untersuchungstyp; RID50144 meint ein festes 12-Monats-Follow-up
    und deckt sich nicht mit „frühestens nach 12 Monaten“; RID35965 ist Parent von RID50144 und trennt
    Regel- und Kontroll-LDCT nicht. Die Unterscheidung tragen die lokalen Codes.'
- standard: other
  profile_or_url: https://api3.rsna.org/radelement/v1/elements/RDE1703
  path: RDES267 Lung-RADS categorization / RDE1703 Baseline study
  notes: RSNA RadElement RDE1703, element_version 1 (2024-05-31), Status Published, nicht-FHIR. Werte
    RDE1703.0 yes, RDE1703.1 no, RDE1703.2 unknown. Bildet nur das Baseline-Flag (Erst-LDCT ja/nein) ab;
    Regel- und Kontroll-LDCT nicht unterscheidbar. Nicht auf dem MII TermServ.
