issues:
- 'Verbindlichkeit nach Gegenprüfung: keine. Keine Dokumentationspflicht. Abrechnung: EBM 01872 setzt
  die Angabe des Kontrollintervalls in Monaten voraus; Rechtsgrundlage der Kontroll-LDCT ist LuKrFrühErkV
  § 2 Abs. 2, die Unterscheidung Erst-/Folgeuntersuchung stützt § 4 Abs. 2.'
- 'Umsetzung: Attribut von ldctExamination (Zusammenlegung prüfen). Als Attribut „Untersuchungsart“ von
  ldctExamination führen: Erst-LDCT (Baseline) | Regel-LDCT (≥ 12 Monate) | Kontroll-LDCT (§ 2 Abs. 2
  LuKrFrühErkV). „Kurzintervall (Lung-RADS 0)“ streichen bzw. rechtlich klären (zulässig nur über § 2
  Abs. 2 oder bei nicht befundungsgeeigneter Voraufnahme; E12). Rundennummer aus screeningEpisode ableiten
  statt erfassen. Mappings: RadElement RDE1703 (Baseline ja/nein) und EBM 01871/01872. Quellen ergänzen:
  LuKrFrühErkV § 4 Abs. 2, KFE-RL § 38 Abs. 1 S. 2, EBM 01871/01872, S3 Empf. 5.9 (Lung-RADS 0).'
- Für die Untersuchungsart (Erst-, Regel-, Kontroll-LDCT) gibt es weder Standardcode noch Profil; ein
  lokales CodeSystem ist verbindlich festzulegen und als Extension oder zusätzliches Coding an der Bildgebungsprozedur
  zu modellieren.
- Ob ein „Kurzintervall (Lung-RADS 0)“ zulässig ist (nur über § 2 Abs. 2 LuKrFrühErkV oder bei nicht befundungsgeeigneter
  Voraufnahme), ist rechtlich zu klären.
- Die Rundennummer soll aus screeningEpisode abgeleitet statt erfasst werden.
- Die Zusammenlegung mit ldctExamination (als Attribut „Untersuchungsart“) ist zu entscheiden.
- Das Kontrollintervall in Monaten, Voraussetzung für EBM 01872, hat kein eigenes Element.
- 'Quellen sind zu ergänzen: LuKrFrühErkV § 4 Abs. 2, KFE-RL § 38 Abs. 1 S. 2, EBM 01871/01872, S3 Empf.
  5.9.'
- Kardinalität laut Quelle 1 je LDCT.
