issues:
- 'Verbindlichkeit nach Gegenprüfung: Pflicht. Dokumentation von Erst- und Zweitbefund: QS-Vereinbarung
  § 13f, KFE-RL § 44 S. 1. Kategorien legaldefiniert in LuKrFrühErkV § 1 Abs. 4/5; der Erstbefund steuert
  die Zweitbefundung (§ 5 Abs. 2).'
- 'Umsetzung: eigenständig (lokales CodeSystem gemeinsam mit screeningResultCategory). Ein lokales CodeSystem
  gemeinsam mit screeningResultCategory nutzen; Begriffe an LuKrFrühErkV § 1 Abs. 4/5 binden; „unauffällig“
  ist dort nicht definiert und als „weder kontroll- noch abklärungsbedürftig“ zu definieren; standard_binding_status
  no-standard-found. Rolle (Erst- oder Zweitbefunder) als performer bzw. Qualifier; dependsOn screeningReadingEvent.
  Die abschließende Kategorie nur in screeningResultCategory führen. Optional die Ableitungsregel aus
  lungRadsCategory nach S3 Empf. 5.9 dokumentieren. Quellen ergänzen: KFE-RL § 44 S. 1; LuKrFrühErkV §
  1 Abs. 4/5 und § 5 Abs. 1–2.'
- Für 'kontrollbedürftiger' bzw. 'abklärungsbedürftiger Befund der Lungenkrebsfrüherkennung' gibt es weder
  einen SNOMED-CT- noch einen LOINC- oder KBV-/G-BA-Code; ein Konzeptantrag (z. B. SNOMED-CT-DE-Extension)
  bzw. ein publiziertes KBV-/G-BA-CodeSystem ist zu erwägen.
- Die Definition von 'unauffällig' (Negativdefinition) ist fachlich festzulegen, da die LuKrFrühErkV sie
  nicht enthält.
- Zu entscheiden ist, ob 282290005 |Imaging interpretation| als generischer Element-Code ausreicht oder
  ob das Element mit lungRadsCategory (1362105002) zusammengelegt wird.
- Das gemeinsame lokale CodeSystem mit screeningResultCategory ist festzulegen; die abschließende Kategorie
  wird nur in screeningResultCategory geführt.
- Eine Ableitungsregel von lungRadsCategory auf die rechtliche Kategorie (S3 Empf. 5.9) ist optional zu
  dokumentieren.
- Kein Profil modelliert die Doppelbefundung (Erst-/Zweitbefunder, gemeinsame Beurteilung) explizit; KBV/gematik
  bieten kein Radiologie-Befund-MIO.
