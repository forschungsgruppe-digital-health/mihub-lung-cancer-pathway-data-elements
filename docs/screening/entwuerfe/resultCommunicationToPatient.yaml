issues:
- 'Verbindlichkeit nach Gegenprüfung: keine. Keine eigene Dokumentationspflicht; Nachweis der Soll-Frist
  nach KFE-RL § 42 Abs. 2 (14 Tage nach Erstellung der Aufnahme). Die BPMN-Annotation „Ergebnis-mitteilung
  nach 4-5 Tagen“ ist ein Erwartungswert aus Sicht der Versicherten.'
- 'Umsetzung: eigenständig (Übermittlungsereignis). Fundstelle korrigieren: Die Annotation (TextAnnotation_045vu1u)
  liegt im Pool der Versicherten am Sequenzfluss Flow_1996xd4 (Überweisung vorlegen → Rückmeldung eingegangen),
  nicht in einer Lane Radiologie; Bezugsgröße ist die Vorlage der Überweisung, nicht die LDCT. KFE-RL
  § 42 Abs. 2 als Primärquelle. Datentyp Reference (Communication: sent, recipient, medium, payload →
  structuredScreeningReport) oder „Zeitpunkt der Übermittlung je Empfänger“ (dateTime 1..*). Display von
  165355002 auf „Patient informed - test result“ korrigieren; für die Übermittlung an die Praxis keinen
  Patienten-Code verwenden. Vom Freigabedatum des Berichts abgrenzen (DiagnosticReport.issued; S3-QI in
  Empf. 5.13). „Weg“ nur als lokale Angabe.'
- Für die Übermittlung an die überweisende Praxis gibt es nur den Prozedur-Code 711108003, während die
  Information der Person über den Situations-Code 165355002 läuft; zu entscheiden ist, ob diese Achsenmischung
  akzeptiert oder die Ereignistypisierung allein über Communication.recipient geführt wird.
- Für den Weg der Übermittlung gibt es keine verbindliche Werteliste (Communication.medium nur example-gebunden);
  ob Wege wie Portal oder ePA lokal feiner unterschieden werden sollen als ELECTRONIC, ist offen.
- Es gibt kein deutsches Profil (MII KDS, KBV Basis, Basisprofil DE) für die Befundübermittlung an Versicherte;
  ISiKNachricht verlangt stets einen Practitioner oder HealthcareService als Empfänger.
- Ein LOINC- oder SNOMED-Observable für das Datum der Befundübermittlung fehlt; die 14-Tage-Frist bleibt
  eine abgeleitete Größe.
- 'Die Fundstelle ist zu korrigieren: Die BPMN-Annotation liegt im Pool der Versicherten (Bezug Vorlage
  der Überweisung) und nicht in der Lane Radiologie; Primärquelle der Frist ist KFE-RL § 42 Abs. 2.'
