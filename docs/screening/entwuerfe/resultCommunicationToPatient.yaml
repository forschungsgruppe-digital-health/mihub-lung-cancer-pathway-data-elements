id: mihub.lung.screening.resultCommunicationToPatient.v0.1
uuid: d4c30765-63f5-561f-b347-9cd0f9ea83aa
name: resultCommunicationToPatient
label_de: Übermittlung des Befundberichts (Zeitpunkt, Weg, Empfänger)
definition_de: Zeitpunkt, Weg und Empfänger der Übermittlung des Befundberichts; Nachweis der Soll-Frist
  von 14 Tagen.
phase: screening
category: kontakt-visite
datatype: string
cardinality: 1..*
value_set:
  binding_strength: example
  standard_binding_status: mapped
  notes: 'MII TermServ, SNOMED CT 20260701 (Modul 900000000000207008), HL7 v3 ParticipationMode 4.0.0;
    Stand 2026-10-15. Das Element ist ein Zeitpunkt je Empfänger (dateTime 1..*, in FHIR Communication.sent);
    die Codes typisieren nur das Übermittlungsereignis und den Weg. Element-Codes je Empfänger: 165355002
    ''Patient informed of test result'' (situation) für die Information der Person, 711108003 ''Informing
    health care professional of test result'' (procedure) für die Übermittlung an die überweisende Praxis;
    die beiden Codes stammen aus unterschiedlichen SNOMED-Achsen (situation bzw. procedure). Antwortwerte
    für den Weg an die Person: 165356001 (Brief), 165357005 (Telefon), 165358000 (persönlich), alle Kinder
    von 165355002. Empfängerunabhängiger Weg über Communication.medium aus v3-ParticipationMode (example-Bindung):
    MAILWRIT (Post), ELECTRONIC (elektronisch, z. B. KIM, Portal, ePA), PHONE (Telefon), FACE (persönlich).
    Der offizielle Anzeigetext von 165355002 am MII TermServ ist ''Patient informed of test result'';
    die Variante ''Patient informed - test result'' gehört zum inaktiven Duplikat 142765009 und wird nicht
    verwendet. Rollen der Codes: snomed-ct|165355002 = element; snomed-ct|711108003 = element; snomed-ct|165356001
    = wert; snomed-ct|165357005 = wert; snomed-ct|165358000 = wert; http://terminology.hl7.org/CodeSystem/v3-ParticipationMode|MAILWRIT
    = wert; http://terminology.hl7.org/CodeSystem/v3-ParticipationMode|ELECTRONIC = wert; http://terminology.hl7.org/CodeSystem/v3-ParticipationMode|PHONE
    = wert; http://terminology.hl7.org/CodeSystem/v3-ParticipationMode|FACE = wert.'
  codings:
  - system: snomed-ct
    code: '165355002'
    display: Patient informed of test result
  - system: snomed-ct
    code: '711108003'
    display: Informing health care professional of test result
  - system: snomed-ct
    code: '165356001'
    display: Test result by letter to patient
  - system: snomed-ct
    code: '165357005'
    display: Test result to patient by telephone
  - system: snomed-ct
    code: '165358000'
    display: Test result to patient personally
  - system: http://terminology.hl7.org/CodeSystem/v3-ParticipationMode
    code: MAILWRIT
    display: mail
  - system: http://terminology.hl7.org/CodeSystem/v3-ParticipationMode
    code: ELECTRONIC
    display: electronic data
  - system: http://terminology.hl7.org/CodeSystem/v3-ParticipationMode
    code: PHONE
    display: telephone
  - system: http://terminology.hl7.org/CodeSystem/v3-ParticipationMode
    code: FACE
    display: face-to-face
standard_mappings:
- standard: fhir-isik
  profile_or_url: https://gematik.de/fhir/isik/StructureDefinition/ISiKNachricht
  resource: Communication
  path: 'Communication.sent (MS) | Communication.subject (1.., Patient) | Communication.recipient (1..,
    Slicing open) mit Slice ISiKRecipient (1..*, Practitioner|HealthcareService) und recipient.display
    (1..) | Communication.sender (1..) mit sender.display (1..) | Communication.payload.content[x] (Slices
    contentString, contentAttachment: url, contentType, creation 1..; data 0..0)'
  notes: de.gematik.isik-terminplanung#4.0.3, stabil; nur Differential (kein Snapshot im Paket). Nachrangiges
    Ziel für den Krankenhaus- bzw. Terminplanungskontext. Jede Instanz braucht mindestens einen Practitioner
    oder HealthcareService als Empfänger (Pflicht-Slice ISiKRecipient); die Person darf wegen des offenen
    Slicings zusätzlich als Empfängerin stehen, eine reine Mitteilung an die Person ist damit nicht abbildbar.
    Eine Reference auf den DiagnosticReport (payload.contentReference) ist zulässig, aber nicht profiliert
    bzw. nicht MS. Ob ISiK im ambulanten Screening-Setting (Radiologiepraxis) greift, ist offen.
- standard: gematik-epa-fhir
  profile_or_url: https://gematik.de/fhir/epa-mhd/StructureDefinition/epa-mhd-document-reference
  resource: DocumentReference
  path: DocumentReference.date (0..1, instant, MS) | DocumentReference.author (MS) | DocumentReference.type
    (1..1, preferred c80-doc-typecodes) | DocumentReference.content.attachment (1..1) | DocumentReference.context.related
    (MS)
  notes: 'de.gematik.epa.mhd#1.1.3, stabil. Gilt nur für den Übermittlungsweg ePA: Das Einstellen des
    Befundberichts bildet nur den Bereitstellungszeitpunkt ab (date ist 0..1, also nicht garantiert);
    Empfang bzw. Kenntnisnahme durch die Person und der Empfänger Praxis lassen sich nicht belegen. Nur
    ergänzend zu Communication (payload bzw. about verweist auf diese DocumentReference), kein Ersatz
    für das Element.'
- standard: fhir-r4-base
  profile_or_url: http://hl7.org/fhir/StructureDefinition/Communication
  resource: Communication
  path: Communication.sent (dateTime 0..1; Zeitpunkt der Übermittlung) | Communication.received (0..1)
    | Communication.recipient (0..*; Patient|Practitioner|Organization|Device …) | Communication.medium
    (0..*, example v3-ParticipationMode = Weg) | Communication.reasonCode / Communication.category (example;
    165355002 bzw. 711108003) | Communication.payload.content[x] (Reference → DiagnosticReport bzw. DocumentReference
    des structuredScreeningReport) | Communication.about / Communication.basedOn (Bezug zu ldctExamination
    bzw. Consent) | Communication.status (1..1, required event-status)
  notes: 'hl7.fhir.r4.core#4.0.1, stabil; tragfähiges Primärziel, da es weder ein MII-, KBV- noch Basisprofil-DE-Profil
    für Communication gibt. Je Empfänger eine Communication-Instanz (Kardinalität 1..*). Die Soll-Frist
    von 14 Tagen nach KFE-RL § 42 Abs. 2 ergibt sich als Differenz Communication.sent minus Aufnahmedatum
    der LDCT (ldctExamination: ImagingStudy.started bzw. Procedure.performed) und ist kein eigenes Feld.
    Die Übermittlung an die Praxis setzt eine Einwilligung voraus; dafür basedOn bzw. about auf die Consent-Ressource
    von resultTransmissionConsentReferrer setzen. 165355002 nur für die Information der Person, 711108003
    für die Übermittlung an die Praxis. Abgrenzung: Das Freigabedatum des Befundberichts ist DiagnosticReport.issued
    und nicht dieses Element.'
care_process:
  trigger: je Übermittlung des Befundberichts (an die Person; an die Praxis nur mit Einwilligung)
  responsible_role: Erstbefunder
