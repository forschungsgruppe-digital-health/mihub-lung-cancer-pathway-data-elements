issues:
- 'Verbindlichkeit nach Gegenprüfung: bedingt. Zweitbefundung Pflicht bei kontroll- oder abklärungsbedürftigem
  Erstbefund (LuKrFrühErkV § 5 Abs. 2; KFE-RL § 42 Abs. 1 S. 2); Datenübermittlung „soll“ elektronisch
  (S. 4–5); Überweisung nach BMV-Ä § 24 Abs. 4 Nr. 4. Den Auftrag selbst müssen weder KFE-RL § 44 noch
  QS-Vereinbarung § 13f dokumentiert sehen.'
- 'Umsetzung: Spezialisierung von referralOrder (primarycare). specializes mihub.lung.primarycare.referralOrder.v0.1;
  FHIR ServiceRequest mit requester = Erstbefunder, performer = Zweitbefunder, authoredOn, supportingInfo
  auf ImagingStudy bzw. cadAnalysisReport. EBM 01878 nicht als Kerncode (umfasst auch die gemeinsame Beurteilung),
  nur als Abrechnungsbezug; ServiceRequest.code lokal bzw. pending-mapping. mandatory_by_law als „bedingt“
  kennzeichnen. Die Zweitbefundung (screeningReadingEvent) verweist per basedOn auf den Auftrag; die sichere
  Übermittlung (KFE-RL § 42 Abs. 1 S. 5) als Attribut.'
- Es gibt keinen SNOMED-CT- oder LOINC-Code für 'Zweitbefundung (Doppelbefundung) einer Screening-LDCT';
  28191001 ist nur eine Näherung.
- EBM-GOP 01878 ist auf dem MII TermServ nicht als CodeSystem verfügbar und umfasst auch die gemeinsame
  Beurteilung; sie bleibt reiner Abrechnungsbezug.
- Kein deutsches Profil bildet einen Konsiliarauftrag zur Zweitbefundung ab (ISiK 6.0.0 und KBV Basis
  1.9.0 ohne ServiceRequest-Profil); ob eine KBV-/gematik-eÜberweisung passt, ist offen.
- Die sichere elektronische Bildübermittlung (KFE-RL § 42 Abs. 1 S. 5) ist als Attribut zu modellieren;
  die Abbildung über IHE XDS-I.b bzw. DICOMweb ist offen.
- Die Kennzeichnung als bedingte Pflicht (Pflicht nur bei kontroll- oder abklärungsbedürftigem Erstbefund)
  ist im Element festzuhalten.
