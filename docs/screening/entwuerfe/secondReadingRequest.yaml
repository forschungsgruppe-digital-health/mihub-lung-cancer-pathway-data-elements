id: mihub.lung.screening.secondReadingRequest.v0.1
uuid: 28a4c62a-3bd1-5067-a1ff-363b25da1729
name: secondReadingRequest
label_de: Veranlassung der Zweitbefundung (Konsiliarauftrag, Datenübermittlung)
definition_de: Konsiliarauftrag des Erstbefunders an eine:n Zweitbefunder:in mit Datum, Empfänger und
  sicherer Übermittlung der Bilder.
phase: screening
category: mitbetreuung
datatype: Reference
cardinality: 0..1
value_set:
  binding_strength: preferred
  standard_binding_status: mapped
  notes: 'Element-Code (ServiceRequest.code) ist SNOMED CT 28191001 |Consultation and report by radiologist|
    (procedure) als Näherung: Er bezeichnet eine Konsiliarbefundung mit Bericht; eine präkoordinierte
    Zweitbefundung (Doppelbefundung) gibt es in SNOMED CT und LOINC nicht. KDL AD060101 ''Konsilanforderung''
    ist nur die Dokumentklasse (DocumentReference.type) des Auftrags, nicht der ServiceRequest.code. Der
    Rückbericht (KDL AD060110 ''Konsilbericht'') gehört zum Element der Zweitbefundung (screeningReadingEvent).
    EBM-GOP 01878 ist nur Abrechnungsbezug außerhalb des Wertebereichs (umfasst auch die gemeinsame Beurteilung).
    Editionen: SNOMED CT INT 20260701, KDL 2025 (MII TermServ); Stand 2026-10-15. Rollen der Codes: snomed-ct|28191001
    = element; kdl|AD060101 = dokumentklasse.'
  codings:
  - system: snomed-ct
    code: '28191001'
    display: Consultation and report by radiologist
  - system: kdl
    code: AD060101
    display: Konsilanforderung
standard_mappings:
- standard: fhir-mii-kds
  profile_or_url: https://www.medizininformatik-initiative.de/fhir/ext/modul-bildgebung/StructureDefinition/mii-pr-bildgebung-anforderung-bildgebung
  resource: ServiceRequest
  path: ServiceRequest.code.coding:loinc / :sct; ServiceRequest.category.coding:sct; ServiceRequest.requester;
    ServiceRequest.performer; ServiceRequest.supportingInfo; ServiceRequest.reasonReference
  notes: de.medizininformatikinitiative.kerndatensatz.bildgebung#2026.0.0, stabil. Faktisch das einzige
    profilkonforme Ziel, weil DiagnosticReport.basedOn im MII-Befund nur dieses Profil oder CarePlan zulässt;
    inhaltlich beschreibt es die Anforderung einer Bildgebung, nicht die Befundung vorhandener Bilder.
    code 1..1 MS mit den optionalen Slices loinc (REQUIRED loinc-rsna-radiology-playbook) und sct (REQUIRED
    http://hl7.org/fhir/ValueSet/procedure-code; 28191001 als Prozedur dort zulässig) – sonst lokale Coding
    im offenen Slicing. category.coding:sct pattern 363679005 Imaging. requester MS = Erstbefunder, performer
    0..* (nicht MS) = Zweitbefunder, reasonReference MS → Erstbefund, supportingInfo MS nur DiagnosticReport/ImagingStudy.
- standard: fhir-r4-base
  profile_or_url: http://hl7.org/fhir/StructureDefinition/ServiceRequest
  resource: ServiceRequest
  path: ServiceRequest.requester; ServiceRequest.performer; ServiceRequest.authoredOn; ServiceRequest.code;
    ServiceRequest.reasonReference; ServiceRequest.supportingInfo
  notes: 'hl7.fhir.r4.core#4.0.1, stabil; gleiches Ziel wie das Elternelement referralOrder. requester
    = Erstbefunder, performer = Zweitbefunder, authoredOn = Datum, reasonReference → readerAssessmentCategory
    bzw. Erstbefund, supportingInfo → ImagingStudy und cadAnalysisReport. Ausführung optional als Task
    (focus/basedOn → ServiceRequest, owner = Zweitbefunder). Einschränkung: Im MII-Befundbaum ist ein
    reiner R4-ServiceRequest über DiagnosticReport.basedOn nicht referenzierbar; dort mii-pr-bildgebung-anforderung-bildgebung
    verwenden. Analogmuster: MII MTB mii-pr-mtb-histologie-evaluation-auftrag (Auftrag zur erneuten Evaluation).'
- standard: other
  profile_or_url: http://hl7.eu/fhir/imaging/StructureDefinition/ServiceRequestOrderEuImaging
  resource: ServiceRequest
  path: ServiceRequest.code; ServiceRequest.category:imaging; ServiceRequest.identifier:accessionNumber;
    ServiceRequest.supportingInfo
  notes: hl7.fhir.eu.imaging#1.0.0-ballot, Ballot/draft. Auftrag ('Requested Procedure') mit Accession
    Number; category:imaging 1..1 (SNOMED 363679005); code 0..1 nur EXAMPLE an im-procedure-type gebunden.
    Ausgerichtet auf neue Bildgebung, nicht auf Zweitbefundung.
- standard: openehr-archetype
  profile_or_url: openEHR-EHR-INSTRUCTION.service_request.v1
  resource: INSTRUCTION
  path: at0121 Service name; at0062 Reason for request; at0141 Requester; at0142 Receiver; at0149 Supporting
    information
  notes: openEHR CKM-Mirror (Commit e72871205f, 2026-10-15), nicht-FHIR; Lifecycle laut Mirror in_development
    (CKM-Status kann abweichen). Generischer Auftrag mit Auftraggeber, Empfänger und Begleitinformation.
care_process:
  trigger: kontroll- oder abklärungsbedürftiger Erstbefund (Pflichtfall); bei Bedarf auch sonst (S3 Empf.
