id: mihub.lung.screening.smokingInterruptionPeriod.v0.1
uuid: 9e8beb82-2861-5576-86a8-2a95e9512f30
name: smokingInterruptionPeriod
label_de: Vollständige Rauchunterbrechung
definition_de: Zeitraum vollständiger Rauchunterbrechung; Konsum und Jahre davor sowie Unterbrechungsjahre
  zählen nur bei Unterbrechung unter zehn Jahren.
phase: screening
category: sozialanamnese
datatype: Period
cardinality: 0..*
unit: a
value_set:
  binding_strength: example
  standard_binding_status: pending-mapping
  notes: 'MII TermServ, SNOMED CT 20260701, LOINC 2.83, UCUM (TermServ-Fragment); Stand 2026-10-15. Kein
    Konzept deckt einen Zeitraum vollständiger Rauchunterbrechung ab; die Codes betreffen Teilaspekte.
    583971000052102 ''Date ceased smoking cigarettes'' (zigarettenspezifisch, INT seit 2026-02) kodiert
    den Beginn der Unterbrechung (Period.start); bei SNOMED-Editionen vor 2026-02 ist 160625004 ''Date
    ceased smoking'' der Rückfall. 228486009 ''Time since stopped smoking'' kodiert die Dauer einer laufenden
    Abstinenz (offenes Period-Ende). LOINC 107339-4 ist Mapping für die Dauer einer abgeschlossenen Unterbrechung,
    LOINC 74010-0 Mapping für das Stoppdatum (Tabak allgemein). Einheiten a (Zehn-Jahres-Regel) und mo
    (kürzere Unterbrechungen). Rollen der Codes: snomed-ct|583971000052102 = element; snomed-ct|228486009
    = element; loinc|107339-4 = element; loinc|74010-0 = element.'
  codings:
  - system: snomed-ct
    code: '583971000052102'
    display: Date ceased smoking cigarettes
  - system: snomed-ct
    code: '228486009'
    display: Time since stopped smoking
  - system: loinc
    code: 107339-4
    display: Temporary smoking cessation [Time]
  - system: loinc
    code: 74010-0
    display: Date quit tobacco smoking
standard_mappings:
- standard: fhir-isik
  profile_or_url: https://gematik.de/fhir/isik/StructureDefinition/ISiKLebensZustand
  resource: Observation
  path: Observation.effectivePeriod
  notes: de.gematik.isik#6.0.0, stabil; nur Ableitungsbasis (in 6.0.0 abstrakt). effectivePeriod = Unterbrechungszeitraum,
    offenes Ende = laufende Abstinenz. Pflicht-LOINC wäre 107339-4, das nur die Dauer abbildet; effectivePeriod
    und valueQuantity (a bzw. mo) stehen daher nebeneinander. Weil value[x] 1..1 gilt, muss auch bei offenem
    Ende eine Dauer angegeben werden, oder das abgeleitete Profil lässt dataAbsentReason zu.
- standard: fhir-r4-base
  profile_or_url: http://hl7.org/fhir/StructureDefinition/Observation
  resource: Observation
  path: Observation.effectivePeriod
  notes: hl7.fhir.r4.core#4.0.1, stabil; Fallback. effectivePeriod mit optionalem Ende, derivedFrom auf
    die angrenzenden Konsumabschnitte. Die Regel 'keine Überlappung mit cigaretteConsumptionPeriod' ist
    im Standard nicht ausdrückbar und braucht eine eigene Invariante.
- standard: openehr-archetype
  profile_or_url: https://raw.githubusercontent.com/openEHR/CKM-mirror/master/local/archetypes/entry/evaluation/openEHR-EHR-EVALUATION.tobacco_smoking_summary.v2.adl
  resource: openEHR-EHR-EVALUATION.tobacco_smoking_summary.v2
  path: Lücke zwischen /data[at0001]/items[at0029]/items[at0064]/items[at0082] (Episode end date) und
    Folge-Episode /items[at0013]; /data[at0001]/items[at0029]/items[at0014] (Quit date); /data[at0001]/items[at0016]
    (Overall quit date)
  notes: openEHR CKM, Revision 2.0.1, published, nicht-FHIR; Näherung, kein explizites Unterbrechungselement.
    Die Unterbrechung ergibt sich als Lücke zwischen zwei Episoden; eine laufende Abstinenz entspricht
    Quit date bzw. Overall quit date. Die Zehn-Jahres-Regel wäre im Protokoll über Quit date definition
    (/protocol[at0021]/items[at0071]) zu dokumentieren.
