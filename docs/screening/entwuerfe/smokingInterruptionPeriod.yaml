issues:
- 'Verbindlichkeit nach Gegenprüfung: mittelbar. LuKrFrühErkV § 1 Abs. 2 S. 4 (Packungsjahre) und § 2
  Abs. 1 S. 1 Nr. 3 Buchst. a Doppelbuchst. aa (Dauer). Laufende Abstinenz wie Unterbrechung: G-BA-Auslegung
  (TrG Abschn. 2.1 mit Fn. 7), kein Verordnungstext.'
- 'Umsetzung: eigenständig (Raucheranamnese Q3). Period 0..*; eine laufende Unterbrechung ohne Ende zulassen.
  Konsistenzregel: keine Überlappung mit cigaretteConsumptionPeriod; dependsOn cigaretteConsumptionPeriod.
  LOINC 107339-4 nur als Mapping der Dauer verwenden (valueQuantity in a bzw. mo) oder weglassen. Notiz
  ersetzen: „Der G-BA wendet die 10-Jahres-Regel auch auf beendeten Konsum an (TrG 18.06.2025, Abschn.
  2.1 mit Fn. 7); das ist Auslegung, nicht Verordnungstext.“ Offen (E2): Zählt das Rauchen anderer Produkte
  als Unterbrechung des „Rauchens“?.'
- Kein Standardkonzept und kein FHIR-Profil (MII, ISiK, IPS, US Core) beschreibt einen Zeitraum vollständiger
  Rauchunterbrechung; die Zehn-Jahres-Regel der LuKrFrühErkV hat in keinem Standard eine Entsprechung.
- Zu entscheiden ist (E2), ob eine Unterbrechung als eigener Zeitraum oder als Rauchstoppdatum mit Dauer
  modelliert wird; davon hängt das endgültige Mapping ab.
- Offen ist, ob der Konsum anderer Tabak- oder Nikotinprodukte eine Unterbrechung des Zigarettenrauchens
  aufhebt.
- Der G-BA wendet die Zehn-Jahres-Regel auch auf beendeten Konsum an (Tragende Gründe vom 18.06.2025,
  Abschn. 2.1 mit Fn. 7); das ist Auslegung, nicht Verordnungstext, und ist im Element so zu kennzeichnen.
- Für eine laufende Abstinenz verlangt ein von ISiKLebensZustand abgeleitetes Profil trotzdem einen Wert;
  ob dataAbsentReason oder eine stichtagsbezogene Dauer verwendet wird, ist festzulegen.
