id: mihub.lung.screening.eligibilityReport.v0.1
uuid: 8307be44-21cd-5281-a685-6f3ea4a5ec0e
name: eligibilityReport
label_de: Bericht gemäß § 2 Abs. 1 Nr. 3 LuKrFrühErkV (Prüfbericht)
definition_de: Formfreier Bericht mit Zigarettenkonsum, Eignungsprofil, Anamnese und bestätigter Information;
  Aushändigung (auch ePA) und Vorlage beim Erstbefunder.
phase: screening
category: dokument
datatype: Reference
cardinality: 1..*
value_set:
  binding_strength: example
  standard_binding_status: mapped
  notes: 'Alle Codes bezeichnen den Dokumenttyp des formfreien Berichts nach § 2 Abs. 1 Nr. 3 LuKrFrühErkV
    (keine Antwortwerte). KDL AD010101 Ärztliche Stellungnahme (''ärztliche Einschätzung zum Gesundheitszustand
    für nachfolgende Zwecke'') trifft den Bericht vor der LDCT und ist laut DVMD-ConceptMap kdl-ihe-typecode
    (dvmd.kdl.r4#2025.0.1) konsistent mit IHE-D typeCode BERI; daher Kandidat für type.coding:KDL. KDL
    AD020204 Krebsfrüherkennung ist laut KDL-Definition für Ergebnisse von Früherkennungsuntersuchungen
    nach § 25 SGB V gedacht und wird auf BEFU/BEF abgebildet; für den Bericht nur ein breiter Programmbezug.
    LOINC 75492-9 ist der internationale Dokumenttyp (Composition.type, doc-typecodes), steht aber nicht
    in der R4-Liste c80-doc-typecodes. Binding example, weil kein Code den Bericht genau trifft. MII TermServ,
    KDL 2025 und LOINC 2.83, Stand 2026-10-15. Rollen der Codes: kdl|AD010101 = dokumentklasse; kdl|AD020204
    = dokumentklasse; loinc|75492-9 = dokumentklasse.'
  codings:
  - system: kdl
    code: AD010101
    display: Ärztliche Stellungnahme
  - system: kdl
    code: AD020204
    display: Krebsfrüherkennung
  - system: loinc
    code: 75492-9
    display: Risk Assessment and Screening Note
standard_mappings:
- standard: fhir-mii-kds
  profile_or_url: https://www.medizininformatik-initiative.de/fhir/ext/modul-dokument/StructureDefinition/mii-pr-dokument-dokument
  resource: DocumentReference
  path: DocumentReference.type.coding:KDL (AD010101); DocumentReference.type.coding:XDS (BERI); DocumentReference.category.coding:XDS
    (BRI); DocumentReference.content.attachment (content:Binaerdaten bzw. content:Verweis); DocumentReference.date;
    DocumentReference.author
  notes: 'de.medizininformatikinitiative.kerndatensatz.dokument#2026.0.1, stabil (2027.0.0-ballot.2 vorhanden).
    type.coding:KDL REQUIRED an http://dvmd.de/fhir/ValueSet/kdl, type.coding:XDS REQUIRED an IHEXDStypeCode,
    category.coding:XDS REQUIRED an IHEXDSclassCode. Widerspruchsfreie Kombination: KDL AD010101 mit BERI/BRI
    (ConceptMap AD010101 → BERI). AD020204 würde laut ConceptMap BEFU/BEF verlangen und passt daher nicht
    zu BERI/BRI. Das Profil führt den Bericht als Dokument (PDF) für Aushändigung und Vorlage beim Erstbefunder;
    strukturierte Teile (u. a. packYearsCalculated) brauchen zusätzlich eine Composition.'
- standard: gematik-epa-fhir
  profile_or_url: https://gematik.de/fhir/epa-mhd/StructureDefinition/epa-mhd-document-reference
  resource: DocumentReference (ePA MHD)
  path: DocumentReference.category.coding (BRI); DocumentReference.type.coding (BERI); DocumentReference.context.event.coding
    (KDL); DocumentReference.content.attachment.url; DocumentReference.context.facilityType
  notes: 'de.gematik.epa.mhd#1.1.3 (Basis IHE.MHD.Minimal.DocumentReference), stabil; Terminologie de.gematik.terminology#1.0.9.
    Optionales Ziel: Die elektronische Aushändigung über die ePA nennen die TrG zu § 39 Nr. 1 S. 2 nur
    als Option ''soweit rechtlich zulässig''. category, type und context.event sind REQUIRED an epa-xds-class-code-vs,
    epa-xds-type-code-vs und epa-xds-event-code-vs gebunden; die IHE-D-Codes stehen dort unter den OID-Systemen
    urn:oid:1.3.6.1.4.1.19376.3.276.1.5.8 (class) und urn:oid:1.3.6.1.4.1.19376.3.276.1.5.9 (type), das
    Event-ValueSet schließt das KDL-ValueSet ein. Weitere Pflichtangaben: masterIdentifier, identifier:uniqueId,
    subject (subject.identifier), content.attachment nur per url (data 0..0) mit contentType und language,
    author.display, context.facilityType.'
- standard: fhir-isik
  profile_or_url: https://gematik.de/fhir/isik/StructureDefinition/ISiKDokumentenMetadaten
  resource: DocumentReference
  path: DocumentReference.type.coding:KDL (1..1); DocumentReference.type.coding:XDS; DocumentReference.category.coding:XDS;
    DocumentReference.context.event.coding (1..1); DocumentReference.context.facilityType; DocumentReference.context.practiceSetting;
    DocumentReference.content.attachment
  notes: 'de.gematik.isik#6.0.0, stabil, nur Differential; Dokumentaustausch im Krankenhaus, für den ambulanten
    Bericht nur bedingt passend. type.coding:KDL ist 1..1 REQUIRED an kdl (AD010101, konsistent mit BERI/BRI).
    Pflicht: masterIdentifier, securityLabel, content.format, attachment contentType/language/title/creation,
    context.facilityType, context.practiceSetting, context.event.coding 1..1 (REQUIRED IHEXDSeventCodeList)
    sowie subject mit identifier.system/value.'
- standard: fhir-isik
  profile_or_url: https://gematik.de/fhir/isik/StructureDefinition/ISiKBerichtSubSysteme
  resource: Composition
  path: Composition.type.coding:KDL; Composition.type.coding:XDS; Composition.category.coding:IHE; Composition.section
    (title, text; section.entry → packYearsCalculated, creditableSmokingDurationYears, medicalSuitabilityProfile,
    eligibilityCheckResult); Composition.author; Composition.date
  notes: 'de.gematik.isik#6.0.0, stabil, nur Differential. Strukturmuster für die Composition-Variante
    (Sektionen je Berichtsteil: Zigarettenkonsum, Eignungsprofil, relevante Anamnese mit Verweisen u.
    a. auf comorbidity, Bestätigung der Information nach KFE-RL § 40 S. 3, Selbsterklärung als Anlage).
    Pflicht: text (status extensions), identifier, status final, subject.reference, author.display, section
    mit title und text. Das Profil ist für die krankenhausinterne Übermittlung von Subsystemen gedacht;
    für den ambulanten Bericht nur als Vorlage, Austauschziel ist die R4-Composition bzw. MII Dokument.'
- standard: fhir-isik
  profile_or_url: https://gematik.de/fhir/isik/StructureDefinition/ISiKFormularDaten
  resource: QuestionnaireResponse
  path: QuestionnaireResponse.questionnaire (mit Extension questionnaireDisplay); QuestionnaireResponse.item.answer.value[x];
    QuestionnaireResponse.authored; QuestionnaireResponse.author
  notes: 'de.gematik.isik#6.0.0, stabil, nur Differential. Nur optionale Umsetzungsvariante, falls der
    Bericht als Formular nach einer KV-Vorlage (KVBB-Musterbericht, KVBW-Bericht) erhoben wird; dafür
    wäre ein eigener Questionnaire nötig. Pflicht: language, questionnaire mit Extension questionnaireDisplay,
    subject.reference, authored. Der Bericht ist formfrei (Anlagen II/III der KFE-RL nicht belegt), die
    Formularvariante ist keine Normvorgabe.'
- standard: other
  profile_or_url: https://fhir.kbv.de/StructureDefinition/KBV_PR_Base_DocumentReference
  resource: DocumentReference
  path: DocumentReference.type.coding:xds (BERI); DocumentReference.category.coding:xds (BRI); DocumentReference.content:anhang.attachment
    (data, contentType, title)
  notes: kbv.basis#1.9.0 (KBV Basisprofile, kein MIO), stabil, nur Differential; für den PVS-Kontext der
    berichterstellenden Praxis. type.coding:xds REQUIRED IHEXDStypeCode, category.coding:xds REQUIRED
    IHEXDSclassCode. type.coding:kbv ist an KBV_VS_Base_Document_Type_KBV gebunden, das nur Verordnungs-,
    eAU- und Medikationsplan-Typen enthält; die Typisierung läuft daher über XDS. content:anhang verlangt
    data, contentType und title (url 0).
- standard: ihe-xds
  profile_or_url: http://ihe-d.de/ValueSets/IHEXDStypeCode
  resource: XDS DocumentEntry (FHIR-Pendant DocumentReference über MHD)
  path: DocumentEntry.classCode = BRI; DocumentEntry.typeCode = BERI; DocumentEntry.eventCodeList = KDL
    AD010101
  notes: de.ihe-d.terminology#3.0.1, nicht-FHIR (XDS-Metadaten). BERI 'Arztberichte' umfasst laut Definition
    u. a. ärztliche Stellungnahme und Ambulanzbericht, BRI 'Brief' alle Arztbriefe mit ärztlicher Bewertung.
    Mit KDL AD010101 als eventCode konsistent zur DVMD-ConceptMap; AD020204 würde dort auf BEFU/BEF führen.
    Eine genauere IHE-D-Zuordnung des Prüfberichts gibt es nicht.
- standard: fhir-r4-base
  profile_or_url: http://hl7.org/fhir/StructureDefinition/Composition
  resource: Composition
  path: Composition.type (75492-9); Composition.date; Composition.author; Composition.section.entry
  notes: hl7.fhir.r4.core#4.0.1, stabil. Basisziel für die eigenständige Composition, wenn kein ISiK-Server
    beteiligt ist. type 1..1 PREFERRED an doc-typecodes (LOINC 75492-9 zulässig), date 1..1 und author
    1..* sind Pflicht; die Berichtsteile werden über section.entry referenziert.
