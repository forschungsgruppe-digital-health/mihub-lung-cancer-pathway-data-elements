issues:
- 'Verbindlichkeit nach Gegenprüfung: Pflicht. LuKrFrühErkV § 2 Abs. 1 S. 1 Nr. 3; KFE-RL § 39 Nr. 1 (S.
  2: Bericht an die Person), § 40 S. 3 (Bestätigung der Information), § 41 Abs. 1 (Berücksichtigung durch
  den Erstbefunder); EBM 01875. Formfrei: Anlagen II und III der KFE-RL sind „[nicht belegt]“.'
- 'Umsetzung: eigenständig (Composition). Kardinalität 1..* (je Runde). hasPart packYearsCalculated, creditableSmokingDurationYears,
  medicalSuitabilityProfile, eligibilityCheckResult und die Bestätigung der erfolgten Information (§ 40
  S. 3); Abschnitt „Relevante Anamnese“ mit Verweisen auf comorbidity u. a. (statt des verworfenen relevantAnamnesticData);
  Selbsterklärung nach KFE-RL § 43 Abs. 2 S. 3 als Anlage (statt des verworfenen reportingPhysicianSelfDeclaration).
  KDL AD020204 nur als breites Mapping (binding example/extensible). Notes korrigieren: Die BÄK-Vorgaben
  (12.12.2025) verlangen nur, dass Fortbildungen eine Berichtsvorlage bereitstellen; eine konsentierte
  Vorlage kündigt das Whitepaper an, in S3 5.1 ist sie nicht enthalten. Elektronische Aushändigung über
  die ePA nennen die TrG (zu § 39 Nr. 1 S. 2) als Option „soweit rechtlich zulässig“, nicht der Normtext.'
- Weder KDL noch LOINC haben einen Dokumenttyp genau für den Bericht nach § 2 Abs. 1 Nr. 3 LuKrFrühErkV;
  fachlich zu bestätigen ist, ob AD010101 Ärztliche Stellungnahme (konsistent mit BERI/BRI) oder AD020204
  Krebsfrüherkennung (Programmbezug, aber ConceptMap → BEFU/BEF) als type.coding:KDL geführt wird.
- Kein Profil für den Bericht in MII KDS, ISiK, KBV (kein MIO zur Lungenkrebs-Früherkennung), ePA, IPS
  oder mCODE; die strukturierten Berichtsteile brauchen eine eigene Composition, ISiKBerichtSubSysteme
  ist nur ein Krankenhaus-Muster.
- Es gibt weder einen Questionnaire noch eine konsentierte Berichtsvorlage; das Whitepaper kündigt eine
  Vorlage an, die BÄK-Vorgaben verlangen nur ihre Bereitstellung in Fortbildungen.
- Die Bestätigung 'Information erfolgt' (KFE-RL § 40 S. 3) hat in keinem Profil ein Element und muss als
  lokale Sektion oder Observation geführt werden.
- Die elektronische Aushändigung über die ePA ist nur eine Option ('soweit rechtlich zulässig'); ob sie
  umgesetzt wird, ist offen.
- Kardinalität laut Quelle 1..* (je Runde).
