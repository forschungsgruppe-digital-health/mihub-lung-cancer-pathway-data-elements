issues:
- 'Verbindlichkeit nach Gegenprüfung: Pflicht. Kriterium (mindestens 15 Packungsjahre) im Bericht: LuKrFrühErkV
  § 2 Abs. 1 S. 1 Nr. 3 Buchst. a Doppelbuchst. bb i. V. m. § 1 Abs. 2 S. 1–4; KFE-RL § 39 Nr. 1. Der
  Zahlenwert ist nicht zwingend.'
- 'Umsetzung: eigenständig (generalisiert; nimmt packYearsSelfEstimate auf). Als generisches Element „Packungsjahre“
  (nur Zigaretten) führen; Rechenweg als Methode (jahrweise nach § 1 Abs. 2 | vereinfachte Schätzung nach
  KBV/KV | Selbstschätzung) und Urheber (Ärzt:in | Versicherte) statt im Namen. Primärcode SNOMED 401201003;
  LOINC 8664-5 als Observation.code-Mapping (Methode „Reported“); 782516008 höchstens als breiteres Mapping
  (Tabak gesamt). Einheit an den gewählten Code anpassen. Kriterium ≥ 15 in eligibilityCheckResult. Eigenes
  Q3-Profil nötig, weil ISiK und IPS keine Packungsjahre kennen.'
- 'Die Einheit ist mit dem MII-Kardiologie-Ballot abzustimmen: {PackYears} (im TermServ-Fragment gültig)
  oder {pack-years} (Pattern im MII-Ballot und Beispiel in US Core).'
- Kein Standard bildet die jahrweise Summe nach § 1 Abs. 2 LuKrFrühErkV ab (nur Zigaretten, ohne Konsum
  vor Unterbrechungen ab 10 Jahren); die lokalen Methodencodes müssen fachlich bestätigt und als CodeSystem
  veröffentlicht werden.
- Die Urheberschaft des Werts (Ärzt:in oder versicherte Person) hat keinen Standardcode und ist über Observation.performer
  oder einen lokalen Code abzubilden.
- Ein stabiles nationales Profil für Packungsjahre fehlt; es gibt sie nur im MII-Kardiologie-Ballot, nicht
  in ISiK oder IPS.
- Ob LOINC 8664-5 als ISiK-Pflichtcode für einen berechneten Wert vertretbar ist oder ein Profil ohne
  ISiKLebensZustand-Basis nötig wird, ist offen.
- Das Datenwörterbuch des ACR Lung Cancer Screening Registry war nicht abrufbar und ist nicht zugeordnet.
- Kardinalität laut Quelle 0..1 je Prüfung.
