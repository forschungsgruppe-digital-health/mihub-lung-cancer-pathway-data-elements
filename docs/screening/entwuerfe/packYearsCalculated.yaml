id: mihub.lung.screening.packYearsCalculated.v0.1
uuid: d702f972-cee8-5565-b661-d1755387a37a
name: packYearsCalculated
label_de: Packungsjahre (jahrweise nach § 1 Abs. 2 LuKrFrühErkV)
definition_de: Summe je anrechenbares Jahr aus Zigaretten/Tag ÷ 20; ohne Konsum vor Unterbrechungen ≥
  10 Jahre; nur Zigaretten. Kriterium ≥ 15.
phase: screening
category: sozialanamnese
datatype: Quantity
cardinality: 1..*
unit: '{PackYears}'
value_set:
  binding_strength: preferred
  standard_binding_status: mapped
  notes: 'MII TermServ, SNOMED CT 20260701, LOINC 2.83, UCUM (TermServ-Fragment); Stand 2026-10-15. Elementcode
    ist 401201003 ''Cigarette pack-years'' (nur Zigaretten, wie im MII-Kardiologie-Ballot und in US Core).
    782516008 ''Number of calculated smoking pack years'' ist nur breiteres Mapping (gesamter Tabakkonsum).
    LOINC 8664-5 ist nur Mapping für eine Selbstangabe (Methode ''Reported''); LOINC hat keinen eigenen
    Packungsjahre-Code. Einheit {PackYears} (im TermServ-Fragment gültig); MII-Kardiologie-Ballot und
    US Core nutzen {pack-years}, das nach UCUM-Grammatik ebenfalls zulässig ist. Der Rechenweg (jahrweise
    nach § 1 Abs. 2 LuKrFrühErkV, vereinfachte Schätzung, Selbstschätzung) wird über lokale Methodencodes
    (Observation.method) geführt. Das Kriterium mindestens 15 Packungsjahre wird in eligibilityCheckResult
    ausgewertet. Rollen der Codes: snomed-ct|401201003 = element; snomed-ct|782516008 = element; loinc|8664-5
    = element; local-no-standard-binding|jahrweise-lukrfrueherkv = methode; local-no-standard-binding|vereinfachte-schaetzung
    = methode; local-no-standard-binding|selbstschaetzung = methode.'
  codings:
  - system: snomed-ct
    code: '401201003'
    display: Cigarette pack-years
  - system: snomed-ct
    code: '782516008'
    display: Number of calculated smoking pack years
  - system: loinc
    code: 8664-5
    display: Cigarettes smoked total (pack per year) - Reported
  - system: local-no-standard-binding
    code: jahrweise-lukrfrueherkv
    display: Jahrweise Berechnung nach § 1 Abs. 2 LuKrFrühErkV
  - system: local-no-standard-binding
    code: vereinfachte-schaetzung
    display: Vereinfachte Schätzung (Packungen pro Tag × Raucherjahre)
  - system: local-no-standard-binding
    code: selbstschaetzung
    display: Selbstschätzung der versicherten Person
standard_mappings:
- standard: fhir-mii-kds
  profile_or_url: https://www.medizininformatik-initiative.de/fhir/ext/modul-kardio/StructureDefinition/mii-pr-kardio-observation-rauchen
  resource: Observation
  path: Observation.component:packungsjahre.valueQuantity
  notes: de.medizininformatikinitiative.kerndatensatz.kardiologie#2027.0.0-ballot, Ballot. Slice packungsjahre
    0..*, code Pattern SNOMED 401201003, valueQuantity 1..1 mit Pattern UCUM {pack-years}, mustSupport
    value und comparator. Laut short-Text vereinfachter Rechenweg (Packungen à 20 Zigaretten × Raucherjahre),
    nicht jahrweise nach § 1 Abs. 2 LuKrFrühErkV; Methode und Urheber sind nicht profiliert. Bei Abbildung
    Einheit {pack-years} setzen.
- standard: fhir-isik
  profile_or_url: https://gematik.de/fhir/isik/StructureDefinition/ISiKLebensZustand
  resource: Observation
  path: Observation.valueQuantity
  notes: de.gematik.isik#6.0.0, stabil; nur Ableitungsbasis (in 6.0.0 abstrakt), falls Packungsjahre eine
    eigene Observation sind. ISiK verlangt ein LOINC-Coding; der einzige Kandidat 8664-5 ('pack per year',
    Methode Reported) passt semantisch nur bedingt zu einer berechneten Packungsjahr-Summe. SNOMED 401201003
    in coding:snomed-ct, method und derivedFrom für Rechenweg und Konsumabschnitte. ISiKRaucherStatus
    selbst hat keine Packungsjahre.
- standard: openehr-archetype
  profile_or_url: https://raw.githubusercontent.com/openEHR/CKM-mirror/master/local/archetypes/entry/evaluation/openEHR-EHR-EVALUATION.tobacco_smoking_summary.v2.adl
  resource: openEHR-EHR-EVALUATION.tobacco_smoking_summary.v2
  path: /data[at0001]/items[at0029]/items[at0017] (Pack years je Typ, Type at0054 Cigarettes); gesamt
    /data[at0001]/items[at0074] (Overall pack years)
  notes: openEHR CKM, Revision 2.0.1, published, nicht-FHIR. Für die Verordnung ist at0017 mit Type Cigarettes
    der richtige Pfad, weil Overall pack years (at0074) alle Tabakarten umfasst. Die Packungsgröße von
    20 Zigaretten (§ 1 Abs. 2 S. 2 LuKrFrühErkV) wird im Protokoll unter Pack definition (/protocol[at0021]/items[at0072])
    dokumentiert.
- standard: other
  profile_or_url: http://hl7.org/fhir/us/core/StructureDefinition/us-core-smokingstatus
  resource: Observation
  path: Observation.valueQuantity
  notes: 'hl7.fhir.us.core#9.0.0, stabil; nur US-Referenzmuster. Packungsjahre als eigene Observation:
    Invariante us-core-25 (warning) erwartet für code 401201003 oder 782516008 eine valueQuantity, required
    an UCUM gebunden; Paketbeispiel mit 401201003 und {pack-years}. Das mCODE-4.0.0-Beispiel nutzt dagegen
    UCUM ''1''.'
