issues:
- 'Verbindlichkeit nach Gegenprüfung: Pflicht. Das Kriterium (mindestens 25 anrechenbare Jahre) muss aus
  dem Bericht hervorgehen: LuKrFrühErkV § 2 Abs. 1 S. 1 Nr. 3 Buchst. a Doppelbuchst. aa; KFE-RL § 38
  Abs. 1, § 39 Nr. 1. Der Zahlenwert selbst ist eine Modellentscheidung.'
- 'Umsetzung: abgeleitet (aus Konsumabschnitten und Unterbrechungen). Als abgeleiteten Wert führen (data_flows
  usage_type derive; dependsOn cigaretteConsumptionPeriod und smokingInterruptionPeriod), Einheit UCUM
  a. Definition vollständig fassen: Jahre vor einer Unterbrechung von 10 oder mehr Jahren entfallen, Unterbrechungsjahre
  unter 10 Jahren zählen mit, nur Zigaretten. Der Kriteriumsnachweis (ja/nein) gehört in eligibilityCheckResult
  bzw. eligibilityReport. Codes nur als Näherung mit Hinweis auf die Zählregel.'
- Kein Standardcode beschreibt die anrechenbare Rauchdauer nach § 2 Abs. 1 S. 1 Nr. 3 Buchst. a Doppelbuchst.
  aa LuKrFrühErkV; der lokale Methodencode muss fachlich bestätigt und als CodeSystem veröffentlicht werden.
- Zu entscheiden ist, ob 67741-9 (passender, aber TRIAL) oder 88029-4 (ACTIVE, aber auch rauchloser Tabak)
  als bevorzugtes LOINC-Mapping gilt.
- Der Kriteriumsnachweis (mindestens 25 Jahre, ja/nein) hat kein Profil und gehört in eligibilityCheckResult
  bzw. eligibilityReport.
- IPS und ISiKRaucherStatus haben keine Dauerkomponente; national gibt es die Rauchdauer nur im MII-Kardiologie-Ballot.
