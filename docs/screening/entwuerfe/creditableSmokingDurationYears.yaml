id: mihub.lung.screening.creditableSmokingDurationYears.v0.1
uuid: e7ef3627-3295-5741-8848-1fdee77dac90
name: creditableSmokingDurationYears
label_de: Anrechenbare Dauer des Zigarettenkonsums (Jahre)
definition_de: Rauchdauer nach Zählregel § 2 Abs. 1 Nr. 3 a aa LuKrFrühErkV (Unterbrechungen < 10 Jahre
  zählen mit), aus Abschnitten abgeleitet; Kriterium ≥ 25 Jahre.
phase: screening
category: sozialanamnese
datatype: Quantity
cardinality: 0..1
unit: a
value_set:
  binding_strength: preferred
  standard_binding_status: mapped
  notes: 'MII TermServ, SNOMED CT 20260701, LOINC 2.83, UCUM (TermServ-Fragment); Stand 2026-10-15. Elementcode
    ist 228487000 ''Total time smoked'' (wie component:rauchdauer im MII-Kardiologie-Ballot). LOINC-Mappings:
    67741-9 ''Smoking tobacco use duration'' (rauchspezifisch, Status TRIAL) und 88029-4 ''Tobacco use
    duration'' (ACTIVE, breiter, auch rauchloser Tabak; stabiler Ausweich- und ISiK-Pflichtcode). Einheit
    a. Alle Codes sind Näherungen, weil sie die tatsächlich gerauchte Zeit meinen: Die Zählregel der Verordnung
    (nur Zigaretten, Unterbrechungen unter 10 Jahren zählen mit, Jahre vor einer Unterbrechung ab 10 Jahren
    entfallen) wird über den lokalen Methodencode (Observation.method) dokumentiert. Der Wert wird aus
    Konsumabschnitten und Unterbrechungen abgeleitet. Rollen der Codes: snomed-ct|228487000 = element;
    loinc|67741-9 = element; loinc|88029-4 = element; local-no-standard-binding|zaehlregel-lukrfrueherkv-2-1-3-a-aa
    = methode.'
  codings:
  - system: snomed-ct
    code: '228487000'
    display: Total time smoked
  - system: loinc
    code: 67741-9
    display: Smoking tobacco use duration
  - system: loinc
    code: 88029-4
    display: Tobacco use duration
  - system: local-no-standard-binding
    code: zaehlregel-lukrfrueherkv-2-1-3-a-aa
    display: Anrechenbare Rauchdauer nach § 2 Abs. 1 S. 1 Nr. 3 Buchst. a Doppelbuchst. aa LuKrFrühErkV
standard_mappings:
- standard: fhir-mii-kds
  profile_or_url: https://www.medizininformatik-initiative.de/fhir/ext/modul-kardio/StructureDefinition/mii-pr-kardio-observation-rauchen
  resource: Observation
  path: Observation.component:rauchdauer.valueQuantity
  notes: 'de.medizininformatikinitiative.kerndatensatz.kardiologie#2027.0.0-ballot, Ballot. Slice rauchdauer
    0..*, code Pattern SNOMED 228487000, valueQuantity 1..1 mit Pattern UCUM a (unit ''year''). Nur ungefähres
    Mapping (approximate): das Profil meint die tatsächlich gerauchte Zeit, nicht die anrechenbare Dauer
    nach LuKrFrühErkV; der Rechenweg steht in instruction_de, method und derivedFrom sind nicht eigens
    profiliert.'
- standard: fhir-isik
  profile_or_url: https://gematik.de/fhir/isik/StructureDefinition/ISiKLebensZustand
  resource: Observation
  path: Observation.valueQuantity
  notes: de.gematik.isik#6.0.0, stabil; nur Ableitungsbasis (in 6.0.0 abstrakt). Pflicht-LOINC 88029-4
    (Tabak allgemein, Näherung), SNOMED 228487000 zusätzlich, valueQuantity in a. derivedFrom verweist
    auf cigaretteConsumptionPeriod und smokingInterruptionPeriod, method auf den lokalen Methodencode
    zur Zählregel.
- standard: openehr-archetype
  profile_or_url: https://raw.githubusercontent.com/openEHR/CKM-mirror/master/local/archetypes/entry/evaluation/openEHR-EHR-EVALUATION.tobacco_smoking_summary.v2.adl
  resource: openEHR-EHR-EVALUATION.tobacco_smoking_summary.v2
  path: /data[at0001]/items[at0093] (Overall years of smoking)
  notes: openEHR CKM, Revision 2.0.1, published, nicht-FHIR. DV_QUANTITY in a; 'The cumulative number
    of years that the individual has smoked tobacco' über alle Tabakarten und ohne Unterbrechungsjahre.
    Näherung, weil die Verordnung Unterbrechungsjahre unter 10 Jahren mitzählt; die Zählregel wäre im
    Protokoll (at0071) zu dokumentieren.
