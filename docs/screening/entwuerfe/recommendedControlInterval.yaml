id: mihub.lung.screening.recommendedControlInterval.v0.1
uuid: 00c850f1-c740-5844-97b8-0a4a3005d0bc
name: recommendedControlInterval
label_de: Empfohlenes Kontrollintervall bis zur nächsten Untersuchung (Monate)
definition_de: Empfohlenes Kontrollintervall in Monaten ab LDCT bei kontrollbedürftigem Befund (< 12,
  z. B. 3 oder 6); daraus Fälligkeitsdatum.
phase: screening
category: versorgungsplanung
datatype: Quantity
cardinality: 1..*
unit: mo
value_set:
  binding_strength: example
  standard_binding_status: no-standard-found
  notes: 'Editionen: UCUM, SNOMED CT INT 20260701 und LOINC 2.83, MII TermServ (Stand 2026-10-15). Datentyp
    Quantity ohne Werteliste. Für das empfohlene Intervall bis zur nächsten Früherkennungsuntersuchung
    gibt es weder in SNOMED CT noch in LOINC einen Element-Code (Suchen nach follow-up/screening/recommended
    interval unter Observables ohne Treffer); daher lokaler Platzhalter-Element-Code. Die Einheit ist
    fest UCUM ''mo'' (im Datenelement als ''unit: mo'', nicht als Werte-Coding; DICOM CID 6046 ''Follow-up
    Interval Unit'' bestätigt mo als Einheit). Wert < 12; Pflicht genau dann, wenn screeningResultCategory
    = kontrollbedürftig. Das Fälligkeitsdatum wird abgeleitet (Datum der ausgewerteten LDCT + Intervall,
    Lung-RADS v2022 Note 2) und nicht kodiert. Abgelehnt: EBM 01872 (nur Abrechnungsbezug), LOINC 21979-0,
    39161-5 und 57070-5 (Art der Nachsorge bzw. Datumsangaben, kein Intervall). Rollen der Codes: local-no-standard-binding|recommendedControlInterval
    = element.'
  codings:
  - system: local-no-standard-binding
    code: recommendedControlInterval
    display: Empfohlenes Kontrollintervall bis zur nächsten LDCT (Monate)
standard_mappings:
- standard: fhir-mii-kds
  profile_or_url: https://www.medizininformatik-initiative.de/fhir/ext/modul-bildgebung/StructureDefinition/mii-pr-bildgebung-behandlungsempfehlung
  resource: CarePlan
  path: CarePlan.activity.detail.scheduled[x] (Timing | Period | string)
  notes: 'de.medizininformatikinitiative.kerndatensatz.bildgebung#2026.0.0, stabil. Äquivalenz related
    (Transformation nötig, kein Quantity-Element). Bevorzugt: scheduledPeriod.start = Fälligkeitsdatum
    (Datum der ausgewerteten LDCT + Intervall). Alternative scheduledTiming.repeat.period mit periodUnit
    ''mo'' (FHIR units-of-time) und count = 1 ist missverständlich, da Timing ein Wiederholungsintervall
    meint. Invariante cpl-3 (detail XOR reference) beachten. Das Intervall selbst (Quantity, UCUM mo)
    nur im Datenelement bzw. Logical Model.'
- standard: fhir-mii-kds
  profile_or_url: https://www.medizininformatik-initiative.de/fhir/ext/modul-bildgebung/StructureDefinition/mii-pr-bildgebung-anforderung-bildgebung
  resource: ServiceRequest
  path: ServiceRequest.occurrence[x] (dateTime | Period | Timing)
  notes: 'de.medizininformatikinitiative.kerndatensatz.bildgebung#2026.0.0, stabil. Äquivalenz related:
    nur das abgeleitete Fälligkeitsdatum der Kontroll-LDCT, nicht das Intervall.'
- standard: other
  profile_or_url: https://edge.sitecorecloud.io/americancoldf5f-acrorgf92a-productioncb02-3650/media/ACR/Files/RADS/Lung-RADS/Lung-RADS-2022.pdf
  resource: ACR Lung-RADS v2022, Note 2 und Spalte „Management“
  path: „The timing of follow-up imaging is from the date of the exam being interpreted“; Intervalle 3
    Monate (4A), 6 Monate (3), 12 Monate (1/2)
  notes: ACR Lung-RADS v2022, nicht-FHIR. Beleg für die Ableitungsregel des Fälligkeitsdatums und die
    typischen Intervallwerte.
- standard: other
  profile_or_url: https://nrdrsupport.acr.org/support/solutions/articles/11000041247
  resource: ACR LCSR & IPN Data Dictionary
  path: '#224.3 „Recommended follow-up interval: Start“; #224.4 „Recommended follow-up interval: End“'
  notes: 'ACR LCSR & IPN Data Dictionary, Stand 2026-05-28, nicht-FHIR. Nur Analogie (related): die Elemente
    gehören zum IPN-Teil, nicht zum Screening-Teil, in dem sich das Intervall implizit aus der Lung-RADS-Kategorie
    ergibt.'
- standard: openehr-archetype
  profile_or_url: openEHR-EHR-INSTRUCTION.service_request.v1
  resource: INSTRUCTION
  path: '/activities[at0001]/description[at0009]/items[at0040] (Service due: DV_DATE_TIME | DV_TEXT |
    DV_INTERVAL)'
  notes: 'openEHR CKM (CKM-mirror master, Stand 2026-10-15), Lifecycle laut Mirror in_development, nicht-FHIR.
    Äquivalenz related: Fälligkeit, nicht das Intervall als Quantity.'
