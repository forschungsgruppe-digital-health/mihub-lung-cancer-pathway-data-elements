issues:
- 'Verbindlichkeit nach Gegenprüfung: bedingt. LuKrFrühErkV § 5 Abs. 3 S. 2 (gemeinsame Empfehlung für
  den Zeitpunkt der nächsten Untersuchung); KFE-RL § 42 Abs. 3 Nr. 1 (Übermittlung an die Person); EBM
  01872 verlangt die Angabe in Monaten.'
- 'Umsetzung: eigenständig. EBM 01872 aus value_set entfernen (Abrechnungsbezug, kein Konzept „empfohlenes
  Intervall“); value_set n/a, unit mo (UCUM). Invariante: Pflicht genau dann, wenn screeningResultCategory
  = kontrollbedürftig; Wert < 12. Fälligkeitsdatum = Datum der ausgewerteten LDCT + Intervall (Lung-RADS
  Note 2) ableiten; es speist screeningInvitation und plannedFollowUpAppointment. recommendedManagement
  ohne eigene Zeitwerte. dependsOn screeningResultCategory. Quellen ergänzen: KFE-RL § 42 Abs. 3 Nr. 1
  und S3 Empf. 5.9 (3 bzw. 6 Monate).'
- Für 'empfohlenes Kontrollintervall bis zur nächsten LDCT' fehlt ein Standard-Observable in SNOMED CT
  und LOINC; ein lokaler Element-Code mit kanonischer URL ist festzulegen oder ein Konzeptantrag zu stellen.
- Kein FHIR-Profil (MII, ISiK, KBV, IPS, EU) hat ein Quantity-Element für das Intervall; die Abbildung
  erfolgt nur über das abgeleitete Fälligkeitsdatum, die Transformationsregel ist festzuschreiben.
- Die Invariante (Pflicht genau bei screeningResultCategory = kontrollbedürftig, Wert < 12 Monate) ist
  als Constraint zu formulieren.
- Der konkrete Folgetermin (ISiKTermin, KBV_PR_AW_Termin) gehört zu plannedFollowUpAppointment bzw. screeningInvitation
  und ist dort zuzuordnen.
- EBM 01872 ist nur Abrechnungsbezug und sollte in den Constraints bzw. der Abrechnungsdokumentation statt
  im Werte-Set stehen.
- Kardinalität laut Quelle 0..1 (Pflicht genau bei „kontrollbedürftig“).
