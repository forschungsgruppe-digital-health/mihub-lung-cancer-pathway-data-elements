issues:
- 'Verbindlichkeit nach Gegenprüfung: Leitlinie. DRG/DGP/DGT-Supplement Tab. S1 Anm. 15; Graduierung nach
  O’Dowd et al. 2023 („Emphysema“, Tab. 2).'
- 'Umsetzung: Spezialisierung von incidentalFinding. Strikt als Bildbefund-Beobachtung modellieren, nicht
  als Condition. 87433001 nur als Befundfokus bzw. Observation.code mit Hinweis „keine COPD-Diagnose“.
  Wert = lokales Ordinal-ValueSet kein | leicht < 25 % | mittel 25–50 % | schwer > 50 % (no-standard-found;
  Quelle O’Dowd 2023). specializes incidentalFinding; Eingang für noduleMalignancyProbability (Brock nutzt
  nur vorhanden/nicht vorhanden). Optional Attribut „Überweisung zur klinischen Abklärung bei mittel/schwer“.
  COPD- und Emphysem-Diagnosen bleiben in comorbidity.'
- Es gibt kein standardisiertes Observable für die radiologische Emphysem-Ausprägung; die Nutzung der
  Disorder 87433001 als Observation.code ist eine Interimslösung, die in Definition bzw. Constraints mit
  dem Hinweis 'keine Condition/keine COPD-Diagnose' abzusichern ist.
- Zu entscheiden ist, ob RadLex RID4799 als bevorzugter Element-Code neben bzw. vor 87433001 geführt wird;
  dafür muss der Systemschlüssel 'radlex' im Schema dokumentiert sein.
- Die Prozentschwellen (< 25 %, 25–50 %, > 50 %) sind in keinem Codesystem hinterlegt und stehen nur in
  der Elementdefinition; ein standardisiertes Werte-ValueSet für die Graduierung fehlt in allen geprüften
  Standards.
- Die Morphologie-Achse (zentrilobulär, panazinär, paraseptal) muss im Datenmodell als eigenes optionales
  Attribut getrennt von der Schweregradliste geführt werden.
- Für einen quantitativ befundeten Emphysem-Prozentanteil ist kein LOINC-Code belegt.
- Der Pattern-Defekt im MII-Bildgebungsmodul 2027.0.0-ballot.1 sollte als Ballot-Kommentar gemeldet werden.
