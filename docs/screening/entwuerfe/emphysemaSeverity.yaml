id: mihub.lung.screening.emphysemaSeverity.v0.1
uuid: 5b888c64-2d5e-5ec2-aeaa-a0d905944fda
name: emphysemaSeverity
label_de: Lungenemphysem – Ausprägung
definition_de: Emphysem-Ausprägung (kein, leicht < 25 %, mittel 25–50 %, schwer > 50 %); Nebenbefund und
  Brock-Eingang.
phase: screening
category: befund
datatype: CodeableConcept
cardinality: 0..1
value_set:
  binding_strength: required
  standard_binding_status: mapped
  notes: 'Editionen: SNOMED CT INT 20260701 und RadLex 4.2, alle Codes auf dem MII TermServ aktiv (Stand
    2026-10-15). Element-Code ist 87433001 als Befundfokus einer Bildbefund-Beobachtung (Interimslösung,
    da weder SNOMED noch LOINC 2.83 ein Observable für die radiologische Emphysem-Ausprägung haben); ausdrücklich
    keine Condition und keine COPD-Diagnose. RadLex RID4799 (bildgebungsnaher Befundbegriff ohne Krankheitssemantik)
    ist optionales Zusatz-Coding. Antwortwerte der Schweregradachse (geschlossene Liste, required) nach
    O''Dowd et al. 2023: kein = 260413007, leicht < 25 % = 255604002, mittel 25–50 % = 6736007, schwer
    > 50 % = 24484000; die Prozentschwellen stehen nur in der Elementdefinition. Getrennte, optionale
    Typ-Achse (Morphologie, nicht Teil der required-Schweregradliste): zentrilobulär 68328006 / RID28504,
    panazinär 4981000 / RID28519, paraseptal 31898008 / RID28520. COPD- und Emphysem-Diagnosen bleiben
    in comorbidity (ICD-10-GM). Für den Brock-Eingang (vorhanden/nicht vorhanden) wird kein → nicht vorhanden
    abgeleitet. Rollen der Codes: snomed-ct|87433001 = element; radlex|RID4799 = element; snomed-ct|260413007
    = wert; snomed-ct|255604002 = wert; snomed-ct|6736007 = wert; snomed-ct|24484000 = wert; snomed-ct|68328006
    = wert; snomed-ct|4981000 = wert; snomed-ct|31898008 = wert; radlex|RID28504 = wert; radlex|RID28519
    = wert; radlex|RID28520 = wert.'
  codings:
  - system: snomed-ct
    code: '87433001'
    display: Pulmonary emphysema
  - system: radlex
    code: RID4799
    display: emphysema
  - system: snomed-ct
    code: '260413007'
    display: None
  - system: snomed-ct
    code: '255604002'
    display: Mild
  - system: snomed-ct
    code: '6736007'
    display: Moderate severity
  - system: snomed-ct
    code: '24484000'
    display: Severe
  - system: snomed-ct
    code: '68328006'
    display: Centriacinar emphysema
  - system: snomed-ct
    code: '4981000'
    display: Panacinar emphysema
  - system: snomed-ct
    code: '31898008'
    display: Paraseptal emphysema
  - system: radlex
    code: RID28504
    display: centrilobular emphysema
  - system: radlex
    code: RID28519
    display: panacinar emphysema
  - system: radlex
    code: RID28520
    display: paraseptal emphysema
standard_mappings:
- standard: fhir-mii-kds
  profile_or_url: https://www.medizininformatik-initiative.de/fhir/ext/modul-bildgebung/StructureDefinition/mii-pr-bildgebung-radiologische-beobachtung
  resource: Observation
  path: Observation.code.coding:sct; Observation.value[x]; Observation.component; Observation.bodySite;
    Observation.category.coding:loinc
  notes: 'de.medizininformatikinitiative.kerndatensatz.bildgebung#2026.0.0, stabil. Bildbefund-Beobachtung,
    nicht Condition. code.coding:sct = 87433001 erfüllt das REQUIRED-Binding < 404684003 ($subsumes auf
    dem MII TermServ bestätigt). value = valueCodeableConcept mit der Schweregradstufe; optional Prozentanteil
    als component mit valueQuantity (UCUM %), wenn quantitativ befundet. bodySite (REQUIRED < 123037004)
    = 39607008 Lung structure. Hinweis ''keine COPD-Diagnose'' in Observation.note bzw. Definition. Ballot-Hinweis
    2027.0.0-ballot.1: value[x] dort nach Typ gesliced (valueCodeableConcept coding.system/code 1..1);
    code.coding:sct trägt den Pattern-Defekt ''http://snomed.info/sct|…/version/20260701'', als Ballot-Kommentar
    zu melden.'
- standard: other
  profile_or_url: https://fhir.kbv.de/StructureDefinition/KBV_PR_AW_Observation_Befund
  resource: Observation
  path: Observation.value[x] (nur valueString, 1..1); Observation.code.coding:kbv_code (fixed „Befund“);
    Observation.category (REQUIRED KBV_VS_AW_Befundart)
  notes: 'kbv.ita.aws#1.2.0, stabil (KBV-Archiv- und Wechselschnittstelle nach § 371 SGB V, nur Differential).
    Äquivalenz related, verlustbehaftet: Stufe nur als Freitext; category = Roentgenbefund (KBV_CS_AW_Befundart);
    note und bodySite sind 0..0. Prozentanteil nur als component mit LOINC-Code, ein passender Code ist
    nicht belegt.'
- standard: other
