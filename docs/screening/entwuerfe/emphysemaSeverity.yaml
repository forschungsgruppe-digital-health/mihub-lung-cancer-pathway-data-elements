  notes: 'ACR LCSR & IPN Data Dictionary, Stand 2026-05-28, nicht-FHIR. Äquivalenz broader/related: nur
    binär ab mittel (S-Modifier-Befund), ohne Prozentstufen; deckt sich mit der Schwelle zur Überweisung
