  path: Observation.code; Observation.value[x]; Observation.category:radiology
  notes: hl7.fhir.uv.ips#2.0.1, stabil, internationales Referenzmuster. code PREFERRED an LOINC-Radiologiecodes,
    SNOMED 87433001 als Alternative möglich; performer 1..* und effective[x] 1..1 Pflicht; category:radiology
    Pattern imaging.
- standard: other
  profile_or_url: http://hl7.eu/fhir/imaging/StructureDefinition/ObservationFindingEuImaging
