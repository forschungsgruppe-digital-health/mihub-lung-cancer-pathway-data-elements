id: mihub.lung.screening.coronaryArteryCalcification.v0.1
uuid: ddf193fc-2d81-546c-b58c-29f8d88c8b7e
name: coronaryArteryCalcification
label_de: Koronararterienverkalkung (visuell, optional Agatston)
definition_de: Koronarkalk visuell (keine, gering, mäßig, schwer), optional Agatston-Score, mit Empfehlung
  zur hausärztlichen Abklärung.
phase: screening
category: befund
datatype: CodeableConcept
cardinality: 0..1
value_set:
  binding_strength: required
  standard_binding_status: mapped
  notes: 'Editionen: SNOMED CT INT 20260701, RadLex 4.2 und DICOM 2025.3, alle Codes auf dem MII TermServ
    aktiv (Stand 2026-10-15). Element-Code ist das Observable 450360000 (Observation.code). 445512009
    (Disorder, Subtyp von 404684003 Clinical finding) ist ein alternativer Element-Code nur für MII-Bildgebungsprofile,
    deren Slice code.coding:sct Clinical findings verlangt; er ist kein Antwortwert. RadLex RID50146 ist
    ein optionales Zusatz-Coding für radiologische Befundsysteme. Antwortwerte (geschlossene Liste, required)
    sind die visuellen Stufen nach O''Dowd et al. 2023 Tab. 2: keine = 260413007, gering = 255604002,
    mäßig = 6736007, schwer = 24484000. Die Graduierung unter dem Score-Observable ist eine Modellierungsentscheidung
    des Projekts, keine SNOMED-Definition. Der optionale Agatston-Score ist eine dimensionslose Quantity
    (UCUM ''{score}'', gleichwertig zu ''1'') mit Instrument 450734004 (Skala) und Methode DCM 112055
    (Observation.method); beide gehören nicht zur Stufenliste. Die Empfehlung zur hausärztlichen Abklärung
    gehört zu incidentalFinding bzw. zur Überweisung. LOINC 2.83 enthält kein Observable für die visuelle
    CAC-Graduierung, nur Untersuchungscodes. Rollen der Codes: snomed-ct|450360000 = element; snomed-ct|445512009
    = element; radlex|RID50146 = element; snomed-ct|260413007 = wert; snomed-ct|255604002 = wert; snomed-ct|6736007
    = wert; snomed-ct|24484000 = wert; snomed-ct|450734004 = instrument; dicom-dcm|112055 = methode.'
  codings:
  - system: snomed-ct
    code: '450360000'
    display: Coronary artery calcium score
  - system: snomed-ct
    code: '445512009'
    display: Calcification of coronary artery
  - system: radlex
    code: RID50146
    display: coronary artery calcification
  - system: snomed-ct
    code: '260413007'
    display: None
  - system: snomed-ct
    code: '255604002'
    display: Mild
  - system: snomed-ct
    code: '6736007'
    display: Moderate severity
  - system: snomed-ct
    code: '24484000'
    display: Severe
  - system: snomed-ct
    code: '450734004'
    display: Coronary artery calcium score
  - system: dicom-dcm
    code: '112055'
    display: Agatston scoring method
standard_mappings:
- standard: fhir-mii-kds
  profile_or_url: https://www.medizininformatik-initiative.de/fhir/ext/modul-bildgebung/StructureDefinition/mii-pr-bildgebung-radiologische-beobachtung
  resource: Observation
  path: Observation.code.coding:sct; Observation.value[x]; Observation.component; Observation.bodySite;
    Observation.category.coding:loinc; Observation.partOf; Observation.derivedFrom
  notes: 'de.medizininformatikinitiative.kerndatensatz.bildgebung#2026.0.0, stabil. code.coding:sct ist
    REQUIRED an mii-vs-bildgebung-findings-sct (< 404684003 Clinical finding) gebunden: 445512009 ist
    zulässig, das Observable 450360000 nicht (beides per $subsumes auf dem MII TermServ bestätigt); 450360000
    daher nur als zusätzliches Coding außerhalb des sct-Slice bzw. gar nicht. value[x] ist 1..1: visuelle
    Stufe als valueCodeableConcept; ist nur ein Agatston-Score vorhanden, braucht es eine eigene Observation
    (siehe radiologische-messung) oder dataAbsentReason. Agatston-Score alternativ als component (component.code
    Example-Binding, valueQuantity). bodySite (REQUIRED < 123037004) = 41801008 Coronary artery structure.
    category.coding:loinc Pattern 18782-3; partOf → radiologische-befundungsprozedur; derivedFrom → ImagingStudy.'
- standard: fhir-mii-kds
  profile_or_url: https://www.medizininformatik-initiative.de/fhir/ext/modul-bildgebung/StructureDefinition/mii-pr-bildgebung-radiologische-messung
  resource: Observation
  path: Observation.code.coding:sct; Observation.valueQuantity (system Pattern http://unitsofmeasure.org);
    Observation.method.coding:sct; Observation.category.coding:sct (Pattern 122869004)
  notes: 'de.medizininformatikinitiative.kerndatensatz.bildgebung#2027.0.0-ballot.1, Ballot (nicht normativ).
    Nur für den Teilwert Agatston-Score; die visuelle Stufe bleibt bei radiologische-beobachtung. value[x]
    nur Quantity (unit, system, code 1..1), Einheit UCUM ''{score}'' bzw. ''1''. code.coding:sct verlangt
    einen Clinical-finding-Code (445512009), method = Agatston (SNOMED-Code ungeprüft; DICOM DCM 112055).
    Paketdefekt: patternCoding.system von code.coding:sct und method.coding:sct lautet ''http://snomed.info/sct|http://snomed.info/sct/900000000000207008/version/20260701''
    (System und Version in einer URI), sodass der Slice womöglich nicht greift.'
- standard: other
  profile_or_url: http://hl7.org/fhir/uv/ips/StructureDefinition/Observation-results-radiology-uv-ips
  resource: Observation
  path: Observation.code; Observation.value[x]; Observation.component.code; Observation.category:radiology
  notes: hl7.fhir.uv.ips#2.0.1, stabil, internationales Referenzmuster. code ist PREFERRED an LOINC-Radiologiecodes
    gebunden, SNOMED 450360000 als Alternative zulässig. category:radiology Pattern observation-category#imaging
    (1..1); effective[x] 1..1 und performer 1..* sind Pflicht. Agatston-Wert als valueQuantity bzw. component.
- standard: other
  profile_or_url: http://hl7.eu/fhir/imaging/StructureDefinition/ObservationFindingEuImaging
  resource: Observation
  path: Observation.code; Observation.value[x]; Observation.component
  notes: hl7.fhir.eu.imaging#1.0.0-ballot, Ballot/Draft (EHDS-Kontext). Angebunden über DiagnosticReportEuImaging.extension:finding
    (HL7IDRFinding). code nur Example-Binding; Stufe und Agatston-Score frei als value bzw. component;
    kein eigener Koronarkalk-Code.
- standard: dicom-sr
  profile_or_url: https://dicom.nema.org/medical/dicom/current/output/chtml/part16/sect_TID_3905.html
  resource: TID 3905 Calcium Scoring Results (in TID 3900 CT/MR Cardiovascular Analysis Report)
  path: 'Row 6: INCLUDE TID 300 mit $Measurement = (450360000, SCT, "Coronary artery calcium score"),
    $Method = (112055, DCM, "Agatston Scoring Method"), $Units = (1, UCUM); Row 2: Analysis Performed
    = (122603, DCM, "Calcium Scoring Analysis")'
  notes: DICOM PS3.16 2026d, nicht-FHIR. Nur für den Teilwert Agatston-Score; eine Werteliste für die
    visuelle Stufe fehlt. Die Vorlage gehört zum kardialen CT-Bericht (TID 3900), nicht zum Lungen-Screening-Bericht;
    sie verwendet den Element-Code 450360000 ausdrücklich.
- standard: other
  profile_or_url: https://nrdrsupport.acr.org/support/solutions/articles/11000041247
  resource: ACR LCSR & IPN Data Dictionary, Datenelemente 153/154
  path: '#153 Other clinically significant abnormalities – S-Modifier (Yes/No); #154 Antwort „Coronary
    arterial calcification moderate or severe“'
  notes: 'ACR LCSR & IPN Data Dictionary, Stand 2026-05-28, nicht-FHIR (US-Register). Äquivalenz broader/related:
    erfasst nur binär ab mäßig (mäßig/schwer → ja), ohne vierstufige Skala und ohne Agatston-Score; Anschluss
    an Lung-RADS v2022 Note 15.'
- standard: openehr-archetype
  profile_or_url: openEHR-EHR-OBSERVATION.imaging_exam_result.v1
  resource: OBSERVATION
  path: /data[at0001]/events[at0002]/data[at0003]/items[at0044] (Structured imaging findings, CLUSTER-Slot)
    bzw. items[at0008] (Imaging findings, DV_TEXT)
  notes: openEHR CKM (CKM-mirror master, Stand 2026-10-15), Lifecycle published, nicht-FHIR. Kein Koronarkalk-CLUSTER
    vorhanden; die Stufe als lokalen CLUSTER im Slot at0044 modellieren.
