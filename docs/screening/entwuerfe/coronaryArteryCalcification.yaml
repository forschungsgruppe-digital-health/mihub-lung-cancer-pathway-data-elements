issues:
- 'Verbindlichkeit nach Gegenprüfung: Leitlinie. DRG/DGP/DGT-Supplement Tab. S1 Anm. 15 („sollten routinemäßig
  … angegeben werden“); Skala und Empfehlung nach O’Dowd et al. 2023 (Tab. 2).'
- 'Umsetzung: Spezialisierung von incidentalFinding. Element-Code als Observable SNOMED 450360000; Wert
  = visuelle Stufe keine | gering | mäßig | schwer (lokales Ordinal-ValueSet, no-standard-found; Quelle
  O’Dowd 2023 Tab. 2); Agatston-Score als optionale, alternative Komponente (Quantity); 445512009 nur
  als Befundwert bei vorhandenem Kalk. Die Empfehlung (hausärztliche Abklärung des kardiovaskulären Risikos
  bei mäßigem oder schwerem Koronarkalk) gehört in die Empfehlungskomponente von incidentalFinding bzw.
  in die Überweisung, nicht ins Element. specializes incidentalFinding.'
- Für die visuelle Koronarkalk-Graduierung (keine | gering | mäßig | schwer) gibt es weder in SNOMED CT
  noch in LOINC ein eigenes Observable oder ValueSet; die Nutzung des Score-Observables 450360000 mit
  Qualifier-Werten ist eine Projektentscheidung, die bestätigt werden muss.
- Der Element-Code 450360000 ist mit dem REQUIRED-Binding der MII-Bildgebungsprofile (code.coding:sct
  < 404684003) unvereinbar; für die MII-Abbildung muss 445512009 verwendet werden – es ist festzulegen,
  welcher Code im Datenelement führend ist.
- Für den Agatston-Score existiert kein eigener SNOMED- oder LOINC-Code; die Einheit ('{score}' bzw. '1')
  ist projektweit einheitlich festzulegen.
- Ist nur ein Agatston-Score ohne visuelle Stufe vorhanden, ist wegen value[x] 1..1 im MII-Profil eine
  eigene Messungs-Observation nötig; die Modellierung (component vs. separate Observation) ist zu entscheiden.
- Der Systemschlüssel 'radlex' (http://radlex.org) muss in der Schema-Beschreibung von value_set.codings[].system
  ergänzt werden, falls noch nicht geschehen.
- Der Pattern-Defekt (System mit Versionsanhang) im MII-Bildgebungsmodul 2027.0.0-ballot.1 sollte als
  Ballot-Kommentar gemeldet werden.
