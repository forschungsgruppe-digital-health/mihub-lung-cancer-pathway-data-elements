issues:
- 'Verbindlichkeit nach Gegenprüfung: Leitlinie. Messregeln: DRG/DGP/DGT-Supplement Tab. S1 Anm. 4, Lung-RADS
  Note 4. Die Volumetrie ist als CAD-Funktion vorgeschrieben (Anlage), der einzelne Messwert als Befundfeld
  nicht.'
- 'Umsetzung: Teil von pulmonaryNoduleFinding (Aufteilung empfohlen). Aufteilen: noduleVolume (mm3, SNOMED
  118565006) und noduleMeanDiameter (mm, eine Dezimale; SNOMED 81827009; Methode Mittel aus Lang- und
  Kurzachse); die solide Komponente teilsolider Herde als Komponente mit Qualifier gesamt/solide. Rangfolge
  in der Definition festhalten: Volumen ist Primärmaß, Durchmesser nur, wenn Volumetrie technisch nicht
  möglich ist. isPartOf pulmonaryNoduleFinding; dependsOn cadAnalysisReport.'
- Die empfohlene Aufteilung in noduleVolume (mm3) und noduleMeanDiameter (mm) ist zu entscheiden; die
  Rangfolge (Volumen als Primärmaß, Durchmesser nur ersatzweise) gehört in die Definition.
- SNOMED CT und LOINC haben kein präkoordiniertes Observable für Rundherdvolumen oder mittleren Rundherddurchmesser;
  Postkoordination oder lokale Komponenten-Codes sind nötig.
- Zu prüfen ist, ob für den Durchmesser 439984002 |Diameter of structure by imaging measurement| (observable
  entity, im MII-Ballot-Beispiel verwendet) als Element-Code geeigneter ist als 246120007 mit Qualifier.
- Im stabilen MII-Profil 2026.0.0 ist kein SNOMED-Observable als Observation.code zulässig (Bindung an
  Clinical finding); ein Ballot-Kommentar an MII Bildgebung ist zu stellen.
- Für die solide Komponente teilsolider Herde gibt es weder einen SNOMED-/LOINC-Code noch eine Profilkomponente.
- Für die Messmethode 'Mittelwert aus Lang- und Kurzachse, eine Dezimale' existiert kein Standardcode.
