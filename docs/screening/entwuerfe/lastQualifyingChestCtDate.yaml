issues:
- 'Verbindlichkeit nach Gegenprüfung: Pflicht. Zulässig nur, wenn die letzte befundungsgeeignete Lungen-CT
  mindestens zwölf Monate zurückliegt: LuKrFrühErkV § 2 Abs. 1 Nr. 2; KFE-RL § 38 Abs. 2; Ausnahme nach
  kontrollbedürftigem Befund (§ 2 Abs. 2). Die Vorlagen führen das Kriterium nur als Ja/Nein.'
- 'Umsetzung: Erweiterung von ctThoraxScan (Thorax-CT-Vorgeschichte). Als Erweiterung von ctThoraxScan
  modellieren (phasenübergreifende Thorax-CT-Vorgeschichte oder Screening-Spezialisierung mit specializes):
  Datum (Teilpräzision zulässig), Anlass/Herkunft (Screening | andere Indikation | extern/anamnestisch),
  Qualifier „befundungsgeeignet für Lungenkarzinom“ (boolean), Verweis auf diagnosticReportDocument bzw.
  ImagingStudy mit Befundkategorie (für § 2 Abs. 2). „Letzte“ als Abfrage, die 12-Monats-Regel als Constraint
  in eligibilityCheckResult. Label „befundungsgeeignete Lungen-CT“. KFE-RL § 38 Abs. 2 und TrG zu § 38
  Abs. 2 ergänzen.'
- Für den Qualifier 'qualitativ zur Befundung im Hinblick auf ein Lungenkarzinom geeignet' (LuKrFrühErkV
  § 2 Abs. 1 Nr. 2; KFE-RL § 38 Abs. 2) gibt es weder einen SNOMED-/LOINC-Code noch ein FHIR-Element;
  zu entscheiden ist zwischen einer lokalen Extension am Prozedur-Profil und einer eigenen Observation.
- Die Anlass-Werte 'andere Indikation' und 'extern/anamnestisch' haben keinen Standardcode und bleiben
  lokal; eine standardisierte Werteliste für Procedure.reasonCode fehlt.
- Die Ableitung 'letzte CT' und die 12-Monats-Frist sind in keinem Standard vorgesehen und müssen als
  Abfrage bzw. Constraint in eligibilityCheckResult umgesetzt werden.
- Die Umsetzung als specializes von ctThoraxScan (phasenübergreifende Thorax-CT-Vorgeschichte) ist noch
  zu bestätigen.
- Ob KBV-Basisprofile (kbv.basis) künftig unter dem Schlüssel kbv-mio geführt werden, ist als Katalog-Konvention
  festzulegen (bisher nur MIO- und eAU-Profile).
