name: eligibilityCheckResult
label_de: Ergebnis der Zulässigkeitsprüfung in der Praxis
definition_de: Ergebnis der Prüfung nach § 2 je Kriterium und gesamt mit Datum; bei Nichterfüllung strukturierter
  Absagegrund.
phase: screening
category: assessment
datatype: CodeableConcept
cardinality: 1..*
value_set:
  binding_strength: example
  standard_binding_status: pending-mapping
  notes: 'SNOMED CT INT 20260701 (MII TermServ), Stand 2026-10-15. Element-Code (Näherung): 472061000124107
    Evaluation of eligibility for program für die Prüfung der Anspruchsberechtigung nach § 2 LuKrFrühErkV;
    das Ergebnis steht in Observation.value. Antwortwerte für das Gesamtergebnis je Runde als lokale Werteliste:
    erfüllt | nicht erfüllt | Nachweis unvollständig. Absagegrund 0..* (optional, lokal) mit den Teilmappings
    1303300002 (Alter außerhalb 50–75 Jahre) und 1303301003 (medizinisch nicht geeignet, wie in medicalSuitabilityProfile).
    Einzelkriterien werden per dependsOn bzw. derivedFrom verknüpft und nicht doppelt kodiert (Alter aus
    dem Geburtsdatum, Rauchstopp aus den Konsumabschnitten, lastQualifyingChestCtDate, symptomAndLungCancerCareStatus,
    medicalSuitabilityProfile). Nicht verwenden: LOINC LA185-1, SNOMED 171108006 und 444734003 (anderer
    Kontext). Rollen der Codes: snomed-ct|472061000124107 = element; local-no-standard-binding|criteria-met
    = wert; local-no-standard-binding|criteria-not-met = wert; local-no-standard-binding|evidence-incomplete
    = wert; snomed-ct|1303300002 = wert; snomed-ct|1303301003 = wert.'
  codings:
  - system: snomed-ct
    code: '472061000124107'
    display: Evaluation of eligibility for program
  - system: local-no-standard-binding
    code: criteria-met
    display: erfüllt
  - system: local-no-standard-binding
    code: criteria-not-met
    display: nicht erfüllt
  - system: local-no-standard-binding
    code: evidence-incomplete
    display: Nachweis unvollständig
  - system: snomed-ct
    code: '1303300002'
    display: Not suitable for procedure due to age
  - system: snomed-ct
    code: '1303301003'
    display: Not suitable for procedure due to disease
standard_mappings:
- standard: fhir-r4-base
  profile_or_url: http://hl7.org/fhir/StructureDefinition/Observation
  resource: Observation
  path: Observation.value[x]
  notes: 'hl7.fhir.r4.core#4.0.1 (stabil). Hauptziel für das Gesamtergebnis je Runde: valueCodeableConcept
    mit der lokalen Werteliste; effective[x] = Prüfdatum; performer = berichterstellende Ärzt:in bzw.
    Erstbefunder; component 0..* für den optionalen Absagegrund; derivedFrom 0..* auf die Einzelkriterien
    (smokingStatusScreening, creditableSmokingDurationYears, packYearsCalculated, lastQualifyingChestCtDate,
    symptomAndLungCancerCareStatus, medicalSuitabilityProfile). Die Prüfung durch den Erstbefunder (LuKrFrühErkV
    § 3 Nr. 1) über care_process.data_flows abbilden, nicht als eigene Ressource.'
- standard: other
  profile_or_url: http://hl7.org/fhir/us/core/StructureDefinition/us-core-observation-screening-assessment
  resource: Observation
  path: Observation.value[x]; Observation.derivedFrom
  notes: hl7.fhir.us.core#9.0.0 (stabil; US-Muster, nicht als Ziel übernehmen). Referenzmuster für ein
    Gesamtergebnis aus Einzelbewertungen (derivedFrom und hasMember 0..* MS); category:survey 1..1 und
    die US-VSAC-Bindung von code passen nicht zu einer ärztlichen Zulässigkeitsprüfung.
