issues:
- 'Verbindlichkeit nach Gegenprüfung: Pflicht. Pflicht ist nur die positive Bestätigung der erfüllten
  Kriterien im Bericht (LuKrFrühErkV § 2 Abs. 1 S. 1 Nr. 3 Buchst. a/b; KFE-RL § 38, § 39 Nr. 1, § 40
  S. 3). Die Zulässigkeitsprüfung des Erstbefunders regeln LuKrFrühErkV § 3 Nr. 1 und KFE-RL § 41 Abs.
  1. Negatives Ergebnis und Absagegrund haben keine Rechtsgrundlage.'
- 'Umsetzung: eigenständig (Gesamtergebnis; Rolle Erstbefunder über data_flows). Auf das Gesamtergebnis
  je Runde reduzieren (lokale Werteliste: erfüllt | nicht erfüllt | Nachweis unvollständig), dazu Absagegrund
  0..* (lokal, optional) und Datum (Observation.effective). Einzelkriterien per dependsOn verknüpfen statt
  doppelt führen; Alter aus dem Geburtsdatum, Rauchstopp aus den Konsumabschnitten ableiten. Umbenennen
  in „Ergebnis der Prüfung der Anspruchsberechtigung“. Die Prüfung durch den Erstbefunder (Zulässigkeit,
  Aktualitätsrückfrage nach TrG) über care_process.data_flows abbilden (usage_type validate, system ris-pacs).
  KBV PraxisInfoSpezial nur als Sekundärbeleg.'
- Es fehlen Standardkonzepte 'Meets/Does not meet eligibility criteria for lung cancer screening' sowie
  'Nachweis unvollständig'; die Werteliste bleibt lokal.
- 'Absagegründe ohne Standardcode: Rauchanamnese unter 25 Packungsjahren bzw. zu kurz, Rauchstopp länger
  als 10 Jahre zurück, letzte befundungsgeeignete CT innerhalb von 12 Monaten, Symptome bzw. Verdacht,
  laufende Behandlung; ob sie als lokale Werte geführt werden, ist zu entscheiden.'
- Kein Profil in MII KDS, ISiK, KBV, ePA, IPS oder mCODE bildet das Ergebnis der Anspruchsprüfung nach
  LuKrFrühErkV § 2 und KFE-RL §§ 38–40 ab. Das ACR LCSR Data Dictionary führt nur Einzelkriterien (Items
  124–126 und 131 im Abschnitt Appropriateness of Screening, Item 138 im Abschnitt About the Exam), kein
  Gesamtergebnis; NHS LCSDS ist nicht ausgewertet.
- Rechtsgrundlage ist nur die positive Bestätigung der erfüllten Kriterien im Bericht; ob negatives Ergebnis
  und Absagegrund überhaupt erfasst werden, ist fachlich zu entscheiden. Umbenennung in 'Ergebnis der
  Prüfung der Anspruchsberechtigung' und Kardinalität 1..* je Episode sind zu bestätigen.
- Kardinalität laut Quelle 1..* je Episode.
