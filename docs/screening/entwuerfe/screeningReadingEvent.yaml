name: screeningReadingEvent
label_de: Befundungsvorgang (Rolle, ohne/mit CAD, Software, Person)
definition_de: Befundungsschritt mit Rolle (Erst-/Zweitbefunder), Modus (ohne, dann mit CAD), Zeitpunkt,
  Person und Software-Version; Zweitbefund unabhängig.
phase: screening
category: prozedur
datatype: Reference
cardinality: 1..*
value_set:
  binding_strength: preferred
  standard_binding_status: mapped
  notes: 'Element-Code SNOMED 28191001 (Procedure.code) und Kategorie SNOMED 363679005 Imaging (Procedure.category)
    wie im MII-Profil radiologische-befundungsprozedur, damit die Instanzen KDS-konform bleiben; die Semantik
    (Parent 11429006 Consultation) wird zugunsten der MII-Kompatibilität akzeptiert. Bei MII-Konformität
    ist der Display des Profil-Patterns zu führen („Consultation and report by radiologist (procedure)“),
    ab Bildgebung 2027 mit fixierter SNOMED-Version 20260701. DCM 110005 Interpretation als RIS/PACS-Workitem-Mapping
    (CID 9231). Methode „mit CAD“: SNOMED 133883001 bzw. RadLex RID45702. Antwortwert SNOMED 66862007
    Radiologist für performer.function bzw. Fachrichtung; Erst- und Zweitbefunder unterscheidet er nicht
    (lokale Rollen-Codes nötig). Editionen: MII TermServ, SNOMED CT 20260701, DICOM 2025.3, RadLex 4.2;
    Stand 2026-10-15. Rollen der Codes: snomed-ct|28191001 = element; snomed-ct|363679005 = element; dicom-dcm|110005
    = element; snomed-ct|133883001 = methode; radlex|RID45702 = methode; snomed-ct|66862007 = wert.'
  codings:
  - system: snomed-ct
    code: '28191001'
    display: Consultation and report by radiologist
  - system: snomed-ct
    code: '363679005'
    display: Imaging
  - system: dicom-dcm
    code: '110005'
    display: Interpretation
  - system: snomed-ct
    code: '133883001'
    display: Computer assisted image analysis
  - system: radlex
    code: RID45702
    display: computer-aided detection
  - system: snomed-ct
    code: '66862007'
    display: Radiologist
standard_mappings:
- standard: fhir-mii-kds
  profile_or_url: https://www.medizininformatik-initiative.de/fhir/ext/modul-bildgebung/StructureDefinition/mii-pr-bildgebung-radiologische-befundungsprozedur
  resource: Procedure
  path: Procedure.performed[x]
  notes: 'de.medizininformatikinitiative.kerndatensatz.bildgebung#2026.0.0, stabil. Eine Procedure je
    Befundungsschritt: code.coding:sct Pattern 28191001, category.coding:sct 363679005, performed[x] 1..1
    MS (Zeitpunkt), performer.actor (Person), performer.function für Erst- bzw. Zweitbefunder (ohne Binding,
    lokales Coding), usedReference auf mii-pr-bildgebung-geraet (CAD-Software mit Version), partOf auf
    die Bildgebungsprozedur der LDCT. report 1..* MS verlangt einen Befund (DiagnosticReport radiologischer-befund)
    je Befundungsprozedur; readerAssessmentCategory hängt dort an. Der Modus „zunächst ohne, dann mit
    CAD“ hat kein Element (Extension oder zwei Zeitstempel).'
