issues:
- 'Verbindlichkeit nach Gegenprüfung: Pflicht. Verfahren LuKrFrühErkV § 5 Abs. 1–2; Dokumentation KFE-RL
  § 44 S. 1, QS-Vereinbarung § 13f, StrlSchG § 85 Abs. 1 S. 2 Nr. 4; Mindestzahlen „befunden und dokumentieren“
  § 6 Abs. 1 S. 2 und Abs. 2 S. 2. Software-Version und Zeitpunkt sind nicht normiert (S3 Empf. 5.8).'
- 'Umsetzung: eigenständig (Procedure je Befundung). Rolle, Zeitpunkt und Person nur hier führen; readerAssessmentCategory
  trägt nur die Kategorie (Verknüpfung über Procedure.report). „Erst ohne, dann mit CAD“ als Attribut
  (Flag oder zwei Zeitstempel) statt mindestens zwei Instanzen (das Schema erlaubt kein 2..*). CAD-Software
  als Device-Referenz, konsistent mit cadAnalysisReport. Mapping: …/fhir/ext/modul-bildgebung/StructureDefinition/mii-pr-bildgebung-radiologische-befundungsprozedur.
  Die gemeinsame Beurteilung (§ 5 Abs. 3) über screeningResultCategory abgrenzen. Code 28191001 semantisch
  prüfen (Elternkonzept „Consultation“).'
- Für die Rollen Erstbefunder und Zweitbefunder (LuKrFrühErkV § 5, KFE-RL § 44) gibt es keinen Standardcode;
  lokale Codes für performer.function sind festzulegen.
- Der Lesemodus „zunächst ohne, dann mit CAD“ ist als Attribut (Flag oder zwei Zeitstempel bzw. Extension)
  zu modellieren, da das Schema kein 2..* je Phase erlaubt.
- Die Semantik von SNOMED 28191001 (Parent Consultation) ist fachlich zu bestätigen; sie wird wegen des
  MII-Patterns beibehalten.
- Die gemeinsame Beurteilung nach § 5 Abs. 3 LuKrFrühErkV ist über screeningResultCategory abzugrenzen;
  die Unabhängigkeit der Zweitbefundung und die Mindestzahlen nach § 6 bildet kein Standard ab.
- Die Systemschlüssel dicom-dcm und radlex sind in der Terminologieprüfung des Repos zu hinterlegen.
- Kardinalität laut Quelle 0..* je Phase (≥ 1 je LDCT).
