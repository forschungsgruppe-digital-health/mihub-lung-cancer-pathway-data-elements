name: cigarettesPerDayInPeriod
label_de: Zigaretten pro Tag im Jahresdurchschnitt je Konsumabschnitt
definition_de: Im Jahresdurchschnitt pro Tag gerauchte Zigaretten je Konsumabschnitt; Basis der Packungsjahre
  (÷ 20), NELSON-Kriterien und PLCOm2012.
phase: screening
category: sozialanamnese
datatype: Quantity
cardinality: 1..*
unit: /d
value_set:
  binding_strength: preferred
  standard_binding_status: mapped
  notes: 'MII TermServ, SNOMED CT 20260701, LOINC 2.83, UCUM (TermServ-Fragment); Stand 2026-10-15. Elementcode
    ist 230056004 ''Cigarette consumption'' (Näherung), in derselben Observation wie der Konsumabschnitt
    (effectivePeriod). LOINC 64219-9 hat den Status TRIAL (PhenX) und ist nur Mapping für die Variante
    ''Durchschnitt über die gesamte Rauchdauer'', nicht für Werte je Abschnitt. Einheit /d oder {#}/d
    (beide im TermServ-Fragment gültig, eine davon festlegen); das MII-Kardiologie-Ballot verlangt per
    Pattern {cigarettes-per-day}, das das TermServ-Fragment nicht enthält, nach UCUM-Grammatik aber zulässig
    ist. Verworfen: LOINC 63640-7 (Nominalskala, Fagerström-Antwortliste LL1447-3, keine Mengenangabe),
    8663-7 (aktuelle Packungen pro Tag), 64218-1 (nur aktueller Konsum). Rollen der Codes: snomed-ct|230056004
    = element; loinc|64219-9 = element.'
  codings:
  - system: snomed-ct
    code: '230056004'
    display: Cigarette consumption
  - system: loinc
    code: 64219-9
    display: On the average of the entire time you smoked, how many cigarettes did you smoke per day [PhenX]
standard_mappings:
- standard: fhir-mii-kds
  profile_or_url: https://www.medizininformatik-initiative.de/fhir/ext/modul-kardio/StructureDefinition/mii-pr-kardio-observation-rauchen
  resource: Observation
  path: Observation.component:zigarettenProTag.valueQuantity
  notes: de.medizininformatikinitiative.kerndatensatz.kardiologie#2027.0.0-ballot, Ballot. Slice zigarettenProTag
    0..*, code Pattern LOINC 63640-7, valueQuantity 1..1 mit Pattern UCUM {cigarettes-per-day}, mustSupport
    value und comparator. Die Komponente hat keinen eigenen Zeitraum und gilt für effective[x] der ganzen
    Observation; das Profil bildet daher nur eine Intensität je Observation ab (ein Abschnitt oder ein
    gemittelter Wert). Bei Abbildung Einheit {cigarettes-per-day} setzen. Der Pattern-Code 63640-7 ist
    in LOINC nominal skaliert und passt nicht zu einer Quantity.
- standard: fhir-isik
  profile_or_url: https://gematik.de/fhir/isik/StructureDefinition/ISiKLebensZustand
  resource: Observation
  path: Observation.valueQuantity
  notes: 'de.gematik.isik#6.0.0, stabil; nur Ableitungsbasis (in 6.0.0 abstrakt), Teil desselben abgeleiteten
    Profils wie cigaretteConsumptionPeriod: valueQuantity Zigaretten pro Tag bei effectivePeriod = Abschnitt;
    value[x] ist offen nach Typ gesliced, min 1. Ein LOINC-Coding ist Pflicht; ein passender Code für
    Zigaretten pro Tag je Abschnitt fehlt (63640-7 nominal, 64219-9 TRIAL und nur Lebenszeitdurchschnitt,
    8663-7 aktuelle Packungen).'
- standard: openehr-archetype
  profile_or_url: https://raw.githubusercontent.com/openEHR/CKM-mirror/master/local/archetypes/entry/evaluation/openEHR-EHR-EVALUATION.tobacco_smoking_summary.v2.adl
  resource: openEHR-EHR-EVALUATION.tobacco_smoking_summary.v2
  path: /data[at0001]/items[at0029]/items[at0064]/items[at0023] (Typical use (units))
  notes: openEHR CKM, Revision 2.0.1, published, nicht-FHIR. DV_QUANTITY je Episode mit Einheiten 1/d
    oder 1/wk (Anzahl Zigaretten), passt zu isPartOf cigaretteConsumptionPeriod. Die Alternativeinheit
    g/d gilt für losen Tabak und ist hier ausgeschlossen. Der Jahresdurchschnitt nach § 1 Abs. 2 S. 2
    LuKrFrühErkV ist nicht explizit und gehört ins Protokoll bzw. in instruction_de.
