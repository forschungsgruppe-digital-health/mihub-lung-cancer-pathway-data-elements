issues:
- 'Verbindlichkeit nach Gegenprüfung: mittelbar. LuKrFrühErkV § 1 Abs. 2 S. 2 (im Jahresdurchschnitt pro
  Tag gerauchte Zigaretten, geteilt durch 20); KFE-RL § 39 Nr. 1. S3 Statement 5.2 ist ein Statement (ST,
  LoE 1) mit NELSON-Schwellen, keine Empfehlung.'
- 'Umsetzung: Teil von cigaretteConsumptionPeriod. isPartOf cigaretteConsumptionPeriod; Einheit UCUM „/d“
  bzw. „{Zigaretten}/d“, Jahresdurchschnitt in instruction_de erläutern. Primärquelle auf LuKrFrühErkV
  § 1 Abs. 2 S. 2 umstellen; S3 5.2 als Statement für die NELSON-Schwellen führen. NELSON-Ableitung (≥
  15 Zigaretten/Tag über ≥ 25 Jahre bzw. ≥ 10 über ≥ 30 Jahre) und Packungsjahre als abgeleitete Größen
  beim Packungsjahr-Element führen; die Ableitungsregel bei wechselnder Intensität ist offen (E1). Für
  PLCOm2012 wäre eine eigene Primärquelle nötig.'
- Kein SNOMED- oder LOINC-Konzept beschreibt die im Jahresdurchschnitt pro Tag gerauchten Zigaretten je
  Konsumabschnitt (Zählweise nach § 1 Abs. 2 S. 2 LuKrFrühErkV); 230056004 ist nur eine Näherung.
- 'Die Einheit ist festzulegen: /d bzw. {#}/d (im TermServ-Fragment gültig) oder {cigarettes-per-day}
  (Pattern im MII-Kardiologie-Ballot).'
- Das MII-Kardiologie-Ballot verwendet LOINC 63640-7 (nominal, Fagerström-Kategorien) als Code einer Quantity-Komponente;
  dieser Modellierungsfehler sollte im Ballot gemeldet werden.
- Für ein von ISiKLebensZustand abgeleitetes Profil fehlt ein geeigneter LOINC-Pflichtcode.
- Die Ableitungsregel bei wechselnder Intensität innerhalb eines Abschnitts (Entscheidung E1) ist offen;
  für die NELSON-Schwellen und PLCOm2012 fehlt eine Primärquelle in den Elementen.
- Kardinalität laut Quelle 1..1 je Abschnitt (insgesamt 1..*).
