issues:
- 'Verbindlichkeit nach Gegenprüfung: Leitlinie. Nicht anrechenbar (Begründung zur LuKrFrühErkV, zitiert
  in den TrG, S. 17). Erfassungsempfehlung: S3-LL Rauchen und Tabakabhängigkeit Empf. 3.3.3.1 (A; Teil
  „verwandte Produkte“ als Konsenspunkt; Gültigkeit abgelaufen, in Überarbeitung). S3-LL Lungenkarzinom
  Empf. 4.2 gilt nur für Erkrankte.'
- 'Umsetzung: eigenständig (Raucheranamnese Q3). Als 0..*-Produktelement behalten. LOINC 81228-9 nur als
  Fragecode, Werte über SNOMED CT (722499006, 1388653002; Nikotinbeutel lokal). Produktliste mit der Quelle
  abgleichen (Nikotinpflaster bewusst ein- oder ausschließen). E-Zigarette und Passivrauch aus dem Status
  nehmen (smokingStatusScreening, perspektivisch smokingStatus) und den smokingStatus-Issue „verwandte
  Produkte“ über related_elements hierauf auflösen. Fundstelle präzisieren: TrG „Zu § 39 Nr. 1 Satz 1
  2. Halbsatz – Begriffserläuterung Zigarettenkonsum“, S. 17.'
- Zu entscheiden ist, ob ein einziger Elementcode (647981000005104, Näherung) oder zwei Kopfcodes je Produktklasse
  (53661000146106 für Tabak, 647981000005104 für tabakfreie Nikotinprodukte) verwendet werden.
- SNOMED CT 20260701 hat kein Konzept für aktuelle Nutzer:innen von Nikotinbeuteln (nur 584021000052104
  'Ex-user of nicotine pouches' und das Observable 584011000052107); der lokale Code oder 722494001 ist
  nötig.
- Ob Nikotinersatzpräparate (z. B. Pflaster, Kaugummi) bewusst ein- oder ausgeschlossen werden, ist fachlich
  offen und mit der Produktliste der Quelle abzugleichen.
- Ob selbstgedrehte Zigaretten als Zigaretten im Sinne der LuKrFrühErkV zählen oder hierher gehören, ist
  offen.
- Kein FHIR-Profil (MII, ISiK, IPS, US Core, KBV, gematik ePA) bildet E-Zigarette, Tabakerhitzer oder
  Nikotinbeutel ab; ein eigenes, von ISiKLebensZustand abgeleitetes Profil ist nötig.
- E-Zigarette und Passivrauch sind aus dem Rauchstatus zu entfernen und über related_elements auf dieses
  Element bzw. ein Expositionselement zu verweisen.
