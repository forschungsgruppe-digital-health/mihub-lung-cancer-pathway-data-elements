standard_mappings:
- standard: fhir-isik
  profile_or_url: https://gematik.de/fhir/isik/StructureDefinition/ISiKLebensZustand
  resource: Observation
  path: Observation.valueCodeableConcept
  notes: 'de.gematik.isik#6.0.0, stabil; nur Ableitungsbasis (in 6.0.0 abstrakt, LOINC-Coding Pflicht,
    value[x] offen gesliced, min 1). Eine Observation je Produkt: code.coding:loinc 81228-9 (bzw. 105045-9
    für E-Zigaretten), valueCodeableConcept mit den SNOMED-Werten des Elements und dem lokalen Nikotinbeutel-Code.
    LL3975-1 ist als Antwortliste zu eng. ISiKRaucherStatus ist ungeeignet, weil sein required-ValueSet
    nur den Raucherstatus enthält.'
- standard: openehr-archetype
  profile_or_url: https://raw.githubusercontent.com/openEHR/CKM-mirror/master/local/archetypes/entry/evaluation/openEHR-EHR-EVALUATION.tobacco_smoking_summary.v2.adl
  resource: openEHR-EHR-EVALUATION.tobacco_smoking_summary.v2
  path: /data[at0001]/items[at0029]/items[at0095] (Type)
  notes: 'openEHR CKM, Revision 2.0.1, published, nicht-FHIR. Typliste für Rauchprodukte: at0056 Cigars,
    at0066 Cigarillos, at0057 Pipe, at0062 Waterpipe, at0078 Bidis, at0088 Kreteks (at0054/at0055 Zigaretten
    gehören zu smokingStatusScreening). Laut misuse-Abschnitt nicht für rauchlosen Tabak und ausdrücklich
    nicht für ''e-cigarettes, nicotine patches or nicotine chewing gum''; E-Zigarette und Tabakerhitzer
    gehören nicht hierher.'
- standard: openehr-archetype
  profile_or_url: https://raw.githubusercontent.com/openEHR/CKM-mirror/master/local/archetypes/entry/evaluation/openEHR-EHR-EVALUATION.smokeless_tobacco_summary.v1.adl
  resource: openEHR-EHR-EVALUATION.smokeless_tobacco_summary.v1
  path: /data[at0001]/items[at0029]/items[at0098] (Type)
  notes: openEHR CKM, Revision 1.1.1, published, nicht-FHIR. Für rauchlosen Tabak (Kautabak, Schnupftabak,
    Snus) mit Status, Episoden und Overall years of use (at0099). Type at0098 ist DV_TEXT (frei, optional
    codierbar), keine Werteliste. Tabakfreie Nikotinbeutel liegen laut Scope-Text ('use of bags and additives
    has been left outside of scope') außerhalb des Archetyps.
- standard: openehr-archetype
  profile_or_url: https://raw.githubusercontent.com/openEHR/CKM-mirror/master/local/archetypes/entry/observation/openEHR-EHR-OBSERVATION.substance_use_screening.v1.adl
  resource: openEHR-EHR-OBSERVATION.substance_use_screening.v1
  path: /data[at0022]/events[at0023]/data[at0001]/items[at0026]/items[at0021] (Substance name)
  notes: 'openEHR CKM, Revision 1.0.3, published, nicht-FHIR. Generischer Screening-Fragebogen mit ''Used?''
    (at0024) und ''Last used'' (at0003) je Substanz; schließt laut Beschreibung Nikotin und Vaping-Liquids
    ein. Substance name ist DV_TEXT (frei); SNOMED-Werte sind nur optional als Codierung möglich. Damit
    abbildbar: E-Zigarette, Tabakerhitzer, Nikotinbeutel.'
