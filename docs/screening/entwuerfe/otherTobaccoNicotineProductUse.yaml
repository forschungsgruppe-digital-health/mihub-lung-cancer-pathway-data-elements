name: otherTobaccoNicotineProductUse
label_de: Weitere Tabak- und Nikotinprodukte (nicht anrechenbar)
definition_de: Konsum anderer Produkte als Zigaretten (Zigarre, Pfeife, Shisha, E-Zigarette, Tabakerhitzer,
  rauchloser Tabak, Nikotinbeutel); nicht anrechenbar.
phase: screening
category: sozialanamnese
datatype: CodeableConcept
cardinality: 0..*
value_set:
  binding_strength: extensible
  standard_binding_status: mapped
  notes: 'MII TermServ, SNOMED CT 20260701, LOINC 2.83; Stand 2026-10-15. Elementcodes (Observation.code):
    647981000005104 ''Use of nicotine'' für tabakfreie Nikotinprodukte (E-Zigarette, Nikotinbeutel) und
    53661000146106 ''Type of tobacco used'' für Tabakprodukte; 647981000005104 allein deckt Zigarre, Pfeife,
    Shisha und rauchlosen Tabak nur näherungsweise ab. LOINC 81228-9 (Antwortliste LL3975-1) und 105045-9
    (Antwortliste LL6587-1) sind Fragecode-Mappings. Antwortwerte (je Produkt ein Code, 0..*): SNOMED
    59978006 Zigarre, 82302008 Pfeife, 698289004 Shisha, 722499006 E-Zigarette (schließt nikotinfreie
    und Cannabis-E-Zigaretten ein), präziser 785889008 nikotinhaltige E-Zigarette, 1388653002 Tabakerhitzer
    (INT seit 2026-03), 713914004 rauchloser Tabak, 722494001 als generischer Ausweichwert für andere
    Nikotinprodukte; Nikotinbeutel lokal, weil SNOMED kein Konzept für aktuelle Nutzer:innen hat. LOINC-Antworten
    LA15333-0, LA26091-1, LA26092-9, LA34350-1 und LA34143-0 nur als Mapping; LA15332-2 ''Cigarettes''
    ist ausgeschlossen, Zigaretten stehen in smokingStatusScreening. Binding extensible, damit der lokale
    Nikotinbeutel-Code zulässig bleibt. Rollen der Codes: snomed-ct|647981000005104 = element; snomed-ct|53661000146106
    = element; loinc|81228-9 = element; loinc|105045-9 = element; snomed-ct|59978006 = wert; snomed-ct|82302008
    = wert; snomed-ct|698289004 = wert; snomed-ct|722499006 = wert; snomed-ct|785889008 = wert; snomed-ct|1388653002
    = wert; snomed-ct|713914004 = wert; snomed-ct|722494001 = wert; local-no-standard-binding|nikotinbeutel
    = wert; loinc|LA15333-0 = wert; loinc|LA26091-1 = wert; loinc|LA26092-9 = wert; loinc|LA34350-1 =
    wert; loinc|LA34143-0 = wert.'
