id: mihub.lung.screening.invasiveWorkupProcedure.v0.1
uuid: f9c74256-4d06-57bc-81d3-c3547bf9862b
name: invasiveWorkupProcedure
label_de: Folge- und Abklärungsmaßnahme nach Screeningbefund (inkl. Komplikation)
definition_de: Maßnahme nach Screeningbefund (CT, PET/CT, Bronchoskopie, Biopsie, Resektion) mit Datum,
  Dignität und Komplikationen.
phase: screening
category: prozedur
datatype: string
cardinality: 0..*
value_set:
  binding_strength: extensible
  standard_binding_status: mapped
  notes: 'MII TermServ, SNOMED CT 20260701, OPS 2026 (BfArM); Stand 2026-10-15. Element-Code 78603008
    ''Biopsy of lung'' als Oberbegriff; das Werte-Set ist als Aufzählung zu definieren, nicht als is-a
    78603008, weil die thorakoskopischen Keilresektionen keine Kinder von 78603008 sind. Antwortwerte
    Eingriffsart (Procedure.code), begrenzt auf invasive Verfahren nach S3 Empf. 5.12/5.13: 243685008
    (Bronchoskopie mit transbronchialer Biopsie), 429932001 (CT-gesteuerte Biopsie), 444188003 bzw. präziser
    1366310008 (thorakoskopische bzw. videoassistierte Keilresektion); nicht-invasive Bildgebung (CT,
    PET/CT) gehört nicht hierher. OPS-Parallelkodierung 1-430.2, 1-432.0, 5-322.g, 5-322.h; diese OPS-Codes
    sind nicht endständig, im Einzelfall ist der endständige Subcode zu kodieren (z. B. 1-430.20, 1-432.00,
    5-322.g1). Eigene, optionale Komplikationsachse (Procedure.complication, nicht Teil der Eingriffsart-Werte):
    116224001 (Oberbegriff), 871586006 (Pneumothorax), 12202101000119100 (Nachblutung), 130091000119103
    (Fieber). Die Dignität gehört zu workupOutcome. Rollen der Codes: snomed-ct|78603008 = element; snomed-ct|243685008
    = wert; snomed-ct|429932001 = wert; snomed-ct|444188003 = wert; snomed-ct|1366310008 = wert; ops|1-430.2
    = wert; ops|1-432.0 = wert; ops|5-322.g = wert; ops|5-322.h = wert; snomed-ct|116224001 = wert; snomed-ct|871586006
    = wert; snomed-ct|12202101000119100 = wert; snomed-ct|130091000119103 = wert.'
