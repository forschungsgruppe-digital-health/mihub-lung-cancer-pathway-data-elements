issues:
- 'Verbindlichkeit nach Gegenprüfung: Leitlinie. S3 Empf. 5.13 („wünschenswert“: Anteil maligner Befunde
  an bioptierten bzw. resezierten Patienten); Verfahren nach Empf. 5.12 und TrG S. 21. Keine Quelle verlangt
  die Erfassung von Komplikationen.'
- 'Umsetzung: eigenständig; Grenzfall des Scopes. Dignität entfernen (gehört zu workupOutcome). Werteliste
  auf die invasiven Verfahren nach S3 Empf. 5.12/5.13 begrenzen (243685008, 429932001, 444188003; Oberbegriff
  78603008); nicht-invasive Bildgebung (CT, PET/CT) hier nicht aufnehmen. Datentyp Reference (Procedure:
  code, performedDateTime, complication) oder CodeableConcept nur für die Eingriffsart. Komplikationen
  als Procedure.complication (Schadensindikator des Screenings), nicht über postTherapyComplication; als
  lokal und optional kennzeichnen (die Versicherteninformation S. 9 informiert nur). dependsOn screeningCaseConference.'
- Für Komplikationen invasiver Screening-Diagnostik gibt es außerhalb von oBDS (nur Tumoroperationen)
  keinen strukturierten Katalog und keine Schweregradkodierung; die Komplikationserfassung ist eine lokale,
  optionale MiHUB-Festlegung, die keine Quelle verlangt.
- Es gibt kein screening-spezifisches Profil für Abklärungsmaßnahmen.
- Die OPS-Codes sind nur als nicht endständige Gruppierer erfasst; die Regel zur Wahl des endständigen
  Subcodes je Fall ist festzulegen.
- 'Zu entscheiden ist der Datentyp: Reference auf Procedure (mit Datum und Komplikation) oder CodeableConcept
  nur für die Eingriffsart.'
- Ein openEHR-Archetyp (z. B. Prozedur-ACTION) wurde nicht geprüft.
