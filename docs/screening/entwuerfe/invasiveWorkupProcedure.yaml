standard_mappings:
- standard: fhir-mii-kds
  profile_or_url: https://www.medizininformatik-initiative.de/fhir/core/modul-prozedur/StructureDefinition/Procedure
  resource: Procedure
  path: Procedure.code.coding:sct (0..1, MS, REQUIRED procedures-sct = descendent-of 71388002) | Procedure.code.coding:ops
    (0..1, REQUIRED mii-vs-prozedur-ops) | Procedure.performed[x] (1..1, dateTime|Period) | Procedure.category.coding:sct
    (preferred; 165197003 bzw. 387713003) | Procedure.complication (0..*, example) | Procedure.basedOn
    (CarePlan|ServiceRequest) | Procedure.reasonReference (Condition|Observation|Procedure|DiagnosticReport)
    | Procedure.report
  notes: de.medizininformatikinitiative.kerndatensatz.base#2026.0.1, stabil (Profil auch im Ballot 2027.0.0
    des base-Pakets). Primärziel. Eingriffsart über SNOMED 243685008, 429932001, 444188003 bzw. 1366310008
    (alle unter 71388002), bei Abrechnung zusätzlich OPS. Komplikationen in Procedure.complication (example-Bindung;
    SNOMED-Befunde bzw. ICD-10-GM). basedOn verweist auf den CarePlan der screeningCaseConference, reasonReference
    auf den abklärungsbedürftigen Screeningbefund. Die Dignität gehört zu workupOutcome.
- standard: fhir-mii-kds
  profile_or_url: https://www.medizininformatik-initiative.de/fhir/ext/modul-onko/StructureDefinition/mii-pr-onko-operation
  resource: Procedure
  path: Procedure.extension:Intention (1..1, MS, REQUIRED mii-vs-onko-operation-intention; D = diagnostisch)
    | Procedure.code.coding:ops / :sct (REQUIRED) | Procedure.performed[x] (1..1, nur dateTime) | Procedure.complication:compl_obds
    (REQUIRED mii-vs-onko-operation-komplikation; PNT, NAB, RNB, PLE, PEY, PMN, BSI, N, U) | Procedure.complication:compl_icd10
    | Procedure.reasonReference (mii-pr-onko-diagnose-primaertumor oder Condition) | Procedure.outcome
    (0..1, REQUIRED Residualstatus)
  notes: de.medizininformatikinitiative.kerndatensatz.onkologie#2026.0.3, stabil. Nur für die chirurgische
    Diagnosesicherung (thorakoskopische Keilresektion), wenn der Fall in die oBDS-Dokumentation übergeht;
    Intention D. Der oBDS-Komplikationskatalog bietet strukturierte, für die Lunge einschlägige Werte.
    reasonReference akzeptiert auch eine generische Condition; die Grenze ist der oBDS-Meldekontext (Tumoroperation),
    nicht ein fehlender Primärtumor-Bezug. performed[x] erlaubt hier nur dateTime, kein Period. Für Bronchoskopie
    und perkutane Biopsie das Basis-Prozedurprofil verwenden.
- standard: fhir-isik
  profile_or_url: https://gematik.de/fhir/isik/StructureDefinition/ISiKProzedur
  resource: Procedure
  path: Procedure.code (1.., MS) .coding:SNOMED-CT (REQUIRED ProzedurenCodesSCT = descendent-of 71388002)
    / .coding:OPS | Procedure.performed[x] (1.., dateTime|Period) | Procedure.category.coding:SNOMED-CT
    (preferred ProzedurenKategorieSCT) | Procedure.note (MS) | Procedure.encounter.reference (1.. falls
    encounter)
  notes: de.gematik.isik#6.0.0 (auch isik-basismodul#4.0.3), stabil; nur Differential (kein Snapshot im
    Paket). Für die stationäre Abklärung im Krankenhaus über die ISiK-Schnittstelle. Procedure.complication
    ist nicht profiliert, existiert aber als Basiselement.
- standard: other
  profile_or_url: https://fhir.kbv.de/StructureDefinition/KBV_PR_Base_Procedure
  resource: Procedure
  path: Procedure.code.coding:ops | Procedure.code.coding:snomed (REQUIRED KBV_VS_Base_Procedure_SNOMED_CT;
    system, version, code, display 1..) | Procedure.performed[x] (Slices DateTime, Period, Age)
  notes: kbv.basis#1.9.0, stabil; ambulantes KBV-Basisprofil (kein MIO, daher unter other). Nur Differential
    im Paket. Bei SNOMED sind version und display Pflicht. KBV_VS_Base_Procedure_SNOMED_CT liegt im Paket
    (compose is-a 71388002, SNOMED CT DE-Edition 20260515); die Eingriffscodes sind damit enthalten. Das
    MIO-Profil KBV_PR_MIO_NFD_Procedure (kbv.mio.patientenkurzakte#1.0.0) ist ungeeignet, weil es complication
    verbietet (0..0).
- standard: mcode
  profile_or_url: http://hl7.org/fhir/us/mcode/StructureDefinition/mcode-cancer-related-surgical-procedure
  resource: Procedure
  path: Procedure.code (1..1, MS, extensible mcode-cancer-related-surgical-procedure-vs = SNOMED descendent-of
    387713003 | CPT | ICD-10-PCS) | Procedure.performed[x] (0..1, MS) | Procedure.reasonReference (us-core-condition-problems-health-concerns)
    | Procedure.complication
  notes: hl7.fhir.us.mcode#4.0.0, stabil; nur internationales Referenzmuster für die chirurgische Resektion,
    die US-Core-Abhängigkeit ist für Deutschland nicht nutzbar. 444188003 und 243685008 liegen unter 387713003
    (Subsumption auf tx.fhir.org geprüft).
- standard: other
  profile_or_url: http://hl7.org/fhir/uv/ips/StructureDefinition/Procedure-uv-ips
  resource: Procedure
  path: Procedure.code (1..1, MS, preferred procedures-uv-ips) | Procedure.performed[x] (1..1, MS) | Procedure.complication
    (0..*, example)
  notes: hl7.fhir.uv.ips#2.0.1, stabil; internationales Referenzmuster (IPS), z. B. für die Zusammenfassung
    in einer Patientenkurzakte.
- standard: other
  profile_or_url: https://nrdrsupport.acr.org/support/solutions/articles/11000041247
  resource: 'ACR LCSR & IPN Data Dictionary (28.05.2026), Exam Form: Follow-Up (Section 5B)'
  path: '#160 Date of follow-up | #161 Follow-up diagnostic (low dose chest CT | routine chest CT | PET/CT
    | Bronchoscopy | Non-surgical biopsy | Surgical resection | Other) | #162 Other, specify | #164 Tissue/cytology
    diagnosis method (Percutaneous | Bronchoscopic | Surgical | Unknown) | #120 Invasive procedure within
    30 days prior to death'
  notes: 'ACR LCSR & IPN Data Dictionary, Fassung 28.05.2026 (PDF-Anhang https://nrdrsupport.acr.org/helpdesk/attachments/11143178430);
    nicht-FHIR, US-Registermuster. Ein Follow-up-Datensatz je Prozedur, auch bei mehreren Eingriffen am
    selben Tag (bestätigt 0..*). #160 bis #162 auf S. 33, #164 auf S. 36, #120 auf S. 18. Das LCSR erfasst
    auch Bildgebung (CT, PET/CT), die MiHUB hier bewusst ausschließt; ein Komplikationsfeld enthält das
    Wörterbuch nicht.'
