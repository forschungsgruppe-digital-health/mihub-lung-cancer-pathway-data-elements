issues:
- 'Verbindlichkeit nach Gegenprüfung: mittelbar. Früherkennung nur bei Personen ohne Krankheitssymptome
  und ohne konkreten Verdacht (StrlSchG § 5 Abs. 16); Behandlung, Nachbehandlung oder Verdacht führen
  in die kurative Versorgung (KFE-RL § 38 Abs. 3).'
- 'Umsetzung: eigenständig, reduziert auf Symptom- und Verdachtsstatus. Auf den Status zu Symptomen und
  Verdacht reduzieren (z. B. Name symptomStatusAtEligibilityCheck): asymptomatisch (84387000) | typische
  Symptome mit konkretem Verdacht (162573006), optional mit Symptomliste (z. B. Onkopedia NSCLC 04/2025,
  Tab. 1). Den Behandlungskontext nicht erfassen, sondern als Constraint aus cancerDiagnosis, treatmentStatus
  und screeningProgramEnrolment ableiten. Zitat um den Symptomteil vervollständigen; StrlSchG § 5 Abs.
  16 und TrG zu § 38 Abs. 3 ergänzen. Widerspruch KFE-RL § 38 Abs. 3 („Nachbehandlung“) zu S3 Empf. 16.7
  klären (E7).'
- Für Observation.code ('Symptom- und Verdachtsstatus bei der Anspruchsprüfung') gibt es keinen LOINC-
  oder SNOMED-Code; der Fragecode bleibt lokal.
- Für den Zustand 'Krankheitssymptome ohne konkreten Verdacht' fehlt ein Befundkonzept; ob er als lokaler
  Wert ergänzt wird, ist zu entscheiden.
- Umbenennung in symptomStatusAtEligibilityCheck und Reduktion auf den Symptom- und Verdachtsstatus sind
  zu bestätigen; der Behandlungskontext wird dann nur als Constraint aus cancerDiagnosis, treatmentStatus
  und screeningProgramEnrolment abgeleitet.
- Das MII-Modul Symptom liegt nur als Ballot 2027.0.0-ballot vor; ISiK hat kein Symptomprofil.
- Die ICD-10-GM-Kodierung eines Lungenkrebsverdachts (z. B. Z03.1 bzw. Diagnosesicherheit 'V') ist noch
  festzulegen und am TermServ zu prüfen.
- Der Widerspruch zwischen KFE-RL § 38 Abs. 3 ('Nachbehandlung') und S3 Empf. 16.7 ist fachlich zu klären.
