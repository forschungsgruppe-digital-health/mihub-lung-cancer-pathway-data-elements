    mit 84387000 bzw. 162573006); code 1..1 MS nur mit Bindung example (lokaler Fragecode); effective[x]
    0..1 MS. Optionale Symptomliste über hasMember (0..* MS) bzw. extension:associatedSymptomOrCondition
