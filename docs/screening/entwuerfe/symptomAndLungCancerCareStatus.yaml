id: mihub.lung.screening.symptomAndLungCancerCareStatus.v0.1
uuid: 53f7ca34-19de-5ebd-80ed-4d74f980ce58
name: symptomAndLungCancerCareStatus
label_de: Asymptomatik und kein laufender Lungenkrebs-Behandlungskontext
definition_de: Feststellung, ob die Person asymptomatisch ist und nicht wegen Lungenkrebs in (Nach-)Behandlung;
  sonst kurative Versorgung statt Früherkennung.
phase: screening
category: befund
datatype: CodeableConcept
cardinality: 1..1
value_set:
  binding_strength: extensible
  standard_binding_status: mapped
  notes: 'SNOMED CT INT 20260701 (MII TermServ), Stand 2026-10-15. Das Element ist auf den Symptom- und
    Verdachtsstatus bei der Anspruchsprüfung reduziert. Antwortwerte: 84387000 Asymptomatic (Clinical
    finding; ''keine Krankheitssymptome'' nach StrlSchG § 5 Abs. 16) und 162573006 Malignant neoplasm
    of lung suspected (Situation with explicit context; ''Suspected lung cancer'' ist Synonym; konkreter
    Verdacht führt in die kurative Versorgung). Beide Hierarchien sind in den Diagnose-ValueSets von MII,
    ISiK, KBV und IPS zulässig. Kein Element-Code: Observation.code bleibt lokal, weil es weder ein LOINC-
    noch ein SNOMED-Observable gibt. Die Bindung ist extensible, damit ein Wert ''Symptome ohne konkreten
    Verdacht'' ergänzt werden kann (schließt die Früherkennung ebenfalls aus). Der Behandlungs- bzw. Nachbehandlungskontext
    wird nicht kodiert, sondern aus cancerDiagnosis, treatmentStatus und screeningProgramEnrolment abgeleitet.
    Nicht verwenden: 139841002 (inaktiv), 264931009 Symptomatic (Qualifier, kein Befund). Rollen der Codes:
    snomed-ct|84387000 = wert; snomed-ct|162573006 = wert.'
  codings:
  - system: snomed-ct
    code: '84387000'
    display: Asymptomatic
  - system: snomed-ct
    code: '162573006'
    display: Malignant neoplasm of lung suspected
