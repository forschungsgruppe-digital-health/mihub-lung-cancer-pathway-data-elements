id: mihub.lung.screening.participationDecision.v0.1
uuid: 40e40d71-dd53-572a-a2c9-642bb5e9d68b
name: participationDecision
label_de: Teilnahmeentscheidung der versicherten Person
definition_de: Entscheidung mit Datum nach Information, vor der LDCT (nach Aufklärung) und zur Fortsetzung
  nach dem Ergebnis; bei Ablehnung optional Grund.
phase: screening
category: versorgungsplanung
datatype: string
cardinality: 0..*
value_set:
  binding_strength: extensible
  standard_binding_status: mapped
  notes: 'Elementcode (Observation.code): SNOMED CT 420107008 Patient decision status (observable entity).
    Antwortwerte: ''abgelehnt'' = SNOMED CT 13015001000119105 Lung cancer screening declined (situation);
    ''angenommen'' und ''unentschieden'' sind lokale Codes, weil SNOMED CT dafür kein aktives Konzept
    enthält. 406011002 Screening status unknown wurde als Ersatz für ''unentschieden'' verworfen (unbekannt
    ist nicht unentschieden); die generischen Konzepte 31021000119100 Screening declined und 171103002
    Screening not wanted werden zugunsten des spezifischeren Werts nicht geführt. 724167008 Lung cancer
    screening ist inaktiv; als Bezug auf das Screening (Observation.focus) dient bei Bedarf 275981009
    Screening for malignant neoplasm of lung. Extensible, damit die lokalen Werte zulässig bleiben. MII
    TermServ, SNOMED CT International 20260701, Stand 2026-10-15. Rollen der Codes: snomed-ct|420107008
    = element; snomed-ct|13015001000119105 = wert; local-no-standard-binding|angenommen = wert; local-no-standard-binding|unentschieden
    = wert.'
  codings:
  - system: snomed-ct
    code: '420107008'
    display: Patient decision status
  - system: snomed-ct
    code: '13015001000119105'
    display: Lung cancer screening declined
  - system: local-no-standard-binding
    code: angenommen
    display: Teilnahme angenommen
  - system: local-no-standard-binding
    code: unentschieden
    display: Noch unentschieden
standard_mappings:
- standard: fhir-r4-base
  profile_or_url: http://hl7.org/fhir/StructureDefinition/Observation
  resource: Observation
  path: Observation.code (420107008); Observation.value[x]:valueCodeableConcept (angenommen | abgelehnt
    | unentschieden); Observation.effective[x]:effectiveDateTime (Entscheidungszeitpunkt); Observation.component
    (Ablehnungsgrund mit lokalem Code); Observation.focus (optional 275981009)
  notes: 'hl7.fhir.r4.core#4.0.1, stabil. Basisressource, weil weder ein deutsches noch ein internationales
    Profil eine Teilnahmeentscheidung zur Früherkennung abbildet. Observation.code ist nur example-gebunden,
    das Profil schränkt die Werte nicht ein. Den optionalen Ablehnungsgrund als component mit lokalem
    Code führen (nicht als note), damit er auswertbar bleibt. Alternative für ''abgelehnt'': 13015001000119105
    als Observation.code mit valueBoolean true, was der SNOMED-Situationssemantik besser entspricht als
    ein Situationskonzept in value[x].'
- standard: other
  profile_or_url: https://edge.sitecorecloud.io/americancoldf5f-acrorgf92a-productioncb02-3650/media/ACR/Files/Clinical/Registries/LCSR-Data-Elements-from-Ordering-Physician-Records.pdf
  resource: ACR Lung Cancer Screening Registry (LCSR), Datenelement 'Is there documentation of shared
    decision making?'
  path: Spalten 'Shared Decision Making Visit' und 'Written Order'
  notes: 'ACR LCSR Data Elements from Ordering Physician Records (PDF, 4 Seiten, undatiert, abgerufen
    2026-10-15), nicht-FHIR, US-Registermuster (CMS-NCD), nur Referenzmuster und kein Mapping-Ziel. Äquivalenz
    related-to: Das Registerelement erfasst nur, ob eine gemeinsame Entscheidungsfindung dokumentiert
    ist (ja/nein), nicht deren Ergebnis; fachlich liegt es näher am Informationsschritt (G5) als an der
    Entscheidung. Bei ''Written Order'' mit dem Zusatz ''not required on NCD but recommended by ACR''.'
care_process:
  trigger: nach der Information (G5); bei Ablehnung optional mit Grund
  responsible_role: Versicherte (dokumentiert durch die Praxis oder im Portal)
