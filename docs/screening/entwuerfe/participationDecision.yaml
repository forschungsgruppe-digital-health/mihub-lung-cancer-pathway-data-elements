issues:
- 'Verbindlichkeit nach Gegenprüfung: keine. Freiwilligkeit (Versicherteninformation S. 2; TrG zur Versicherteninformation).
  Dokumentationspflichtig ist nur die Einwilligung vor der LDCT (BGB § 630d Abs. 1, § 630f Abs. 2; KFE-RL
  § 41 Abs. 2); sie gehört zu ldctInformedConsent.'
- 'Umsetzung: eigenständig, auf die Entscheidung nach der Information begrenzt. Auf die Entscheidung nach
  der Information (G5) begrenzen; die Entscheidung vor der LDCT über ldctInformedConsent, Fortsetzung
  oder Abbruch über screeningEpisode abbilden. Als Observation: angenommen | abgelehnt | unentschieden
  (abgelehnt = SNOMED 13015001000119105, sonst lokal), effectiveDateTime, optionaler Ablehnungsgrund (lokal).
  Für „angenommen“ keinen Code setzen, solange keiner belegt ist. Die Entscheidungspunkte nach Information
  und nach Ergebnis als Modellierung aus dem BPMN kennzeichnen.'
- Für die Werte 'angenommen' und 'unentschieden' fehlen SNOMED-CT-Konzepte; ein Konzeptantrag (z. B. 'Lung
  cancer screening accepted (situation)' als Pendant zu 31021000119100 Screening declined) über das deutsche
  NRC ist zu prüfen.
- Der optionale Ablehnungsgrund ist nicht standardkodierbar; die lokale Werteliste dafür ist noch festzulegen.
- Offen ist, ob 'abgelehnt' als valueCodeableConcept oder als Observation.code 13015001000119105 mit valueBoolean
  geführt wird; die Entscheidung sollte für alle Teilnahmewerte einheitlich fallen.
- Kein Profil in MII KDS, ISiK 6.0.0, KBV Basis 1.9.0, KBV MIO, ePA, IPS 2.0.1, mCODE 4.0.0 oder Basis
  DE 1.6.0 bildet die Teilnahmeentscheidung ab; Ziel bleibt die FHIR-R4-Basis-Observation. FHIR Consent
  ist bewusst nicht vorgesehen, weil die Einwilligung vor der LDCT zu ldctInformedConsent gehört.
- Das in den Quellen zitierte ACR-LCSR-Datenwörterbuch vom 28.05.2026 ist über keine offizielle öffentliche
  URL verifizierbar; belegt ist nur das PDF 'LCSR Data Elements from Ordering Physician Records'.
