name: screeningEpisode
label_de: Teilnahme-Episode und Status in der Früherkennung
definition_de: Klammer über alle Runden mit Status (aktiv, Kontrolle, ausgesetzt, beendet, Wiedereintritt)
  und bei Ende Datum und Grund.
phase: screening
category: versorgungskontext
datatype: string
cardinality: 1..*
value_set:
  binding_strength: extensible
  standard_binding_status: mapped
  notes: 'MII TermServ, SNOMED CT 20260701, FHIR episode-of-care-status 4.0.1; Stand 2026-10-15. Element-Code
    (Typ der Episode, EpisodeOfCare.type): 275981009 ''Screening for malignant neoplasm of lung'' (Synonym
    ''Lung cancer screening''). Antwortwerte Status (EpisodeOfCare.status, required): aktiv → active,
    ausgesetzt → onhold, beendet → finished; ''Kontrolle'' ist kein Status (ableitbar aus screeningResultCategory
    und recommendedControlInterval). Antwortwerte Austrittsgrund (teilweise standardisiert): Ablehnung
    13015001000119105, Lungenkrebsdiagnose 93880001 (wie cancerDiagnosis); 171108006 ''Screening not needed''
    nur als Beispiel für ''Kriterien nicht mehr erfüllt'', nicht für Altersgrenze oder Zehn-Jahres-Regel.
    Die übrigen Austrittsgründe (Altersgrenze mit Vollendung des 76. Lebensjahres, Symptome bzw. kurative
    Versorgung nach KFE-RL § 38 Abs. 3, Rauchstopp vor 10 oder mehr Jahren) sind lokal festzulegen. Ein
    Wiedereintritt wird als neue Episode geführt. Rollen der Codes: snomed-ct|275981009 = element; http://hl7.org/fhir/episode-of-care-status|active
    = wert; http://hl7.org/fhir/episode-of-care-status|onhold = wert; http://hl7.org/fhir/episode-of-care-status|finished
    = wert; snomed-ct|13015001000119105 = wert; snomed-ct|93880001 = wert; snomed-ct|171108006 = wert.'
  codings:
  - system: snomed-ct
    code: '275981009'
    display: Screening for malignant neoplasm of lung
  - system: http://hl7.org/fhir/episode-of-care-status
    code: active
    display: Active
  - system: http://hl7.org/fhir/episode-of-care-status
    code: onhold
    display: On Hold
  - system: http://hl7.org/fhir/episode-of-care-status
    code: finished
    display: Finished
  - system: snomed-ct
    code: '13015001000119105'
    display: Lung cancer screening declined
  - system: snomed-ct
    code: '93880001'
    display: Primary malignant neoplasm of lung
  - system: snomed-ct
    code: '171108006'
    display: Screening not needed
standard_mappings:
- standard: fhir-r4-base
  profile_or_url: http://hl7.org/fhir/StructureDefinition/EpisodeOfCare
  resource: EpisodeOfCare
  path: EpisodeOfCare.status (1..1, required episode-of-care-status) | EpisodeOfCare.statusHistory.status
    + .period (1..1) | EpisodeOfCare.type (0..*, example; 275981009) | EpisodeOfCare.period (Beginn/Ende)
    | EpisodeOfCare.patient (1..1) | EpisodeOfCare.managingOrganization | EpisodeOfCare.referralRequest
    (ServiceRequest) | EpisodeOfCare.careManager | Extension für den Austrittsgrund (lokal)
  notes: hl7.fhir.r4.core#4.0.1, stabil; unprofiliertes Basisziel, da in keinem geprüften deutschen oder
    internationalen Paket ein EpisodeOfCare-Profil existiert. Status-Abbildung aktiv → active, ausgesetzt
    → onhold, beendet → finished; optional planned für die Zeit zwischen Anspruchsprüfung und erster LDCT.
    Statusverlauf über statusHistory, Ende über period.end. EpisodeOfCare.type = 275981009 'Screening
    for malignant neoplasm of lung'. Für den Austrittsgrund gibt es in R4 kein Element (EpisodeOfCare.reason
    erst in R5); er braucht eine lokale Extension. Encounter bzw. Procedure verweisen über ihr Element
    episodeOfCare auf die Episode. Wiedereintritt = neue EpisodeOfCare.
