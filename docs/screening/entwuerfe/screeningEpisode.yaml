issues:
- 'Verbindlichkeit nach Gegenprüfung: keine. S3 Tab. 16 Schritte 6 und 8 (Hintergrund ohne Empfehlungsgrad).
  Austrittsgründe sind normativ ableitbar: KFE-RL § 38 Abs. 1 (Altersgrenze) und Abs. 3 (Behandlung, Verdacht);
  LuKrFrühErkV § 2 Abs. 1 Nr. 3; S3 Empf. 5.5/5.6.'
- 'Umsetzung: eigenständig (EpisodeOfCare). Reference auf FHIR EpisodeOfCare (type 275981009, status,
  statusHistory, period) oder Period plus CodeableConcept für den Austrittsgrund. Status auf aktiv | ausgesetzt
  | beendet begrenzen (lokal); „Kontrolle“ streichen (ableitbar aus screeningResultCategory und recommendedControlInterval).
  Austrittsgründe lokal: Altersgrenze (Vollendung des 76. Lebensjahres), Lungenkrebsdiagnose, Symptome
  bzw. kurative Versorgung (§ 38 Abs. 3 KFE-RL), Ablehnung, Eignungsprofil, Rauchstopp vor 10 oder mehr
  Jahren. Wiedereintritt als neue Episode (statt des verworfenen screeningEntryRoute). Bezug zu screeningProgramEnrolment
  (Beginn beim Übergang aus der Nachsorge; Spannung zu § 38 Abs. 3). „ausgesetzt“ sowie Enddatum und Grund
  als lokale MiHUB-Festlegung kennzeichnen.'
- Für die Austrittsgründe Altersgrenze (Vollendung des 76. Lebensjahres), Symptome bzw. kurative Versorgung
  (KFE-RL § 38 Abs. 3) und Rauchstopp vor 10 oder mehr Jahren gibt es keine SNOMED- oder LOINC-Konzepte;
  lokale Codes sind festzulegen.
- FHIR R4 EpisodeOfCare hat kein Element für den Austrittsgrund; eine lokale Extension ist zu definieren,
  eine R5-Cross-Version-Extension ist ungeprüft.
- Es gibt kein deutsches Profil (MII KDS, ISiK, KBV, Basisprofil DE, ePA) für EpisodeOfCare bzw. eine
  Screening-Programmteilnahme.
- Der Status 'ausgesetzt' sowie Enddatum und Austrittsgrund sind lokale MiHUB-Festlegungen und als solche
  zu kennzeichnen.
- Das Verhältnis zu screeningProgramEnrolment (Beginn beim Übergang aus der Nachsorge, Spannung zu KFE-RL
  § 38 Abs. 3) ist zu klären; Kardinalität 1..* je Person (Wiedereintritt = neue Episode) statt 1..1 ist
  zu entscheiden.
- Ein openEHR-Archetyp für eine Screening-Episode wurde nicht geprüft.
- Kardinalität laut Quelle 1..* je Person (Wiedereintritt = neue Episode).
