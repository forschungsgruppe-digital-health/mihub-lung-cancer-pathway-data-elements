name: tobaccoCessationOfferScreening
label_de: Information über und Angebot einer Tabakentwöhnung (Opt-out)
definition_de: Information über und Angebot einer Tabakentwöhnung (Kurzberatung, Kurs, Telefon/Digital,
  Medikation) mit Reaktion (angenommen, Opt-out, später).
phase: screening
category: prozedur
datatype: CodeableConcept
cardinality: 0..*
value_set:
  binding_strength: extensible
  standard_binding_status: mapped
  notes: 'Einziger Elementcode: SNOMED CT 771155005 Brief intervention for smoking cessation (Angebot
    als Kurzintervention, ABC-Ansatz). Werte auf zwei Achsen: (1) Inhalt bzw. Angebotsform als SNOMED-Prozeduren:
    225323000 Smoking cessation education für den Informationsteil nach KFE-RL § 40 S. 2 (702388001 Tobacco
    use cessation education als geerbte Alternative), 1290027009 Smoking cessation consultation (Beratung),
    395700008 Referral to smoking cessation advisor (Vermittlung an Kurs/Programm), 713700008 Smoking
    cessation drug therapy (pharmakologische Unterstützung, regime/therapy), 699033005 Provision of smoking
    cessation leaflet (Informationsmaterial). (2) Reaktion auf das Angebot als drei lokale Codes angenommen
    | opt-out | spaeter; für opt-out optional zusätzlich 1296859006 Procedure declined als generische
    Annäherung. Als Spezialisierung von mihub.lung.followup.tobaccoCessationCounselling.v0.1 werden dessen
    Codes (u. a. 710081004 Smoking cessation therapy, 151159008 Nicotine replacement therapy, 719591006
    Varenicline therapy) geerbt. 771155005 und 225323000 sind Mitglieder des MII-ValueSets procedures-sct.
    MII TermServ, SNOMED CT International 20260701, Stand 2026-10-15. Rollen der Codes: snomed-ct|771155005
    = element; snomed-ct|225323000 = wert; snomed-ct|702388001 = wert; snomed-ct|1290027009 = wert; snomed-ct|395700008
    = wert; snomed-ct|713700008 = wert; snomed-ct|699033005 = wert; local-no-standard-binding|angenommen
    = wert; local-no-standard-binding|opt-out = wert; local-no-standard-binding|spaeter = wert; snomed-ct|1296859006
    = wert.'
