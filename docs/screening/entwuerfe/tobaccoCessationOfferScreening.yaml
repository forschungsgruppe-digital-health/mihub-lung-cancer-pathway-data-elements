standard_mappings:
- standard: fhir-mii-kds
  profile_or_url: https://www.medizininformatik-initiative.de/fhir/core/modul-prozedur/StructureDefinition/Procedure
  resource: Procedure
  path: Procedure.code.coding:sct; Procedure.status (+ Procedure.statusReason); Procedure.performed[x];
    Procedure.category.coding:sct
  notes: 'de.medizininformatikinitiative.kerndatensatz.base#2026.0.1 (Modul Prozedur), stabil. code.coding:sct
    ist REQUIRED an procedures-sct gebunden (descendent-of 71388002); 771155005 und 225323000 sind laut
    $validate-code auf dem MII TermServ Mitglieder. Invariante sct-ops-1 (SNOMED oder OPS) ist damit erfüllt.
    category.coding:sct ist PREFERRED gebunden, passend ist nur 394841004 Other category (keine Kategorie
    ''Beratung''). Reaktion: angenommen = status completed bzw. in-progress, Opt-out = status not-done
    + statusReason (lokaler Code), später = lokal. performed[x] ist 1..1, daher braucht auch ein abgelehntes
    Angebot den Angebotszeitpunkt oder eine data-absent-reason-Extension. Alternativ Angebot als ServiceRequest
    und Durchführung als Procedure trennen.'
- standard: fhir-isik
  profile_or_url: https://gematik.de/fhir/isik/StructureDefinition/ISiKProzedur
  resource: Procedure
  path: Procedure.code.coding:SNOMED-CT; Procedure.status; Procedure.performed[x]; Procedure.category.coding:SNOMED-CT
  notes: 'de.gematik.isik#6.0.0 (gleiche Canonical in isik-basismodul#4.0.3), stabil, nur Differential.
    code 1..1; coding:SNOMED-CT REQUIRED an ProzedurenCodesSCT (descendent-of 71388002), 771155005 und
    225323000 passen. category PREFERRED an ProzedurenKategorieSCT (394841004 Other category). subject.reference
    1..; encounter optional, wenn vorhanden reference 1... Nachrangiges Ziel nur für KIS-Daten: ISiK ist
    auf das Krankenhaus ausgerichtet, die Beratung findet ambulant in der berichterstellenden Praxis statt.'
- standard: other
  profile_or_url: https://fhir.kbv.de/StructureDefinition/KBV_PR_Base_Procedure
  resource: Procedure
  path: Procedure.code.coding:snomed; Procedure.status; Procedure.statusReason; Procedure.performed[x];
    Procedure.performer.actor
  notes: kbv.basis#1.9.0 (KBV Basisprofile, kein MIO, daher 'other'), stabil, nur Differential. code.coding:snomed
    REQUIRED an KBV_VS_Base_Procedure_SNOMED_CT (is-a 71388002, SNOMED CT German Edition 20260515); coding:snomed.version
    (German Edition) und coding:snomed.display sind Pflicht. category.coding:snomed EXTENSIBLE an dasselbe
    Prozeduren-ValueSet. statusReason ist im Profil enthalten (nicht eingeschränkt) und nimmt den Opt-out
    auf. Passt zum ambulanten PVS-Kontext der berichterstellenden Praxis.
- standard: fhir-r4-base
  profile_or_url: http://hl7.org/fhir/StructureDefinition/Procedure
  resource: Procedure
  path: Procedure.code; Procedure.status; Procedure.statusReason; Procedure.outcome; Procedure.performed[x]
  notes: hl7.fhir.r4.core#4.0.1, stabil. Basisziel, falls kein Profil vorgeschrieben ist. Das Bestandselement
    tobaccoCessationCounselling (elements/follow-up) führt bisher keine Standard-Mappings; die Zuordnungen
    zu MII Prozedur, KBV Basis und ISiK sollten dort ebenfalls übernommen werden.
- standard: other
  profile_or_url: http://hl7.org/fhir/uv/ips/StructureDefinition/Procedure-uv-ips
  resource: Procedure
  path: Procedure.code; Procedure.performed[x]
  notes: hl7.fhir.uv.ips#2.0.1, stabil; internationales Referenzziel mit niedriger Priorität. code 1..1
    PREFERRED an procedures-uv-ips (descendent-of 71388002 abzüglich u. a. 14734007 Administrative procedure);
    771155005 und 225323000 liegen laut $subsumes (tx.fhir.org) in keiner ausgeschlossenen Hierarchie.
    performed[x] 1..1. Die Reaktion auf das Angebot ist nicht abbildbar.
- standard: openehr-archetype
  profile_or_url: https://ckm.openehr.org/ckm/archetypes/1013.1.1395
  resource: openEHR-EHR-ACTION.health_education.v1
  path: ACTION (ISM-Careflow-Schritte) / description
  notes: 'openEHR CKM 1013.1.1395, Revision 1.1.3, published, nicht-FHIR. Zweck laut ADL: ''Zur Darstellung
    von Details zur Kommunikation, die zur Verbesserung der Gesundheitskompetenz und der Lebenskompetenzen
    geführt wird.'' Deckt den Informationsteil (KFE-RL § 40 S. 2) ab; Annahme bzw. Opt-out nur über die
    Careflow-Schritte bzw. ein INSTRUCTION-Paar. Einwilligungen gehören laut misuse zu ACTION.informed_consent.'
