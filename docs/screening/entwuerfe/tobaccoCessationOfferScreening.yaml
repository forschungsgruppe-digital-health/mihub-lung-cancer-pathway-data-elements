issues:
- 'Verbindlichkeit nach Gegenprüfung: Pflicht (Information) / Leitlinie (Angebot). Information über die
  Möglichkeiten der Tabakentwöhnung ist Pflicht (KFE-RL § 40 S. 2; Bestätigung im Bericht nach S. 3).
  Angebot im Opt-out-Ansatz mit Reaktion: S3 Empf. 4.5 und 5.7 (Grad A), keine Rechtspflicht.'
- 'Umsetzung: Spezialisierung von tobaccoCessationCounselling (followup). specializes mihub.lung.followup.tobaccoCessationCounselling.v0.1
  (Codes übernehmen, 771155005 ergänzen). Definition auf Angebot und Reaktion beschränken (angenommen
  | abgelehnt/Opt-out | später; lokales ValueSet); mandatory_by_law für das Angebot auf false. Den Pflichtteil
  (Information nach § 40 S. 2) über die Bestätigung der erfolgten Information im eligibilityReport (§
  40 S. 3) nachweisen, da informationTopicsCovered verworfen wurde; für den Informationsteil SNOMED 225323000.
  Trigger: aktiv rauchend laut smokingStatusScreening. S3-Empfehlungen mit Version 5.1 (Juli 2026) zitieren.'
- Für Telefon- und Digitalangebote der Tabakentwöhnung (z. B. Rauchfrei-Telefon, DiGA) gibt es kein spezifisches
  SNOMED-CT-Konzept.
- Für die Reaktion auf das Angebot (angenommen, Opt-out, später) und für 'Angebot einer Tabakentwöhnung
  erfolgt' als Situation fehlen SNOMED-CT-Konzepte; die Werte bleiben lokal, 1296859006 Procedure declined
  ist nur eine generische Annäherung für Opt-out.
- Kein Profil bildet Angebot plus Reaktion ab; die Reaktion läuft über Procedure.status/statusReason oder
  ein lokales ValueSet. Die Kategorie-ValueSets von MII und ISiK enthalten keine Kategorie 'Beratung'.
- Der Pflichtteil 'Information über die Möglichkeiten der Tabakentwöhnung erfolgt' (KFE-RL § 40 S. 2/3)
  hat kein eigenes Profilelement und ist über die Bestätigung im eligibilityReport nachzuweisen.
- Das Bestandselement tobaccoCessationCounselling (follow-up) braucht noch Standard-Mappings, die die
  Spezialisierung erben kann.
- Das ACR-LCSR-Item 127 ('Did physician provide smoking cessation guidance to patient?') ist nicht über
  eine verifizierte offizielle URL belegbar und wird deshalb nicht zugeordnet.
