issues:
- 'Verbindlichkeit nach Gegenprüfung: Pflicht. LuKrFrühErkV § 2 Abs. 1 S. 1 Nr. 4 (mündliches Gespräch
  und Textform); KFE-RL § 40 S. 1 i. V. m. § 43 Abs. 2.'
- 'Umsetzung: eigenständig (Anker des Informationsakts). Als Anker behalten. Datentyp Period (Beginn/Ende)
  oder Reference(Procedure/Encounter) mit performer. Konzeptcode SNOMED 225328009 statt EBM 01876; die
  GOP nur als Abrechnungsbezug führen. Kontaktform mit der Werteliste von consultationModality, aber als
  lokale Angabe kennzeichnen (die KBV erlaubt Telefon und Video ausdrücklich nur für GOP 01880 und 01881).
  „Gemeinsame Entscheidungsfindung“ nur über S3 Kap. 5.1.4.5 (Hintergrund) stützen. patientInformationLeafletProvided
  als hasPart; die erfolgte Information wird im eligibilityReport bestätigt (KFE-RL § 40 S. 3).'
- Ein spezifisches Konzept 'Counseling about lung cancer screening' bzw. 'Lung cancer screening shared
  decision-making visit' fehlt in SNOMED CT und LOINC.
- Für EBM-GOPs (hier 01876) gibt es keine belegte FHIR-System-URI; ob und wie die GOP als Abrechnungsbezug
  maschinenlesbar geführt wird, ist offen.
- Kein Profil erfasst die Pflichtinhalte nach LuKrFrühErkV § 2 Abs. 1 S. 1 Nr. 4 bzw. KFE-RL § 40 (mündlich
  plus Textform, Strahlenrisiko, Tabakentwöhnung) strukturiert.
- Ob Telefon bzw. Video über Encounter.class (EncounterClassDE) ausdrückbar ist, ist ungeklärt; die Kontaktform
  bleibt bis dahin eine lokal gekennzeichnete Angabe.
- Datentyp (Period bzw. Reference auf Procedure/Encounter statt dateTime) ist zu entscheiden; die Konvention
  für kbv.basis-Profile unter dem Schlüssel kbv-mio ist festzulegen.
