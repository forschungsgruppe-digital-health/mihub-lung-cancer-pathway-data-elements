  notes: 'de.medizininformatikinitiative.kerndatensatz.base#2026.0.1 (stabil). Hauptziel für den Informationsakt:
    performed[x] 1..1 MS (Period mit Beginn und Ende bzw. dateTime); code.coding:sct REQUIRED an procedures-sct
    (descendent-of 71388002, SCT 20250701; 225328009 enthalten); category.coding:sct preferred; performer
    0..* = Ärzt:in; encounter 0..1 MS; report 0..* auf DocumentReference (Versicherteninformation). EBM
    01876 nicht als code; ein OPS-Code für das Gespräch existiert nicht.'
- standard: kbv-mio
