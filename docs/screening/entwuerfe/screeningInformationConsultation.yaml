name: screeningInformationConsultation
label_de: Informations- und Beratungsgespräch (Erstberatung)
definition_de: Mündliches Informationsgespräch der berichterstellenden Ärzt:in (gemeinsame Entscheidungsfindung)
  mit Datum, Dauer, Person und Kontaktform.
phase: screening
category: kontakt-visite
datatype: string
cardinality: 1..1
unit: min
value_set:
  binding_strength: extensible
  standard_binding_status: mapped
  notes: 'SNOMED CT INT 20260701, UCUM 1.0.1 (MII TermServ), Stand 2026-10-15. Element-Code: 225328009
    Pre-screening counseling (Procedure.code; liegt unter 71388002 und damit in den Prozedur-ValueSets
    von MII, ISiK und KBV); 410306009 nur als breiterer Fallback. Methoden-Code für den Aspekt gemeinsame
    Entscheidungsfindung: 710873001; soll die Teilnahme als Befund dokumentiert werden, alternativ 1397166002
    Participates in shared decision making. Antwortwerte für die Kontaktform aus consultationModality:
    1269515004, 719410009, 386472008; Telefon und Video sind nach KBV ausdrücklich nur für GOP 01880/01881
    vorgesehen und daher als lokale Angabe zu kennzeichnen. Einheit der Gesprächsdauer: UCUM min, falls
    die Dauer nicht aus Period berechnet wird. Die EBM-GOP 01876 ist kein Konzeptcode, sondern nur Abrechnungsbezug
    (keine belegte FHIR-System-URI für EBM-GOPs). Ein lungenkrebs-spezifischer Beratungscode existiert
    weder in SNOMED CT noch in LOINC 2.83. Rollen der Codes: snomed-ct|225328009 = element; snomed-ct|410306009
    = element; snomed-ct|710873001 = methode; snomed-ct|1397166002 = wert; snomed-ct|1269515004 = wert;
    snomed-ct|719410009 = wert; snomed-ct|386472008 = wert.'
  codings:
  - system: snomed-ct
    code: '225328009'
    display: Pre-screening counseling
  - system: snomed-ct
    code: '410306009'
    display: Screening education, guidance, and counseling
  - system: snomed-ct
    code: '710873001'
    display: Involving client in decision making process
  - system: snomed-ct
    code: '1397166002'
    display: Participates in shared decision making
  - system: snomed-ct
    code: '1269515004'
    display: Face to face consultation with patient
  - system: snomed-ct
    code: '719410009'
    display: Consultation via video conference
  - system: snomed-ct
    code: '386472008'
    display: Telephone consultation
standard_mappings:
