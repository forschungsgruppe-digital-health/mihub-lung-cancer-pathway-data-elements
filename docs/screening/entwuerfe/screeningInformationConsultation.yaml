  resource: Encounter
  path: Encounter.period
  notes: 'kbv.basis#1.9.0 (stabil; KBV-Basisprofil, kein MIO – im Bestand erste Verwendung unter kbv-mio).
    Passend zum vertragsärztlichen Kontakt: period min 1 (start/end = Gesprächsdauer); serviceType.coding:KBV-Fachgruppencodierung
    REQUIRED an KBV_VS_SFHIR_BAR2_ARZTNRFACHGRUPPE (berechtigte Fachgruppe: Innere Medizin, Allgemeinmedizin,
    Arbeitsmedizin, ab 01.10.2026 weitere); class extensible an EncounterClassDE.'
- standard: kbv-mio
  profile_or_url: https://fhir.kbv.de/StructureDefinition/KBV_PR_Base_Procedure
  resource: Procedure
  path: Procedure.performed[x]
  notes: 'kbv.basis#1.9.0 (stabil; KBV-Basisprofil, kein MIO). Prozedur-Variante für das PVS: Slices performedPeriod
    und performedDateTime; code.coding:snomed REQUIRED an KBV_VS_Base_Procedure_SNOMED_CT (is-a 71388002,
    SCT-DE 20260515; system, version, code, display je 1..1).'
- standard: fhir-isik
  profile_or_url: https://gematik.de/fhir/isik/StructureDefinition/ISiKProzedur
  resource: Procedure
  path: Procedure.performed[x]
  notes: de.gematik.isik#6.0.0 (stabil). Gleiche Abbildung wie die MII-Prozedur (performed[x] min 1 MS;
    code.coding:SNOMED-CT REQUIRED an ProzedurenCodesSCT, descendent-of 71388002; subject.reference 1..).
    Nur nachrangig, da ISiK auf das KIS zielt und das Gespräch vertragsärztlich stattfindet.
