uuid: a82fd9dc-a8ff-5586-8e98-a16fc50622e6
name: lungRadsCategory
label_de: Lung-RADS-Kategorie (V-Lung-RADS 2022) mit Version und S-Modifikator
definition_de: V-Lung-RADS-2022-Kategorie 0–4X je Befundung und abschließend, mit Version, Grund bei Kategorie
  0 und Modifikator S.
phase: screening
category: assessment
datatype: CodeableConcept
cardinality: 1..*
value_set:
  binding_strength: required
  standard_binding_status: pending-mapping
  notes: 'Element-Code (Observation.code) ist SNOMED CT 1362105002 |Lung Imaging Reporting and Data System
    category| (observable entity; setzt SNOMED CT INT ab 2025-03-01 voraus). 1362106001 (assessment scale)
    ist die Instrumentangabe, 1362107005 (procedure) optional die Methode (Observation.method). Antwortwerte
    sind ein lokales CodeSystem ''V-Lung-RADS 2022'' (Kategorien 0, 1, 2, 3, 4A, 4B, 4X), required gebunden,
    weil die S3-Leitlinie die modifizierte Lung-RADS-Klassifikation 2022 mit integrierter Volumenverdopplungszeit
    vorgibt; SNOMED CT hat keine Kategoriewerte unter 1362105002. Der Modifikator S ist kein alternativer
    Kategoriewert, sondern ein Zusatz (eigene Komponente bzw. zweites Coding, Bezug zu incidentalFinding).
    Die RadLex-Werte RID50135–RID50141 und RID50710 bilden ACR Lung-RADS ab und sind nur Mapping-Ziele
    (equivalence relatedto/wider, nicht equivalent). Editionen: SNOMED CT INT 20260701, RadLex 4.2 (MII
    TermServ); LOINC 2.83 ohne Lung-RADS-Term; Stand 2026-10-15. Rollen der Codes: snomed-ct|1362105002
    = element; snomed-ct|1362106001 = instrument; snomed-ct|1362107005 = methode; local-no-standard-binding|0
    = wert; local-no-standard-binding|1 = wert; local-no-standard-binding|2 = wert; local-no-standard-binding|3
    = wert; local-no-standard-binding|4A = wert; local-no-standard-binding|4B = wert; local-no-standard-binding|4X
    = wert; local-no-standard-binding|S = wert.'
  codings:
  - system: snomed-ct
    code: '1362105002'
    display: Lung Imaging Reporting and Data System category
  - system: snomed-ct
    code: '1362106001'
    display: Lung Imaging Reporting and Data System
  - system: snomed-ct
