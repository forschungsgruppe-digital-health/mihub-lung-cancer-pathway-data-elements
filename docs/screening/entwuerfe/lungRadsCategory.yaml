standard_mappings:
- standard: fhir-mii-kds
  profile_or_url: https://www.medizininformatik-initiative.de/fhir/ext/modul-bildgebung/StructureDefinition/mii-pr-bildgebung-radiologische-beobachtung
  resource: Observation
  path: Observation.code.coding (sct-Slice bzw. offenes Slicing); Observation.valueCodeableConcept; Observation.component
    (Version, Grund bei Kategorie 0, Modifikator S)
  notes: 'de.medizininformatikinitiative.kerndatensatz.bildgebung#2026.0.0, stabil. NICHT KONFORM mit
    1362105002 als SNOMED-Coding in Observation.code: Der sct-Slice ist REQUIRED an < 404684003 |Clinical
    finding| gebunden. Optionen: (a) code ohne SNOMED, d. h. lokaler Code oder RadLex RID50134 ''Lung-RADS
    assessment'' im offenen Slicing, 1362105002 erst nach einer MII-Änderung; (b) Ballot-Kommentar an
    MII Bildgebung, Observable-Entity-Codes für Scores und Kategorien zuzulassen. value[x] 1..1 = lokales
    CodeSystem V-Lung-RADS 2022; Version, Grund bei Kategorie 0 und Modifikator S als component mit lokalen
    Codes.'
- standard: fhir-mii-kds
  profile_or_url: https://www.medizininformatik-initiative.de/fhir/ext/modul-bildgebung/StructureDefinition/mii-pr-bildgebung-radiologischer-befund
  resource: DiagnosticReport
  path: DiagnosticReport.result; DiagnosticReport.conclusionCode; DiagnosticReport.imagingStudy
  notes: de.medizininformatikinitiative.kerndatensatz.bildgebung#2026.0.0, stabil. Kategorie-Observations
    je Befunder über result (0..* MS). Die abschließende Kategorie kann zusätzlich als nicht-SNOMED-Coding
    in conclusionCode stehen (0..* MS, example; coding offen geslict mit den optionalen Slices sct (REQUIRED
    Clinical finding) und icd10-gm). imagingStudy 1..* MS ist Pflicht (LDCT-Studie).
- standard: fhir-mii-kds
  profile_or_url: https://www.medizininformatik-initiative.de/fhir/ext/modul-bildgebung/StructureDefinition/mii-pr-bildgebung-radiologische-beobachtung
  resource: Observation
  path: Observation.code.coding:sct; Observation.value[x]
  notes: de.medizininformatikinitiative.kerndatensatz.bildgebung#2027.0.0-ballot.1, Ballot. Bindung unverändert
    < 404684003 (SCT 20260701), aber das Slice-Pattern trägt die Version im System-String; 1362105002
    würde dadurch faktisch durchrutschen, das ist nicht beabsichtigt. Nicht darauf bauen, sondern im Ballot
    kommentieren (Zulassung von Observable-Entity-Codes für Scores).
- standard: other
  profile_or_url: http://hl7.eu/fhir/imaging/StructureDefinition/ObservationFindingEuImaging
  resource: Observation
  path: Observation.code; Observation.valueCodeableConcept
  notes: hl7.fhir.eu.imaging#1.0.0-ballot, Ballot/draft (EHDS-Zielbild). code 1..1 nur example gebunden,
    value[x] 0..1; 1362105002 als code und lokale Werte sind zulässig. Das Gesamturteil in DiagnosticReportEuImaging.extension:impression
    ist eine Referenz (ObservationFindingEuImaging, Condition oder Key Image); die Gesamtkategorie muss
    dort also als Observation vorliegen, nicht als Code.
- standard: other
  profile_or_url: http://hl7.org/fhir/uv/ips/StructureDefinition/Observation-results-radiology-uv-ips
  resource: Observation
  path: Observation.code; Observation.value[x]
  notes: hl7.fhir.uv.ips#2.0.1, stabil (international). code PREFERRED an LOINC Radiologie (CLASS LP29684-5),
    daher ist SNOMED 1362105002 zulässig; LOINC 2.83 enthält keinen Lung-RADS-Term. category:radiology
    1..1 (imaging).
- standard: other
  profile_or_url: http://radlex.org
  resource: RadLex Lung-RADS-Werte (ACR)
  path: RID50134 Lung-RADS assessment; RID50135 Lung-RADS 0; RID50136 Lung-RADS 1; RID50137 Lung-RADS
    2; RID50138 Lung-RADS 3; RID50139 Lung-RADS 4A; RID50140 Lung-RADS 4B; RID50141 Lung-RADS 4X; RID50710
    Lung-RADS S
  notes: RadLex 4.2 (MII TermServ). Mapping-Ziele der lokalen V-Lung-RADS-Werte (equivalence relatedto
    bzw. wider, nicht equivalent), da die RadLex-Definitionen ACR Lung-RADS folgen und die deutsche V-Lung-RADS-Fassung
    mit Volumenverdopplungszeit (insbesondere bei 4A/4B) abweicht. RID50710 ist ein Modifikator, keine
    eigenständige Kategorie. RID50134 nur als Oberbegriff; primäre Instrumentangabe ist SNOMED 1362106001.
- standard: other
  profile_or_url: https://api3.rsna.org/radelement/v1/sets/RDES267
  resource: RSNA/ACR RadElement 'Lung-RADS categorization'
  path: RDE1702 Category of findings (Werte RDE1702.0 ff.); RDE1703 Baseline study; RDE1704 Significant
    finding (S-Modifikator)
  notes: 'RSNA RadElement API (Stand 2026-10-15), Set Published (2023-07-26), RDE1702 Published (2024-05-31),
    nicht-FHIR. RDE1702 kodiert ACR-v2022-Unterkategorien (z. B. ''Lung-RADS 0: incomplete, locating priors''),
    sodass sich die Gründe bei Kategorie 0 mappen lassen; RDE1704 (absent/present/indeterminate/unknown)
    entspricht dem S-Modifikator, RDE1703 dem Baseline-Status. Nur Mapping-Ziel, da V-Lung-RADS abweicht.'
- standard: other
  profile_or_url: https://www.ihe.net/uploadedFiles/Documents/Radiology/IHE_RAD_Suppl_AIR.pdf
  resource: IHE RAD AIR, A.3.3.2 Lung-RADS Result / A.3.3.3 Nodule 1
  path: Finding (RID50139, RADLEX, 'Lung-RADS 4A') als Root Result; je Herd (RID50134, RADLEX, 'Lung-RADS
    Assessment') = (RID50138, RADLEX, 'Lung-RADS 3')
  notes: IHE RAD Suppl. AIR Rev. 1.3, Trial Implementation (2025-08-08), nicht-FHIR, informatives Beispiel.
    Belegt das Muster Gesamtkategorie plus Kategorie je Rundherd; bezieht sich auf ACR Lung-RADS, nicht
    auf V-Lung-RADS.
- standard: dicom-sr
  profile_or_url: https://dicom.nema.org/medical/dicom/current/output/chtml/part16/chapter_A.html#sect_TID_1501
  resource: TID 1500 > TID 1501 Measurement and Qualitative Evaluation Group
  path: Qualitative Evaluation je Rundherd und Gesamtbefund
  notes: DICOM PS3.16 2026d, nicht-FHIR. DICOM definiert keinen eigenen Lung-RADS-Code (PS3.16 Annex A
    und D ohne Treffer); Kodierung im IHE-AIR-Beispiel über RadLex.
- standard: other
  profile_or_url: https://www.acr.org/Clinical-Resources/Clinical-Tools-and-Reference/Reporting-and-Data-Systems/Lung-RADS
  resource: ACR Lung-RADS v2022 (Kategorientabelle)
  path: Kategorien 0–4X, Modifikator S
  notes: ACR Lung-RADS v2022, nicht-FHIR; nur Referenzklassifikation. Maßgeblich in Deutschland ist die
    modifizierte V-Lung-RADS 2022 (S3 Empf. 5.9, DRG/DGP/DGT-Positionspapier Tab. S1), abgebildet im lokalen
    CodeSystem.
