issues:
- 'Verbindlichkeit nach Gegenprüfung: Leitlinie. S3 Empf. 5.9 (EK, „soll“); TrG zu § 42 Abs. 2 und 3 („sollte“);
  die KFE-RL nennt Lung-RADS nur als Fortbildungsinhalt (§ 43 Abs. 2 Nr. 4) – keine Rechtspflicht.'
- 'Umsetzung: eigenständig. SNOMED 1362105002 als Observation.code. Werte als lokales CodeSystem „V-Lung-RADS
  2022“ (0, 1, 2, 3, 4A, 4B, 4X, Modifikator S, Grund bei Kategorie 0) mit Mapping auf NCIt C226307–C226313
  und RadElement RDE1702; NCIt C226306 bzw. SNOMED 1362106001 nur als Systemangabe. Die Trennung je Befunder/abschließend
  mit readerAssessmentCategory und screeningResultCategory harmonisieren (Qualifier). S-Modifikator dependsOn
  incidentalFinding. Mindest-SNOMED-Edition (INT ab 2025-03-01) dokumentieren; die MII-Bildgebung bindet
  Observation.code an „< 404684003 Clinical finding“ – das Observable ist dort nicht konform (offene Frage).'
- Für V-Lung-RADS 2022 ist kein CodeSystem publiziert; das lokale CodeSystem (Kategorien, Modifikator
  S, Gründe bei Kategorie 0, Version) ist zu definieren und möglichst bei DRG bzw. MII einzubringen.
- Für die Gründe bei Kategorie 0 gibt es keine Codes in SNOMED CT oder RadLex; nur RadElement RDE1702
  (ACR) bietet Mapping-Ziele.
- Das stabile MII-Profil 2026.0.0 lässt 1362105002 als Observation.code nicht zu; ein Ballot-Kommentar
  an MII Bildgebung ist zu stellen und bis dahin ein nicht-SNOMED-Code zu verwenden.
- Die Trennung je Befunder und abschließend ist mit readerAssessmentCategory und screeningResultCategory
  zu harmonisieren.
- Die Mindest-Edition SNOMED CT INT ab 2025-03-01 ist für alle beteiligten Systeme festzuschreiben.
- NCIt C226306 bis C226313 (Lung-RADS-Kategorien) sind in NCIt 25.6.0-e auf dem MII TermServ nicht enthalten
  und erst in einer neueren NCIt-Version belegt; ein Mapping darauf ist zurückgestellt.
- 'Die Kardinalität ist offen: 0..* bzw. 1..* nur bei verbindlicher Vorgabe (S3 ''soll'', aber keine Rechtspflicht).'
- Kardinalität laut Quelle 0..* (1..* nur bei verbindlicher Vorgabe).
