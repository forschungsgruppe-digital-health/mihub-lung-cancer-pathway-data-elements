issues:
- 'Verbindlichkeit nach Gegenprüfung: bedingt. KFE-RL § 44 („mit der Empfehlung für das weitere Vorgehen“)
  und LuKrFrühErkV § 5 Abs. 3 bei gemeinsamer Beurteilung, also bei kontroll- oder abklärungsbedürftigem
  Erstbefund; sonst S3 Empf. 5.9 (Leitlinie).'
- 'Umsetzung: eigenständig (Spezialisierung von recommendationsForPrimaryCare). Werteliste nur für die
  Art des nächsten Schritts: reguläre Screening-LDCT nach 12 Monaten | Kontroll-LDCT | ergänzende Bildgebung/Vergleich
  bei Lung-RADS 0 | PET/CT | Abklärung in spezialisierter Einrichtung (lokal, mit Mapping auf das Lung-RADS-Management;
  Belege S3 Empf. 5.9 und Supplement Tab. S1 Anm. 3). Den Zeitpunkt nur in recommendedControlInterval
  führen. Konsistenzregeln: unauffällig → regulär; kontrollbedürftig → Kontroll-LDCT plus Intervall; abklärungsbedürftig
  → Abklärung plus abnormalResultDiscussion und clarificationReferral. specializes recommendationsForPrimaryCare
  (Abgrenzung in definition_de); 424900004 nur als generisches Tag bzw. Mapping, nicht als Observation-Code.'
- Für 'Vergleich mit Voraufnahmen bzw. ergänzende Bildgebung bei Lung-RADS 0' fehlt ein Standardkonzept;
  ein lokaler Code muss festgelegt werden.
- Kontroll-LDCT und reguläre Screening-LDCT unterscheiden sich in SNOMED CT nicht durch ein eigenes Konzept
  'Kontroll-LDCT'; die Unterscheidung trägt nur die Kombination mit screeningResultCategory.
- Die Mapping-Tabelle der Werteliste auf das Lung-RADS-Management (einschließlich 4B) ist noch zu erstellen.
- Zu bestätigen ist, ob der Element-Code 420227002 oder – konsistent zum Elternelement recommendationsForPrimaryCare
  – 427272008 geführt wird.
- Die Konsistenzregeln (unauffällig → regulär; kontrollbedürftig → Kontroll-LDCT plus Intervall; abklärungsbedürftig
  → Abklärung plus abnormalResultDiscussion und clarificationReferral) sind als Invarianten zu formulieren.
- Ob LOINC 79086-5 im RSNA-Playbook-ValueSet liegt, ist nur über tx.fhir.org belegt; auf dem MII TermServ
  ist das ValueSet nicht verfügbar.
