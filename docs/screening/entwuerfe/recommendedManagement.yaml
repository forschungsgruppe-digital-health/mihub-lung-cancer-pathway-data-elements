id: mihub.lung.screening.recommendedManagement.v0.1
uuid: 10deefb8-07e2-5da4-a6cd-4ecc7753d572
name: recommendedManagement
label_de: Empfehlung für das weitere Vorgehen
definition_de: 'Empfohlenes weiteres Vorgehen: reguläre LDCT nach ≥ 12 Monaten, vorgezogene LDCT, Kurzintervall,
  bei 4A Kontrolle oder PET/CT, Abklärung.'
phase: screening
category: versorgungsplanung
datatype: CodeableConcept
cardinality: 1..1
value_set:
  binding_strength: extensible
  standard_binding_status: mapped
  notes: 'Editionen: SNOMED CT INT 20260701 und LOINC 2.83, alle Codes auf dem MII TermServ aktiv (Stand
    2026-10-15). Element-Code ist die Prozedur 420227002 ''Recommendation to'' (gewählt statt des Kindkonzepts
    427272008 ''Recommendation to physician'' aus recommendationsForPrimaryCare, weil sich die Empfehlung
    an die versicherte Person und an Ärzt:innen richtet); 424900004 (Qualifier) nur als generisches Tag.
    LOINC 18783-1 ist der Abschnitts- bzw. Freitextcode für die Empfehlung im Befundbericht, nicht für
    den kodierten Wert. Antwortwerte (Art des nächsten Schritts): reguläre Screening-LDCT nach ≥ 12 Monaten
    = 275981009, Kontroll-LDCT = 16334891000119106 (kontrastmittelfrei; allgemeiner 713548006), PET/CT
    bei Lung-RADS 4A = 1373815000 (FDG; Fallback 450436003), Abklärung in spezialisierter Einrichtung
    = 103696004. Für ''Vergleich mit Voraufnahmen bzw. ergänzende Bildgebung bei Lung-RADS 0'' gibt es
    kein Konzept; das extensible-Binding erlaubt dafür einen lokalen Code. Zeitangaben gehören ausschließlich
    in recommendedControlInterval. Rollen der Codes: snomed-ct|420227002 = element; loinc|18783-1 = element;
    snomed-ct|275981009 = wert; snomed-ct|16334891000119106 = wert; snomed-ct|1373815000 = wert; snomed-ct|103696004
    = wert.'
  codings:
  - system: snomed-ct
    code: '420227002'
    display: Recommendation to
  - system: loinc
    code: 18783-1
    display: Radiology Study recommendation (narrative)
  - system: snomed-ct
    code: '275981009'
    display: Screening for malignant neoplasm of lung
  - system: snomed-ct
    code: '16334891000119106'
    display: Low dose computed tomography of chest without contrast
  - system: snomed-ct
    code: '1373815000'
    display: PET-CT using fluorodeoxyglucose (18-F)
  - system: snomed-ct
    code: '103696004'
    display: Patient referral to specialist
standard_mappings:
- standard: fhir-mii-kds
  profile_or_url: https://www.medizininformatik-initiative.de/fhir/ext/modul-bildgebung/StructureDefinition/mii-pr-bildgebung-behandlungsempfehlung
  resource: CarePlan
  path: CarePlan.activity.detail.code (Example-Binding procedure-code); CarePlan.activity.detail.description;
    CarePlan.activity.reference; CarePlan.supportingInfo (→ mii-pr-bildgebung-radiologischer-befund);
    CarePlan.intent; CarePlan.status
  notes: 'de.medizininformatikinitiative.kerndatensatz.bildgebung#2026.0.0, stabil (laut Diff inhaltsgleich
    in 2027.0.0-ballot.1). Bestes Ziel: radiologische Behandlungsempfehlung, über supportingInfo mit dem
    Befund verknüpft. Art des Schritts in activity.detail.code. Invariante cpl-3: je activity entweder
    detail (code, description, status) ODER reference → ServiceRequest (z. B. anforderung-bildgebung),
    ggf. in getrennten activity-Einträgen. intent und status 1..1. Kein Zeitpunkt hier (→ recommendedControlInterval);
    424900004 höchstens als CarePlan.category-Tag.'
- standard: fhir-mii-kds
  profile_or_url: https://www.medizininformatik-initiative.de/fhir/ext/modul-bildgebung/StructureDefinition/mii-pr-bildgebung-anforderung-bildgebung
  resource: ServiceRequest
  path: ServiceRequest.code.coding:loinc (REQUIRED http://loinc.org/vs/loinc-rsna-radiology-playbook);
    ServiceRequest.category.coding:sct (Pattern 363679005 Imaging); ServiceRequest.reasonReference; ServiceRequest.occurrence[x]
  notes: de.medizininformatikinitiative.kerndatensatz.bildgebung#2026.0.0, stabil. Nur für bildgebende
    Folgeschritte (Kontroll-LDCT, PET/CT), Äquivalenz narrower. Kontroll-LDCT z. B. LOINC 79086-5 (CLASS
    RAD, laut tx.fhir.org im RSNA-Playbook; das ValueSet liegt nicht auf dem MII TermServ). reasonReference
    → screeningResultCategory. Abklärung in der Sprechstunde gehört nicht hierher (→ clarificationReferral).
- standard: fhir-r4-base
  profile_or_url: http://hl7.org/fhir/StructureDefinition/CarePlan
  resource: CarePlan
  path: CarePlan.activity.detail.code; CarePlan.activity.detail.description
  notes: hl7.fhir.r4.core#4.0.1, stabil. Entspricht dem Mapping von recommendationsForPrimaryCare (specializes);
    Invariante cpl-3 beachten (detail und reference nicht in derselben activity).
- standard: other
  profile_or_url: http://hl7.eu/fhir/imaging/StructureDefinition/HL7IDRRecommendation
  resource: Extension auf DiagnosticReportEuImaging (extension:recommendation)
  path: Extension.value[x] = Reference(CarePlan | ServiceRequest)
  notes: hl7.fhir.eu.imaging#1.0.0-ballot, Ballot/Draft. Verknüpft den Bildbefundbericht strukturiert
    mit dem empfohlenen Vorgehen.
- standard: other
  profile_or_url: http://hl7.org/fhir/uv/ips/StructureDefinition/Observation-results-radiology-uv-ips
  resource: Observation
  path: Observation.component.code = (DCM 121075 "Recommendation"); Observation.component.value[x]
  notes: 'hl7.fhir.uv.ips#2.0.1, stabil, international. Äquivalenz related: Empfehlung nur als Text-Komponente
    der Radiologie-Beobachtung, nicht strukturiert.'
- standard: dicom-sr
  profile_or_url: https://dicom.nema.org/medical/dicom/current/output/chtml/part16/sect_DiagnosticImagingReportTemplates.html
  resource: TID 2000 Basic Diagnostic Imaging Report
  path: Überschrift aus CID 7001 = (18783-1, LN, "Recommendations") bzw. DCM 121074; Inhalt TID 2002 Report
    Narrative
  notes: DICOM PS3.16 2026d, nicht-FHIR. Äquivalenz related (Narrativ). Ob CID 6028/6029 strukturierte
    Folgeempfehlungen nur für Mammographie enthalten, ist ungeprüft.
- standard: other
  profile_or_url: https://edge.sitecorecloud.io/americancoldf5f-acrorgf92a-productioncb02-3650/media/ACR/Files/RADS/Lung-RADS/Lung-RADS-2022.pdf
  resource: ACR Lung-RADS v2022, Spalte „Management“
  path: '12-month screening LDCT (1/2); 6-month LDCT (3); 3-month LDCT, PET/CT may be considered (4A);
    4B: diagnostic chest CT with or without contrast, PET/CT, tissue sampling and/or referral for further
    clinical evaluation (Note 13); S-Modifier (Note 15)'
  notes: 'ACR Lung-RADS v2022, nicht-FHIR, kein Codesystem. Äquivalenz related: Textreferenz für das lokale
    Mapping der Werteliste auf das Lung-RADS-Management (neben S3 Empf. 5.9 und Supplement Tab. S1 Anm.
    3).'
- standard: openehr-archetype
  profile_or_url: openEHR-EHR-EVALUATION.recommendation.v2
  resource: EVALUATION
  path: /data[at0001]/items[at0002] (Recommendation); items[at0003] (Rationale)
  notes: openEHR CKM (CKM-mirror master, Stand 2026-10-15), Lifecycle published, nicht-FHIR. Alternativ
    imaging_exam_result.v1 at0059 Recommendation (DV_TEXT) im Bildbefund.
