issues:
- 'Verbindlichkeit nach Gegenprüfung: Pflicht. Aufklärung durch den Erstbefunder (KFE-RL § 41 Abs. 2);
  Einwilligung, Aufklärung und Dokumentation nach BGB § 630d Abs. 1, § 630e Abs. 1–2, § 630f Abs. 2; Strahlenrisiko
  StrlSchV § 124 Abs. 1. Das Ergebnis „erteilt/abgelehnt“ folgt aus dem BGB, nicht aus der KFE-RL.'
- 'Umsetzung: eigenständig (Einwilligungsergebnis nur hier). Das Einwilligungsergebnis (erteilt | abgelehnt)
  nur hier führen; participationDecision auf die Entscheidung nach der Information begrenzen. Alternativ
  als Prozedur mit dateTime der Aufklärung, aufklärender Ärzt:in und Verweis auf den unterschriebenen
  Bogen (Dokumenttyp KDL AM010302 bzw. LOINC 64293-4). Quellen ergänzen: TrG zu § 41 (S. 18) und zu §
  42 (S. 19), BGB §§ 630d, 630e, 630f, StrlSchV § 124 Abs. 1. Aufklärungsinhalt „Beteiligte/Datenaustausch“
  mit resultTransmissionConsentReferrer verknüpfen. Im BPMN fehlt ein Endereignis für die Ablehnung nach
  der Aufklärung.'
- Kein deutsches Profil für die Einwilligung in eine diagnostische Prozedur (BGB § 630d) in MII KDS, ISiK,
  KBV oder ePA; MII KDS Consent ist auf den Broad Consent für Forschung festgelegt (scope research, Policy-Codes
  REQUIRED), KBV-MIO-Consent nur auf Patientenverfügung, Vollmacht und Organspende, IHE PCF nur auf patient-privacy.
- Zu entscheiden ist, ob das Ergebnis als Procedure (Aufklärung mit outcome), als Consent (scope treatment)
  oder als beides geführt wird.
- Für die abgelehnte Einwilligung in eine diagnostische Prozedur gibt es nur den generischen Wert 1296859006
  Procedure declined; ein Widerruf ist nicht spezifisch kodierbar und bleibt bei Bedarf lokal.
- Die Aufklärungsinhalte (Strahlenrisiko nach StrlSchV § 124, Beteiligte, Datenaustausch) haben weder
  Codes noch ein strukturiertes Profilelement; der Inhalt 'Beteiligte/Datenaustausch' ist mit resultTransmissionConsentReferrer
  zu verknüpfen.
- IPS Procedure-uv-ips schließt 182771004 aus (liegt unter 14734007 Administrative procedure) und ist
  daher kein Ziel.
- Im BPMN fehlt ein Endereignis für die Ablehnung nach der Aufklärung.
- Kardinalität laut Quelle 1..1 je LDCT-Runde.
