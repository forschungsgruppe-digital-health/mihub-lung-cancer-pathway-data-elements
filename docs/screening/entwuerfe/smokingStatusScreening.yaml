issues:
- 'Verbindlichkeit nach Gegenprüfung: mittelbar. Der Status allein entscheidet nicht über den Anspruch.
  Operative Norm: KFE-RL § 38 Abs. 1 i. V. m. LuKrFrühErkV § 2 Abs. 1 Nr. 3 Buchst. a und § 1 Abs. 2;
  KFE-RL § 37 Abs. 1 ist Zielbestimmung.'
- 'Umsetzung: Spezialisierung von smokingStatus (followup). Als Phasen-Pendant mit specializes mihub.lung.followup.smokingStatus.v0.1
  anlegen (Präzedenz ecogPerformanceStatusSurveillance). Werte an die LOINC-Antwortliste LL2201-3 binden
  (ISiKRaucherStatus: required), SNOMED CT nur als Mapping. E-Zigarette und Passivrauch nicht im Status
  führen, sondern in otherTobaccoNicotineProductUse bzw. einem Expositionselement. Klarstellen, dass für
  Anspruch und Unterbrechungsregel der Zigarettenstatus zählt (nur Zigaretten, TrG S. 17). Das nicht existierende
  MII-Mapping (…/modul-person/StructureDefinition/Raucher) nicht übernehmen und in smokingStatus korrigieren.'
- Vor der Aufnahme ist mit check-duplicate-data-element gegen follow-up/smokingStatus zu prüfen, ob das
  Element als Phasen-Pendant (related_elements specializes) oder durch Wiederverwendung des Bestands abgebildet
  wird.
- LOINC 72166-2 und das ISiK-ValueSet beschreiben Tabakrauchen allgemein; für Anspruchsprüfung und Unterbrechungsregel
  zählt nach KFE-RL und Tragenden Gründen nur der Zigarettenkonsum. Zu entscheiden ist, ob der Zigarettenbezug
  über SNOMED-Zusatz-Codings (65568007, 281018007, 230059006) oder über eine eigene Teilangabe dokumentiert
  wird.
- Der Ausschluss von LA18981-3 und LA18982-1 aus dem required-ValueSet erfordert eine lokale Profilregel
  oder Erfassungsanweisung.
- Für 'unbekannt, ob je geraucht' (LA18980-5) gibt es in SNOMED CT nur das ungefähre Mapping 266927001.
- Ein stabiles MII-KDS-Profil zum Rauchen gibt es nicht, nur das Kardiologie-Ballot 2027; KBV-Basis, KBV
  MIO, gematik ePA und MII Soziodemographie haben kein Raucherprofil.
