id: mihub.lung.screening.screeningResultCategory.v0.1
uuid: ea55092b-bced-5f46-8e38-c867be5d8062
name: screeningResultCategory
label_de: Abschließendes Ergebnis der Früherkennungsuntersuchung
definition_de: 'Abschließende Rechtskategorie (unauffällig, kontroll-, abklärungsbedürftig) mit Datum:
  Erstbefund oder Ergebnis der gemeinsamen Beurteilung.'
phase: screening
category: befund
datatype: CodeableConcept
cardinality: 1..*
value_set:
  binding_strength: example
  standard_binding_status: no-standard-found
  notes: 'Editionen: SNOMED CT INT 20260701 und LOINC 2.83, MII TermServ (Stand 2026-10-15). Element-Code
    ist das Observable 271937008 ''Screening interpretation''. Die Antwortwerte sind die drei Ergebniskategorien
    der LuKrFrühErkV als lokales CodeSystem (Platzhalter, local-no-standard-binding): unauffällig (nicht
    legaldefiniert; G-BA und KBV: ''unauffällig'', S3: ''negativ''), kontrollbedürftig (§ 1 Abs. 4), abklärungsbedürftig
    (§ 1 Abs. 5); dazu Grundlage (Erstbefund allein | gemeinsame Beurteilung) und Zeitpunkt der abschließenden
    Beurteilung als Qualifier. Kein Standard (SNOMED, LOINC, MII, ISiK, KBV) bildet diese Kategorien ab.
    SNOMED-Codes nur als Mapping-Ziele, nicht als zulässige Antwortwerte: 171109003 für unauffällig (Relation
    inexact/narrower, da ein unauffälliger Befund benigne Befunde enthalten kann), 712875004 als gemeinsame
    Oberkategorie für kontroll- und abklärungsbedürftig (Relation broader). In LOINC 2.83 gibt es keinen
    Code für ein Lungenkrebs-Screening-Ergebnis. Nach Veröffentlichung des lokalen CodeSystems ist ein
    required-Binding auf die drei Kategorien vorgesehen. Rollen der Codes: snomed-ct|271937008 = element;
    local-no-standard-binding|unauffaellig = wert; local-no-standard-binding|kontrollbeduerftig = wert;
    local-no-standard-binding|abklaerungsbeduerftig = wert; snomed-ct|171109003 = wert; snomed-ct|712875004
    = wert.'
  codings:
  - system: snomed-ct
    code: '271937008'
    display: Screening interpretation
  - system: local-no-standard-binding
    code: unauffaellig
    display: unauffällig
  - system: local-no-standard-binding
    code: kontrollbeduerftig
    display: kontrollbedürftig
  - system: local-no-standard-binding
    code: abklaerungsbeduerftig
    display: abklärungsbedürftig
  - system: snomed-ct
    code: '171109003'
    display: Screening - NAD
  - system: snomed-ct
    code: '712875004'
    display: Abnormal finding on screening procedure
standard_mappings:
- standard: fhir-mii-kds
  profile_or_url: https://www.medizininformatik-initiative.de/fhir/ext/modul-bildgebung/StructureDefinition/mii-pr-bildgebung-radiologische-beobachtung
  resource: Observation
  path: Observation.code.coding (offenes Slicing, lokales Coding); Observation.value[x]; Observation.effective[x];
    Observation.method; Observation.hasMember; Observation.derivedFrom
  notes: de.medizininformatikinitiative.kerndatensatz.bildgebung#2026.0.0, stabil; Notlösung, da eine
    Rechtskategorie keine radiologische Beobachtung im engeren Sinn ist. Code und Wert aus dem lokalen
    CodeSystem; der sct-Slice bleibt leer, weil er REQUIRED an Clinical findings gebunden ist (271937008
    ist ein Observable und dort unzulässig). effective = Zeitpunkt der abschließenden Beurteilung; method
    oder lokale component = Grundlage (Erstbefund allein | gemeinsame Beurteilung). Verweise auf readerAssessmentCategory
    und lungRadsCategory nur über hasMember, denn derivedFrom ist auf DocumentReference, ImagingStudy,
    Media und QuestionnaireResponse beschränkt (derivedFrom → ImagingStudy). Die Zuordnung zu Lung-RADS
    gehört in eine ConceptMap.
- standard: fhir-mii-kds
  profile_or_url: https://www.medizininformatik-initiative.de/fhir/ext/modul-bildgebung/StructureDefinition/mii-pr-bildgebung-radiologischer-befund
  resource: DiagnosticReport
  path: DiagnosticReport.conclusionCode.coding (offenes Slicing; Slices sct und icd10-gm REQUIRED); DiagnosticReport.conclusion
  notes: 'de.medizininformatikinitiative.kerndatensatz.bildgebung#2026.0.0, stabil. Nur ergänzende Darstellung
    im Befundbericht: Kategorie als lokales Coding in conclusionCode außerhalb der Slices, Freitext in
    conclusion; führender Ort bleibt die Observation.'
- standard: other
  profile_or_url: http://hl7.eu/fhir/imaging/StructureDefinition/HL7IDRImpression
  resource: Extension auf DiagnosticReportEuImaging (extension:impression)
  path: Extension.value[x] = Reference(ObservationFindingEuImaging | Condition | …)
  notes: hl7.fhir.eu.imaging#1.0.0-ballot, Ballot/Draft. Strukturort für die abschließende Beurteilung;
    die Kategorie selbst bleibt ein lokales Coding in der referenzierten ObservationFindingEuImaging.
- standard: other
  profile_or_url: http://hl7.org/fhir/uv/ips/StructureDefinition/DiagnosticReport-uv-ips
  resource: DiagnosticReport
  path: DiagnosticReport.conclusionCode (Example-Binding clinical-findings); DiagnosticReport.conclusion
  notes: hl7.fhir.uv.ips#2.0.1, stabil, internationales Referenzmuster mit geringer Spezifität; lokales
    Coding ohne Bindungszwang möglich.
- standard: dicom-sr
  profile_or_url: https://dicom.nema.org/medical/dicom/current/output/chtml/part16/sect_DiagnosticImagingReportTemplates.html
  resource: TID 2000 Basic Diagnostic Imaging Report
  path: Row 8 CONTAINER aus CID 7001 = (19005-8, LN, "Impressions"); Inhalt TID 2002 Report Narrative
  notes: 'DICOM PS3.16 2026d, nicht-FHIR. Äquivalenz related: nur Überschrift bzw. Narrativ, keine Codes
    für die deutschen Rechtskategorien.'
- standard: openehr-archetype
  profile_or_url: openEHR-EHR-OBSERVATION.imaging_exam_result.v1
  resource: OBSERVATION
  path: /data[at0001]/events[at0002]/data[at0003]/items[at0021] (Overall impression, DV_TEXT)
  notes: openEHR CKM (CKM-mirror master, Stand 2026-10-15), Lifecycle published, nicht-FHIR. Lokale Terminologie
    als DV_CODED_TEXT binden.
