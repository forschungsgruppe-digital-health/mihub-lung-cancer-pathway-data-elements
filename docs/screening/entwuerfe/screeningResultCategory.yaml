issues:
- 'Verbindlichkeit nach Gegenprüfung: Pflicht. Kategorien legaldefiniert (LuKrFrühErkV § 1 Abs. 4/5);
  gemeinsame Beurteilung § 5 Abs. 3; Dokumentation KFE-RL § 44; Zählung für die QS (§ 7 Abs. 2 Nr. 2)
  und den Quartalsbericht an die KV (KFE-RL § 44).'
- 'Umsetzung: eigenständig (nimmt jointAssessment auf). jointAssessment hier aufgehen lassen, als Qualifier:
  Grundlage (Erstbefund allein | gemeinsame Beurteilung), Zeitpunkt der abschließenden Beurteilung (effective),
  optional Konsensuskonferenz bei Dissens. Lokales CodeSystem: unauffällig | kontrollbedürftig (§ 1 Abs.
  4) | abklärungsbedürftig (§ 1 Abs. 5); standard_binding_status no-standard-found; „unauffällig“ als
  nicht legaldefiniert kennzeichnen (TrG und KBV: „unauffällig“, S3: „negativ“). Mapping-Tabelle zu lungRadsCategory
  mit Regeln für Kategorie 0 und 4A. dependsOn readerAssessmentCategory; steuert recommendedManagement,
  recommendedControlInterval und abnormalResultDiscussion. Quellen ergänzen: § 1 Abs. 4 und 5, § 5 Abs.
  2 und 3, § 7 Abs. 2 Nr. 2; KFE-RL § 42 Abs. 3 und § 44; TrG S. 20; S3 Empf. 5.9.'
- Für die drei Ergebniskategorien der LuKrFrühErkV muss ein lokales CodeSystem mit kanonischer URL im
  mihub-Namensraum veröffentlicht werden; danach soll das Binding auf required angehoben werden.
- Die Kategorie 'unauffällig' ist nicht legaldefiniert; die Bezeichnung (unauffällig vs. negativ) ist
  festzulegen und im CodeSystem zu kennzeichnen.
- Es fehlt eine ConceptMap zu lungRadsCategory mit Regeln für Lung-RADS 0 (vorläufig) und 4A.
- Ein SNOMED-Antrag (DE-Extension) für 'kontrollbedürftiger' und 'abklärungsbedürftiger Screeningbefund'
  wäre zu prüfen; bisher gibt es nur die unscharfen Mapping-Ziele 171109003 (narrower) und 712875004 (broader).
- Kein deutsches oder internationales FHIR-IG zur Lungenkrebsfrüherkennung bildet die Rechtskategorien
  ab; die Abbildung auf das MII-Profil radiologische-beobachtung ist eine Notlösung.
- Kardinalität laut Quelle 1..1 je Runde (vorher Status „ausstehend“).
