issues:
- 'Verbindlichkeit nach Gegenprüfung: Leitlinie. S3 Tab. 17, Kategorie 4A (Kann-Option PET/CT nach Fallkonferenzbeschluss
  bei Malignitätswahrscheinlichkeit > 10 %); das Modell legt die S3 nicht fest.'
- 'Umsetzung: Teil von pulmonaryNoduleFinding. Im Screening auf den Baseline-Wert (Brock/PanCan) aus der
  gemeinsamen Beurteilung beschränken; den Herder-Wert nach PET/CT der Abklärung zuordnen. Modell verpflichtend
  als Observation.method, Einheit UCUM %, lokaler Code (no-standard-found). isPartOf pulmonaryNoduleFinding,
  dependsOn noduleSizeMeasurement; emphysemaSeverity (vorhanden/nicht vorhanden) ist Brock-Eingang. Abgrenzung
  zum verworfenen personenbezogenen Risikoscore (lungCancerRiskModelScore). S3 Empf. 6.29, 6.30 und 6.41
  betreffen inzidentelle Rundherde außerhalb der Früherkennung und sind kein Screening-Beleg.'
- Es fehlt ein Standard-Observable 'Probability of malignancy of pulmonary nodule' (SNOMED CT bzw. LOINC);
  ein Konzeptantrag, z. B. ein LOINC-Term mit Methode 'Calculated.Brock', ist zu erwägen.
- Für das Brock-/PanCan-Modell (McWilliams 2013) und das Herder-Modell gibt es keine Instrument-Codes;
  lokale Methodencodes sind festzulegen.
- Zu entscheiden ist die Abbildung als Observation im Rundherd-Befundbaum (MII) oder als RiskAssessment
  (semantisch passender, aber nicht per hasMember einhängbar).
- Der Umfang im Screening ist auf den Baseline-Wert (Brock/PanCan) der gemeinsamen Beurteilung zu begrenzen;
  der Herder-Wert nach PET/CT gehört zur Abklärung.
- Kein deutsches Profil (MII, ISiK, KBV, gematik ePA) bildet eine läsionsbezogene Malignitätswahrscheinlichkeit
  ab.
