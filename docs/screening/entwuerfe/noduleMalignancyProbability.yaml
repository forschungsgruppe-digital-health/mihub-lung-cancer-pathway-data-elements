id: mihub.lung.screening.noduleMalignancyProbability.v0.1
uuid: 04511392-2c89-5c1b-8e16-e5de190e3295
name: noduleMalignancyProbability
label_de: Malignitätswahrscheinlichkeit des Rundherds
definition_de: Malignitätswahrscheinlichkeit in % mit Modell (Brock/PanCan, Herder); Entscheidungskriterium
  bei Lung-RADS 4A (> 10 %).
phase: screening
category: assessment
datatype: Quantity
cardinality: 0..*
unit: '%'
value_set:
  binding_strength: example
  standard_binding_status: no-standard-found
  notes: 'Lokaler Element-Code, da weder SNOMED CT noch LOINC, NCIt oder RadLex ein Observable für die
    Malignitätswahrscheinlichkeit eines Lungenrundherds enthalten; Einheit UCUM %. Das Modell (Brock/PanCan
    nach McWilliams 2013 für den Baseline-Wert; Herder erst nach PET/CT in der Abklärung) ist verpflichtend
    als Observation.method mit lokalem Code anzugeben, da auch dafür keine Instrument-Codes existieren.
    LOINC 101445-5/101444-8 (blutbasierte Nodify-Tests) und SNOMED 1279908003 (Metastasierungsrisiko)
    passen fachlich nicht. Editionen: SNOMED CT INT 20260701, LOINC 2.83, NCIt 25.6.0-e, RadLex 4.2, UCUM
    (MII TermServ); Stand 2026-10-15. Rollen der Codes: local-no-standard-binding|noduleMalignancyProbability
    = element.'
  codings:
  - system: local-no-standard-binding
    code: noduleMalignancyProbability
    display: Malignitätswahrscheinlichkeit des Rundherds
standard_mappings:
- standard: fhir-mii-kds
  profile_or_url: https://www.medizininformatik-initiative.de/fhir/ext/modul-bildgebung/StructureDefinition/mii-pr-bildgebung-radiologische-beobachtung
  resource: Observation
  path: Observation.code; Observation.valueQuantity (UCUM %); Observation.method; Observation.derivedFrom;
    hasMember vom Rundherd
  notes: de.medizininformatikinitiative.kerndatensatz.bildgebung#2026.0.0, stabil. Ziel, wenn das Element
    im Befundbaum (hasMember von pulmonaryNoduleFinding) bleibt. code nur lokal (offenes Slicing; ein
    SNOMED-Code wäre an Clinical finding gebunden). value[x] als Quantity (%); method 0..1 projektseitig
    verpflichtend (lokaler Modellcode Brock/PanCan bzw. Herder); derivedFrom (MS) → Eingangsgrößen (Größe,
    emphysemaSeverity). Im Ballot 2027 analog über radiologische-messung (value Quantity, method MS).
- standard: fhir-r4-base
  profile_or_url: http://hl7.org/fhir/StructureDefinition/RiskAssessment
  resource: RiskAssessment
  path: RiskAssessment.prediction.probability[x] (probabilityDecimal); RiskAssessment.prediction.outcome;
    RiskAssessment.method; RiskAssessment.basis; RiskAssessment.condition
  notes: 'hl7.fhir.r4.core#4.0.1 (Ressource im Status draft), kein deutsches Profil. Semantisch passendste
    Ressource: probabilityDecimal als Prozent (Invariante ras-2 ''Must be <= 100''), method = Modell (verpflichtend
    fordern), basis → Rundherd-Observation, Größe und emphysemaSeverity, condition optional → Rundherd
    als Condition; prediction.outcome = Malignität (Code offen). Einschränkung: RiskAssessment kann nicht
    über Observation.hasMember in den Rundherd-Befundbaum eingehängt werden (hasMember erlaubt nur Observation,
    QuestionnaireResponse, MolecularSequence); die Verknüpfung läuft nur rückwärts über basis. Das MII-RiskAssessment-Profil
    (Molekulargenetik, polygener Risiko-Score) dient nur als Muster.'
- standard: openehr-archetype
  profile_or_url: openEHR-EHR-EVALUATION.health_risk.v1
  resource: EVALUATION
  path: at0002 Health risk; at0003 Risk assessment; at0022 Absolute risk; at0025 Assessment method; at0013/at0016
    Risk factor(s)
  notes: openEHR CKM-Mirror (Commit e72871205f, 2026-10-15), published, nicht-FHIR. Generisches Risikomodell
    mit Methode und Risikofaktoren; der Bezug auf einen einzelnen Rundherd muss über Link bzw. Kontext
    hergestellt werden.
