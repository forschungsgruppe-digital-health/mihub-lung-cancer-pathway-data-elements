id: mihub.lung.screening.ldctAcquisitionParameters.v0.1
uuid: 433eaa12-5a91-5db0-b63a-e97ae020bb45
name: ldctAcquisitionParameters
label_de: Aufnahme- und Rekonstruktionsparameter nach Anlage zu § 4 (mit Konformität)
definition_de: Protokollparameter nach Anlage (Gerät, Scan-/Rotationszeit, Kollimation, Pitch, kV/mA,
  Schichtdicke, Kern, Rekonstruktion, kein Kontrastmittel) mit Konformität.
phase: screening
category: bildgebung
datatype: Reference
cardinality: 0..*
unit: s
value_set:
  binding_strength: example
  standard_binding_status: mapped
  notes: 'Kern des Elements ist die Konformität mit der Anlage zu § 4 LuKrFrühErkV (eingehalten ja/nein
    plus Abweichungen; lokal, ohne Standardcode) mit Referenz auf den CT-Dosisbericht (Dokumentklasse
    DCM 113701 X-Ray Radiation Dose Report, TID 10011) bzw. die DICOM-Studie. Element-Code DCM 113822
    CT Acquisition Parameters (TID 10013). Einzelparameter als Element-Codes der Komponenten, aus dem
    RDSR übernommen: unter 113819 CT Acquisition direkt 113820 CT Acquisition Type (Antwortwert SNOMED
    116152004 Spiral), 113842 X-Ray Modulation Type (Werte aus DICOM CID 10035; Näherung für die Dosisautomatik)
    und 113961 Reconstruction Algorithm (Antwortwerte 113962 Filtered Back Projection, 113963 Iterative
    Reconstruction; CID 10033); unter 113822 die Parameter 113824 Exposure Time [s], 113826 Nominal Single
    Collimation Width [mm] und 113828 Pitch Factor [{ratio}]; unter 113831 CT X-Ray Source Parameters
    113733 KVP [kV], 113734 X-Ray Tube Current [mA] und 113834 Exposure Time per Rotation [s]. DCM 113824
    ist nicht deckungsgleich mit dem MII-Slice exposureTime (ms, DICOM-Bildattribut). SNOMED 395081000119108
    belegt „ohne Kontrastmittel“ auf Prozedurebene. Binding example, weil die Parameter aus dem RDSR übernommen
    statt erfasst werden. Editionen: MII TermServ, DICOM 2025.3, SNOMED CT 20260701, UCUM 1.0.1; Stand
    2026-10-15. Rollen der Codes: dicom-dcm|113822 = element; dicom-dcm|113701 = dokumentklasse; dicom-dcm|113820
    = element; snomed-ct|116152004 = wert; dicom-dcm|113824 = element; dicom-dcm|113826 = element; dicom-dcm|113828
    = element; dicom-dcm|113733 = element; dicom-dcm|113734 = element; dicom-dcm|113834 = element; dicom-dcm|113842
    = element; dicom-dcm|113961 = element; dicom-dcm|113962 = wert; dicom-dcm|113963 = wert; snomed-ct|395081000119108
    = methode.'
