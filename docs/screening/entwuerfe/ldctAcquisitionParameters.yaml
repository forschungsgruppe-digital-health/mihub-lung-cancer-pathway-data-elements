issues:
- 'Verbindlichkeit nach Gegenprüfung: keine. Die Einhaltung der Anlage ist Pflicht (LuKrFrühErkV § 4 Abs.
  1 mit Anlage; QS-Vereinbarung § 11 Abs. 5); eine Einzeldokumentation je Untersuchung schreibt keine
  Norm vor (das QS-System „berücksichtigt“ die Parameter, § 7 Abs. 1 S. 2 Nr. 3).'
- 'Umsetzung: eigenständig, reduziert auf Konformität und RDSR-Referenz. Auf die Konformität je LDCT reduzieren
  (Anlage zu § 4 eingehalten ja/nein plus Abweichungen) mit Reference auf den RDSR (DCM 113701) bzw. die
  DICOM-Studie; Kerncode DCM 113822 statt 113828. Parameterliste an die Anlage angleichen: Spannungs-
  und Dosisautomatik ja/nein statt kV/mA; „Schichtdicke“ stammt nicht aus der Anlage (Belege S3 Kap. 6.3,
  ACR #150). Geräte- und protokollbezogene Anforderungen (dynamische Kollimation, Rekonstruktionsverfahren,
  Befundarbeitsplatz) in Struktur- bzw. QS-Daten auslagern. Primärquelle auf § 4 Abs. 1 mit Anlage umstellen,
  § 7 Abs. 1 S. 2 Nr. 3 als QS-Bezug.'
- Für die Konformitätsaussage „Anlage zu § 4 LuKrFrühErkV eingehalten ja/nein plus Abweichungen“ gibt
  es keinen Standardcode und kein Profilelement; ein lokales Element ist festzulegen.
- Ob DICOM CID 10033 iterative und KI-basierte Rekonstruktion vollständig abdeckt, ist offen; Spannungsautomatik
  und dynamische Kollimation haben keinen eigenen Code, der Faltungskern nur ein Textattribut.
- Geräte- und protokollbezogene Anforderungen der Anlage (dynamische Kollimation, Rekonstruktionsverfahren,
  Befundarbeitsplatz) sind in Struktur- bzw. QS-Daten auszulagern.
- Die Parameterliste ist an die Anlage anzugleichen (Spannungs- und Dosisautomatik ja/nein statt kV/mA;
  Schichtdicke nicht aus der Anlage).
- Die Primärquelle ist auf LuKrFrühErkV § 4 Abs. 1 mit Anlage umzustellen, § 7 Abs. 1 S. 2 Nr. 3 als QS-Bezug;
  Kardinalität 0..*.
- Die Systemschlüssel dicom-dcm und ucum-Annotationen ({ratio}) sind in der Terminologieprüfung des Repos
  zu berücksichtigen.
