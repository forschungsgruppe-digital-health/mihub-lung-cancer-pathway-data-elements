standard_mappings:
- standard: fhir-mii-kds
  profile_or_url: https://www.medizininformatik-initiative.de/fhir/ext/modul-bildgebung/StructureDefinition/mii-ex-bildgebung-modalitaet-ct
  resource: ImagingStudy
  path: ImagingStudy.series.extension:modalitaetCT
  notes: 'de.medizininformatikinitiative.kerndatensatz.bildgebung#2026.0.0, stabil (in 2027.0.0-ballot.1
    unverändert). Teilabdeckung der Anlage je Serie: Sub-Extensions KVP (kV), exposureTime (ms), exposure,
    xRayTubeCurrent (mA), convolutionalKernel (string), CTDIvol, je 0..1. Es fehlen Pitch, Kollimation,
    Rotationszeit, Dosis- und Spannungsautomatik, Rekonstruktionsverfahren, dynamische Kollimation und
    das Konformitätsflag. exposureTime in ms ist nicht die RDSR-Expositionszeit in s; bei Übernahme umrechnen.'
- standard: fhir-mii-kds
  profile_or_url: https://www.medizininformatik-initiative.de/fhir/ext/modul-bildgebung/StructureDefinition/mii-ex-bildgebung-serie-schichtdicke
  resource: ImagingStudy
  path: ImagingStudy.series.extension:schichtdicke
  notes: 'de.medizininformatikinitiative.kerndatensatz.bildgebung#2026.0.0, stabil. Schichtdicke je Serie
    (value[x] Quantity 1..1 MS); eingebunden in mii-pr-bildgebung-bildgebungsstudie als series.extension:schichtdicke
    0..1. Die Schichtdicke ist kein Parameter der Anlage zu § 4 (Belege S3 Kap. 6.3, ACR #150), nur ergänzend.'
- standard: fhir-mii-kds
  profile_or_url: https://www.medizininformatik-initiative.de/fhir/ext/modul-bildgebung/StructureDefinition/mii-ex-bildgebung-kontrastmittel
  resource: ImagingStudy
  path: ImagingStudy.series.extension:kontrastmittel.extension:contrastBolus
  notes: de.medizininformatikinitiative.kerndatensatz.bildgebung#2026.0.0, stabil. „Kein Kontrastmittel“
    nach Anlage als contrastBolus = false (boolean) je Serie; Sub-Extension contrastBolusDetails für Angaben
    bei KM-Gabe. Eingebunden in mii-pr-bildgebung-bildgebungsstudie als series.extension:kontrastmittel
    0..1.
- standard: fhir-mii-kds
  profile_or_url: https://www.medizininformatik-initiative.de/fhir/ext/modul-bildgebung/StructureDefinition/mii-pr-bildgebung-geraet
  resource: Device
  path: Device.version.value
  notes: de.medizininformatikinitiative.kerndatensatz.bildgebung#2026.0.0, stabil. Gerätebezug des CT
    (manufacturer 0..1 MS, deviceName 0..* MS, version.value 1..1 für die Softwareversion), referenziert
    aus bildgebungsstudie series.performer.actor. Geräteanforderungen der Anlage (Detektorzeilen, Rotationszeit,
    dynamische Kollimation) gehören in Struktur- bzw. QS-Daten, nicht in die Einzeluntersuchung.
- standard: dicom-sr
  profile_or_url: https://dicom.nema.org/medical/dicom/current/output/chtml/part16/sect_TID_10013.html
  path: TID 10011 (113701) > TID 10013 > 113819 CT Acquisition > 113820 CT Acquisition Type, 113961 Reconstruction
    Algorithm, 113842 X-Ray Modulation Type; 113822 CT Acquisition Parameters > 113824, 113826, 113827,
    113828; 113831 CT X-Ray Source Parameters > 113733, 113734, 113834; TID 10015 CT Dose Check Details
  notes: DICOM PS3.16 2026d, nicht-FHIR. Vollständigste Quelle der Aufnahmeparameter je Bestrahlungsereignis
    im CT-RDSR (SOP Class X-Ray Radiation Dose SR 1.2.840.10008.5.1.4.1.1.88.67). 113828 Pitch Factor
    ist bei Spiral- oder Sequenzaufnahme gefordert. Rekonstruktionsverfahren (CID 10033) und Dosismodulation
    (CID 10035) sind als Content-Items vorhanden. Als Element genügt eine Reference auf die RDSR-Instanz
    plus das Konformitätsergebnis.
