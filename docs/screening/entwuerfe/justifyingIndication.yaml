id: mihub.lung.screening.justifyingIndication.v0.1
uuid: 3d3cf7e7-8677-54ec-b8b2-1c78daf266c5
name: justifyingIndication
label_de: Rechtfertigende Indikation (§ 83 Abs. 3 StrlSchG) mit Zeitpunkt
definition_de: Rechtfertigende Indikation des Erstbefunders unter Berücksichtigung des Berichts, mit Zeitpunkt,
  Person und Befragung zu früheren Strahlenanwendungen.
phase: screening
category: prozedur
datatype: string
cardinality: 1..*
value_set:
  binding_strength: example
  standard_binding_status: no-standard-found
  notes: 'Für die strahlenschutzrechtliche rechtfertigende Indikation (Nutzen-Risiko-Entscheidung der
    fachkundigen Ärzt:in nach § 83 Abs. 3 StrlSchG, Euratom 2013/59 Art. 55) gibt es weder in SNOMED CT
    noch in LOINC ein Konzept. Elementcode und Ergebniswerte (gestellt | nicht-gestellt) sind daher lokal.
    Optional kennzeichnet SNOMED CT 372049008 Assessment of history of previous radiation exposure den
    Teilschritt ''Befragung zu früheren Strahlenanwendungen'' (StrlSchV § 119 Abs. 3 S. 2). Verworfen:
    432678004 Indication for procedure (klinischer Grund), 225336000 Radiation risk assessment (Bedeutung
    unklar), LOINC 18785-6 und 73569-6 (Befundabschnitte). Modellierung als Procedure: performed[x] =
    Zeitpunkt der Indikationsstellung (StrlSchG § 85 Abs. 1 S. 2 Nr. 1), performer = Erstbefunder, outcome
    = lokaler Wert. MII TermServ, SNOMED CT International 20260701 und LOINC 2.83, Stand 2026-10-15. Rollen
    der Codes: local-no-standard-binding|rechtfertigende-indikation = element; local-no-standard-binding|gestellt
    = wert; local-no-standard-binding|nicht-gestellt = wert; snomed-ct|372049008 = methode.'
  codings:
  - system: local-no-standard-binding
    code: rechtfertigende-indikation
    display: Rechtfertigende Indikation nach § 83 Abs. 3 StrlSchG
  - system: local-no-standard-binding
    code: gestellt
    display: Rechtfertigende Indikation gestellt
  - system: local-no-standard-binding
    code: nicht-gestellt
    display: Rechtfertigende Indikation nicht gestellt
  - system: snomed-ct
    code: '372049008'
    display: Assessment of history of previous radiation exposure
standard_mappings:
- standard: fhir-mii-kds
  profile_or_url: https://www.medizininformatik-initiative.de/fhir/ext/modul-bildgebung/StructureDefinition/mii-pr-bildgebung-bildgebungsprozedur
  resource: Procedure
  path: Procedure.basedOn (1..*) → mii-pr-bildgebung-anforderung-bildgebung; Procedure.performed[x]
  notes: 'de.medizininformatikinitiative.kerndatensatz.bildgebung#2026.0.0, stabil. Nur Kontext bzw. Verknüpfungsziel,
    kein Mapping des Elementinhalts: Die LDCT-Prozedur verweist über basedOn (1..* MS) auf die Anforderung.
    Die rechtfertigende Indikation selbst (Person, Zeitpunkt, Ergebnis) hat im Profil kein Element und
    wird als eigene Procedure geführt, die über partOf auf die Bildgebungsprozedur zeigt.'
- standard: fhir-r4-base
  profile_or_url: http://hl7.org/fhir/StructureDefinition/Procedure
  resource: Procedure
  path: Procedure.code (lokaler Code); Procedure.performed[x]:performedDateTime; Procedure.performer.actor;
    Procedure.outcome (gestellt | nicht-gestellt); Procedure.partOf
  notes: 'hl7.fhir.r4.core#4.0.1, stabil. Primäres FHIR-Ziel, solange kein validierter SNOMED-Prozedurcode
    vorliegt: code ist nur example-gebunden, ein lokaler Code ist zulässig. performed[x] = Zeitpunkt der
    Indikationsstellung, performer.actor = Erstbefunder, outcome = lokaler Ergebniswert, partOf = LDCT-Prozedur.
    Das MII-Prozedurprofil scheidet aus, weil seine Invariante sct-ops-1 einen SNOMED-Code aus procedures-sct
    (descendent-of 71388002) oder einen OPS-Code verlangt.'
- standard: other
  profile_or_url: http://hl7.eu/fhir/imaging/StructureDefinition/ServiceRequestOrderEuImaging
  resource: ServiceRequest
  path: ServiceRequest.extension:reason (http://hl7.org/fhir/5.0/StructureDefinition/extension-ServiceRequest.reason);
    ServiceRequest.reasonCode; ServiceRequest.reasonReference
  notes: 'hl7.fhir.eu.imaging#1.0.0-ballot (status draft), Ballot. Äquivalenz related-to: Die Elemente
    tragen die medizinische Begründung der Anforderung durch die Überweisenden (''Explanation/Justification
    for procedure or service''), nicht die strahlenschutzrechtliche Indikationsstellung des Erstbefunders
    mit Person, Zeitpunkt und Ergebnis.'
- standard: other
  profile_or_url: https://dicom.nema.org/medical/dicom/current/output/chtml/part06/chapter_6.html
  resource: DICOM-Attribute (Modality Worklist / Requested Procedure)
  path: (0040,1002) Reason for the Requested Procedure (LO); (0040,100A) Reason for Requested Procedure
    Code Sequence (SQ)
  notes: 'DICOM PS3.6 (current, Edition 2025.3 bzw. abgerufen 2026-10-15), nicht-FHIR. Äquivalenz related-to:
    Die Attribute bringen die Indikation in den Modalitäts-Workflow, nicht aber die Indikationsstellung
    (Person, Zeitpunkt, gestellt/nicht gestellt).'
- standard: dicom-sr
  profile_or_url: https://dicom.nema.org/medical/dicom/current/output/chtml/part16/sect_CID_7001.html
  resource: DICOM SR TID 2000 Basic Diagnostic Imaging Report, Überschrift aus CID 7001
  path: CONTAINER (LN 18785-6 'Indications for Procedure')
  notes: DICOM PS3.16 (current, abgerufen 2026-10-15), nicht-FHIR, breites Mapping. Im Befundbericht kann
    die Indikation unter 18785-6 nur narrativ stehen; die Aufzeichnungspflicht nach StrlSchG § 85 Abs.
    1 S. 2 Nr. 1 (Angaben und Zeitpunkt) ist damit nicht strukturiert abgedeckt.
care_process:
