issues:
- 'Verbindlichkeit nach Gegenprüfung: Pflicht. LuKrFrühErkV § 3 Nr. 2 (rechtfertigende Indikation nach
  StrlSchG § 83 Abs. 3 unter Berücksichtigung des Berichts); Aufzeichnung mit Zeitpunkt StrlSchG § 85
  Abs. 1 S. 2 Nr. 1; Befragung zu früheren Strahlenanwendungen StrlSchV § 119 Abs. 3 S. 2; Rolle KFE-RL
  § 41 Abs. 1 S. 1, § 39 Nr. 3, § 43 Abs. 5.'
- 'Umsetzung: eigenständig. Strukturiert modellieren, z. B. Procedure: performed[x] = Zeitpunkt der Indikationsstellung,
  performer = Erstbefunder, outcome gestellt | nicht gestellt (lokal, no-standard-found). Die Befragung
  zu früheren Strahlenanwendungen nicht doppelt führen, sondern über dependsOn auf lastQualifyingChestCtDate,
  eligibilityReport und eligibilityCheckResult verweisen (statt des verworfenen firstReaderEligibilityVerification).
  StrlSchG § 85 Abs. 1 S. 2 Nr. 1 als Quelle der Dokumentationspflicht und StrlSchV § 119 Abs. 3 S. 2
  aus den notes in sources überführen.'
- Für die rechtfertigende Indikation fehlt ein Standardkonzept; ein SNOMED-CT-Antrag ('Justification of
  medical exposure to ionising radiation (procedure)') über das deutsche NRC ist zu prüfen. Auch die Ergebniswerte
  gestellt/nicht gestellt sind nicht standardkodiert.
- Das MII-Prozedurprofil ist erst nutzbar, wenn ein SNOMED-Prozedurcode unter 71388002 für die Indikationsstellung
  gefunden und am MII TermServ validiert ist; bis dahin dient die FHIR-R4-Basis-Procedure.
- 'Der Datentyp ist noch festzulegen: Der Kandidat nennt dateTime, die Modellierung sieht eine Reference
  auf Procedure (bzw. CodeableConcept plus dateTime) je LDCT-Runde vor.'
- Die Befragung zu früheren Strahlenanwendungen (StrlSchV § 119 Abs. 3 S. 2) soll nicht doppelt geführt
  werden, sondern über dependsOn auf lastQualifyingChestCtDate, eligibilityReport und eligibilityCheckResult;
  372049008 ist nur optional.
- Die Rolle 'performer = Erstbefunder nach LuKrFrühErkV § 6 Abs. 1' ist in keinem Profil qualifiziert;
  DICOM-Dosisberichte (RDSR) enthalten keine Rechtfertigung.
- Kardinalität laut Quelle 1..1 je LDCT-Runde.
