id: mihub.lung.screening.patientInformationLeafletProvided.v0.1
uuid: a765ce60-8d94-5047-a425-d02282cc9b11
name: patientInformationLeafletProvided
label_de: Aushändigung der G-BA-Versicherteninformation (Fassung, Format)
definition_de: Aushändigung der Versicherteninformation nach Anlage I KFE-RL mit Datum, Fassung und Format
  (Druck, elektronisch, Leichte Sprache).
phase: screening
category: dokument
datatype: string
cardinality: 1..*
value_set:
  binding_strength: preferred
  standard_binding_status: mapped
  notes: 'SNOMED CT INT 20260701, KDL 2025 (MII TermServ), Stand 2026-10-15. Element-Code: 699117005 Provision
    of leaflet (Procedure.code der Aushändigung), Fallback 699823003 Provision of written information;
    beide unter 71388002 und damit in den Prozedur-ValueSets von MII, ISiK und KBV. Dokumentklasse der
    ausgehändigten G-BA-Versicherteninformation (Anlage I KFE-RL): KDL AM160202 Informationsblatt (DocumentReference.type;
    ConceptMap zu IHE typeCode PATI und classCode ADM, equivalence wider), Ausweichklasse AM160299. Antwortwerte
    für das Format als lokale Werteliste: Druck | barrierefreies PDF | Leichte Sprache. Fassung und Fassungsdatum
    sind Attribute der DocumentReference (content.attachment.creation, title bzw. relatesTo), kein Code.
    Nicht verwenden: 413318004 (Befund statt Prozedur), KDL AM010302 (Aufklärungsbogen). Rollen der Codes:
    snomed-ct|699117005 = element; snomed-ct|699823003 = element; local-no-standard-binding|print = wert;
    local-no-standard-binding|accessible-pdf = wert; local-no-standard-binding|easy-language = wert; kdl|AM160202
    = dokumentklasse; kdl|AM160299 = dokumentklasse.'
  codings:
  - system: snomed-ct
    code: '699117005'
    display: Provision of leaflet
  - system: snomed-ct
    code: '699823003'
    display: Provision of written information
  - system: local-no-standard-binding
    code: print
    display: Druck
  - system: local-no-standard-binding
    code: accessible-pdf
    display: barrierefreies PDF
  - system: local-no-standard-binding
    code: easy-language
    display: Leichte Sprache
  - system: kdl
    code: AM160202
    display: Informationsblatt
  - system: kdl
    code: AM160299
    display: Sonstiges Patienteninformationsblatt
standard_mappings:
- standard: fhir-mii-kds
  profile_or_url: https://www.medizininformatik-initiative.de/fhir/ext/modul-dokument/StructureDefinition/mii-pr-dokument-dokument
  resource: DocumentReference
  path: DocumentReference.type.coding:KDL
  notes: 'de.medizininformatikinitiative.kerndatensatz.dokument#2026.0.1 (stabil; gleiche URL in 2027.0.0-ballot.2).
    Beschreibt die ausgehändigte Fassung: type.coding:KDL 0..1 MS REQUIRED an http://dvmd.de/fhir/ValueSet/kdl
    (AM160202); type.coding:XDS REQUIRED an IHEXDStypeCode (PATI; ConceptMap kdl-ihe-typecode, equivalence
    wider). content.attachment 1..1 MS (url, title des G-BA-PDF); das Fassungsdatum gehört in content.attachment.creation,
    die Fassung in title bzw. relatesTo (0..* MS) – DocumentReference.date ist nur der Anlagezeitpunkt
    der DocumentReference. content.format ist preferred an mii-vs-dokument-format-code gebunden und beschreibt
    das technische Format; die sprachliche Fassung (Leichte Sprache) braucht einen lokalen Qualifier.
    context.related verweist auf Prozedur bzw. Kontakt.'
- standard: fhir-isik
  profile_or_url: https://gematik.de/fhir/isik/StructureDefinition/ISiKDokumentenMetadaten
  resource: DocumentReference
  path: DocumentReference.type.coding:KDL
  notes: 'de.gematik.isik#6.0.0 (stabil). Strenger als MII: type.coding:KDL 1..1 MS REQUIRED (AM160202);
    category.coding:XDS 1..1 REQUIRED an IHEXDSclassCode (ADM); content.attachment.contentType, language,
    title und creation min 1; content.format min 1 REQUIRED an IHEXDSformatCodeDE (passender Formatcode
    für ein PDF-Informationsblatt noch festzulegen).'
- standard: kbv-mio
  profile_or_url: https://fhir.kbv.de/StructureDefinition/KBV_PR_Base_DocumentReference
  resource: DocumentReference
  path: DocumentReference.type.coding:xds
  notes: 'kbv.basis#1.9.0 (stabil; KBV-Basisprofil, kein MIO – im Bestand erste Verwendung unter kbv-mio).
    Für das PVS: type.coding:xds REQUIRED an IHEXDStypeCode (PATI), type.coding:kbv REQUIRED an KBV_VS_Base_Document_Type_KBV
    (passender Code noch offen), category.coding:xds REQUIRED an IHEXDSclassCode (ADM).'
- standard: gematik-epa-fhir
  profile_or_url: https://gematik.de/fhir/epa-mhd/StructureDefinition/epa-mhd-document-reference
  resource: DocumentReference
  path: DocumentReference.type.coding
  notes: 'de.gematik.epa.mhd#1.1.3 (stabil). Nur relevant, wenn Versicherteninformation bzw. Aushändigungsnachweis
    in die ePA eingestellt werden: type.coding REQUIRED an epa-xds-type-code-vs (schließt IHE-D typeCode,
    urn:oid:1.3.6.1.4.1.19376.3.276.1.5.9 v4.0.0, ein – PATI); category.coding REQUIRED an epa-xds-class-code-vs
    (ADM); content.format 1..1 und attachment.title 1..1 Pflicht. In der ePA ist das System die OID-URN,
    nicht die http-URL von IHE-D.'
- standard: fhir-mii-kds
  profile_or_url: https://www.medizininformatik-initiative.de/fhir/core/modul-prozedur/StructureDefinition/Procedure
  resource: Procedure
  path: Procedure.code.coding:sct; Procedure.report
  notes: 'de.medizininformatikinitiative.kerndatensatz.base#2026.0.1 (stabil). Alternative: Aushändigung
    als Procedure mit code.coding:sct 699117005 bzw. 699823003 (REQUIRED procedures-sct, beide enthalten).
    Den Verweis auf das Dokument über report (0..*, Reference DocumentReference) führen – usedReference
    erlaubt in R4 nur Device, Medication und Substance. partOf (Procedure | Observation | MedicationAdministration)
    verweist auf die Prozedur screeningInformationConsultation.'
- standard: fhir-r4-base
  profile_or_url: http://hl7.org/fhir/StructureDefinition/Communication
  resource: Communication
  path: Communication.payload.content[x]; Communication.sent; Communication.medium
  notes: 'hl7.fhir.r4.core#4.0.1 (Ressource mit SD-Status draft). Fachlich naheliegend für die Aushändigung
    an die versicherte Person, auch über das Portal: payload.content[x] 1..1 (Attachment oder Reference(DocumentReference)),
    sent = Aushändigungsdatum, medium (example, http://terminology.hl7.org/CodeSystem/v3-ParticipationMode)
    für Druck vs. elektronisch, recipient = Patient, partOf bzw. encounter auf das Informationsgespräch.
    Kein deutsches Profil.'
- standard: ihe-xds
  profile_or_url: http://ihe-d.de/CodeSystems/IHEXDStypeCode
  resource: XDS DocumentEntry.typeCode / classCode
  path: typeCode PATI 'Patienteninformationen'; classCode ADM 'Administratives Dokument'
  notes: de.ihe-d.terminology#3.0.1 (stabil). Metadaten für den Dokumentenaustausch (XDS bzw. MHD). PATI
    passt genau ('Reine Informationsblätter für den Patienten', nicht unterschrieben); nicht EINW, das
    unterschriebene Dokumente meint.
- standard: openehr-archetype
  profile_or_url: https://ckm.openehr.org/ckm/archetypes/1013.1.4513
  resource: openEHR-EHR-CLUSTER.information_resource.v1
  path: /items[at0002] (Resource name); /items[at0015] (Version); /items[at0014] (Published); /items[at0016]
    (Type of media)
  notes: openEHR CKM information_resource.v1, Revision 1.0.1 (published; nicht-FHIR). Bildet Dokument,
    Fassung, Veröffentlichungsdatum und Medienart direkt ab; Einbettung in ACTION.health_education.v1
    über den Slot Additional details (at0033); Material details (at0025) nimmt nur CLUSTER.multimedia
    auf.
care_process:
  trigger: im Informationsgespräch (Erstberatung); erneut bei neuer Fassung
  responsible_role: berichterstellende Ärzt:in; Bereitstellung auch über das Portal
