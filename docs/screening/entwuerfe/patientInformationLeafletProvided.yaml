issues:
- 'Verbindlichkeit nach Gegenprüfung: Pflicht. LuKrFrühErkV § 2 Abs. 1 S. 1 Nr. 4 und S. 2 (Strahlenrisiko
  in Textform); KFE-RL § 40 S. 1 mit Anlage I; obligater Leistungsinhalt von EBM 01876.'
- 'Umsetzung: Teil von screeningInformationConsultation. Als hasPart von screeningInformationConsultation
  modellieren. Datentyp Reference(DocumentReference) mit G-BA-Dokument, Fassungsdatum und Format (Druck
  | barrierefreies PDF | Leichte Sprache) oder Procedure (code 699823003, usedReference). Quellen ergänzen:
  LuKrFrühErkV § 2 Abs. 1 S. 1 Nr. 4 und S. 2, KFE-RL § 40 S. 1 mit Anlage I; EBA 87 als Abrechnungsbeleg.
  Prüfpunkt: Die Fassung in Leichter Sprache (25.06.2026) ist nicht Anlage I; ob ihre alleinige Aushändigung
  § 40 erfüllt, ist offen.'
- Für das Format bzw. die Fassung der Versicherteninformation (Anlage I | Leichte Sprache | barrierefreies
  PDF) gibt es keine standardisierte Werteliste; content.format codiert nur das technische Format. Die
  lokalen Format-Codes sind vorläufige Platzhalter.
- Ein spezifisches Konzept 'Provision of written information about lung cancer screening' fehlt in SNOMED
  CT.
- Rechtlich offen ist, ob die alleinige Aushändigung der Fassung in Leichter Sprache (25.06.2026, nicht
  Anlage I) § 40 KFE-RL erfüllt.
- Kein Profil koppelt die Aushändigung an den Pflichthinweis auf das Strahlenrisiko (LuKrFrühErkV § 2
  Abs. 1 S. 2).
- Zu entscheiden ist der Datentyp (Reference auf DocumentReference vs. Procedure) sowie der passende KBV-Dokumenttyp-Code
  und der IHE-D-Formatcode für ein PDF-Informationsblatt.
- Kardinalität laut Quelle 1..1 je Erstberatung (0..* bei neuen Fassungen).
