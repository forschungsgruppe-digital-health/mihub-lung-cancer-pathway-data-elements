standard_mappings:
- standard: fhir-mii-kds
  profile_or_url: https://www.medizininformatik-initiative.de/fhir/modul-consent/StructureDefinition/mii-pr-consent-einwilligung
  resource: Consent
  path: Consent.provision.provision.code
  notes: 'de.medizininformatikinitiative.kerndatensatz.consent#2026.0.0 (Profilversion 1.0.9), stabil.
    Muster nur für den Forschungszweck (MII Broad Consent): category mit LOINC 57016-8 und Versionsmodul-Slice,
    policy 1..*, scope fix research, je Teilzweck ein provision.provision mit type permit/deny, period
    und code (required an mii-vs-consent-policy). Zentrale Speicherung sowie Melde- und Krebsregisterabgleich
    des Screeningprogramms sind mit den Policy-Codes nicht kodierbar; projektspezifische Codes anderer
    Einwilligungsmodule (z. B. …5.3.59 ACRIBIS, …5.3.82 SNID) nicht übernehmen. Nur nutzbar, wenn der
    Standort den MII Broad Consent führt.'
- standard: fhir-mii-kds
  profile_or_url: https://www.medizininformatik-initiative.de/fhir/modul-consent/StructureDefinition/mii-pr-consent-einwilligung
  resource: Consent
  path: Consent.provision.provision.purpose
  notes: de.medizininformatikinitiative.kerndatensatz.consent#2027.0.0-ballot.rc1 (Profilversion 1.1.0),
    Ballot. Je Teilzweck ein provision.provision mit permit/deny; purpose 0..* extensible an v3-PurposeOfUse,
    provision.provision.code 1..* MS required (MII Consent Policy CS 1.1.0, 29 Konzepte), policy 1..*
    MS, status 1..1 MS. category-Slices consentCategory (LOINC 57016-8), mii, resultType und templateType.
    Ein PurposeOfUse-Code eigens für Screening oder Registerabgleich ist nicht belegt.
- standard: fhir-mii-kds
  profile_or_url: https://www.medizininformatik-initiative.de/fhir/modul-consent/StructureDefinition/mii-pr-consent-documentreference
  resource: DocumentReference
  path: DocumentReference.content.attachment
  notes: de.medizininformatikinitiative.kerndatensatz.consent#2027.0.0-ballot.rc1 (Profilversion 1.0.8),
    Ballot. Optionale Ablage des unterschriebenen Formulars (Scan/PDF) neben der strukturierten Consent-Instanz;
    content.attachment und contentType 1..1 MS. Für die Prozesslogik nicht erforderlich.
- standard: fhir-r4-base
  profile_or_url: http://hl7.org/fhir/StructureDefinition/Consent
  resource: Consent
  path: Consent.provision.purpose
  notes: hl7.fhir.r4.core#4.0.1, stabil. Basis für ein eigenes Profil „Screening-Datennutzung“ mit einer
    Consent je Zweck (zentrale Speicherung; Abgleich mit Einwohnermelde- und Krebsregistern; Forschung).
    provision.purpose 0..* extensible an v3-PurposeOfUse, provision.type 0..1 required (permit/deny),
    Widerruf über status inactive oder Folgeinstanz, Zeitpunkt über dateTime bzw. provision.period. Zweckcodes
    lokal festlegen. In ISiK 6.0.0, ePA 1.4.0-ballot.1, Basisprofil DE 1.6.0 und IPS 2.0.1 gibt es kein
    Consent-Profil; die KBV-Consent-Profile (Patientenverfügung, Vorsorgevollmacht, persönliche Erklärungen)
    sind ungeeignet.
- standard: other
  profile_or_url: https://profiles.ihe.net/ITI/PCF/StructureDefinition/IHE.PCF.consentAdvanced
  resource: Consent
  path: Consent.provision
  notes: ihe.iti.pcf#1.1.0 (IHE ITI Privacy Consent on FHIR, Profile consentBasic, consentIntermediate
    und consentAdvanced je 1.1.0), Trial Implementation. Internationales Muster für zweckbezogene Provisions;
    consentAdvanced als Grundlage des eigenen Profils „Screening-Datennutzung“ zu prüfen.
