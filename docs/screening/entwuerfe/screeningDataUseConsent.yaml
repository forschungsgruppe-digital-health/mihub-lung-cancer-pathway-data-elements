issues:
- 'Verbindlichkeit nach Gegenprüfung: Leitlinie. S3 Empf. 5.13 (EK, „sollte“); derzeit ohne Empfänger:
  Das Monitoring nach KFE-RL § 46 Abs. 2 schafft der G-BA erst bis Ende 2028.'
- 'Umsetzung: eigenständig, optional und vorausschauend. Als optionales, vorausschauendes Element ohne
  aktuellen Empfänger kennzeichnen. Zwecke auf S3 Empf. 5.13 beschränken (zentrale Speicherung; Abgleich
  mit Einwohnermeldeämtern und Krebsregistern; Forschung „zur Optimierung des Lungenkrebs-Screeningprogramms“);
  „künftiges G-BA-Monitoring“ erst nach einer G-BA-Regelung aufnehmen (ggf. als Widerspruch statt Einwilligung).
  FHIR Consent je Zweck (provision.purpose plus status). Forschungszweck am MII-Modul Consent (Broad Consent)
  ausrichten; 736814000 nur als Beispiel-Coding für den Forschungszweck. DPIA- und Justiziariats-Touchpoint.'
- Für die Zwecke „zentrale Speicherung der Screeningdaten“ und „Abgleich mit Einwohnermeldeämtern und
  Krebsregistern“ gibt es keinen Standardcode; lokale Zweck-Codes (local-no-standard-binding) oder eine
  künftige Erweiterung der MII Consent Policy sind festzulegen.
- Ein „künftiges G-BA-Monitoring“ wird erst nach einer G-BA-Regelung aufgenommen (KFE-RL § 46 Abs. 2,
  bis Ende 2028), ggf. als Widerspruch statt Einwilligung.
- Zu klären ist, ob der Standort den MII Broad Consent führt und der Screening-Forschungszweck davon abgedeckt
  ist; andernfalls ist statt MII-Policy …24.5.3.8 ein lokaler Forschungszweck-Code nötig.
- Ein eigenes Consent-Profil „Screening-Datennutzung“ fehlt; IHE PCF consentAdvanced ist als Grundlage
  zu prüfen.
- Der Datentyp ist auf Reference(Consent) je Zweck umzustellen; CodeableConcept bildet erteilt/verweigert/widerrufen
  je Zweck nicht ab.
- Die KDL-Ablageklasse für das Formular ist zu wählen (AM050101 Datenschutzerklärung oder AM050199 Sonstige
  Einwilligung/Erklärung).
- Für consentscope, consent-provision-type, consent-state-codes, v3-ActReason und die MII Consent Policy
  fehlen Repo-Systemschlüssel; der Schlüssel hl7-v3 verweist auf v3-ActCode und ist hier nicht verwendbar.
- Bei Umstieg auf das Consent-Release 2027 sind CodeSystem-Version (1.1.0) und Anzeige des MII-Policy-Codes
  nachzuziehen.
- 'DPIA- und Justiziariats-Touchpoint: Rechtsgrundlage und Zweckbindung der zentralen Speicherung und
  des Registerabgleichs sind rechtlich zu bewerten.'
