id: mihub.lung.screening.screeningDataUseConsent.v0.1
uuid: f3041b8f-f670-5c82-8d57-488112f2b109
name: screeningDataUseConsent
label_de: Einwilligung in zentrale Speicherung, Registerabgleich und Forschung
definition_de: 'Zweckbezogene Einwilligungen: zentrale Speicherung, Melde-/Krebsregisterabgleich, Forschung
  und künftiges G-BA-Monitoring (erteilt, verweigert, widerrufen).'
phase: screening
category: administrativ
datatype: string
cardinality: 0..*
value_set:
  binding_strength: example
  standard_binding_status: mapped
  notes: 'Umsetzung als eine FHIR-Consent-Instanz je Zweck nach S3 Empf. 5.13 (zentrale Speicherung; Abgleich
    mit Einwohnermeldeämtern und Krebsregistern; Forschung zur Optimierung des Screeningprogramms). Dokumentklassen:
    LOINC 57016-8 nur für die Forschungseinwilligung nach MII-Consent-Profil (Slice consentCategory),
    LOINC 59284-0 für Speicherung und Registerabgleich; für das unterschriebene Formular KDL AM050101
    (Datenschutzerklärung) oder die Auffangklasse AM050199, SF190102 nur bei Ablage als formale Studieneinwilligung.
    Element-Codes (Consent.scope): consentscope research für den Forschungszweck, patient-privacy für
    Speicherung und Registerabgleich. Antwortwerte: Zweck über provision.purpose mit v3-ActReason HRESCH
    (Forschung), PUBHLTH (Krebsregisterabgleich, Näherung) bzw. HQUALIMP (Meldeamtsabgleich/Programmevaluation,
    Näherung); im MII Broad Consent zusätzlich provision.provision.code mit MII-Policy …24.5.3.8, nur
    wenn der Forschungszweck tatsächlich mit dem MII-Broad-Consent-Text eingeholt wurde (TermServ führt
    das CodeSystem in Version 1.0.7; im Paket kerndatensatz.consent 2027.0.0-ballot.rc1 Version 1.1.0
    mit Anzeige „MDAT wissenschaftlich nutzen“). Erteilt bzw. verweigert über provision.type permit/deny
    bei status active; Widerruf über status inactive bzw. Folgeinstanz; rejected nur für einen nicht zustande
    gekommenen Consent-Entwurf. SNOMED 736814000 bedeutet Studienteilnahme und ist nur eine gekennzeichnete
    Näherung außerhalb der Consent-Ressource (z. B. Observation). Binding example, weil zwei der drei
    Zwecke keinen Standardcode haben. Editionen: MII TermServ, SNOMED CT 20260701, LOINC 2.83, KDL 2025,
    consentscope 2.0.0, v3-ActReason 3.0.0, FHIR R4 4.0.1; Stand 2026-10-15. Rollen der Codes: loinc|57016-8
    = dokumentklasse; loinc|59284-0 = dokumentklasse; kdl|AM050101 = dokumentklasse; kdl|AM050199 = dokumentklasse;
    kdl|SF190102 = dokumentklasse; http://terminology.hl7.org/CodeSystem/consentscope|research = element;
    http://terminology.hl7.org/CodeSystem/consentscope|patient-privacy = element; urn:oid:2.16.840.1.113883.3.1937.777.24.5.3|2.16.840.1.113883.3.1937.777.24.5.3.8
    = wert; http://terminology.hl7.org/CodeSystem/v3-ActReason|HRESCH = wert; http://terminology.hl7.org/CodeSystem/v3-ActReason|PUBHLTH
    = wert; http://terminology.hl7.org/CodeSystem/v3-ActReason|HQUALIMP = wert; http://hl7.org/fhir/consent-provision-type|permit
    = wert; http://hl7.org/fhir/consent-provision-type|deny = wert; http://hl7.org/fhir/consent-state-codes|active
    = wert; http://hl7.org/fhir/consent-state-codes|rejected = wert; http://hl7.org/fhir/consent-state-codes|inactive
    = wert; snomed-ct|736814000 = wert.'
