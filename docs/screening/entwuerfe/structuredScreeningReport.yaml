issues:
- 'Verbindlichkeit nach Gegenprüfung: Soll-Vorschrift. KFE-RL § 42 Abs. 2 S. 1 („soll … innerhalb von
  14 Tagen … als strukturierter Befundbericht übermittelt werden“), S. 2 (an die Praxis nur bei Einwilligung);
  Inhalte: TrG S. 21 („sollte“ V-Lung-RADS), S3 Empf. 5.9.'
- 'Umsetzung: Spezialisierung von diagnosticReportDocument (primarycare). specializes diagnosticReportDocument;
  hasPart lungRadsCategory, screeningResultCategory, recommendedManagement, recommendedControlInterval,
  incidentalFinding. Empfänger und Übermittlung aus der Definition nehmen (gehören zu resultCommunicationToPatient
  und resultTransmissionConsentReferrer). Für das MII-Mapping LOINC 79086-5 statt 18748-4 als DiagnosticReport.code
  (Required-Binding des MII-Profils radiologischer-befund verlangt CLASS RAD und SCALE Doc). mandatory_by_law
  aufteilen: Übermittlung als strukturierter Befundbericht = Soll-Vorschrift; Inhaltsbestandteile = Empfehlungen.
  Die „verständliche Erläuterung“ auf die Bedeutung von „kontrollbedürftig“ (TrG) eingrenzen oder als
  lokal kennzeichnen. Zitat bis „… als strukturierter Befundbericht übermittelt werden“ vervollständigen.'
- Kein Standard bietet ein Berichts-Template für die Lungenkrebsfrüherkennung (LuKrFrühErkV/Lung-RADS);
  der Bericht wird aus generischen Bildbefund-Rahmen und referenzierten Beobachtungen zusammengesetzt.
- Die 'verständliche Erläuterung' für die versicherte Person hat in keinem Standard einen eigenen Ort;
  sie ist auf die Bedeutung von 'kontrollbedürftig' (Tragende Gründe) einzugrenzen oder als lokale Erweiterung
  zu kennzeichnen.
- Empfänger- und Übermittlungsangaben gehören zu resultCommunicationToPatient bzw. resultTransmissionConsentReferrer
  und sind aus der Definition zu nehmen; mandatory_by_law ist aufzuteilen (Übermittlung als strukturierter
  Befundbericht = Soll-Vorschrift, Inhaltsbestandteile = Empfehlungen), und das Zitat aus KFE-RL § 42
  Abs. 2 ist zu vervollständigen.
- Die MII-ValueSets für radiologische Berichtscodes sind auf dem MII TermServ nicht abrufbar; das ValueSet
  mii-vs-bildgebung-diagnostic-report-coding 2025.0.2 enthält eine ungültige ECL-Expression und sollte
  an die MII gemeldet werden, ebenso die Defekte im Ballot 2027.0.0-ballot.1.
- Ob LOINC 79086-5 im EU-Imaging-ValueSet ImagingReportTypes liegt, ist ungeklärt.
- Kardinalität laut Quelle 1..1 je Runde (1..* je Episode).
