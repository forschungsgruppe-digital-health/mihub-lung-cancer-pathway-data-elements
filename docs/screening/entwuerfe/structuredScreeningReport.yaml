id: mihub.lung.screening.structuredScreeningReport.v0.1
uuid: c385e309-61fb-526a-9c01-fd881011b5b1
name: structuredScreeningReport
label_de: Strukturierter Befundbericht der Lungenkrebsfrüherkennung
definition_de: Strukturierter Befundbericht mit Befunden, V-Lung-RADS, Rechtskategorie, Empfehlung und
  verständlicher Erläuterung; an die Person, mit Einwilligung an die Praxis.
phase: screening
category: dokument
datatype: Reference
cardinality: 1..*
value_set:
  binding_strength: extensible
  standard_binding_status: mapped
  notes: 'Editionen: LOINC 2.83, SNOMED CT INT 20260701 und KDL 2025, alle Codes auf dem MII TermServ
    aktiv (Stand 2026-10-15). Element-Code (DiagnosticReport.code) ist LOINC 79086-5 (CLASS RAD, SCALE
    Doc), passend zum MII-ValueSet für radiologische Berichtscodes. Dokumentklassen: SNOMED 4261000179100
    (Subtyp von 371525003, für DiagnosticReport.code.coding:sct bzw. Composition/DocumentReference.type)
    und KDL DG020103 (DocumentReference.type, XDS-eventCodeList). Methode bzw. zugrunde liegende Untersuchung:
    16334891000119106 (ImagingStudy.procedureCode). Für die Dokumentablage gelten wie bei diagnosticReportDocument
    IHE-D classCode BEF und typeCode BILD (in den Mappings). Abgelehnt: LOINC 18748-4 (generisch, CLASS
    DOC.MISC; nur als Composition.type- bzw. category-Pattern der MII) und 18747-6 (deprecated). Das Element
    spezialisiert diagnosticReportDocument; Bestandteile (lungRadsCategory, screeningResultCategory, recommendedManagement,
    recommendedControlInterval, incidentalFinding) sind über hasPart verknüpft. Rollen der Codes: loinc|79086-5
    = element; snomed-ct|4261000179100 = dokumentklasse; kdl|DG020103 = dokumentklasse; snomed-ct|16334891000119106
    = methode.'
  codings:
  - system: loinc
    code: 79086-5
    display: CT Chest for screening WO contrast
  - system: snomed-ct
    code: '4261000179100'
    display: Computed tomography imaging report
  - system: kdl
    code: DG020103
    display: CT-Befund
  - system: snomed-ct
    code: '16334891000119106'
    display: Low dose computed tomography of chest without contrast
standard_mappings:
- standard: gematik-epa-fhir
  profile_or_url: https://gematik.de/fhir/epa-mhd/StructureDefinition/epa-mhd-document-reference
  resource: DocumentReference
  path: DocumentReference.category.coding (REQUIRED epa-xds-class-code-vs); DocumentReference.type.coding
    (REQUIRED epa-xds-type-code-vs); DocumentReference.context.event.coding (REQUIRED epa-xds-event-code-vs)
  notes: 'de.gematik.epa.mhd#1.1.3, stabil; für die Bereitstellung des Berichts in der ePA. Die ValueSets
    nutzen OID-Systeme (de.gematik.terminology#1.0.9): category.coding = urn:oid:1.3.6.1.4.1.19376.3.276.1.5.8#BEF,
    type.coding = urn:oid:1.3.6.1.4.1.19376.3.276.1.5.9#BILD (jeweils Version 4.0.0), nicht http://ihe-d.de/CodeSystems/…;
    context.event.coding = KDL DG020103. Die Bindung liegt auf coding.'
- standard: fhir-mii-kds
  profile_or_url: https://www.medizininformatik-initiative.de/fhir/ext/modul-bildgebung/StructureDefinition/mii-pr-bildgebung-radiologischer-befund
  resource: DiagnosticReport
  path: DiagnosticReport.code.coding:loinc (REQUIRED mii-vs-bildgebung-diagnostic-report-code-lnc); DiagnosticReport.code.coding:sct
    (REQUIRED < 371525003); DiagnosticReport.category.coding:sct (Pattern 4201000179104); DiagnosticReport.category.coding:loinc
    (Pattern 18748-4); DiagnosticReport.result; DiagnosticReport.imagingStudy (1..*); DiagnosticReport.conclusion;
    DiagnosticReport.conclusionCode; DiagnosticReport.presentedForm
  notes: 'de.medizininformatikinitiative.kerndatensatz.bildgebung#2026.0.0, stabil. code.coding:loinc
    = 79086-5 (erfüllt CLASS RAD und SCALE_TYP LP32888-7 Doc); code.coding:sct = 4261000179100 ($subsumes
    unter 371525003 auf dem MII TermServ bestätigt); 18748-4 nur im category-Pattern. result → hasPart-Beobachtungen;
    Empfehlung über CarePlan.supportingInfo (behandlungsempfehlung); imagingStudy 1..* ist Pflicht. Ballot-Hinweis
    2027.0.0-ballot.1: LOINC-ValueSet filtert auf CLASS = ''RAD'' (Name statt LP-Code); code.coding:sct
    und conclusionCode.coding:sct tragen den Pattern-Defekt (System mit Versionsanhang); conclusionCode.coding:icd10-gm
    ist an die CodeSystem-URL statt an ein ValueSet gebunden.'
- standard: fhir-mii-kds
  profile_or_url: https://www.medizininformatik-initiative.de/fhir/ext/modul-bildgebung/StructureDefinition/mii-pr-bildgebung-semistrukt-befundbericht
  resource: Composition
  path: Composition.type.coding:loinc (Pattern 18748-4); Composition.section:diagRep (1..1, code Pattern
    LOINC 18782-3, entry 1..* → radiologischer-befund); Composition.author (1..* Practitioner); Composition.title
    (1..1)
  notes: 'de.medizininformatikinitiative.kerndatensatz.bildgebung#2026.0.0, stabil; Dokumentrahmen des
    strukturierten Berichts (hier ist 18748-4 als Composition.type passend). section.entry ist für jede
