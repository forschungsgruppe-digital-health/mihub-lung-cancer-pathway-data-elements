issues:
- 'Verbindlichkeit nach Gegenprüfung: Pflicht. Anlage zu § 4 Abs. 1 S. 1 (Zeile CAD-Software: „Speicherung
  der Auswertung als erweiterte Bilddokumentation“) i. V. m. § 4 Abs. 1 S. 2 und § 5 Abs. 1–2 LuKrFrühErkV;
  QS-Vereinbarung § 11 Abs. 5. Ein Speicherformat schreibt die Verordnung nicht vor.'
- 'Umsetzung: eigenständig. Kardinalität an die Rechtslage anpassen: je LDCT mindestens eine CAD-Auswertung
  des Erstbefunders, bei Zweitbefundung eine weitere (1..* oder Invariante je ldctExamination statt 0..*).
  Binding extensible/example: DCM 112000 nur, wenn ein Chest CAD SR erzeugt wird; DCM 126000 (TID 1500)
  als Alternative. „dicom-dcm“ in scripts/verify-terminology.py (SYSTEM_URL) ergänzen oder den Code unter
  standard_mappings (dicom-sr) führen. pulmonaryNoduleFinding, noduleSizeMeasurement und noduleVolumeDoublingTime
  hängen von cadAnalysisReport ab (dependsOn). Software und Lesemodus nicht doppelt zu screeningReadingEvent
  erfassen.'
- 'Die Kardinalität ist an die Rechtslage anzupassen: je LDCT mindestens eine CAD-Auswertung des Erstbefunders,
  bei Zweitbefundung eine weitere (1..* oder Invariante je ldctExamination statt 0..*); kein Standard
  bildet das ab.'
- Welcher SR-Typ (Chest CAD SR mit 112000 oder TID 1500 mit 126000) von der eingesetzten CAD-Software
  erzeugt wird, ist je Standort festzustellen.
- Es gibt kein FHIR-Profil für eine CAD-Auswertung als Ganzes (Software, Detektionsliste, Volumetrie);
  die MII-Messung ist erst im Ballot 2027 enthalten.
- pulmonaryNoduleFinding, noduleSizeMeasurement und noduleVolumeDoublingTime sind per dependsOn mit cadAnalysisReport
  zu verknüpfen; Software und Lesemodus nicht doppelt zu screeningReadingEvent erfassen.
- Der Systemschlüssel dicom-dcm (und radlex) ist in der Terminologieprüfung des Repos zu hinterlegen.
- Kardinalität laut Quelle 1..* je LDCT (bzw. Invariante je ldctExamination).
