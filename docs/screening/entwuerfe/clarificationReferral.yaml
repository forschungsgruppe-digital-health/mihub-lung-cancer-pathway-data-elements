id: mihub.lung.screening.clarificationReferral.v0.1
uuid: a330cd50-b3f2-50e7-bf8b-5e0bcbeb147b
name: clarificationReferral
label_de: 'Einleitung der Abklärung: Überweisung an spezialisierte Einrichtung'
definition_de: 'Unverzüglich eingeleitete Abklärung: Überweisung zur spezialisierten Einrichtung (Sprechstunde,
  Fallkonferenz), auch wegen Nebenbefunden.'
phase: screening
category: mitbetreuung
datatype: Reference
cardinality: 0..*
value_set:
  binding_strength: extensible
  standard_binding_status: mapped
  notes: 'Editionen: SNOMED CT INT 20260701, LOINC 2.83 und KDL 2025, alle Codes auf dem MII TermServ
    aktiv (Stand 2026-10-15). Element-Codes (ServiceRequest.code): 3457005 wie in referralOrder, spezifischer
    103696004 für die Überweisung an eine spezialisierte Einrichtung, optional 306273003 bei pneumologischem
    Ziel. 712875004 nur als ServiceRequest.reasonCode neben dem führenden reasonReference → screeningResultCategory.
    Dokumentklassen des Begleitschreibens (nur DocumentReference.type, nicht ServiceRequest.code): LOINC
    57133-1 und KDL AU050102. Das Ziel ''spezialisierte Einrichtung'' (KFE-RL § 43 Abs. 4) wird über performer
    ausgedrückt, ''unverzüglich'' über authoredOn statt über einen Dringlichkeitscode. Abgelehnt: 134403003
    (Urgent referral; Frist ist keine klinische Dringlichkeit), 183529009 (Referral to oncologist; vor
    der Abklärung keine Krebsdiagnose). Rollen der Codes: snomed-ct|3457005 = element; snomed-ct|103696004
    = element; snomed-ct|306273003 = element; snomed-ct|712875004 = wert; loinc|57133-1 = dokumentklasse;
    kdl|AU050102 = dokumentklasse.'
  codings:
  - system: snomed-ct
    code: '3457005'
    display: Patient referral
  - system: snomed-ct
    code: '103696004'
    display: Patient referral to specialist
  - system: snomed-ct
    code: '306273003'
    display: Referral to chest physician
  - system: snomed-ct
    code: '712875004'
    display: Abnormal finding on screening procedure
  - system: loinc
    code: 57133-1
    display: Referral Note
  - system: kdl
    code: AU050102
    display: Überweisungsschein
standard_mappings:
- standard: fhir-mii-kds
  profile_or_url: https://www.medizininformatik-initiative.de/fhir/ext/modul-bildgebung/StructureDefinition/mii-pr-bildgebung-anforderung-bildgebung
  resource: ServiceRequest
  path: ServiceRequest.code.coding:loinc (REQUIRED RSNA-Playbook); ServiceRequest.category.coding:sct
    (Pattern 363679005 Imaging); ServiceRequest.reasonReference; ServiceRequest.performer
  notes: 'de.medizininformatikinitiative.kerndatensatz.bildgebung#2026.0.0, stabil. Äquivalenz narrower:
    nur wenn die Abklärung selbst Bildgebung ist (z. B. PET/CT); für die Überweisung zur interdisziplinären
    Sprechstunde ungeeignet.'
- standard: other
  profile_or_url: https://fhir.kbv.de/StructureDefinition/KBV_PR_AW_Behandlung_im_Auftrag_Ueberweisung
  resource: ServiceRequest
  path: ServiceRequest.status (fixed completed); ServiceRequest.intent (fixed proposal); ServiceRequest.orderDetail
    (1..1, REQUIRED KBV_VS_AW_Leistungsart); ServiceRequest.code.text; ServiceRequest.reasonCode.text
    (1..1); ServiceRequest.supportingInfo:befund_Medikation; ServiceRequest.performer (0..1); ServiceRequest.authoredOn
    (1..1)
  notes: kbv.ita.aws#1.2.0, stabil (KBV-Archiv- und Wechselschnittstelle nach § 371 SGB V, nur Differential).
    Äquivalenz related (Archiv- bzw. Empfängersicht, keine Auftragsübermittlung). code nur als Text (code.coding
    0..0). reasonReference erlaubt nur KBV_PR_AW_Diagnose; der Befundbezug läuft daher über supportingInfo:befund_Medikation
    (→ KBV_PR_AW_Observation_Befund) bzw. reasonCode.text.
- standard: fhir-r4-base
  profile_or_url: http://hl7.org/fhir/StructureDefinition/ServiceRequest
  resource: ServiceRequest
  path: ServiceRequest.code; ServiceRequest.reasonReference; ServiceRequest.reasonCode; ServiceRequest.performer;
    ServiceRequest.authoredOn; ServiceRequest.intent
  notes: hl7.fhir.r4.core#4.0.1, stabil; konsistent mit referralOrder (specializes). code = 3457005 bzw.
    103696004; reasonReference → screeningResultCategory (abklärungsbedürftig); performer → HealthcareService
    bzw. Organization der spezialisierten Einrichtung; mehrere vorgeschlagene Einrichtungen (Tragende
    Gründe) als mehrere performer (Alternativen); authoredOn als Nachweis für 'unverzüglich'. 57133-1
    nur als DocumentReference.type des Begleitdokuments.
- standard: other
  profile_or_url: http://hl7.org/fhir/us/core/StructureDefinition/us-core-servicerequest
  resource: ServiceRequest
  path: ServiceRequest.code (1..1, extensible us-core-procedure-code); ServiceRequest.category:us-core;
    ServiceRequest.reasonCode/reasonReference
  notes: hl7.fhir.us.core#9.0.0, stabil. Nur internationales Referenzmuster mit niedriger Priorität, kein
    deutscher Einsatz.
- standard: openehr-archetype
  profile_or_url: openEHR-EHR-INSTRUCTION.service_request.v1
  resource: INSTRUCTION
  path: /activities[at0001]/description[at0009]/items[at0121] (Service name), items[at0062] (Reason for
    request), items[at0040] (Service due)
  notes: openEHR CKM (CKM-mirror master, Stand 2026-10-15), Lifecycle laut Mirror in_development, nicht-FHIR.
