issues:
- 'Verbindlichkeit nach Gegenprüfung: bedingt. KFE-RL § 42 Abs. 3 Nr. 2 („die notwendigen Maßnahmen unverzüglich
  einzuleiten“). Das Ziel „spezialisierte Einrichtung“ ist Empfehlung (TrG S. 21; S3 Empf. 5.9 und 5.11);
  die Wahl der Einrichtung ist frei.'
- 'Umsetzung: Spezialisierung von referralOrder (primarycare). specializes mihub.lung.primarycare.referralOrder.v0.1.
  Auf abklärungsbedürftige Befunde nach § 1 Abs. 5 beschränken; „auch wegen Nebenbefunden“ streichen (dafür
  normale referralOrder mit reasonReference → incidentalFinding). „Fallkonferenz“ aus der Definition streichen
  (gehört zu screeningCaseConference). ServiceRequest: reasonReference → screeningResultCategory, performer
  = spezialisierte Einrichtung (KFE-RL § 43 Abs. 4), authoredOn als Nachweis für „unverzüglich“. Die TrG
  verlangen, verschiedene Einrichtungen vorzuschlagen. Optional LOINC 57133-1 wie in referralOrder.'
- Für die elektronische Überweisung zur Auftragsübermittlung gibt es kein deutsches FHIR-Profil (MII,
  ISiK, ePA ohne Überweisungsprofil; KBV nur Archivsicht); ob ein gematik- oder KBV-eÜberweisungspaket
  in Arbeit ist, ist offen.
- Für die 'spezialisierte Einrichtung' nach KFE-RL § 43 Abs. 4 fehlt ein Organisationstyp-Code.
- Es fehlt ein Konzept 'Überweisung zur Abklärung eines abklärungsbedürftigen Früherkennungsbefunds';
  die Abbildung erfolgt als Kombination aus 103696004, reasonReference und performer.
- SNOMED 712941000000102 'Referral for multidisciplinary review' meint eher eine MDT-Fallbesprechung und
  ist bei screeningCaseConference zu prüfen.
- 'Die Definition ist zu bereinigen: ''auch wegen Nebenbefunden'' (→ referralOrder mit reasonReference
  → incidentalFinding) und ''Fallkonferenz'' (→ screeningCaseConference) streichen.'
