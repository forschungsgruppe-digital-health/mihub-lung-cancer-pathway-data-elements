id: mihub.lung.screening.abnormalResultDiscussion.v0.1
uuid: b185840b-d28b-5f06-85d3-62d0b4d1d1fa
name: abnormalResultDiscussion
label_de: Besprechung eines abklärungsbedürftigen Befunds
definition_de: Besprechung des abklärungsbedürftigen Befunds und der Abklärung mit der Person (persönlich,
  Telefon, Video), möglichst vor dem schriftlichen Bericht.
phase: screening
category: kontakt-visite
datatype: dateTime
cardinality: 0..1
value_set:
  binding_strength: required
  standard_binding_status: mapped
  notes: 'Editionen: SNOMED CT INT 20260701 und HL7 v3-ParticipationMode 4.0.0, alle Codes auf dem MII
    TermServ aktiv (Stand 2026-10-15). Element-Code ist die Prozedur 1304231001 ''Discussion about result
    of investigation''; der Datentyp dateTime ist der Zeitpunkt der Besprechung. Antwortwerte für das
    Attribut Kontaktform übernehmen die geschlossene Liste von consultationModality (required wie dort):
    persönlich = 1269515004, Telefon = 386472008, Video = 719410009. Die v3-ParticipationMode-Codes FACE,
    PHONE und VIDEOCONF sind die 1:1-Entsprechungen für Communication.medium im FHIR-Mapping und keine
    zusätzlichen Antwortwerte. Bedingung: screeningResultCategory = abklärungsbedürftig. Abgelehnt: EBM
    01880 (nur Abrechnungsbezug, Frist 14 Tage nach 01871/01872) und 310867007 (Mitteilung einer Diagnose,
    unpassend). Rollen der Codes: snomed-ct|1304231001 = element; snomed-ct|1269515004 = wert; snomed-ct|386472008
    = wert; snomed-ct|719410009 = wert; http://terminology.hl7.org/CodeSystem/v3-ParticipationMode|FACE
    = wert; http://terminology.hl7.org/CodeSystem/v3-ParticipationMode|PHONE = wert; http://terminology.hl7.org/CodeSystem/v3-ParticipationMode|VIDEOCONF
    = wert.'
  codings:
  - system: snomed-ct
    code: '1304231001'
    display: Discussion about result of investigation
  - system: snomed-ct
    code: '1269515004'
    display: Face to face consultation with patient
  - system: snomed-ct
    code: '386472008'
    display: Telephone consultation
  - system: snomed-ct
    code: '719410009'
    display: Consultation via video conference
  - system: http://terminology.hl7.org/CodeSystem/v3-ParticipationMode
    code: FACE
    display: face-to-face
  - system: http://terminology.hl7.org/CodeSystem/v3-ParticipationMode
    code: PHONE
    display: telephone
  - system: http://terminology.hl7.org/CodeSystem/v3-ParticipationMode
    code: VIDEOCONF
    display: videoconferencing
standard_mappings:
- standard: fhir-mii-kds
  profile_or_url: https://www.medizininformatik-initiative.de/fhir/core/modul-fall/StructureDefinition/KontaktGesundheitseinrichtung
  resource: Encounter
  path: Encounter.period.start; Encounter.class (1..1, REQUIRED http://fhir.de/ValueSet/EncounterClassDE);
    Encounter.reasonReference; Encounter.type:KontaktArt
  notes: 'de.medizininformatikinitiative.kerndatensatz.base#2026.0.1, stabil (Profil auch in MII Fall
    2025.0.1). Nachrangige Alternative, wenn die Besprechung als eigener Arzt-Patienten-Kontakt dokumentiert
    wird. Kontaktform nur grob: persönlich → AMB, Telefon oder Video → VR (EncounterClassDE aus basisprofil-de
    1.6.0 kennt nur AMB, IMP, PRENC, VR, SS, HH); kontaktart-de hat keinen passenden Code. Feine Unterscheidung
    über Communication.medium.'
- standard: fhir-r4-base
  profile_or_url: http://hl7.org/fhir/StructureDefinition/Communication
  resource: Communication
  path: Communication.sent; Communication.medium (Example-Binding v3-ParticipationMode); Communication.status;
    Communication.recipient; Communication.reasonReference; Communication.about
  notes: hl7.fhir.r4.core#4.0.1, stabil; führendes Ziel. sent = Zeitpunkt der Besprechung; medium = FACE
    | PHONE | VIDEOCONF; status 1..1 (completed); recipient = Patient; reasonReference → screeningResultCategory;
    about → strukturierter Befundbericht. Bedingung (abklärungsbedürftig) und 'möglichst vor dem schriftlichen
    Bericht' nur als Invariante (Communication.sent < DiagnosticReport.issued).
care_process:
  trigger: abklärungsbedürftiges Ergebnis; zeitnah (EBM 01880 nur binnen 14 Tagen nach 01871/01872)
  responsible_role: Erstbefunder (laut den Entscheidungserheblichen Gründen zum EBA-Beschluss und der
    KBV); im BPMN in der Lane Zweitbefunder
