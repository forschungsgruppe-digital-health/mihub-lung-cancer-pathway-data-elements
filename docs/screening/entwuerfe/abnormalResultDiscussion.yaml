issues:
- 'Verbindlichkeit nach Gegenprüfung: bedingt. KFE-RL § 42 Abs. 3 Nr. 2: Befund und weitere Maßnahmen
  sind mit der Person zu besprechen und die notwendigen Maßnahmen unverzüglich einzuleiten. Die 14 Tage
  sind nur die Abrechnungsfrist der GOP 01880.'
- 'Umsetzung: eigenständig. responsible_role = Erstbefunder; die BPMN-Lane (Zweitbefunder) korrigieren
  lassen. Kontaktform als Attribut mit der Werteliste von consultationModality (persönlich | Telefon |
  Video), keine neuen Codes. Bedingung: screeningResultCategory = abklärungsbedürftig. EBM 01880 als Abrechnungsbezug.
  Den Zusatz „möglichst vor dem schriftlichen Bericht“ mit den TrG (S. 21) belegen; KFE-RL, EBA und KBV
  sagen nur „unverzüglich“ bzw. „zeitnah“.'
- Kein deutsches Profil (MII, ISiK, KBV, ePA) bildet eine Befundbesprechung mit der versicherten Person
  ab; es ist zu entscheiden, ob Communication (empfohlen) oder Procedure mit 1304231001 die führende Ressource
  ist.
- Die verantwortliche Rolle ist laut EBA-Gründen und KBV der Erstbefunder; die BPMN-Lane (Zweitbefunder)
  muss korrigiert werden.
- Der Zusatz 'möglichst vor dem schriftlichen Bericht' (Tragende Gründe S. 21) ist nur als Invariante
  abbildbar; KFE-RL, EBA und KBV verlangen lediglich 'unverzüglich' bzw. 'zeitnah'.
- EBM 01880 ist kein verfügbares Codesystem und gehört als Abrechnungsbezug in die Constraints.
