id: mihub.lung.screening.pulmonaryNoduleFinding.v0.1
uuid: eaa3dd54-05d2-5dd8-b0b6-78fb6d5d06cd
name: pulmonaryNoduleFinding
label_de: Lungenrundherd (Einzelbefund je Rundherd)
definition_de: 'Befund je Rundherd: Kennung, Typ, Lage, Baseline/neu/vorbestehend, Verlauf, benigne bzw.
  suspekte Merkmale, Bildreferenz.'
phase: screening
category: befund
datatype: Reference
cardinality: 0..*
value_set:
  binding_strength: extensible
  standard_binding_status: mapped
  notes: 'Klammerbefund je Rundherd. Antwortwert des Befunds ist SNOMED CT 786838002 |Nodule of lung|
    (disorder; als Condition.code bzw. Observation.valueCodeableConcept, extensible auf << 786838002).
    427359005 |Solitary nodule of lung| ist nur ein optionaler Unterwert; ob ein Herd solitär ist, ergibt
    sich aus der Rundherdzählung je Untersuchung. 445249002 |Multiple nodules of lung| gehört auf Untersuchungsebene
    (ctThoraxFinding), nicht zum Einzelherd. Antwortwerte für den Rundherdtyp: RadLex RID50151 solide,
    RID50152 teilsolide, RID50153 nicht-solide (Milchglas); SNOMED CT hat dafür keine Konzepte. DICOM
    DCM 112013 |Location in Chest| ist der Element-Code (Attributname) der Lage; die Lagewerte (Lappen,
    Segment) kommen aus SNOMED-CT-Körperstrukturen (< 123037004 |Body structure|). Größe, Volumenverdopplungszeit
    und Malignitätswahrscheinlichkeit sind eigene hasPart-Elemente. Editionen: SNOMED CT INT 20260701,
    RadLex 4.2, DICOM DCM 2025.3 (MII TermServ); Stand 2026-10-15. Rollen der Codes: snomed-ct|786838002
    = wert; snomed-ct|427359005 = wert; radlex|RID50151 = wert; radlex|RID50152 = wert; radlex|RID50153
    = wert; dicom-dcm|112013 = element.'
  codings:
  - system: snomed-ct
    code: '786838002'
    display: Nodule of lung
  - system: snomed-ct
    code: '427359005'
    display: Solitary nodule of lung
  - system: radlex
    code: RID50151
    display: solid pulmonary nodule
  - system: radlex
    code: RID50152
    display: part-solid pulmonary nodule
  - system: radlex
    code: RID50153
    display: non-solid pulmonary nodule
  - system: dicom-dcm
    code: '112013'
    display: Location in Chest
standard_mappings:
