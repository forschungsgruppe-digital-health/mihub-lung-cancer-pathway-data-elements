issues:
- 'Verbindlichkeit nach Gegenprüfung: Leitlinie. V-Lung-RADS (S3 Empf. 5.9, Tab. 17) und Lung-RADS Note
  1 setzen eine Bewertung je Rundherd voraus; die Detektion ist CAD-Pflichtfunktion (Anlage). Eine Einzeldokumentation
  je Rundherd ist nicht normiert.'
- 'Umsetzung: eigenständig (Klammerbefund; hasPart Größe, VDT, Malignitätswahrscheinlichkeit). Klammerbefund
  je Rundherd. 786838002 ist ein disorder-Konzept: als Condition.code oder Observation.valueCodeableConcept
  verwenden, nicht als Observation.code. Den Verlauf nicht als freies Attribut doppeln, sondern über noduleSizeMeasurement
  und noduleVolumeDoublingTime abbilden (hasPart, analog pulmonaryFunctionTest). Lage über SNOMED-Körperstrukturen
  oder DICOM 112013 statt der ICD-O-3-Codes aus tumorLocalisation. Stabile Rundherd-Kennung (Identifier)
  für den Vergleich über Runden (§ 4 Abs. 2). Erfassungsumfang (alle, nicht-benigne oder führender Herd)
  ist zu entscheiden (E13). Quellen ergänzen: Lung-RADS-Kategorientabelle mit Notes 4–8, V-Lung-RADS (S3
  Tab. 17; Supplement Tab. S1 Anm. 1), LuKrFrühErkV-Anlage.'
- Zu entscheiden ist, ob 786838002 |Nodule of lung| als Observation.code (MII-Muster, im MII-Profil konform)
  oder als Antwortwert (Condition.code bzw. Observation.value) geführt wird; im zweiten Fall fehlt ein
  SNOMED-/LOINC-Observable für 'Rundherdbefund' als Observation.code.
- 'Der Erfassungsumfang ist offen: alle Rundherde, nur nicht-benigne Herde oder nur der führende Herd.'
- Kein deutsches Profil fordert eine stabile Rundherd-Kennung; sie muss projektseitig (BodyStructure.identifier
  1..*, Brücke zur DICOM Tracking UID) festgelegt werden.
- Für den Status baseline/neu/vorbestehend gibt es weder einen Standardcode noch ein Profilelement; ein
  lokales CodeSystem ist nötig.
- Ein Morphologie-Code für BodyStructure.morphology ('Lungenrundherd') ist nicht festgelegt.
- Es gibt kein deutsches oder europäisches FHIR-Profil speziell für Lungenrundherde bzw. das Lungenkrebs-Screening.
- Der Slice-Defekt im MII-Bildgebung-Ballot 2027.0.0-ballot.1 (Versionsangabe im patternCoding.system)
  sollte als Ballot-Kommentar gemeldet werden.
