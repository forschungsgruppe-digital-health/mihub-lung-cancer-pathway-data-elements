  profile_or_url: https://www.medizininformatik-initiative.de/fhir/ext/modul-bildgebung/StructureDefinition/mii-pr-bildgebung-radiologische-beobachtung
  resource: Observation
  path: Observation.code.coding:sct; Observation.value[x]; Observation.bodySite (+ extension:bodyStructure);
    Observation.hasMember; Observation.derivedFrom; Observation.extension:SeriesUID / :SOPInstanzUID;
    Observation.identifier
  notes: 'de.medizininformatikinitiative.kerndatensatz.bildgebung#2026.0.0, stabil (Hauptziel). Klammerbefund
    je Rundherd als Observation. Slice code.coding:sct ist REQUIRED an mii-vs-bildgebung-findings-sct
    (< 404684003 |Clinical finding|, SCT 20250701) gebunden; 786838002 ist dort als Observation.code konform
    (MII-Muster: Befund im code, Ausprägung im value) – das steht im Widerspruch zur Element-Vorgabe ''Wert
    statt Code'' und ist zu entscheiden. value[x] 1..1 MS ist Pflicht (z. B. Rundherdtyp als valueCodeableConcept
    mit RadLex-Werten). bodySite 0..1 REQUIRED an < 123037004 |Body structure| (Lappen/Segment); DICOM
    112013 ist ein Konzeptname und hier kein Wert. Rundherd-Identität über bodySite.extension:bodyStructure
    → mii-pr-bildgebung-koerperstruktur (Observation.identifier ist 0..*, nicht MS). hasMember (MS) →
    noduleSizeMeasurement, noduleVolumeDoublingTime, noduleMalignancyProbability. Bildreferenz über derivedFrom
    (ImagingStudy) und extension:SeriesUID/SOPInstanzUID. Status baseline/neu/vorbestehend hat kein eigenes
    Element (component mit lokalem Code). category.coding:loinc pattern 18782-3.'
