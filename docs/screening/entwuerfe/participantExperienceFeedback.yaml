name: participantExperienceFeedback
label_de: Rückmeldung der Teilnehmenden (PREM, Belastung)
definition_de: Optionale Rückmeldung nach der Mitteilung zu Information, Termin, Untersuchung, Wartezeit,
  Angst und Verständnis; ggf. EQ-5D-5L.
phase: screening
category: prom
datatype: string
cardinality: 0..*
value_set:
  binding_strength: example
  standard_binding_status: no-standard-found
  notes: 'MII TermServ, SNOMED CT 20260701, LOINC 2.83; Stand 2026-10-15. Kein Standardkonzept für eine
    PREM zur Lungenkrebs-Früherkennung vorhanden; LOINC und SNOMED CT bieten nur Zufriedenheits-Scores
    bzw. Präferenzen (77218-6, 81893-0, 95541-9, 763382004) oder das Aushändigen eines Zufriedenheitsfragebogens
    (711124002), die nicht passen. Instrument-Code daher lokal (PREM-LCS) als Questionnaire.code; die
    Items werden lokal kodiert nach der Itemliste NHS England Standard protocol v3 vom 03.02.2025 (PR1646),
    Abschnitt 8.7.1 (lung health check, booking, consent process, scanning, information, understanding,
    willingness to continue, smoking cessation advice) als UK-Vorbild. Angst bzw. Belastung und EQ-5D-5L
    werden nicht hier, sondern über distressThermometerScore bzw. ein HRQoL-Element abgebildet. Rollen
    der Codes: local-no-standard-binding|PREM-LCS = instrument.'
  codings:
  - system: local-no-standard-binding
    code: PREM-LCS
    display: Rückmeldung zur Erfahrung mit der Lungenkrebs-Früherkennung (PREM, lokaler Fragebogen nach
      NHS England Standard protocol v3, 8.7.1)
