issues:
- 'Verbindlichkeit nach Gegenprüfung: keine. Internationale Empfehlung (NHS England Standard protocol
  v3, 8.7.1); kein deutscher Normbezug, allenfalls mittelbar KFE-RL § 37 Abs. 1 (Minimierung der Belastungen).'
- 'Umsetzung: eigenständig, optional (projektspezifisch). Auf eine reine PREM mit der Itemliste aus NHS
  8.7.1 begrenzen (lung health check, booking, consent process, scanning, information, understanding,
  willingness to continue, smoking cessation advice). Angst/Belastung und EQ-5D-5L herausnehmen und bei
  Bedarf über bestehende Instrumente abbilden (distressThermometerScore bzw. ein HRQoL-Element); „Belastung“
  aus dem Label nehmen. Lokaler Fragebogen (no-standard-found bzw. pending-mapping). Fassung (v3 vom 03.02.2025,
  PR1646) und URL angeben; als UK-Vorbild kennzeichnen.'
- Es gibt kein standardisiertes PREM-Instrument für die Lungenkrebs-Früherkennung (weder als LOINC-Panel
  noch als publizierter FHIR-Fragebogen); der lokale Fragebogen mit Items nach NHS England 8.7.1 ist zu
  erstellen und sein Code festzulegen.
- Zu entscheiden ist, ob ein LOINC-Neuantrag oder ein Refset für die Screening-PREM angestrebt wird.
- Das Label ist anzupassen ('Belastung' entfernen), da Angst bzw. Belastung und EQ-5D-5L über distressThermometerScore
  bzw. ein HRQoL-Element erfasst werden.
- Der deutsche Normbezug ist nur mittelbar (KFE-RL § 37 Abs. 1, Minimierung der Belastungen); das NHS-Protokoll
  ist als UK-Vorbild mit Fassung und URL zu kennzeichnen.
- Ein openEHR-Archetyp für Patientenerfahrung wurde nicht geprüft.
