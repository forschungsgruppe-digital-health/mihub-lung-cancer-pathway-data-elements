issues:
- 'Verbindlichkeit nach Gegenprüfung: Pflicht. In der GKV verpflichtend über den Überweisungsvorbehalt
  der Radiologie (BMV-Ä § 13 Abs. 4 S. 1, Fassung 01.04.2026); EBM 01875 setzt die Überweisung zur Niedrigdosis-CT
  voraus. LuKrFrühErkV und KFE-RL verlangen nur den Bericht.'
- 'Umsetzung: Spezialisierung von referralOrder (primarycare). specializes mihub.lung.primarycare.referralOrder.v0.1.
  ServiceRequest.code LOINC 79086-5, zusätzlich KDL AU050102. mandatory_by_law = true mit den Quellen
  BMV-Ä § 13 Abs. 4 S. 1–2 und EBM 01875; die Notiz der Konsolidierung („nicht Pflicht“) ersetzen durch
  „LuKrFrühErkV und KFE-RL verlangen den Bericht; die Überweisung folgt aus dem Überweisungsvorbehalt
  der Radiologie im BMV-Ä“. supportingInfo → eligibilityReport; performer = Erstbefunder mit KV-Genehmigung
  (KFE-RL § 43 Abs. 5). Versicherteninformation S. 7 als Ablaufbeleg behalten.'
- LOINC hat keinen eigenen Code für eine Niedrigdosis-CT des Thorax zur Früherkennung (nur die Antwort
  LA31758-8 'Chest Low Dose'); die Niedrigdosis ist nur über SNOMED CT 16334891000119106 abbildbar.
- Die Mitgliedschaft von 79086-5 im ValueSet loinc-rsna-radiology-playbook ist nur über tx.fhir.org (LOINC
  2.82) belegt; das ValueSet liegt nicht auf dem MII TermServ.
- Für die eÜberweisung (Muster 6) wurde kein FHIR-Paket der KBV gefunden; ob die KBV bereits eine Spezifikation
  veröffentlicht hat, ist ungeklärt. ISiK, ePA, IPS, mCODE und Basis DE enthalten kein Überweisungsprofil.
- Der Genehmigungsstatus des Erstbefunders (KV-Genehmigung nach § 135 Abs. 2 SGB V) ist in keinem Profil
  abgebildet und läuft lokal über performer → PractitionerRole.
- Bericht und Selbsterklärung lassen sich nur über supportingInfo gemeinsam übermitteln; dafür gibt es
  keine Slices.
- Kardinalität laut Quelle 1..* (je Runde).
