id: mihub.lung.screening.ldctReferral.v0.1
uuid: 4d875822-9529-5501-9eac-8d7f7e3c3217
name: ldctReferral
label_de: Überweisung zur Niedrigdosis-CT an den Erstbefunder
definition_de: Überweisung an eine Radiologie mit Genehmigung als Erstbefunder zur Screening-LDCT, zusammen
  mit Bericht und Selbsterklärung.
phase: screening
category: administrativ
datatype: Reference
cardinality: 1..*
value_set:
  binding_strength: extensible
  standard_binding_status: mapped
  notes: 'Elementcodes für die angeforderte Leistung (ServiceRequest.code): LOINC 79086-5 CT Chest for
    screening WO contrast (bestellbar, ORDER_OBS Both) und SNOMED CT 16334891000119106 Low dose computed
    tomography of chest without contrast, das die Niedrigdosis abbildet, die im LOINC-Namen fehlt. Überweisungsart
    (ServiceRequest.category): 306143000 Referral to computed tomography service als Spezialisierung des
    geerbten 3457005 Patient referral. Dokumentklasse des Überweisungsscheins: KDL AU050102. 3457005 und
    AU050102 stammen aus mihub.lung.primarycare.referralOrder.v0.1. Die Abrechnungsziffern EBM 01871/01875
    sind keine Codings, sondern Quellen. MII TermServ, LOINC 2.83, SNOMED CT International 20260701, KDL
    2025, Stand 2026-10-15. Rollen der Codes: loinc|79086-5 = element; snomed-ct|16334891000119106 = element;
    snomed-ct|306143000 = methode; snomed-ct|3457005 = methode; kdl|AU050102 = dokumentklasse.'
  codings:
  - system: loinc
    code: 79086-5
    display: CT Chest for screening WO contrast
  - system: snomed-ct
    code: '16334891000119106'
    display: Low dose computed tomography of chest without contrast
  - system: snomed-ct
    code: '306143000'
    display: Referral to computed tomography service
  - system: snomed-ct
    code: '3457005'
    display: Patient referral
  - system: kdl
    code: AU050102
    display: Überweisungsschein
standard_mappings:
- standard: fhir-mii-kds
  profile_or_url: https://www.medizininformatik-initiative.de/fhir/ext/modul-bildgebung/StructureDefinition/mii-pr-bildgebung-anforderung-bildgebung
  resource: ServiceRequest
  path: ServiceRequest.code.coding:loinc (79086-5); ServiceRequest.category.coding:sct (363679005 Imaging);
    ServiceRequest.supportingInfo (→ eligibilityReport); ServiceRequest.performer; ServiceRequest.status;
    ServiceRequest.intent
  notes: de.medizininformatikinitiative.kerndatensatz.bildgebung#2026.0.0 (Profil 'Anforderung einer Bildgebung'),
    stabil; gleiche Canonical in 2025.0.2 und 2027.0.0-ballot.1. code 1..1 MS; code.coding:loinc REQUIRED
    an http://loinc.org/vs/loinc-rsna-radiology-playbook, 79086-5 ist laut tx.fhir.org (LOINC 2.82) Mitglied.
    category 1..* mit Slice sct = 363679005. supportingInfo (MS) verweist auf eligibilityReport, performer
    (nicht MS) auf den Erstbefunder mit KV-Genehmigung (KFE-RL § 43 Abs. 5). reasonCode.coding:sct ist
    REQUIRED an mii-vs-bildgebung-findings-sct gebunden; der Anlass Früherkennung ist kein Befund und
    steckt im LOINC-Code (for screening). Passt besser als die Basis-ServiceRequest des Bestands referralOrder.
- standard: ihe-xds
  profile_or_url: http://ihe-d.de/ValueSets/IHEXDSclassCode
  resource: XDS DocumentEntry (Überweisungsschein als Dokument)
  path: DocumentEntry.classCode = VER; DocumentEntry.typeCode = AUFN; DocumentEntry.eventCodeList = KDL
    AU050102
  notes: de.ihe-d.terminology#3.0.1, nicht-FHIR (XDS-Metadaten). VER 'Verordnung' umfasst laut Definition
    auch 'Überweisungen an andere Ärzte', AUFN 'Einweisungs- und Aufnahmedokumente' nennt ausdrücklich
    den Überweisungsschein; die DVMD-ConceptMap kdl-ihe-typecode (dvmd.kdl.r4#2025.0.1) bildet AU050102
    auf AUFN ab (wider). Gilt für die Dokumentablage in MII Dokument (type/category.coding:XDS), ePA MHD
    (OID-Systeme urn:oid:1.3.6.1.4.1.19376.3.276.1.5.8/.5.9) und ISiKDokumentenMetadaten.
- standard: fhir-r4-base
  profile_or_url: http://hl7.org/fhir/StructureDefinition/ServiceRequest
  resource: ServiceRequest
  path: ServiceRequest.code; ServiceRequest.category; ServiceRequest.supportingInfo; ServiceRequest.performer
  notes: hl7.fhir.r4.core#4.0.1, stabil. Das Bestandselement referralOrder (primary-care) mappt auf ServiceRequest.reasonCode;
    für die Spezialisierung ist ServiceRequest.code (79086-5 / 16334891000119106) der Elementinhalt, zusätzlich
    supportingInfo → eligibilityReport.
- standard: other
  profile_or_url: http://hl7.eu/fhir/imaging/StructureDefinition/ServiceRequestOrderEuImaging
  resource: ServiceRequest
  path: ServiceRequest.code (example im-procedure-type); ServiceRequest.category:imaging (363679005);
    ServiceRequest.supportingInfo; ServiceRequest.extension:reason; ServiceRequest.identifier:accessionNumber
  notes: hl7.fhir.eu.imaging#1.0.0-ballot (status draft), Ballot; europäisches Ziel mit niedriger Priorität,
    kein deutsches Pflichtprofil. Laut Beschreibung 'In DICOM this is referred to as the Requested Procedure';
    Gegenstück ist die Composition-Sektion 'order' (LOINC 55115-0) im EU-Bildgebungsbericht.
- standard: openehr-archetype
  profile_or_url: https://ckm.openehr.org/ckm/archetypes/1013.1.614
  resource: openEHR-EHR-INSTRUCTION.service_request.v1
  path: INSTRUCTION/activities/description (Service name, Reason, Supporting information)
  notes: 'openEHR CKM 1013.1.614, Revision 1.1.3-alpha, in_development (CKM: Reassess/Draft), nicht-FHIR;
    nachrangiges, nicht publiziertes Ziel. Die Spezialisierung service_request-imaging_examination.v0
    (1013.1.7240) ist erst initial.'
- standard: other
  profile_or_url: https://edge.sitecorecloud.io/americancoldf5f-acrorgf92a-productioncb02-3650/media/ACR/Files/Clinical/Registries/LCSR-Data-Elements-from-Ordering-Physician-Records.pdf
  resource: ACR LCSR – Datenelemente der schriftlichen Anordnung (Written Order)
  path: 'Spalte ''Written Order'': Geburtsdatum, Smoking status, Pack-years, Years since quit, Ordering
    practitioner NPI, Signs or symptoms'
  notes: ACR LCSR Data Elements from Ordering Physician Records (PDF, abgerufen 2026-10-15), nicht-FHIR,
    breites US-Referenzmuster. In den USA verlangt die CMS-NCD eine schriftliche Anordnung mit den Raucherdaten;
    in Deutschland stehen diese Angaben im getrennten Bericht (eligibilityReport).
