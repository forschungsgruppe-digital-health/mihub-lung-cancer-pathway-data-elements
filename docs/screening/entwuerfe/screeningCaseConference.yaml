id: mihub.lung.screening.screeningCaseConference.v0.1
uuid: 25f1dbd5-73b4-5535-953b-306adc170806
name: screeningCaseConference
label_de: Interdisziplinäre Fallkonferenz zum abklärungsbedürftigen Befund
definition_de: Datum und Ergebnis der thorax-onkologischen Fallkonferenz zum abklärungsbedürftigen Befund
  (Bildgebung, Diagnosesicherung, Kontrolle).
phase: screening
category: versorgungsplanung
datatype: string
cardinality: 0..*
value_set:
  binding_strength: extensible
  standard_binding_status: mapped
  notes: 'MII TermServ, SNOMED CT 20260701, LOINC 2.83, KDL 2025; Stand 2026-10-15. Element-Code (Konferenz)
    399414003 wie im Bestand tumorBoardDecision. Dokumentklassen für das Konferenzprotokoll: LOINC 85231-9
    ''Tumor Board Note'' und KDL SD150103 ''Tumorkonferenzprotokoll'' (AD060106 ist in KDL 2025 deprecated).
    Antwortwerte Ergebnis nach S3 Empf. 5.12: weitere Bildgebung 1373815000 ''PET-CT using fluorodeoxyglucose
    (18-F)'' (bevorzugt; Oberbegriff 450436003 wie petCtFollowUp), Diagnosesicherung 78603008 ''Biopsy
    of lung'' (Oberbegriff; Details in invasiveWorkupProcedure), Kontrolle 713548006 ''Low dose computed
    tomography of thorax''. Die Ergebniswerte sind Prozeduren, keine Empfehlungskonzepte. Das Konferenzdatum
    wird als dateTime (CarePlan.created) ohne eigenen Code geführt. Rollen der Codes: snomed-ct|399414003
    = element; loinc|85231-9 = dokumentklasse; kdl|SD150103 = dokumentklasse; snomed-ct|1373815000 = wert;
    snomed-ct|450436003 = wert; snomed-ct|78603008 = wert; snomed-ct|713548006 = wert.'
  codings:
  - system: snomed-ct
    code: '399414003'
    display: Multidisciplinary care conference for cancer care planning
  - system: loinc
    code: 85231-9
    display: Tumor Board Note
  - system: kdl
    code: SD150103
    display: Tumorkonferenzprotokoll
  - system: snomed-ct
    code: '1373815000'
    display: PET-CT using fluorodeoxyglucose (18-F)
  - system: snomed-ct
    code: '450436003'
    display: Positron emission tomography with computed tomography
  - system: snomed-ct
    code: '78603008'
    display: Biopsy of lung
  - system: snomed-ct
    code: '713548006'
    display: Low dose computed tomography of thorax
standard_mappings:
- standard: fhir-mii-kds
  profile_or_url: https://www.medizininformatik-initiative.de/fhir/ext/modul-onko/StructureDefinition/mii-pr-onko-tumorkonferenz
  resource: CarePlan
  path: CarePlan.created (1..1, MS = Konferenzdatum) | CarePlan.category.coding (1..*, REQUIRED mii-vs-onko-therapieplanung-typ;
    praeth) | CarePlan.intent (pattern plan) | CarePlan.status (1..1) | CarePlan.addresses (nur mii-pr-onko-diagnose-primaertumor)
    | CarePlan.supportingInfo (Reference(Resource); Screeningbefund) | CarePlan.activity.reference (→
    ServiceRequest mit SNOMED-Code in ServiceRequest.code) | CarePlan.activity:obds.detail.code (1..1,
    REQUIRED mii-vs-onko-therapieempfehlung-typ; nur echte Therapieempfehlung) | CarePlan.description
    / CarePlan.note
  notes: 'de.medizininformatikinitiative.kerndatensatz.onkologie#2026.0.3, stabil (gleiche URL im Ballot
    2027.0.0-ballot.1). Spezialisierung von tumorBoardDecision. Konferenzdatum für den QI nach S3 Empf.
    5.13 in CarePlan.created; Konferenztyp praeth. addresses erlaubt nur eine Primärtumor-Condition, die
    vor der Diagnosesicherung fehlt; den abklärungsbedürftigen Screeningbefund daher über supportingInfo
    referenzieren. Das activity-Slicing hat die Discriminators exists:detail und profile:reference.resolve():
    Jede activity mit detail fällt in den Slice obds und muss detail.code aus mii-cs-onko-therapie-typ
    tragen. Diagnostik (FDG-PET/CT, Bronchoskopie mit TBB, CT-gesteuerte Biopsie, minimal-invasive Resektion)
    daher nicht in activity.detail.code, sondern als activity.reference auf einen ServiceRequest mit SNOMED-Code,
    alternativ in description bzw. note. Den obds-Slice (0..*) nur für eine echte Therapieempfehlung nutzen,
    z. B. WS für Kontrolle. Eine Screening-Fallkonferenz vor der Diagnose ist kein oBDS-Meldeanlass.'
- standard: fhir-mii-kds
  profile_or_url: https://www.medizininformatik-initiative.de/fhir/ext/modul-dokument/StructureDefinition/mii-pr-dokument-dokument
  resource: DocumentReference
  path: DocumentReference.type.coding:KDL (0..1, MS, REQUIRED http://dvmd.de/fhir/ValueSet/kdl) = SD150103
    | DocumentReference.date (0..1, instant) | DocumentReference.content.attachment (1..1) | DocumentReference.context.related
    (0..*)
  notes: de.medizininformatikinitiative.kerndatensatz.dokument#2026.0.1, stabil (gleiche URL im Ballot
    2027.0.0-ballot.2). Für das Konferenzprotokoll als Dokument, wie im Bestand tumorBoardDecision. Es
    gilt nur KDL SD150103 'Tumorkonferenzprotokoll' (dvmd.kdl.r4#2025.0.1); AD060106 ist in KDL 2025 deprecated.
    context.related verweist auf den CarePlan bzw. den Screeningbefund.
- standard: fhir-r4-base
  profile_or_url: http://hl7.org/fhir/StructureDefinition/CarePlan
  resource: CarePlan
  path: CarePlan.created | CarePlan.activity.detail.code | CarePlan.activity.reference | CarePlan.supportingInfo
  notes: hl7.fhir.r4.core#4.0.1, stabil; Rückfallebene ohne oBDS-Pflichtbindungen, wenn die Screening-Konferenz
    nicht als oBDS-Tumorkonferenz gelten soll (kein Primärtumor, keine Therapieempfehlung).
care_process:
  trigger: abklärungsbedürftiger Befund
  responsible_role: spezialisierte Einrichtung (thorax-onkologisches Tumorboard)
