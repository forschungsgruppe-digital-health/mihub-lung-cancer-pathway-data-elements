issues:
- 'Verbindlichkeit nach Gegenprüfung: Leitlinie. S3 Empf. 5.9 (soll: initiale Fallvorstellung), 5.12 (sollte:
  Entscheidung über Diagnostik), 5.13 (QI „wünschenswert“); Tab. 15 (mindestens wöchentliche Fallkonferenz).'
- 'Umsetzung: Spezialisierung von tumorBoardDecision (primarycare); Grenzfall des Scopes. specializes
  tumorBoardDecision; dependsOn clarificationReferral. Konferenzdatum als QI-Rückmeldung (S3 Empf. 5.13)
  und Ergebnis getrennt modellieren; Ergebnis per Verweis auf tumorBoardDecision oder als Werteliste nach
  Empf. 5.12: weitere Bildgebung (z. B. FDG-PET/CT) | Diagnosesicherung (Bronchoskopie mit transbronchialer
  Biopsie, CT-gesteuerte Biopsie, minimal-invasive Resektion) | Kontrolle. Codes aus dem Bestand übernehmen
  (SNOMED 1268903003, LOINC 85231-9, KDL SD150103). Verbindlichkeit angeben (5.13 „wünschenswert“, 5.12
  „sollte“, 5.9 „soll“). Der Rückkanal an die Screening-Einheit fehlt im BPMN.'
- Es gibt kein Profil für eine diagnostische Fallkonferenz vor der Diagnosesicherung; das MII-Tumorkonferenz-Profil
  ist auf Primärtumor und oBDS-Therapieempfehlung ausgerichtet, Werte für Diagnostik bzw. Bildgebung fehlen
  in mii-vs-onko-therapieempfehlung-typ.
- Zu prüfen ist, ob mii-pr-bildgebung-behandlungsempfehlung (CarePlan, de.medizininformatikinitiative.kerndatensatz.bildgebung#2026.0.0)
  als MII-Alternative ohne oBDS-Zwang taugt; fachlich ist es eine radiologische Empfehlung und kein Konferenzbeschluss.
- In SNOMED CT fehlt ein Konzept für die Empfehlung der Tumorkonferenz (z. B. 'Kontrolle empfohlen');
  die Ergebniswerte sind Prozedurcodes, das ist als Modellierungsentscheidung zu kennzeichnen.
- Ein LOINC-Observable für das Datum der Tumorkonferenz fehlt; das Datum läuft über CarePlan.created.
- Der Rückkanal von der spezialisierten Einrichtung an die Screening-Einheit fehlt im BPMN-Modell.
- Die Verbindlichkeit ist anzugeben (S3 Empf. 5.9 'soll', 5.12 'sollte', 5.13 QI 'wünschenswert'); die
  Kardinalität 0..* statt 0..1 ist zu entscheiden.
