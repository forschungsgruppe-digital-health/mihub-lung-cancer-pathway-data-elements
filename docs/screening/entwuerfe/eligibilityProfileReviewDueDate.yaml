issues:
- 'Verbindlichkeit nach Gegenprüfung: Leitlinie. S3 Empf. 5.6 (EK, „sollten“); keine Rechtspflicht. Im
  BPMN fehlt ein Schritt für die erneute Prüfung.'
- 'Umsetzung: abgeleitetes Attribut (Zusammenlegung mit medicalSuitabilityProfile prüfen). Nicht als eigenständig
  erhobenes Element führen, sondern als berechnetes Attribut „nächste Eignungsprüfung fällig“ von medicalSuitabilityProfile:
  Regel nach S3 Empf. 5.6 in constraints_de (unter 70 Jahren +5 Jahre, 70 bis 75 Jahre +3 Jahre, vorgezogen
  bei Bekanntwerden einer neuen hohen Komorbiditätslast; Eingänge Prüfdatum und Geburtsdatum). Zusätzlich
  Recall-Anlass „Neubewertung“ in screeningInvitation. Definition auf das medizinische Eignungsprofil
  beschränken. Die KBV-Information sieht ohnehin eine Kriterienprüfung je Runde vor.'
- Es fehlt ein SNOMED-Temporal-Observable 'Date of next eligibility reassessment due' bzw. 'Date lung
  cancer screening due' sowie eine spezifische Prozedur 'Reassessment of eligibility for lung cancer screening';
  der Element-Code ist nur eine Näherung.
- Kein nationales Profil (MII KDS, ISiK, KBV, ePA) bildet eine Fälligkeit bzw. Wiedervorlage einer Bewertung
  ab; ISiKTermin und KBV_PR_Base_Appointment beschreiben nur konkrete Termine.
- Zu entscheiden ist, ob das Element als berechnetes Attribut von medicalSuitabilityProfile geführt wird
  statt als eigenständiges Element.
- Im BPMN-Screening-Pfad fehlt ein Schritt für die erneute Eignungsprüfung; der Recall-Anlass 'Neubewertung'
  ist in screeningInvitation zu ergänzen.
