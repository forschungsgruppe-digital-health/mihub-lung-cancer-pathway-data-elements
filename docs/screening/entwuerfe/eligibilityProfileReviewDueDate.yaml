id: mihub.lung.screening.eligibilityProfileReviewDueDate.v0.1
uuid: cd7dc5c3-dc5c-5df9-a3c9-6d85655ecd99
name: eligibilityProfileReviewDueDate
label_de: Fälligkeit der erneuten Prüfung des Eignungsprofils
definition_de: 'Fälligkeit der erneuten Eignungsprüfung nach erster LDCT: bis 70 J. alle 5 Jahre, 70–75
  J. mind. alle 3 Jahre, vorgezogen bei neuer Komorbidität.'
phase: screening
category: versorgungsplanung
datatype: date
cardinality: 0..1
value_set:
  binding_strength: example
  standard_binding_status: pending-mapping
  notes: 'SNOMED CT INT 20260701 (MII TermServ), Stand 2026-10-15. Das Element ist ein berechnetes Datum
    ohne Wertkodierung. Element-Code ist nur eine Näherung (broader): 472061000124107 Evaluation of eligibility
    for program bezeichnet das fällige Ereignis (die erneute Eignungsprüfung), nicht das Fälligkeitsdatum;
    die ID stammt aus dem US-Namensraum, das Konzept ist aber Teil der INT-Edition. Ein Temporal Observable
    ''Datum fällige Neubewertung'' gibt es nicht; LOINC 90060-5 Date task due ist zu generisch. Berechnungsregel
    (S3 Empf. 5.6, EK) in constraints_de: unter 70 Jahren Prüfdatum + 5 Jahre, 70 bis 75 Jahre + 3 Jahre,
    vorgezogen bei neuer hoher Komorbiditätslast; Eingänge Prüfdatum und Geburtsdatum. Rollen der Codes:
    snomed-ct|472061000124107 = element.'
  codings:
  - system: snomed-ct
    code: '472061000124107'
    display: Evaluation of eligibility for program
standard_mappings:
- standard: fhir-r4-base
  profile_or_url: http://hl7.org/fhir/StructureDefinition/Task
  resource: Task
  path: Task.restriction.period
  notes: 'hl7.fhir.r4.core#4.0.1 (Ressource mit SD-Status draft). Bevorzugtes Ziel: restriction.period.end
    = spätester Zeitpunkt der erneuten Eignungsprüfung; code lokal (''Neubewertung Eignungsprofil''),
    focus auf die Observation medicalSuitabilityProfile, for = Patient, status requested, intent plan.
    Gleiche Fälligkeitskonvention (Task.restriction.period.end) wie im MiHUB-Patientenportal.'
- standard: fhir-r4-base
  profile_or_url: http://hl7.org/fhir/StructureDefinition/ServiceRequest
  resource: ServiceRequest
  path: ServiceRequest.occurrence[x]
  notes: 'hl7.fhir.r4.core#4.0.1 (stabil). Nachrangige Alternative, wenn die erneute Prüfung als geplante
    Leistung angefordert wird: occurrence[x] (dateTime|Period|Timing) 0..1, reasonReference auf die Eignungsprofil-Observation.
    Für einen reinen Recall-Hinweis weniger passend.'
- standard: fhir-r4-base
  profile_or_url: http://hl7.org/fhir/StructureDefinition/CarePlan
  resource: CarePlan
  path: CarePlan.activity.detail.scheduled[x]
  notes: 'hl7.fhir.r4.core#4.0.1 (stabil). Option, wenn die Früherkennungs-Episode als CarePlan geführt
    wird: activity.detail.scheduled[x] (Timing|Period|string) 0..1, activity.detail.code lokal (example).
    Recall-Anlass ''Neubewertung'' gemeinsam mit screeningInvitation.'
- standard: openehr-archetype
  profile_or_url: https://ckm.openehr.org/ckm/archetypes/1013.1.614
  resource: openEHR-EHR-INSTRUCTION.service_request.v1
  path: /activities[at0001]/description[at0009]/items[at0040] (Service due)
  notes: openEHR CKM service_request.v1, Revision 1.1.3-alpha (lifecycle in_development, nicht stabil;
    nicht-FHIR). 'Service due' at0040 = Fälligkeitsdatum, 'Service name' at0121 = erneute Eignungsprüfung.
