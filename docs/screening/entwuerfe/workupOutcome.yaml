id: mihub.lung.screening.workupOutcome.v0.1
uuid: 9f62aa31-875c-52b0-ac3f-8f0fc1ff3172
name: workupOutcome
label_de: Ergebnis der Abklärung eines abklärungsbedürftigen Befunds
definition_de: 'Endgültiges Abklärungsergebnis mit Datum: Karzinom gesichert, benigne (mit/ohne invasive
  Abklärung), anderes Malignom, unklar, nicht erfolgt.'
phase: screening
category: diagnose
datatype: CodeableConcept
cardinality: 1..*
value_set:
  binding_strength: extensible
  standard_binding_status: mapped
  notes: 'MII TermServ, SNOMED CT 20260701; Stand 2026-10-15. Antwortwerte (Observation.value[x]): Lungenkarzinom
    gesichert 93880001 ''Primary malignant neoplasm of lung'' (wie cancerDiagnosis; schließt Lungenmetastasen
    aus) | anderes Malignom 363346000 ''Malignant neoplastic disease'' (Gruppierer, umfasst formal auch
    Lungenkrebs; Abgrenzung zu 93880001 per Regel) | benigne 110396000 ''No evidence of malignant neoplasm''
    (kein Malignitätsnachweis, auch nicht-neoplastische Befunde wie Granulom) | unklar 442754001 ''Inconclusive
    evaluation finding'' | nicht erfolgt 385660001 ''Not done'' (qualifier value; alternativ Observation.dataAbsentReason).
    Ein Element-Code (Observation.code) für ''Ergebnis der Abklärung'' existiert weder in SNOMED CT noch
    in LOINC und ist lokal festzulegen. ''Mit/ohne invasive Abklärung'' über invasiveWorkupProcedure;
    Datum über Observation.effective[x]; Histologie und Stadium über tumorHistology bzw. tnmStage. Rollen
    der Codes: snomed-ct|93880001 = wert; snomed-ct|363346000 = wert; snomed-ct|110396000 = wert; snomed-ct|442754001
    = wert; snomed-ct|385660001 = wert.'
  codings:
  - system: snomed-ct
    code: '93880001'
    display: Primary malignant neoplasm of lung
  - system: snomed-ct
    code: '363346000'
    display: Malignant neoplastic disease
  - system: snomed-ct
    code: '110396000'
    display: No evidence of malignant neoplasm
  - system: snomed-ct
    code: '442754001'
    display: Inconclusive evaluation finding
  - system: snomed-ct
    code: '385660001'
    display: Not done
standard_mappings:
- standard: fhir-mii-kds
  profile_or_url: https://www.medizininformatik-initiative.de/fhir/ext/modul-onko/StructureDefinition/mii-pr-onko-diagnose-primaertumor
  resource: Condition
  path: Condition.code.coding:icd10-gm (REQUIRED mii-vs-diagnose-icd10gm; C34.-) / :sct (REQUIRED) | Condition.verificationStatus.coding:primaertumorDiagnosesicherung
    (0..1, MS, REQUIRED mii-vs-onko-primaertumor-diagnosesicherung) | Condition.extension:Feststellungsdatum
    (1..1, MS, condition-assertedDate) | Condition.recordedDate (1..1) | Condition.evidence.detail (→
    mii-pr-onko-liste-evidenz-erstdiagnose) | Condition.extension:morphology-behavior-icdo3
  notes: de.medizininformatikinitiative.kerndatensatz.onkologie#2026.0.3, stabil. Folgeressource für den
    Wert 'Lungenkarzinom gesichert' (Ziel des dependsOn auf cancerDiagnosis), kein Ersatz für das Element.
    Die Diagnosesicherung nach oBDS (7 = Histologie Primärtumor, 5 = Zytologie, 2 = klinische Diagnostik)
    bildet 'mit/ohne invasive Abklärung' standardkonform ab. Das Feststellungsdatum liefert das Datum
    für die PPV- bzw. Zeit-bis-Diagnose-QI (S3 Kap. 5.1.5.3). evidence.detail führt über die List auf
    Observation bzw. DiagnosticReport der Abklärung.
- standard: fhir-mii-kds
  profile_or_url: https://www.medizininformatik-initiative.de/fhir/core/modul-diagnose/StructureDefinition/Diagnose
  resource: Condition
  path: Condition.code.coding:icd10-gm (REQUIRED mii-vs-diagnose-icd10gm) | Condition.code.coding:sct
    (REQUIRED diagnoses-sct = is-a 404684003, 272379006, 243796009) | Condition.verificationStatus (required)
    | Condition.recordedDate (1..1) | Condition.extension:Feststellungsdatum (0..1) | Condition.evidence.detail
  notes: de.medizininformatikinitiative.kerndatensatz.base#2026.0.1, stabil. Generisches MII-Diagnoseprofil
    für 'anderes Malignom' (363346000 bzw. ICD-10-GM) oder einen benignen Befund mit eigener Diagnose.
    93880001, 363346000 und 442754001 liegen unter 404684003 und sind in diagnoses-sct zulässig.
- standard: fhir-mii-kds
  profile_or_url: https://www.medizininformatik-initiative.de/fhir/ext/modul-patho/StructureDefinition/mii-pr-patho-diagnostic-conclusion-grouper
  resource: Observation
  path: Observation.code (pattern LOINC 22637-3) | Observation.value[x] | Observation.hasMember (Slice
    pathology-finding) | Observation.derivedFrom | Observation.effective[x] (0..1, MS, dateTime)
  notes: de.medizininformatikinitiative.kerndatensatz.patho#2026.0.2 (SD-Version 2026.0.0), stabil. Liefert
    die histologische bzw. zytologische Abschlussdiagnose als Quelle; workupOutcome verweist über Observation.derivedFrom
    darauf. Kein Ersatz für das Element.
- standard: fhir-isik
  profile_or_url: https://gematik.de/fhir/isik/StructureDefinition/ISiKDiagnose
  resource: Condition
  path: Condition.code.coding:ICD-10-GM (Extension Diagnosesicherheit, MS) | Condition.code.coding:SNOMED-CT
    (REQUIRED DiagnosesSCT = is-a 404684003, 272379006, 243796009) | Condition.verificationStatus (MS)
    | Condition.recordedDate (1..) | Condition.onset[x] (dateTime|Age)
  notes: de.gematik.isik#6.0.0, stabil; nur Differential (kein Snapshot im Paket). Krankenhausseitige
    Diagnose bei gesichertem Karzinom bzw. anderem Malignom; Diagnosesicherheit über die ICD-Extension
    (G/V/Z/A).
- standard: other
  profile_or_url: https://fhir.kbv.de/StructureDefinition/KBV_PR_Base_Condition_Diagnosis
  resource: Condition
  path: Condition.code.coding:ICD-10-GM (Extensions Diagnosesicherheit, Seitenlokalisation) | Condition.code.coding:snomed
    (REQUIRED KBV_VS_Base_Diagnosis_SNOMED_CT) | Condition.code.coding:alphaId | Condition.verificationStatus
  notes: kbv.basis#1.9.0, stabil; ambulantes KBV-Basisprofil (kein MIO, daher unter other), z. B. für
    die Rückmeldung an die Praxis. Nur Differential im Paket. KBV_VS_Base_Diagnosis_SNOMED_CT liegt im
    Paket (compose is-a 404684003, 272379006, 243796009; SNOMED CT DE-Edition 20260515); 93880001 und
    363346000 sind damit enthalten. Das MIO-Profil KBV_PR_MIO_NFD_Condition (kbv.mio.patientenkurzakte#1.0.0)
    ist wegen code.coding ..1 nur nachrangig.
- standard: fhir-r4-base
  profile_or_url: http://hl7.org/fhir/StructureDefinition/Observation
  resource: Observation
  path: Observation.code (lokaler Code 'Abklärungsergebnis') | Observation.value[x] (CodeableConcept)
    | Observation.effective[x] (Datum der abschließenden Beurteilung) | Observation.focus (abklärungsbedürftiger
    Screeningbefund; bei gesichertem Karzinom die Condition aus cancerDiagnosis) | Observation.derivedFrom
    (Observation mii-pr-patho-diagnostic-conclusion-grouper) | Observation.partOf (Procedure aus invasiveWorkupProcedure)
    | Observation.dataAbsentReason (alternativ für 'nicht erfolgt')
  notes: 'hl7.fhir.r4.core#4.0.1, stabil; empfohlene Kernabbildung, da das Element eine Ergebniskategorie
    je abklärungsbedürftigem Befund ist und keine Diagnose, und kein Observation-Profil für ein Screening-Abklärungsergebnis
    existiert. Werte 93880001 | 363346000 | 110396000 | 442754001 | 385660001. Referenzziele nach R4:
    Procedure nur über partOf; die Condition nur über focus (derivedFrom erlaubt keine Condition); das
    Pathologie-Ergebnis über derivedFrom auf die Observation (nicht auf den DiagnosticReport). Stadium
    und Histologie nicht wiederholen (dependsOn tnmStage, tumorHistology).'
- standard: mcode
  profile_or_url: http://hl7.org/fhir/us/mcode/StructureDefinition/mcode-primary-cancer-condition
  resource: Condition
  path: Condition.code (1..1, MS, extensible mcode-primary-cancer-disorder-vs) | Condition.verificationStatus
    | Condition.extension:assertedDate | Condition.extension:histologyMorphologyBehavior | Condition.bodySite
  notes: hl7.fhir.us.mcode#4.0.0, stabil; nur internationales Referenzmuster für 'Lungenkarzinom gesichert'
    (Basis US Core).
- standard: other
  profile_or_url: http://hl7.org/fhir/uv/ips/StructureDefinition/Condition-uv-ips
  resource: Condition
  path: Condition.code (1..1, MS, preferred problems-uv-ips) | Condition.verificationStatus (0..1, required)
    | Condition.onset[x] (MS)
  notes: hl7.fhir.uv.ips#2.0.1, stabil; internationales Referenzmuster (IPS) für die Diagnose in einer
    Patientenkurzakte.
- standard: other
  profile_or_url: https://nrdrsupport.acr.org/support/solutions/articles/11000041247
  resource: 'ACR LCSR & IPN Data Dictionary (28.05.2026), Exam Form: Follow-Up / Lung Cancer Incidence
    (Sections 5B, 5B4–5B11)'
  path: '#160 Date of follow-up | #163 Tissue/cytology diagnosis (Benign | Malignant – invasive lung cancer
    | Malignant – minimally invasive lung cancer | Malignant – non-lung cancer | Malignant – adenocarcinoma
    in situ | Premalignancy – AAH | Non-diagnostic | Clinical – without histology | Malignant – carcinoid
    | Other | Unknown) | #164 Tissue/cytology diagnosis method | #165 ff. Location, Histology, Stage'
  notes: 'ACR LCSR & IPN Data Dictionary, Fassung 28.05.2026 (PDF-Anhang https://nrdrsupport.acr.org/helpdesk/attachments/11143178430),
    S. 33–36; nicht-FHIR, US-Registermuster. Bestätigt die MiHUB-Werteliste weitgehend (Benign, Lungenkarzinom,
    Malignant – non-lung cancer, Non-diagnostic bzw. Unknown, Clinical – without histology) und ist feiner
    (AIS, minimal invasiv, Karzinoid, Präkanzerose). #163 ist an die einzelne Prozedur gebunden (''report
    the most concerning''), MiHUB erfasst dagegen das endgültige Ergebnis je Befund; ''nicht erfolgt''
    hat kein LCSR-Äquivalent.'
