issues:
- 'Verbindlichkeit nach Gegenprüfung: keine. Ratsempfehlung 2022/C 473/01 Nr. 12 (unverbindlich); S3 Empf.
  5.13 („wünschenswert“) und Kap. 5.1.5.3. § 7 Abs. 2 LuKrFrühErkV und § 44 KFE-RL verlangen nur Zählungen,
  kein Abklärungsergebnis; das Monitoring nach § 46 Abs. 2 KFE-RL folgt erst bis Ende 2028.'
- 'Umsetzung: eigenständig; Grenzfall des Scopes (Rückkanal). Prozessanker ändern in „G12 Abklärung –
  Rückmeldung der spezialisierten Einrichtung (BPMN-Lücke)“ und den Bezug auf § 7 entfernen; Datenfluss,
  Rechtsgrundlage bzw. Einwilligung als Issue (DPIA). Werte: Lungenkarzinom gesichert (363358000 oder
  präziser 448993007) | anderes Malignom (363346000) | benigne (lokal) | unklar (442754001) | nicht erfolgt
  (lokal); „mit/ohne invasive Abklärung“ über invasiveWorkupProcedure. Auslöser screeningResultCategory
  = abklärungsbedürftig; Datum über effective[x]. dependsOn cancerDiagnosis, tumorHistology und tnmStage
  statt Stadium und Histologie zu wiederholen. PPV1/PPV2 nach S3 Kap. 5.1.5.3 in instruction_de definieren.
  Deutsche Quelle ergänzen (S3 Empf. 5.13, Kap. 5.1.5.3); „unklar“ und „nicht erfolgt“ als Modellierungsentscheidung
  kennzeichnen.'
- Es gibt weder ein LOINC- noch ein SNOMED-Observable für das Ergebnis der Abklärung eines Screeningbefunds;
  der Element-Code (Observation.code) ist lokal festzulegen.
- Es gibt kein Profil (MII, ISiK, KBV, ePA, IPS, mCODE) für das Abklärungsergebnis als eigene Ergebniskategorie;
  Condition-Profile decken 'benigne', 'unklar' und 'nicht erfolgt' nicht ab, daher Observation-Basisressource.
- Das Werte-Set mischt Befund- und Qualifier-Hierarchien (385660001 ist ein qualifier value); 'unklar'
  und 'nicht erfolgt' sind als Modellierungsentscheidung zu kennzeichnen, alternativ 'nicht erfolgt' über
  Observation.dataAbsentReason.
- 363346000 umfasst formal auch Lungenkrebs; die Abgrenzung 'anderes Malignom' gegenüber 93880001 ist
  als Regel zu dokumentieren.
- Der Prozessanker ist zu ändern (G12 Abklärung – Rückmeldung der spezialisierten Einrichtung, BPMN-Lücke)
  und der Bezug auf § 7 LuKrFrühErkV zu entfernen, da § 7 und § 44 KFE-RL nur Zählungen verlangen.
- Datenfluss, Rechtsgrundlage bzw. Einwilligung für den Rückkanal von der spezialisierten Einrichtung
  sind im Rahmen der DPIA zu klären.
- PPV1/PPV2 nach S3 Kap. 5.1.5.3 sind in der Anleitung zu definieren und eine deutsche Quelle (S3 Empf.
  5.13, Kap. 5.1.5.3) zu ergänzen.
- Kardinalität laut Quelle 0..1 je abklärungsbedürftigem Befund.
