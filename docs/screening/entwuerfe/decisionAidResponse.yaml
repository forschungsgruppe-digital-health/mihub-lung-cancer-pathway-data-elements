id: mihub.lung.screening.decisionAidResponse.v0.1
uuid: 9db5e8f4-32b4-53cc-b090-74507aac8d8f
name: decisionAidResponse
label_de: Entscheidungshilfe der Versicherteninformation (Antworten)
definition_de: 'Antworten in der Entscheidungshilfe: bevorzugte Option mit Gründen, Entscheidungsstand
  0–10 und eigene Fragen für das Gespräch.'
phase: screening
category: prom
datatype: Reference
cardinality: 0..*
value_set:
  binding_strength: example
  standard_binding_status: no-standard-found
  notes: 'KDL 2025, SNOMED CT INT 20260701, LOINC 2.83 (MII TermServ), Stand 2026-10-15. Das Element ist
    eine QuestionnaireResponse zur Entscheidungshilfe der G-BA-Versicherteninformation (Anlage I KFE-RL,
    Abschnitt ''Unterstützung Ihrer Entscheidung''). Für Instrument und Items gibt es weder ein LOINC-Panel
    noch SNOMED-Konzepte; die Item-Codes (Element-Codes) sind lokale Platzhalter: vorstellbare Option(en),
    Gründe dafür, Gründe dagegen, Stand der Entscheidung 0–10, eigene Fragen. Antwortwerte des Options-Items
    lokal: keine Früherkennung | Früherkennung mit Niedrigdosis-CT. Der Entscheidungsstand wird als integer
    ohne Einheit erfasst (item.answer.valueInteger), Gründe und Fragen als string. KDL AM170103 ist nur
    eine Näherung für die Dokumentklasse (die KDL ordnet Patientenfragebogen unter AM1701 Qualitätssicherungen
    ein), keine Wertbindung. Nicht verwenden: LOINC 77302-8 (DISCOURAGED), 107905-2, 28086-7; SNOMED 53209001
    (anderes Konstrukt) und 13015001000119105 (getroffene Entscheidung, gehört zu participationDecision).
    Rollen der Codes: local-no-standard-binding|preferred-option = element; local-no-standard-binding|no-screening
    = wert; local-no-standard-binding|ldct-screening = wert; local-no-standard-binding|reasons-for = element;
    local-no-standard-binding|reasons-against = element; local-no-standard-binding|decision-stage = element;
    local-no-standard-binding|own-questions = element; kdl|AM170103 = dokumentklasse.'
  codings:
  - system: local-no-standard-binding
    code: preferred-option
    display: Option, die ich mir vorstellen kann
  - system: local-no-standard-binding
    code: no-screening
    display: keine Früherkennung
  - system: local-no-standard-binding
    code: ldct-screening
    display: Früherkennung mit Niedrigdosis-CT
  - system: local-no-standard-binding
    code: reasons-for
    display: Gründe dafür
  - system: local-no-standard-binding
    code: reasons-against
    display: Gründe dagegen
  - system: local-no-standard-binding
    code: decision-stage
    display: Stand der Entscheidung (Skala 0–10)
  - system: local-no-standard-binding
    code: own-questions
    display: eigene Fragen für das Gespräch
  - system: kdl
    code: AM170103
    display: Patientenfragebogen
standard_mappings:
- standard: fhir-mii-kds
  profile_or_url: https://www.medizininformatik-initiative.de/fhir/ext/modul-pro/StructureDefinition/mii-pr-pro-questionnaire-response
  resource: QuestionnaireResponse
  path: QuestionnaireResponse.item.answer.value[x]
  notes: 'de.medizininformatikinitiative.kerndatensatz.pros#2026.7.0 (stabil; Basis sdc-questionnaireresponse).
    Hauptziel für die Selbsteingabe im Portal: questionnaire 1..1 MS (canonical auf sdc-questionnaire
    – eigener Questionnaire nach mii-pr-pro-questionnaire aus demselben Paket nötig), authored 1..1 MS,
    author 0..1 MS (Patient). item.answer.value[x] 0..1 MS: valueCoding für die Option(en), valueString
    für Gründe und Fragen, valueInteger 0–10 für den Entscheidungsstand. Das Modul ist auf validierte
    PRO-Instrumente ausgelegt; die Entscheidungshilfe ist kein PROM.'
- standard: fhir-isik
  profile_or_url: https://gematik.de/fhir/isik/StructureDefinition/ISiKFormularDaten
  resource: QuestionnaireResponse
  path: QuestionnaireResponse.item
  notes: 'de.gematik.isik#6.0.0 (stabil). ISiK-Formularmodul, primär für Krankenhausformulare: questionnaire
    min 1 MS mit extension:questionnaireDisplay 1..1 MS, authored min 1, author und item MS. Formulardefinition
    über ISiKFormularDefinition (https://gematik.de/fhir/isik/StructureDefinition/ISiKFormularDefinition;
    url, version, title min 1).'
- standard: fhir-r4-base
  profile_or_url: http://hl7.org/fhir/StructureDefinition/QuestionnaireResponse
  resource: QuestionnaireResponse
  path: QuestionnaireResponse.item.answer.value[x]
  notes: hl7.fhir.r4.core#4.0.1 (stabil). Basis-Fallback ohne verbindliches Fachprofil; die SDC-Implementierung
    des Patientenportals schreibt QuestionnaireResponse. item.answer.value[x] 0..1 (example).
- standard: other
  profile_or_url: http://hl7.org/fhir/us/core/StructureDefinition/us-core-questionnaireresponse
  resource: QuestionnaireResponse
  path: QuestionnaireResponse.item.answer.value[x]
  notes: hl7.fhir.us.core#9.0.0 (stabil; nur internationales Muster). Basis SDC QuestionnaireResponse
    wie MII PRO; questionnaire und authored je 1..1 MS.
- standard: other
  profile_or_url: https://nrdrsupport.acr.org/support/solutions/articles/11000041247
  resource: ACR LCSR & IPN Data Dictionary
  path: Item 128 'Is there documentation of shared decision making?' (Yes | No | Unknown)
  notes: ACR LCSR & IPN Data Dictionary 2026-05-28 (nicht-FHIR, Register USA), S. 21. Erfasst nur ja/nein/unbekannt
    zur SDM-Dokumentation, keine Inhalte einer Entscheidungshilfe; allenfalls als Ableitung (Antworten
    vorhanden → SDM dokumentiert).
care_process:
