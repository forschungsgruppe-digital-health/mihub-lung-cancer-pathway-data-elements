issues:
- 'Verbindlichkeit nach Gegenprüfung: keine. Freiwilliges Arbeitsblatt der Anlage I KFE-RL; keine Dokumentations-
  oder Übermittlungspflicht (§§ 39–44 KFE-RL).'
- 'Umsetzung: eigenständig, optional (Portal). Nur als optionales Portal-Element führen (QuestionnaireResponse;
  data_flows patientenportal/patient-entered; standardmäßig privat, Weitergabe nur mit Zustimmung; DPIA
  prüfen). Definition quellentreu: Option(en), die sich die Person vorstellen kann (keine Früherkennung
  / Früherkennung mit Niedrigdosis-CT), je mit Gründen dafür und dagegen; Entscheidungsstand 0–10 (lokales
  Item); eigene Fragen. Fundstelle: Anlage I, Abschnitt „Unterstützung Ihrer Entscheidung“ (PDF-S. 39–40;
  Broschüre S. 18–21); den Begriff „Entscheidungshilfe“ nur mit Verweis auf die TrG vom 18.12.2025. Kategorie
  eher versorgungsplanung statt prom. dependsOn patientInformationLeafletProvided; Vorstufe von participationDecision.'
- Für die Entscheidungshilfe der G-BA-Versicherteninformation fehlen ein standardisierter Questionnaire
  (kein LOINC-Panel, kein MII- oder ISiK-Formular) und Codes für die Items; ein projekteigener Questionnaire
  mit kanonischer URL ist zu definieren, ggf. ein LOINC-Antrag zu stellen.
- Die lokalen Item- und Antwortcodes sind vorläufige Platzhalter und mit dem Wortlaut der Anlage I abzugleichen.
- Die DPIA-Prüfung für die Selbsteingabe im Portal (standardmäßig privat, Weitergabe nur mit Zustimmung)
  steht aus.
- Kategorie (versorgungsplanung statt prom), Kardinalität 0..* und die Verwendung des Begriffs 'Entscheidungshilfe'
  (nur mit Verweis auf die Tragenden Gründe vom 18.12.2025) sind zu entscheiden.
- In openEHR wurde kein Archetyp für Entscheidungshilfen gefunden.
