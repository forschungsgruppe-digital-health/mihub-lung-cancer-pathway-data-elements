issues:
- 'Verbindlichkeit nach Gegenprüfung: bedingt. Sicherstellung der Aufnahmen und Befunde der letzten beiden
  Untersuchungen bzw. der einen Voruntersuchung (LuKrFrühErkV § 4 Abs. 2 S. 1; KFE-RL § 41 Abs. 1 S. 2–3);
  Verzicht im Einzelfall (§ 4 Abs. 2 S. 2). Eine Dokumentation von Status oder Verzicht ist nicht ausdrücklich
  normiert.'
- 'Umsetzung: eigenständig (lokales ValueSet). EBM 01871 entfernen (Leistung, kein Statuskonzept; gehört
  als Abrechnungsbezug zu ldctExamination). Lokales Value Set: vorliegend | nicht zutreffend (Erstuntersuchung)
  | angefordert | Verzicht: nicht möglich | Verzicht: unverhältnismäßiger Aufwand; standard_binding_status
  no-standard-found. Den Verweis auf die Vorstudie getrennt führen (Reference ImagingStudy/DiagnosticReport).
  Verzichtsgründe nach TrG S. 18 (u. a. fehlende Schweigepflichtsentbindung) als Werteliste. Quellen ergänzen:
  § 4 Abs. 2 S. 1 und 2, KFE-RL § 41 Abs. 1 S. 2–3, TrG S. 18, obligater Leistungsinhalt von EBM 01871/01872.
  Den Wert „angefordert“ als Prozesswert ohne Quellenbezug kennzeichnen.'
- Für den Status 'Verfügbarkeit von Voraufnahmen' samt Werten gibt es in SNOMED CT, LOINC, MII KDS, ISiK,
  KBV, ePA, IPS, mCODE und DICOM kein Konzept und kein ValueSet; ein lokales CodeSystem ist anzulegen
  und später als MII- oder DE-ValueSet vorzuschlagen.
- Die Verzichtsgründe nach den Tragenden Gründen (u. a. fehlende Schweigepflichtentbindung) sind noch
  als feinere Werteliste festzulegen.
- Der Verweis auf die Vorstudie bzw. den Vorbefund (Reference ImagingStudy/DiagnosticReport, ggf. mit
  LOINC 18834-2/18779-9) ist als eigenes Teil- oder Relationselement zu modellieren, getrennt vom Statuswert.
- Zu entscheiden ist, ob der Prozesswert 'angefordert' ohne Normbezug im ValueSet bleibt.
- Das litauische IG lt.hl7.fhir.lung (CI-Build 0.0.1, nicht in den Registries) enthält nur ein Beispiel-Item
  zu Vor-CTs; es betrifft eher lastQualifyingChestCtDate und ist kein Profil.
- Kardinalität laut Quelle 1..1 (Wert „nicht zutreffend“ bei Erstrunde).
