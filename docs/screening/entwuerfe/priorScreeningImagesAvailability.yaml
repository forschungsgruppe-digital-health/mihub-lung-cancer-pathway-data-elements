id: mihub.lung.screening.priorScreeningImagesAvailability.v0.1
uuid: 7362dc22-a241-567a-a5e4-860e63f5696a
name: priorScreeningImagesAvailability
label_de: Vorliegen von Voraufnahmen und Vorbefunden (§ 4 Abs. 2)
definition_de: Status der Voraufnahmen und Vorbefunde der letzten (zwei) Früherkennungsuntersuchungen
  (vorliegend, keine, angefordert, Verzicht mit Grund) mit Verweis.
phase: screening
category: bildgebung
datatype: CodeableConcept
cardinality: 1..*
value_set:
  binding_strength: example
  standard_binding_status: no-standard-found
  notes: 'Lokales ValueSet für den Status der Voraufnahmen und Vorbefunde nach LuKrFrühErkV § 4 Abs. 2
    mit fünf getrennten Antwortwerten (vorliegend | nicht-zutreffend | angefordert | verzicht-nicht-moeglich
    | verzicht-unverhaeltnismaessig); ein Elementcode existiert nicht. Für ''nicht zutreffend (Erstuntersuchung)''
    und ''angefordert'' werden die generischen SNOMED-CT-Qualifier 385432009 Not applicable und 385644000
    Requested zusätzlich mitgeführt; ''angefordert'' ist ein Prozesswert ohne Normbezug. EBM 01871 ist
    kein Statuskonzept, sondern die Abrechnungsziffer der LDCT (gehört zu ldctExamination). Der Verweis
    auf die Vorstudie wird getrennt als Reference (ImagingStudy/DiagnosticReport) geführt; für diesen
    Teil passen LOINC 18834-2 Radiology Comparison study (narrative) und 18779-9 Radiology Comparison
    study - date and time. MII TermServ, SNOMED CT International 20260701 und LOINC 2.83, Stand 2026-10-15.
    Rollen der Codes: local-no-standard-binding|vorliegend = wert; local-no-standard-binding|nicht-zutreffend
    = wert; snomed-ct|385432009 = wert; local-no-standard-binding|angefordert = wert; snomed-ct|385644000
    = wert; local-no-standard-binding|verzicht-nicht-moeglich = wert; local-no-standard-binding|verzicht-unverhaeltnismaessig
    = wert.'
  codings:
  - system: local-no-standard-binding
    code: vorliegend
    display: Voraufnahmen und Vorbefunde liegen vor
  - system: local-no-standard-binding
    code: nicht-zutreffend
    display: Nicht zutreffend (Erstuntersuchung)
  - system: snomed-ct
    code: '385432009'
    display: Not applicable
  - system: local-no-standard-binding
    code: angefordert
    display: Angefordert
  - system: snomed-ct
    code: '385644000'
    display: Requested
  - system: local-no-standard-binding
    code: verzicht-nicht-moeglich
    display: 'Verzicht: Beschaffung nicht möglich'
  - system: local-no-standard-binding
    code: verzicht-unverhaeltnismaessig
    display: 'Verzicht: unverhältnismäßiger Aufwand'
standard_mappings:
- standard: fhir-mii-kds
  profile_or_url: https://www.medizininformatik-initiative.de/fhir/ext/modul-bildgebung/StructureDefinition/mii-pr-bildgebung-bildgebungsstudie
  resource: ImagingStudy
  path: ImagingStudy (Referenzziel der Voraufnahme); ImagingStudy.started
  notes: de.medizininformatikinitiative.kerndatensatz.bildgebung#2026.0.0, stabil. Nur Referenzziel des
    getrennt geführten Verweises auf die Vorstudie (started 0..1 MS), kein Mapping des Statuswerts.
- standard: fhir-mii-kds
  profile_or_url: https://www.medizininformatik-initiative.de/fhir/ext/modul-bildgebung/StructureDefinition/mii-pr-bildgebung-radiologischer-befund
  resource: DiagnosticReport
  path: DiagnosticReport (Referenzziel des Vorbefunds); DiagnosticReport.imagingStudy
  notes: de.medizininformatikinitiative.kerndatensatz.bildgebung#2026.0.0, stabil. Nur Referenzziel für
    die Vorbefunde der letzten (zwei) Früherkennungsuntersuchungen (LuKrFrühErkV § 4 Abs. 2 S. 1); imagingStudy
    1..* MS. Ein Element für den Vergleich mit Voraufnahmen oder den Status hat das Profil nicht.
- standard: other
  profile_or_url: http://hl7.eu/fhir/imaging/StructureDefinition/CompositionEuImaging
  resource: Composition
  path: Composition.section:comparison (code LOINC 18834-2); Composition.section:comparison.entry:comparedstudy
    → ImagingStudyEuImaging/ImagingSelectionEuImaging; Composition.section:comparison.emptyReason; Composition.section:comparison.text
  notes: 'hl7.fhir.eu.imaging#1.0.0-ballot (status draft), Ballot. Einziges gefundenes FHIR-Profil mit
    einer eigenen Vergleichssektion (0..1), die auf die Vorstudie verweist. section:comparison.emptyReason
    ist PREFERRED an SectionEmptyReasonEuImaging gebunden (CodeSystem list-empty-reason plus LOINC LA4720-4
    Not applicable): ''nicht zutreffend (Erstuntersuchung)'' = LA4720-4, ''Verzicht: nicht möglich'' annähernd
    = list-empty-reason#unavailable. ''angefordert'' und ''Verzicht: unverhältnismäßiger Aufwand'' bleiben
    lokal (section.text).'
- standard: dicom-sr
  profile_or_url: https://dicom.nema.org/medical/dicom/current/output/chtml/part16/sect_CID_7001.html
  resource: DICOM SR TID 2000 Basic Diagnostic Imaging Report, Überschriften aus CID 7001
  path: CONTAINER (LN 55114-3 'Prior Procedure Descriptions'); CONTAINER (LN 18834-2 'Previous Findings')
  notes: DICOM PS3.16 (current, abgerufen 2026-10-15), nicht-FHIR, breites Mapping. Voruntersuchung und
    Vorbefund lassen sich im strukturierten Befund als eigene Abschnitte führen (18834-2 ist derselbe
    Code wie in der EU-Imaging-Sektion comparison); ein Statuscode für Vorliegen oder Verzicht fehlt.
- standard: openehr-archetype
  profile_or_url: https://ckm.openehr.org/ckm/archetypes/1013.1.1494
  resource: openEHR-EHR-OBSERVATION.imaging_exam_result.v1
  path: at0093 'Comparison study details'; at0056 'Comparison findings'; at0067 'Comparison series details'
  notes: 'openEHR CKM 1013.1.1494, published, nicht-FHIR, breites Mapping. at0093: ''Details about images
    from a prior study used for comparison to the reported study''. Betrifft Verweis und Vergleichsaussage,
    nicht Status oder Verzicht.'
- standard: other
  profile_or_url: https://www.acr.org/-/media/ACR/Files/RADS/Lung-RADS/Lung-RADS-2022.pdf
  resource: ACR Lung-RADS v2022, Kategorie 0 / Note 9
  path: 'Category 0: ''Prior chest CT examination being located for comparison''; Note 9'
  notes: 'ACR Lung-RADS v2022 (PDF, abgerufen 2026-10-15), nicht-FHIR, nur Querbezug. Der Wert ''angefordert''
    entspricht der temporären Lung-RADS-Kategorie 0 (''the Lung-RADS 0 category is temporary until the
    comparison study is available''); die Kategorie selbst gehört zur Befundung. Übersichtsseite: https://www.acr.org/Clinical-Resources/Clinical-Tools-and-Reference/Reporting-and-Data-Systems/Lung-RADS
    (die frühere URL …/Reporting-and-Data-Systems/Lung-Rads liefert HTTP 404).'
