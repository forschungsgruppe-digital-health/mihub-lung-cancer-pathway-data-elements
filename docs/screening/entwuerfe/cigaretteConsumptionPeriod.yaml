id: mihub.lung.screening.cigaretteConsumptionPeriod.v0.1
uuid: 51b95edf-a63b-5a49-97b3-de941082641b
name: cigaretteConsumptionPeriod
label_de: Konsumabschnitt Zigarettenrauchen
definition_de: Zeitraum (Beginn, Ende, mind. Jahr) mit annähernd gleichem Zigarettenkonsum; Abschnitte
  bilden die Raucheranamnese, erster Beginn = Rauchbeginn.
phase: screening
category: sozialanamnese
datatype: Period
cardinality: 1..*
value_set:
  binding_strength: example
  standard_binding_status: pending-mapping
  notes: 'MII TermServ, SNOMED CT 20260701; Stand 2026-10-15. Kein Standardkonzept beschreibt eine Konsumepisode
    bzw. einen Abschnitt gleichbleibenden Zigarettenkonsums. 230056004 ''Cigarette consumption'' (Observable)
    dient nur als gemeinsamer Trägercode (Observation.code) einer Observation je Abschnitt zusammen mit
    cigarettesPerDayInPeriod: der Abschnitt steckt in effectivePeriod, die Menge in valueQuantity. 228488005
    ''Age at starting smoking'' und 266929003 ''Smoking started'' entfallen, weil der Rauchbeginn aus
    dem Start des ersten Abschnitts abgeleitet wird. Das openEHR-Episodenmodell wird als Mapping, nicht
    als Coding geführt. Rollen der Codes: snomed-ct|230056004 = element.'
  codings:
  - system: snomed-ct
    code: '230056004'
    display: Cigarette consumption
standard_mappings:
- standard: fhir-isik
  profile_or_url: https://gematik.de/fhir/isik/StructureDefinition/ISiKLebensZustand
  resource: Observation
  path: Observation.effectivePeriod
  notes: de.gematik.isik#6.0.0, stabil; nur Ableitungsbasis für ein eigenes Profil, kein fertiges Ziel
    (in 6.0.0 abstract=true, in de.gematik.isik-basismodul#4.0.3 nicht abstrakt). Eine Observation je
    Abschnitt mit effectivePeriod (effective[x] 1..1, dateTime|Period) und valueQuantity Zigaretten pro
    Tag (value[x] 1..1, also Pflicht). code.coding:loinc ist Pflicht (min 1); SNOMED 230056004 allein
    ist nicht konform, und LOINC 63640-7 ist als Nominalskala mit Fagerström-Antwortliste LL1447-3 dafür
    ungeeignet. Abschnitte werden über hasMember oder derivedFrom mit der Packungsjahr-Observation verknüpft.
- standard: fhir-r4-base
  profile_or_url: http://hl7.org/fhir/StructureDefinition/Observation
  resource: Observation
  path: Observation.effectivePeriod
  notes: hl7.fhir.r4.core#4.0.1, stabil; generischer Fallback ohne LOINC-Pflicht. effectivePeriod = Abschnitt,
    valueQuantity = Zigaretten pro Tag, code = 230056004; eine Observation je Abschnitt.
- standard: openehr-archetype
  profile_or_url: https://raw.githubusercontent.com/openEHR/CKM-mirror/master/local/archetypes/entry/evaluation/openEHR-EHR-EVALUATION.tobacco_smoking_summary.v2.adl
  resource: openEHR-EHR-EVALUATION.tobacco_smoking_summary.v2
  path: /data[at0001]/items[at0029]/items[at0064] (Per episode; Beginn /items[at0013] Episode start date,
    Ende /items[at0082] Episode end date)
  notes: 'openEHR CKM, Revision 2.0.1, published, nicht-FHIR. Bestes Strukturvorbild: Per episode 0..*
    innerhalb von Per type (Type at0054 Cigarettes) mit Start- und Enddatum und typischem Konsum (at0023).
    Regular smoking commenced (at0015) und Daily smoking commenced (at0080) gelten global, nicht je Typ
    Cigarettes. Selbstgedrehte Zigaretten haben einen eigenen Typ (at0055).'
