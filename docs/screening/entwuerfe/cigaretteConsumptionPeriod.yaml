issues:
- 'Verbindlichkeit nach Gegenprüfung: mittelbar. Rechengrundlage nach LuKrFrühErkV § 1 Abs. 2 S. 2–4 und
  § 2 Abs. 1 S. 1 Nr. 3 Buchst. a Doppelbuchst. aa (Dauer); Erhebungspflicht KFE-RL § 39 Nr. 1. Die Abschnittsstruktur
  ist eine Modellentscheidung; ohne vollständige Unterbrechung genügt ein Abschnitt.'
- 'Umsetzung: eigenständig (Kopf-Element der Raucheranamnese Q3). Kopf-Element „Konsumabschnitt“ (Period
  1..*, Beginn und Ende mindestens jahrgenau) mit hasPart cigarettesPerDayInPeriod; als eine FHIR Observation
  abbilden (code 230056004, effectivePeriod = Abschnitt, valueQuantity = Zigaretten pro Tag). openEHR
  tobacco_smoking_summary.v2 als standard_mapping (Pfad /data[at0001]/items[at0029]/items[at0064]), nicht
  als Coding. 228488005 streichen (Rauchbeginn ableitbar). constraints_de: nur Zigaretten (TrG zu § 39
  Nr. 1), Abschnitte überlappungsfrei. Quellen ergänzen: § 2 Abs. 1 S. 1 Nr. 3 Buchst. a Doppelbuchst.
  aa und KFE-RL § 39 Nr. 1.'
- Weder SNOMED CT 20260701 noch LOINC 2.83 haben ein Konzept für einen Konsumabschnitt; LOINC bietet nur
  Gesamt- oder Aktuellwerte.
- Kein FHIR-Profil (MII, ISiK, IPS, US Core, KBV, gematik ePA) bildet wiederholte Konsumabschnitte mit
  Zeitraum und Intensität ab; ein eigenes Profil, z. B. abgeleitet von ISiKLebensZustand, ist nötig.
- Für ein von ISiKLebensZustand abgeleitetes Profil fehlt ein passender LOINC-Pflichtcode für einen Abschnitt
  mit Mengenangabe.
- Das MII-Kardiologie-Ballot (mii-pr-kardio-observation-rauchen) ist ungeeignet, weil jede Abschnitts-Observation
  einen Pflicht-Raucherstatus tragen müsste und seine Komponenten keinen eigenen Zeitraum haben.
- Ob Konsumabschnitte oder ein Lebenszeit-Jahresdurchschnitt erfasst werden (Entscheidung E1), ist offen.
- Ob selbstgedrehte Zigaretten als Zigaretten im Sinne der LuKrFrühErkV zählen, ist offen.
