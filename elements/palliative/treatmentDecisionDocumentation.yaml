name: treatmentDecisionDocumentation
label_de: Dokumentation der Entscheidungen und Maßnahmen zur Behandlung
definition_de: Dokumentiertes Ergebnis der (partizipativen) Entscheidungsfindung zur palliativen Behandlung
  — Therapieziel bzw. Therapiezieländerung sowie Beginn, Fortsetzung, Begrenzung oder Beendigung tumorspezifischer
  und weiterer medizinischer (inkl. lebenserhaltender) Maßnahmen, vereinbarte Maßnahmen — nachvollziehbar
  für alle Mitbehandelnden.
phase: palliative
tumor_entity:
- NSCLC
- SCLC
category: dokument
datatype: Reference
cardinality: 0..*
