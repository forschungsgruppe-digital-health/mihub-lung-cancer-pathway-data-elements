id: mihub.lung.palliative.treatmentDecisionDocumentation.v0.1
uuid: 111800b7-bd62-5e00-a7dc-8247b4c77908
name: treatmentDecisionDocumentation
label_de: Dokumentation der Entscheidungen und Maßnahmen zur Behandlung
definition_de: Dokumentiertes Ergebnis der (partizipativen) Entscheidungsfindung zur palliativen Behandlung
  — Therapieziel bzw. Therapiezieländerung sowie Beginn, Fortsetzung, Begrenzung oder Beendigung tumorspezifischer
  und weiterer medizinischer (inkl. lebenserhaltender) Maßnahmen, vereinbarte Maßnahmen — nachvollziehbar
  für alle Mitbehandelnden.
phase: palliative
tumor_entity:
- NSCLC
- SCLC
category: dokument
datatype: Reference
cardinality: 0..*
value_set:
  binding_strength: extensible
  standard_binding_status: mapped
  codings:
  - system: kdl
    code: VL040309
    display: Behandlungsplan
  - system: loinc
    code: 18776-5
    display: Plan of Care Note
  - system: snomed-ct
    code: '734163000'
    display: Care plan
standard_mappings:
- standard: fhir-r4-base
  resource: CarePlan / DocumentReference
  path: CarePlan.activity / DocumentReference.type
- standard: gematik-epa-fhir
  profile_or_url: https://gematik.de/fhir/epa-mhd/StructureDefinition/epa-mhd-document-reference
  resource: DocumentReference
  path: DocumentReference.type; DocumentReference.category
  notes: 'ePA MHD Service 1.1.3 (ePA 3.1.3), Profil EPAMHDDocumentReference auf Basis von IHE MHD Minimal
    DocumentReference. type 1..1 und category 1..1. coding ist REQUIRED gebunden an https://gematik.de/fhir/terminology/ValueSet/epa-xds-type-code-vs
    (IHE-D typeCode, OID 1.3.6.1.4.1.19376.3.276.1.5.9) bzw. https://gematik.de/fhir/terminology/ValueSet/epa-xds-class-code-vs
    (IHE-D classCode, OID 1.3.6.1.4.1.19376.3.276.1.5.8); außer IHE-D ist nur LOINC 57016-8 zugelassen.
    KDL-, LOINC- und SNOMED-Codes des Elements sind dort unzulässig und müssen auf IHE-D-Codes abgebildet
    werden. Der Service definiert nur Suche und Abruf (Document Consumer/Responder: search-type, read).'
- standard: fhir-mii-kds
  profile_or_url: https://www.medizininformatik-initiative.de/fhir/ext/modul-dokument/StructureDefinition/mii-pr-dokument-dokument
  resource: DocumentReference
  path: DocumentReference.type.coding (Slices KDL/LNC/SCT/XDS); DocumentReference.category.coding (Slice
    XDS)
  notes: 'MII KDS Dokument 2026.0.1 (stabil). type.coding ist nach system gesliced (KDL/LNC/SCT/XDS, je
    0..1, jeweils REQUIRED gebunden). KDL (http://dvmd.de/fhir/ValueSet/kdl): VL040309 Behandlungsplan.
    LNC an http://hl7.org/fhir/ValueSet/c80-doc-typecodes: 18776-5 fehlt in der R4-Fassung 4.0.1, enthalten
    sind 56447-6 Plan of care note und 74156-1 Oncology treatment plan and summary Document. SCT an https://www.medizininformatik-initiative.de/fhir/ext/modul-dokument/ValueSet/mii-vs-dokument-sct-dokument-typ
    (Nachfahren von 229059009 |Report|): Für den Element-Code 734163000 Care plan (record artifact), Parent
    184216000 Patient record type, ist die Zugehörigkeit nicht belegt (siehe Issue). Dazu type.coding:XDS
    (IHE-D typeCode) und category.coding:XDS (IHE-D classCode, z. B. PLA Planungsdokument). Strukturierte
    Therapieziele und Maßnahmen laufen weiter über CarePlan (fhir-r4-base-Eintrag).'
care_process:
  trigger: bei jeder Therapieentscheidung / Therapiezieländerung in der Palliativversorgung
  frequency_pattern: ad-hoc (je Therapieentscheidung/Therapiezieländerung) + regelmäßige Re-Evaluation;
    in der Sterbephase kontinuierlich
  responsible_role: Lead-Clinician / Palliativ-Team
