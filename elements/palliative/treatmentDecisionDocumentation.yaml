issues:
- 'Dokumenttyp-Codes für treatmentDecisionDocumentation festlegen. MII Dokument nimmt im LOINC-Slice nur
  Codes aus c80-doc-typecodes an. 18776-5 steht in R4 4.0.1 nicht darin; Kandidaten sind 56447-6 Plan
  of care note oder 74156-1 Oncology treatment plan and summary Document. Im SNOMED-Slice sind nur Nachfahren
  von 229059009 Report zulässig. Für den Element-Code 734163000 Care plan (record artifact), Parent 184216000
  Patient record type, ist das nicht belegt; per $validate-code prüfen, sonst den SNOMED-Code dort weglassen.
  Die ePA (MHD) verlangt IHE-D-Codes in type und category, daher die Abbildung von KDL VL040309 festlegen.
  Kandidaten aus IHE-D: classCode PLA Planungsdokument; typeCode z. B. ONKO Onkologische Dokumente oder
  FPRO Therapiedokumentation (laut IHE-D-Definition für die Durchführung von Therapien, daher nur bedingt
  passend).'
