  resource: DocumentReference (MHD)
care_process:
  trigger: bei jeder Therapieentscheidung / Therapiezieländerung in der Palliativversorgung
  frequency_pattern: ad-hoc (je Therapieentscheidung/Therapiezieländerung) + regelmäßige Re-Evaluation;
    in der Sterbephase kontinuierlich
  responsible_role: Lead-Clinician / Palliativ-Team
