issues:
- 'ACP-Status: Der boolean (1..1) bildet nicht ab, ob ACP nicht angeboten, angeboten und abgelehnt oder
  durchgeführt wurde. Die Leitlinie fordert das Angebot (Empf. 6.11, A) und verlangt, eine Ablehnung zu
  respektieren. Kodierten Status prüfen. Verifizierte Kandidaten (MII TermServ 2026-10-14): SNOMED 713603004
  „Advance care planning (procedure)“, 713615000 „Advance care planning declined (situation)“.'
- 'Mapping fhir-r4-base: „Consent.scope=''advance-directive''“ ist kein gültiger Code der FHIR-ConsentScope-Codes;
  gültig ist ''adr'' (Advanced Care Directive). Zudem wäre der ACP-Prozess (SNOMED 713603004, procedure)
  eher als Procedure abzubilden. Consent (scope=adr) bzw. DocumentReference gehört zum Ergebnisdokument
  (advanceDirectiveDocument).'
- 'Repräsentation von advanceCarePlanning im Mapping auf MII Prozedur klären. Das Element ist boolean
  (ACP durchgeführt ja/nein, 1..1). Im Mapping wird ACP als Procedure mit code.coding:sct 713603004 abgebildet;
  das Profil verlangt status 1..1 und performed[x] 1..1, auch bei status not-done. Festzulegen ist: true
  = Procedure 713603004 mit status completed bzw. in-progress, false = keine Procedure bzw. status not-done?
  Zusammen mit dem Issue „ACP-Status“ entscheiden: 713615000 Advance care planning declined (situation)
  ist kein Nachfahre von 71388002 |Procedure| und im SCT-Slice von MII Prozedur nicht zulässig; eine Ablehnung
  wäre z. B. als status not-done mit statusReason abzubilden.'
related_elements:
