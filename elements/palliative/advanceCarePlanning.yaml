id: mihub.lung.palliative.advanceCarePlanning.v0.1
uuid: 6713f560-7a57-5804-a980-d35b1dcc2e0e
name: advanceCarePlanning
label_de: Vorausschauende Versorgungsplanung (Advance Care Planning)
definition_de: Strukturierter Prozess der vorausschauenden Versorgungsplanung mit Patient:in (und ggf.
  Angehörigen) inkl. Therapieziel-Findung und Dokumentation. Patientenverfügung, Vorsorgevollmacht und
  Behandlungsentscheidungen werden dokumentiert.
phase: palliative
tumor_entity:
- NSCLC
- SCLC
category: versorgungsplanung
datatype: boolean
cardinality: 1..1
value_set:
  binding_strength: preferred
  codings:
  - system: snomed-ct
    code: '713603004'
    display: Advance care planning
standard_mappings:
- standard: fhir-mii-kds
  profile_or_url: https://www.medizininformatik-initiative.de/fhir/core/modul-prozedur/StructureDefinition/Procedure
  resource: Procedure
  path: Procedure.code.coding:sct = SNOMED 713603004; Procedure.status; Procedure.performed[x]
  notes: 'ACP ist ein Prozess (SNOMED 713603004 Advance care planning (procedure)), keine Einwilligung,
    und wird deshalb als Procedure abgebildet. MII KDS Prozedur (Basismodul 2026.0.1): code.coding:sct
    ist REQUIRED an https://www.medizininformatik-initiative.de/fhir/core/modul-prozedur/ValueSet/procedures-sct
    gebunden (Nachfahren von 71388002 |Procedure|); status 1..1, performed[x] 1..1. Vorschlag für das
    Boolean-Element (Entscheidung offen, siehe Issue zur Repräsentation): true = Procedure 713603004 mit
    status completed (laufend: in-progress), false = keine Procedure bzw. status not-done; performed[x]
    bleibt auch bei not-done Pflicht. Die aus dem ACP resultierende Verfügung gehört zum Element advanceDirectiveDocument.'
care_process:
  trigger: Diagnose unheilbar; bei jeder substanziellen Verschlechterung erneut
  frequency_pattern: ongoing
  responsible_role: Lead-Clinician + Palliativ-Team
