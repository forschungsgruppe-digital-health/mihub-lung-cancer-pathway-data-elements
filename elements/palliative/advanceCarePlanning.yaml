label_de: Vorausschauende Versorgungsplanung (Advance Care Planning)
definition_de: Strukturierter Prozess der vorausschauenden Versorgungsplanung mit Patient:in (und ggf.
  Angehörigen) inkl. Therapieziel-Findung und Dokumentation. Patientenverfügung, Vorsorgevollmacht und
  Behandlungsentscheidungen werden dokumentiert.
