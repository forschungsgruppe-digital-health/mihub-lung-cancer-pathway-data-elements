issues:
- Schutzbedürftige Information — restriktive Zugriffsrechte / Consent-Behandlung erforderlich.
- 'Differenzierung des Todeswunsches (Formen nach Abb. 18: Lebenssattheit, Lebensmüdigkeit, distanzierte/latente/akute/perakute
  Suizidalität) und Suizidabklärung nach Empf. 20.5 (EK) sind mit dem boolean nicht abbildbar; ein eigenes
  kodiertes Element ist zu prüfen. Verifizierte SNOMED-Kandidaten (MII TermServ 2026-10-14): 247795009
  „Tedium vitae (finding)“ (Syn. „Tired of life“), 6471006 „Suicidal thoughts (finding)“, 304594002 „Suicidal
  intent (finding)“, 247650009 „Planning suicide (finding)“.'
- 'Zugriffskonzept präzisieren: Restriktive Zugriffsrechte dürfen die Dokumentation geäußerter Todeswünsche
  für das interdisziplinäre Behandlungsteam nicht verhindern; laut S3-LL Palliativmedizin 3.0 (Kap. 20.3,
  Hintergrund) ist diese Dokumentation für die weitere Behandlung von besonderer Bedeutung. Nach derselben
  Stelle besteht das Ärzt:innen- bzw. Seelsorgegeheimnis auch bei Suizidalität, und es zu brechen bedarf
  des Vorliegens einer akuten Lebensgefahr. Die rechtliche Umsetzung im Rechte- und Consent-Konzept ist
  mit Datenschutzbeauftragten und Justiziariat zu klären.'
