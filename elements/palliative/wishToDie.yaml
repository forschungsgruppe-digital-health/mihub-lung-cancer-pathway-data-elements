id: mihub.lung.palliative.wishToDie.v0.1
uuid: 7680930b-1dfb-51d2-a687-842ecb799a21
name: wishToDie
label_de: Todeswunsch
definition_de: Vorliegen eines Todeswunsches der Patient:in (Wunsch nach baldigem Sterben bzw. danach,
  tot zu sein), festgestellt durch aktives Erfragen im Verlauf (S3-LL Palliativmedizin 3.0, Empf. 20.3)
  oder nach spontanen Äußerungen bzw. nonverbalen Hinweisen, die im Gespräch aufgegriffen und konkretisiert
  werden. Todeswünsche reichen von Lebenssattheit und Lebensmüdigkeit über den Wunsch nach Beschleunigung
  des Sterbens bis zur akuten Suizidalität; Form, Ausprägung und Suizidalität bildet dieses Element nicht
  ab (Differenzierung nach Empf. 20.5 als offener Punkt vermerkt).
phase: palliative
tumor_entity:
- NSCLC
- SCLC
category: befund
datatype: boolean
cardinality: 0..1
value_set:
  binding_strength: preferred
  codings:
  - system: snomed-ct
    code: '225876004'
    display: Wanting to die
care_process:
  trigger: Aktiv im Verlauf bei allen Patient:innen mit nicht heilbarer Krebserkrankung erfragen (Empf.
    20.3), zusätzlich anlassbezogen bei Verschlechterung/psychosozialer Belastung; bei geäußertem Todeswunsch
    vertiefte Exploration von Verlauf, Ausprägung, Anlässen sowie Suizidgedanken/-absichten/-plänen (Empf.
    20.5)
  frequency_pattern: ongoing
  responsible_role: Palliativ-Team / Psychoonkologie
