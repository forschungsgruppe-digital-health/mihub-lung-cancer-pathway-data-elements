issues:
- 'frequency_pattern „Q1M in SPV“ ist keine Leitlinienempfehlung und durch die Leitlinienreferenzen des
  Elements (S3-LL Lungenkarzinom 5.1, Empf. 14.8; S3-LL Palliativmedizin 3.0, Tab. 9) nicht gedeckt. Die
  S3-LL Palliativmedizin 3.0 verlangt, Bedürfnisse und Belastungen wiederholt und bei einer Änderung der
  klinischen Situation zu erfassen (Empf. 5.1, EK). Einen monatlichen Rhythmus nennt sie nur im Zusammenhang
  mit der Temel-Studie (metastasiertes NSCLC) in der spezialisierten Palliativambulanz (Kap. 5.4.3.4):
  Vorstellung mindestens monatlich mit Erfassung von Symptomen und Bedürfnissen, regelmäßige Termine „(z.
  B. monatlich)“ plus Termine bei Bedarf; ob die parallele Palliativbehandlung regelmäßig oder nach Bedarf
  erfolgen soll, ist laut Leitlinie bisher ungeklärt. Der GLOSSARY-Eintrag „Q1M in SPV“ (Caregiver-Burden-Verlauf,
  Quelle S3-LL Palliativ v3.0 Kap. 7.4) ist durch Kap. 7.4.1 nicht gedeckt; dort steht für Angehörige
  „bei Aufnahme, wöchentlich sowie bei Veränderungen“. Zu entscheiden: Q1M als Expert:innen-Festlegung
  (DE-065) kennzeichnen, ggf. mit Verweis auf Kap. 5.4.3.4, oder auf per-encounter und Erhebung bei Änderung
  der klinischen Situation reduzieren.'
- 'datatype integer und Mapping Observation.valueInteger korrigieren: EORTC-Skalenwerte werden linear
  auf 0–100 transformiert (EORTC QLQ-C30 Scoring Manual, 3rd ed. 2001; globaler Gesundheitsstatus/Lebensqualität:
  S = (RS − 1)/range × 100 mit range 6) und sind daher meist nicht ganzzahlig (z. B. 16,67 oder 66,67).
  Das MII-KDS-Modul PROs (2026.7.0) führt EORTC-Scores als valueQuantity mit ''{score}'' und zwei Dezimalstellen.
  Optionen: datatype decimal mit Mapping Observation.valueQuantity ''{score}'' (FHIR R4 Observation.value[x]
  kennt kein decimal) oder eine ausdrückliche Rundungsregel; dasselbe für qolEortcQlqC30 prüfen. Offen
  (UNSICHER): ob der QLQ-C15-PAL einen „Gesamtwert“ vorsieht, wie definition_de nahelegt; das Scoring-Manual
  des C15-PAL liegt nicht vor.'
