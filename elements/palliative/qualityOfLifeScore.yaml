id: mihub.lung.palliative.qualityOfLifeScore.v0.1
uuid: 5187a52f-e2ad-5123-9ce2-04c518ecfe57
name: qualityOfLifeScore
label_de: Lebensqualität (Selbsteinschätzung) in der Palliativversorgung
definition_de: Patientenberichtete gesundheitsbezogene Lebensqualität in der Palliativversorgung, erhoben
  mit einem validierten Instrument (z. B. EORTC QLQ-C15-PAL als palliative Kurzform des QLQ-C30); Gesamtwert
  bzw. globale Skala.
phase: palliative
tumor_entity:
- NSCLC
- SCLC
category: prom
datatype: integer
cardinality: 0..*
unit: '{score}'
value_set:
  binding_strength: extensible
  standard_binding_status: mapped
  notes: 'EORTC QLQ-C15-PAL und QLQ-C30 sind in LOINC 2.83 nicht enthalten (MII TermServ, Suche „QLQ“:
    0 Treffer, Stand 2026-10-14). SNOMED CT 709503007 „Assessment of quality of life“ (Prozedur, Elternkonzept
    386053000 „Evaluation procedure“) ist der instrumentenoffene Element-Code. 273446001 „European Organisation
    for Research and Treatment of Cancer - Quality of Life questionnaire“ (Elternkonzept 273249006 „Assessment
    scales“) bezeichnet das Instrument, nicht den Score; es ist nur zusammen mit einem score-spezifischen
    Code bzw. als Instrumentenangabe zu verwenden, nicht als gleichwertiger Element-Code. Der Score-Katalog
    des MII-KDS-Moduls PROs (2026.7.0) enthält eortc-qlq-c30-ql (globaler Gesundheitsstatus/Lebensqualität),
    aber keinen Code für den QLQ-C15-PAL.'
  codings:
  - system: snomed-ct
    code: '709503007'
    display: Assessment of quality of life
  - system: snomed-ct
    code: '273446001'
    display: European Organisation for Research and Treatment of Cancer - Quality of Life questionnaire
standard_mappings:
- standard: fhir-r4-base
  resource: Observation / QuestionnaireResponse
  path: Observation.valueInteger
care_process:
  trigger: Aufnahme in die Palliativversorgung und im Verlauf (bei Phasenwechsel)
  frequency_pattern: per-encounter / Q1M in SPV
  responsible_role: Palliativ-Team / Patient:in (Selbsteinschätzung)
  data_flows:
