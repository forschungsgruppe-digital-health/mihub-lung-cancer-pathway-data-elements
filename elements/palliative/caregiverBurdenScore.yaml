issues:
- 'CAREPAL-Risikogruppe modellieren: Laut S3-LL Palliativmedizin 3.0 (Kap. 7.4.2) ordnet CAREPAL Angehörige
  vier Risikogruppen zu (aktuell stabil / psychisch belastet / unerfüllte Unterstützungsbedürfnisse /
  komplexe Unterstützungsbedarfe). Daraus folgen konkrete Versorgungsaufgaben: psychoonkologische Betreuung
  bzw. Beratung und praktische Unterstützung. Dieses kategoriale Ergebnis ist im Katalog nicht abbildbar
  (caregiverBurden = Instrument, caregiverBurdenScore = Integer) → eigenes Element oder kodierte Wertemenge
  ergänzen.'
