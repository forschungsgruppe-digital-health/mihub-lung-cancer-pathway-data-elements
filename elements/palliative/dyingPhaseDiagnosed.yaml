definition_de: Klinische Feststellung, dass die Sterbephase begonnen hat (letzte drei bis sieben Lebenstage;
  Tod innerhalb der nächsten Tage wahrscheinlich), nach Ausschluss akut reversibler Ursachen, inkl. Datum/Zeitpunkt
  der Feststellung.
