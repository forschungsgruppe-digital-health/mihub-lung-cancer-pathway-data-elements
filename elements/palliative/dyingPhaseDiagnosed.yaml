  trigger: klinisches Sterbephasen-Assessment
  frequency_pattern: Re-Evaluation der Feststellung spätestens nach 72 h im multiprofessionellen Team
    (S3-LL Palliativmedizin 3.0, Kap. 21.2)
  responsible_role: Ärzt:in und Pflegefachperson unter Einbeziehung des multiprofessionellen Teams (Palliativ-Team
    / Lead-Clinician); Dokumentation durch die verantwortliche Fachperson
