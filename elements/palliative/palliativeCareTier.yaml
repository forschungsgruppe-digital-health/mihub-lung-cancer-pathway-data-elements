issues:
- ICD-10-GM Z51.5 'Palliativbehandlung' (Z51 'Sonstige medizinische Behandlung', Gruppe Z40–Z54) ist ein
  stufenunabhängiger Behandlungsanlass-Code und weder das Elementkonzept 'Versorgungsstufe' noch einer
  der Werte PBP/APV/SPV (S3-LL Palliativmedizin 3.0, Kap. 5.4); als value_set.coding erscheint er im generierten
  Logical Model neben den drei Stufenwerten. Der Code wurde in v0.1.4 bewusst ergänzt (audit-log §7),
  ebenso auf dyingPhaseDiagnosed. Zusammen mit der KDL-Frage (SD110105) katalogweit entscheiden, wohin
  solche Kontext-Codings bei code- und boolean-Elementen gehören (entfernen, in notes oder in ein eigenes
  Feld).
- 'KDL SD110105 (Dokumentklasse ''Palliativmedizinische Komplexbehandlungsdokumentation'') ist kein Stufenwert
  (datatype code 1..1: PBP/APV/SPV), steht aber als valueSet.coding im Wertebereich. Katalogweite Entscheidung
  zur Rolle der KDL-Codings bei code-Elementen nötig (siehe complexityLevel).'
related_elements:
- relation: dependsOn
  target: mihub.lung.palliative.complexityLevel.v0.1
