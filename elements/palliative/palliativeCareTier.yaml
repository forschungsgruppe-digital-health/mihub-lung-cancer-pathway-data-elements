id: mihub.lung.palliative.palliativeCareTier.v0.1
uuid: 4463b28d-e3dd-529e-ad16-2ee0d75cae22
name: palliativeCareTier
label_de: Stufe der Palliativversorgung
definition_de: 'Indikationsbasierte Stufe der Palliativversorgung: Palliativmedizinische Basisversorgung
  durch Primärbehandelnde (PBP), Allgemeine Palliativversorgung (APV) oder Spezialisierte Palliativversorgung
  (SPV).'
phase: palliative
tumor_entity:
- NSCLC
- SCLC
category: versorgungskontext
datatype: code
cardinality: 1..1
value_set:
  binding_strength: example
  standard_binding_status: no-standard-found
  notes: 'Versorgungsstufen-Konzept der deutschen S3-LL Palliativmedizin (PBP / APV / SPV). SNOMED CT
    International hat keine deckungsgleichen Codes; die DACH-spezifische Strukturierung der Palliativversorgung
    ist nicht international standardisiert. Mögliche Standardisierungspfade: SNOMED-CT-DE-Edition (BfArM),
    nationaler Refset, oder Aufnahme in Onkopedia-/AWMF-Strukturierung als kontrolliertes Vokabular.'
  codings:
  - system: local-no-standard-binding
    code: PBP
    display: Palliativmed. Basisversorgung
  - system: local-no-standard-binding
    code: APV
    display: Allgemeine Palliativversorgung
  - system: local-no-standard-binding
    code: SPV
    display: Spezialisierte Palliativversorgung
  - system: kdl
    code: SD110105
    display: Palliativmedizinische Komplexbehandlungsdokumentation
  - system: icd-10-gm
    code: Z51.5
    display: Palliativbehandlung
instruction_de: 'Zuordnung nach Komplexität (S3-LL Palliativmedizin 3.0, Empf. 5.3; Indikation spezialisierter
  Angebote anhand von Komplexität und Aufwand der Versorgung, Kap. 5.4): niedrig → PBP (Empf. 5.5), mittel
  → APV (Empf. 5.6), hoch → SPV (Empf. 5.7, Grad A). Indikation regelmäßig re-evaluieren; spezialisierte
  Angebote können auch nur vorübergehend erforderlich sein.'
care_process:
  trigger: nach Komplexitätsbewertung
  frequency_pattern: ad-hoc / re-evaluierbar
  responsible_role: Primärbehandelnde (Onkolog:in, Hausärzt:in; Indikationsstellung und Einbeziehung von
    APV/SPV) bzw. Palliativ-Team / MDT
evidence:
  guideline_references:
  - source: S3-LL Palliativmedizin
    version: 3.0 (Juli 2026, AWMF 128-001OL)
    url: https://www.leitlinienprogramm-onkologie.de/leitlinien/palliativmedizin
    section: 'Kap. 5.3, Empf. 5.3 (neu 2026: Indikation der Versorgungsstufe regelmäßig stellen); Kap.
      5.4 Einleitung (Kategorisierung PBP/APV/SPV); Kap. 5.4.1, Empf. 5.5 (neu 2026: PBP bei niedriger
      Komplexität); Kap. 5.4.2, Empf. 5.6 (modifiziert 2026: APV bei mittlerer Komplexität)'
    recommendation_grade: EK
    evidence_level: n/a
    quote: In der Versorgungspraxis werden Angebote in Palliativmedizinische Basisversorgung durch die
      Primärbehandelnden (PBP), Allgemeine Palliativversorgung (APV) und Spezialisierte Palliativversorgung
      (SPV) kategorisiert.
    accessed: '2026-10-15'
    locator: Kap. 5.3, Empf. 5.3 (S. 55); Kap. 5.4 Einleitung (S. 57); Empf. 5.5 (S. 58); Empf. 5.6 (S.
      59)
  - source: S3-LL Palliativmedizin
    version: 3.0 (Juli 2026, AWMF 128-001OL)
    url: https://www.leitlinienprogramm-onkologie.de/leitlinien/palliativmedizin
    section: 'Kap. 5.4.3, Empf. 5.7 (geprüft 2026): SPV bei hoher Komplexität'
    recommendation_grade: A
    evidence_level: '3'
    quote: Patient:innen mit einer nicht-heilbaren Krebserkrankung und einer hohen Komplexität ihrer Situation
      sollen eine spezialisierte Palliativversorgung erhalten.
    accessed: '2026-10-15'
    locator: Kap. 5.4.3, Empf. 5.7 (S. 60)
