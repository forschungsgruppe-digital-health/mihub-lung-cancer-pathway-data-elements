issues:
- 'Mischschmerz (mixed, siehe definition_de) ist unter dem required-Binding mit 247398009 „Neuropathic
  pain“ und 735644008 „Chronic nociceptive pain“ nicht abbildbar, auch nicht über einen lokalen Code.
  Ein SNOMED-CT-Konzept fehlt auf dem MII TermServ (Suche „mixed pain“ nur fachfremde Treffer, Stand 2026-10-14).
  Klinisch relevant, da Tumorschmerzen durch eine Mischung nozizeptiver und neuropathischer Mechanismen
  entstehen (S3-LL Palliativmedizin 3.0, Kap. 10.10, Hintergrund). Optionen: (a) binding_strength extensible
  mit lokalem Code „mixed“; (b) beide Codes gleichzeitig angeben, nur mit ausdrücklicher Regel in instruction_de
  und Bezug auf denselben Schmerz (z. B. Lokalisation), da sonst nicht von zwei getrennten Schmerzen unterscheidbar;
  zudem trägt 735644008 die Chronizität mit; (c) SNOMED-CT-Antrag.'
