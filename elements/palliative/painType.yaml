  notes: 'SNOMED CT 735644008 „Chronic nociceptive pain“ impliziert einen chronischen Verlauf (normalForm:
    Clinical course = Chronic). Ein allgemeines Konzept für nozizeptiven Schmerz existiert auf dem MII
    TermServ nicht ($expand „nociceptive pain“: nur 735644008 und 789494008; Stand 2026-10-14). Für Mischschmerz
    gibt es kein Konzept (siehe issues).'
