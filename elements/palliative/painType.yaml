evidence:
  guideline_references:
  - source: S3-LL Palliativmedizin
    version: 3.0 (Juli 2026, AWMF 128-001OL)
    url: https://www.leitlinienprogramm-onkologie.de/leitlinien/palliativmedizin
    section: Kap. 10.2 Schmerzerfassung, Hintergrundtext „Schmerzdiagnostik“/„Klinische Untersuchung“
      — Basisdiagnostik inkl. Schmerztyp (nozizeptiv, neuropathisch); Differenzierung über Plus-/Minuszeichen
    recommendation_grade: n/a
    evidence_level: n/a
    quote: Die Basisdiagnostik dient zur Erfassung der Ausbreitung und Dynamik der Schmerzen, der Schmerzursache
      … des Schmerztyps (nozizeptiv, neuropathisch) und der Schmerzintensität. … Zur Differenzierung zwischen
      nozizeptiven und neuropathischen Schmerzen sollte nach Pluszeichen
    accessed: '2026-10-15'
    locator: Kap. 10.2, Hintergrund „Schmerzdiagnostik“ und „Klinische Untersuchung“ (S. 186)
  - source: S3-LL Palliativmedizin
    version: 3.0 (Juli 2026, AWMF 128-001OL)
    url: https://www.leitlinienprogramm-onkologie.de/leitlinien/palliativmedizin
    section: 'Kap. 10.10 Adjuvanzien bei neuropathischen Schmerzen, Empf. 10.37 (geprüft 2026, Starker
      Konsens) — bei neuropathischen Tumorschmerzen, die nur teilweise auf Opioid-Analgetika ansprechen,
      Amitriptylin, Gabapentin oder Pregabalin in Betracht ziehen (therapeutische Konsequenz des Schmerztyps;
      Grad und Evidenzlevel gelten für die Therapieempfehlung, nicht für die Erhebung des Schmerztyps);
      Hintergrund: Tumorschmerz als Mischung nozizeptiver und neuropathischer Mechanismen'
    recommendation_grade: A
    evidence_level: 1+
    quote: Bei Patient:innen mit neuropathischen Tumorschmerzen, die nur teilweise auf … Opioid-Analgetika
      ansprechen, soll Amitriptylin, Gabapentin oder Pregabalin in Be- … Tumorschmerzen werden durch eine
      Mischung aus nozizeptiven und neuropathischen Mechanismen generiert.
    accessed: '2026-10-15'
    locator: Kap. 10.10, Empf. 10.37 (S. 216) und Hintergrund
  - source: S3-LL Lungenkarzinom
    version: 5.1 (Juli 2026, AWMF 020-007OL)
    url: https://www.leitlinienprogramm-onkologie.de/leitlinien/lungenkarzinom
    section: Kap. 14.3.1 Definition / 14.3.2 Schmerzerfassung (Hintergrundtext) — Unterscheidung Nozizeptor-
      vs. neuropathische Schmerzen; Basisdiagnostik inkl. Schmerztyp (nozizeptiv, neuropathisch)
    recommendation_grade: n/a
    evidence_level: n/a
    quote: Zu unterscheiden sind Nozizeptorschmerzen, die durch die direkte Reizung von Schmerzrezeptoren
      ausgelöst werden, und neuropathische Schmerzen, welche durch Irritation und Kompression peripherer
      Nerven entstehen. … des Schmerztyps (nozizeptiv, neuropathisch)
    accessed: '2026-10-15'
    locator: Kap. 14.3.1 Definition und 14.3.2 Schmerzerfassung (S. 481)
