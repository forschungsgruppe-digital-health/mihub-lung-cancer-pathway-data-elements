name: caregiverBurden
label_de: Belastungserfassung Angehörige (Instrument)
definition_de: 'Erfassung der subjektiven Belastungen und Unterstützungsbedürfnisse von Angehörigen mit
  einem validierten Instrument; kodiert wird das verwendete Instrument: multidimensionaler CAREPAL-Fragebogen
  (8-Item-Version für die spezialisierte, 10-Item-Version für die allgemeine Palliativversorgung, 11-Item-Version
  für die Sterbephase), Zarit Burden Interview (deutsche Version G-ZBI; Kurzformen ZBI-1/ZBI-7) oder Häusliche
  Pflegeskala (HPS) der DEGAM (Kurzform HPS-k). Die Kurzformen ZBI-1/ZBI-7 und HPS-k sind laut S3-LL Palliativmedizin
  3.0 (Kap. 7.4.2) unidimensional. Der Zahlenwert wird in caregiverBurdenScore erfasst.'
phase: palliative
tumor_entity:
- NSCLC
- SCLC
category: assessment
datatype: CodeableConcept
cardinality: 0..*
value_set:
  binding_strength: example
  standard_binding_status: no-standard-found
  notes: Kein LOINC-/SNOMED-CT-Konzept für CAREPAL, das Zarit Burden Interview (G-ZBI, ZBI-1/-7) oder
    die Häusliche Pflegeskala (HPS/HPS-k) auf dem MII TermServ (LOINC 2.83, SNOMED CT 20260701; $expand-Suche
    2026-10-14); alle Instrument-Codes sind projekt-lokale Platzhalter. Der frühere Code LOINC 62133-0
    existiert in LOINC 2.83 nicht.
  codings:
  - system: local-no-standard-binding
    code: CAREPAL
    display: Multidimensionaler CAREPAL-Fragebogen
  - system: local-no-standard-binding
    code: HPS-DEGAM
    display: Häusliche Pflegeskala (HPS)
  - system: local-no-standard-binding
    code: ZBI
    display: Zarit Burden Interview (dt. Version G-ZBI; Kurzformen ZBI-1/ZBI-7)
care_process:
  trigger: bei Aufnahme sowie proaktiv und wiederholt im Verlauf, insbesondere bei Veränderungen der Situation
  frequency_pattern: weekly (Beispiel der S3-LL Palliativmedizin 3.0, Kap. 7.4.1; evidenzbasierte Zeitpunkte
    fehlen)
  responsible_role: Palliativ-Team / Sozialdienst
evidence:
  guideline_references:
  - source: S3-LL Palliativmedizin
    version: 3.0 (Juli 2026, AWMF 128-001OL)
    url: https://www.leitlinienprogramm-onkologie.de/leitlinien/palliativmedizin
    section: 'Kap. 7.4.2 Standardisierte Instrumente der Bedarfserfassung, Empf. 7.6 (Belastungen/Bedürfnisse
      proaktiv und wiederholt ermitteln) und Empf. 7.7 (validierte multidimensionale Erfassungsinstrumente);
      Instrumente: Tab. 6 (Kap. 5.3), Zeile 2 „Belastungen der Angehörigen“'
    recommendation_grade: EK
    evidence_level: n/a
    quote: Multidimensionaler CAREPAL-Fragebogen [40], … Zarit Burden Interviews (G-ZBI) [41], Häusliche
      Pflegeskala (HPS) der DEGAM … Die subjektiven Belastungen und Unterstützungsbedürfnisse von Angehörigen
      … sollten mit Hilfe von validierten multidimensionalen Erfassungsinstrumenten erfasst werden
    accessed: '2026-10-15'
    locator: Kap. 7.4.2, Empf. 7.7 (EK, neu 2026), S. 125; Tab. 6 Zeile 2, S. 56
  - source: S3-LL Lungenkarzinom
    version: 5.1 (Juli 2026, AWMF 020-007OL)
    url: https://www.leitlinienprogramm-onkologie.de/leitlinien/lungenkarzinom
    section: Kap. 8.2 Konzept der frühzeitigen Integration palliativmedizinischer Versorgung, Empf. 8.5
      (u. a. Wahrnehmung von Belastungen in der Familie und bei Freunden mit Angebot der Unterstützung)
    recommendation_grade: B
    evidence_level: '3'
    quote: 'Im Rahmen der Palliativberatung und -versorgung von Patienten mit nicht-heilbarer Lungenkarzinomerkrankung
      sollten folgende Aufgaben bewältigt werden: … • Wahrnehmung von Belastungen in der Familie und bei
      Freunden mit Angebot der Unterstützung'
    accessed: '2026-10-15'
    locator: Kap. 8.2, Empf. 8.5 (B, LoE 3, geprüft 2026), S. 203
