issues:
- 'Wertemenge unvollständig: Die S3-LL Palliativmedizin 3.0 nennt für das Angehörigen-Screening vier Instrumente,
  darunter das Distress-Thermometer (Kap. 7.4.2); es fehlt hier (vgl. Element distressThermometerScore).
  Das kategoriale CAREPAL-Ergebnis (4 Risikogruppen) ist im Katalog nicht abbildbar, siehe Issue bei caregiverBurdenScore.'
