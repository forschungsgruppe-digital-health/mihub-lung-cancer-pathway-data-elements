  - source: S3-LL Palliativmedizin
    version: 3.0 (Juli 2026, AWMF 128-001OL)
    url: https://www.leitlinienprogramm-onkologie.de/leitlinien/palliativmedizin
    section: 'Kap. 7.4.2 Standardisierte Instrumente der Bedarfserfassung, Empf. 7.6 (Belastungen/Bedürfnisse
      proaktiv und wiederholt ermitteln) und Empf. 7.7 (validierte multidimensionale Erfassungsinstrumente);
      Instrumente: Tab. 6 (Kap. 5.3), Zeile 2 „Belastungen der Angehörigen“'
    recommendation_grade: EK
    evidence_level: n/a
  - source: S3-LL Lungenkarzinom
