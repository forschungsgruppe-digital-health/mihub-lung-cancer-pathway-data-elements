    section: Kap. 8.2 Konzept der frühzeitigen Integration palliativmedizinischer Versorgung, Empf. 8.5
      (u. a. Wahrnehmung von Belastungen in der Familie und bei Freunden mit Angebot der Unterstützung)
    recommendation_grade: B
    evidence_level: '3'
