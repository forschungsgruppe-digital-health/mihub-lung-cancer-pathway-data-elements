issues:
- 'Typ und Kategorie prüfen: Die oMME ist im Mapping als eigene, abgeleitete Observation abgebildet (valueQuantity
  mg/d; Bezug zu den zugrunde liegenden MedicationStatement/MedicationAdministration über die R4-Core-Extension
  workflow-supportingInfo, da Observation.derivedFrom in FHIR R4 keine Medikationsressourcen erlaubt).
  Zu prüfen ist, ob iso13972_metadata.type (medication) und category (medikation) zu dieser Modellierung
  passen. Zum Observation.code siehe den folgenden offenen Punkt.'
- 'Observation.code für opioidDailyOmme festlegen: Für die oMME gibt es kein LOINC- oder SNOMED-CT-Konzept
  (siehe value_set.notes). Einen lokalen Code mit eigener CodeSystem-URL festlegen oder nur code.text
  verwenden? Außerdem klären, ob ATC N02A aus value_set in der Observation mitgeführt wird: N02A bezeichnet
  die Wirkstoffgruppe der Opioide, nicht die Messgröße oMME, und gehört eher zu den referenzierten MedicationStatements.'
