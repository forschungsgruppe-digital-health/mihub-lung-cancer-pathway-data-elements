issues:
- 'standard_mappings (fhir-r4-base): MedicationStatement.dosage.doseAndRate ist für die oMME semantisch
  falsch, denn dort steht die tatsächliche Dosis des einzelnen Präparats in dessen Einheit. Die abgeleitete
  Tagesdosis als eigene Observation modellieren (valueQuantity in mg/d; Code: kein Standardkonzept auf
  dem MII TermServ, daher lokal bzw. offen). Den Bezug zu den zugrunde liegenden MedicationStatement/MedicationAdministration
  über die R4-Core-Extension http://hl7.org/fhir/StructureDefinition/workflow-supportingInfo herstellen
  (Kontext Observation, Reference(Any)); Observation.derivedFrom erlaubt in FHIR R4 nur DocumentReference,
  ImagingStudy, Media, QuestionnaireResponse, Observation und MolecularSequence. Dabei iso13972_metadata.type
  (medication) und category (medikation) mitprüfen; Mapping zentral korrigieren.'
