name: phq9DepressionScore
label_de: PHQ-9 Depressionsscore
definition_de: Gesamtscore des Patient Health Questionnaire-9 (PHQ-9; 9 Items, Wertebereich 0–27) als
  Screening- und Verlaufsinstrument zur Erkennung und Schweregrad-Einschätzung depressiver Symptomatik.
  Ein auffälliger Wert ersetzt nicht die klinische Diagnosestellung nach ICD-10-Kriterien (S3-LL Palliativmedizin
  3.0, Empf. 18.5).
phase: palliative
tumor_entity:
- NSCLC
- SCLC
category: assessment
datatype: integer
cardinality: 0..*
unit: '{score}'
value_set:
  binding_strength: required
  codings:
  - system: loinc
    code: 44261-6
    display: Patient Health Questionnaire 9 item (PHQ-9) total score [Reported]
constraints_de: Wertebereich 0..27. Cut-off ≥10 = auffälliges Screening-Ergebnis (Schwellenwert aus der
  PHQ-9-Literatur, nicht Inhalt der S3-LL); Diagnose und Schweregrad sind klinisch nach ICD-10-Kriterien
  zu sichern (S3-LL Palliativmedizin 3.0, Empf. 18.5). Somatische Items (Appetit, Schlaf, Energie, Konzentration,
  Psychomotorik) sind bei fortgeschrittener Krebserkrankung nur eingeschränkt verwertbar (Kap. 18.3.2).
care_process:
  trigger: Screening bei Aufnahme + Verlauf
  frequency_pattern: per-encounter / monthly
  responsible_role: Palliativ-Team / Psychoonkologie
