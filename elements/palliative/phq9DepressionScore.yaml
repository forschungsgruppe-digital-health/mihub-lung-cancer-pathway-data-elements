issues:
- 'Instrumentenwahl prüfen: Der Text von Kap. 18.3 der S3-LL Palliativmedizin 3.0 nennt den PHQ-9 nicht
  (nur indirekt über die dort zitierte Studie Hinz et al. 2016 zur PHQ-9-Schweregradeinschätzung bei Krebspatient:innen).
  Genannt werden die HADS (HADS-T/HADS-D; laut Metaanalyse als Screeningverfahren geeignet, nicht zur
  Diagnosestellung; in einer internationalen Delphi-Konsensusrunde niedriger gewertet als die offene Exploration)
  und das 2-Fragen-Screening nach Whooley (Empf. 18.4, Grad 0, LoE 4). Sonst nennt die Leitlinie den PHQ-9
  nur in Kap. 7.4.2 (vertiefendes Assessment bei Angehörigen) und als Studienendpunkt (Kap. 18.6.2). Erwägen:
  Whooley-Screening bzw. HADS-D-Score ergänzen (SNOMED CT 401320004 „HAD scale: depression score“, observable
  entity, aktiv – MII TermServ 2026-10-14) oder den PHQ-9 ausdrücklich als Expert:innen-Festlegung kennzeichnen
  (für den PHQ-9 spricht seine Abbildung im MII-KDS-Modul PRO 2026.7.0 mit LOINC 44261-6). „monthly“ in
  frequency_pattern ist nicht leitlinienbelegt (Kap. 18.3.3: „häufige erneute Einschätzung erforderlich“).'
