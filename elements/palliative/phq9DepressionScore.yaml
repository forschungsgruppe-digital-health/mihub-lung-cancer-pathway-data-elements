name: phq9DepressionScore
label_de: PHQ-9 Depressionsscore
definition_de: Gesamtscore des Patient Health Questionnaire-9 (PHQ-9; 9 Items, Wertebereich 0–27) als
  Screening- und Verlaufsinstrument zur Erkennung und Schweregrad-Einschätzung depressiver Symptomatik.
  Ein auffälliger Wert ersetzt nicht die klinische Diagnosestellung nach ICD-10-Kriterien (S3-LL Palliativmedizin
  3.0, Empf. 18.5).
phase: palliative
tumor_entity:
- NSCLC
- SCLC
category: assessment
datatype: integer
cardinality: 0..*
unit: '{score}'
value_set:
  binding_strength: required
  codings:
  - system: loinc
    code: 44261-6
    display: Patient Health Questionnaire 9 item (PHQ-9) total score [Reported]
constraints_de: Wertebereich 0..27. Cut-off ≥10 = auffälliges Screening-Ergebnis (Schwellenwert aus der
  PHQ-9-Literatur, nicht Inhalt der S3-LL); Diagnose und Schweregrad sind klinisch nach ICD-10-Kriterien
  zu sichern (S3-LL Palliativmedizin 3.0, Empf. 18.5). Somatische Items (Appetit, Schlaf, Energie, Konzentration,
  Psychomotorik) sind bei fortgeschrittener Krebserkrankung nur eingeschränkt verwertbar (Kap. 18.3.2).
care_process:
  trigger: Screening bei Aufnahme + Verlauf
  frequency_pattern: per-encounter / monthly
  responsible_role: Palliativ-Team / Psychoonkologie
evidence:
  guideline_references:
  - source: S3-LL Palliativmedizin
    version: 3.0 (Juli 2026, AWMF 128-001OL)
    url: https://www.leitlinienprogramm-onkologie.de/leitlinien/palliativmedizin
    section: Kap. 18.3.1 Screening, Empf. 18.2 (Vorliegen einer Depression aktiv und regelmäßig prüfen)
    recommendation_grade: A
    evidence_level: '4'
    quote: Bei Patient:innen mit einer nicht heilbaren Krebserkrankung soll das Vorliegen einer Depression
      aktiv und regelmäßig geprüft werden.
    accessed: '2026-10-15'
    locator: Kap. 18.3.1, Empf. 18.2 (S. 450)
  - source: S3-LL Palliativmedizin
    version: 3.0 (Juli 2026, AWMF 128-001OL)
    url: https://www.leitlinienprogramm-onkologie.de/leitlinien/palliativmedizin
    section: Kap. 18.3.1 Screening, Empf. 18.3 (Screeningverfahren zur Erkennung einer Depression; PHQ-9
      nicht namentlich genannt)
    recommendation_grade: B
    evidence_level: 1+
    quote: Bei Patient:innen mit einer nicht heilbaren Krebserkrankung sollte zur Erkennung … einer Depression
      ein Screeningverfahren eingesetzt werden.
    accessed: '2026-10-15'
    locator: Kap. 18.3.1, Empf. 18.3 (S. 450)
