issues:
- 'KDL SD110105 (Dokumentklasse ''Palliativmedizinische Komplexbehandlungsdokumentation'') ist kein Phasenwert
  (datatype code 1..1: stable/unstable/deteriorating/dying), steht aber als valueSet.coding im Wertebereich.
  Katalogweite Entscheidung zur Rolle der KDL-Codings bei code-Elementen nötig (siehe complexityLevel).'
