id: mihub.lung.palliative.illnessPhase.v0.1
uuid: 0df5c457-d366-5c12-b0f4-73d61c24393b
name: illnessPhase
label_de: Krankheitsphase
definition_de: 'Krankheitsphase im Sinne des australischen, für Deutschland adaptierten Palliative-Care-Phasen-Konzepts
  (S3-LL Palliativmedizin Kap. 5.3, Tab. 6): klinisch bedeutsamer Zeitraum im Krankheitsverlauf von Patient:in
  und betreuenden Angehörigen, der anzeigt, ob der Versorgungsplan angemessen ist oder geändert werden
  muss – stabil, instabil, verschlechternd, sterbend (terminal).'
phase: palliative
tumor_entity:
- NSCLC
- SCLC
category: versorgungskontext
datatype: code
cardinality: 1..1
value_set:
  binding_strength: example
  standard_binding_status: no-standard-found
  notes: Krankheitsphasen-Konzept der Australian Palliative Care Phases (Eagar et al. 2004), für Deutschland
    adaptiert (Lehmann et al. 2021) und in der S3-LL Palliativmedizin 3.0 Kap. 5.3/Tab. 6 mit vier Phasen
    übernommen (stabil, instabil, verschlechternd, sterbend); eine fünfte Phase 'bereaved' gehört nicht
    zu den Krankheitsphasen in Tab. 6 (die Trauer der Angehörigen behandelt die Leitlinie gesondert in
    Kap. 7.7). SNOMED CT International (MII TermServ, Stand 2026-10-14) enthält keine entsprechenden Konzepte.
    Ob eine Australian SNOMED-CT-Edition eigene Phasen-Codes führt, ist nicht verifiziert (UNSICHER) –
    Edition-/Refset-Prüfung in nachgelagerter Iteration.
  codings:
  - system: local-no-standard-binding
    code: stable
    display: stabil
  - system: local-no-standard-binding
    code: unstable
    display: instabil
  - system: local-no-standard-binding
    code: deteriorating
    display: verschlechternd
  - system: local-no-standard-binding
    code: dying
    display: sterbend (terminal)
  - system: kdl
    code: SD110105
    display: Palliativmedizinische Komplexbehandlungsdokumentation
care_process:
  trigger: bei jeder Visite
  frequency_pattern: per-encounter (täglich in Sterbephase)
  responsible_role: Palliativ-Team
evidence:
  guideline_references:
  - source: S3-LL Palliativmedizin
    version: 3.0 (Juli 2026, AWMF 128-001OL)
    url: https://www.leitlinienprogramm-onkologie.de/leitlinien/palliativmedizin
    section: 'Kap. 5.3, Empf. 5.4 (modifiziert 2026: Krankheitsphase als Faktor der Komplexitätseinschätzung);
      Tab. 6 Zeile 4 Krankheitsphase a) stabil – d) sterbend (terminal)'
    recommendation_grade: EK
    evidence_level: n/a
    quote: Krankheitsphasen in dem hier verwendeten Sinne werden als stabil, instabil, verschlechternd
      und sterbend charakterisiert … Krankheitsphasen beschreiben einen klinisch bedeutsamen Zeitraum
      im Krankheitsverlauf von Patient:innen mit weit fortgeschrittenen, unheilbaren Erkrankungen
    accessed: '2026-10-15'
    locator: Kap. 5.3, Empf. 5.4 (S. 55) und Hintergrund; Tab. 6 Zeile 4 (S. 56)
