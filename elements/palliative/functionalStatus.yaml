issues:
- 'ICF d4 ''Mobilität'' und d5 ''Selbstversorgung'' (Kapitelebene) sind Funktionsdomänen der ICF, keine
  Messgrößen des Funktionsstatus (AKPS/ECOG/Barthel), und auf dem MII TermServ nicht verifizierbar (HTTP
  404). Rolle klären (z. B. nur als Domänenhinweis in notes; S3-LL Palliativmedizin 3.0, Tab. 6 nennt
  ''Selbstversorgung'' als Aspekt des Funktionsstatus) oder die Codes entfernen. Zugleich Datentyp und
  Wertebereich klären: Die übrigen Codings sind Beobachtungscodes (Observation.code-Kandidaten), ein Wertebereich
  fehlt. MII KDS Onkologie 2027.0.0-ballot.1 modelliert ECOG (SNOMED CT 423740007, LOINC 89262-0) und
  Karnofsky (SNOMED CT 761869008, LOINC 89243-0) mit Observation.value[x] CodeableConcept (oBDS-Codes
  0–4/U bzw. 100 %–0 %, zusätzlich LOINC-Antwortcodes); der Barthel-Index (LOINC 96761-2, Skalentyp Qn)
  ist ein numerischer Score, für AKPS gibt es keinen Code. Optionen: instrumentspezifische Elemente oder
  ein Instrument-/Score-Paar (analog caregiverBurden/caregiverBurdenScore); gemeinsam mit ecogPerformanceStatus
  und ecogPerformanceStatusSurveillance (integer + LOINC 89262-0, ordinal) zentral entscheiden.'
