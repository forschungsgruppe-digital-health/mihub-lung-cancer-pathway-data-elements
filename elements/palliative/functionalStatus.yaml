id: mihub.lung.palliative.functionalStatus.v0.1
uuid: 3416e88d-dd6c-5487-9952-4670930e892e
name: functionalStatus
label_de: Funktionsstatus (AKPS / ECOG)
definition_de: 'Funktionsstatus der Patient:in: Quantifizierung des Allgemeinzustandes und der Aktivitäten
  des alltäglichen Lebens, v. a. im Sinne von Aktivität, Selbstversorgung und Selbstbestimmung; Faktor
  der Komplexitätseinschätzung (S3-LL Palliativmedizin 3.0, Empf. 5.4, Tab. 6). Mögliche Messinstrumente:
  AKPS, ECOG, ADL-Index (Katz), Barthel-Index (Tab. 6); zusätzlich Karnofsky-Index (KPS; S3-LL Lungenkarzinom
  5.1, Tab. 19).'
phase: palliative
tumor_entity:
- NSCLC
- SCLC
category: assessment
datatype: CodeableConcept
cardinality: 0..*
value_set:
  binding_strength: extensible
  standard_binding_status: mapped
  codings:
  - system: loinc
    code: 89262-0
    display: ECOG Performance Status [Interpretation]
  - system: snomed-ct
    code: '423740007'
    display: ECOG performance status
  - system: snomed-ct
    code: '761869008'
    display: KPS (Karnofsky Performance Status) score
  - system: loinc
    code: 89243-0
    display: Karnofsky Performance Status score
  - system: snomed-ct
    code: '725594005'
    display: Barthel Index of Activities of Daily Living score
  - system: icf
    code: d4
    display: Mobilität (Aktivität & Partizipation)
  - system: icf
    code: d5
    display: Selbstversorgung (Aktivität & Partizipation)
  - system: loinc
    code: 96761-2
    display: Total score Barthel Index
  notes: 'AKPS (Australia-modified Karnofsky Performance Status; Abernethy et al. 2005, revidierte Skala
    für die Palliativversorgung, S3-LL Palliativmedizin 3.0, Tab. 6): kein LOINC-/SNOMED-CT-Code auf dem
    MII TermServ (Stand 2026-10-14). AKPS-Werte nicht mit den KPS-Codes (SNOMED CT 761869008, LOINC 89243-0)
    kodieren – diese bezeichnen die Original-Karnofsky-Skala (S3-LL Lungenkarzinom 5.1, Kap. 6.2/Tab.
    19; OCP Lung Step 3.3). ADL-Index nach Katz: Instrumentkonzept SNOMED CT 273547007. ICF-Codes sind
    nicht verifizierbar: ICF (BfArM) ist auf dem MII TermServ nicht verfügbar (Stand 2026-10-13); Codes
    gemäß ICF-Browser belassen.'
care_process:
  trigger: bei jeder Visite
  frequency_pattern: per-encounter
  responsible_role: Palliativ-Team / Pflege
evidence:
  guideline_references:
  - source: S3-LL Palliativmedizin
    version: 3.0 (Juli 2026, AWMF 128-001OL)
    url: https://www.leitlinienprogramm-onkologie.de/leitlinien/palliativmedizin
    section: 'Kap. 5.3, Empf. 5.4 (modifiziert 2026: Funktionsstatus als Faktor der Komplexitätseinschätzung);
      Tab. 6 Zeile 3 Funktionsstatus (AKPS, ECOG, ADL, Barthel-Index)'
    recommendation_grade: EK
    evidence_level: n/a
    quote: Bei Patient:innen mit einer nicht-heilbaren Krebserkrankung soll die Komplexität … der Situation
      durch die Patienten- und Angehörigenbedürfnisse, den Funktionsstatus d. Patient:in und die Krankheitsphase
      eingeschätzt werden. … z.B. Australian-modified Karnofsky-Performance Status (AKPS)
    accessed: '2026-10-15'
    locator: Kap. 5.3, Empf. 5.4 (S. 55); Tab. 6 Zeile 3 (S. 56)
  - source: S3-LL Lungenkarzinom
    version: 5.1 (Juli 2026, AWMF 020-007OL)
    url: https://www.leitlinienprogramm-onkologie.de/leitlinien/lungenkarzinom
    section: 'Kap. 6.2, Tab. 19 (Allgemeinzustand und Leistungsfähigkeit: ECOG/WHO-Grad und Karnofsky-Index);
      Kap. 8.6.3.1 (Erstlinien-Systemtherapie im Stadium IV: Allgemeinzustand nach Karnofsky oder ECOG
      als Auswahlkriterium)'
    recommendation_grade: n/a
    evidence_level: n/a
    quote: Der Allgemeinzustand eines Patienten und seine Leistungsfähigkeit kann anhand des Karnofsky-Index
      und des ECOG/WHO Performance Status quantifiziert werden … sowie Alter, Ko-Morbiditäten und der
      Allgemeinzustand (nach Karnofsky oder ECOG).
    accessed: '2026-10-15'
    locator: Kap. 6.2 (S. 113) mit Verweis auf Tab. 19 (S. 114); Kap. 8.6.3.1 (S. 311)
