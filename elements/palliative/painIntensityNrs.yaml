issues:
- 'Erfassungsmodus kennzeichnen: Selbsteinschätzung (S3-LL Palliativmedizin 3.0, Kap. 10.2, Empf. 10.1,
  EK) vs. Fremdeinschätzung durch Angehörige oder Personal (Empf. 10.2, EK), z. B. über Observation.performer
  (Patient vs. RelatedPerson/Practitioner). In dieses Element nur NRS-0–10-Werte übernehmen: Die von der
  Leitlinie gleichrangig genannte 4-stufige VRS (eine Zuordnung zur NRS nimmt die Leitlinie bewusst nicht
  vor) und Werte strukturierter Beobachtungsbögen der Fremdeinschätzung (BISAD, BeSD) gehören in eigene
  Codes bzw. Elemente (analog RDOS bei dyspneaIntensityNrs). Optional den Bezug mitführen (aktuelle, maximale
  oder minimale Schmerzstärke; Ruhe/Belastung; letzte 24 h). LOINC 72514-3 bezeichnet eine berichtete
  verbale numerische Einschätzung (Methode „Reported“); klären, ob vom Personal beobachtete Fremdeinschätzungen
  damit kodiert werden dürfen.'
