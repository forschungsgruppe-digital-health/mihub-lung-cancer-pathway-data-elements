issues:
- 'Instrumentenwahl prüfen: Zum Erfassungsinstrument für Angst gibt die S3-LL Palliativmedizin 3.0 nur
  eine Kann-Empfehlung für ein validiertes und standardisiertes Screeninginstrument ohne Instrumentnennung
  (Kap. 17.2, Empf. 17.2, Grad 0, LoE 3); formal erfüllt die HADS das. Im Hintergrundtext (keine graduierte
  Empfehlung) gilt die HADS als im Vergleich aufwändiger und im palliativmedizinisch-klinischen Kontext
  wenig eingesetzt; für die klinische Praxis in Deutschland nennt er GAD-2 und MIDOS, den GAD-2 aufgrund
  seiner Kürze als besonders geeignet (Verlauf stationär mindestens wöchentlich, ambulant alle 6–8 Wochen
  und/oder nach Verhaltensveränderung), zudem IPOS. MIDOS2 und IPOS sind über symptomAssessmentInstrument
  abgedeckt. Ergänzung eines GAD-2-Elements erwägen (SNOMED CT 1365837005 „Generalized Anxiety Disorder
  2 item score“, observable entity, aktiv – MII TermServ 2026-10-14) bzw. anxietyHadsScore als eines von
  mehreren zulässigen Angst-Screenings führen.'
