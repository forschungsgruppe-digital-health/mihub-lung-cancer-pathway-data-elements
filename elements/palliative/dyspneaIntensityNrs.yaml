issues:
- ICF-Code b440 (Funktionen der Atmung) bezeichnet laut WHO-ICF-Browser die objektive Atemfunktion (Atemfrequenz,
  -rhythmus, -tiefe). Die subjektive Atemnot ordnet die ICF b460 zu („Sensations associated with cardiovascular
  and respiratory functions“, Inklusion „dyspnoea, air hunger“). Die Leitlinie versteht Atemnot als subjektives
  Erleben, für dessen Erfassung objektive Parameter nicht geeignet sind (S3-LL Palliativmedizin 3.0, Kap.
  9.2, Hintergrund). b440 durch b460 mit deutschem BfArM-ICF-Titel ersetzen; Code und Titel vorab gegen
  die BfArM-ICF prüfen, da ICF auf dem MII TermServ nicht verfügbar ist (WHO-ICF-Browser, Stand 2026-10-14).
