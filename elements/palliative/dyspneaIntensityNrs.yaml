id: mihub.lung.palliative.dyspneaIntensityNrs.v0.2
uuid: ffde437e-0827-5903-8c6a-34b86ac59c40
name: dyspneaIntensityNrs
label_de: Atemnot-Intensität (NRS 0–10)
definition_de: Selbst eingeschätzte Intensität der Atemnot (sensorisches Erleben) auf einer numerischen
  Rating-Skala 0–10. Bei deutlicher kognitiver oder körperlicher Einschränkung (z. B. Verwirrtheit, Sterbephase)
  erfolgt stattdessen eine Fremdeinschätzung durch Personal oder Angehörige (z. B. RDOS); diese wird nicht
  als NRS-Wert in diesem Element dokumentiert.
phase: palliative
tumor_entity:
- NSCLC
- SCLC
category: assessment
datatype: integer
cardinality: 0..*
unit: '{score}'
value_set:
  binding_strength: required
  standard_binding_status: pending-mapping
  codings:
  - system: snomed-ct
    code: '267036007'
    display: Dyspnea
  - system: icf
    code: b440
    display: Funktionen der Atmung
  notes: LOINC 2.83 (MII TermServ, Stand 2026-10-14) enthält keinen instrumentenunabhängigen Code für
    die Atemnot-NRS 0–10. 112499-9 „Shortness of breath“ ist das ESAS-Item (Find/Ord, Antwortliste LL7514-4
    „ESAS shortness of breath scale“, 0–10) und nur bei ESAS-Erfassung geeignet. PROMIS dyspnea severity
    92149-4 ist ein T-Score, MRC 98070-6 ein Grad; das Mapping bleibt offen. SNOMED CT 267036007 ist ein
    Befund-, kein Intensitätskonzept. ICF ist auf dem MII TermServ nicht verfügbar; Kategorie gemäß WHO-ICF-Browser.
constraints_de: Wertebereich 0..10 (ganzzahlig; nur Selbsteinschätzung). Bezugszeitraum (aktuell oder
  Durchschnitt der letzten 24 h) und Situation (Ruhe/Belastung) mitdokumentieren. Eine Fremdeinschätzung
  durch Personal oder Angehörige (z. B. RDOS, eigenes Beobachtungsinstrument mit eigenem Wertebereich)
  wird nicht in dieses Element übernommen; ein eigenes Element dafür fehlt im Katalog derzeit.
care_process:
  trigger: bei jeder Visite + nach Therapie-Anpassung
  frequency_pattern: per-encounter
  responsible_role: Palliativ-Team / Pflege / Patient (Selbsteinschätzung)
