name: advanceDirectiveDocument
label_de: Patientenverfügung / Vorsorgevollmacht
definition_de: Vorhandensein einer wirksamen Patientenverfügung und/oder Vorsorgevollmacht inkl. Verweis
  auf das Dokument.
phase: palliative
tumor_entity:
- NSCLC
- SCLC
category: dokument
datatype: Reference
cardinality: 0..*
value_set:
  binding_strength: preferred
  standard_binding_status: mapped
  codings:
  - system: snomed-ct
    code: '371538006'
    display: Advance directive report
  - system: loinc
    code: 42348-3
    display: Advance Healthcare Directives
  - system: kdl
    code: AM160104
    display: Patientenverfügung
  - system: kdl
