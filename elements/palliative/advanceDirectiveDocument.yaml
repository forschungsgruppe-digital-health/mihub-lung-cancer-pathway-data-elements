issues:
- 'Abgrenzung der Dokumenttypen: Als schriftliche Vorausplanung nennt die S3-LL Palliativmedizin 3.0 (Kap.
  6.5, Hintergrund) Vorsorgevollmacht, individuelle Patient:innenverfügung und Anweisung für Notfallsituationen
  (Notfallbogen). Empf. 6.12 nennt zudem als Gesprächsinhalt, eine Betreuer:in vorzuschlagen (rechtlich
  in der Regel über eine Betreuungsverfügung; der Begriff selbst steht nicht in der Leitlinie). Zu entscheiden
  ist, ob Notfallbogen und Betreuungsverfügung hier (Definition/Value Set) oder als eigenes Element erfasst
  werden. Zudem setzt „wirksam“ in der Definition eine rechtliche Prüfung voraus (Verbindlichkeit laut
  Leitlinie im Betreuungsrecht geregelt), die bei der Datenerfassung meist nicht leistbar ist. Stattdessen
  Vorliegen und Datum der letzten Aktualisierung erfassen (Aktualisierung laut Leitlinie regelmäßig und
  insbesondere bei wesentlichen gesundheitlichen Veränderungen sinnvoll)?'
- 'Codes und Dokumentverweis für advanceDirectiveDocument festlegen. (1) LOINC 42348-3 steht nicht in
  c80-doc-typecodes (R4 4.0.1) und ist damit im LOINC-Slice von MII Dokument unzulässig. Für die Patientenverfügung
  enthält das ValueSet keinen passenden Code, für die Vollmacht z. B. 64298-3 Power of attorney. Den LOINC-Slice
  weglassen oder für die Vollmacht 64298-3 ergänzen? (2) Vorsorgevollmacht: Das Element führt dafür nur
  KDL AM160103. Für den SNOMED-Slice von MII Dokument (Nachfahren von 229059009 Report) und für KBV_VS_MIO_DPE_Declaration_Type
  (policyRule, REQUIRED) fehlt ein SNOMED-Dokumenttyp. Kandidat: 186065003 Power of attorney medical report
  (record artifact), Parent 229059009, im KBV-ValueSet enthalten. Ergänzen? (3) Die KBV-DPE kennt keinen
  Verweis auf das Dokument, nur Ablageort-Text und Adresse (sourceReference.reference max 0). Genügt das
  für „inkl. Verweis auf das Dokument“ in der Definition, oder wird parallel eine DocumentReference nach
  MII Dokument geführt?'
