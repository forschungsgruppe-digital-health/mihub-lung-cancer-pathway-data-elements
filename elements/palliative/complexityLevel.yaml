id: mihub.lung.palliative.complexityLevel.v0.1
uuid: 3d3d3296-edb9-574a-bc4f-f0b236341d76
name: complexityLevel
label_de: Komplexität der Versorgungssituation
definition_de: Einstufung der Komplexität der Situation von Patient:in und Angehörigen (niedrig, mittel,
  hoch), eingeschätzt anhand der Bedürfnisse und Probleme der Patient:in (Intensität und gleichzeitiges
  Auftreten von Symptomen sowie psychosozialen, spirituellen oder ethischen Problemen inkl. Komorbiditäten),
  der Bedürfnisse und Belastungen der Angehörigen, des Funktionsstatus und der Krankheitsphase (S3-LL
  Palliativmedizin 3.0, Empf. 5.3/5.4, Tab. 6).
phase: palliative
tumor_entity:
- NSCLC
- SCLC
category: versorgungskontext
datatype: code
cardinality: 1..1
value_set:
  binding_strength: example
  standard_binding_status: no-standard-found
  notes: Komplexitätsstufen der Palliativversorgung gemäß S3-LL Palliativ Kap. 5.3. Es gibt keine direkt
    zutreffenden SNOMED-CT- oder LOINC-Codes für genau dieses palliativ-kontextuelle Komplexitätskonstrukt.
    Allgemeine SNOMED-Severity-Codes (255604002 mild, 6736007 moderate, 24484000 severe) sind kontextfremd
    und decken Patient:innen-/Angehörigensituation, Funktionsstatus und Krankheitsphase nicht vollständig
    ab. Mapping in nachgelagerter Iteration prüfen.
  codings:
  - system: local-no-standard-binding
    code: low
    display: niedrig
  - system: local-no-standard-binding
    code: medium
    display: mittel
  - system: local-no-standard-binding
    code: high
    display: hoch
  - system: kdl
    code: SD110105
    display: Palliativmedizinische Komplexbehandlungsdokumentation
instruction_de: Hohe Komplexität → SPV-Indikation. Bewertung anhand Bedürfnissen, Belastungen Angehörige,
  Funktionsstatus, Krankheitsphase.
care_process:
  trigger: ab Diagnose einer nicht-heilbaren Krebserkrankung, danach regelmäßig sowie bei Änderung der
    klinischen Situation (z. B. Phasenwechsel)
  frequency_pattern: per-encounter
  responsible_role: Primärbehandelnde (Onkolog:in, Hausärzt:in) bzw. APV-Behandelnde mit palliativmedizinischer
    Zusatzqualifikation / SPV-Palliativ-Team
evidence:
  guideline_references:
  - source: S3-LL Palliativmedizin
    version: 3.0 (Juli 2026, AWMF 128-001OL)
    url: https://www.leitlinienprogramm-onkologie.de/leitlinien/palliativmedizin
    section: 'Kap. 5.3, Empf. 5.3 (neu 2026: Komplexität niedrig/mittel/hoch regelmäßig evaluieren, Versorgungsstufe
      indizieren) und Empf. 5.4 (modifiziert 2026: Einschätzung über Patient:innen-/Angehörigenbedürfnisse,
      Funktionsstatus, Krankheitsphase); Tab. 6'
    recommendation_grade: EK
    evidence_level: n/a
  - source: S3-LL Palliativmedizin
    version: 3.0 (Juli 2026, AWMF 128-001OL)
    url: https://www.leitlinienprogramm-onkologie.de/leitlinien/palliativmedizin
    section: 'Kap. 5.4.3, Empf. 5.7 (geprüft 2026): hohe Komplexität → spezialisierte Palliativversorgung'
    recommendation_grade: A
    evidence_level: '3'
