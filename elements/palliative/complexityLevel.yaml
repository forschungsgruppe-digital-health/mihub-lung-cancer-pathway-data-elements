issues:
- 'KDL SD110105 (''Palliativmedizinische Komplexbehandlungsdokumentation'', KDL 2025) ist eine Dokumentklasse:
  weder Elementkonzept noch zulässiger Wert (datatype code 1..1: low/medium/high). scripts/build-fhir-logical-models.py
  übernimmt sie trotzdem als valueSet.coding neben die Werte. Katalogweit entscheiden, ob KDL-Dokumentkontext-Codes
  bei code-Elementen aus value_set.codings in notes oder ein eigenes Feld wandern (betrifft auch illnessPhase,
  palliativeCareTier und recistResponse).'
