name: tobaccoCessationCounselling
label_de: Raucherentwöhnungsangebot
definition_de: 'Strukturierte Tabakentwöhnungs-Beratung (z. B. nach ABC-Schema: Ask – Brief advice – Cessation
  support) inkl. Vermittlung an wirksame Hilfen (Tabakentwöhnungskurse, Telefonberatung, DiGA) und ggf.
  pharmakologische Therapie (Nikotinersatz, Vareniclin). Bei rauchenden Lungenkarzinom-Patient:innen soll
  eine pharmakologische Therapie angeboten werden.'
phase: followup
