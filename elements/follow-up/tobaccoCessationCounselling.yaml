id: mihub.lung.followup.tobaccoCessationCounselling.v0.1
uuid: eda1c29f-a2a0-5a4f-9dfe-8a17f620094b
name: tobaccoCessationCounselling
label_de: Raucherentwöhnungsangebot
definition_de: 'Strukturierte Tabakentwöhnungs-Beratung (z. B. nach ABC-Schema: Ask – Brief advice – Cessation
  support) inkl. Vermittlung an wirksame Hilfen (Tabakentwöhnungskurse, Telefonberatung, DiGA) und ggf.
  pharmakologische Therapie (Nikotinersatz, Vareniclin). Bei rauchenden Lungenkarzinom-Patient:innen soll
  eine pharmakologische Therapie angeboten werden.'
phase: followup
tumor_entity:
- NSCLC
- SCLC
category: prozedur
datatype: CodeableConcept
cardinality: 0..*
value_set:
  binding_strength: extensible
  standard_binding_status: mapped
  codings:
  - system: snomed-ct
    code: '710081004'
    display: Smoking cessation therapy
  - system: snomed-ct
    code: '225323000'
    display: Smoking cessation education
  - system: snomed-ct
    code: '702388001'
    display: Tobacco use cessation education
  - system: snomed-ct
    code: '151159008'
    display: Nicotine replacement therapy
  - system: snomed-ct
    code: '719591006'
    display: Varenicline therapy
  - system: snomed-ct
    code: '771155005'
    display: Brief intervention for smoking cessation
  - system: snomed-ct
    code: '395700008'
    display: Referral to smoking cessation advisor
instruction_de: 'Strukturierte Beratung, z. B. nach ABC-Schema (Ask – Brief advice – Cessation support),
  und Vermittlung an ein professionelles Entwöhnungsangebot (Kurs, Telefonberatung, DiGA) gemäß S3-LL
  Lungenkarzinom 5.1 Empf. 4.3; pharmakologische Therapie (z. B. NET, Vareniclin) allen Rauchenden anbieten
  (Empf. 4.4). DiGA-Optionen (BfArM-DiGA-Verzeichnis) können im Versorgungs-Setup konkretisiert werden.


  Erstattung von NET/Vareniclin seit 20.08.2025 (Beschluss vom 15.05.2025, im Leitlinientext ''BGA'',
  Link g-ba.de): Voraussetzung sind die Einschreibung in ein evidenzbasiertes Entwöhnungsprogramm (z.
  B. Kurs oder DiGA; Anmeldung beim Rauchfrei Ticket reicht nicht), erfüllte ICD-10-Abhängigkeitskriterien
  und eine schwere Tabakabhängigkeit (≥ 6 Punkte im Fagerström-Test) oder fortgesetzter Konsum trotz tabakassoziierter
  chronischer Lungen- oder Herzerkrankung; Verordnung für 3 Monate, erneut frühestens nach 3 Jahren; E-Zigaretten-Abhängigkeit
  nicht umfasst — S3-LL 5.1 Kap. 4.2.1.'
care_process:
  trigger: bei Status 'Smoker' / 'Occasional smoker'
  frequency_pattern: per-encounter-if-indicated
  responsible_role: Onkologe / Hausarzt
evidence:
  guideline_references:
  - source: S3-LL Lungenkarzinom
    version: 5.1 (Juli 2026, AWMF 020-007OL)
    url: https://www.leitlinienprogramm-onkologie.de/leitlinien/lungenkarzinom
    section: 'Empf. 4.3 (A, LoE 1, modifiziert 2026): strukturierte Beratung (z. B. ABC-Schema) und Vermittlung
      an professionelle Tabakentwöhnung (Kurse, Telefonberatung, DiGA)'
    recommendation_grade: A
    evidence_level: '1'
    quote: Rauchende Patienten mit Lungenkarzinom sollen strukturiert (z.B. nach ABC- … Schema) beraten
      und an ein professionelles Angebot zur Tabakentwöhnung vermittelt werden (z.B. Tabakentwöhnungskurse,
      Telefonberatung oder DiGA).
    accessed: '2026-10-15'
    locator: Kap. 4.2, Empf. 4.3 (A, LoE 1, modifiziert 2026), S. 62
  - source: S3-LL Lungenkarzinom
    version: 5.1 (Juli 2026, AWMF 020-007OL)
    url: https://www.leitlinienprogramm-onkologie.de/leitlinien/lungenkarzinom
    section: 'Empf. 4.4 (A, LoE 1, modifiziert 2026): pharmakologische Therapie (Nikotinersatz, Vareniclin)
      allen rauchenden Patienten anbieten'
    recommendation_grade: A
    evidence_level: '1'
    quote: Allen rauchenden Patienten mit Lungenkarzinom soll eine pharmakologische Therapie (z.B. eine
      Nikotinersatztherapie oder Vareniclin) angeboten werden.
    accessed: '2026-10-15'
    locator: Kap. 4.2, Empf. 4.4 (A, LoE 1, modifiziert 2026), S. 62
  - source: S3-LL Lungenkarzinom
    version: 5.1 (Juli 2026, AWMF 020-007OL)
    url: https://www.leitlinienprogramm-onkologie.de/leitlinien/lungenkarzinom
    section: Empf. 16.3 (B, LoE 3, geprüft 2026)
    recommendation_grade: B
    evidence_level: '3'
    quote: Patienten mit Lungenkarzinom sollten nachhaltig motiviert werden, mit dem Tabakrauchen aufzuhören.
      Zur Unterstützung sollten die Patienten wirksame Hilfen zur Raucherentwöhnung erhalten.
    accessed: '2026-10-15'
    locator: Kap. 16.2, Empf. 16.3 (B, LoE 3, geprüft 2026), S. 493
  - source: S3-LL Tabakentwöhnung
    version: 3.1 (Stand 01/2021, Langversion 03/2021, AWMF 076-006; Gültigkeit bis 31.12.2025 abgelaufen,
      Aktualisierung angemeldet 12/2024)
    url: https://register.awmf.org/de/leitlinien/detail/076-006
    section: 'Empf. 4.7.3.6 Tabakentwöhnung bei Lungenkarzinom (A, LoE 1a): Tabakentwöhnung mit psychosozialer
      und medikamentöser Unterstützung anbieten; ergänzend Empf. 4.1.3.1 Kurzberatung (A, LoE 1a), 4.4.3.1
      Nikotinersatztherapie (A, LoE 1a), 4.4.3.3.1 Vareniclin (A, LoE 1a); ABC-Methode = Hintergrundtext
      4.1.5'
    recommendation_grade: A
    evidence_level: 1a
    quote: Der Einsatz von Vareniclin soll zur Tabakentwöhnung angeboten werden. … Rauchenden Patientinnen
      und Patienten mit Lungenkarzinom soll eine Tabakentwöhnung mit psychosozialer und medikamentöser
      Unterstützung … angeboten werden.
    accessed: '2026-10-15'
    locator: Empf. 4.4.3.1 (S. 103), 4.4.3.3.1 (S. 105), 4.7.3.6 Tabakentwöhnung bei Lungenkarzinom (A,
      LoE 1a), S. 161 f.
