    display: Tobacco use cessation education
instruction_de: 'Beratung nach ABC-Schema empfohlen (S3-LL Lungenkarzinom v5.01 Empf. 4.3). DiGA-Optionen
  (Digitale Gesundheitsanwendungen, BfArM-DiGA-Verzeichnis) können als Vermittlungsweg in instruction_de
  oder im Versorgungs-Setup konkretisiert werden.

  G-BA-Erstattung von Nikotinersatztherapie/Vareniclin seit 20.08.2025 (Fagerström ≥ 6 bzw. tabakassoziierte
  chronische Lungen-/Herzerkrankung; 3 Monate, Wiederholung frühestens nach 3 Jahren) — S3-LL 5.1 Kap.
  4.2.1.'
care_process:
  trigger: bei Status 'Smoker' / 'Occasional smoker'
  frequency_pattern: per-encounter-if-indicated
  responsible_role: Onkologe / Hausarzt
