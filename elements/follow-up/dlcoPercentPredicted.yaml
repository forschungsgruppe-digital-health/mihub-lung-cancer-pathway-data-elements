issues:
- 'Struktur von dlcoPercentPredicted gegenüber dem MII-Lungenfunktion-Ballot klären. Dort ist ''Prozent
  vom Soll'' kein eigener Observation-Wert, sondern component:percentPredicted (valueQuantity %, LOINC
  98130-8) der DLCO-Observation (Observation.code LOINC 19911-7 bzw. SNOMED 1366665001, Wert = Absolutwert
  in mmol/(min.kPa)); der SNOMED-Slice der Komponente hat im Ballot noch das Platzhalter-Pattern ''TODO''.
  SNOMED 36421003 ''Carbon monoxide diffusing capacity measurement'' ist eine Prozedur und im Ballot das
  Procedure.code-Pattern von mii-pr-lungenfunktion-diffusion-messung, kein Observation-Code. Zu entscheiden:
  Element nach dem stabilen Release als Komponente der DLCO-Observation (ggf. mit Absolutwert) oder als
  eigenständige Observation (code 98130-8) führen und die Rolle von 36421003 klären (z. B. als Prozedurcode
  bei pulmonaryFunctionTest).'
