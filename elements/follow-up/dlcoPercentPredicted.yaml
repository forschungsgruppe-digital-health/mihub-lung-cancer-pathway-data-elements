    section: 'Kap. 6.2.2.1 (Strahlenpneumonitis 6–24 Monate nach RT-Ende; funktionelle Einschränkung mittels
      Lungenfunktionstestung einschließlich Diffusionskapazität erfasst und quantifiziert); Kap. 8.1 Tab.
      12 (Lungenfunktion: X Mo 3/6, (X) Mo 12/18/24) + Text (nach RT/RCT Überprüfung bis Ende des Pneumonitis-Risikos
      fortführen — soll)'
    recommendation_grade: n/a
