name: dlcoPercentPredicted
label_de: DLCO (% vom Soll)
definition_de: Diffusionskapazität für Kohlenmonoxid (DLCO/TLCO, CO-Transferfaktor), in Prozent des Sollwerts.
  Marker für Lungenfunktionseinschränkung (u. a. Verlust an Lungenfunktion nach Resektion) sowie für Strahlen-/Pneumonitis-Folgen.
  Ergebnisartefakt zur Prozedur 'pulmonaryFunctionTest'.
phase: followup
tumor_entity:
- NSCLC
- SCLC
category: messwert
datatype: decimal
cardinality: 0..*
unit: '%'
value_set:
  binding_strength: preferred
  standard_binding_status: mapped
  codings:
  - system: loinc
    code: 98130-8
    display: Diffusion capacity.carbon monoxide/Predicted
  - system: snomed-ct
    code: '36421003'
    display: Carbon monoxide diffusing capacity measurement
  - system: kdl
    code: DG060108
    display: Dokumentationsbogen Lungenfunktionsprüfung
standard_mappings:
- standard: fhir-mii-kds
  profile_or_url: https://www.medizininformatik-initiative.de/fhir/ext/modul-lungenfunktion/StructureDefinition/mii-pr-lungenfunktion-dlco
  resource: Observation
  path: Observation.component:percentPredicted.valueQuantity (UCUM %), component.code.coding:loinc = LOINC
    98130-8; Observation.code.coding:loinc = LOINC 19911-7
  notes: 'nur Ballot de.medizininformatikinitiative.kerndatensatz.lungenfunktion#2027.0.0-ballot.1, kein
    stabiles Release. Lungenfunktion statt Labor: …/core/modul-labor/ ist kein Profil. Der Prozentwert
    vom Soll ist im Profil eine Komponente der DLCO-Observation; Observation.value[x] trägt den Absolutwert
    (UCUM mmol/(min.kPa)). code.coding:loinc und component:percentPredicted.code.coding:loinc REQUIRED
    an mii-vs-lufu-lnc-dlco (enthält 19911-7, 19910-9, 98130-8); Observation.code.coding:sct Pattern 1366665001;
    für component:percentPredicted.code.coding:sct steht im Ballot noch das Platzhalter-Pattern ''TODO''.
    Observation.partOf → mii-pr-lungenfunktion-diffusion-messung. Übergangsweise zusätzlich fhir-r4-base.'
- standard: fhir-r4-base
  profile_or_url: http://hl7.org/fhir/StructureDefinition/Observation
  resource: Observation
  path: Observation.valueQuantity (UCUM %) mit Observation.code = LOINC 98130-8
  notes: Stabiles Übergangs-Mapping, bis das MII-Modul Lungenfunktion als stabiles Release vorliegt. Alternativ
    wie im MII-Ballot als Komponente einer DLCO-Observation (Observation.code LOINC 19911-7).
constraints_de: Wertebereich realistisch 0..150. UCUM-Einheit '%'. Bei Strahlentherapie verlaufsentscheidend.
care_process:
  trigger: bei jeder Lungenfunktionsprüfung mit DLCO-Bestimmung
  frequency_pattern: per-procedure
  responsible_role: Pneumologie
