      … Lungenfunktionseinschränkung, Pneumonitis … CO-Diffusionskapazität
    accessed: '2026-10-15'
    locator: S3 Kap. 16.3.1, S. 493; Tab. 44, S. 499
  - source: Onkopedia NSCLC
    version: Stand April 2025
