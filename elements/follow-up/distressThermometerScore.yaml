name: distressThermometerScore
label_de: Distress-Thermometer Gesamtscore
definition_de: Score aus dem Distress-Thermometer (NCCN) zur Identifikation psychosozialer Belastung.
  Cut-off ≥5 typischerweise als Indikation zur weiteren Diagnostik.
phase: followup
tumor_entity:
- NSCLC
- SCLC
category: assessment
datatype: integer
cardinality: 0..1
unit: '{score}'
value_set:
  binding_strength: required
  codings: []
  standard_binding_status: pending-mapping
  notes: LOINC 63994-4 ist auf dem MII TermServ (LOINC 2.83) nicht auffindbar; weder LOINC noch SNOMED
    CT (20260701) führen ein Konzept für das NCCN Distress-Thermometer. Mapping offen (Antrag SNOMED CT
    / LOINC oder lokales ValueSet).
care_process:
