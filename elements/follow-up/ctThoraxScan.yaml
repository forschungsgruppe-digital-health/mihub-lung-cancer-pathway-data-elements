name: ctThoraxScan
label_de: CT Thorax in der Nachsorge
definition_de: Computertomographie des Thorax als Verlaufsdiagnostik in der Nachsorge. Beurteilung von
  Lokalrezidiv, Zweittumoren, Pneumonitis, Fibrose.
phase: followup
tumor_entity:
- NSCLC
- SCLC
category: bildgebung
datatype: dateTime
cardinality: 0..*
value_set:
  binding_strength: preferred
  standard_binding_status: mapped
  codings:
  - system: loinc
    code: 24627-2
    display: CT Chest
  - system: snomed-ct
    code: '169069000'
    display: CT of chest
  - system: ops
    code: 3-202
    display: Native Computertomographie des Thorax
  - system: ops
    code: 3-222
    display: Computertomographie des Thorax mit Kontrastmittel
  - system: kdl
    code: DG020103
    display: CT-Befund
standard_mappings:
- standard: fhir-mii-kds
  profile_or_url: https://www.medizininformatik-initiative.de/fhir/ext/modul-bildgebung/StructureDefinition/mii-pr-bildgebung-bildgebungsstudie
  resource: ImagingStudy
  path: ImagingStudy.started
  notes: MII KDS Bildgebung 2026.0.0 (MII_PR_Bildgebung_Bildgebungsstudie); ImagingStudy.started 0..1
    MS. Modalität über ImagingStudy.modality bzw. ImagingStudy.series.modality (1..1, REQUIRED DICOM CID
    33, System http://dicom.nema.org/resources/ontology/DCM), hier CT. Das Profil beschreibt eine DICOM-Studie;
    ohne DICOM-Studie alternativ Procedure https://www.medizininformatik-initiative.de/fhir/ext/modul-bildgebung/StructureDefinition/mii-pr-bildgebung-bildgebungsprozedur
    mit Procedure.performed[x] (1..1; code.coding:sct REQUIRED an Nachfahren von 363679005 Imaging, dazu
    coding:ops und coding:loinc).
care_process:
  trigger: 'gemäß Nachsorgeplan: S3 Empf. 16.7 (CT als eine der bildgebenden Optionen an jedem Nachsorgetermin);
    Onkopedia NSCLC Tab. 12 (jährlich Mo 12–60 für alle, zusätzlich Mo 3/6/18 nur nach Strahlentherapie
    — siehe curativeTreatmentModality); Onkopedia SCLC Tab. 9 (alle 9 Zeitpunkte); einmalig nach Radiochemotherapie
    NSCLC Stadium III vor Durvalumab-Konsolidierung (S3 Empf. 16.6)'
  frequency_pattern: 'S3 (Visitenrhythmus Empf. 16.7; CT dort nur eine der bildgebenden Optionen, kein
    CT-spezifisches Intervall): Q3M-Y1-Y2;Q6M-Y3-Y5 · Onkopedia NSCLC: M12;M24;M36;M48;M60 (+M3;M6;M18
    nach RT/RCT) · Onkopedia SCLC: Q3M-Y1;Q6M-Y2;Q12M-Y3-Y5'
  responsible_role: Radiologie
evidence:
  guideline_references:
  - source: S3-LL Lungenkarzinom
    version: 5.1 (Juli 2026, AWMF 020-007OL)
    url: https://www.leitlinienprogramm-onkologie.de/leitlinien/lungenkarzinom
    section: 'Tab. 44 (Thorax CT: Tumorkinetik und lokale Ausdehnung); Empf. 16.7 (EK, geprüft 2026)'
    recommendation_grade: EK
    evidence_level: n/a
  - source: S3-LL Lungenkarzinom
    version: 5.1 (Juli 2026, AWMF 020-007OL)
    url: https://www.leitlinienprogramm-onkologie.de/leitlinien/lungenkarzinom
    section: Empf. 16.6 (A, LoE 2, geprüft 2026) — einmaliges CT Thorax nach lokal ablativer Therapie
      NSCLC Stadium III zum Ausschluss einer Progression vor Durvalumab
    recommendation_grade: A
    evidence_level: '2'
  - source: Onkopedia NSCLC
    version: Stand April 2025
    url: https://www.onkopedia.com/de/onkopedia/guidelines/lungenkarzinom-nicht-kleinzellig-nsclc
    section: 'Kap. 8.1, Tab. 12 (CT Thorax: X Mo 12/24/36/48/60; X* Mo 3/6/18 nur nach Strahlentherapie);
      Kap. 6.2.2.1 (Strahlenpneumonitis, oft Übergang in pulmonale Fibrose; Auftreten innerhalb von 6–24
      Monaten nach Ende der Bestrahlung; Thorax-CT zur Diagnostik der Strahlenpneumonitis geeignet)'
    recommendation_grade: n/a
    evidence_level: n/a
  - source: Onkopedia SCLC
    version: Stand August 2026
    url: https://www.onkopedia.com/de/onkopedia/guidelines/lungenkarzinom-kleinzellig-sclc
    section: Kap. 10.2, Tab. 9 (CT Thorax an allen 9 Zeitpunkten Mo 3–60)
    recommendation_grade: n/a
    evidence_level: n/a
