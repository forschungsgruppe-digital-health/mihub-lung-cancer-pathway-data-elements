issues:
- 'followUpInterval: Die Granularität vereinheitlichen. Entweder einen zusammengesetzten S3-Code „Q3M-Y1-Y2;Q6M-Y3-Y5“
  analog zu den Onkopedia-Gesamtrastern (und wie in followUpVisitDate.frequency_pattern) einführen, oder
  bei Phasen-Codes die Kardinalität auf 0..* mit Gültigkeitszeitraum je Phase umstellen bzw. FHIR Timing
  verwenden (siehe value_set.notes). Bei 1..1 ist das vollständige S3-Schema derzeit nicht mit einem Code
  darstellbar. Auch Q6-8W-curative-recurrence ist kein eigenständiges Raster, sondern ein Modifikator,
  der zusätzlich zu einem Basisraster gilt (Onkopedia NSCLC Kap. 8.1: Verkürzung des Nachsorgeintervalls
  auf 6–8 Wochen bei Rezidiv oder Zweitkarzinom mit kurativem Potenzial) – ein weiteres Argument für 0..*
  bzw. FHIR Timing.'
