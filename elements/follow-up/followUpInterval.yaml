id: mihub.lung.followup.followUpInterval.v0.1
uuid: 2fb0d5b0-de90-514f-ab0e-204c5831ba0a
name: followUpInterval
label_de: Nachsorgeintervall
definition_de: Festgelegtes Untersuchungsintervall in der strukturierten Nachsorge nach lokal-ablativer
  Therapie.
phase: followup
tumor_entity:
- NSCLC
- SCLC
category: versorgungsplanung
datatype: code
cardinality: 1..1
value_set:
  binding_strength: example
  standard_binding_status: no-standard-found
  notes: Keine etablierte Standardisierung für Nachsorge-Intervall-Pattern dieser Granularität (SNOMED
    CT, LOINC, oBDS kennen keine deckungsgleichen Codes). Die Codes sind projekt-lokale Platzhalter, abgeleitet
    aus S3-LL Lungenkarzinom Empf. 16.7 (EK), Onkopedia NSCLC Tab. 12 (Stand April 2025) und Onkopedia
    SCLC Tab. 9 (Stand August 2026). Perspektivisch entweder als FHIR Timing/Period datentypisiert oder
    als kontrolliertes ValueSet im 'mihub'-Namensraum publiziert.
  codings:
  - system: local-no-standard-binding
    code: Q3M-Y1-Y2
    display: alle 3 Monate, Jahr 1–2
  - system: local-no-standard-binding
    code: Q6M-Y3-Y5
    display: alle 6 Monate, Jahr 3–5
  - system: local-no-standard-binding
    code: Q12M-PostY5
    display: jährlich ab Jahr 6 – Überführung in ein LDCT-Früherkennungsprogramm (S3 Empf. 16.7); jährliche
      Niedrigdosis-CT nach S3-Statement 5.2 für asymptomatische Risikopersonen, für Patient:innen nach
      Lungenkarzinom nicht gesondert festgelegt
  - system: local-no-standard-binding
    code: Q3M-Y1;Q6M-Y2;Q12M-Y3-Y5
    display: alle 3 Monate Jahr 1, alle 6 Monate Jahr 2, jährlich Jahr 3–5 (SCLC; Onkopedia SCLC Tab.
      9)
  - system: local-no-standard-binding
    code: M3;M6;M12;M18;M24;M36;M48;M60
    display: Onkopedia-NSCLC-Raster Tab. 12 (Monate 3/6/12/18/24/36/48/60)
  - system: local-no-standard-binding
    code: Q6-8W-curative-recurrence
    display: alle 6–8 Wochen bei Rezidiv/Zweitkarzinom mit kurativem Potenzial (Onkopedia NSCLC Kap. 8.1)
care_process:
  trigger: Festlegung im Nachsorgeplan
  frequency_pattern: Q3M-Y1-Y2;Q6M-Y3-Y5;Q12M-PostY5
  responsible_role: Onkologe / Pneumologe
evidence:
  guideline_references:
  - source: S3-LL Lungenkarzinom
    version: 5.1 (Juli 2026, AWMF 020-007OL)
    url: https://www.leitlinienprogramm-onkologie.de/leitlinien/lungenkarzinom
    section: Empf. 16.7 (EK, geprüft 2026)
    recommendation_grade: EK
    evidence_level: n/a
  - source: Onkopedia NSCLC
    version: Stand April 2025
    url: https://www.onkopedia.com/de/onkopedia/guidelines/lungenkarzinom-nicht-kleinzellig-nsclc
    section: 'Kap. 8.1, Tabelle 12 (NSCLC: Mo 3,6,12,18,24,36,48,60); Kap. 8.1 Text (6–8 Wochen bei kurativem
      Rezidiv-/Zweittumorpotenzial)'
    recommendation_grade: n/a
    evidence_level: n/a
  - source: Onkopedia SCLC
    version: Stand August 2026
    url: https://www.onkopedia.com/de/onkopedia/guidelines/lungenkarzinom-kleinzellig-sclc
    section: 'Kap. 10.2, Tabelle 9 (SCLC: 3,6,9,12,18,24,36,48,60 Mo)'
    recommendation_grade: n/a
    evidence_level: n/a
  - source: S3-LL Lungenkarzinom
    version: 5.1 (Juli 2026, AWMF 020-007OL)
    url: https://www.leitlinienprogramm-onkologie.de/leitlinien/lungenkarzinom
    section: 'Statement 5.2 (Evidenzbasiertes Statement, LoE 1, Starker Konsens, geprüft 2026): asymptomatische
      Risikopersonen profitieren in der Regel von einem strukturierten Früherkennungsprogramm mittels
      jährlicher Niedrigdosis-CT – nur indirekter Bezug für Q12M-PostY5 (Population nicht Patient:innen
      nach Lungenkarzinom; Übertragung über Empf. 16.7)'
    recommendation_grade: Statement
    evidence_level: '1'
