id: mihub.lung.followup.petCtFollowUp.v0.1
uuid: f754adb0-ab88-5b64-a404-0669c0e6b938
name: petCtFollowUp
label_de: PET-CT in der Nachsorge
definition_de: Datum eines FDG-PET-CT in der Nachsorge; indikationsbezogen zum Ausschluss von Metastasen
  vor erneutem thoraxchirurgischem Eingriff (S3 Tab. 44) bzw. bei V. a. lokalisiertes oder lokal behandelbares
  Rezidiv (Onkopedia SCLC Kap. 10.2, Tab. 9 Fußnote); nicht Bestandteil der strukturierten Routine-Nachsorge
  (Onkopedia NSCLC Tab. 12, SCLC Tab. 9). In einer monozentrischen Studie (n = 98, zweijährige Nachbeobachtung)
  zeigte die PET/CT in der Nachsorge nach kurativ intendierter NSCLC-Behandlung keinen Vorteil gegenüber
  CT mit Kontrastmittel (S3 Kap. 6.3.2.1).
phase: followup
tumor_entity:
- NSCLC
- SCLC
category: bildgebung
datatype: dateTime
cardinality: 0..*
value_set:
  binding_strength: extensible
  standard_binding_status: mapped
  codings:
  - system: snomed-ct
    code: '450436003'
    display: Positron emission tomography with computed tomography
  - system: ops
    code: 3-752
    display: Positronenemissionstomographie mit Computertomographie [PET/CT] des gesamten Körperstammes
  - system: kdl
    code: DG020109
    display: PET-Befund
  - system: snomed-ct
    code: '1373815000'
    display: PET-CT using fluorodeoxyglucose (18-F)
standard_mappings:
- standard: fhir-mii-kds
  profile_or_url: https://www.medizininformatik-initiative.de/fhir/ext/modul-bildgebung/StructureDefinition/mii-pr-bildgebung-bildgebungsstudie
  resource: ImagingStudy
  path: ImagingStudy.started
  notes: MII KDS Bildgebung 2026.0.0 (MII_PR_Bildgebung_Bildgebungsstudie); ImagingStudy.started 0..1
    MS. Modalität über ImagingStudy.modality bzw. ImagingStudy.series.modality (1..1, REQUIRED DICOM CID
    33, System http://dicom.nema.org/resources/ontology/DCM), hier PT für die PET-Serien und CT für die
    CT-Serien. Das Profil beschreibt eine DICOM-Studie; ohne DICOM-Studie alternativ Procedure https://www.medizininformatik-initiative.de/fhir/ext/modul-bildgebung/StructureDefinition/mii-pr-bildgebung-bildgebungsprozedur
    mit Procedure.performed[x] (1..1; code.coding:sct REQUIRED an Nachfahren von 363679005 Imaging, dazu
    coding:ops und coding:loinc).
care_process:
  trigger: geplanter erneuter thoraxchirurgischer Eingriff bei Rezidiv/Zweittumor (S3 Tab. 44); V. a.
    lokalisiertes bzw. lokal behandelbares Rezidiv (Onkopedia SCLC Kap. 10.2, Tab. 9 Fußnote)
  frequency_pattern: ad-hoc
  responsible_role: Nuklearmedizin / Radiolog:in / Thoraxchirurg:in
  data_flows:
  - system: ris-pacs
    actor_role: Radiolog:in
    usage_type: capture
    sector: sektorenuebergreifend
  - system: kis
    actor_role: Onkolog:in / Pneumolog:in
    usage_type: read
    sector: stationaer
  - system: pvs
    actor_role: Hausärzt:in
    usage_type: read
    sector: ambulant
evidence:
  guideline_references:
  - source: S3-LL Lungenkarzinom
    version: 5.1 (Juli 2026, AWMF 020-007OL)
    url: https://www.leitlinienprogramm-onkologie.de/leitlinien/lungenkarzinom
    section: 'Tab. 44 (PET-CT: Ausschluss von Metastasen vor erneutem thoraxchirurgischem Eingriff); Kap.
      6.3.2.1 (Hintergrundtext: monozentrische Studie, n = 98, nach kurativ intendierter NSCLC-Behandlung
      – kein Vorteil der PET/CT in der Nachsorge gegenüber CT mit Kontrastmittel [349]); Kap. 6.3.1 (nur
      Methodik: F-18-FDG als in der Praxis fast ausschließlich eingesetzter Tracer)'
    recommendation_grade: n/a
    evidence_level: n/a
    quote: In einer monozentrischen Studie mit 98 Patienten nach kurativ intendierter Behandlung … konnte
      … kein Vorteil beim Einsatz der PET/CT in der Nachsorge im Vergleich zur CT mit Kontrastmittel nachgewiesen
      werden ([349]). … PET-CT Ausschluss von Metastasen vor erneutem thoraxchirurgischem Eingriff
    accessed: '2026-10-15'
    locator: Kap. 6.3.2.1, S. 123; Kap. 16.4, Tab. 44, S. 499
  - source: Onkopedia SCLC
    version: Stand August 2026
    url: https://www.onkopedia.com/de/onkopedia/guidelines/lungenkarzinom-kleinzellig-sclc
    section: Tab. 9 Fußnote („ggf. einschließlich PET-CT“); Kap. 6.1.2.1 (PET-CT + MRT Schädel vor Re-Resektion/CRT)
    recommendation_grade: n/a
    evidence_level: n/a
    quote: Zuvor sollte mittels PET-CT und ggf. weiterem mediastinalem Staging ein N2- oder ein N3-Befall
      ausgeschlossen werden … ist die Diagnostik durch weitere Bildgebung ggf. einschließlich PET-CT und/oder
      Methoden zur histologischen Sicherung zu ergänzen.
    accessed: '2026-10-15'
    locator: Kap. 6.1.2.1; Kap. 10.2, Text unter Tab. 9
  - source: Expert:innen-Erhebung MiHUB
    version: Excel-Erhebung Nachsorge-WG, Stand 2026-07-30 (Lungenkrebszentrum; Vorlage datenelement-erhebung_Nachsorge_WG_ak.xlsx)
    section: 'DE-024 PET CT (Onkologische Nachsorge; Trigger lt. Erhebung: Ausschluss von Metastasen vor
      erneutem thoraxchirurgischem Eingriff)'
    recommendation_grade: n/a
    evidence_level: n/a
    locator: docs/reviews/2026-10-13-erhebungen.md#wg-de-024
    quote: PET CT … Ausschluss von Metastasen vor erneutem thoraxchirurgischem Eingriff … S3-LL Lungenkarzinom
      … Apr 2026 Tab 44
    accessed: '2026-10-15'
