label_de: CT Abdomen in der Nachsorge
definition_de: Datum eines Abdomen-CT bei Verdacht auf oder zum Ausschluss abdomineller Metastasen bzw.
  als CT-Option des Nachsorgetermins (alternativ zur Sonografie).
phase: followup
tumor_entity:
- NSCLC
- SCLC
category: bildgebung
datatype: dateTime
cardinality: 0..*
value_set:
  binding_strength: extensible
  standard_binding_status: mapped
  codings:
  - system: snomed-ct
    code: '169070004'
    display: CT of abdomen
  - system: ops
    code: 3-225
    display: Computertomographie des Abdomens mit Kontrastmittel
  - system: ops
    code: 3-207
    display: Native Computertomographie des Abdomens
  - system: kdl
    code: DG020103
    display: CT-Befund
standard_mappings:
- standard: fhir-mii-kds
  profile_or_url: https://www.medizininformatik-initiative.de/fhir/ext/modul-bildgebung/StructureDefinition/mii-pr-bildgebung-bildgebungsstudie
  resource: ImagingStudy
  path: ImagingStudy.started
  notes: MII KDS Bildgebung 2026.0.0 (MII_PR_Bildgebung_Bildgebungsstudie); ImagingStudy.started 0..1
    MS. Modalität über ImagingStudy.modality bzw. ImagingStudy.series.modality (1..1, REQUIRED DICOM CID
    33, System http://dicom.nema.org/resources/ontology/DCM), hier CT. Das Profil beschreibt eine DICOM-Studie;
    ohne DICOM-Studie alternativ Procedure https://www.medizininformatik-initiative.de/fhir/ext/modul-bildgebung/StructureDefinition/mii-pr-bildgebung-bildgebungsprozedur
    mit Procedure.performed[x] (1..1; code.coding:sct REQUIRED an Nachfahren von 363679005 Imaging, dazu
    coding:ops und coding:loinc).
care_process:
  trigger: V. a. abdominelle Metastasen; indikationsbezogen bzw. als CT-Option des Nachsorgetermins
  frequency_pattern: per-imaging-event
  responsible_role: Radiolog:in
  data_flows:
  - system: ris-pacs
    actor_role: Radiolog:in
    usage_type: capture
    sector: sektorenuebergreifend
  - system: kis
    actor_role: Onkolog:in / Pneumolog:in
    usage_type: read
    sector: stationaer
  - system: pvs
    actor_role: Hausärzt:in
    usage_type: read
    sector: ambulant
