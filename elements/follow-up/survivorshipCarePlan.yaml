name: survivorshipCarePlan
label_de: Survivorship Care Plan / Onkologischer Abschlussbericht
definition_de: Strukturierter Abschluss-/Survivorship-Care-Plan (Behandlungszusammenfassung und Nachsorgeplan),
  der Diagnose inkl. Stadium, erhaltene Therapien, aktuelle Medikation/Medikationsplan, Komplikationen
  sowie mögliche Lang- und Spätfolgen (priorisiert nach Eintrittswahrscheinlichkeit), Kontrollintervalle/weiteres
  Prozedere, red flags und das Vorgehen bei Rezidivverdacht (rasche Wiedervorstellung), Impfhinweise/Impfstatus
  (bei Relevanz) sowie Kontaktdaten enthält und an die Hausarztpraxis übergeben wird.
phase: followup
tumor_entity:
- NSCLC
- SCLC
