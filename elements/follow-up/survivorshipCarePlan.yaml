issues:
- S3-LL Lungenkarzinom 5.1 enthält keine Empfehlung zu Survivorship Care Plan / Abschlussbericht (Survivorship
  nur als Forschungsbedarf Kap. 16.3) — Fremdquellen (AG LONKO, Klein 2026, OCP) beibehalten.
- 'Zeitpunkt klären: OCP Lung (AU) Step 5.1 sieht Treatment summary und Survivorship care plan nach Abschluss
  der Initialtherapie vor, mit Aktualisierung bei Änderungen (Step 5.2); Klein 2026 beschreibt den onkologischen
  Abschlussbericht nach abgeschlossener onkologischer Nachsorge beim Übergang in die hausärztliche Versorgung.
  AG LONKO (UAG Daten Kap. 4) begründet Nachsorgepläne und -pässe mit der „Lost in Transition“-Problematik
  nach Abschluss der regulären Nachsorgephase; der Survivorship-Beginn ab Diagnosestellung (UAG Versorgungsmodelle
  Kap. 2) betrifft Survivorship-Programme, nicht den Zeitpunkt des Dokuments. Trigger „Abschluss strukturierte
  Nachsorge / Übergang Hausarzt“ und frequency „once-per-transition“ bilden nur den Zeitpunkt nach Klein
  2026 ab. Entscheiden, ob das Element beide Dokumente umfasst (dann z. B. „bei Therapieende und bei Übergang
  in die hausärztliche Versorgung; Aktualisierung bei Änderungen“) oder getrennt wird.'
- 'Dokumentklasse prüfen: KDL SD150101 „Follow up-Bogen“ (Definition: Angaben im Rahmen der Nachsorge
  zur Erfassung der Verlaufskontrolle nach Abschluss der Behandlung) beschreibt ein Verlaufsformular,
  keinen Abschlussbericht oder Survivorship Care Plan an die Hausarztpraxis. Da das Element selbst ein
  Dokument ist (DocumentReference.type), ist die passende Dokumentklasse maßgeblich. Kandidaten aus der
  Unterklasse AD0101 „Arztberichte“ (alle aktiv, MII TermServ): AD010110 „Ärztlicher Verlaufsbericht“
  (wie im übergeordneten Element dischargeOrVisitReport), AD010111 „Ambulanzbrief“ (Zusammenfassung einer
  ambulanten Behandlung in Briefform) und AD010199 „Sonstiger Arztbericht“. LOINC 74156-1 bleibt passend.'
