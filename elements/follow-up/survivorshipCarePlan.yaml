evidence:
  guideline_references:
  - source: AG LONKO / Survivorship
    version: Empfehlungspapiere UAG Daten (17.06.2021) und UAG Versorgungsmodelle (18.06.2021), Nationaler
      Krebsplan
    url: https://www.bundesgesundheitsministerium.de/fileadmin/Dateien/3_Downloads/N/Nationaler_Krebsplan/Empfehlungspapier_UAG_Daten_AG_LONKO_bf.pdf
    section: 'UAG Daten Kap. 4 (Lost-in-Transition; Nachsorgepässe mit Nachsorgeempfehlungen, Tumordiagnose/-therapie
      inkl. Komplikationen und Komorbiditäten); UAG Versorgungsmodelle Kap. 1 (Zielsetzung 3: Koordination
      Spezialist:innen ↔ nachsorgende Ärzt:innen) und Kap. 2 (Survivorship ab Diagnosestellung, ohne zeitliche
      Begrenzung)'
    recommendation_grade: n/a
    evidence_level: n/a
    quote: Neben den Nachsorgeempfehlungen sollten die vorhandenen bzw. noch zu etablierenden Nachsorgepässe
      auch die Informationen zur Tumordiagnose und -therapie (einschließlich deren Komplikationen) sowie
      die ggf. bestehenden Komorbiditäten des/der Patienten/Patientin zusammenfassen.
    accessed: '2026-10-15'
    locator: AG LONKO UAG Daten (Stand 17.06.2021), Kap. 4 Grundsätzlicher Datenbedarf, S. 8
  - source: OCP Lung (AU)
    version: 2nd ed. 2021 (Update 07/2025)
    url: https://www.cancer.org.au/assets/pdf/ocp/lung-cancer-2nd-edition
    section: 'Step 5.1 (Treatment summary: u. a. Diagnose inkl. Stadium, Therapien, Spätfolgen, Follow-up-Schema,
      Kontaktdaten) / Step 5.2 (Survivorship care plan inkl. rascher Wiedervorstellung bei Rezidivverdacht)
      / Step 5.4.4 (Kommunikation mit dem GP: follow-up care plan, late effects)'
    recommendation_grade: n/a
    evidence_level: n/a
    quote: The treatment summary should cover … • diagnosis including stage, prognostic or severity score
      … • potential long-term and late effects of treatment … • contact information for key healthcare
      providers. … a process for rapid re-entry to specialist medical services for suspected recurrence.
    accessed: '2026-10-15'
    locator: OCP Lung, Step 5.1 (S. 42) und Step 5.2 (S. 44)
  - source: andere
    version: Klein A-A et al. 2026, Die Onkologie 32(1):91–99 (online 02.12.2025), doi:10.1007/s00761-025-01867-1
    url: https://doi.org/10.1007/s00761-025-01867-1
    section: 'Klein A-A et al. 2026, Projekt LoTeCaS-GP (qualitative Studie: Interviews mit 14 Hausärzt:innen,
      Thinking-aloud-Interview mit 1 Onkologin, Workshop mit 6 Hausärzt:innen und 1 Onkologin; keine Empfehlungsgrade)
      – Abb. 2 (S. 95) bzw. Anhang 2, Empfehlungsliste zum Verfassen onkologischer Abschlussberichte:
      Dos – Relevante Informationen (Anamnese, Abschlussstatus und Epikrise / Therapie(n) inkl. möglicher
      Spätfolgen unter Berücksichtigung ihrer Eintrittswahrscheinlichkeit / Weiteres: Prozedere zur hausärztlichen
      Versorgung inkl. zeitlicher Bewertung, Impfhinweise und Impfstatus, Kontaktdaten); Format (Generelle
      Formathinweise / Weiteres Prozedere / Diagnostik); Don''ts'
    recommendation_grade: n/a
    evidence_level: n/a
    quote: ▪ aktuelle Medikation/Medikationsplan ▪ erfolgte Therapie(n) mit möglichen Spätfolgen unter
      Berücksichtigung ihrer Eintrittswahrscheinlichkeit … ▪ weiteres Prozedere zur hausärztlichen Versorgung
      inkl. zeitl. Bewertung … Hinweise zum Impfen + Impfstatus ▪ Kontaktdaten
    accessed: '2026-10-15'
    locator: Klein et al. 2026, Abb. 2 (S. 95) = Anhang 2, Dos – Therapie(n)/Weiteres
