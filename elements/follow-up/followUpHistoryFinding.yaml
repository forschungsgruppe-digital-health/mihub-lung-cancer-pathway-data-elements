issues:
- 'followUpHistoryFinding value_set: Element-Code und Antwortwerte trennen. Element- bzw. Sektionsebene:
  LOINC 10164-2 (Narrativ) bzw. SNOMED 84100007 (Tätigkeit „History taking“), konsistent mit historyTakingPrimaryCare,
  das diese Codes bereits auf Element-Ebene führt. Antwortwerte nur Clinical findings (Symptome und „unauffällig“).
  KDL AU010101 nur als DocumentReference.type führen. Im standard_mappings-Pfad Encounter.reasonCode nicht
  streichen, sondern auf ungeplante, symptomgetriggerte Vorstellungen beschränken (dann Encounter auch
  als resource führen); bei geplanten Nachsorgeterminen ist der Anlass die Nachsorge selbst, der Befund
  gehört in Observation.code (Symptom) mit Wert bzw. in Condition.code. Die Rollentrennung katalogweit
  als Schema-Konvention festlegen (vgl. den offenen Punkt zu followUpVisitDate), nicht nur in diesem Element.'
- 'Surveillance-Asymmetrie: physicalExaminationFinding ist an surveillanceVisit gekoppelt, followUpHistoryFinding
  nicht, obwohl S3-LL Lungenkarzinom 5.1 Empf. 16.9 Anamnese und körperliche Untersuchung gemeinsam als
  Basis der Evaluation einen Monat nach Abschluss der Behandlung nennt (für die folgenden Wiedervorstellungen
  nur „geeignete Untersuchungsverfahren“) und die Expert:innen-Erhebung DE-042 (Anamnese, Surveillance)
  kein Befundelement hat. Zu entscheiden: followUpHistoryFinding phasenübergreifend nutzen (isPartOf surveillanceVisit
  und postInductionEvaluationDate, Trigger und Label erweitern) oder ein eigenes Surveillance-Anamnese-Element
  anlegen. In beiden Fällen die Abgrenzung zu adverseEventCtcae, patientReportedSymptomWeb und weightChangePercent
  prüfen, die Teile des Beschwerdebilds bereits abdecken, um Dubletten zu vermeiden.'
