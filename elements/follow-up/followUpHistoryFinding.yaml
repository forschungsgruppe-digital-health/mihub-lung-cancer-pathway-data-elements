label_de: Nachsorge-Anamnese — Befund
definition_de: Strukturiert erfasste anamnestische Angaben des Nachsorgetermins (z. B. Husten, Dyspnoe,
  Hämoptysen, Thoraxschmerz, Gewichtsverlust, neurologische Symptome, neue Beschwerden) bzw. „unauffällig“.
  Dient der Rezidiv-, Zweittumor- und Nebenwirkungserkennung; ergänzt smokingStatus (Rauchanamnese) und
  postTherapyComplication.
