issues:
- 'value_set followUpVisitDate: (a) Elementspezifisch: ICD-10-GM Z08 ist nicht endständig und damit nicht
  kodierfähig; stattdessen die endständigen Codes Z08.0/Z08.1/Z08.2/Z08.7 (ggf. Z08.8/Z08.9) je Therapiemodalität
  verwenden, und zwar nur in der Rolle Behandlungsanlass (Encounter.reasonCode bzw. Encounter.diagnosis
  → Condition). (b) Katalogweit entscheiden, wie Codings unterschiedlicher Rollen getrennt werden: SNOMED
  185389009/390906007 sind Kontakttypen (Encounter.type), KDL SD150101 ist eine Dokumentklasse (DocumentReference.type
  des Nachsorgebogens) und steht auch in structuredFollowUpPlan, survivorshipCarePlan und structuredSurveillancePlan.
  Denkbar ist eine Schema-Erweiterung codings[].role (concept/encounter-type/document-class/answer), statt
  die Rollen nur in diesem Element zu trennen.'
