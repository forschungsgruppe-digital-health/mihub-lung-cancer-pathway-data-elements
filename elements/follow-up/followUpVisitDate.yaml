name: followUpVisitDate
label_de: Nachsorgetermin — Datum (Anamnese und körperliche Untersuchung)
definition_de: Datum jedes strukturierten Nachsorgetermins nach kurativ intendierter (lokal-ablativer)
  Therapie, an dem eine dezidierte Anamnese und eine körperliche Untersuchung erfolgen – einschließlich
  der Erstvorstellung innerhalb von 8 Wochen nach Therapieabschluss und aller Folgetermine. Die Erstvorstellung
  wird zusätzlich gesondert als firstFollowUpVisitDate erfasst; dessen Wert entspricht dem frühesten followUpVisitDate
  nach Therapieende. Anker für alle per-encounter-Elemente der Phase; bildet das Zeitraster der strukturierten
  Nachsorge als Ereignis ab.
