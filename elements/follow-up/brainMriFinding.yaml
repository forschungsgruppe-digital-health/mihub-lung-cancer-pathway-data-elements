issues:
- 'oBDS-Mapping korrigieren: standard_mappings[obds].resource „Verlaufsmodul / ZNS-Metastasierung“ entspricht
  keinem oBDS-Feld (oBDS-XSD 3.0.4/3.0.5). Fachlich passend ist Verlauf → Tumorstatus Fernmetastasen (oBDS
  17.5: K keine Fernmetastasen nachweisbar, T Fernmetastasen Residuen, P Fernmetastasen Progress, N Fernmetastasen
  No Change, R neu aufgetretene Fernmetastase(n) bzw. Metastasenrezidiv, F fraglicher Befund, U unbekannt,
  X fehlende Angabe) in Kombination mit Fernmetastase → Lokalisation (oBDS 11.1) = BRA „Hirn“ und Diagnosedatum
  (oBDS 11.2). FHIR-seitig MII KDS Onkologie 2027.0.0-ballot.1: mii-pr-onko-verlauf, component:Fernmetastasen_Verlauf
  (ValueSet mii-vs-onko-verlauf-fernmetastasen), sowie mii-pr-onko-fernmetastasen (ValueSet mii-vs-onko-fernmetastasen).
  Der Tumorstatus bezieht sich auf alle Fernmetastasen, nicht nur auf das ZNS, und führt für „regredient“
  keinen eigenen Wert. Zu entscheiden sind die Zielfelder des Mappings und die Zuordnung der Befundkategorien
  zu den oBDS-Werten.'
