id: mihub.lung.followup.brainMriFinding.v0.1
uuid: 380a4f95-544d-5848-9438-cdc316b0763c
name: brainMriFinding
label_de: Schädel-MRT — Befund
definition_de: 'Befund-Kategorisierung der Schädel-MRT hinsichtlich Hirnmetastasen. Ergebnisartefakt zur
  Prozedur ''brainMriHighRisk'' (Nachsorge) bzw. ''brainMriUnderTherapy'' (Surveillance). Erfasst den
  Hirnmetastasen-Status: Hirnmetastasen neu nachgewiesen (Erstnachweis bzw. Rezidiv nach metastasenfreiem
  Intervall); bei bestehenden Hirnmetastasen Verlauf stabil (persistierend), regredient oder progredient
  (zusätzliche und/oder größenprogrediente Herde); kein Nachweis von Hirnmetastasen; unklarer Befund.'
phase: followup
tumor_entity:
- NSCLC
- SCLC
category: befund
datatype: CodeableConcept
cardinality: 0..*
value_set:
  binding_strength: extensible
  standard_binding_status: mapped
  codings:
  - system: snomed-ct
    code: '94225005'
    display: Metastatic malignant neoplasm to brain
  - system: snomed-ct
    code: '359746009'
    display: Patient's condition stable
  - system: snomed-ct
    code: '260415000'
    display: Not detected
  - system: snomed-ct
    code: '419984006'
    display: Inconclusive
  - system: kdl
    code: DG020107
    display: MRT-Befund
  - system: snomed-ct
    code: '268910001'
    display: Patient's condition improved
  - system: snomed-ct
    code: '271299001'
    display: Patient's condition worsened
standard_mappings:
- standard: fhir-mii-kds
  profile_or_url: https://www.medizininformatik-initiative.de/fhir/ext/modul-bildgebung/StructureDefinition/mii-pr-bildgebung-radiologischer-befund
  resource: DiagnosticReport
  path: DiagnosticReport.conclusionCode
  notes: MII KDS Bildgebung 2026.0.0 (MII_PR_Bildgebung_Radiologischer_Befund). conclusionCode 0..* MS
    ('Strukturiertes Fazit') mit den Slices coding:sct (REQUIRED https://www.medizininformatik-initiative.de/fhir/ext/modul-bildgebung/ValueSet/mii-vs-bildgebung-findings-sct
    = < 404684003 |Clinical finding|) und coding:icd10-gm (REQUIRED ICD-10-GM). DiagnosticReport.imagingStudy
    1..* ist Pflicht (Referenz auf mii-pr-bildgebung-bildgebungsstudie der Untersuchung brainMriHighRisk
    bzw. brainMriUnderTherapy); DiagnosticReport.code mit LOINC-Slice REQUIRED mii-vs-bildgebung-diagnostic-report-code-lnc
    (Dokument-LOINC der Radiologie). Anzahl und Größe der Herde optional als Observation https://www.medizininformatik-initiative.de/fhir/ext/modul-bildgebung/StructureDefinition/mii-pr-bildgebung-radiologische-beobachtung
    über DiagnosticReport.result. Werte, die keine Clinical findings sind, siehe offener Punkt.
- standard: obds
  profile_or_url: https://www.basisdatensatz.de/basisdatensatz
  resource: 17 Verlauf; 11 Fernmetastasen
  path: '17.5 Tumorstatus Fernmetastasen (Verlauf/Verlauf_Tumorstatus_Fernmetastasen: K, T, P, N, R, F,
    U, X) mit 17.1 Untersuchungsdatum Verlauf (Verlauf/Untersuchungsdatum_Verlauf); neue Hirnmetastasen
    zusätzlich als 11.1 Lokalisation = BRA (Hirn) mit 11.2 Datum der diagnostischen Sicherung (Verlauf/Menge_FM/Fernmetastase/Lokalisation
    bzw. /Diagnosedatum)'
  notes: '''Verlaufsmodul / ZNS-Metastasierung'' ist kein oBDS-Feld. 17.5 beurteilt alle Fernmetastasen,
    nicht nur das ZNS: K keine Fernmetastasen nachweisbar, T Residuen, P Progress, N No Change, R neu
    aufgetretene Fernmetastase(n) bzw. Metastasenrezidiv, F fraglicher Befund, U unbekannt, X fehlende
    Angabe. Feldseite 17.5: https://basisdatensatz.de/feld/223/tumorstatus-fernmetastasen. Feldnummern
    nach der oBDS-Feldliste, XML-Namen nach https://basisdatensatz.de/xml/oBDS_v3.0.5.xsd. Zuordnung der
    Befundkategorien siehe offene Punkte.'
instruction_de: 'Ein Eintrag je Schädel-MRT (Cardinality 0..*). Code-Semantik: 94225005 = Hirnmetastasen
  neu nachgewiesen (Erstnachweis bzw. Rezidiv nach metastasenfreiem Intervall); bei bestehenden Hirnmetastasen
  Verlaufswerte gemäß der Trend-Konvention von recistResponse/currentTumorStatus (mCODE ConditionStatusTrendVS):
  359746009 stabil/persistierend, 268910001 regredient, 271299001 progredient (zusätzliche und/oder größenprogrediente
  Herde); 260415000 = kein Nachweis von Hirnmetastasen; 419984006 = unklarer Befund. KDL DG020107 „MRT-Befund“
  ist die Dokumentklasse des Befundberichts (Dokumenttyp, z. B. DocumentReference.type), kein Befundwert.
  Anzahl/Größe der Herde und Freitext gehören in den Befundbericht (DiagnosticReport).'
care_process:
  trigger: nach jeder Schädel-MRT
  frequency_pattern: per-imaging-event
  responsible_role: Radiologie / Onkologie
evidence:
  guideline_references:
  - source: S3-LL Lungenkarzinom
    version: 5.1 (Juli 2026, AWMF 020-007OL)
    url: https://www.leitlinienprogramm-onkologie.de/leitlinien/lungenkarzinom
    section: 'Empf. 16.8 (EK, Starker Konsens, geprüft 2026: regelmäßiges Schädel-MRT bei Hochrisiko);
      Tab. 44 (MRT: Hirn- und Knochenmetastasen); Kap. 16.3.4 Hintergrund (kein Hirnmetastasen-Screening
      ohne Risikoindikation; ED-SCLC bei Observation statt PCI MRT Schädel alle drei Monate, „Watch and
      Wait“; graduierte Empfehlung: Empf. 9.26, A, LoE 2 — active surveillance mit MRT 3-monatlich im
      1. Jahr, danach 6-monatlich); Empf. 16.9 (EK, Starker Konsens: unter Systemtherapie im Stadium IVA/B
      MRT Schädel bei Verdacht auf Hirnmetastasen)'
    recommendation_grade: EK
    evidence_level: n/a
