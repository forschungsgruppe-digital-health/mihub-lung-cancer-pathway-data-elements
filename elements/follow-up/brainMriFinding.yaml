instruction_de: 'Ein Eintrag je Schädel-MRT (Cardinality 0..*). Code-Semantik: 94225005 = Hirnmetastasen
  neu nachgewiesen (Erstnachweis bzw. Rezidiv nach metastasenfreiem Intervall); bei bestehenden Hirnmetastasen
  Verlaufswerte gemäß der Trend-Konvention von recistResponse/currentTumorStatus (mCODE ConditionStatusTrendVS):
  359746009 stabil/persistierend, 268910001 regredient, 271299001 progredient (zusätzliche und/oder größenprogrediente
  Herde); 260415000 = kein Nachweis von Hirnmetastasen; 419984006 = unklarer Befund. KDL DG020107 „MRT-Befund“
  ist die Dokumentklasse des Befundberichts (Dokumenttyp, z. B. DocumentReference.type), kein Befundwert.
  Anzahl/Größe der Herde und Freitext gehören in den Befundbericht (DiagnosticReport).'
care_process:
