issues:
- 'Zusätzliches nationales Ziel prüfen: Neben dem radiologischen Befund (MII Bildgebung, DiagnosticReport.conclusionCode)
  bildet MII KDS Onkologie den Fernmetastasen-Verlauf in mii-pr-onko-verlauf (component:Fernmetastasen_Verlauf,
  ValueSet mii-vs-onko-verlauf-fernmetastasen) und die Metastase selbst in mii-pr-onko-fernmetastasen
  ab. Der oBDS-Tumorstatus 17.5 bezieht sich auf alle Fernmetastasen, nicht nur auf das ZNS, und führt
  für „regredient“ keinen eigenen Wert (Abbildungsregel siehe folgender Punkt).'
- 'Befundkategorien von brainMriFinding auf die Zielstandards abbilden. (1) MII Bildgebung: DiagnosticReport.conclusionCode.coding:sct
  ist REQUIRED an Clinical findings (< 404684003) gebunden. 260415000 ''Not detected'' (Elternkonzept
  272519000 Absence findings) und 419984006 ''Inconclusive'' sind Qualifier-Werte und in diesem Slice
  unzulässig. Für ''unklar'' kommen Clinical findings wie 442754001 ''Inconclusive evaluation finding''
  oder 408379005 ''Imaging result equivocal'' in Frage. Für ''kein Nachweis'' ist ein Ersatz zu bestimmen
  oder die Kategorie nur oBDS-seitig abzubilden. (2) oBDS 17.5 (gilt für alle Fernmetastasen): 94225005
  → R nur bei zuvor bestehender bzw. durch Therapie erreichter Fernmetastasenfreiheit, bei bereits bestehenden
  Fernmetastasen P (Hinweis im oBDS-XSD); jeweils mit 11.1 Lokalisation BRA und 11.2 Datum. 359746009
  → N; 271299001 → P; 260415000 → K, nur wenn auch andernorts keine Fernmetastasen bestehen; 419984006
  → F. Für 268910001 ''regredient'' gibt es keinen eigenen Wert (allenfalls T Residuen). Zu entscheiden:
  Ersatzcodes für ''kein Nachweis'' und ''unklar'' sowie die verbindliche Abbildungsregel für oBDS 17.5.'
