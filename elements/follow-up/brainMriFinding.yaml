name: brainMriFinding
label_de: Schädel-MRT — Befund
definition_de: 'Befund-Kategorisierung der Schädel-MRT hinsichtlich Hirnmetastasen. Ergebnisartefakt zur
  Prozedur ''brainMriHighRisk'' (Nachsorge) bzw. ''brainMriUnderTherapy'' (Surveillance). Erfasst den
  Hirnmetastasen-Status: Hirnmetastasen neu nachgewiesen (Erstnachweis bzw. Rezidiv nach metastasenfreiem
  Intervall); bei bestehenden Hirnmetastasen Verlauf stabil (persistierend), regredient oder progredient
  (zusätzliche und/oder größenprogrediente Herde); kein Nachweis von Hirnmetastasen; unklarer Befund.'
