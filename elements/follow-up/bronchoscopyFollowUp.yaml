name: bronchoscopyFollowUp
label_de: Bronchoskopie in der Nachsorge
definition_de: Datum einer (diagnostischen) Bronchoskopie in der Nachsorge; indiziert nur bei hohem Lokalrezidivrisiko
  (z. B. nach Manschettenresektion) oder zur histologischen Sicherung bei Rezidivverdacht — keine Routine
  (nicht Bestandteil des Routine-Nachsorgeschemas nach S3 Empf. 16.7; ein Überlebensvorteil intensiver
  Nachsorge mit regelmäßiger Bronchoskopie ist bei widersprüchlicher Studienlage nicht gesichert, S3 Kap.
  16.3.4).
phase: followup
tumor_entity:
- NSCLC
- SCLC
category: prozedur
datatype: dateTime
cardinality: 0..*
value_set:
  binding_strength: extensible
  standard_binding_status: mapped
  codings:
  - system: snomed-ct
    code: '10847001'
    display: Bronchoscopy
  - system: ops
    code: 1-620
    display: Diagnostische Tracheobronchoskopie
  - system: kdl
