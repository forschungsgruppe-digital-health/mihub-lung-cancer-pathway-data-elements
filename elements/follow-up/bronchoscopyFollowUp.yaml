care_process:
  trigger: hohes Lokalrezidivrisiko (z. B. Manschettenresektion) oder V. a. lokalisiertes/lokal behandelbares
    Rezidiv (histologische Sicherung)
  frequency_pattern: ad-hoc
  responsible_role: Pneumolog:in
  data_flows:
  - system: kis
    actor_role: Onkolog:in / Pneumolog:in
    usage_type: capture
    sector: stationaer
  - system: pvs
    actor_role: Hausärzt:in
    usage_type: read
    sector: ambulant
  - system: tumordokumentation
    actor_role: Tumordokumentar:in
    usage_type: store
    sector: sektorenuebergreifend
evidence:
  guideline_references:
  - source: S3-LL Lungenkarzinom
    version: 5.1 (Juli 2026, AWMF 020-007OL)
    url: https://www.leitlinienprogramm-onkologie.de/leitlinien/lungenkarzinom
    section: 'Tab. 44 (Bronchoskopie: Hohes Lokalrezidivrisiko, z. B. Manschettenresektion [im Original
      „Maschettenresektion“]); Empf. 16.7 (EK, geprüft 2026: Routine-Nachsorge = Anamnese, körperliche
      Untersuchung, Röntgen Thorax/Sonografie Abdomen oder CT — ohne Bronchoskopie); Kap. 16.3.4 (intensive
      Nachsorge inkl. Bronchoskopie: Virgo et al. kein Überlebensvorteil [2b] vs. Westeel et al. Überlebensverlängerung,
      Lead-time-Bias offen [2b])'
    recommendation_grade: n/a
    evidence_level: n/a
    quote: Darüber hinaus erhielten die Patienten jährlich eine Bronchoskopie mit Sputum-Zytologie sowie
      eine Thorax-CT. … Die intensiven Nachsorgestrategien waren teurer, erbrachten aber keinen Überlebensvorteil
      … Bronchoskopie … Hohes Lokalrezidivrisiko (z.B. Maschettenresektion)
    accessed: '2026-10-15'
    locator: S3 Kap. 16.3.4 (S. 495); Tab. 44 (S. 499)
  - source: Onkopedia SCLC
    version: Stand August 2026
    url: https://www.onkopedia.com/de/onkopedia/guidelines/lungenkarzinom-kleinzellig-sclc
    section: 'Kap. 10.2 Nachsorge, Absatz nach Tab. 9 (bei V. a. lokalisiertes Rezidiv oder lokal behandelbare
      Rezidivsituation Ergänzung der Diagnostik durch weitere Bildgebung ggf. einschließlich PET-CT und/oder
      „Methoden zur histologischen Sicherung“); Bronchoskopie selbst nur in Kap. 5.2.1 Tab. 2 genannt
      (Erstdiagnostik bei Lungentumorverdacht, Stufe 2 „Histologische oder zytologische Sicherung“: „Bronchoskopie
      mit Biopsie … bei bildgebendem Verdacht“)'
    recommendation_grade: n/a
    evidence_level: n/a
    quote: Bronchoskopie mit Biopsie3 bei bildgebendem Verdacht … der V.a. ein lokalisiertes Rezidiv oder
      eine evtl. lokal behandelbare Rezidivsituation, ist die Diagnostik durch weitere Bildgebung ggf.
      einschließlich PET-CT und/oder Methoden zur histologischen Sicherung zu ergänzen.
    accessed: '2026-10-15'
    locator: Onkopedia SCLC Kap. 5.2.1, Tab. 2 (Stufe 2); Kap. 10.2 (Absatz nach Tab. 9)
  - source: Expert:innen-Erhebung MiHUB
    version: Excel-Erhebung Nachsorge-WG, Stand 2026-07-30 (Lungenkrebszentrum; Vorlage datenelement-erhebung_Nachsorge_WG_ak.xlsx)
    section: 'DE-023 Bronchoskopie (Onkologische Nachsorge; Trigger lt. Erhebung: hohes Lokalrezidivrisiko,
      Tab. 44)'
    recommendation_grade: n/a
    evidence_level: n/a
    locator: docs/reviews/2026-10-13-erhebungen.md#wg-de-023
    quote: Bronchoskopie … Hohes Lokalrezidivrisiko (z.B. Maschettenresektion) … S3-LL Lungenkarzinom
      … Apr 2026 Tab 44
    accessed: '2026-10-15'
