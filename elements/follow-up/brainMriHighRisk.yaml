    display: Magnetresonanztomographie des Schädels mit Kontrastmittel
  - system: kdl
    code: DG020107
    display: MRT-Befund
care_process:
  trigger: 'NSCLC — individuell hohes Risiko einer ZNS-Metastasierung (Steuerbedingung: brainMetastasisRiskProfile):
    (a) molekular/Stadium nach S3 Empf. 16.8 (EK, „sollte“): z. B. EGFR+, ALK+, ROS1+, Adenokarzinom Stadium
    III — regelmäßig nach Maßgabe des interdisziplinären Behandlungsteams; Intervall und Dauer in der
    S3 nicht festgelegt; (b) histologisch nach Onkopedia NSCLC Kap. 8.1 (ungraduiert: „sollte man durchaus
    erwägen“): z. B. großzellige Karzinome, undifferenzierte Adenokarzinome, kleinzellige Karzinome oder
    Mischtumoren, seltene Lungentumorhistologien — in Abständen von 6–9 Monaten, nur in den ersten drei
    Jahren nach Lokaltherapie. SCLC LD ohne PCI: standardmäßig gemäß Onkopedia SCLC Tab. 9 (Steuerbedingung:
    prophylacticCranialIrradiationStatus ≠ performed). ED-SCLC mit active surveillance statt PCI („Watch
    and Wait“, S3 Kap. 16.3.4; S3 Empf. 9.26: MRT 3-monatlich im 1. Jahr, danach 6-monatlich) → brainMriUnderTherapy
    (Surveillance).'
  frequency_pattern: 'NSCLC: Q6-9M-Y1-Y3 (Onkopedia; S3 nennt kein Intervall) · SCLC LD ohne PCI: Q3M-Y1;Q6M-Y2;Q12M-Y3
    (Mo 3–36 obligat, Mo 48/60 fakultativ; Onkopedia SCLC Tab. 9)'
  responsible_role: Radiologie / Onkologie
evidence:
  guideline_references:
  - source: S3-LL Lungenkarzinom
    version: 5.1 (Juli 2026, AWMF 020-007OL)
    url: https://www.leitlinienprogramm-onkologie.de/leitlinien/lungenkarzinom
    section: 'Empf. 16.8 (EK, Starker Konsens, geprüft 2026) — regelmäßiges Schädel-MRT bei Hochrisikopatient:innen
      (z. B. EGFR+, ALK+, ROS1+, Adenokarzinome Stadium III) nach Maßgabe des interdisziplinären Behandlungsteams,
      Intervall nicht festgelegt; Kap. 16.3.4 (Hintergrund: Screening auf Hirnmetastasen ohne Risikoindikation
      nicht empfohlen; abweichend in Risikosituationen beim LD-SCLC und ED-SCLC [ED-SCLC → brainMriUnderTherapy];
      Risikokollektive EGFR/ALK/ROS1 im Stadium IVA/IVB mit steigendem kumulativem Risiko); Tab. 44 (MRT:
      Hirn- und Knochenmetastasen)'
    recommendation_grade: EK
    evidence_level: n/a
  - source: Onkopedia SCLC
    version: Stand August 2026
    url: https://www.onkopedia.com/de/onkopedia/guidelines/lungenkarzinom-kleinzellig-sclc
    section: 'Kap. 10.2, Tab. 9 (MRT Schädel bei LD ohne PCI: X Mo 3/6/9/12/18/24/36, (X) Mo 48/60)'
    recommendation_grade: n/a
    evidence_level: n/a
  - source: Onkopedia NSCLC
    version: Stand April 2025
    url: https://www.onkopedia.com/de/onkopedia/guidelines/lungenkarzinom-nicht-kleinzellig-nsclc
    section: 'Kap. 8.1 (Text nach Tab. 12: MRT-Schädel alle 6–9 Monate, nur in den ersten drei Jahren
      nach Lokaltherapie, bei individuell hohem Risiko — histologische Kriterien; „sollte man durchaus
      erwägen“)'
    recommendation_grade: n/a
    evidence_level: n/a
