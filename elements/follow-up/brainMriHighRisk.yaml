id: mihub.lung.followup.brainMriHighRisk.v0.1
uuid: 371370d3-c946-5219-a108-5e5867b9ec94
name: brainMriHighRisk
label_de: Schädel-MRT bei Hochrisiko
definition_de: 'MRT des Schädels zur ZNS-Metastasen-Detektion in der Nachsorge nach kurativer Therapie
  bei Patient:innen mit erhöhtem Risiko: NSCLC mit molekularem/Stadien-Risiko (S3 Empf. 16.8: z. B. EGFR+,
  ALK+, ROS1+, Adenokarzinom Stadium III) oder histologischem Risiko (Onkopedia NSCLC Kap. 8.1: z. B.
  großzellige Karzinome, undifferenzierte Adenokarzinome, kleinzellige Karzinome oder Mischtumoren, seltene
  Lungentumorhistologien); SCLC LD ohne PCI (Onkopedia SCLC Tab. 9).'
phase: followup
tumor_entity:
- NSCLC
- SCLC
category: bildgebung
datatype: dateTime
cardinality: 0..*
value_set:
  binding_strength: preferred
  standard_binding_status: mapped
  codings:
  - system: loinc
    code: 24590-2
    display: MR Brain
  - system: snomed-ct
    code: '241601008'
    display: MRI of head
  - system: ops
    code: 3-800
    display: Native Magnetresonanztomographie des Schädels
  - system: ops
