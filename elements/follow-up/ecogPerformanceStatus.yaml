issues:
- 'Abweichung vom MII-Profil mii-pr-onko-allgemeiner-leistungszustand-ecog (MII KDS Onkologie 2025.0.4,
  2026.0.3, 2027.0.0-ballot.1): Observation.value[x] ist dort CodeableConcept 1..1 mit required-Bindung
  an mii-vs-onko-allgemeiner-leistungszustand-ecog (Codes 0–4 und U „Unbekannt“; ab 2026.0.3 als Slice
  coding:obds). Der Mapping-Pfad muss daher Observation.valueCodeableConcept.coding:obds.code statt Observation.valueInteger
  lauten. Zu klären: datatype integer (0..4) beibehalten und beim Mapping in die Profil-Codes übersetzen
  oder auf CodeableConcept umstellen und „U“ (unbekannt) zulassen.'
- 'Trigger „bei jeder Visite“ / per-encounter ist nicht wörtlich leitlinienbelegt: S3-LL Lungenkarzinom
  5.1, Empf. 8.80 „Vor Einleitung der Therapie“ (NSCLC Stadium IV) und Statement 9.2 (SCLC, ohne Zeitpunkt);
  S3 Kap. 16 und Onkopedia NSCLC Kap. 8.1, Tab. 12 nennen ECOG für die Nachsorge nicht; OCP Lung Step
  3.6.1 „should be frequently assessed“ (prätherapeutischer Kontext); S3-LL Palliativmedizin 3.0, Empf.
  5.3 „regelmäßig“ (Komplexitätseinschätzung). Als Expert:innen-Praxis MiHUB kennzeichnen oder Quelle
  ergänzen.'
- 'Ergänzung zum offenen Punkt zur Abweichung vom MII-Profil: Auch oBDS 12.1 erwartet Codes (0 bis 4,
  U) statt einer Ganzzahl. Mit der Entscheidung über den datatype zugleich festlegen, ob zusätzlich LOINC-Antwortcodes
  geführt werden (MII-ConceptMap: 0 → LA9622-2, 1 → LA9623-0, 2 → LA9624-8, 3 → LA9625-5, 4 → LA9626-3;
  für U keine Entsprechung). Die Codings 89262-0 und 423740007 des Elements bezeichnen das Merkmal (Observation.code),
  nicht den Wert.'
