  notes: 'MII KDS Onkologie 2026.0.3 (MII_PR_Onko_Allgemeiner_Leistungszustand_ECOG). value[x] 1..1 nur
    CodeableConcept, valueInteger ist unzulässig; coding:obds 1..1 REQUIRED mii-vs-onko-allgemeiner-leistungszustand-ecog;
