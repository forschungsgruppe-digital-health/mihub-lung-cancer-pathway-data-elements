issues:
- 'S3-LL Lungenkarzinom 5.1: Kap. 15 „derzeit wegen laufender Überarbeitung ausgesetzt“ — Referenz vorläufig.'
- 'Label und Definition nennen Attribute, die als einzelnes CodeableConcept (Maßnahmen-Codes) nicht erfassbar
  sind: Setting (ambulant/stationär), Status (beantragt/angetreten/abgelehnt) und ob eine Klinik mit onkologischem
  Schwerpunkt empfohlen bzw. gewählt wurde. Vorschlag: Teil-Elemente oder ein Mapping auf ServiceRequest.status/Procedure.status,
  Setting über Encounter/Location oder ein eigenes code-Element, Klinik-Schwerpunkt als boolean.'
- KDL AM010201 'Antrag auf Rehabilitation' ist eine Dokumentenklasse (KDL AM 'Administration' › AM0102
  'Anträge') und keine Leistung. Sie sollte nicht als Procedure.code, sondern gegebenenfalls als DocumentReference.type
  des Antragsdokuments (eigenes Mapping) geführt werden.
