care_process:
  trigger: Antrag / Antritt einer Rehabilitationsmaßnahme; Therapieabschluss (OP, RCT) mit Folgestörungen
  frequency_pattern: ad-hoc
  responsible_role: Sozialdienst / Onkolog:in / Reha-Einrichtung
evidence:
  guideline_references:
  - source: Onkopedia NSCLC
    version: Stand April 2025
    url: https://www.onkopedia.com/de/onkopedia/guidelines/lungenkarzinom-nicht-kleinzellig-nsclc
    section: Kap. 7 Rehabilitation (Klinik mit onkologischem Schwerpunkt, § 9 SGB IX)
    recommendation_grade: n/a
    evidence_level: n/a
    quote: Die Pat. sollen über die Möglichkeiten ambulanter und stationärer Rehabilitationsmaßnahmen
      sowie weiterer Ansprüche, die sich aus dem Sozialrecht ergeben, frühzeitig informiert werden. …
      Dennoch sollte eine Empfehlung für eine Klinik mit onkologischem Schwerpunkt abgegeben werden
    accessed: '2026-10-15'
    locator: Onkopedia NSCLC, Kap. 7 Rehabilitation
  - source: S3-LL Lungenkarzinom
    version: 5.1 (Juli 2026, AWMF 020-007OL)
    url: https://www.leitlinienprogramm-onkologie.de/leitlinien/lungenkarzinom
    section: 'Kap. 15 Rehabilitation (Kapitel ''derzeit wegen laufender Überarbeitung ausgesetzt''): Empf.
      15.5 (2010: Empfehlungsgrad D, Expertenmeinung; ausgesetzt 2026) — Operierte bzw. nach Radiochemotherapie
      mit ausgeprägten Folgestörungen einer Rehabilitation zuführen; Empf. 15.4 (2010: D; ausgesetzt 2026)
      — pneumologische Fachkompetenz der Reha-Einrichtung, Primärbehandelnde an der Klinikauswahl beteiligt'
    recommendation_grade: n/a
    evidence_level: n/a
    quote: Primärbehandelnde Ärzte sollten bei der Auswahl der geeigneten Klinik beteiligt sein. … Operierte
      Patienten und jene nach eingreifenden anderen Therapien (kombinierte … Radiochemotherapie) und mit
      ausgeprägten Folgestörungen sollten in Bezug auf … einer Rehabilitation zugeführt werden.
    accessed: '2026-10-15'
    locator: Kap. 15 Rehabilitation (ausgesetzt), Empf. 15.4 und 15.5, S. 490
  - source: Onkopedia SCLC
    version: Stand August 2026
    url: https://www.onkopedia.com/de/onkopedia/guidelines/lungenkarzinom-kleinzellig-sclc
    section: Kap. 9 Rehabilitation (Therapiefolgestörungen; frühzeitige Information über ambulante/stationäre
      Reha; Patientenwunsch, § 9 SGB IX; Empfehlung einer Klinik mit onkologischem Schwerpunkt)
    recommendation_grade: n/a
    evidence_level: n/a
    quote: Medikamentöse Tumortherapie, Operation, Strahlentherapie und Komorbidität können bei Pat. mit
      kleinzelligem Lungenkarzinom zu Therapiefolgestörungen unterschiedlichen Schwergrades führen. …
      Dennoch sollte eine Empfehlung für eine Klinik mit onkologischem Schwerpunkt abgegeben werden
    accessed: '2026-10-15'
    locator: Onkopedia SCLC, Kap. 9 Rehabilitation
