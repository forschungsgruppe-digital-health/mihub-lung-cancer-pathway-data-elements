name: rehabilitationMeasure
label_de: Rehabilitationsmaßnahme (Setting, onkologischer Schwerpunkt)
definition_de: Beantragte/durchgeführte onkologisch-pneumologische Rehabilitationsmaßnahme nach Therapie
  (AHB/Reha; ambulant/stationär; beantragt, angetreten, abgelehnt) mit Angabe, ob eine Klinik mit onkologischem
  Schwerpunkt empfohlen bzw. gewählt wurde.
phase: followup
tumor_entity:
- NSCLC
- SCLC
category: prozedur
datatype: CodeableConcept
