id: mihub.lung.followup.firstFollowUpVisitDate.v0.1
uuid: 3948c905-5fd2-5899-85b7-d2de5114bc4c
name: firstFollowUpVisitDate
label_de: Datum Erstvorstellung in der Nachsorge
definition_de: Datum der ersten klinischen Vorstellung in der Nachsorge nach Abschluss der lokal-ablativen
  Therapie (OP, RT/RCT). Die Erstvorstellung erfolgt in der Regel innerhalb von 8 Wochen nach Therapieende;
  mit ihr beginnen die Nachsorgeintervalle (S3 Empf. 16.4, 16.7). Bei NSCLC Stadium III nach RT/RCT soll
  sie innerhalb von 8 Wochen erfolgen (S3 Empf. 16.5).
phase: followup
tumor_entity:
- NSCLC
- SCLC
category: kontakt-visite
datatype: dateTime
cardinality: 1..1
value_set:
  codings:
  - system: snomed-ct
    code: '390906007'
    display: Follow-up encounter
standard_mappings:
- standard: fhir-mii-kds
  profile_or_url: https://www.medizininformatik-initiative.de/fhir/core/modul-fall/StructureDefinition/KontaktGesundheitseinrichtung
  resource: Encounter
  path: Encounter.period.start
  notes: MII KDS Fall, seit 2026 im Paket de.medizininformatikinitiative.kerndatensatz.base (2026.0.1;
    letzte Einzelversion fall 2025.0.1). Encounter.period.start 0..1 MS; Encounter.class 1..1 REQUIRED
    http://fhir.de/ValueSet/EncounterClassDE; der Kontakttyp (SNOMED 390906007 Follow-up encounter) passt
    in Encounter.type (example-gebunden). Wie bei followUpVisitDate; der Wert entspricht dem frühesten
    followUpVisitDate nach Therapieende.
- standard: fhir-r4-base
  resource: Encounter
  path: Encounter.period.start
constraints_de: Verzögerung > 8 Wochen ist als Abweichung zu dokumentieren.
care_process:
  trigger: Innerhalb 8 Wochen nach Therapieende
  frequency_pattern: once
  responsible_role: Onkologe / Pneumologe
evidence:
  guideline_references:
  - source: S3-LL Lungenkarzinom
    version: 5.1 (Juli 2026, AWMF 020-007OL)
    url: https://www.leitlinienprogramm-onkologie.de/leitlinien/lungenkarzinom
    section: 'Empf. 16.4 (EK, geprüft 2026): Erfassung posttherapeutischer Komplikationen typischerweise
      bei Vorstellung innerhalb von 8 Wochen nach Abschluss der lokalen Therapie'
    recommendation_grade: EK
    evidence_level: n/a
    quote: sollten die posttherapeutischen Komplikationen, die nach Operation oder Strahlentherapie auftreten
      können, erfasst und behandelt werden. Typischerweise erfolgt dies im Rahmen einer Vorstellung innerhalb
      von 8 Wochen nach Abschluss der lokalen Therapie.
    accessed: '2026-10-15'
    locator: Empf. 16.4 (EK, geprüft 2026, Starker Konsens), Kap. 16.3, S. 497
  - source: S3-LL Lungenkarzinom
    version: 5.1 (Juli 2026, AWMF 020-007OL)
    url: https://www.leitlinienprogramm-onkologie.de/leitlinien/lungenkarzinom
    section: 'Empf. 16.5 (A/B, LoE 2, geprüft 2026): NSCLC Stadium III nach RT/RCT — erste klinische Vorstellung
      soll innerhalb von 8 Wochen erfolgen'
    recommendation_grade: A
    evidence_level: '2'
    quote: Die erste klinische Vorstellung nach Abschluss der Strahlentherapie soll innerhalb von 8 Wochen
      erfolgen.
    accessed: '2026-10-15'
    locator: Empf. 16.5 (evidenzbasiert, geprüft 2026), Kap. 16.3, S. 497
  - source: S3-LL Lungenkarzinom
    version: 5.1 (Juli 2026, AWMF 020-007OL)
    url: https://www.leitlinienprogramm-onkologie.de/leitlinien/lungenkarzinom
    section: 'Empf. 16.7 (EK, geprüft 2026): Nachsorgeintervalle beginnen mit der Erstvorstellung innerhalb
      von 8 Wochen'
    recommendation_grade: EK
    evidence_level: n/a
    quote: Diese Intervalle beginnen mit der Erstvorstellung innerhalb von 8 Wochen nach Abschluss der
      Therapie.
    accessed: '2026-10-15'
    locator: Empf. 16.7 (EK, geprüft 2026, Starker Konsens), Kap. 16.3, S. 498
