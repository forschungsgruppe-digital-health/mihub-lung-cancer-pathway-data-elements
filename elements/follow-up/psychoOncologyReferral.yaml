id: mihub.lung.followup.psychoOncologyReferral.v0.2
uuid: ec8d4dcd-eff3-537a-be4a-9410126c4aa0
name: psychoOncologyReferral
label_de: Psychoonkologische Anbindung
definition_de: 'Psychoonkologische Anbindung im Rahmen der Nachsorge (ja/nein): Vermittlung an psychoonkologische
  Versorgung (z. B. psychoonkologischer Dienst, Krebsberatungsstelle, ambulante Psychoonkologie) nach
  identifiziertem Bedarf (z. B. positives Distress-Screening oder im strukturierten Nachsorge-/Verlaufsplan
  erkannter Bedarf).'
phase: followup
tumor_entity:
- NSCLC
- SCLC
category: mitbetreuung
datatype: boolean
cardinality: 0..1
value_set:
  binding_strength: preferred
  codings:
  - system: snomed-ct
    code: '428997004'
    display: Psychosocial counseling about cancer
  - system: snomed-ct
    code: '309625004'
    display: Referral to psychology service
care_process:
  trigger: positives Distress-Screening (z. B. Distress-Thermometer) oder anderweitig erkannter psychoonkologischer
    Bedarf im strukturierten Nachsorge-/Verlaufsplan (S3-LL Lungenkarzinom 5.1 Empf. 16.1/16.2); Bedarfsprüfung
    an Schlüsselzeitpunkten wie Therapieende, Survivorship, Rezidiv (OCP Principle 4)
  frequency_pattern: ad-hoc
  responsible_role: Onkologe / Psychoonkolog:in
evidence:
  guideline_references:
  - source: S3-LL Lungenkarzinom
    version: 5.1 (Juli 2026, AWMF 020-007OL)
    url: https://www.leitlinienprogramm-onkologie.de/leitlinien/lungenkarzinom
    section: 'Empf. 16.1 (EK, geprüft 2026); Empf. 16.2 (EK: Verlaufsplan Stadium IV); Empf. 8.77 (EK,
      geprüft 2026); Kap. 11 (Verweis auf S3-LL Psychoonkologie)'
    recommendation_grade: EK
    evidence_level: n/a
    quote: psychoonkologischen Unterstützung, Sozialberatung bzw. Unterstützung durch Selbsthilfegruppen
      … angesprochen werden. … Zur psychoonkologischen Versorgung liegt ebenfalls eine S3-Leitlinie …
      vor … den Bedarf an Psychoonkologie, Palliativmedizin und Sozialberatung zu erkennen.
    accessed: '2026-10-15'
    locator: Empf. 8.77 (EK, geprüft 2026), S. 287; Kap. 11, S. 469; Empf. 16.1/16.2 (EK, geprüft 2026),
      S. 492
  - source: OCP Lung (AU)
    version: 2nd ed. 2021 (Update 07/2025)
    url: https://www.cancer.org.au/assets/pdf/ocp/lung-cancer-2nd-edition
    section: Step 5.4.1 Supportive care (emotional distress; validierte Screening-Tools, Verweis auf Appendices
      A–C); Principle 4 Supportive care (Key review points; Entscheidung über Referral an Supportive-Care-Dienste);
      Appendix B Psychological needs (Referral-Kriterien, u. a. distress that requires specialist intervention)
    recommendation_grade: n/a
    evidence_level: n/a
    quote: The team also needs to decide whether the patient requires ongoing referral to supportive care
      services. … Consider a referral to a psychologist, psychiatrist, pastoral/spiritual care practitioner,
      social worker, specialist nurse … distress that requires specialist intervention
    accessed: '2026-10-15'
    locator: Principle 4 (S. 13–14); Step 5.4.1 (S. 46); Appendix B (S. 58)
  - source: S3-LL Lungenkarzinom
    version: 5.1 (Juli 2026, AWMF 020-007OL)
    url: https://www.leitlinienprogramm-onkologie.de/leitlinien/lungenkarzinom
    section: 'Kap. 7.3.2 Aufklärung über Behandlungsmaßnahmen (Hintergrundtext, ohne Empfehlungsgrad):
      Angebote psychoonkologischer, spiritueller und sozialrechtlicher Unterstützung ansprechen; bei Bedarf
      Kontakte vermitteln'
    recommendation_grade: n/a
    evidence_level: n/a
    quote: wie auch vorhandene Angebote psychoonkologischer, spiritueller und sozialrechtlicher Unterstützung
      sowie Leistungen durch Selbsthilfegruppen. Bei Bedarf sind entsprechende Kontakte sind zu vermitteln.
    accessed: '2026-10-15'
    locator: Kap. 7.3.2 (Hintergrundtext), S. 196
