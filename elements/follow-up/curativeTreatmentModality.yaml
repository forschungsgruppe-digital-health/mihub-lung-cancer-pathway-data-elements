      Orientierung an den NSCLC-Empfehlungen): CT Thorax an allen 9 Zeitpunkten ohne Modalitätsabhängigkeit;
      Lungenfunktion X Mo 3/6/9, (X) Mo 12/18/24, ohne Einschränkung auf Bestrahlte; modalitätsabhängig
      nur „MRT Schädel bei LD ohne PCI“'
    recommendation_grade: n/a
    evidence_level: n/a
