name: curativeTreatmentModality
label_de: Kurative Therapiemodalität (Eingangsgröße des Nachsorgeplans)
definition_de: 'Modalität der abgeschlossenen kurativ intendierten Therapie (Operation, alleinige Strahlentherapie,
  Radiochemotherapie, multimodal inkl. systemischer Therapie/Immuntherapie). Steuert die modalitätsabhängigen
  Zeitpunkte von CT Thorax (Onkopedia: Mo 3/6/18 nur nach Strahlentherapie) und Lungenfunktion (nach RT/RCT
  bis Ende des Pneumonitis-Risikos).'
