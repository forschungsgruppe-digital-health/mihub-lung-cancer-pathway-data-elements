id: mihub.lung.followup.curativeTreatmentModality.v0.1
uuid: 4cc40010-ff86-505f-bc6d-604b70406e27
name: curativeTreatmentModality
label_de: Kurative Therapiemodalität (Eingangsgröße des Nachsorgeplans)
definition_de: 'Modalität der abgeschlossenen kurativ intendierten Therapie (Operation, alleinige Strahlentherapie,
  Radiochemotherapie, multimodal inkl. systemischer Therapie/Immuntherapie). Steuert beim NSCLC die modalitätsabhängigen
  Zeitpunkte von CT Thorax (Onkopedia NSCLC Tab. 12: Mo 3/6/18 nur nach Strahlentherapie) und Lungenfunktion
  (nach RT/RCT bis Ende des Pneumonitis-Risikos). Beim SCLC sind CT Thorax und Lungenfunktion in Onkopedia
  SCLC Tab. 9 modalitätsunabhängig; modalitätsabhängig ist dort nur das Schädel-MRT (LD ohne PCI, siehe
  prophylacticCranialIrradiationStatus).'
phase: followup
tumor_entity:
- NSCLC
- SCLC
category: prozedur
datatype: CodeableConcept
cardinality: 1..*
value_set:
  binding_strength: extensible
  standard_binding_status: mapped
  codings:
  - system: snomed-ct
    code: '119746007'
    display: Lung excision
  - system: snomed-ct
    code: '1287742003'
    display: Radiotherapy
  - system: snomed-ct
    code: '703423002'
    display: Combined chemotherapy and radiation therapy
  - system: snomed-ct
    code: '367336001'
    display: Chemotherapy
  - system: snomed-ct
    code: '870387009'
    display: Immune checkpoint inhibitor therapy
  - system: ops
    code: 5-324
    display: Einfache Lobektomie und Bilobektomie der Lunge
  - system: icd-10-gm
    code: Z92.4
    display: Größerer operativer Eingriff in der Eigenanamnese, anderenorts nicht klassifiziert
  - system: icd-10-gm
    code: Z92.3
    display: Bestrahlung in der Eigenanamnese
  - system: ops
    code: 5-323
    display: Segmentresektion der Lunge
  - system: ops
    code: 5-327
    display: Einfache (Pleuro-)Pneum(on)ektomie
  - system: icd-10-gm
    code: Z92.6
    display: Zytostatische Chemotherapie wegen bösartiger Neubildung in der Eigenanamnese
  notes: 'Codings sind Therapiekomponenten (mehrere Werte je Patient:in möglich). Steuerung beim NSCLC
    (Onkopedia NSCLC Kap. 8.1, Tab. 12): CT Thorax Mo 3/6/18 („* nach Strahlentherapie“) bei jeder Therapie
    mit Strahlentherapieanteil, erkennbar an 1287742003 Radiotherapy oder 703423002 Combined chemotherapy
    and radiation therapy, jeweils einschließlich Subkonzepten (is-a, z. B. stereotaktische Strahlentherapie);
    Fortführung der Lungenfunktion bis zum Ende des Pneumonitis-Risikos nach alleiniger Strahlentherapie
    oder Radiochemotherapie. Chemotherapy (367336001) und Immune checkpoint inhibitor therapy (870387009)
    nur als Komponenten einer kurativen Therapie mit lokal ablativem Verfahren (OP, RTx, CTx/RTx; S3-LL
    Lungenkarzinom 5.1, Empf. 16.1), nicht als alleinige kurative Modalität.'
