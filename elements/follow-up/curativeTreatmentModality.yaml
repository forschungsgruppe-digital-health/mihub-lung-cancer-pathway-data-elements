    section: 'Empf. 16.5 (A/B, LoE 2, Konsens, geprüft 2026) — Population NSCLC Stadium III nach RT/RCT:
      posttherapeutische Komplikationen erfassen (sollte); erste klinische Vorstellung soll innerhalb
