    display: Größerer operativer Eingriff in der Eigenanamnese, anderenorts nicht klassifiziert
  - system: icd-10-gm
    code: Z92.3
    display: Bestrahlung in der Eigenanamnese
  - system: ops
    code: 5-323
    display: Segmentresektion der Lunge
  - system: ops
    code: 5-327
    display: Einfache (Pleuro-)Pneum(on)ektomie
  - system: icd-10-gm
    code: Z92.6
    display: Zytostatische Chemotherapie wegen bösartiger Neubildung in der Eigenanamnese
  notes: 'Codings sind Therapiekomponenten (mehrere Werte je Patient:in möglich). Steuerung beim NSCLC
    (Onkopedia NSCLC Kap. 8.1, Tab. 12): CT Thorax Mo 3/6/18 („* nach Strahlentherapie“) bei jeder Therapie
    mit Strahlentherapieanteil, erkennbar an 1287742003 Radiotherapy oder 703423002 Combined chemotherapy
    and radiation therapy, jeweils einschließlich Subkonzepten (is-a, z. B. stereotaktische Strahlentherapie);
    Fortführung der Lungenfunktion bis zum Ende des Pneumonitis-Risikos nach alleiniger Strahlentherapie
    oder Radiochemotherapie. Chemotherapy (367336001) und Immune checkpoint inhibitor therapy (870387009)
    nur als Komponenten einer kurativen Therapie mit lokal ablativem Verfahren (OP, RTx, CTx/RTx; S3-LL
    Lungenkarzinom 5.1, Empf. 16.1), nicht als alleinige kurative Modalität.'
standard_mappings:
- standard: obds
  profile_or_url: https://www.basisdatensatz.de/basisdatensatz
  resource: 13 OP / 14 Strahlentherapie / 16 Systemische Therapie
  path: 'Intention = K in 13.1 (OP/Intention), 14.1 (ST/Intention; bei lokal ablativer Bestrahlung einer
    Oligometastasierung O ''lokal kurativ bei Oligometastasierung'') bzw. 16.1 (SYST/Intention); Modalität
    über die Meldungsart sowie 13.3 OPS (OP/Menge_OPS/OPS/Code) bzw. 16.3 Art der systemischen oder abwartenden
    Therapie (SYST/Therapieart, z. B. CH, IM, CI); Radiochemotherapie: ST/Menge_Bestrahlung/Bestrahlung/Applikationsart/Perkutan/Radiochemo
    = RCJ'
  notes: 'Pflichtmeldung § 65c SGB V. Die Intention hat je Abschnitt eigene Werte (OP: K, P, D, R, S,
    X; ST: K, P, O, S, X; SYST: K, P, S, X). Bei einer Radiochemotherapie kennzeichnet RCJ (''mit Chemotherapie/Sensitizer'')
    die Bestrahlung; die begleitende Chemotherapie ist eine SYST-Meldung. Feldnummern nach der oBDS-Feldliste,
    XML-Namen nach https://basisdatensatz.de/xml/oBDS_v3.0.5.xsd.'
