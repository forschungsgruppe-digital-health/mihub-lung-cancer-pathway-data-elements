issues:
- 'Modalitätscodes von curativeTreatmentModality auf die Onko-Profile und oBDS abbilden. Für die durchgeführte
  Therapie führen MII Onkologie und oBDS keinen eigenen Modalitätscode: Je Therapie wird eine Prozedur
  (Operation, Strahlentherapie, systemische Therapie) mit Pflicht-Intention geführt (kurativ = K, bei
  lokal ablativer Strahlentherapie einer Oligometastasierung O); die Modalität ergibt sich aus Profil
  bzw. Meldungsart. Eine Therapieart-Codierung gibt es nur für Therapieempfehlungen (oBDS 19.1 Typ_Therapieempfehlung
  = MII mii-cs-onko-therapie-typ: OP, ST, CH, IM, CI …) und für die Art der systemischen Therapie (16.3);
  sie käme als Wertebereich des Elements in Frage (Radiochemotherapie = ST + CH). Vorschlag: 119746007
  und OPS 5-323, 5-324, 5-327 → Operation; 1287742003 → Strahlentherapie; 703423002 → Strahlentherapie
  (oBDS Radiochemo = RCJ) plus systemische Therapie; 367336001 → systemische Therapie, Therapieart CH
  (MII-ConceptMap mii-cm-onko-therapie-typ-sct: CH = 367336001); 870387009 → systemische Therapie, Therapieart
  IM bzw. CI (kein direkter ConceptMap-Eintrag). ICD-10-GM Z92.3, Z92.4 und Z92.6 sind Eigenanamnese-Diagnosen,
  keine Prozedurcodes, und haben in Procedure.code keinen Platz. Zu entscheiden: Abbildungstabelle festschreiben,
  die Rolle der Z92-Codes klären (Anamnese-Kodierung oder streichen) und entscheiden, ob mii-cs-onko-therapie-typ
  als Wertebereich übernommen wird.'
