issues:
- 'oBDS-Mapping korrigieren: Der path „Allgemeiner Leistungszustand / Tumorstatus_Lokoregionaeres_Tumorstatus“
  ist fehlerhaft. „Allgemeiner_Leistungszustand“ ist im oBDS der Leistungszustand (ECOG oder Karnofsky)
  und für Rezidiv/Zweittumor nicht einschlägig; ein Feld „Tumorstatus_Lokoregionaeres_Tumorstatus“ existiert
  nicht (oBDS-XSD 3.0.4 vom 15.04.2025, Verlauf_Typ). Rezidiv und Metastasierung werden in der Verlaufsmeldung
  über Gesamtbeurteilung_Tumorstatus (Y = Rezidiv), Verlauf_Lokaler_Tumorstatus (R = Lokalrezidiv), Verlauf_Tumorstatus_Lymphknoten
  (R = neu aufgetretenes Lymphknotenrezidiv) und Verlauf_Tumorstatus_Fernmetastasen (R = neu aufgetretene
  Fernmetastase(n) bzw. Metastasenrezidiv; neue Metastasen zusätzlich unter Menge_FM mit Lokalisation
  und Datum) gemeldet, ein Zweitkarzinom als eigene Diagnosemeldung. Pfad entsprechend ändern, gegen die
  bei Umsetzung gültige oBDS-Fassung prüfen und ctThoraxFinding (gleicher Fehler „Tumorstatus_Lokoregionaeres“)
  einheitlich korrigieren.'
