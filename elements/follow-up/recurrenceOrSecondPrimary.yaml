issues:
- 'recurrenceOrSecondPrimary vereint zwei Sachverhalte, die MII und oBDS getrennt modellieren: Rezidiv
  und Metastasierung als Verlaufsbeurteilung (mii-pr-onko-verlauf; oBDS 17.2 bis 17.5), das metachrone
  Zweitkarzinom als neue Primärtumor-Diagnose (mii-pr-onko-diagnose-primaertumor; oBDS eigene Diagnosemeldung).
  Vorschlag: 314954002 → Tumor_Verlauf bzw. 17.3 = R; 399409002 → Fernmetastasen_Verlauf bzw. 17.5 = R
  (Lokalisation unter 11); 1259237005 → Gesamtbeurteilung bzw. 17.2 = Y (Lokalisation offen). Bei 314954002
  und 399409002 zusätzlich Gesamtbeurteilung 17.2 = Y (im MII-Verlauf Observation.valueCodeableConcept
  = Y): 17.2 ist Pflichtfeld der Verlaufsmeldung, und Y umfasst laut oBDS-XSD Lokalrezidiv und/oder Metastasierung
  nach vorheriger kompletter Tumorfreiheit. 878806005 und ICD-10-GM C34.9 → neue Condition bzw. Diagnosemeldung.
  Für ein regionäres Lymphknotenrezidiv (17.4 = R) hat das Element keinen eigenen Code. KDL SD150103 ''Tumorkonferenzprotokoll''
  ist eine Dokumentklasse, kein Befundwert. Zu entscheiden: Element aufteilen oder Transformationsregeln
  festschreiben; außerdem, ob das kbv-mio-Mapping (Patientenkurzakte = Notfalldaten, kein Onko-Übergabeformat)
  beibehalten wird.'
