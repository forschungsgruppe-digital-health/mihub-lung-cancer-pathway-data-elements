id: mihub.lung.followup.recurrenceOrSecondPrimary.v0.1
uuid: ee807a16-d683-55eb-af59-e08706857098
name: recurrenceOrSecondPrimary
label_de: Rezidiv oder Zweittumor
definition_de: Detektion eines Lokalrezidivs, regionalen Rezidivs, einer Fernmetastasierung oder eines
  metachronen Zweitkarzinoms.
phase: followup
tumor_entity:
- NSCLC
- SCLC
category: diagnose
datatype: CodeableConcept
cardinality: 0..1
value_set:
  binding_strength: extensible
  standard_binding_status: mapped
  codings:
  - system: snomed-ct
    code: '1259237005'
    display: Recurrent malignant neoplasm
  - system: snomed-ct
    code: '314954002'
    display: Local recurrence of malignant neoplasm of lung
  - system: snomed-ct
    code: '399409002'
    display: Distant metastasis present
  - system: snomed-ct
    code: '878806005'
    display: Second primary cancer
  - system: icd-10-gm
    code: C34.9
    display: 'Bösartige Neubildung: Bronchus oder Lunge, nicht näher bezeichnet'
  - system: kdl
    code: SD150103
    display: Tumorkonferenzprotokoll
standard_mappings:
- standard: fhir-mii-kds
  profile_or_url: https://www.medizininformatik-initiative.de/fhir/ext/modul-onko/StructureDefinition/mii-pr-onko-diagnose-primaertumor
  resource: Condition
  path: Condition.code.coding:icd10-gm (Zweitkarzinom); Condition.bodySite.coding:icd-o-3; Condition.extension:Feststellungsdatum;
    Condition.extension:occurredFollowing (frühere Tumorerkrankung)
  notes: 'MII KDS Onkologie 2026.0.3 (MII_PR_Onko_Diagnose_Primaertumor; baseDefinition MII Diagnose).
    Nur für das metachrone Zweitkarzinom als neue Primärtumor-Diagnose (878806005 bzw. ICD-10-GM, z. B.
    C34.9): code mit den Slices icd10-gm, alpha-id, sct und orphanet; extension:Feststellungsdatum 1..1,
    recordedDate 1..1; Bezug zum Ersttumor über extension:occurredFollowing (''Frühere Tumorerkrankungen'').
    Lokal- und Regionalrezidiv sowie Fernmetastasierung über https://www.medizininformatik-initiative.de/fhir/ext/modul-onko/StructureDefinition/mii-pr-onko-verlauf
    (eigener Eintrag).'
- standard: obds
  profile_or_url: https://www.basisdatensatz.de/basisdatensatz
  resource: '17 Verlauf; Zweitkarzinom: eigene Meldung mit Diagnose-Teil (5 Diagnose)'
  path: '17.3 Tumorstatus Primärtumor = R (Lokalrezidiv), 17.4 Tumorstatus Lymphknoten = R (Lymphknotenrezidiv),
    17.5 Tumorstatus Fernmetastasen = R (neue Fernmetastase bzw. Metastasenrezidiv), 17.2 Gesamtbeurteilung
    des Tumorstatus = Y (Rezidiv), jeweils mit 17.1 Untersuchungsdatum Verlauf (XSD: Verlauf/Verlauf_Lokaler_Tumorstatus,
    Verlauf_Tumorstatus_Lymphknoten, Verlauf_Tumorstatus_Fernmetastasen, Gesamtbeurteilung_Tumorstatus,
    Untersuchungsdatum_Verlauf); neue Fernmetastasen zusätzlich unter 11 Fernmetastasen (Verlauf/Menge_FM)'
  notes: Pflichtmeldung gem. § 65c SGB V. 'Allgemeiner Leistungszustand' ist ECOG bzw. Karnofsky (12.1)
    und hier nicht einschlägig; 'Tumorstatus_Lokoregionaeres_Tumorstatus' existiert in oBDS 3.0.5 nicht.
    Ein metachrones Zweitkarzinom wird als eigener Tumor (eigene Tumorzuordnung) mit Diagnosemeldung erfasst;
    der Ersttumor steht dort unter 5.9 Frühere Tumorerkrankungen (Diagnose/Menge_Fruehere_Tumorerkrankung).
    Feldnummern nach der oBDS-Feldliste, XML-Namen nach https://basisdatensatz.de/xml/oBDS_v3.0.5.xsd.
- standard: kbv-mio
  profile_or_url: https://fhir.kbv.de/StructureDefinition/KBV_PR_MIO_NFD_Condition
  resource: Condition (MIO Patientenkurzakte, Notfalldaten, Sektion Diagnose)
  path: 'Condition.code (code.coding max. 1: je Condition höchstens ein Coding aus den Slices ICD-10-GM,
    alpha-id, snomed-ct oder orphanet); Condition.code.text 1..1'
  notes: MIO Patientenkurzakte 1.0.0 (Bundle https://fhir.kbv.de/StructureDefinition/KBV_PR_MIO_NFDxDPE_Bundle)
    aus Notfalldaten (NFD) und persönlichen Erklärungen (DPE); kein onkologisches Übergabeformat. Rezidiv
    bzw. Zweitkarzinom nur als Diagnose (NFD-Composition, Sektion diagnose, LOINC 29548-5). 'ePA-Wallet'
    ist kein offizieller Begriff; MIOs liegen in der ePA.
- standard: fhir-mii-kds
  profile_or_url: https://www.medizininformatik-initiative.de/fhir/ext/modul-onko/StructureDefinition/mii-pr-onko-verlauf
  resource: Observation
  path: Observation.component:Tumor_Verlauf / :Lymphknoten_Verlauf / :Fernmetastasen_Verlauf.valueCodeableConcept
    = R; Observation.valueCodeableConcept = Y (Rezidiv); Observation.focus → Primärtumor-Condition
  notes: MII KDS Onkologie 2026.0.3 (MII_PR_Onko_Verlauf). Observation.code Pattern SNOMED 396432002;
    Gesamtbeurteilung value[x] extensible mii-vs-onko-verlauf-gesamtbeurteilung (Y = Rezidiv); Komponenten
    REQUIRED mii-vs-onko-verlauf-primaertumor (R = Lokalrezidiv), mii-vs-onko-verlauf-lymphknoten (R =
    neu aufgetretenes Lymphknotenrezidiv) bzw. mii-vs-onko-verlauf-fernmetastasen (R = neu aufgetretene
    Fernmetastase(n) bzw. Metastasenrezidiv); focus 1..1 → mii-pr-onko-diagnose-primaertumor. Lokalisation
    neuer Fernmetastasen über https://www.medizininformatik-initiative.de/fhir/ext/modul-onko/StructureDefinition/mii-pr-onko-fernmetastasen.
care_process:
  trigger: Detektion in Nachsorge
  frequency_pattern: ad-hoc
  responsible_role: MDT (Tumorboard)
