  guideline_references:
  - source: S3-LL Lungenkarzinom
    version: 5.1 (Juli 2026, AWMF 020-007OL)
    url: https://www.leitlinienprogramm-onkologie.de/leitlinien/lungenkarzinom
    section: 'Kap. 16.1 (Hintergrund: Nachsorgeziel frühzeitige Diagnose von Rezidiv- oder Zweittumoren;
      Rezidivrisiko in den ersten 2 Jahren am höchsten, Anteil Zweitkarzinome steigt mit Abstand zur OP);
      Empf. 16.1 (EK, geprüft 2026); Empf. 16.2 (EK, geprüft 2026); Kap. 16.3.4 (IFCT: vermehrte Detektion
      von Zweittumoren nach 4–5 Jahren)'
    recommendation_grade: EK
    evidence_level: n/a
  - source: Onkopedia NSCLC
    version: Stand April 2025
    url: https://www.onkopedia.com/de/onkopedia/guidelines/lungenkarzinom-nicht-kleinzellig-nsclc
    section: 'Kap. 8.1 (Nachsorgeziele: frühzeitige Diagnose eines Rezidivs und eines Zweittumors)'
    recommendation_grade: n/a
    evidence_level: n/a
  - source: Onkopedia SCLC
    version: Stand August 2026
    url: https://www.onkopedia.com/de/onkopedia/guidelines/lungenkarzinom-kleinzellig-sclc
    section: 'Kap. 10.2 (Nachsorgeziele: Rezidiv, Zweitneoplasie; Text nach Tab. 9: bei V. a. lokalisiertes
      oder lokal behandelbares Rezidiv weitere Bildgebung ggf. inkl. PET-CT und/oder histologische Sicherung);
      Kap. 6.1.2.1 (intrapulmonaler Zweittumor nach Resektion: auch andere Histologie bedenken, PET-CT
      und ggf. mediastinales Staging vor erneuter Resektion; Persistenz oder erneute lokale Progression
      des Primärtumors nach Chemo-Strahlentherapie: PET-CT, ggf. mediastinales Staging und MRT Schädel
      vor Resektion)'
    recommendation_grade: n/a
    evidence_level: n/a
