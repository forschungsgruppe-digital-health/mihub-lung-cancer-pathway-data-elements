name: smokingStatus
label_de: Rauchstatus
definition_de: Aktueller Tabakrauchstatus (nie / ehemals / aktuell, inkl. gelegentlich) sowie Konsum von
  E-Zigaretten und verwandten Produkten (z. B. Tabakerhitzer) und Passivrauchexposition. Fortgesetztes
  Tabakrauchen ist beim Lungenkarzinom mit kürzerem Überleben, mehr Therapiekomplikationen und mehr Zweitkarzinomen
  assoziiert (S3-LL Lungenkarzinom 5.1, Kap. 4.2 und 16.2). Für langjährigen E-Zigarettenkonsum sieht
  die S3-LL eine hohe Plausibilität für ein erhöhtes Tumorrisiko, beweisende Langzeitstudien fehlen jedoch
  (Kap. 3.7.2); bei Dual Use von Tabak- und E-Zigarette potenziert sich das Schadenspotenzial (Kap. 4.2.1).
  Empf. 4.1 fordert, aktives Tabakrauchen, das Rauchen der E-Zigarette und Passivrauchexposition konsequent
  zu vermeiden; Empf. 4.2 fordert, den Konsum von Tabak- und E-Zigaretten sowie verwandter Produkte regelmäßig
  zu erfragen und zu dokumentieren. Eine Erfassungsvorgabe für Passivrauch enthält Empf. 4.2 nicht; der
  Anamnese-/Befundbogen der S3-LL Rauchen und Tabakabhängigkeit (Anhang 2) fragt Rauchende im häuslichen
  und betrieblichen Umfeld ab ('Raucher zu Hause', 'Raucher im Betrieb').
