name: smokingStatus
label_de: Rauchstatus
definition_de: Aktueller Tabakkonsumstatus inkl. E-Zigaretten-Konsum (Vaping) und Passivrauchexposition.
  Aktive Raucher und E-Zigaretten-Konsumenten haben höheres Risiko für Komplikationen, Zweittumoren und
  schlechteres Überleben; Passivrauchexposition ist eigenständiger Risikofaktor und in S3-LL 5.1 (Empf.
  4.1/4.2) explizit Teil der Tabakanamnese.
phase: followup
