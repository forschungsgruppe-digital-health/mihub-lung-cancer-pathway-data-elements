issues:
- „Verwandte Produkte“ (z. B. Tabakerhitzer, Nikotinbeutel) gemäß S3 Empf. 4.2 bislang ohne Coding — SNOMED-CT-Kandidaten
  prüfen.
- 'Achsenmischung im Wertebereich: Der 1..1-required-CodeableConcept vereint Tabakrauchstatus (266919005/8517006/77176002/428041000124106),
  E-Zigarette (722499006; Parent ''Finding related to substance use'') und Passivrauch (43381005). Diese
  Merkmale schließen sich nicht aus, z. B. Ex-Raucher:in + E-Zigarette + Passivrauch. Vorschlag: getrennte
  Achsen, etwa als Observation.component oder als Teil-Elemente. (a) Tabakrauchstatus inkl. 266927001
  ''Tobacco smoking consumption unknown''. (b) E-Zigarette: 722499006 bzw. 1137690000 ''Never used electronic
  cigarette''. (c) Verwandte Produkte: 1388653002 ''Uses heated tobacco product'' (Tabakerhitzer); für
  Nikotinbeutel gibt es kein Nutzer-Befundkonzept (nur 584021000052104 ''Ex-user of nicotine pouches'';
  generisch 722494001 ''Nicotine user''). (d) Passivrauch: 43381005 bzw. 711563001 ''No known exposure
  to tobacco smoke''. Alle Kandidaten sind per $lookup auf dem MII TermServ (SNOMED CT 20260701) aktiv.
  Damit ist zugleich das offene Issue zu den ''verwandten Produkten'' teilweise beantwortet.'
- 'Wertecodes von smokingStatus an ISiKRaucherStatus anpassen. Das Profil und das MII-Kardio-Ballot binden
  valueCodeableConcept REQUIRED an current-smoking-status-uv-ips (nur LOINC-LA-Codes); 77176002 ''Smoker''
  ist dort der feste Observation.code, kein Wert. Zuordnung nach Bedeutung (das Paket enthält keine ConceptMap):
  266919005 → LA18978-9 ''Never smoker''; 8517006 → LA15920-4 ''Former smoker''; 428041000124106 → LA18977-1
  ''Current some day smoker''; 266927001 → LA18980-5 ''Unknown if ever smoked''; 77176002 ''Smoker'' (ohne
  Angabe der Häufigkeit) → LA18979-7 ''Smoker, current status unknown''. LA18976-3 ''Current every day
  smoker'' entspricht 449868002 ''Smokes tobacco daily'', das im Smoking-Status-ValueSet urn:oid:2.16.840.1.113883.11.20.9.38
  enthalten ist, im Element aber fehlt. E-Zigarette (722499006) und Passivrauch (43381005) sind im Profil
  nicht abbildbar und bräuchten eigene Observations (vgl. offener Punkt zur Achsenmischung im Wertebereich).
  Zu entscheiden: Abbildungstabelle festlegen bzw. LOINC-LA-Codes ergänzen (einschließlich der Frage,
  ob 449868002 aufgenommen wird) und das Bindungsziel von value_set.uri ersetzen (http://hl7.org/fhir/ValueSet/smoking-status
  ist in hl7.fhir.r4.core 4.0.1 nicht enthalten; Kandidaten laut value_set.notes: urn:oid:2.16.840.1.113883.11.20.9.38
  oder current-smoking-status-uv-ips).'
