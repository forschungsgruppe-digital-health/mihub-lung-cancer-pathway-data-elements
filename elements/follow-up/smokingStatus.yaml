  notes: 'ValueSet http://hl7.org/fhir/ValueSet/smoking-status ist weder in FHIR R4 Core 4.0.1 noch in
    R5 Core 5.0.0 noch in den HL7-Terminology-Paketen enthalten (lokale Paketprüfung 2026-10-14; andere
    Versionen nicht geprüft) und auf dem MII TermServ nicht auflösbar (ValueSet-Suche 2026-10-14: 0 Treffer);
    als required-Bindungsziel ist es daher ungeeignet, value_set.uri ist zu ersetzen oder zu entfernen.
    Verifiziert verfügbar: urn:oid:2.16.840.1.113883.11.20.9.38 ''Smoking Status'' (20240606; SNOMED 266919005,
    266927001, 428041000124106, 449868002, 77176002, 8517006) sowie http://hl7.org/fhir/uv/ips/ValueSet/current-smoking-status-uv-ips
    bzw. https://gematik.de/fhir/isik/ValueSet/current-smoking-status-uv-ips 1.1.0 (LOINC-LA-Codes). 722499006
    (E-Zigarette) und 43381005 (Passivrauch) sind in keinem dieser ValueSets enthalten (eigene Achsen).
    Codes einzeln verifiziert (SNOMED CT 20260701).'
