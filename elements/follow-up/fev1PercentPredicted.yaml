name: fev1PercentPredicted
label_de: FEV1 (% vom Soll)
definition_de: Forciertes exspiratorisches Volumen in der ersten Sekunde (FEV1), in Prozent des Sollwerts.
  Ergebnisartefakt zur Prozedur 'pulmonaryFunctionTest'.
phase: followup
tumor_entity:
- NSCLC
- SCLC
category: messwert
datatype: decimal
cardinality: 0..*
unit: '%'
value_set:
  binding_strength: preferred
  standard_binding_status: mapped
  codings:
  - system: loinc
    code: 20152-5
    display: FEV1 measured/predicted
  - system: snomed-ct
    code: '313223002'
    display: Percent predicted FEV1
  - system: kdl
    code: DG060108
    display: Dokumentationsbogen Lungenfunktionsprüfung
standard_mappings:
- standard: fhir-mii-kds
  profile_or_url: https://www.medizininformatik-initiative.de/fhir/ext/modul-lungenfunktion/StructureDefinition/mii-pr-lungenfunktion-fev
  resource: Observation
  path: Observation.component:percentPredicted.valueQuantity (UCUM %), component.code.coding:loinc = LOINC
    20152-5 bzw. :sct = SNOMED 313223002; Observation.code.coding:loinc = LOINC 20150-9
  notes: 'nur Ballot de.medizininformatikinitiative.kerndatensatz.lungenfunktion#2027.0.0-ballot.1, kein
    stabiles Release. Lungenfunktion statt Labor: Das MII-Modul Lungenfunktion deckt die Spirometrie einschließlich
    FEV1 ab. Der Prozentwert vom Soll ist im Profil eine Komponente der FEV-Observation; Observation.value[x]
    trägt den Absolutwert (UCUM L). code.coding:loinc und :sct (auch in den Komponenten) REQUIRED an mii-vs-lufu-lnc-fev
    bzw. mii-vs-lufu-sct-fev; beide enthalten die Codes des Elements (20152-5, 313223002) sowie 20150-9
    bzw. 59328004 für FEV1. Observation.partOf → mii-pr-lungenfunktion-spirometrie-messung. Übergangsweise
    zusätzlich fhir-r4-base.'
- standard: fhir-r4-base
  profile_or_url: http://hl7.org/fhir/StructureDefinition/Observation
  resource: Observation
  path: Observation.valueQuantity (UCUM %) mit Observation.code = LOINC 20152-5 (bzw. SNOMED 313223002)
  notes: Stabiles Übergangs-Mapping, bis das MII-Modul Lungenfunktion als stabiles Release vorliegt. Alternativ
    wie im MII-Ballot als Komponente einer FEV1-Observation (Observation.code LOINC 20150-9).
constraints_de: Wertebereich realistisch 0..150. UCUM-Einheit '%'.
