issues:
- 'Struktur von fev1PercentPredicted gegenüber dem MII-Lungenfunktion-Ballot klären. Dort ist ''Prozent
  vom Soll'' kein eigener Observation-Wert, sondern component:percentPredicted (valueQuantity %, Code
  20152-5 bzw. 313223002) der FEV1-Observation (Observation.code 20150-9 bzw. 59328004, Wert = Absolutwert
  in L). Zu entscheiden: Element nach dem stabilen Release als Komponente der FEV1-Observation (ggf. zusammen
  mit dem Absolutwert) oder weiterhin als eigenständige Observation (code 20152-5) führen.'
