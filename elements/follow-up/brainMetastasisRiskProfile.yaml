issues:
- 'Verfügbarkeit der molekularen Kriterien: S3 Empf. 6.58 (EK) sieht in den Stadien IB–IIIA nur die Testung
  auf EGFR (Exon 19/21) und ALK (Tumoren ≥ 4 cm) vor; ROS1 wird erst bei nicht resezierbarem Stadium III
  (Empf. 6.59) bzw. Stadium IV (Empf. 6.61; Onkopedia NSCLC Tab. 3) getestet. Nach Resektion früher Stadien
  kann das Kriterium ROS1+ daher unbekannt sein. Der Katalog enthält kein Eingangselement für den molekularen
  Basisstatus (EGFR/ALK/ROS1); nur molecularResistanceFinding/molecularRetestingCtdna (Surveillance) tragen
  molekulare Befunde.'
- 'Repräsentation von brainMetastasisRiskProfile in RiskAssessment klären. Die drei lokalen Codes vermischen
  Risikostufe und Kriterienbasis: high-risk-molecular und high-risk-histology unterscheiden die Quelle
  (S3 Empf. 16.8 bzw. Onkopedia NSCLC Kap. 8.1), nicht die Stufe. RiskAssessment.prediction.qualitativeRisk
  nimmt nur die Stufe auf. Für die Stufe läge das dort example-gebundene ValueSet risk-probability (high
  bzw. low) nahe; value_set.notes lehnt es ab, weil ''high'' dort ''wahrscheinlicher als nicht'' bedeutet
  und keine Risikogruppe ist. Zu entscheiden: (a) Stufe mit risk-probability oder mit eigenen Stufencodes
  (erhöht, Standard) in qualitativeRisk; (b) Kriterienbasis in prediction.rationale, RiskAssessment.method
  oder als Referenzen in RiskAssessment.basis; (c) ob das Element in Stufe und Kriterium aufgeteilt wird.'
