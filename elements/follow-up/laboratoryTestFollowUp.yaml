id: mihub.lung.followup.laboratoryTestFollowUp.v0.1
uuid: dda008b3-f0ae-5547-a249-6abce2d269cf
name: laboratoryTestFollowUp
label_de: Laborparameter in der Nachsorge
definition_de: Laboruntersuchung (Panel/Parameter als LOINC-Coding) am Nachsorgetermin „nach Maßgabe des
  Behandlers“ (S3 Tab. 44), z. B. bei Pneumonitis- oder Toxizitätsverdacht. Die routinemäßige Bestimmung
  von Serum-Tumormarkern wird in der Nachsorge nicht empfohlen (S3 Kap. 16.3.4).
phase: followup
tumor_entity:
- NSCLC
- SCLC
category: laborbefund
datatype: CodeableConcept
cardinality: 0..*
value_set:
  binding_strength: extensible
  standard_binding_status: mapped
  codings:
  - system: snomed-ct
    code: '15220000'
    display: Laboratory test
  - system: kdl
    code: LB120107
    display: Laborbefund
  notes: 'Antwortwerte (Panel/Parameter) sind LOINC-codierte Laboruntersuchungen bzw. -panels (Observation.code;
    MII-KDS-Modul Laborbefund, Profil ObservationLab: Bindung an LOINC-Codes der Laborklasse, CLASSTYPE
    1). SNOMED CT 15220000 bezeichnet nur das Element (Laborprozedur), KDL LB120107 die Dokumentklasse
    des Laborbefunds; beide sind keine Antwortwerte.'
standard_mappings:
- standard: fhir-mii-kds
  profile_or_url: https://www.medizininformatik-initiative.de/fhir/core/modul-labor/StructureDefinition/ObservationLab
  resource: Observation (ObservationLab)
  path: Observation.code
constraints_de: Keine routinemäßige Bestimmung von Serum-Tumormarkern in der Nachsorge (S3 Kap. 16.3.4,
  Hintergrundtext ohne Empfehlungsgrad; „Evidenzgrad 1a“ bezieht sich dort auf die zitierte Literatur
  [1878] zur kontrovers diskutierten Bedeutung der Serummarker). Onkopedia NSCLC Tab. 12 und SCLC Tab.
  9 enthalten keine Laborzeile.
care_process:
  trigger: nach Maßgabe des Behandlers (symptom-/toxizitätsorientiert)
  frequency_pattern: ad-hoc
  responsible_role: Onkolog:in / Pneumolog:in
  data_flows:
  - system: lis-patho
    actor_role: Labor
    usage_type: capture
    sector: sektorenuebergreifend
  - system: kis
    actor_role: Onkolog:in
    usage_type: read
    sector: stationaer
  - system: pvs
    actor_role: Hausärzt:in
    usage_type: read
    sector: ambulant
evidence:
  guideline_references:
  - source: S3-LL Lungenkarzinom
    version: 5.1 (Juli 2026, AWMF 020-007OL)
    url: https://www.leitlinienprogramm-onkologie.de/leitlinien/lungenkarzinom
    section: 'Tab. 44 (Laborparameter: nach Maßgabe des Behandlers); Kap. 16.3.4 (Hintergrundtext: routinemäßige
      Bestimmung von Serummarkern nicht empfohlen; „Evidenzgrad 1a“ bezieht sich auf [1878], kontroverse
      Bedeutung der Serummarker)'
    recommendation_grade: n/a
    evidence_level: n/a
    quote: Der Nutzen von Tumormarkern in der Nachsorge des Lungenkarzinoms ist durch Studien nicht belegt.
      Daher wird die routinemäßige Bestimmung von Serummarkern in der Nachsorge des Lungenkarzinoms nicht
      empfohlen. … Laborparameter Nach Maßgabe des Behandlers
    accessed: '2026-10-15'
    locator: Kap. 16.3.4, S. 496; Kap. 16.4, Tab. 44, S. 499
  - source: Expert:innen-Erhebung MiHUB
    version: Excel-Erhebung Nachsorge-WG, Stand 2026-07-30 (Lungenkrebszentrum; Vorlage datenelement-erhebung_Nachsorge_WG_ak.xlsx)
    section: 'DE-026 Laborparameter (Onkologische Nachsorge; Trigger lt. Erhebung: nach Maßgabe des Behandlers)'
    recommendation_grade: n/a
    evidence_level: n/a
    locator: docs/reviews/2026-10-13-erhebungen.md#wg-de-026
    quote: Laborparameter … Nach Maßgabe des Behandlers … S3-LL Lungenkarzinom … Apr 2026 Tab 44
    accessed: '2026-10-15'
