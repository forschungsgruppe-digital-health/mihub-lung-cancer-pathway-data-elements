label_de: Laborparameter in der Nachsorge
definition_de: Laboruntersuchung am Nachsorgetermin „nach Maßgabe des Behandlers“ (z. B. bei Pneumonitis-
  oder Toxizitätsverdacht; Panel/Parameter als Coding). Tumormarker sind in der Nachsorge ausdrücklich
  nicht empfohlen und dürfen nicht als Routinewert erfasst werden.
