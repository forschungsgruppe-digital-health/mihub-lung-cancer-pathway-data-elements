name: rehabilitationAndSocialCounselling
label_de: Information/Beratung zu Rehabilitation und sozialrechtlichen Ansprüchen
definition_de: Dokumentation, dass die Patient:in frühzeitig über ambulante und stationäre Rehabilitationsmaßnahmen
  sowie weitere sozialrechtliche Ansprüche informiert bzw. an Sozialdienst/Krebsberatungsstelle vermittelt
  wurde (inkl. Empfehlung einer Klinik mit onkologischem Schwerpunkt unter Berücksichtigung des Patientenwunsches,
  § 9 SGB IX).
