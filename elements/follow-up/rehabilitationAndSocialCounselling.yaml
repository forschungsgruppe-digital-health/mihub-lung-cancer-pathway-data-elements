issues:
- 'Codierung prüfen: KDL AM190203 ''Einschätzung Sozialdienst'' ist eine Dokumentenklasse der Klinischen
  Dokumentenklassen-Liste (AM ''Administration'' › AM1902 ''Sozialdienst'') und keine Leistung; statt
  als Procedure.code gegebenenfalls als DocumentReference.type des Sozialdienst-Dokuments führen (eigenes
  Mapping). 410606002 ''Social service procedure'' ist ein sehr breites Gruppierungskonzept (direktes
  Kind von ''Procedure''). 410303001 ''Rehabilitation education, guidance, and counseling'' ist seit 2007-01-31
  inaktiv; für die Information über Rehabilitationsmöglichkeiten ist 410082002 ''Rehabilitation therapy
  education'' (aktiv; Method: Education - action, Has focus: Rehabilitation therapy) auf Passung zu prüfen,
  für die Information über sozialrechtliche Ansprüche 223433009 ''Benefits education'' (aktiv) als Ergänzung
  zu 171001002 ''Benefits counseling''.'
