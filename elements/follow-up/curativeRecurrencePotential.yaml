issues:
- '6–8-Wochen-Intervall nur Onkopedia-gestützt: Die Folgeaussage in definition_de („Bei ja kann das Nachsorgeintervall
  auf 6–8 Wochen verkürzt werden“) stammt ausschließlich aus Onkopedia NSCLC Kap. 8.1 (Stand 04/2025),
  das dafür [117] = S3-LL 020-007 (Stand 11/2022) zitiert. In der S3-LL 5.1 Kap. 16 (alle Empfehlungen
  „geprüft 2026“, keine Tab.-48-Änderung) existiert kein 6–8-Wochen-Intervall für die kurative Rezidivsituation:
  Empf. 16.7 (EK) = alle 3 Monate in Jahr 1–2, ab Jahr 3 halbjährlich; verkürzte Intervalle (Wiedervorstellung
  alle 3–6 Wochen, CT alle 6–9 Wochen) nur in Empf. 16.9 unter Systemtherapie Stadium IV. Der Onkopedia-Wortlaut
  ist zudem zeitlich ambig (prospektive Eignung für kurative Salvage-Therapie vs. nach Detektion/Salvage).
  Klinisch zu klären; bis dahin als Onkopedia-Einzelaussage kennzeichnen (betrifft auch followUpInterval,
  Code Q6-8W-curative-recurrence). UNSICHER: ob die S3-Fassung 11/2022 den Passus enthielt (nicht geprüft).'
