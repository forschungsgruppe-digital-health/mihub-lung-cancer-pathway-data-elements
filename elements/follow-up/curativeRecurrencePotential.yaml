    section: Kap. 8.1 („Bei einigen Pat. mit Rezidiv oder einem Zweitkarzinom besteht ein kuratives Potenzial
      … kann das Nachsorgeintervall auf 6-8 Wochen verkürzt werden“)
    recommendation_grade: n/a
