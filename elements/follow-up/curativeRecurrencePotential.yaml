id: mihub.lung.followup.curativeRecurrencePotential.v0.1
uuid: f12ad8dd-8e22-5545-b94c-2855e39c9ac8
name: curativeRecurrencePotential
label_de: Kuratives Potenzial bei Rezidiv / Zweitkarzinom
definition_de: Tumorboard-Einschätzung, ob bei einem in der Nachsorge detektierten Rezidiv oder Zweitkarzinom
  ein kurativer Therapieanspruch besteht. Bei „ja“ kann das Nachsorgeintervall auf 6–8 Wochen verkürzt
  werden (Onkopedia) und die Rezidivdiagnostik (PET-CT, histologische Sicherung) ergänzt werden.
phase: followup
tumor_entity:
- NSCLC
- SCLC
category: versorgungsplanung
datatype: boolean
cardinality: 0..1
value_set:
  binding_strength: extensible
  standard_binding_status: n/a
  notes: Boolean ohne Standard-Coding (standard_binding_status n/a). Auf dem MII TermServ (Stand 2026-10-14)
    existiert kein SNOMED-CT-Befundkonzept für „kuratives Potenzial“ bzw. „potentially curable“. Einziger
    aktiver Kandidat ist 373808002 „Curative - procedure intent“, ein Qualifier Value der Therapieintention
    (Wert von treatmentIntent, nicht des kurativen Potenzials); 395078005, 393127004 und 394078002 „Curative
    treatment“ sind inaktiv. LOINC bietet als Beobachtungscode nur 21963-4 „Curative intent of treatment
    Radiation treatment“ (strahlentherapiespezifisch, zu eng). Bewusst nicht kodiert; Kontext über related_elements
    (recurrenceOrSecondPrimary, tumorBoardDecision).
