id: mihub.lung.followup.curativeRecurrencePotential.v0.1
uuid: f12ad8dd-8e22-5545-b94c-2855e39c9ac8
name: curativeRecurrencePotential
label_de: Kuratives Potenzial bei Rezidiv / Zweitkarzinom
definition_de: Tumorboard-Einschätzung, ob bei einem in der Nachsorge detektierten Rezidiv oder Zweitkarzinom
  ein kurativer Therapieanspruch besteht. Bei „ja“ kann das Nachsorgeintervall auf 6–8 Wochen verkürzt
  werden (Onkopedia) und die Rezidivdiagnostik (PET-CT, histologische Sicherung) ergänzt werden.
phase: followup
tumor_entity:
- NSCLC
- SCLC
category: versorgungsplanung
datatype: boolean
cardinality: 0..1
value_set:
  binding_strength: extensible
  standard_binding_status: n/a
  notes: Boolean ohne Standard-Coding (standard_binding_status n/a). Auf dem MII TermServ (Stand 2026-10-14)
    existiert kein SNOMED-CT-Befundkonzept für „kuratives Potenzial“ bzw. „potentially curable“. Einziger
    aktiver Kandidat ist 373808002 „Curative - procedure intent“, ein Qualifier Value der Therapieintention
    (Wert von treatmentIntent, nicht des kurativen Potenzials); 395078005, 393127004 und 394078002 „Curative
    treatment“ sind inaktiv. LOINC bietet als Beobachtungscode nur 21963-4 „Curative intent of treatment
    Radiation treatment“ (strahlentherapiespezifisch, zu eng). Bewusst nicht kodiert; Kontext über related_elements
    (recurrenceOrSecondPrimary, tumorBoardDecision).
standard_mappings:
- standard: fhir-r4-base
  profile_or_url: http://hl7.org/fhir/StructureDefinition/Observation
  resource: Observation
  path: Observation.valueBoolean
  notes: 'ClinicalImpression.finding nimmt nur itemCodeableConcept oder itemReference auf, ein boolean
    ist dort nicht abbildbar. Daher Observation mit valueBoolean; Observation.code (1..1) ist festzulegen,
    ein Standardcode fehlt (siehe value_set.notes). Bezug zum Rezidiv bzw. Zweitkarzinom über Observation.focus;
    Verknüpfung mit der Tumorkonferenz über CarePlan.supportingInfo (MII-Tumorkonferenz). Alternative:
    ClinicalImpression.finding.itemCodeableConcept mit einer kodierten Aussage.'
- standard: obds
  profile_or_url: https://www.basisdatensatz.de/basisdatensatz
  resource: 18 Tumorkonferenz Therapieplanung / 19 Therapieempfehlung (nur teilweise abbildbar)
  path: '19.1 Tumorkonferenz Therapieempfehlung Typ (Tumorkonferenz/Therapieempfehlung/Menge_Typ_Therapieempfehlung/Typ_Therapieempfehlung,
    z. B. OP, ST); die kurative Intention steht erst in der Folgemeldung: 13.1 (OP/Intention), 14.1 (ST/Intention)
    bzw. 16.1 (SYST/Intention) = K'
  notes: 'Nur teilweise abbildbar: oBDS hat kein Feld für den kurativen Anspruch. Abschnitt 18/19 kennt
    nur 18.1 Datum, 18.2 Typ (praeth, postop, postth, ther), 19.1 Typ der Therapieempfehlung und 19.2
    Therapieabweichung auf Wunsch des Patienten. Feldnummern nach der oBDS-Feldliste, XML-Namen nach https://basisdatensatz.de/xml/oBDS_v3.0.5.xsd.'
- standard: fhir-mii-kds
  profile_or_url: https://www.medizininformatik-initiative.de/fhir/ext/modul-onko/StructureDefinition/mii-pr-onko-tumorkonferenz
  resource: CarePlan
  path: CarePlan.activity:obds.detail.code (Therapieempfehlung, z. B. OP, ST); Verknüpfung mit der Einschätzung
    über CarePlan.supportingInfo
  notes: 'MII KDS Onkologie 2026.0.3 (MII_PR_Onko_Tumorkonferenz, intent fix plan). Nur teilweise abbildbar:
    Das Profil hat kein Element für den kurativen Anspruch. Kodiert sind der Konferenztyp (category, REQUIRED
    mii-vs-onko-therapieplanung-typ), die Therapieempfehlung (activity:obds.detail.code 1..1, REQUIRED
    mii-vs-onko-therapieempfehlung-typ) und die Therapieabweichung (activity:obds.detail.statusReason).
    Die Einschätzung selbst als Observation (siehe fhir-r4-base) über supportingInfo verknüpfen oder als
    Freitext in CarePlan.description bzw. note führen. Die kurative Intention steht erst in der Folgetherapie
    (Procedure.extension:Intention = K in mii-pr-onko-operation, mii-pr-onko-strahlentherapie bzw. mii-pr-onko-systemische-therapie).'
care_process:
  trigger: Detektion Rezidiv/Zweittumor (recurrenceOrSecondPrimary) → Tumorboard-Entscheid
  frequency_pattern: ad-hoc
  responsible_role: MDT (Tumorboard)
evidence:
  guideline_references:
  - source: Onkopedia NSCLC
    version: Stand April 2025
    url: https://www.onkopedia.com/de/onkopedia/guidelines/lungenkarzinom-nicht-kleinzellig-nsclc
    section: Kap. 8.1 („Bei einigen Pat. mit Rezidiv oder einem Zweitkarzinom besteht ein kuratives Potenzial
      … kann das Nachsorgeintervall auf 6-8 Wochen verkürzt werden“)
    recommendation_grade: n/a
    evidence_level: n/a
  - source: Onkopedia SCLC
    version: Stand August 2026
    url: https://www.onkopedia.com/de/onkopedia/guidelines/lungenkarzinom-kleinzellig-sclc
    section: 'Tab. 9 Fußnote (lokalisiertes / lokal behandelbares Rezidiv: weitere Bildgebung ggf. PET-CT
      und/oder histologische Sicherung); Kap. 6.1.2.1'
    recommendation_grade: n/a
    evidence_level: n/a
  - source: S3-LL Lungenkarzinom
    version: 5.1 (Juli 2026, AWMF 020-007OL)
    url: https://www.leitlinienprogramm-onkologie.de/leitlinien/lungenkarzinom
    section: 'Kap. 16.1 Allgemeines (Hintergrundtext, Evidenzgrad 2b [1858]: Nachsorgeziel frühzeitige
      Diagnose von Rezidiv- oder Zweittumoren, um durch die Option eines weiteren kurativen chirurgischen
      Eingriffes die Heilungschance zu erhalten); Kap. 16.3.2/16.3.4 (in der Nachsorge entdeckte metachrone
      Zweittumoren und pulmonale Rezidive teilweise kurativ operiert bzw. behandelbar); Tab. 44 (PET-CT:
      Ausschluss von Metastasen vor erneutem thoraxchirurgischem Eingriff)'
    recommendation_grade: n/a
    evidence_level: 2b
  - source: OCP Lung (AU)
    version: 2nd ed. 2021 (Update 07/2025)
    url: https://www.cancer.org.au/assets/pdf/ocp/lung-cancer-2nd-edition
    section: 'Step 6.1.1 Recurrent disease (in der Nachsorge entdecktes Rezidiv: „Prompt referral for
      management by a multidisciplinary team is recommended …“)'
    recommendation_grade: n/a
    evidence_level: n/a
