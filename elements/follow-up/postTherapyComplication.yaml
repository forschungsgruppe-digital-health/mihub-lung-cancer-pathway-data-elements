id: mihub.lung.followup.postTherapyComplication.v0.1
uuid: 7a0cabf4-6853-5562-8e6c-d42815f41d89
name: postTherapyComplication
label_de: Posttherapeutische Komplikation
definition_de: 'Erfassung von Komplikationen nach lokal-ablativer Therapie: nach OP (Schmerz, Infektion,
  Lungenfunktionsverlust, Post-Pneumonektomie-Syndrom), nach RTx/CTx-RTx (Ösophagitis, Pneumonitis, Strahlenfibrose,
  Affektionen von Haut, Herz oder Rückenmark) sowie neurokognitive Spätfolgen nach Schädelbestrahlung
  (PCI, Ganzhirnbestrahlung).'
phase: followup
tumor_entity:
- NSCLC
- SCLC
category: befund
datatype: CodeableConcept
cardinality: 0..*
value_set:
  binding_strength: extensible
  codings:
  - system: snomed-ct
    code: '84004001'
    display: Radiation pneumonitis
  - system: snomed-ct
    code: '205237003'
    display: Pneumonitis
  - system: snomed-ct
    code: '235605005'
    display: Radiation esophagitis
  - system: snomed-ct
    code: '405570007'
    display: Pulmonary fibrosis due to and following radiotherapy
  - system: snomed-ct
    code: '709073001'
    display: Neurocognitive disorder
  - system: icd-10-gm
    code: T66
    display: Nicht näher bezeichnete Schäden durch Strahlung
  - system: icd-10-gm
    code: J70.1
    display: Chronische und sonstige Lungenbeteiligung bei Strahleneinwirkung
  - system: icd-10-gm
    code: J70.0
    display: Akute Lungenbeteiligung bei Strahleneinwirkung
  standard_binding_status: mapped
care_process:
  trigger: Bei Erstvorstellung innerhalb von 8 Wochen nach Therapieende (nach OP Stadium I–III; nach RT/RCT
    Stadium I–II; NSCLC Stadium III nach RT/RCT) und bei jeder Folgevisite
  frequency_pattern: per-encounter
  responsible_role: Onkologe / Pneumologe
evidence:
  guideline_references:
  - source: S3-LL Lungenkarzinom
    version: 5.1 (Juli 2026, AWMF 020-007OL)
    url: https://www.leitlinienprogramm-onkologie.de/leitlinien/lungenkarzinom
    section: Empf. 16.4 (EK, geprüft 2026); Kap. 16.3.1 (Komplikationen nach OP und RT)
    recommendation_grade: EK
    evidence_level: n/a
    quote: Nach chirurgischer Resektion stehen Schmerzzustände, Infektionen oder aber der Verlust an Lungenfunktion
      im Vordergrund, nach Strahlentherapie die Ösophagitis und die Pneumonitis, aber auch Affektionen
      der Haut, des Herzens oder des Rückenmarkes … die posttherapeutischen Komplikationen … erfasst
    accessed: '2026-10-15'
    locator: Kap. 16.3.1, S. 493; Empf. 16.4 (EK, geprüft 2026), S. 497
  - source: S3-LL Lungenkarzinom
    version: 5.1 (Juli 2026, AWMF 020-007OL)
    url: https://www.leitlinienprogramm-onkologie.de/leitlinien/lungenkarzinom
    section: 'Empf. 16.5 (Grad gedruckt „A/B“: Erfassung/Behandlung posttherapeutischer Komplikationen
      „sollten“ = B; erste Vorstellung „soll … innerhalb von 8 Wochen“ = A; LoE 2, Konsens, geprüft 2026)
      — NSCLC Stadium III nach RT/RCT'
    recommendation_grade: B
    evidence_level: '2'
    quote: Bei Patienten mit NSCLC im Stadium III nach ablativer lokaler Therapie … sollten die posttherapeutischen
      Komplikationen, die nach Strahlentherapie auftreten können, erfasst und behandelt werden.
    accessed: '2026-10-15'
    locator: Empf. 16.5 (evidenzbasiert, geprüft 2026, Konsens), S. 497
  - source: Onkopedia NSCLC
    version: Stand April 2025
    url: https://www.onkopedia.com/de/onkopedia/guidelines/lungenkarzinom-nicht-kleinzellig-nsclc
    section: 'Kap. 7 (Therapiefolgestörungen); Kap. 8.1 (Nachsorgeziel: Erkennung von Nebenwirkungen der
      Therapie); Kap. 6.2.2.1 (Strahlenpneumonitis → Fibrose, 6–24 Monate nach RT); Kap. 6.1.6.1 (kognitive
      und neurologische Langzeitnebenwirkungen nach Ganzhirnbestrahlung)'
    recommendation_grade: n/a
    evidence_level: n/a
    quote: Der akuten Pneumonitis folgt oft der Übergang in eine pulmonale Fibrose mit Sekundärkomplikationen.
      Sie kann innerhalb von 6-24 Monaten nach Ende der Bestrahlung auftreten. … zu Therapiefolgestörungen
      unterschiedlichen Schwergrades führen. … die Erkennung von Nebenwirkungen der Therapie
    accessed: '2026-10-15'
    locator: Kap. 6.2.2.1; Kap. 7; Kap. 8.1
  - source: Onkopedia SCLC
    version: Stand August 2026
    url: https://www.onkopedia.com/de/onkopedia/guidelines/lungenkarzinom-kleinzellig-sclc
    section: 'Kap. 6.1.1.3 (kognitive Einschränkung nach PCI); Kap. 10.2 (Nachsorgeziel: Nebenwirkungen
      der Therapie)'
    recommendation_grade: n/a
    evidence_level: n/a
    quote: Die PCI kann mit Einschränkungen der kognitiven Fähigkeit verbunden sein. … die Erkennung von
      Nebenwirkungen der Therapie und Vorsorge.
    accessed: '2026-10-15'
    locator: Kap. 6.1.1.3; Kap. 10.2
  - source: S3-LL Lungenkarzinom
    version: 5.1 (Juli 2026, AWMF 020-007OL)
    url: https://www.leitlinienprogramm-onkologie.de/leitlinien/lungenkarzinom
    section: Empf. 16.1 (strukturierter Nachsorgeplan geeignet, Komplikationen und Toxizitäten der Therapie
      zu erkennen; Starker Konsens, geprüft 2026)
    recommendation_grade: EK
    evidence_level: n/a
    quote: sollte für jeden Patienten ein strukturierter Nachsorgeplan erstellt werden. Der strukturierte
      Nachsorgeplan sollte geeignet sein, Rezidive, Zweitkarzinome, Komplikationen und Toxizitäten der
      Therapie und den Bedarf an Psychoonkologie und Sozialberatung zu erkennen
    accessed: '2026-10-15'
    locator: Empf. 16.1 (EK, geprüft 2026, Starker Konsens), S. 492
