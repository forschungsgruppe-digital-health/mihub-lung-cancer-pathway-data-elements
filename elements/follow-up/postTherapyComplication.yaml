issues:
- 'Der Wertebereich deckt die Definition nur teilweise ab. Für Haut-, Rückenmarks- und kardiale RT-Folgen
  sowie die OP-Komplikationen (Schmerz, Infektion, Lungenfunktionsverlust, Post-Pneumonektomie-Syndrom)
  fehlen Codings. Per TermServ verifizierte, aktive Kandidaten (SNOMED CT 20260701): 402761000 Disorder
  of skin due to radiotherapy; 1339018001 Disorder of spinal cord due to and following radiotherapy; 430401005
  Heart disease caused by ionizing radiation (kardialer Oberbegriff); 33558009 Post-radiation pericarditis
  (Teilaspekt kardial, kein Subtyp von 430401005); 239175003 Post-thoracotomy pain syndrome (Schmerz nach
  Thorakotomie). Für das Post-Pneumonektomie-Syndrom fand die $expand-Textsuche kein SNOMED-Konzept (UNSICHER).
  Zusätzlich ist die Abgrenzung zu immuneRelatedAdverseEvent zu klären: S3-LL Lungenkarzinom 5.1, Kap.
  16.3 nennt „immun-bezogene Komplikationen“.'
