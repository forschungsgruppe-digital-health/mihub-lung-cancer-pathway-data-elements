name: postTherapyComplication
label_de: Posttherapeutische Komplikation
definition_de: 'Erfassung von Komplikationen nach lokal-ablativer Therapie: nach OP (Schmerz, Infektion,
  Lungenfunktionsverlust, Post-Pneumonektomie-Syndrom), nach RTx/CTx-RTx (Ösophagitis, Pneumonitis, Strahlenfibrose,
  Affektionen von Haut, Herz oder Rückenmark) sowie neurokognitive Spätfolgen nach Schädelbestrahlung
  (PCI, Ganzhirnbestrahlung).'
