standard_mappings:
- standard: fhir-mii-kds
  profile_or_url: https://www.medizininformatik-initiative.de/fhir/ext/modul-bildgebung/StructureDefinition/mii-pr-bildgebung-radiologischer-befund
  resource: DiagnosticReport
  path: DiagnosticReport.conclusionCode
  notes: MII KDS Bildgebung 2026.0.0 (MII_PR_Bildgebung_Radiologischer_Befund). conclusionCode 0..* MS
    mit den Slices coding:sct (REQUIRED mii-vs-bildgebung-findings-sct = < 404684003 |Clinical finding|)
    und coding:icd10-gm (REQUIRED ICD-10-GM). DiagnosticReport.imagingStudy 1..* ist Pflicht (Referenz
    auf mii-pr-bildgebung-bildgebungsstudie der Untersuchung ctThoraxScan); DiagnosticReport.code mit
    LOINC-Slice REQUIRED mii-vs-bildgebung-diagnostic-report-code-lnc (Dokument-LOINC der Radiologie).
    Einzelbefunde (z. B. Größe der Zielläsion) optional als Observation https://www.medizininformatik-initiative.de/fhir/ext/modul-bildgebung/StructureDefinition/mii-pr-bildgebung-radiologische-beobachtung
    (code.coding:sct ebenfalls Clinical findings, value 1..1) über DiagnosticReport.result.
- standard: obds
  profile_or_url: https://www.basisdatensatz.de/basisdatensatz
  resource: 17 Verlauf
  path: '17.2 Gesamtbeurteilung des Tumorstatus, 17.3 Tumorstatus Primärtumor, 17.4 Tumorstatus Lymphknoten,
    17.5 Tumorstatus Fernmetastasen, jeweils mit 17.1 Untersuchungsdatum Verlauf (XSD: Verlauf/Gesamtbeurteilung_Tumorstatus,
    Verlauf_Lokaler_Tumorstatus, Verlauf_Tumorstatus_Lymphknoten, Verlauf_Tumorstatus_Fernmetastasen,
    Untersuchungsdatum_Verlauf)'
  notes: 'Pflichtmeldung gem. § 65c SGB V. ''Tumorstatus_Lokoregionaeres'' existiert in oBDS 3.0.5 nicht.
    Wertebereiche: 17.2 V, T, K, P, D, B, R, Y, U, X (Y = Rezidiv, U = Beurteilung unmöglich); 17.3 bis
    17.5 K, T, P, N, R, F, U, X (R = Lokalrezidiv, neu aufgetretenes Lymphknotenrezidiv bzw. neue Fernmetastase).
    Ein Zweitkarzinom ist kein Verlaufsstatus, sondern eine eigene Meldung mit Diagnose-Teil (eigene Tumorzuordnung).
    Feldnummern nach der oBDS-Feldliste, XML-Namen nach https://basisdatensatz.de/xml/oBDS_v3.0.5.xsd.'
- standard: mcode
  profile_or_url: http://hl7.org/fhir/us/mcode/StructureDefinition/mcode-cancer-disease-status
  resource: Observation (Profil CancerDiseaseStatus)
  path: Observation.valueCodeableConcept; Observation.code = LOINC 97509-4 (Pattern); Evidenzart über
    Observation.extension:evidenceType
  notes: mCODE STU4 (4.0.0). value[x] ist preferred an mcode-condition-status-trend-vs gebunden (268910001
    improved, 359746009 stable, 271299001 worsened, 709137006 undetermined). maxValueSet ist mcode-condition-status-trend-max-vs
    (zusätzlich Remissionscodes 550991000124107, 551001000124108, 103338009, 103337004 sowie 399409002
    Distant metastasis present). Evidenzart Bildgebung über die Extension http://hl7.org/fhir/us/mcode/StructureDefinition/mcode-cancer-disease-status-evidence-type
    (REQUIRED, u. a. is-a 363679005 Imaging). Zweitkarzinom über http://hl7.org/fhir/us/mcode/StructureDefinition/mcode-primary-cancer-condition.
    Metastasen über http://hl7.org/fhir/us/mcode/StructureDefinition/mcode-secondary-cancer-condition
    (beide Condition) bzw. als Status 399409002. Ein Rezidiv über Condition.clinicalStatus = recurrence
    der PrimaryCancerCondition. LOINC 97509-4 des Elements ist der Observation.code, kein Wert.
instruction_de: Bei Mehrfachbefunden Mehrfacheintrag (Cardinality 0..*). Quantitativer Ergänzungsbefund
  (Größenmessung Zielläsion) gehört in eine separate Beobachtung; freier Befundtext gehört in das DiagnosticReport-Dokument.
