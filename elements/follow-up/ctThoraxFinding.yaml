issues:
- 'Werte für MII Bildgebung prüfen: DiagnosticReport.conclusionCode.coding:sct ist REQUIRED an Clinical
  findings (< 404684003) gebunden (MII_VS_Bildgebung_Findings_SCT); die SNOMED-CT-Werte des Elements müssen
  daher Clinical findings sein. DiagnosticReport.code trägt einen radiologischen Dokument-LOINC (z. B.
  24627-2 „CT Chest“), nicht den Element-Code des Befundes.'
- 'Befundkategorien von ctThoraxFinding auf mCODE und oBDS abbilden. (1) mCODE CancerDiseaseStatus: value[x]
  ist preferred an das Trend-ValueSet gebunden (enthält 359746009 und 709137006); das maxValueSet erlaubt
  zusätzlich Remissionscodes und 399409002 ''Distant metastasis present''. 1259237005 (Rezidiv), 128462008
  (Metastase) und 878806005 (Zweitkarzinom) sind keine zulässigen Statuswerte. Rezidiv über Condition.clinicalStatus
  = recurrence der mcode-primary-cancer-condition; Metastase über mcode-secondary-cancer-condition (bzw.
  Status 399409002); Zweitkarzinom als neue mcode-primary-cancer-condition. (2) oBDS 17 (17.2 ist Pflichtfeld;
  dort bedeutet K ''keine Änderung = stable disease'' und V ''Vollremission''), Vorschlag: 359746009 →
  bei Tumorfreiheit (''kein Rezidivnachweis'') 17.2 V mit 17.3 bis 17.5 K, bei unverändertem Resttumor
  17.2 K mit N in 17.3 bis 17.5 für die betroffene Lokalisation. 1259237005 → 17.2 Y mit 17.3 R bzw. 17.4
  R je nach Lokalisation. 128462008 → nach vorheriger Tumorfreiheit 17.2 Y und 17.5 R, bei bereits bestehenden
  Fernmetastasen 17.2 P und 17.5 P; neue Metastasen jeweils zusätzlich unter 11 Fernmetastasen. 709137006
  → 17.2 U, für die betroffene Lokalisation ggf. 17.3 bis 17.5 F (fraglicher Befund). 878806005 → eigene
  Diagnose-Meldung. (3) FHIR-seitig entspricht oBDS 17 dem stabilen Profil mii-pr-onko-verlauf (MII Onkologie
  2026.0.3); offen ist, ob es zusätzlich als Mapping-Ziel aufgenommen wird. Zu entscheiden: Trend- und
  Ereigniscodes trennen und die Transformationsregeln festschreiben.'
