name: ctThoraxFinding
label_de: CT Thorax — radiologischer Befund
definition_de: Befund-Kategorisierung des CT Thorax in der Nachsorge (Tumorkinetik und lokale Ausdehnung).
  Ergebnisartefakt zum prozeduralen Datenelement 'ctThoraxScan'. Erfasst, ob kein Rezidivnachweis bzw.
  ein unveränderter (stabiler) Befund, ein lokoregionäres Rezidiv, eine Metastasierung, ein Zweitkarzinom
  oder ein unklarer bzw. nicht abschließend beurteilbarer Befund (z. B. neue Läsion unklarer Dignität)
  vorliegt. Therapieassoziierte Veränderungen (Strahlenpneumonitis, Strahlenfibrose) werden im Datenelement
  'postTherapyComplication' erfasst.
