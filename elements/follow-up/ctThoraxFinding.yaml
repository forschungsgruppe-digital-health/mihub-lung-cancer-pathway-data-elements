issues:
- 'standard_mappings[obds]: Der Feldname „Tumorstatus_Lokoregionaeres“ existiert im oBDS nicht. Das oBDS-XSD
  3.0.5 (22.09.2025; Felder unverändert gegenüber 3.0.4 vom 15.04.2025) führt in der Verlaufsmeldung (Verlauf):
  Gesamtbeurteilung_Tumorstatus (V/T/K/P/D/B/R/Y/U/X; Y = Rezidiv, U = Beurteilung unmöglich), Verlauf_Lokaler_Tumorstatus
  (K kein Tumor nachweisbar, T Tumorreste, P Tumorreste Progress, N Tumorreste No Change, R Lokalrezidiv,
  F fraglicher Befund, U unbekannt, X fehlende Angabe), Verlauf_Tumorstatus_Lymphknoten und Verlauf_Tumorstatus_Fernmetastasen.
  Empfohlene Abbildung: resource „Verlauf“, path „Verlauf_Lokaler_Tumorstatus / Verlauf_Tumorstatus_Lymphknoten
  / Verlauf_Tumorstatus_Fernmetastasen (+ Gesamtbeurteilung_Tumorstatus)“. Ein Zweitkarzinom ist kein
  Verlaufsstatus, sondern wird als eigener Tumor (eigene Tumorzuordnung) mit Diagnosemeldung gemeldet.
  Derselbe Feldnamenfehler steht in recurrenceOrSecondPrimary („Tumorstatus_Lokoregionaeres_Tumorstatus“).'
- 'standard_mappings[fhir-mii-kds] (DiagnosticReport): path fehlt. Im Profil MII_PR_Bildgebung_Radiologischer_Befund
  (MII-KDS Modul Bildgebung 2026.0.0) gehört die kodierte Befundkategorie auf DiagnosticReport.conclusionCode
  („Strukturiertes Fazit“; Slice coding:sct mit Required-Binding an MII_VS_Bildgebung_Findings_SCT = <
  404684003 |Clinical finding|, Slice coding:icd10-gm mit Required-Binding an ICD-10-GM). DiagnosticReport.code
  trägt dort einen radiologischen Dokument-LOINC (Required-Binding: SCALE_TYP Doc, CLASS RAD; z. B. 24627-2
  „CT Chest“ aus ctThoraxScan), nicht den Element-Code des Befundes. Empfehlung: path „DiagnosticReport.conclusionCode“
  ergänzen; die SNOMED-CT-Werte des Elements müssen Clinical findings sein.'
