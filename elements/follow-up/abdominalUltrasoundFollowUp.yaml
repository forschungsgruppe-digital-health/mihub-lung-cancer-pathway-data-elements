name: abdominalUltrasoundFollowUp
label_de: Sonografie Abdomen in der Nachsorge
definition_de: 'Datum einer Abdomensonographie als bildgebende Option des Nachsorgetermins (Indikation
  laut S3 Tab. 44: Leber- und Nebennierenmetastasen, paraaortale Lymphknotenvergrößerungen — im Original
  „paraaortale Lymphome“).'
phase: followup
tumor_entity:
- NSCLC
- SCLC
category: bildgebung
datatype: dateTime
cardinality: 0..*
value_set:
  binding_strength: extensible
  standard_binding_status: mapped
  notes: Die abdominelle Sonographie ohne Spezialverfahren hat im OPS 2026 keinen eigenen Kode (nur 3-03x
    komplexe differenzialdiagnostische Sonographie) — bewusst kein OPS-Coding.
  codings:
  - system: snomed-ct
    code: '45036003'
    display: Ultrasonography of abdomen
  - system: kdl
    code: DG020111
    display: Sonographiebefund
standard_mappings:
- standard: fhir-mii-kds
  profile_or_url: https://www.medizininformatik-initiative.de/fhir/ext/modul-bildgebung/StructureDefinition/mii-pr-bildgebung-bildgebungsstudie
  resource: ImagingStudy
  path: ImagingStudy.started
  notes: MII KDS Bildgebung 2026.0.0 (MII_PR_Bildgebung_Bildgebungsstudie); ImagingStudy.started 0..1
    MS. Modalität über ImagingStudy.modality bzw. ImagingStudy.series.modality (1..1, REQUIRED DICOM CID
    33, System http://dicom.nema.org/resources/ontology/DCM), hier US. Das Profil beschreibt eine DICOM-Studie;
    ohne DICOM-Studie alternativ Procedure https://www.medizininformatik-initiative.de/fhir/ext/modul-bildgebung/StructureDefinition/mii-pr-bildgebung-bildgebungsprozedur
    mit Procedure.performed[x] (1..1; code.coding:sct REQUIRED an Nachfahren von 363679005 Imaging, dazu
    coding:ops und coding:loinc).
care_process:
  trigger: 'Nachsorgetermin gemäß Nachsorgeplan (S3 Empf. 16.7: Option „Sonografie Abdomen“)'
  frequency_pattern: per-imaging-event
  responsible_role: Radiolog:in / Pneumolog:in / Hausärzt:in
  data_flows:
  - system: ris-pacs
    actor_role: Radiolog:in
    usage_type: capture
    sector: sektorenuebergreifend
  - system: kis
    actor_role: Onkolog:in / Pneumolog:in
    usage_type: read
    sector: stationaer
  - system: pvs
    actor_role: Hausärzt:in
    usage_type: read
    sector: ambulant
evidence:
  guideline_references:
  - source: S3-LL Lungenkarzinom
    version: 5.1 (Juli 2026, AWMF 020-007OL)
    url: https://www.leitlinienprogramm-onkologie.de/leitlinien/lungenkarzinom
    section: 'Empf. 16.7 (EK, geprüft 2026: bildgebende Option); Tab. 44 (Abdomensonographie: Leber- und
      Nebennierenmetastasen, paraaortale Lymphome)'
    recommendation_grade: EK
    evidence_level: n/a
    quote: Bei diesen Nachsorgeterminen sind eine dezidierte Anamnese, eine körperliche Untersuchung und
      geeignete bildgebende Verfahren (Röntgen Thorax, Sonografie Abdomen oder CT-Untersuchungen) durchzuführen.
      … Abdomensonographie … Leber und Nebennierenmetastasen, paraaortale Lymphome
    accessed: '2026-10-15'
    locator: S3 Kap. 16.3, Empf. 16.7 (EK, Starker Konsens, geprüft 2026), S. 498; Tab. 44, S. 499
  - source: Expert:innen-Erhebung MiHUB
    version: Excel-Erhebung Nachsorge-WG, Stand 2026-07-30 (Lungenkrebszentrum; Vorlage datenelement-erhebung_Nachsorge_WG_ak.xlsx)
    section: DE-022 Sonografie Abdomen (Onkologische Nachsorge)
    recommendation_grade: n/a
    evidence_level: n/a
    locator: docs/reviews/2026-10-13-erhebungen.md#wg-de-022
    quote: Sonografie Abdomen … Erstvorstellung innerhalb von 8 Wochen nach Abschluss der multimodalen
      Therapie (inklusive OP oder CTx/RTx … S3-LL Lungenkarzinom … 16.7 Apr. 2026
    accessed: '2026-10-15'
