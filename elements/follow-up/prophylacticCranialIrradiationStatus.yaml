issues:
- 'Wertebereich/Kardinalität: Bei cardinality 1..1 fehlt ein Status „PCI nicht indiziert“. Er betrifft
  (a) fehlende Remission bzw. fehlendes Ansprechen oder Progress nach der Erstlinientherapie (S3-LL Lungenkarzinom
  5.1, Empf. 9.11, 9.17 und 9.26 setzen Remission bzw. Ansprechen voraus) und (b) ältere Patient:innen
  mit SCLC-LD mit schlechtem Allgemeinzustand oder kognitiven Einschränkungen (Empf. 9.37: PCI nicht empfohlen).
  Solche Fälle würden sonst als leitlinienabweichendes „not-performed-no-surveillance“ fehlklassifiziert;
  die Bedingung „LD ohne PCI“ (Onkopedia SCLC Tab. 9) bleibt zwar ableitbar, die Bewertung der Leitlinienadhärenz
  aber nicht. Lokalen Code ergänzen oder Kardinalität 0..1 mit Anwendbarkeitsbedingung (SCLC nach kurativer
  Resektion oder mit Remission/Ansprechen nach Erstlinientherapie) festlegen und mit care_process.trigger
  abstimmen. Den Nenner von QI 15 (S3 Kap. 18, Tab. 45: LD mit Remission nach Chemo-Strahlentherapie)
  über das Ansprechen (recistResponse) ableiten, nicht über diesen Status.'
- 'Lokale Statuscodes von prophylacticCranialIrradiationStatus auf MII und oBDS abbilden. MII mii-pr-onko-strahlentherapie:
  performed → Procedure.status completed; not-performed-mri-surveillance, not-performed-no-surveillance
  und declined → status not-done mit statusReason (example-gebunden, lokale Gründe möglich). Das Profil
  verlangt aber auch bei not-done performed[x] (Period) 1..1 und eine Intention (K, P, S, X, O). oBDS:
  Meldbar ist nur die durchgeführte PCI (14.3 Zielgebiet 1.1, 14.1 Intention K oder P); eine Ablehnung
  nur über 19.2 bei vorliegender Therapieempfehlung; für die MRT-Überwachung käme allenfalls 19.1 Therapieempfehlung
  AS (Active Surveillance) in Frage. Zu entscheiden: Nicht-Durchführung, Ablehnung und MRT-Überwachung
  als Procedure not-done oder als eigene Observation führen und die Intention der PCI (K oder P) festlegen.'
