id: mihub.lung.followup.prophylacticCranialIrradiationStatus.v0.1
uuid: fc877f9f-2c14-51b2-ab7d-4bf9c47e34f2
name: prophylacticCranialIrradiationStatus
label_de: Prophylaktische Schädelbestrahlung (PCI) — Status
definition_de: Dokumentiert, ob nach Abschluss der Erstlinientherapie beim SCLC eine prophylaktische Schädelbestrahlung
  durchgeführt wurde, nicht durchgeführt wurde (zugunsten einer MRT-Überwachung bzw. ohne Überwachung)
  oder abgelehnt wurde. Steuerbedingung für „MRT Schädel bei LD ohne PCI“ (Onkopedia SCLC Tab. 9) und
  die MRT-Überwachung bei ED (Watch-and-Wait).
phase: followup
tumor_entity:
- SCLC
category: prozedur
datatype: CodeableConcept
cardinality: 1..1
value_set:
  binding_strength: example
  standard_binding_status: no-standard-found
  notes: Kein SNOMED-CT-Prozedurkonzept für die prophylaktische Schädelbestrahlung auf dem MII TermServ
    (SNOMED CT 20260701) gefunden; OPS 8-52x codiert nur die Bestrahlungstechnik. Projekt-lokale Statuscodes;
    perspektivisch FHIR Procedure (PCI) + Procedure.status.
  codings:
  - system: local-no-standard-binding
    code: performed
    display: PCI durchgeführt
  - system: local-no-standard-binding
    code: not-performed-mri-surveillance
    display: PCI nicht durchgeführt — MRT-Überwachung (Watch-and-Wait)
  - system: local-no-standard-binding
    code: not-performed-no-surveillance
    display: PCI nicht durchgeführt — keine strukturierte MRT-Überwachung
  - system: local-no-standard-binding
    code: declined
    display: PCI von der Patient:in abgelehnt
standard_mappings:
- standard: obds
  profile_or_url: https://www.basisdatensatz.de/basisdatensatz
  resource: 14 Strahlentherapie
  path: '14.3 Strahlentherapie Zielgebiet = 1.1 Ganzhirn (Neurokranium, inklusive Meningen) (XSD: ST/Menge_Bestrahlung/Bestrahlung/Applikationsart/Perkutan/Zielgebiet/CodeVersion2021);
    14.1 Intention der Strahlentherapie = K bzw. P (ST/Intention)'
  notes: 'Meldbar ist nur die durchgeführte PCI. Zielgebiet 6.1 ''Schädel'' gehört zur Skelett-Gruppe
    6 (6.2 Schädelbasis, 6.4 Halswirbelsäule …) und ist für die PCI falsch. Eine Intention ''prophylaktisch''
    gibt es nicht (K, P, O, S, X); laut XSD-Annotation kann ''Prophylaktisch/Salvage … als kurativ oder
    palliativ kodiert werden''. Eine Ablehnung ist allenfalls über 19.2 Therapieabweichung auf Wunsch
    des Patienten (Tumorkonferenz/Therapieempfehlung/Abweichung_Patientenwunsch) abbildbar; für die MRT-Überwachung
    gibt es kein eigenes Feld (siehe offener Punkt). Feldseite 14.3: https://basisdatensatz.de/feld/197/strahlentherapie-zielgebiet.
    Feldnummern nach der oBDS-Feldliste, XML-Namen nach https://basisdatensatz.de/xml/oBDS_v3.0.5.xsd.'
- standard: fhir-mii-kds
  profile_or_url: https://www.medizininformatik-initiative.de/fhir/ext/modul-onko/StructureDefinition/mii-pr-onko-strahlentherapie
  resource: Procedure
  path: Procedure.status (completed bzw. not-done) mit Procedure.statusReason; Procedure.extension:Intention;
    Zielgebiet 1.1 Ganzhirn über https://www.medizininformatik-initiative.de/fhir/ext/modul-onko/StructureDefinition/mii-pr-onko-strahlentherapie-bestrahlung-strahlentherapie
    (Procedure.bodySite)
  notes: MII KDS Onkologie 2026.0.3 (MII_PR_Onko_Strahlentherapie; baseDefinition MII Prozedur). status
    1..1 REQUIRED event-status; statusReason 0..1 (example procedure-not-performed-reason); extension:Intention
    1..1 REQUIRED mii-vs-onko-strahlentherapie-intention (K, P, S, X, O; kein Code 'prophylaktisch');
    performed[x] (Period) 1..1. Die einzelne Bestrahlung (Bestrahlungsprofil, partOf → Strahlentherapie)
    trägt das Zielgebiet in bodySite (extensible https://www.medizininformatik-initiative.de/fhir/ext/modul-onko/ValueSet/mii-vs-strahlentherapie-zielgebiet;
    Code 1.1 'Ganzhirn (Neurokranium, inklusive Meningen)' aus mii-cs-onko-strahlentherapie-zielgebiet).
    Abbildung der lokalen Statuscodes siehe offener Punkt.
care_process:
  trigger: 'PCI-Entscheidung nach der Erstlinientherapie: nach kurativer Resektion und adjuvanter Chemotherapie
    (Stadium I/II, VLD); nach Abschluss der (simultanen) Chemo-Strahlentherapie (LD sowie VLD bei primär
    definitiver Chemo-Strahlentherapie); bei der Response-Beurteilung nach Erstlinien-Chemo(-Immun)therapie
    (ED). Ein PCI-Angebot setzt Remission (S3 Empf. 9.11, 9.17) bzw. Ansprechen (S3 Empf. 9.26) voraus.'
  frequency_pattern: once-per-treatment-completion
  responsible_role: Strahlentherapeut:in / Onkolog:in
  data_flows:
  - system: kis
    actor_role: Onkolog:in / Pneumolog:in
    usage_type: capture
    sector: stationaer
  - system: pvs
    actor_role: Hausärzt:in
    usage_type: read
    sector: ambulant
  - system: tumordokumentation
    actor_role: Tumordokumentar:in
    usage_type: store
    sector: sektorenuebergreifend
