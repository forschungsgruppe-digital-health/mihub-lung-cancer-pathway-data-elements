id: mihub.lung.followup.structuredFollowUpPlan.v0.2
uuid: 772e3e32-bc74-59e5-adbb-27cde597980f
name: structuredFollowUpPlan
label_de: Strukturierter Nachsorgeplan vorhanden
definition_de: Dokumentiert, ob nach Abschluss einer multimodalen Therapie (Stadium I–IIIC, OMD), die
  ein lokal ablatives Verfahren (OP, RTx, CTx/RTx) beinhaltet, ein strukturierter Nachsorgeplan erstellt
  wurde, der geeignet ist, Rezidive, Zweitkarzinome, Komplikationen und Toxizitäten der Therapie sowie
  den Bedarf an Psychoonkologie und Sozialberatung zu erkennen.
phase: followup
tumor_entity:
- NSCLC
- SCLC
category: versorgungsplanung
datatype: boolean
cardinality: 1..1
value_set:
  binding_strength: extensible
  standard_binding_status: mapped
  codings:
  - system: kdl
    code: SD150101
    display: Follow up-Bogen
standard_mappings:
- standard: fhir-r4-base
  resource: CarePlan
  path: CarePlan.intent='plan'
care_process:
  trigger: Erstellung bei Abschluss der multimodalen (lokal ablativen) Therapie; Vorlage in der Erstvorstellung
    innerhalb von 8 Wochen nach Therapieende (Empf. 16.7).
  frequency_pattern: once-per-treatment-completion
  responsible_role: Lead-Clinician (Onkologe / Pneumologe / Thoraxchirurg)
evidence:
  guideline_references:
  - source: S3-LL Lungenkarzinom
    version: 5.1 (Juli 2026, AWMF 020-007OL)
    url: https://www.leitlinienprogramm-onkologie.de/leitlinien/lungenkarzinom
    section: 'Empf. 16.1 (EK, geprüft 2026); Empf. 16.7 (EK, geprüft 2026: Nachsorgeintervalle ab Erstvorstellung
      innerhalb von 8 Wochen nach Therapieabschluss)'
    recommendation_grade: EK
    evidence_level: n/a
    quote: Nach Abschluss einer multimodalen Therapie (Stadium I-IIIC, OMD), die ein lokal … ablatives
      Verfahren (OP, RTx, CTx/RTx) beinhaltet, sollte für jeden Patienten ein strukturierter Nachsorgeplan
      erstellt werden. … Diese Intervalle beginnen mit der Erstvorstellung innerhalb von 8 Wochen
    accessed: '2026-10-15'
    locator: Kap. 16.1, Empf. 16.1 (EK, geprüft 2026), S. 492; Empf. 16.7, S. 498
  - source: Onkopedia NSCLC
    version: Stand April 2025
    url: https://www.onkopedia.com/de/onkopedia/guidelines/lungenkarzinom-nicht-kleinzellig-nsclc
    section: Kap. 8.1 (Ziele der Nachsorge; Wert einer intensiven, strukturierten Nachsorge für das Überleben
      nicht gesichert)
    recommendation_grade: n/a
    evidence_level: n/a
    quote: Ziele der Nachsorge sind die frühzeitige Diagnose eines Rezidivs … Bei Pat. mit Lungenkarzinom
      ist der Wert einer intensiven, strukturierten Nachsorge in Bezug auf eine Verlängerung der Überlebenszeit
      nicht gesichert.
    accessed: '2026-10-15'
    locator: Onkopedia NSCLC, Kap. 8.1 Kurative Therapie
  - source: Onkopedia SCLC
    version: Stand August 2026
    url: https://www.onkopedia.com/de/onkopedia/guidelines/lungenkarzinom-kleinzellig-sclc
    section: Kap. 10.2 (strukturierte Nachsorge der lokalisierten Stadien VLD/LD, orientiert an den NSCLC-Empfehlungen)
    recommendation_grade: n/a
    evidence_level: n/a
    quote: Dies betrifft Pat. in den lokalisierten Stadien. Eine strukturierte Nachsorge kann sich an
      den Empfehlungen für das NSCLC orientieren, siehe Tabelle 9.
    accessed: '2026-10-15'
    locator: Onkopedia SCLC, Kap. 10.2 Nachsorge
