name: structuredFollowUpPlan
label_de: Strukturierter Nachsorgeplan vorhanden
definition_de: Dokumentiert, ob nach Abschluss einer multimodalen Therapie (Stadium I–IIIC, OMD), die
  ein lokal ablatives Verfahren (OP, RTx, CTx/RTx) beinhaltet, ein strukturierter Nachsorgeplan erstellt
  wurde, der geeignet ist, Rezidive, Zweitkarzinome, Komplikationen und Toxizitäten der Therapie sowie
  den Bedarf an Psychoonkologie und Sozialberatung zu erkennen.
