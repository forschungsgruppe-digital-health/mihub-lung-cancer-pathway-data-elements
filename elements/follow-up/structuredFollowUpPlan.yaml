issues:
- 'Semantische Codierung prüfen: KDL SD150101 „Follow up-Bogen“ bezeichnet laut KDL-Definition ein Formular
  zur Erfassung der Verlaufskontrolle nach Abschluss der Behandlung, nicht den Nachsorgeplan selbst. Nach
  Katalogkonvention (audit-log §6) steht KDL für die Dokumentebene (DocumentReference.type bzw. Composition.type),
  nicht für CarePlan.category. Option: SNOMED CT 736252007 „Cancer care plan“ (aktiv; Kind von 734163000
  „Care plan“; breiter, nicht nachsorgespezifisch) als Konzeptcode, z. B. für CarePlan.category, erwägen;
  KDL nur behalten, wenn der Plan als Dokument abgelegt wird. Einheitlich mit structuredSurveillancePlan
  (ebenfalls SD150101) entscheiden.'
