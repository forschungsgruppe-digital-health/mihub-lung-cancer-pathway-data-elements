uuid: f409fdca-e879-5257-aad6-987ce95bd6e6
name: pulmonaryFunctionTest
label_de: Lungenfunktionsprüfung in der Nachsorge
definition_de: Spirometrie und CO-Diffusionskapazität zur Überwachung von Lungenfunktionseinschränkung
  und Pneumonitis nach RTx/CTx-RTx.
phase: followup
tumor_entity:
- NSCLC
- SCLC
category: prozedur
datatype: dateTime
cardinality: 0..*
value_set:
  binding_strength: preferred
  standard_binding_status: mapped
  codings:
  - system: snomed-ct
    code: '23426006'
    display: Measurement of respiratory function
  - system: loinc
    code: 19911-7
    display: Diffusion capacity.carbon monoxide
  - system: ops
    code: 1-710
    display: Ganzkörperplethysmographie
  - system: kdl
    code: DG060108
    display: Dokumentationsbogen Lungenfunktionsprüfung
standard_mappings:
- standard: fhir-r4-base
  resource: Observation
  path: Observation.code
constraints_de: 'Pneumonitis-Risikofenster nach Strahlentherapie: 6–24 Monate nach Ende der Bestrahlung
  (Onkopedia NSCLC Kap. 6.2.2.1); in diesem Zeitraum soll die Lungenfunktionsprüfung einschließlich Diffusionskapazität
  fortgeführt werden. „(X)“ in den Onkopedia-Tabellen ist dort nicht legendiert (Lesart: fakultativ).'
care_process:
  trigger: 'Alle kurativ Behandelten Monat 3 und 6 (Onkopedia NSCLC Tab. 12; SCLC Tab. 9: Mo 3/6/9), fakultativ
    Monat 12/18/24; nach alleiniger Strahlentherapie/Radiochemotherapie bis zum Ende des Pneumonitis-Risikos
    fortführen (soll)'
  frequency_pattern: 'NSCLC: M3;M6;(M12;M18;M24) · SCLC: M3;M6;M9;(M12;M18;M24) · nach RT/RCT: bis Ende
    Pneumonitis-Risiko (6–24 Monate)'
  responsible_role: Pneumologie
evidence:
  guideline_references:
  - source: S3-LL Lungenkarzinom
    version: 5.1 (Juli 2026, AWMF 020-007OL)
    url: https://www.leitlinienprogramm-onkologie.de/leitlinien/lungenkarzinom
    section: 'Tab. 44 (Lungenfunktionsprüfung, CO-Diffusionskapazität: Lungenfunktionseinschränkung, Pneumonitis)'
    recommendation_grade: n/a
    evidence_level: n/a
  - source: Onkopedia NSCLC
    version: Stand April 2025
    url: https://www.onkopedia.com/de/onkopedia/guidelines/lungenkarzinom-nicht-kleinzellig-nsclc
    section: 'Kap. 8.1, Tab. 12 (Lungenfunktion: X Mo 3/6, (X) Mo 12/18/24); Kap. 8.1 Text (nach RT/RCT
      Überprüfung bis Ende des Pneumonitis-Risikos fortführen — soll); Kap. 6.2.2.1'
    recommendation_grade: n/a
    evidence_level: n/a
  - source: Onkopedia SCLC
    version: Stand August 2026
    url: https://www.onkopedia.com/de/onkopedia/guidelines/lungenkarzinom-kleinzellig-sclc
    section: 'Kap. 10.2, Tab. 9 (Lungenfunktion: X Mo 3/6/9, (X) Mo 12/18/24)'
    recommendation_grade: n/a
    evidence_level: n/a
