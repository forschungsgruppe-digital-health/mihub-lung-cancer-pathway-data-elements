id: mihub.lung.followup.pulmonaryFunctionTest.v0.1
uuid: f409fdca-e879-5257-aad6-987ce95bd6e6
name: pulmonaryFunctionTest
label_de: Lungenfunktionsprüfung in der Nachsorge
definition_de: Datum der Lungenfunktionsprüfung (Spirometrie, CO-Diffusionskapazität) in der Nachsorge
  nach kurativer Therapie zur Erfassung einer Lungenfunktionseinschränkung (z. B. nach Resektion) und
  einer Pneumonitis (nach RTx/CTx-RTx); Messwerte in fev1PercentPredicted und dlcoPercentPredicted.
phase: followup
tumor_entity:
- NSCLC
- SCLC
category: prozedur
datatype: dateTime
cardinality: 0..*
value_set:
  binding_strength: preferred
  standard_binding_status: mapped
  codings:
  - system: snomed-ct
    code: '23426006'
    display: Measurement of respiratory function
  - system: loinc
    code: 81458-2
    display: Pulmonary function test panel
  - system: ops
    code: 1-710
    display: Ganzkörperplethysmographie
  - system: kdl
    code: DG060108
    display: Dokumentationsbogen Lungenfunktionsprüfung
  - system: ops
    code: 1-711
    display: Bestimmung der CO-Diffusionskapazität
standard_mappings:
- standard: fhir-mii-kds
  profile_or_url: https://www.medizininformatik-initiative.de/fhir/ext/modul-lungenfunktion/StructureDefinition/mii-pr-lungenfunktion-spirometrie-messung
  resource: Procedure
  path: Procedure.performed[x] (performedDateTime)
  notes: 'nur Ballot de.medizininformatikinitiative.kerndatensatz.lungenfunktion#2027.0.0-ballot.1, kein
    stabiles Release. Basis MII Prozedur; performed[x] 1..1 MS; category.coding:sct Pattern 23426006 (Measurement
    of respiratory function); code.coding:sct Pattern 127783003 (Spirometrie). Weitere Messarten mit eigenem
    Profil: https://www.medizininformatik-initiative.de/fhir/ext/modul-lungenfunktion/StructureDefinition/mii-pr-lungenfunktion-diffusion-messung
    (36421003, CO-Diffusion) und https://www.medizininformatik-initiative.de/fhir/ext/modul-lungenfunktion/StructureDefinition/mii-pr-lungenfunktion-bodyplethysmographie-messung
    (28275007); Befundbericht https://www.medizininformatik-initiative.de/fhir/ext/modul-lungenfunktion/StructureDefinition/mii-pr-lungenfunktion-spirometrie
    (DiagnosticReport.effective[x]).'
- standard: fhir-r4-base
  profile_or_url: http://hl7.org/fhir/StructureDefinition/Procedure
  resource: Procedure
  path: 'Procedure.performedDateTime (Procedure.code: SNOMED 23426006 bzw. OPS 1-710, 1-711)'
  notes: Das Element ist ein Untersuchungsdatum; Observation.code trägt kein Datum. SNOMED 23426006 und
    OPS 1-710/1-711 sind Prozedurcodes. LOINC 81458-2 'Pulmonary function test panel' ist ein Panel-Code
    (Observation bzw. DiagnosticReport) und gehört nicht in Procedure.code. Alternativ als Befunddatum
    DiagnosticReport.effectiveDateTime. Analog zu bronchoscopyFollowUp.
constraints_de: 'Strahlenpneumonitis (symptomatisch bei 5–15 %) mit häufigem Übergang in eine pulmonale
  Fibrose; Onkopedia NSCLC Kap. 6.2.2.1: „Sie kann innerhalb von 6-24 Monaten nach Ende der Bestrahlung
  auftreten“ (Bezug Pneumonitis oder Fibrose im Text nicht eindeutig). Nach alleiniger RT/RCT soll die
  Lungenfunktionsprüfung bis zum Ende des Pneumonitis-Risikos fortgeführt werden (Kap. 8.1), einschließlich
  Diffusionskapazität (Kap. 6.2.2.1). „(X)“ in den Onkopedia-Tabellen ist dort nicht legendiert (Lesart:
  fakultativ).'
care_process:
  trigger: 'Alle kurativ Behandelten Monat 3 und 6 (Onkopedia NSCLC Tab. 12; SCLC Tab. 9: Mo 3/6/9), fakultativ
    Monat 12/18/24; nach alleiniger Strahlentherapie/Radiochemotherapie bis zum Ende des Pneumonitis-Risikos
    fortführen (soll)'
  frequency_pattern: 'NSCLC: M3;M6;(M12;M18;M24) · SCLC: M3;M6;M9;(M12;M18;M24) · nach RT/RCT: bis Ende
    Pneumonitis-Risiko (6–24 Monate)'
  responsible_role: Pneumologie
