issues:
- 'standard_mappings: Der Pfad „Observation.code“ trägt den Prozedur-/Panelcode, nicht den dateTime-Wert.
  Für datatype dateTime wäre Procedure.performedDateTime (analog bronchoscopyFollowUp) bzw. Observation.effectiveDateTime
  der Wertpfad. Das MII-KDS-Modul Lungenfunktion (2027.0.0-ballot.1) bildet die Messung als Procedure
  ab (Profile „Spirometrie Messung“, „Diffusion Messung“) und Einzelwerte wie FEV1 oder DLCO als Observation
  mit partOf auf diese Procedure; Zielprofil und Wertpfad zentral zu entscheiden.'
related_elements:
