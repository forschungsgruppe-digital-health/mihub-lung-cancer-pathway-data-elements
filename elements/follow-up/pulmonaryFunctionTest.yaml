id: mihub.lung.followup.pulmonaryFunctionTest.v0.1
uuid: f409fdca-e879-5257-aad6-987ce95bd6e6
name: pulmonaryFunctionTest
label_de: Lungenfunktionsprüfung in der Nachsorge
definition_de: Datum der Lungenfunktionsprüfung (Spirometrie, CO-Diffusionskapazität) in der Nachsorge
  nach kurativer Therapie zur Erfassung einer Lungenfunktionseinschränkung (z. B. nach Resektion) und
  einer Pneumonitis (nach RTx/CTx-RTx); Messwerte in fev1PercentPredicted und dlcoPercentPredicted.
phase: followup
tumor_entity:
- NSCLC
- SCLC
category: prozedur
datatype: dateTime
cardinality: 0..*
value_set:
  binding_strength: preferred
  standard_binding_status: mapped
  codings:
  - system: snomed-ct
    code: '23426006'
    display: Measurement of respiratory function
  - system: loinc
    code: 81458-2
    display: Pulmonary function test panel
  - system: ops
    code: 1-710
    display: Ganzkörperplethysmographie
  - system: kdl
    code: DG060108
    display: Dokumentationsbogen Lungenfunktionsprüfung
  - system: ops
    code: 1-711
    display: Bestimmung der CO-Diffusionskapazität
standard_mappings:
- standard: fhir-r4-base
  resource: Observation
  path: Observation.code
constraints_de: 'Strahlenpneumonitis (symptomatisch bei 5–15 %) mit häufigem Übergang in eine pulmonale
  Fibrose; Onkopedia NSCLC Kap. 6.2.2.1: „Sie kann innerhalb von 6-24 Monaten nach Ende der Bestrahlung
  auftreten“ (Bezug Pneumonitis oder Fibrose im Text nicht eindeutig). Nach alleiniger RT/RCT soll die
  Lungenfunktionsprüfung bis zum Ende des Pneumonitis-Risikos fortgeführt werden (Kap. 8.1), einschließlich
  Diffusionskapazität (Kap. 6.2.2.1). „(X)“ in den Onkopedia-Tabellen ist dort nicht legendiert (Lesart:
  fakultativ).'
care_process:
  trigger: 'Alle kurativ Behandelten Monat 3 und 6 (Onkopedia NSCLC Tab. 12; SCLC Tab. 9: Mo 3/6/9), fakultativ
    Monat 12/18/24; nach alleiniger Strahlentherapie/Radiochemotherapie bis zum Ende des Pneumonitis-Risikos
    fortführen (soll)'
  frequency_pattern: 'NSCLC: M3;M6;(M12;M18;M24) · SCLC: M3;M6;M9;(M12;M18;M24) · nach RT/RCT: bis Ende
    Pneumonitis-Risiko (6–24 Monate)'
  responsible_role: Pneumologie
