issues:
- 'Prozedurcodes von pulmonaryFunctionTest an das MII-Lungenfunktion-Ballot angleichen (ergänzt den offenen
  Punkt zu Zielprofil und Wertpfad). Im Ballot ist SNOMED 23426006 die Procedure.category; Procedure.code
  ist je Messart fest vorgegeben: Spirometrie 127783003, CO-Diffusion 36421003, Ganzkörperplethysmographie
  28275007 (OPS über code.coding:ops). OPS 1-711 entspricht der Diffusionsmessung, OPS 1-710 der Ganzkörperplethysmographie;
  für die Spirometrie führt das Element keinen eigenen Code. LOINC 81458-2 (Panel) ist kein Prozedurcode
  und auch nicht im LOINC-ValueSet des Spirometrie-Befunds (mii-vs-lufu-lnc-procedure enthält nur 18759-1).
  Zu entscheiden: ein Datum je Untersuchungstermin (Sammelcode 23426006) oder je Messart (eigene Procedure
  je Messung) und die Codes entsprechend ergänzen.'
