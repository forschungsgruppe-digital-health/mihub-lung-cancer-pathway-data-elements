  resource: ImagingStudy
  path: ImagingStudy.started
constraints_de: Als Alternative zum CT modelliert, nicht als Standard (S3 Kap. 16.3.3; Onkopedia NSCLC
  Tab. 12 / SCLC Tab. 9 nennen ausschließlich CT Thorax).
care_process:
  trigger: 'Nachsorgetermin ohne CT, gemäß Nachsorgeplan (S3 Empf. 16.7: „Röntgen Thorax, Sonografie Abdomen
    oder CT-Untersuchungen“)'
