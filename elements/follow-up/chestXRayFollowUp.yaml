id: mihub.lung.followup.chestXRayFollowUp.v0.1
uuid: 72337d28-7331-52c9-8537-931984bd9bc0
name: chestXRayFollowUp
label_de: Röntgen Thorax in der Nachsorge
definition_de: 'Datum einer Röntgen-Thorax-Aufnahme (2 Ebenen) als bildgebende Option des Nachsorgetermins
  (Tumorkinetik), wenn kein CT erfolgt. S3-Hintergrund 16.3.3: Röntgen-Thorax ist „nicht die relevante
  Untersuchung“ (LDCT effektiver); Onkopedia sieht als Thorax-Bildgebung in der Nachsorge nur CT vor (NSCLC
  Tab. 12, SCLC Tab. 9).'
phase: followup
tumor_entity:
- NSCLC
- SCLC
category: bildgebung
datatype: dateTime
cardinality: 0..*
value_set:
  binding_strength: extensible
  standard_binding_status: mapped
  codings:
  - system: snomed-ct
    code: '399208008'
    display: Plain X-ray of chest
  - system: loinc
    code: 30745-4
    display: XR Chest Views
  - system: kdl
    code: DG020110
    display: Röntgenbefund
standard_mappings:
- standard: fhir-mii-kds
  profile_or_url: https://www.medizininformatik-initiative.de/fhir/ext/modul-bildgebung/StructureDefinition/mii-pr-bildgebung-bildgebungsstudie
  resource: ImagingStudy
  path: ImagingStudy.started
  notes: MII KDS Bildgebung 2026.0.0 (MII_PR_Bildgebung_Bildgebungsstudie); ImagingStudy.started 0..1
    MS. Modalität über ImagingStudy.modality bzw. ImagingStudy.series.modality (1..1, REQUIRED DICOM CID
    33, System http://dicom.nema.org/resources/ontology/DCM), hier CR bzw. DX. Das Profil beschreibt eine
    DICOM-Studie; ohne DICOM-Studie alternativ Procedure https://www.medizininformatik-initiative.de/fhir/ext/modul-bildgebung/StructureDefinition/mii-pr-bildgebung-bildgebungsprozedur
    mit Procedure.performed[x] (1..1; code.coding:sct REQUIRED an Nachfahren von 363679005 Imaging, dazu
    coding:ops und coding:loinc).
constraints_de: Als Alternative zum CT modelliert, nicht als Standard (S3 Kap. 16.3.3; Onkopedia NSCLC
  Tab. 12 / SCLC Tab. 9 nennen ausschließlich CT Thorax).
care_process:
  trigger: 'Nachsorgetermin ohne CT, gemäß Nachsorgeplan (S3 Empf. 16.7: „Röntgen Thorax, Sonografie Abdomen
    oder CT-Untersuchungen“)'
  frequency_pattern: per-imaging-event
  responsible_role: Radiolog:in
  data_flows:
  - system: ris-pacs
    actor_role: Radiolog:in
    usage_type: capture
    sector: sektorenuebergreifend
  - system: kis
    actor_role: Onkolog:in / Pneumolog:in
    usage_type: read
    sector: stationaer
  - system: pvs
    actor_role: Hausärzt:in
    usage_type: read
    sector: ambulant
evidence:
  guideline_references:
  - source: S3-LL Lungenkarzinom
    version: 5.1 (Juli 2026, AWMF 020-007OL)
    url: https://www.leitlinienprogramm-onkologie.de/leitlinien/lungenkarzinom
    section: 'Empf. 16.7 (EK, geprüft 2026: bildgebende Option); Tab. 44 (Röntgen Thorax: Tumorkinetik);
      Kap. 16.3.3'
    recommendation_grade: EK
    evidence_level: n/a
    quote: Viele Patienten mussten randomisiert werden um zu zeigen, dass der Röntgen-Thorax nicht die
      relevante Untersuchung für diese Fragestellung darstellt. … geeignete bildgebende Verfahren (Röntgen
      Thorax, Sonografie Abdomen oder CT-Untersuchungen) … Röntgen Thorax … Tumorkinetik
    accessed: '2026-10-15'
    locator: S3 Kap. 16.3.3 (S. 495); Empf. 16.7 (EK, S. 498); Tab. 44 (S. 499)
  - source: Expert:innen-Erhebung MiHUB
    version: Excel-Erhebung Nachsorge-WG, Stand 2026-07-30 (Lungenkrebszentrum; Vorlage datenelement-erhebung_Nachsorge_WG_ak.xlsx)
    section: 'DE-021 Röntgen Thorax (Onkologische Nachsorge; Quelle lt. Erhebung: S3-LL 16.7)'
    recommendation_grade: n/a
    evidence_level: n/a
    locator: docs/reviews/2026-10-13-erhebungen.md#wg-de-021
    quote: Röntgen Thorax … Erstvorstellung innerhalb von 8 Wochen nach Abschluss der multimodalen Therapie
      (inklusive OP oder CTx/RTx … S3-LL Lungenkarzinom … 16.7 Apr. 2026
    accessed: '2026-10-15'
