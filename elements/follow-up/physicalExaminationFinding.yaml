issues:
- 'physicalExaminationFinding: (1) Rollen der Codings trennen, als katalogweite Konvention (vgl. die offenen
  Punkte zu followUpVisitDate und followUpHistoryFinding): 5880005 = Observation.code; 37931006 nur als
  component.code (Untersuchungsmethode); LOINC 29545-1 (Dokument-Skala) nur als Dokument- bzw. Sektionscode;
  Antwortwerte aus Clinical findings führen (282332003 „unauffällig“ ist bereits aufgenommen). (2) Surveillance-Trigger
  beibehalten und die Evidenz trennen: Basisevaluation einen Monat nach Abschluss der Induktion (postInductionEvaluationDate;
  S3-LL Lungenkarzinom 5.1 Empf. 16.9 nennt die körperliche Untersuchung hier ausdrücklich) und jede Verlaufskontroll-Visite
  (surveillanceVisit; Expert:innen-Erhebung DE-043, da Empf. 16.9 danach nur „geeignete Untersuchungsverfahren“
  nennt). Die Trennung in der section der S3-Referenz bzw. in constraints_de kenntlich machen.'
- 'Observation.code für physicalExaminationFinding festlegen (ergänzt den offenen Punkt zur Rollentrennung).
  Zwei Varianten: (a) Observation.code = LOINC 29545-1 ''Physical findings note'', das Untersuchungsverfahren
  5880005 bzw. 37931006 in Observation.method (in R4 example-gebunden an observation-methods, das Evaluationsprozeduren
  wie 5880005 umfasst); dagegen spricht, dass 29545-1 die LOINC-Skala Doc hat und ein Dokument- bzw. Sektionscode
  ist. (b) Observation.code = SNOMED 5880005 ''Physical examination procedure'', 37931006 als component.code
  und 29545-1 nur als Dokument- bzw. Sektionscode, wie im offenen Punkt zur Rollentrennung vorgeschlagen.
  Zu entscheiden ist zwischen (a) und (b). Außerdem fehlt ein ValueSet für die Befunde neben ''unauffällig''
  (282332003), etwa Auskultationsbefund, Lymphknotenstatus, Narbenverhältnisse, Ödeme und neurologischer
  Status.'
