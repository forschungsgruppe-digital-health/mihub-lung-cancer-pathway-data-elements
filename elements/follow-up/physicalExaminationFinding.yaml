name: physicalExaminationFinding
label_de: Körperliche Untersuchung — Befund
definition_de: Befund der körperlichen Untersuchung am Nachsorgetermin (z. B. Auskultation, Lymphknotenstatus,
  Narbenverhältnisse, Ödeme, neurologischer Status) bzw. „unauffällig“. Pathologische Befunde triggern
  weiterführende Diagnostik.
phase: followup
tumor_entity:
- NSCLC
- SCLC
category: befund
datatype: CodeableConcept
cardinality: 0..*
value_set:
  binding_strength: extensible
  standard_binding_status: mapped
  codings:
  - system: snomed-ct
    code: '5880005'
    display: Physical examination
  - system: snomed-ct
    code: '37931006'
    display: Auscultation
  - system: loinc
    code: 29545-1
    display: Physical findings note
  - system: snomed-ct
    code: '282332003'
    display: No abnormality detected - examination result
standard_mappings:
- standard: fhir-r4-base
  profile_or_url: http://hl7.org/fhir/StructureDefinition/Observation
  resource: Observation
  path: 'Observation.valueCodeableConcept bzw. Observation.component (Befund, z. B. 282332003); Observation.code
    offen (siehe offene Punkte): LOINC 29545-1 mit 5880005 bzw. 37931006 in Observation.method oder SNOMED
    5880005 mit 37931006 als Observation.method bzw. component.code; Bezug zum Nachsorgetermin über Observation.encounter'
  notes: 'SNOMED 5880005 ''Physical examination procedure (procedure)'' ist ein Prozedurkonzept, über
    315306007 Examination by method aber ein Nachfahre von 386053000 Evaluation procedure. In R4 ist es
    damit ein Beispielwert für Observation.method (example-gebunden an observation-methods: is-a 272394005,
    129264002 oder 386053000); ob es zugleich als Observation.code dient, ist offen. Dasselbe gilt für
    37931006 ''Auscultation (procedure)'', ebenfalls unter 315306007. LOINC 29545-1 ''Physical findings
    note'' hat in LOINC 2.83 die Skala Doc und ist ein Dokument- bzw. Sektionscode.'
