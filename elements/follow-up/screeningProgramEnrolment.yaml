evidence:
  guideline_references:
  - source: S3-LL Lungenkarzinom
    version: 5.1 (Juli 2026, AWMF 020-007OL)
    url: https://www.leitlinienprogramm-onkologie.de/leitlinien/lungenkarzinom
    section: 'Empf. 16.7 (EK, geprüft 2026: „nach 5 Jahren in ein Screeningprogramm eingeschlossen werden“);
      Kap. 16.3.2/16.3.3 (LDCT-Evidenz)'
    recommendation_grade: EK
    evidence_level: n/a
    quote: Nach abgeschlossener multimodaler Therapie (inklusive OP oder CTx/RTx) sollten … die Patienten
      in den ersten 2 Jahren vierteljährlich (alle 3 Monate), ab dem 3. Jahr halbjährlich untersucht und
      nach 5 Jahren in ein Screeningprogramm eingeschlossen werden.
    accessed: '2026-10-15'
    locator: Kap. 16.3, Empf. 16.7 (EK, geprüft 2026), S. 498
  - source: S3-LL Lungenkarzinom
    version: 5.1 (Juli 2026, AWMF 020-007OL)
    url: https://www.leitlinienprogramm-onkologie.de/leitlinien/lungenkarzinom
    section: 'Statement 5.2 (evidenzbasiertes Statement, geprüft 2026, Starker Konsens: asymptomatische
      Risikopersonen von 50–75 Jahren mit ≥ 15 Zigaretten/Tag über ≥ 25 Jahre oder ≥ 10 Zigaretten/Tag
      über ≥ 30 Jahre und Nikotinkarenz < 10 Jahre profitieren in der Regel von jährlicher Niedrigdosis-CT-Früherkennung;
      gesetzliche Zulässigkeit abweichend nach § 2 LuKrFrühErkV, Fußnote: Zigarettenkonsum ≥ 25 Jahre
      und ≥ 15 Packungsjahre); Tab. 11 (gesetzliche Vorgaben der LuKrFrühErkV, § 2 Zulässigkeit)'
    recommendation_grade: Statement
    evidence_level: '1'
    quote: Asymptomatische Risikopersonen für ein Lungenkarzinom … • ein Alter zwischen 50 und höchstens
      75 Jahren • einer Raucheranamnese von ≥ 15 Zigaretten/Tag für mindestens 25 Jahre … profitieren
      in der Regel von einem strukturierten Lungenkarzinom-Früherkennungsprogramm
    accessed: '2026-10-15'
    locator: Kap. 5.1, Statement 5.2 (ST, LoE 1, geprüft 2026), S. 75
  - source: andere
    version: 'G-BA Krebsfrüherkennungs-Richtlinie (KFE-RL), zuletzt geändert 18.12.2025, in Kraft 12.03.2026
      (Lungenkrebsfrüherkennung mittels Niedrigdosis-CT: Beschluss 18.06.2025, in Kraft 05.09.2025)'
    url: https://www.g-ba.de/richtlinien/17/
    section: 'Abschnitt D III Früherkennungsuntersuchung auf Lungenkrebs, § 38 Anspruchsvoraussetzungen
      (Abs. 1: 50. bis vor Vollendung des 76. Lebensjahres, Zigarettenkonsum nach § 2 Abs. 1 Nr. 3 Buchst.
      a i. V. m. § 1 Abs. 2 LuKrFrühErkV, grundsätzlich alle 12 Monate; Abs. 2: CT der Lunge aus anderem
      Grund innerhalb von 12 Monaten verschiebt den Anspruch; Abs. 3: Versicherte in Behandlung oder Nachbehandlung
      wegen Lungenkrebs werden kurativ versorgt); §§ 39–42 Ablauf (Bericht, Information inkl. Tabakentwöhnung,
      Prüfung der Zulässigkeit, Befundung)'
    recommendation_grade: n/a
    evidence_level: n/a
    quote: Versicherte Personen, die das 50., aber noch nicht das 76. Lebensjahr vollendet haben, … haben
      grundsätzlich alle 12 Monate Anspruch auf Leistungen im Rahmen der Früherkennung auf Lungenkrebs
      … Versicherte, die sich aufgrund einer Lungenkrebserkrankung in ärztlicher Behandlung oder Nachbehandlung
      befinden … haben Anspruch auf die notwendige ärztliche Betreuung und Behandlung innerhalb der kurativen
      Versorgung.
    accessed: '2026-11-25'
    locator: KFE-RL Abschnitt D III, § 38 Abs. 1 und Abs. 3, S. 26 (Fassung in Kraft 12.03.2026)
