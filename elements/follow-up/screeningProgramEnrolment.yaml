    section: 'Empf. 16.7 (EK, geprüft 2026: „nach 5 Jahren in ein Screeningprogramm eingeschlossen werden“);
      Kap. 16.3.2/16.3.3 (LDCT-Evidenz)'
    recommendation_grade: EK
    evidence_level: n/a
    quote: Nach abgeschlossener multimodaler Therapie (inklusive OP oder CTx/RTx) sollten … die Patienten
      in den ersten 2 Jahren vierteljährlich (alle 3 Monate), ab dem 3. Jahr halbjährlich untersucht und
      nach 5 Jahren in ein Screeningprogramm eingeschlossen werden.
    accessed: '2026-10-15'
    locator: Kap. 16.3, Empf. 16.7 (EK, geprüft 2026), S. 498
  - source: S3-LL Lungenkarzinom
    version: 5.1 (Juli 2026, AWMF 020-007OL)
    url: https://www.leitlinienprogramm-onkologie.de/leitlinien/lungenkarzinom
    section: 'Statement 5.2 (evidenzbasiertes Statement, geprüft 2026, Starker Konsens: asymptomatische
      Risikopersonen von 50–75 Jahren mit ≥ 15 Zigaretten/Tag über ≥ 25 Jahre oder ≥ 10 Zigaretten/Tag
      über ≥ 30 Jahre und Nikotinkarenz < 10 Jahre profitieren in der Regel von jährlicher Niedrigdosis-CT-Früherkennung;
      gesetzliche Zulässigkeit abweichend nach § 2 LuKrFrühErkV, Fußnote: Zigarettenkonsum ≥ 25 Jahre
      und ≥ 15 Packungsjahre); Tab. 11 (gesetzliche Vorgaben der LuKrFrühErkV, § 2 Zulässigkeit)'
    recommendation_grade: Statement
    evidence_level: '1'
    quote: Asymptomatische Risikopersonen für ein Lungenkarzinom … • ein Alter zwischen 50 und höchstens
      75 Jahren • einer Raucheranamnese von ≥ 15 Zigaretten/Tag für mindestens 25 Jahre … profitieren
      in der Regel von einem strukturierten Lungenkarzinom-Früherkennungsprogramm
    accessed: '2026-10-15'
    locator: Kap. 5.1, Statement 5.2 (ST, LoE 1, geprüft 2026), S. 75
