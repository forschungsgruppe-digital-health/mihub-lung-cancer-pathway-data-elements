issues:
- 'Status vs. Datentyp/Zulässigkeit: definition_de nennt „Datum/Status“, datatype ist nur dateTime. Ein
  Einschluss in ein LDCT-Früherkennungsprogramm nach 5 Jahren (S3-LL Lungenkarzinom 5.1, Empf. 16.7) setzt
  die gesetzliche Zulässigkeit nach § 2 LuKrFrühErkV voraus (S3 Tab. 11: Alter, Tabakrauchexposition,
  Dauer der Nikotinkarenz und medizinisches Eignungsprofil; Tabakkriterium laut Fußnote zu Statement 5.2:
  Zigarettenkonsum ≥ 25 Jahre und ≥ 15 Packungsjahre); die Eignungsprüfung regeln Empf. 5.4 und 5.5. Davon
  zu unterscheiden ist die evidenzbasierte Risikodefinition in Statement 5.2 (50–75 Jahre; ≥ 15 Zigaretten/Tag
  über ≥ 25 Jahre oder ≥ 10 Zigaretten/Tag über ≥ 30 Jahre; Nikotinkarenz < 10 Jahre). Überlebende sind
  daher nicht automatisch zulässig. Status (eingeschlossen / nicht zulässig / abgelehnt) zusätzlich zum
  Datum erfassen oder „Status“ aus der Definition streichen. Für die Zulässigkeitsprüfung fehlen im Katalog
  zudem Packungsjahre, Rauchdauer und Karenzdauer (smokingStatus erfasst nur den Konsumstatus). Kontext
  S3 Kap. 16.3.4: „Ob eine weitere Nachsorge nach 5 Jahren sinnvoll ist, ist strittig.“'
