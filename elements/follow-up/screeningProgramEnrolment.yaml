label_de: Übergang in ein Lungenkrebs-Früherkennungsprogramm
definition_de: Dokumentation (Datum/Status), dass die Patient:in nach Abschluss des 5. Nachsorgejahres
  in ein (LDCT-)Lungenkrebs-Früherkennungsprogramm eingeschlossen wurde. Das Intervall des Programms ist
  nicht Teil der S3-Nachsorgeempfehlung.
