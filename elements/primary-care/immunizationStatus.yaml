issues:
- 'Stand 2026-11-25 zu den Impfempfehlungen: Abgeglichen sind die Onkopedia-Leitlinie „Impfungen bei malignen
  Erkrankungen und Immunsuppression“ (DGHO/AGIHO, Mai 2026, Tab. 5) und die STIKO-Empfehlungen 2026 (Epid
  Bull 4/2026, Tab. 2 und Kap. 4.9; GKV-Umsetzung über die Schutzimpfungs-Richtlinie, zuletzt geändert
  03.09.2026, in Kraft 29.10.2026). Die S3-LL Lungenkarzinom 5.1 enthält keine eigene Impfempfehlung (Kap.
  12 verweist auf die S3-LL Supportive Therapie). RSV wurde in definition_de aufgenommen. Offen: Therapiebedingte
  Besonderheiten (keine Lebendimpfungen im Kontext der Tumortherapie, Onkopedia Kap. 2.1.1; Impfzeitpunkt
  rechtzeitig vor geplanter iatrogener Immunsuppression, STIKO Kap. 4.9; Abweichungen von den allgemeinen
  Impfempfehlungen zusammen mit dem Impfstatus darstellen, Klein et al. 2026, S. 96) im Impfstatus oder
  als Hinweis in recommendationsForPrimaryCare bzw. riskFactorAndAlert führen?'
- 'Das Element ist als Impfstatus modelliert (CodeableConcept mit 304250009, 425457005, 87273-9, 105580-5,
  AM160102); das Impfpass-MIO dokumentiert dagegen einzelne Impfungen mit Impfstoffcode (SNOMED/ATC),
  Zielerkrankung und Datum. Zu entscheiden: den Impfstatus als aus Immunization-Einträgen abgeleitete
  Zusammenfassung definieren oder das Element um Impfstoff, Zielerkrankung (z. B. Influenza, Pneumokokken,
  COVID-19, Herpes zoster) und Impfdatum ergänzen.'
