name: immunizationStatus
label_de: Impfstatus
definition_de: Impfstatus der Patient:in (Impfausweis/Impfhistorie), insbesondere Influenza-, Pneumokokken-,
  COVID-19- und Herpes-zoster-Impfung bei onkologischen Patient:innen.
phase: primarycare
tumor_entity:
- lung_cancer_any
category: medikation
datatype: CodeableConcept
cardinality: 0..*
value_set:
  binding_strength: extensible
  standard_binding_status: mapped
  codings:
  - system: snomed-ct
    code: '304250009'
    display: Immunization status
  - system: snomed-ct
    code: '425457005'
    display: History of vaccination
  - system: loinc
    code: 87273-9
    display: Immunization Note
  - system: loinc
    code: 105580-5
    display: Immunization Certificate
  - system: kdl
    code: AM160102
    display: Impfausweis
standard_mappings:
- standard: kbv-mio
  profile_or_url: https://fhir.kbv.de/StructureDefinition/KBV_PR_MIO_Vaccination_Record_Prime
  resource: Immunization (MIO Impfpass 1.1.0)
  path: Immunization.vaccineCode.coding:snomed_CT (1..1, REQUIRED KBV_VS_MIO_Vaccination_Vaccine), optional
    :atc; Immunization.protocolApplied.targetDisease (REQUIRED KBV_VS_MIO_Vaccination_TargetDisease);
    Immunization.occurrence[x]
  notes: Eine Immunization je dokumentierter Impfung (status fix completed). Die Element-Codes 304250009
    und 425457005 sind Status- bzw. Anamnesecodes, keine Impfstoffcodes (zur Repräsentation siehe Issue).
    KBV_PR_MIO_Vaccination_Observation_Immunization_Status bildet Immunitätsnachweise per Labortest ab,
    nicht den Impfstatus. Nachgetragene Impfungen aus der Impfhistorie (z. B. Übertrag aus dem Papier-Impfausweis)
    über https://fhir.kbv.de/StructureDefinition/KBV_PR_MIO_Vaccination_Record_Addendum (primarySource
    fix false, reportOrigin 1..1, vaccineCode.coding:snomed_CT 0..1).
- standard: fhir-r4-base
  resource: Immunization
care_process:
  trigger: Anamnese; vor Beginn der Tumortherapie (sofern der Therapiebeginn nicht dringlich ist); bei
