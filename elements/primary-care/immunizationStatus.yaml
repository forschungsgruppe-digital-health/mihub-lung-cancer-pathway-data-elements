issues:
- S3-LL Lungenkarzinom 5.1 enthält keine Impfempfehlung (Kap. 12 verweist auf S3-LL Supportive Therapie);
  Quelle STIKO/Onkopedia „Impfungen“ noch zu prüfen.
- 'Stand 2026-10-14 zu den Impfempfehlungen: Die Onkopedia-Leitlinie „Impfungen bei malignen Erkrankungen
  und Immunsuppression“ (DGHO/AGIHO, Stand Mai 2026; Webabruf 2026-10-14, außerhalb des kuratierten Quellkorpus,
  UNSICHER) ist geprüft. Ihre Tab. 5 empfiehlt für Patient:innen mit soliden Tumoren u. a. Influenza-,
  Pneumokokken-Konjugat-, COVID-19-, RSV- und rekombinante Zoster-Impfung (je SoR A, AGIHO/ESCMID-Skala).
  Zur Entscheidung: (a) RSV in die Aufzählung in definition_de aufnehmen? (b) Therapiebedingte Besonderheiten
  (z. B. Lebendimpfungen im Kontext der Tumortherapie nicht empfohlen, Onkopedia Kap. 2.1.1; Abweichungen
  von den allgemeinen Impfempfehlungen zusammen mit dem Impfstatus darstellen, Klein et al. 2026, S. 96)
  im Impfstatus oder als Hinweis in recommendationsForPrimaryCare bzw. riskFactorAndAlert führen? Offen
  bleibt der Abgleich mit den aktuellen STIKO-Empfehlungen (Indikationsimpfungen bei Immundefizienz);
  aus dem Issue zur fehlenden S3-Impfempfehlung ist damit nur noch dieser STIKO-Teil offen.'
- 'Das Element ist als Impfstatus modelliert (CodeableConcept mit 304250009, 425457005, 87273-9, 105580-5,
  AM160102); das Impfpass-MIO dokumentiert dagegen einzelne Impfungen mit Impfstoffcode (SNOMED/ATC),
  Zielerkrankung und Datum. Zu entscheiden: den Impfstatus als aus Immunization-Einträgen abgeleitete
  Zusammenfassung definieren oder das Element um Impfstoff, Zielerkrankung (z. B. Influenza, Pneumokokken,
  COVID-19, Herpes zoster) und Impfdatum ergänzen.'
