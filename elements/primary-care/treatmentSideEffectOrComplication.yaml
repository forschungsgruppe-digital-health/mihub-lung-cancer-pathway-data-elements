issues:
- 'Laut Erhebung (DE-018, DE-028) ist die Onkolog:in verantwortlich, in den data_flows ist sie aber nur
  lesend (kis/read) eingetragen. Klären und ggf. ergänzen: Erfassung durch die Onkolog:in (KIS, Übermittlung
  per Arztbrief) und Übernahme als ICD-kodierte Diagnose im PVS durch die Hausärzt:in.'
