issues:
- 'DMP-Einschreibung (DE-021: ''Anbindung in Disease-Management-Programm(en)'') ist keine Diagnose und
  nicht nach ICD-10-GM codierbar. Entweder als eigenes Attribut bzw. Element (Programmteilnahme) modellieren
  oder ongoingSupportiveServices zuordnen. ''Risiken'' gegen riskFactorAndAlert (DE-036) abgrenzen.'
