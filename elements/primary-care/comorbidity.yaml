      und Epikrise; Ergebnisse S. 94
  - source: OCP Lung (AU)
    version: 2nd ed. 2021 (Update 07/2025)
    url: https://www.cancer.org.au/assets/pdf/ocp/lung-cancer-2nd-edition
    section: 'Step 5.2 Follow-up care (S. 45: General practitioners „manage comorbidities“); Step 5.2.1
      Preventing recurrence (S. 45: „Ongoing coordination of care between providers should also deal with
      any comorbidities“)'
    recommendation_grade: n/a
    evidence_level: n/a
    quote: 'General practitioners (including nurses) can: … manage comorbidities … Ongoing coordination
      of care between providers should also deal with any comorbidities, particularly ongoing complex
      and life-threatening comorbid conditions.'
    accessed: '2026-10-15'
    locator: OCP Lung 2nd ed., Step 5.2 Follow-up care and Step 5.2.1 Preventing recurrence, S. 45
  - source: S3-LL Lungenkarzinom
    version: 5.1 (Juli 2026, AWMF 020-007OL)
    url: https://www.leitlinienprogramm-onkologie.de/leitlinien/lungenkarzinom
    section: Kap. 8 Therapie des nicht-kleinzelligen Lungenkarzinoms, 8.1 Bedeutung von Alter, Komorbidität,
      prognostischer Einschätzung und Symptomlast als Selektionskriterium für Therapiemaßnahmen – Empf.
      8.1 (konsensbasiert, Starker Konsens, geprüft 2026; S. 200; Geltungsbereich NSCLC)
    recommendation_grade: EK
    evidence_level: n/a
    quote: Ein höheres Lebensalter sollte kein alleiniger Ausschlussgrund zur Behandlung … mit einer Therapiemodalität
      (Chemotherapie, Radiotherapie, Operation) sein. Von größerer Relevanz ist das Spektrum der Komorbiditäten.
    accessed: '2026-10-15'
    locator: S3-LL Lungenkarzinom 5.1, Kap. 8.1, Empf. 8.1 (EK, geprüft 2026, Starker Konsens), S. 200
  - source: AG LONKO / Survivorship
    version: Empfehlungspapiere UAG Daten (17.06.2021) und UAG Versorgungsmodelle (18.06.2021), Nationaler
      Krebsplan
    url: https://www.bundesgesundheitsministerium.de/fileadmin/Dateien/3_Downloads/N/Nationaler_Krebsplan/Empfehlungspapier_UAG_Daten_AG_LONKO_bf.pdf
    section: 'UAG Daten, Kap. 4 Grundsätzlicher Datenbedarf (S. 9): Nachsorgepässe sollten neben den Nachsorgeempfehlungen
      Tumordiagnose und -therapie inkl. Komplikationen sowie bestehende Komorbiditäten zusammenfassen
      (Kontext: Transition nach Krebserkrankung im Kindes- oder Jugendalter in die Allgemeinmedizin oder
      Innere Medizin; Nutzen ausdrücklich nicht auf jüngere Krebspatient:innen beschränkt)'
    recommendation_grade: n/a
    evidence_level: n/a
    quote: Neben den Nachsorgeempfehlungen sollten die vorhandenen bzw. noch zu etablierenden Nachsorgepässe
      auch die Informationen zur Tumordiagnose und -therapie (einschließlich deren Komplikationen) sowie
      die ggf. bestehenden Komorbiditäten des/der Patienten/Patientin zusammenfassen.
    accessed: '2026-10-15'
    locator: AG LONKO, Empfehlungspapier UAG „Daten“ (17.06.2021), Kap. 4 Grundsätzlicher Datenbedarf,
      S. 9 (Datei ag-lonko-daten.txt)
