id: mihub.lung.primarycare.comorbidity.v0.1
uuid: 86a66291-9bfe-5d29-9715-6810fe7546da
name: comorbidity
label_de: Komorbiditäten / weitere Diagnosen
definition_de: Weitere (chronische) Erkrankungen und Risiken der Patient:in inkl. Einschreibung in Disease-Management-Programme;
  codiert nach ICD-10-GM.
phase: primarycare
tumor_entity:
- lung_cancer_any
category: diagnose
datatype: CodeableConcept
cardinality: 0..*
value_set:
  binding_strength: extensible
  standard_binding_status: mapped
  codings:
  - system: snomed-ct
    code: '398192003'
    display: Co-morbid conditions
  - system: loinc
    code: 75618-9
    display: Comorbid condition
  - system: loinc
    code: 11450-4
    display: Problem list - Reported
  notes: 'Antwortwerte: ICD-10-GM-Diagnosen (CodeSystem http://fhir.de/CodeSystem/bfarm/icd-10-gm) gemäß
    MII-KDS Diagnose (Modul Diagnose 2025.0.1; KDS-Basismodule 2026.0.1): Condition.code.coding:icd10-gm,
    Binding required an https://www.medizininformatik-initiative.de/fhir/core/modul-diagnose/ValueSet/mii-vs-diagnose-icd10gm.
    SNOMED CT 398192003 und LOINC 75618-9 sind Elementcodes, LOINC 11450-4 ist ein Abschnittscode (Problemliste).
    DMP-Einschreibung ist nicht ICD-codierbar.'
standard_mappings:
- standard: fhir-mii-kds
  profile_or_url: https://www.medizininformatik-initiative.de/fhir/core/modul-diagnose/StructureDefinition/Diagnose
  resource: Condition
  path: Condition.code (ICD-10-GM)
- standard: kbv-mio
  profile_or_url: https://fhir.kbv.de/StructureDefinition/KBV_PR_MIO_NFD_Condition
  resource: Condition (MIO Patientenkurzakte 1.0.0, Notfalldaten)
  path: Condition.code.coding:ICD-10-GM (höchstens ein Coding je Condition); Condition.code.text (1..1)
  notes: Transport im Bundle https://fhir.kbv.de/StructureDefinition/KBV_PR_MIO_NFDxDPE_Bundle. Die Patientenkurzakte
    besteht aus Notfalldaten (NFD) und persönlichen Erklärungen (DPE).
care_process:
  trigger: Anamnese; fortlaufend
  frequency_pattern: per-encounter
  responsible_role: Hausärzt:in
  data_flows:
  - system: pvs
    actor_role: Hausärzt:in
    usage_type: capture
    sector: ambulant
  - system: kis
    actor_role: Onkolog:in
    usage_type: read
    sector: stationaer
