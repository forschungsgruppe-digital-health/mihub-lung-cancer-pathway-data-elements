id: mihub.lung.primarycare.tnmStage.v0.1
uuid: 4d044a25-2ac3-5647-b2fd-3bcc5f3d8132
name: tnmStage
label_de: TNM-Stadium / UICC-Stadiengruppe
definition_de: 'Ausmaß und Ausbreitung des Tumors (Staging): klinische bzw. pathologische TNM-Klassifikation
  inkl. UICC-Stadiengruppe und TNM-Version.'
phase: primarycare
tumor_entity:
- lung_cancer_any
category: befund
datatype: CodeableConcept
cardinality: 0..*
value_set:
  binding_strength: extensible
  standard_binding_status: mapped
  codings:
  - system: snomed-ct
    code: '399537006'
    display: Clinical TNM stage grouping
  - system: snomed-ct
    code: '399588009'
    display: Pathologic TNM stage grouping
  - system: snomed-ct
    code: '399390009'
    display: TNM stage grouping
  - system: loinc
    code: 21908-9
    display: Stage group.clinical Cancer
  - system: loinc
    code: 21902-2
    display: Stage group.pathology Cancer
  - system: loinc
    code: 21917-0
    display: Version used [Identifier] TNM classification
standard_mappings:
- standard: obds
  profile_or_url: https://www.basisdatensatz.de/basisdatensatz
  resource: 8 TNM-Klassifikation (in 5 Diagnose und in Pathologie als cTNM bzw. pTNM, ferner in OP und
    Verlauf als TNM)
  path: 'TNM_Typ: Datum (8.1), Version (8.2), c_p_u_Praefix_T/_N/_M (8.6–8.8), T (8.9), N (8.11), M (8.12),
    UICC_Stadium (8.17)'
  notes: Feldnummern nach der oBDS-Feldliste (BAnz 12.07.2021), XML-Namen nach https://basisdatensatz.de/xml/oBDS_v3.0.5.xsd.
- standard: mcode
  profile_or_url: http://hl7.org/fhir/us/mcode/StructureDefinition/mcode-tnm-stage-group
  resource: Observation (Profil TNMStageGroup)
  path: 'Observation.code (preferred mcode-tnm-stage-group-staging-type-vs: 399390009, 399537006, 399588009);
    Observation.valueCodeableConcept (Stadiengruppe); Observation.method (1..1, z. B. NCI C188404 UICC);
    Observation.focus → Primary Cancer Condition'
  notes: mCODE STU4 (4.0.0). Die Stadienwerte folgen AJCC; im deutschen Kontext gilt UICC (oBDS 8.17).
    Die Element-Codes 399390009, 399537006 und 399588009 liegen im Staging-Typ-VS.
- standard: fhir-mii-kds
  profile_or_url: https://www.medizininformatik-initiative.de/fhir/ext/modul-onko/StructureDefinition/mii-pr-onko-tnm-klassifikation
  resource: Observation
  path: 'Observation.code (REQUIRED mii-vs-onko-tnm-klassifikation-typ: 399390009, 399537006 klinisch,
    399588009 pathologisch); Observation.valueCodeableConcept (REQUIRED UICC-Stadium, mii-vs-onko-tnm-uicc-stadium);
    Observation.method (REQUIRED TNM-Version, mii-vs-onko-tnm-version); Observation.hasMember → T-, N-,
    M-Kategorie (mii-pr-onko-tnm-t-kategorie usw.)'
  notes: Modul Onkologie 2026.0.3, Namensraum …/fhir/ext/modul-onko/. Die Element-Codes 399390009, 399537006
    und 399588009 liegen im REQUIRED-ValueSet für Observation.code; die LOINC-Codes 21908-9 und 21902-2
    sind als alleiniger Observation.code nicht zulässig, allenfalls als Zusatz-Coding neben 399537006
    bzw. 399588009; die TNM-Version (LOINC 21917-0) gehört in Observation.method (mii-cs-onko-tnm-version).
care_process:
  trigger: Staging bei Erstdiagnose (cTNM) bzw. nach Resektion (pTNM); nach neoadjuvanter Therapie (yTNM);
    Re-Staging bei Rezidiv (rTNM); Übernahme in die Hausarztakte
  frequency_pattern: once je Staging-Ereignis (cTNM vor Therapiebeginn, pTNM nach Resektion, ycTNM/ypTNM
    nach neoadjuvanter Therapie, rTNM bei Rezidiv); eine festgesetzte Klassifikation bleibt unverändert
    – Folgeereignisse als eigene Klassifikation mit Präfix erfassen, nicht überschreiben
  responsible_role: Radiolog:in / Patholog:in / Onkolog:in / Tumorboard
  data_flows:
  - system: kis
    actor_role: Onkolog:in
    usage_type: capture
    sector: stationaer
  - system: pvs
    actor_role: Hausärzt:in
    usage_type: read
    sector: ambulant
  - system: epa
    actor_role: Patient:in
    usage_type: read
    sector: sektorenuebergreifend
