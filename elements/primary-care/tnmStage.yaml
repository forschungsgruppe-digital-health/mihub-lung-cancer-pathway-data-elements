issues:
- 'Das Element bündelt T/N/M-Kategorien (Präfixe c/p/y/r), UICC-Stadiengruppe und TNM-Auflage in einem
  CodeableConcept. Die Codings sind nur Element-Codes; LOINC 21917-0 (TNM-Auflage) ist eine andere Frage.
  Ein Wertebereich (UICC-Stadien 0–IVB nach TNM 9, S3 Tab. 26) fehlt. Empfehlung: Teilelemente (Stadiengruppe,
  T, N, M, TNM-Auflage) oder ein Wertebereich plus TNM-Auflage als eigene Angabe. Das ist relevant, weil
  Befunde vor 01/2025 nach TNM 8 klassifiziert sind.'
