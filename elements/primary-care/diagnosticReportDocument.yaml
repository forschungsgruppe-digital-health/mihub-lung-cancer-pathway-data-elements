id: mihub.lung.primarycare.diagnosticReportDocument.v0.1
uuid: 9b1bd81c-3174-5d5c-b0fb-d31dec7cd833
name: diagnosticReportDocument
label_de: Befundbericht Diagnostik (Bildgebung, Endoskopie, Biopsie)
definition_de: Befunddokumente der Diagnostik — Röntgen Thorax, CT Thorax, PET-CT, MRT, EBUS/Bronchoskopie,
  Biopsie/Histologie — als Dokument mit Zusammenfassung; für die Hausarztpraxis sind alle Bildgebungsbefunde
  („Zusammenfassung lesen“) relevant.
phase: primarycare
tumor_entity:
- lung_cancer_any
category: dokument
datatype: Reference
cardinality: 1..*
value_set:
  binding_strength: extensible
  standard_binding_status: mapped
  codings:
  - system: kdl
    code: DG020103
    display: CT-Befund
  - system: kdl
    code: DG020107
    display: MRT-Befund
  - system: kdl
    code: DG020110
    display: Röntgenbefund
  - system: kdl
    code: DG020109
    display: PET-Befund
  - system: kdl
    code: DG020105
    display: Endoskopiebefund
  - system: kdl
    code: PT080102
    display: Histologiebefund
  - system: kdl
    code: DG020111
    display: Sonographiebefund
  - system: kdl
    code: PT260102
    display: Zytologiebefund
standard_mappings:
- standard: ihe-xds
  profile_or_url: http://ihe-d.de/ValueSets/IHEXDStypeCode
  resource: 'XDS DocumentEntry (FHIR-Pendant: DocumentReference über MHD)'
  path: DocumentEntry.classCode = BEF (Befundbericht; http://ihe-d.de/ValueSets/IHEXDSclassCode); DocumentEntry.typeCode
    = BILD (Ergebnisse bildgebender Diagnostik; nach IHE-D-Definition inkl. Röntgen, CT, MRT, PET, Sonographie,
    Endoskopie- und Bronchoskopiebefund) bzw. PATH (Pathologiebefundberichte inkl. Histologie und Zytopathologie);
    BEFU nur als Auffangcode; KDL-Code (z. B. DG020103) in DocumentEntry.eventCodeList (http://ihe-d.de/ValueSets/IHEXDSeventCodeList)
  notes: classCode und typeCode stammen aus den IHE-D-Value-Sets (de.ihe-d.terminology 3.0.1), nicht aus
    der KDL; die KDL ist über die eventCodeList eingebunden (IHEXDSeventCodeList inkludiert http://dvmd.de/fhir/ValueSet/kdl).
- standard: gematik-epa-fhir
  profile_or_url: https://gematik.de/fhir/epa-mhd/StructureDefinition/epa-mhd-document-reference
  resource: DocumentReference (ePA MHD)
  path: DocumentReference.category (1..1; coding REQUIRED epa-xds-class-code-vs, z. B. BEF); DocumentReference.type
    (1..1; coding REQUIRED epa-xds-type-code-vs, z. B. BILD inkl. Sonographie, Endoskopie und Bronchoskopie,
    PATH inkl. Histologie und Zytologie; BEFU nur als Auffangcode); KDL-Code in DocumentReference.context.event.coding
    (epa-xds-event-code-vs inkludiert die KDL)
  notes: de.gematik.epa.mhd 1.1.3. Der ePA MHD Service definiert für DocumentReference nur Suche und Abruf
    (search-type, read). type und category nehmen IHE-D-Codes an (Codesysteme urn:oid:1.3.6.1.4.1.19376.3.276.1.5.9
    bzw. …5.8), keine KDL-Codes.
- standard: fhir-mii-kds
  profile_or_url: https://www.medizininformatik-initiative.de/fhir/ext/modul-dokument/StructureDefinition/mii-pr-dokument-dokument
  resource: DocumentReference
  path: DocumentReference.type.coding:KDL (z. B. DG020103, DG020107, PT080102); DocumentReference.type.coding:XDS
    (IHE-D typeCode); DocumentReference.category.coding:XDS (IHE-D classCode); DocumentReference.content.attachment;
    DocumentReference.description
  notes: Modul Dokument 2026.0.1. Das Dokumentprofil deckt alle Befundarten des Elements ab (Bildgebung,
    Endoskopie, Histologie, Zytologie); das MII-ImagingStudy-Profil (mii-pr-bildgebung-bildgebungsstudie)
    beschreibt Bildstudien, keine Befunddokumente.
- standard: fhir-mii-kds
  profile_or_url: https://www.medizininformatik-initiative.de/fhir/ext/modul-bildgebung/StructureDefinition/mii-pr-bildgebung-radiologischer-befund
  resource: DiagnosticReport
  path: DiagnosticReport.conclusion bzw. DiagnosticReport.conclusionCode; DiagnosticReport.presentedForm;
    DiagnosticReport.imagingStudy (1..*) → mii-pr-bildgebung-bildgebungsstudie
  notes: Strukturierte Alternative nur für radiologische Befunde (Röntgen, CT, MRT, PET-CT; Sonographie
    über die Modalität US); Modul Bildgebung 2026.0.0. Setzt eine referenzierte Bildgebungsstudie voraus.
- standard: fhir-mii-kds
  profile_or_url: https://www.medizininformatik-initiative.de/fhir/ext/modul-patho/StructureDefinition/mii-pr-patho-report
  resource: DiagnosticReport
  path: DiagnosticReport.code.coding:pathology-report = LOINC 60568-3 (Pattern); DiagnosticReport.result
    (1..*); DiagnosticReport.conclusion; DiagnosticReport.presentedForm
  notes: Strukturierte Alternative für Biopsie-, Histologie- und Zytologiebefunde (das Modul typisiert
    Pathologiebefunde u. a. als KDL PT080102 Histologiebefund und PT260102 Zytologiebefund, ValueSet mii-vs-patho-composition-type-kdl);
    Modul Patho 2026.0.2 (Profilversion 2026.0.0).
