issues:
- 'Das Element führt nur KDL-Codes (z. B. DG020103, DG020111, PT080102, PT260102). XDS und ePA verlangen
  für classCode/typeCode IHE-D-Codes (classCode BEF; typeCode BILD für Röntgen, CT, MRT, PET, Sonographie
  und Endoskopie/Bronchoskopie, PATH für Histologie und Zytologie, BEFU nur als Auffangcode), die KDL
  steht dort nur in der eventCodeList bzw. in DocumentReference.context.event; MII Dokument führt KDL
  und IHE-D parallel (type.coding:KDL und :XDS). Zu entscheiden: die IHE-D-Klassen- und Typcodes je Befundart
  in den value_set aufnehmen oder nur als Mapping-Regel KDL → IHE-D dokumentieren.'
