issues:
- 'Das Diagnosedatum steht in definition_de, lässt sich mit datatype CodeableConcept aber nicht abbilden;
  ein eigenes Datumselement fehlt im Katalog. Entweder ein Teilelement anlegen (date, z. B. Feststellungs-/Erstdiagnosedatum;
  möglicher Element-Code LOINC 21854-5 ‚Date first Dx Cancer‘) oder im Mapping ausdrücklich das Feststellungsdatum
  festlegen (MII KDS Modul Diagnose: Condition.extension:Feststellungsdatum, ‚Datum, an dem die Diagnose
  erstmals festgestellt wurde‘; im MII-Onkologie-Profil Diagnose Primärtumor Pflichtangabe 1..1). Condition.onset[x]
  (Krankheitsbeginn) und Condition.recordedDate (Aufzeichnungsdatum) sind nicht bedeutungsgleich mit dem
  Diagnosedatum.'
