id: mihub.lung.primarycare.cancerDiagnosis.v0.1
uuid: 00fe7f61-d908-5fd1-8723-186011fe6457
name: cancerDiagnosis
label_de: Krebsdiagnose(n)
definition_de: 'Tumordiagnose(n) der Patient:in mit Diagnosedatum: Lungenkarzinom (ICD-10-GM C34.0–C34.9)
  bzw. Lungenkarzinom in der Eigenanamnese (Z85.1); ggf. mehrere Primärtumoren inkl. Zweitkarzinome anderer
  Lokalisation; Grundlage der hausärztlichen Mitbetreuung.'
phase: primarycare
tumor_entity:
- lung_cancer_any
category: diagnose
datatype: CodeableConcept
cardinality: 1..*
value_set:
  binding_strength: extensible
  standard_binding_status: mapped
  codings:
  - system: icd-10-gm
    code: C34.9
    display: 'Bösartige Neubildung: Bronchus oder Lunge, nicht näher bezeichnet'
  - system: icd-10-gm
    code: C34
    display: Bösartige Neubildung der Bronchien und der Lunge
  - system: snomed-ct
    code: '93880001'
    display: Primary malignant neoplasm of lung
  - system: icd-10-gm
    code: Z85.1
    display: Bösartige Neubildung der Trachea, der Bronchien oder der Lunge in der Eigenanamnese
  notes: 'ICD-10-GM endständig kodieren: C34.0–C34.9 (C34 nur Gruppierungsanker, nicht endständig); Lungenkarzinom
    in der Eigenanamnese: Z85.1; Zweitkarzinome anderer Lokalisation mit dem jeweiligen ICD-10-GM-Kode
    (Binding extensible). SNOMED CT: 93880001 Primary malignant neoplasm of lung (363358000 schließt Lungenmetastasen
    ein).'
standard_mappings:
- standard: fhir-mii-kds
  profile_or_url: https://www.medizininformatik-initiative.de/fhir/core/modul-diagnose/StructureDefinition/Diagnose
  resource: Condition
  path: Condition.code
- standard: obds
  profile_or_url: https://www.basisdatensatz.de/basisdatensatz
  resource: 5 Diagnose (Meldung mit Tumorzuordnung)
  path: Tumorzuordnung/Primaertumor_ICD (Code, Version; 5.1, 5.2); Tumorzuordnung/Diagnosedatum (5.6);
    Diagnose/Primaertumor_Diagnosetext (5.3); Diagnose/Menge_Fruehere_Tumorerkrankung (5.9)
  notes: Pflichtmeldung §65c SGB V. Feldnummern nach der oBDS-Feldliste (BAnz 12.07.2021), XML-Namen nach
    dem Schema https://basisdatensatz.de/xml/oBDS_v3.0.5.xsd.
- standard: kbv-mio
  profile_or_url: https://fhir.kbv.de/StructureDefinition/KBV_PR_MIO_NFD_Condition
  resource: Condition (MIO Patientenkurzakte 1.0.0, Notfalldaten)
  path: Condition.code.coding (Slices ICD-10-GM, alpha-id, snomed-ct, orphanet; höchstens ein Coding);
    Condition.code.text (1..1, Diagnoseerläuterung)
  notes: Transport im Bundle https://fhir.kbv.de/StructureDefinition/KBV_PR_MIO_NFDxDPE_Bundle. Die Patientenkurzakte
    besteht aus Notfalldaten (NFD) und persönlichen Erklärungen (DPE); sie ist kein onkologisches Übergabeformat.
- standard: fhir-mii-kds
  profile_or_url: https://www.medizininformatik-initiative.de/fhir/ext/modul-onko/StructureDefinition/mii-pr-onko-diagnose-primaertumor
  resource: Condition
  path: Condition.code.coding:icd10-gm (C34.0–C34.9 bzw. ICD-10-GM-Kode eines Zweitkarzinoms); Diagnosedatum
    in Condition.extension:Feststellungsdatum (condition-assertedDate, 1..1)
  notes: Spezialisierung des MII-Diagnose-Profils für Primärtumoren (Modul Onkologie 2026.0.3; gleiche
    Canonical in 2025.0.4 und 2027.0.0-ballot.1). Für Z85.1 bzw. frühere Tumorerkrankungen (oBDS 5.9)
    alternativ https://www.medizininformatik-initiative.de/fhir/ext/modul-onko/StructureDefinition/mii-pr-onko-fruehere-tumorerkrankung
    (ab 2026.0.3, code.text 1..1); weitere Diagnosen über das generische Diagnose-Profil.
care_process:
  trigger: Diagnosestellung; Übernahme in die Hausarztakte
  frequency_pattern: once (Update bei Zweittumor)
  responsible_role: Onkolog:in / Hausärzt:in
  data_flows:
  - system: kis
    actor_role: Onkolog:in
    usage_type: capture
    sector: stationaer
  - system: pvs
    actor_role: Hausärzt:in
    usage_type: read
    sector: ambulant
  - system: epa
    actor_role: Patient:in
    usage_type: read
    sector: sektorenuebergreifend
