name: bodyMassIndex
label_de: Body-Mass-Index (BMI)
definition_de: Body-Mass-Index aus Körpergewicht und -größe (kg/m²) als Verlaufsparameter (Ernährungsstatus,
  Gewichtsverlust).
phase: primarycare
tumor_entity:
- lung_cancer_any
category: messwert
datatype: decimal
cardinality: 0..*
unit: kg/m2
value_set:
  binding_strength: extensible
  standard_binding_status: mapped
  codings:
  - system: loinc
    code: 39156-5
    display: Body mass index (BMI) [Ratio]
  - system: snomed-ct
    code: '60621009'
    display: Body mass index
standard_mappings:
- standard: fhir-r4-base
  profile_or_url: http://hl7.org/fhir/StructureDefinition/bmi
  resource: Observation (Vital-Signs-Profil BMI)
  path: Observation.valueQuantity (UCUM kg/m2)
  notes: 'R4-Core-Profil bmi (Basis vitalsigns): Observation.code enthält fix LOINC 39156-5 (Slice BMICode);
    valueQuantity mit system http://unitsofmeasure.org und code kg/m2.'
instruction_de: 'BMI = Körpergewicht (kg) / Körpergröße (m)²; im Verlauf zusammen mit der Gewichtsveränderung
  (weightChangePercent) interpretieren. Der BMI allein ersetzt kein validiertes Mangelernährungs-Screening:
  Allen Patient:innen im Verlauf wiederholt ein Screening auf Mangelernährung mit validiertem Tool anbieten,
  bei Risikokonstellation weitergehende Diagnostik und professionelle Ernährungsberatung (Onkopedia NSCLC,
  Kap. 5.6.3); auch bei hohem BMI kann eine Mangelernährung vorliegen (OCP Lung, Step 3.6.3).'
care_process:
  trigger: bei jeder Vorstellung
  frequency_pattern: per-encounter
  responsible_role: Hausärzt:in / MFA
  data_flows:
  - system: pvs
    actor_role: Hausärzt:in
    usage_type: capture
    sector: ambulant
  - system: kis
    actor_role: Onkolog:in
    usage_type: read
    sector: stationaer
evidence:
  guideline_references:
  - source: Expert:innen-Erhebung MiHUB
    version: Excel-Erhebung Allgemeinmedizin, Stand 2026-10-13 (Kontakt AK; Vorlage datenelement-erhebung
      (1)-Amed.xlsx)
    section: DE-039 BMI
    recommendation_grade: n/a
    evidence_level: n/a
    locator: docs/reviews/2026-10-13-erhebungen.md#amed-de-039
    quote: BMI … Body-Mass-Index
    accessed: '2026-10-15'
  - source: Onkopedia NSCLC
    version: Stand April 2025
    url: https://www.onkopedia.com/de/onkopedia/guidelines/lungenkarzinom-nicht-kleinzellig-nsclc
    section: Kap. 5.6.3 Ernährungszustand (wiederholtes Screening auf Mangelernährung im Verlauf mit validiertem
      Tool; BMI nicht ausdrücklich genannt)
    recommendation_grade: n/a
    evidence_level: n/a
    quote: Allen Pat. sollte im Verlauf wiederholt ein Screening auf Mangelernährung mit einem validierten
      Tool [63] angeboten werden.
    accessed: '2026-10-15'
    locator: Kap. 5.6.3 Ernährungszustand
  - source: OCP Lung (AU)
    version: 2nd ed. 2021 (Update 07/2025)
    url: https://www.cancer.org.au/assets/pdf/ocp/lung-cancer-2nd-edition
    section: Step 5.4.1 Supportive care – Monitoring von Mangelernährung nach Therapie (S. 46); Step 3.6.3
      Supportive care – Hinweis zur Aussagegrenze des BMI (S. 32)
    recommendation_grade: n/a
    evidence_level: n/a
    quote: malnutrition following treatment due to ongoing treatment side effects (e.g. weight loss, reduced
      oral intake) – this requires monitoring and nutrition intervention where indicated … (note that
      many patients with a high BMI [obese patients] may also be malnourished [WHO 2018])
    accessed: '2026-10-15'
    locator: Step 5.4.1 Supportive care (S. 46); Step 3.6.3 Supportive care (S. 32)
