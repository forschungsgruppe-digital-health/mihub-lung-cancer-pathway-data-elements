evidence:
  guideline_references:
  - source: Expert:innen-Erhebung MiHUB
    version: Excel-Erhebung Allgemeinmedizin, Stand 2026-10-13 (Kontakt AK; Vorlage datenelement-erhebung
      (1)-Amed.xlsx)
    section: DE-006 Zielsetzungen/Wunsch des Pat.
    recommendation_grade: n/a
    evidence_level: n/a
    locator: docs/reviews/2026-10-13-erhebungen.md#amed-de-006
    quote: Zielsetzungen/Wunsch des Pat. … meist nicht in den Berichten vermerkt, bespricht HA individuell
    accessed: '2026-10-15'
  - source: S3-LL Lungenkarzinom
    version: 5.1 (Juli 2026, AWMF 020-007OL)
    url: https://www.leitlinienprogramm-onkologie.de/leitlinien/lungenkarzinom
    section: Kap. 7.2 Empf. 7.1 (patientenzentrierte Kommunikation, die eine partizipative Entscheidungsfindung
      ermöglicht) und Kap. 7.3.1 Empf. 7.4 (Vorstellungen, Hoffnungen und Befürchtungen erfragen); jeweils
      EK, geprüft 2026
    recommendation_grade: EK
    evidence_level: n/a
    quote: einer patientenzentrierten Kommunikation, die eine partizipative Entscheidungsfindung ermöglicht
      … Vor der Informationsübermittlung soll erfragt werden, mit welchem Wissen, mit … welchen Vorstellungen,
      Hoffnungen und Befürchtungen im Zusammenhang mit seiner Erkrankung
    accessed: '2026-10-15'
    locator: S3-LL Lungenkarzinom 5.1, Kap. 7.2, Empf. 7.1 (EK, geprüft 2026, S. 191); Kap. 7.3.1, Empf.
      7.4 (EK, geprüft 2026, S. 193)
  - source: S3-LL Palliativmedizin
    version: 3.0 (Juli 2026, AWMF 128-001OL)
    url: https://www.leitlinienprogramm-onkologie.de/leitlinien/palliativmedizin
    section: 'Kap. 5.4.1 Empf. 5.5 (EK, neu 2026, Starker Konsens: Aufgabenfeld der palliativmedizinischen
      Basisversorgung durch Primärbehandelnde bei niedriger Komplexität „Konsentierung der patient:innenindividuellen
      Therapiezielfindung“); Kap. 6.2 Empf. 6.1 (EK, modifiziert 2026, Starker Konsens: Informationen
      „orientiert an deren aktuellen Wünschen und Präferenzen“ vermitteln); Kap. 6.5 Empf. 6.13 (EK, geprüft
      2026, Starker Konsens: Gesprächsbegleitung zur vorausschauenden Versorgungsplanung frühzeitig und
      wiederholt bei wesentlichen Veränderungen von Befinden und Prognose anbieten – ACP-spezifisch, nur
      analog für den Trigger „bei Verschlechterung erneut“) – Geltungsbereich: nicht heilbare Krebserkrankung'
    recommendation_grade: EK
    evidence_level: n/a
    quote: Konsentierung der patient:innenindividuellen Therapiezielfindung … orientiert an deren aktuellen
      Wünschen und Präferenzen … Die Gesprächsbegleitung zur vorausschauenden Versorgungsplanung soll
      … wiederholt bei wesentlichen Veränderungen von Befinden und Prognose angeboten werden.
    accessed: '2026-10-15'
    locator: S3-LL Palliativmedizin 3.0, Kap. 5.4.1, Empf. 5.5 (S. 58); Kap. 6.2, Empf. 6.1 (S. 104);
      Kap. 6.5, Empf. 6.13 (S. 114); jeweils EK
