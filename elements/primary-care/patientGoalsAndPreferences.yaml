  resource: Goal
  path: Goal.description
care_process:
  trigger: bei jedem Gespräch über Therapieziele; bei Verschlechterung erneut
  frequency_pattern: ad-hoc
  responsible_role: Hausärzt:in / Onkolog:in
  data_flows:
