issues:
- 'Mapping-Pfad und Datentyp passen nicht zusammen. Das Element ist als Reference auf die Überweisung
  bzw. Verordnung typisiert, gemappt wird aber auf ServiceRequest.reasonCode. Dieses Feld trägt nur den
  codierten Überweisungsgrund (z. B. ICD-10-GM), und keiner der gelisteten Codes ist ein solcher Grund.
  Prüfen: (1) Mapping auf die Ressource ServiceRequest, mit der Überweisungsart z. B. in ServiceRequest.category
  oder .code (etwa SNOMED 3457005). Für den Überweisungs- bzw. Verordnungsschein DocumentReference.type
  (LOINC 57133-1; KDL AU050102, AU050101, AM160301). (2) Den in definition_de genannten Überweisungsgrund
  nicht streichen, sondern als eigenes Teil-Element modellieren (ServiceRequest.reasonCode/reasonReference).
  LOINC 42349-1 bezeichnet nur den narrativen Abschnitt „Reason for referral“ und gehört zu diesem Teil-Element,
  nicht als Code der Überweisung selbst.'
