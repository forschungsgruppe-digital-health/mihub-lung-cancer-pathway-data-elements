issues:
- 'Präzision klären: Das Element heißt ''Geburtsjahr'', instruction_de erlaubt aber das vollständige Geburtsdatum
  („sofern das vollständige Geburtsdatum nicht erforderlich ist“). Zwei Optionen: (a) Element strikt auf
  YYYY begrenzen (Auswertung, Datensparsamkeit) und für Übergabe und Patientenidentifikation das vollständige
  Geburtsdatum (Patient.birthDate) aus dem Primärsystem verwenden, oder (b) das Element als ''Geburtsdatum
  (Präzision zweckabhängig)'' fassen. Ob die Übergabe die volle Präzision braucht, sollte klinisch bestätigt
  werden.'
