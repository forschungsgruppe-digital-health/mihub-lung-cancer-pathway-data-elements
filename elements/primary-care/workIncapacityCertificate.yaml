issues:
- Der in definition_de geforderte Zusammenhang mit Tumorerkrankung bzw. -therapie ist mit datatype Period
  nicht abbildbar. Die AU-begründende Diagnose (ICD-10-GM, z. B. C34.-) und die Unterscheidung Erst-/Folgebescheinigung
  sollten als zugehörige Angaben modelliert werden. Die konkreten eAU-Inhalte sind gegen die KBV-eAU-Spezifikation
  zu prüfen; das wurde lokal nicht verifiziert (UNSICHER).
