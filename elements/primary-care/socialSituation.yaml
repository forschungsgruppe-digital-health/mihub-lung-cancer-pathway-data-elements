issues:
- 'Value Set nach Rolle gliedern: Element-Codes (SNOMED CT 160476009, 224130005, 224362002; LOINC 29762-2)
  vs. Antwortwerte (SNOMED-CT-Befunde 160734000, 301887005, 184156005; ICD-10-GM-Problemkodes Z56, Z60,
  Z63, Z74.x). Umgang mit „Vorliegen einer Patientenverfügung“ (ausdrücklich Teil von DE-022 der Expert:innen-Erhebung)
  mit der Erhebungsquelle (Kontakt AK) klären: Ja/Nein-Hinweis in diesem Element vs. Dokumentverweis über
  advanceDirectiveDocument (Beziehung dependsOn besteht bereits; dort Phase palliative, Entitäten NSCLC/SCLC).
  Abgrenzung von „vorhandene Unterstützung“ (informell, „wer kümmert sich“) zu ongoingSupportiveServices
  (professionelle Dienste, z. B. Pflegedienst) festlegen.'
- 'Die nationalen Soziodemographie-Profile (nur Ballot) binden die Werte REQUIRED an MII-eigene Codesysteme
  (z. B. Betreuungssituation 1–5, Beschäftigungsstatus 1–7). Die SNOMED- und ICD-10-GM-Antwortwerte des
  Elements (z. B. 160734000, 301887005, 184156005, Z74.9, Z60) sind dort als Wert nicht zulässig, und
  das Element bündelt mehrere Teilaspekte. Zu entscheiden: das Element in Teil-Elemente (Wohn- und Betreuungssituation,
  Beschäftigung, Bezugspersonen) aufteilen und die MII-Codes übernehmen, sobald das Modul stabil ist,
  oder bei der generischen social-history-Observation bleiben.'
