    mii-vs-sdd-beschaeftigungsstatus-minimal, z. B. nicht berufstätig wegen Erkrankung, Rente, Teilzeit,
    Vollzeit; coding:lang)
  notes: 'nur Ballot de.medizininformatikinitiative.kerndatensatz.soziodemographie#2027.0.0-ballot, kein
    stabiles Release (Status draft). Weitere Ballot-Profile zur Lebenssituation: mii-pr-sdd-haushaltsgroesse,
    mii-pr-sdd-partnerschaft, mii-pr-sdd-vertrauensperson.'
