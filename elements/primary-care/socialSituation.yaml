  profile_or_url: https://www.medizininformatik-initiative.de/fhir/ext/modul-soziodemographie/StructureDefinition/mii-pr-sdd-betreuungssituation
  resource: Observation
  path: 'Observation.code = SNOMED 305060004 (Pattern); Observation.valueCodeableConcept (REQUIRED mii-vs-sdd-betreuungssituation:
    keine Betreuung, auf Anfrage, zeitweise, dauerhaft z. B. Pflegeheim); Observation.category social-history
