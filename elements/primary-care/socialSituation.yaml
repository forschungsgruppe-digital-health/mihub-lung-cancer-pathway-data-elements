evidence:
  guideline_references:
  - source: Expert:innen-Erhebung MiHUB
    version: Excel-Erhebung Allgemeinmedizin, Stand 2026-10-13 (Kontakt AK; Vorlage datenelement-erhebung
      (1)-Amed.xlsx)
    section: DE-022 soziale Situation
    recommendation_grade: n/a
    evidence_level: n/a
    locator: docs/reviews/2026-10-13-erhebungen.md#amed-de-022
    quote: soziale Situation … Wohnsituation, aktueler Aufenthalt (Kurzzeitpflege, Heim, Krankenhaus,
      ambulant/stationär, zu Hause…), Familie, soziales Umfeldd, berufl. Situation, Pflege/Unterstütungsbedarf
      bzw. vorhandene Unterstützung, Patientenverfügung, "wer kümmert sich"
    accessed: '2026-10-15'
  - source: S3-LL Palliativmedizin
    version: 3.0 (Juli 2026, AWMF 128-001OL)
    url: https://www.leitlinienprogramm-onkologie.de/leitlinien/palliativmedizin
    section: 'Kap. 5.2 Empf. 5.1 (geprüft 2026, Starker Konsens: physische, psychische, soziale und spirituelle
      Bedürfnisse wiederholt und bei Änderung der klinischen Situation erfassen) – Geltungsbereich: nicht
      heilbare Krebserkrankung'
    recommendation_grade: EK
    evidence_level: n/a
    quote: Bei einer nicht-heilbaren Krebserkrankung sollen die physischen, psychischen, sozialen und
      spirituellen Bedürfnisse sowie die Belastungen und Informationsbedürfnisse der Patient:innen und
      Angehörigen wiederholt und bei einer Änderung der klinischen Situation erfasst werden.
    accessed: '2026-10-15'
    locator: Kap. 5.2, Empf. 5.1, S. 52
  - source: S3-LL Lungenkarzinom
    version: 5.1 (Juli 2026, AWMF 020-007OL)
    url: https://www.leitlinienprogramm-onkologie.de/leitlinien/lungenkarzinom
    section: 'Empf. 16.1 und 16.2 (EK, geprüft 2026, Starker Konsens: strukturierter Nachsorge- bzw. Verlaufsplan
      sollte geeignet sein, den Bedarf an Sozialberatung zu erkennen)'
    recommendation_grade: EK
    evidence_level: n/a
    quote: Der strukturierte Nachsorgeplan sollte geeignet sein, … den Bedarf an Psychoonkologie und Sozialberatung
      zu erkennen … Der strukturierte Verlaufsplan/Follow-up-Plan sollte geeignet sein, Progression/Rezidive,
      … den Bedarf an Psychoonkologie, Palliativmedizin und Sozialberatung zu erkennen.
    accessed: '2026-10-15'
    locator: Kap. 16.1, Empf. 16.1 und 16.2, S. 492
  - source: OCP Lung (AU)
    version: 2nd ed. 2021 (Update 07/2025)
    url: https://www.cancer.org.au/assets/pdf/ocp/lung-cancer-2nd-edition
    section: Appendix A Supportive care domains (social domain); Principle 4 Supportive care (Bedarfserhebung
      bei Patient:innen und Familien)
    recommendation_grade: n/a
    evidence_level: n/a
    quote: • the social domain, which includes a range of social and practical issues that will affect
      the patient, carer and family such as the need for emotional support, maintaining social networks
      and financial concerns
    accessed: '2026-10-15'
    locator: Appendix A Supportive care domains, S. 57; Principle 4, S. 13
  - source: AG LONKO / Survivorship
    version: Empfehlungspapiere UAG Daten (17.06.2021) und UAG Versorgungsmodelle (18.06.2021), Nationaler
      Krebsplan
    url: https://www.bundesgesundheitsministerium.de/fileadmin/Dateien/3_Downloads/N/Nationaler_Krebsplan/Empfehlungspapier_UAG_Versorgungsmodelle_AG_LONKO_bf.pdf
    section: UAG Versorgungsmodelle Kap. 2.2 Soziale und berufliche Situation der Langzeitüberlebenden
    recommendation_grade: n/a
    evidence_level: n/a
    quote: 2.2 Soziale und berufliche Situation der Langzeitüberlebenden Die Programme müssen auch Veränderungen
      in der sozialen und beruflichen Situation der Betroffenen berücksichtigen.
    accessed: '2026-10-15'
    locator: UAG Versorgungsmodelle, Kap. 2.2, S. 8
