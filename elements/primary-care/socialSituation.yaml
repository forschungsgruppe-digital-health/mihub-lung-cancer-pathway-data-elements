name: socialSituation
label_de: Soziale Situation
definition_de: Wohnsituation, aktueller Aufenthalt (zu Hause, Kurzzeitpflege, Heim, Krankenhaus), Familie
  und soziales Umfeld, berufliche Situation, Pflege-/Unterstützungsbedarf bzw. vorhandene Unterstützung
  („wer kümmert sich“), Vorliegen einer Patientenverfügung.
