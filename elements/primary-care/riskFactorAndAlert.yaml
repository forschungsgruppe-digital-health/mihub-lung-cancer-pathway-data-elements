  standard_binding_status: mapped
  codings:
  - system: snomed-ct
    code: '80943009'
    display: Risk factor
  - system: snomed-ct
    code: '609328004'
    display: Allergic disposition
  - system: snomed-ct
    code: '64779008'
    display: Blood coagulation disorder
  - system: loinc
    code: 8658-7
    display: History of Allergies
  - system: icd-10-gm
    code: Z88.9
    display: Allergie gegenüber nicht näher bezeichneten Arzneimitteln, Drogen oder biologisch aktiven
      Substanzen in der Eigenanamnese
  - system: icd-10-gm
    code: Z91.0
