      in der Eigenanamnese
  - system: icd-10-gm
    code: D68.9
    display: Koagulopathie, nicht näher bezeichnet
standard_mappings:
- standard: kbv-mio
  profile_or_url: https://fhir.kbv.de/StructureDefinition/KBV_PR_MIO_NFD_Allergy_Intolerance
  resource: AllergyIntolerance (MIO Patientenkurzakte 1.0.0, Notfalldaten)
  path: AllergyIntolerance.reaction.substance (coding:snomedCode REQUIRED KBV_VS_MIO_NFD_Allergy_Substance,
    :atcCode, :askCode, text); AllergyIntolerance.reaction.manifestation; AllergyIntolerance.clinicalStatus
  notes: Nur für den Teil schwere Allergien; AllergyIntolerance.code, type, category und criticality sind
    im Profil ausgeschlossen (0..0). Gerinnungsstörung und weitere Warnhinweise bleiben bei Condition
    bzw. Flag. Transport im Bundle https://fhir.kbv.de/StructureDefinition/KBV_PR_MIO_NFDxDPE_Bundle.
- standard: fhir-r4-base
  resource: AllergyIntolerance / Flag / Condition
