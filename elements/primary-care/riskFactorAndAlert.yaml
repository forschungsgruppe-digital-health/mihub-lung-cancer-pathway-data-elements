label_de: Risikofaktoren / Warnhinweise
definition_de: 'Behandlungsrelevante Risikofaktoren und Warnhinweise: schwere Allergien, Gerinnungsstörung,
  Vorliegen einer Patientenverfügung, besondere Konstellationen (z. B. junge Patient:innen nach Krebserkrankung).'
