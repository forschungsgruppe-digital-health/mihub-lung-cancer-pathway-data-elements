issues:
- 'Redundanz ''Vorliegen einer Patientenverfügung'': wird in riskFactorAndAlert (DE-036), socialSituation
  (DE-022) und advanceDirectiveDocument erfasst. Führendes Element festlegen (Vorschlag: advanceDirectiveDocument);
  hier nur als Warnhinweis bzw. Verweis führen.'
- 'Für Allergien verlangt KBV_PR_MIO_NFD_Allergy_Intolerance den Auslöser als Substanzcode in AllergyIntolerance.reaction.substance
  (SNOMED aus KBV_VS_MIO_NFD_Allergy_Substance, ATC oder ASK); AllergyIntolerance.code ist ausgeschlossen.
  Die Element-Codes (609328004, 8658-7, Z88.9, Z91.0) sind Kategorie- bzw. Anamnesecodes und keine Substanzcodes.
  Zu entscheiden: den Allergieauslöser als eigenes Unterelement mit Substanzkodierung aufnehmen oder Allergien
  nur als Hinweis (Condition bzw. Flag) führen.'
related_elements:
- relation: dependsOn
  target: advanceDirectiveDocument
