id: mihub.lung.primarycare.patientContactMasterData.v0.1
uuid: 0edb074e-adf7-57ef-9f0f-46f39950b588
name: patientContactMasterData
label_de: Kontakt-, Adress- und Sprachangaben der Patient:in
definition_de: 'Weitere Stammdaten: Kontakt- und Adressdaten, bevorzugte Sprache, Beruf/Arbeitgeber (sozialmedizinisch
  relevant).'
phase: primarycare
tumor_entity:
- lung_cancer_any
category: stammdaten
datatype: string
cardinality: 0..1
value_set:
  binding_strength: extensible
  standard_binding_status: mapped
  codings:
  - system: snomed-ct
    code: '184097001'
    display: Patient address
  - system: snomed-ct
    code: '184103008'
    display: Patient telephone number
  - system: snomed-ct
    code: '428996008'
    display: Language preference
  - system: snomed-ct
    code: '184104002'
    display: Patient occupation
  - system: loinc
    code: 54899-0
    display: Preferred language
standard_mappings:
- standard: fhir-mii-kds
  profile_or_url: https://www.medizininformatik-initiative.de/fhir/core/modul-person/StructureDefinition/Patient
  resource: Patient
  path: Patient.address / Patient.telecom / Patient.communication.language
- standard: fhir-r4-base
  profile_or_url: http://hl7.org/fhir/StructureDefinition/Observation
  resource: Observation (Kategorie social-history)
  path: Observation.category = social-history; Observation.code = SNOMED 184104002 (Patient occupation);
    Observation.valueString bzw. Observation.valueCodeableConcept (Beruf)
  notes: Nur für den Beruf; er ist kein Element des MII-Patient-Profils. Der Arbeitgeber ist durch 184104002
    nicht abgedeckt; dafür kommt Patient.contact mit relationship v2-0131 E (Employer) und organization
    in Betracht (im MII-Patient zulässig, nicht mustSupport; siehe Issue zur Strukturierung). Im MII-Modul
    Soziodemographie (nur Ballot 2027.0.0-ballot) gibt es kein Profil für Beruf oder Arbeitgeber, nur
    für die berufliche Stellung (mii-pr-sdd-berufliche-stellung). Adresse, Telecom und Sprache bleiben
    im MII-Patient (telecom und communication sind dort nicht mustSupport).
constraints_de: Personenbezogen — Anschrift und Telefon/E-Mail direkt identifizierend, Beruf/Arbeitgeber
  indirekt identifizierend; Nutzung nur im Behandlungskontext; für Sekundärnutzung nur pseudonymisiert
  und datensparsam (MII KDS PatientPseudonymisiert).
