issues:
- 'Strukturierung prüfen: Das Sammelelement (Anschrift, Telefon/E-Mail, bevorzugte Sprache, Beruf/Arbeitgeber)
  ist als string 0..1 modelliert, die Mapping-Ziele im Patient-Profil sind aber strukturierte FHIR-Typen
  (Patient.address: Address, Patient.telecom: ContactPoint, Patient.communication.language: CodeableConcept).
  Aufteilung in Teil-Elemente oder eine Gruppe prüfen. Mapping der bevorzugten Sprache präzisieren: Patient.communication.language
  mit Patient.communication.preferred = true. Für den Arbeitgeber kommt neben einer social-history-Observation
  auch Patient.contact (relationship v2-0131 „E“ Employer, organization) in Betracht. Abgrenzung zu socialSituation
  („berufliche Situation“, SNOMED CT 224362002 Employment status) festlegen, um Doppelerfassung zu vermeiden.'
- 'Fachliche Lücke: „Beruf/Arbeitgeber“ als Stammdatum ersetzt nicht die nach S3-LL Lungenkarzinom 5.1
  (Juli 2026, AWMF 020-007OL), Kap. 3.7, Empf. 3.1 (EK, modifiziert 2026, Starker Konsens) geforderte
  Erhebung: Bei allen Patient:innen mit Lungenkarzinom sollen Rauchen, berufliche Noxen und die Familienanamnese
  bezüglich maligner Erkrankungen anamnestisch erfragt werden; „Die Erhebung einer umfassenden Arbeitsanamnese
  ist erforderlich.“ Laut Hintergrundtext sollte die Arbeitsanamnese chronologisch-tabellarisch erfolgen
  (Muster Tab. 9); berufliche Kanzerogene werden für ca. 9–15 % aller Lungenkrebsfälle verantwortlich
  gemacht. Bei begründetem Verdacht auf eine Berufskrankheit besteht die Pflicht zur Verdachtsanzeige
  (Kap. 4.3, Hintergrundtext). Eigenes Element (Arbeitsanamnese/berufliche Exposition) im Umfeld von historyTakingPrimaryCare
  bzw. riskFactorAndAlert prüfen und die Phasenzuordnung klären (Empf. 3.1 nennt keinen Erhebungszeitpunkt).'
