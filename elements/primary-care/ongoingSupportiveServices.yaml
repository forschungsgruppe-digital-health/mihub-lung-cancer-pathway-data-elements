issues:
- 'Code-Achsen im Value Set trennen und an die Mapping-Zuordnung angleichen: laufende Therapien (Physiotherapie
  91251008, Ergotherapie 84478008, häusliche Pflege durch Pflegedienst 90817005, ggf. SPV-Behandlung 395669003;
  jeweils regime/therapy) → ServiceRequest.code bzw. Procedure.code. Versorgungsanbindungen an Dienste
  (SPV/SAPV: 1148679005 Specialist palliative care service bzw. 395086005 Community specialist palliative
  care; Pflegedienst als Dienst: 1234796008 Community nursing service; jeweils qualifier value unter 224930009
  Services) → EpisodeOfCare.type bzw. HealthcareService.type. CareTeam nur für beteiligte Personen und
  Einrichtungen, nicht CareTeam.participant.role für Leistungscodes. Abgrenzung zu coTreatingProviderContact
  klären („weitere Fachärzt:innen, Krankenhaus“: Kontaktdaten und Mitbehandlung dort, hier nur laufende
  Leistung bzw. Anbindung).'
