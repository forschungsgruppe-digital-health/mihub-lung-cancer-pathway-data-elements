name: ongoingSupportiveServices
label_de: Laufende Therapien und Anbindungen (Physio, Ergo, Pflegedienst, SAPV …)
definition_de: Aktuell laufende nicht-tumorspezifische Therapien und Versorgungsanbindungen (Physiotherapie,
  Ergotherapie, weitere Fachärzt:innen, Krankenhaus, Pflegedienst, SAPV) — die Unterscheidung ist Patient:innen
  nicht immer bewusst, die Information ist für die Hausarztpraxis relevant.
phase: primarycare
tumor_entity:
- lung_cancer_any
category: mitbetreuung
datatype: CodeableConcept
cardinality: 0..*
value_set:
  binding_strength: extensible
  standard_binding_status: mapped
  codings:
  - system: snomed-ct
    code: '91251008'
    display: Physical therapy procedure
  - system: snomed-ct
    code: '84478008'
    display: Occupational therapy
  - system: snomed-ct
    code: '1148679005'
    display: Specialist palliative care service
  - system: snomed-ct
    code: '90817005'
    display: Home care by visiting nurse
standard_mappings:
- standard: fhir-r4-base
  resource: 'ServiceRequest / Procedure (Versorgungsanbindung: EpisodeOfCare / HealthcareService)'
  path: ServiceRequest.code bzw. Procedure.code (z. B. Physiotherapie, Ergotherapie); laufende Anbindung
    (SAPV, Pflegedienst) über EpisodeOfCare.type bzw. HealthcareService.type
  notes: CareTeam.participant.role beschreibt die Rolle eines Teilnehmers, nicht die Leistung; CareTeam
    nur für die beteiligten Personen und Einrichtungen.
care_process:
  trigger: Anamnese; bei jeder Änderung der Versorgungssituation
  frequency_pattern: per-encounter
  responsible_role: Hausärzt:in
  data_flows:
  - system: pvs
    actor_role: Hausärzt:in
    usage_type: capture
    sector: ambulant
  - system: kis
    actor_role: Onkolog:in
    usage_type: read
    sector: stationaer
