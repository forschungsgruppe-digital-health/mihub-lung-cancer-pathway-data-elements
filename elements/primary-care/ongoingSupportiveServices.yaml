name: ongoingSupportiveServices
label_de: Laufende Therapien und Anbindungen (Physio, Ergo, Pflegedienst, SAPV …)
definition_de: Aktuell laufende nicht-tumorspezifische Therapien und Versorgungsanbindungen (Physiotherapie,
  Ergotherapie, weitere Fachärzt:innen, Krankenhaus, Pflegedienst, SAPV) — die Unterscheidung ist Patient:innen
  nicht immer bewusst, die Information ist für die Hausarztpraxis relevant.
phase: primarycare
tumor_entity:
- lung_cancer_any
category: mitbetreuung
datatype: CodeableConcept
cardinality: 0..*
value_set:
  binding_strength: extensible
  standard_binding_status: mapped
  codings:
  - system: snomed-ct
    code: '91251008'
    display: Physical therapy procedure
  - system: snomed-ct
    code: '84478008'
    display: Occupational therapy
  - system: snomed-ct
    code: '1148679005'
    display: Specialist palliative care service
  - system: snomed-ct
