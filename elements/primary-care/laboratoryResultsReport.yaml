name: laboratoryResultsReport
label_de: Laborbefund (inkl. Auffälligkeiten)
definition_de: Laborwerte aus hausärztlicher Diagnostik bei Symptomen oder aus Kontrollen in der Nachsorge,
  inkl. markierter Auffälligkeiten; Tumormarker nur, wenn onkologisch veranlasst.
phase: primarycare
tumor_entity:
- lung_cancer_any
category: laborbefund
datatype: Reference
cardinality: 0..*
value_set:
  binding_strength: extensible
  standard_binding_status: mapped
  codings:
  - system: loinc
    code: 11502-2
    display: Laboratory report
  - system: snomed-ct
    code: '4241000179101'
    display: Laboratory report
  - system: kdl
    code: LB120107
    display: Laborbefund
standard_mappings:
- standard: fhir-mii-kds
  profile_or_url: https://www.medizininformatik-initiative.de/fhir/core/modul-labor/StructureDefinition/DiagnosticReportLab
  resource: DiagnosticReport (DiagnosticReportLab)
  path: DiagnosticReport.code.coding:loinc-labReport = LOINC 11502-2 (Pattern); DiagnosticReport.result
    (1..*) → Einzelwerte als ObservationLab (https://www.medizininformatik-initiative.de/fhir/core/modul-labor/StructureDefinition/ObservationLab),
    Auffälligkeiten in Observation.interpretation; DiagnosticReport.conclusion
  notes: Modul Laborbefund 2026.0.3 (gleich in 2027.0.0-ballot). Das Element ist ein Bericht (Reference,
    LOINC 11502-2); ObservationLab beschreibt einen Einzelanalyten.
constraints_de: 'Keine routinemäßige Bestimmung von Serum-Tumormarkern in der Nachsorge (S3-LL Lungenkarzinom
  5.1, Kap. 16.3.4: Hintergrundtext ohne Empfehlungsbox/-grad; „Evidenzgrad 1a“ bezieht sich auf Lit.
  [1878] zur kontrovers diskutierten Bedeutung der Serummarker); Tumormarker nur bei onkologischer Veranlassung.'
care_process:
  trigger: bei Symptomen; Kontrollen nach Maßgabe der Onkologie
  frequency_pattern: ad-hoc
  responsible_role: Hausärzt:in / Onkolog:in
