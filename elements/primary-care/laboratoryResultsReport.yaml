    section: 'Tab. 44 (Laborparameter: „Nach Maßgabe des Behandlers“); Kap. 16.3.4 (Hintergrundtext ohne
      Empfehlungsbox: routinemäßige Bestimmung von Serummarkern in der Nachsorge nicht empfohlen; „Evidenzgrad
      1a“ bezieht sich auf Lit. [1878], kontroverse Bedeutung der Serummarker)'
