issues:
- 'DE-015 „Auffälligkeiten der Werte“ wurde als eigenes Freitext-Element der Hausärzt:in erhoben und ist
  im Reference-Element nicht eigenständig abbildbar. Festzulegen ist: Laborflags über Observation.interpretation
  und Referenzbereiche über Observation.referenceRange der referenzierten Laborwerte; die hausärztliche
  Freitext-Bewertung über DiagnosticReport.conclusion bzw. Observation.note – oder als eigenes Text-/Annotation-Element.
  Zielressource laut Mapping (Stand 2026-10-14): MII DiagnosticReportLab für den Befund, Einzelwerte als
  ObservationLab.'
