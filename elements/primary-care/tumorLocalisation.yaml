issues:
- 'Seitenlokalisation des Primärtumors (rechts/links; ggf. beidseitig/unbekannt) als eigene Teilangabe
  bzw. Qualifier ergänzen: Die ICD-O-3-Topographie C34.x kodiert keine Seite, ‚Lungenoberlappen‘ allein
  ist daher mehrdeutig. National wird die Seite getrennt geführt (oBDS-Seitenlokalisation; MII KDS Onkologie:
  Condition.bodySite.coding:primaertumorSeitenlokalisation, CodeSystem mii-cs-onko-seitenlokalisation
  L/R/B/M/U/T; SNOMED CT laut MII-ConceptMap L = 7771000 Left, R = 24028007 Right, B = 51440002 Right
  and left). Nicht in die Topographie-Werteliste mischen. Klinische Zusatzrelevanz: Die Seite ist Bezugsgröße
  für die Zuordnung weiterer Herde (getrennter Herd in einem anderen Lappen derselben Seite = T4, in einem
  kontralateralen Lungenlappen = M1a; S3-LL Lungenkarzinom 5.1, Kap. 6.5.1.1.1 Tab. 21 und Kap. 6.5.1.1.4
  Tab. 25).'
