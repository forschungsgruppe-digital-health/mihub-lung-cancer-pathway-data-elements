issues:
- 'Die Werteliste belegt Kategorien doppelt und mischt Achsen: ‚kein Nachweis/rezidivfrei‘ = 260415000
  (Not detected, qualifier value) und 445150007 (Surviving free of recurrence of neoplastic disease, finding);
  ‚Progress‘ = 271299001 (Patient''s condition worsened) und 1371415000 (Malignant neoplastic disease
  progression). Das mCODE-STU4-ConditionStatusTrendVS (4.0.0) enthält nur 268910001, 359746009, 271299001
  und 709137006; 260415000, 445150007 und 1371415000 gehören nicht dazu. Je Kategorie genau einen Code
  festlegen und das Mapping in value_set.notes dokumentieren (wie bei recistResponse). Als Referenz für
  die Kategorien bietet sich die im Mapping genannte oBDS-Gesamtbeurteilung des Tumorstatus an (V/T/K/P/D/B/R/Y/U/X;
  MII KDS Onkologie: CodeSystem mii-cs-onko-verlauf-gesamtbeurteilung, SNOMED-Zuordnung in der ConceptMap
  mii-cm-onko-verlauf-gesamtbeurteilung-sct). Die Kategorie ‚nicht beurteilbar‘ fehlt (oBDS U ‚Beurteilung
  unmöglich‘; Kandidat 709137006 Patient condition undetermined wie in recistResponse – die MII-ConceptMap
  bildet U allerdings auf 385432009 Not applicable ab).'
- definition_de nennt ‚Metastasen‘ als Statuswert, die Erhebung DE-030 zusätzlich ‚Tumorgröße‘ und ‚aktuelle
  Ausbreitung‘. Das sind keine Kategorien einer Gesamtbeurteilung, Codes dafür sind nicht hinterlegt.
  Ausbreitung und Metastasen über recurrenceOrSecondPrimary bzw. tnmStage (rTNM) abbilden und die Definition
  anpassen (z. B. ‚Progress/Rezidiv inkl. neu aufgetretener Metastasen‘).
related_elements:
- relation: generalizes
  target: recistResponse
- relation: generalizes
  target: recurrenceOrSecondPrimary
