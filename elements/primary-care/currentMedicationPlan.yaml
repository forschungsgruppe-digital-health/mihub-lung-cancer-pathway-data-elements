id: mihub.lung.primarycare.currentMedicationPlan.v0.1
uuid: d84c9b8c-a909-5518-8f51-f62084eb075e
name: currentMedicationPlan
label_de: Aktuelle Medikation / Medikationsplan (BMP/eMP)
definition_de: Aktuelle Gesamtmedikation inkl. Änderungen — als bundeseinheitlicher Medikationsplan (BMP,
  § 31a SGB V) bzw. elektronischer Medikationsplan (eMP) — zur Abstimmung zwischen Onkologie und Hausarztpraxis.
phase: primarycare
tumor_entity:
- lung_cancer_any
category: medikation
datatype: Reference
cardinality: 1..1
value_set:
  binding_strength: extensible
  standard_binding_status: mapped
  codings:
  - system: snomed-ct
    code: '721912009'
    display: Medication summary document
  - system: snomed-ct
    code: '430193006'
    display: Medication reconciliation
  - system: loinc
    code: 56445-0
    display: Medication summary Document
  - system: loinc
    code: 10160-0
    display: History of Medication use Narrative
  - system: kdl
    code: TH130107
    display: Medikationsplan
  - system: kdl
    code: ED110103
    display: Medikationsplan elektronisch (eMP)
  notes: 'Rollen der Codings: Dokumenttyp des referenzierten Plans = LOINC 56445-0, SNOMED CT 721912009,
    KDL TH130107 (Medikationsplan) bzw. ED110103 (eMP); Abschnittscode im Bericht = LOINC 10160-0; SNOMED
    CT 430193006 (Medication reconciliation, procedure) kennzeichnet nur den Abstimmungsprozess (Kontext),
    nicht den Plan selbst.'
standard_mappings:
- standard: gematik-epa-fhir
  profile_or_url: https://gematik.de/fhir/epa-medication/StructureDefinition/emp-medication-request
  resource: MedicationRequest (eMP-Eintrag im ePA Medication Service)
  path: Abruf des gesamten eMP über die Operation $medication-plan (https://gematik.de/fhir/epa-medication/OperationDefinition/get-medication-plan-op,
    Rückgabe Bundle); Einträge = emp-medication-request; Medikationsliste (eML) über $medication-list
    (get-medication-list-op)
  notes: de.gematik.epa.medication 1.3.5 (Profilversion 1.3.2).
- standard: fhir-mii-kds
  profile_or_url: https://www.medizininformatik-initiative.de/fhir/core/modul-medikation/StructureDefinition/medikationsliste
  resource: List (Medikationsliste)
  path: List.code.coding:medCode = medications (list-example-use-codes); List.code.coding:contextCode
    (REQUIRED IHE-D FallkontextBeiDokumentenerstellung); List.entry.item → MedicationStatement (https://www.medizininformatik-initiative.de/fhir/core/modul-medikation/StructureDefinition/MedicationStatement)
  notes: Das Element ist ein Plan bzw. eine Gesamtliste (Reference 1..1); ein einzelnes MedicationStatement
    bildet das nicht ab. Modul Medikation 2026.0.1.
care_process:
  trigger: bei jeder Medikationsänderung; Übergabe
  frequency_pattern: per-encounter
  responsible_role: Onkolog:in / Hausärzt:in / Apotheke
  data_flows:
  - system: kis
    actor_role: Onkolog:in
    usage_type: update
    sector: stationaer
  - system: pvs
    actor_role: Hausärzt:in
    usage_type: update
    sector: ambulant
  - system: epa
    actor_role: Patient:in
    usage_type: read
    sector: sektorenuebergreifend
    notes: eMP in der ePA für alle
