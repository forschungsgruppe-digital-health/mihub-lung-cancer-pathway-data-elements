issues:
- 'Abgrenzung klären: therapieassoziierte Infekte und Komplikationen (z. B. unter Chemo- oder Immuntherapie,
  Pneumonitis) → treatmentSideEffectOrComplication; chronische Erkrankungen → comorbidity. acuteIntercurrentIllness
  nur für therapieunabhängige akute Erkrankungen. Antwortwerte in der Hausarztpraxis i. d. R. ICD-10-GM
  (KDS Diagnose).'
