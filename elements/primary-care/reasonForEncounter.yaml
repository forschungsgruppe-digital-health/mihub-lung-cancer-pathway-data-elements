id: mihub.lung.primarycare.reasonForEncounter.v0.1
uuid: bf587030-2a6e-5fdb-a4d1-aebdd5e30e87
name: reasonForEncounter
label_de: Beratungsanlass / Symptome
definition_de: Anlass der hausärztlichen Konsultation und aktuelle Symptome — mit Prüfung, ob ein Zusammenhang
  mit der zurückliegenden Tumorerkrankung oder Behandlung besteht.
phase: primarycare
tumor_entity:
- lung_cancer_any
category: befund
datatype: CodeableConcept
cardinality: 1..*
value_set:
  binding_strength: extensible
  standard_binding_status: mapped
  codings:
  - system: snomed-ct
    code: '1269489004'
    display: Chief complaint
  - system: loinc
    code: 29298-7
    display: Reason for visit
  - system: loinc
    code: 46239-0
    display: Chief complaint+Reason for visit Narrative
  notes: 'Die Codings sind Element-/Fragecodes (SNOMED CT 1269489004 |Chief complaint| [observable entity];
    LOINC 29298-7 [Nom], 46239-0 [Nar]) und keine Antwortwerte. Antwortwerte in Encounter.reasonCode (FHIR-R4-ValueSet
    encounter-reason, Binding preferred, im MII-Profil KontaktGesundheitseinrichtung unverändert übernommen):
    primär Symptome/Befunde aus SNOMED CT << 404684003 |Clinical finding| (administrative Anlässe z. B.
    185351004 |Administrative reason for encounter|), daneben im ValueSet enthalten << 71388002 |Procedure|,
    << 243796009 |Situation with explicit context| und << 272379006 |Event|; alternativ ICD-10-GM (v.
    a. Kapitel XVIII „Symptome und abnorme klinische und Laborbefunde, die anderenorts nicht klassifiziert
    sind“); Freitext über CodeableConcept.text.'
standard_mappings:
- standard: fhir-mii-kds
  profile_or_url: https://www.medizininformatik-initiative.de/fhir/core/modul-fall/StructureDefinition/KontaktGesundheitseinrichtung
  resource: Encounter
  path: Encounter.reasonCode
instruction_de: Bei jedem Symptom prüfen und dokumentieren, ob es mit der Tumorerkrankung bzw. deren Therapie
  (Spätfolgen, Nebenwirkungen) zusammenhängen kann.
care_process:
  trigger: bei jeder Konsultation
  frequency_pattern: per-encounter
  responsible_role: Hausärzt:in
  data_flows:
  - system: pvs
    actor_role: Hausärzt:in
    usage_type: capture
    sector: ambulant
  - system: kis
    actor_role: Onkolog:in
    usage_type: read
    sector: stationaer
