issues:
- 'definition_de verlangt ''Schema, Zeitraum, Port'', mit datatype CodeableConcept ist aber nur die Modalität
  abbildbar. Vorschlag: Zeitraum über Procedure.performed[x] bzw. MedicationStatement.effective[x], Schema
  über MedicationStatement/Regime (vgl. systemicTherapyRegimen). Der Port ist keine Tumortherapie (Device/Portimplantation);
  ein eigenes Element erwägen oder den Port aus der Definition nehmen. Außerdem die Rolle der ICD-10-GM-Z-Codes
  (Eigenanamnese, Condition im PVS) gegenüber den SNOMED-Prozedurcodes in value_set.notes festhalten.'
- 'Die Element-Codes passen nur teilweise zu den nationalen Onko-Profilen: Diese verlangen die Therapieintention
  als Pflicht-Extension mit oBDS-Codes (Quelle wäre das Element treatmentIntent), und die Art der Systemtherapie
  wird mit oBDS-Codes (z. B. CH, IM, ZS, CI) in Procedure.code.coding:systemische_therapie_art geführt
  (REQUIRED). Laut MII-ConceptMap mii-cm-onko-therapie-typ-sct entsprechen 367336001 = CH, 1255831008
  = ZS bzw. CZ und 1287742003 = ST; für 870387009 (Checkpoint-Inhibitor), 1345242003 (Erhaltungstherapie)
  und 703423002 (Radiochemotherapie) gibt es dort kein direktes Ziel. Zu entscheiden: eine Abbildungstabelle
  Element-Code → Onko-Profil (Operation, Strahlentherapie, Systemische Therapie) und oBDS-Therapieart
  festlegen, insbesondere für Checkpoint-Inhibitor-, Erhaltungs- und Radiochemotherapie.'
