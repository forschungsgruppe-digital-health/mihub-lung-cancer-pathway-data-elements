id: mihub.lung.primarycare.recommendationsForPrimaryCare.v0.1
uuid: 908bb32f-5a34-5af0-9a00-bcfbb8432890
name: recommendationsForPrimaryCare
label_de: Empfehlungen / weiteres Prozedere für die Hausarztpraxis
definition_de: Vorschläge, was als Nächstes gemacht werden soll (weiteres Prozedere, hausärztliche Aufgaben,
  Kontrollen, Warnzeichen) — strukturierter Bestandteil von Arztbrief und Abschlussbericht.
phase: primarycare
tumor_entity:
- lung_cancer_any
category: versorgungsplanung
datatype: text
cardinality: 0..*
value_set:
  binding_strength: extensible
  standard_binding_status: mapped
  codings:
  - system: snomed-ct
    code: '427272008'
    display: Recommendation to physician
  - system: loinc
    code: 18776-5
    display: Plan of Care Note
standard_mappings:
- standard: hl7-cda
  profile_or_url: https://download.hl7.de/documents/cdar2-arztbrief/ArztbriefPlus-v312.pdf
  resource: Sektion „Weitere empfohlene Maßnahmen“ (templateId 1.2.276.0.76.10.3033, code LOINC 18776-5)
    im Arztbrief Plus
  path: ClinicalDocument/component/structuredBody/component/section[templateId/@root='1.2.276.0.76.10.3033']
  notes: Arztbrief Plus v3.12 (Standard zur Probe), Kap. 6.20; eine Sektion „Prozedere“ gibt es dort nicht.
- standard: fhir-r4-base
  resource: CarePlan
  path: CarePlan.activity.detail.description (Freitext) bzw. CarePlan.activity.detail.code; Gesamttext
    in CarePlan.description
  notes: CarePlan.activity ist ein Element, keine Ressource.
care_process:
  trigger: bei jeder Übergabe (Arztbrief, Abschlussbericht, Tumorboard)
  frequency_pattern: per-encounter
  responsible_role: Onkolog:in
  data_flows:
  - system: kis
    actor_role: Onkolog:in
    usage_type: capture
    sector: stationaer
  - system: pvs
    actor_role: Hausärzt:in
    usage_type: read
    sector: ambulant
  - system: epa
    actor_role: Patient:in
    usage_type: read
    sector: sektorenuebergreifend
evidence:
  guideline_references:
  - source: Expert:innen-Erhebung MiHUB
    version: Excel-Erhebung Allgemeinmedizin, Stand 2026-10-13 (Kontakt AK; Vorlage datenelement-erhebung
      (1)-Amed.xlsx)
    section: DE-032 Empfehlungen / DE-027 Therapieplanung
    recommendation_grade: n/a
    evidence_level: n/a
    locator: 'docs/reviews/2026-10-13-erhebungen.md#amed-de-032 (weitere Zeilen: DE-027)'
    quote: Empfehlungen … Vorschläge, was als Nächstes gemacht werden soll. … Therapieplanung … Festlegung
      der geeigneten Behandlung, was sind nächsten Schritte, was muss HÄ tun, was machen andere Ärzte
    accessed: '2026-10-15'
  - source: andere
    version: Klein A-A et al. 2026, Die Onkologie 32(1):91–99 (online 02.12.2025), doi:10.1007/s00761-025-01867-1
    url: https://doi.org/10.1007/s00761-025-01867-1
    section: 'Empfehlungsliste (Abb. 2 / Anhang 2): Dos › Relevante Informationen › Weiteres (weiteres
      Prozedere zur hausärztlichen Versorgung inkl. zeitl. Bewertung sowie besprochene, von Patient:innen
      selbst umzusetzende Maßnahmen) und Dos › Format › Weiteres Prozedere (zur hausärztlichen Versorgung);
      Ergebnisteil (Synthese – Empfehlungsliste): „Weiteres“ (künftige Kontrolluntersuchungen, Risikoverlauf)
      und „Weiteres Prozedere (zur hausärztlichen Versorgung)“ (chronologische Sortierung, Risikoklassifizierung,
      Checklistenformat inkl. Zeitplan, „red flags“)'
    recommendation_grade: n/a
    evidence_level: n/a
    quote: Weiteres ▪ weiteres Prozedere zur hausärztlichen Versorgung inkl. zeitl. Bewertung sowie besprochene,
      von Patienten selbst umzusetzende Maßnahmen … Weiteres Prozedere (zur hausärztlichen Versorgung)
      ▪ kurzhalten und zeitlich sortieren
    accessed: '2026-10-15'
    locator: 'Anhang 2 (= Abb. 2, S. 95): Dos › Relevante Informationen › Weiteres; Dos › Format › Weiteres
      Prozedere'
  - source: OCP Lung (AU)
    version: 2nd ed. 2021 (Update 07/2025)
    url: https://www.cancer.org.au/assets/pdf/ocp/lung-cancer-2nd-edition
    section: Step 3.6.5 Communication with the general practitioner (Behandlungsplan, MDM-Empfehlungen);
      Step 5.4.4 Communication with the general practitioner (follow-up care plan, late effects, rapid
      re-entry)
    recommendation_grade: n/a
    evidence_level: n/a
    quote: • ensuring regular and timely communication with the general practitioner about the diagnosis,
      treatment plan and recommendations from MDMs … • the follow-up care plan • potential late effects
    accessed: '2026-10-15'
    locator: Step 3.6.5, S. 33; Step 5.4.4, S. 47
