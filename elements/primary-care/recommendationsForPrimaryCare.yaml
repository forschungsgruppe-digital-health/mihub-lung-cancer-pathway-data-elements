name: recommendationsForPrimaryCare
label_de: Empfehlungen / weiteres Prozedere für die Hausarztpraxis
definition_de: Vorschläge, was als Nächstes gemacht werden soll (weiteres Prozedere, hausärztliche Aufgaben,
  Kontrollen, Warnzeichen) — strukturierter Bestandteil von Arztbrief und Abschlussbericht.
