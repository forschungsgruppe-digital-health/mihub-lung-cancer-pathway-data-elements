issues:
- 'Die Intention wird je Ziel unterschiedlich kodiert: oBDS mit Buchstabencodes je Abschnitt (OP K/P/D/R/S/X,
  ST K/P/O/S/X, SYST K/P/S/X), MII Onko über Procedure.extension:Intention (REQUIRED, dieselben oBDS-Codes;
  ConceptMap mii-cm-onko-intention-sct: K = 373808002, P = 363676003, O „lokal kurativ bei Oligometastasierung“
  nur als „wider“ auf 373808002), mCODE über SNOMED (extensible). Zu entscheiden: die Abbildung der Element-Codes
  373808002 und 363676003 auf die oBDS-Codes je Therapieabschnitt festschreiben (insbesondere K oder O
  bei der Strahlentherapie) und klären, ob die MII-Onko-Intention-Extensions (mii-ex-onko-operation-intention,
  -strahlentherapie-intention, -systemische-therapie-intention) als nationales FHIR-Ziel ergänzt werden.'
