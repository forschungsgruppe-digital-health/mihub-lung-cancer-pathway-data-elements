issues:
- 'Das Profil mii-pr-onko-histologie-icdo3 verlangt eine Probenreferenz (Observation.specimen 1..1 auf
  mii-pr-onko-specimen), die in der Hausarztpraxis meist fehlt; Observation.code lässt nur LOINC 59847-4
  zu. Zu entscheiden: ob die Histologie hausärztlich als strukturierte Observation (mit Probenreferenz)
  oder nur als übernommener Befund (Dokument, KDL PT080102 Histologiebefund) geführt wird.'
