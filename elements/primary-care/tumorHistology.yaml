label_de: Histologie
definition_de: 'Histologischer Tumortyp nach der jeweils gültigen WHO-Klassifikation (laut S3-LL Lungenkarzinom
  5.1: 5. Auflage 2021), kodiert als ICD-O-3-Morphologie mit Dignität (z. B. 8140/3), bestimmt am Resektat,
  an einer Biopsie oder an einem zytologischen Präparat.'
