category: versorgungskontext
datatype: code
cardinality: 1..1
value_set:
  binding_strength: example
  standard_binding_status: no-standard-found
  notes: 'Kein deckungsgleiches ValueSet gefunden (MII TermServ, Stand 2026-10-14). LOINC 59557-9 Treatment
    status Cancer (Klasse TUMRRGT) ist nur bedingt als Observation.code geeignet: Seine Antwortliste LL916-8
    (Treatment given / No treatment given / Active surveillance (watchful waiting) / Unknown if treatment
    was given) beschreibt, ob behandelt wurde, nicht die aktuelle Therapiephase. SNOMED-CT-Teilentsprechungen:
    182992009 Treatment completed (situation; spezifischer 413737006 Cancer hospital treatment completed)
    ≈ completed; 373818007 No anti-cancer treatment - watchful waiting (finding; Kind von 373811001 Reason
    for no specific anti-cancer treatment) nur für „therapiefrei ohne Vortherapie“. 719864002 Monitoring
    following treatment for cancer (regime/therapy) beschreibt die Nachsorge nach Therapieabschluss als
    Maßnahme, nicht als Status; ebenso ist 1345242003 Maintenance antineoplastic therapy ein Regime-/Therapiekonzept
    (kein Status) und gehört zu cancerTreatmentHistory. Ein Situationskonzept für die laufende Therapie
    wurde nicht gefunden; am nächsten liegt 395073001 Cancer treatment started (situation), das nur den
    Therapiebeginn und nicht die Fortdauer bezeichnet.'
