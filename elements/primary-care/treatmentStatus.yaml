label_de: Therapiestatus
definition_de: 'Status der tumorspezifischen Therapie aus Sicht der Hausarztpraxis: laufend, Erhaltungstherapie,
  abgeschlossen, therapiefrei (Beobachtung).'
phase: primarycare
tumor_entity:
