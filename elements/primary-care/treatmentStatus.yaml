issues:
- 'Die Werte von treatmentStatus sind nicht disjunkt: „maintenance“ ist ein Unterfall von „ongoing“, „completed“
  und „treatment-free“ überlappen nach Therapieende. Für code 1..1 mit dem Erhebungskontakt (DE-037 nennt
  nur „laufend, abgeschlossen, therapiefrei“) Definitionen und eine Vorrangregel festlegen, z. B. maintenance
  vor ongoing; completed = geplante (Primär-)Therapie abgeschlossen, in Nachsorge. Für treatment-free
  klären, ob (a) keine tumorspezifische Therapie ohne Vortherapie (watchful waiting, ≈ SNOMED CT 373818007)
  oder (b) ein therapiefreies Intervall nach einer Vortherapie (z. B. Therapiepause nach Induktion ohne
  Erhaltung) gemeint ist; die Leitlinien verwenden „therapiefrei“ für das Intervall nach einer Vortherapie
  (S3-LL Lungenkarzinom 5.1, Kap. 9.6.2; Onkopedia SCLC, Stand August 2026, Kap. 6.1.2). Bei (b) die Abgrenzung
  zu completed festlegen.'
