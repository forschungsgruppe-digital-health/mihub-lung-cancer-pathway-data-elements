issues:
- 'Rollen trennen: Observation.code = Score-Observable (z. B. 718366000 / LOINC 89209-1), Instrument =
  Observation.method (falls benötigt, BDI-II-Variante 1344725001 ‚Beck Depression Inventory II (assessment
  scale)‘ statt 273306008). Mapping-Pfad ‚Observation.code (Instrument)‘ entsprechend korrigieren und
  273306008 aus dem Observation.code-Value-Set herausnehmen.'
- 'Das Element hat datatype integer mit unit {score} (Mapping derzeit Observation.valueInteger). Die nationalen
  MII-PRO-Profile (BDI-II, score-instance) lassen für numerische Scores nur valueQuantity zu (BDI-II:
  UCUM {score}). Zu entscheiden: datatype auf Quantity umstellen (die Einheit {score} ist bereits hinterlegt)
  oder die Transformation integer → Quantity als Mapping-Regel festhalten.'
