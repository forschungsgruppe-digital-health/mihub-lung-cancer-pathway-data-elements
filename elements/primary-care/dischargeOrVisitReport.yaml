id: mihub.lung.primarycare.dischargeOrVisitReport.v0.1
uuid: d230cfc6-8bfd-592d-9628-7b2bbfb6c22e
name: dischargeOrVisitReport
label_de: Entlassbrief / Arztbrief
definition_de: Entlassungsbericht bzw. Arztbrief nach stationärer oder ambulanter Vorstellung (inkl. Epikrise,
  Prozedere) als Übergabedokument an die Hausarztpraxis.
phase: primarycare
tumor_entity:
- lung_cancer_any
category: dokument
datatype: Reference
cardinality: 1..*
value_set:
  binding_strength: extensible
  standard_binding_status: mapped
  codings:
  - system: kdl
    code: ED110112
    display: KH-Entlassbrief
  - system: kdl
    code: AD010115
    display: Entlassungsbericht
  - system: kdl
    code: AD010109
    display: Ärztlicher Befundbericht
  - system: kdl
    code: AD010110
    display: Ärztlicher Verlaufsbericht
  - system: loinc
    code: 18842-5
    display: Discharge Summary
  - system: loinc
    code: 11488-4
    display: Consult Note
  - system: snomed-ct
    code: '373942005'
    display: Discharge summary
  - system: kdl
    code: AD010111
    display: Ambulanzbrief
standard_mappings:
- standard: gematik-epa-fhir
  profile_or_url: https://gematik.de/fhir/epa-mhd/StructureDefinition/epa-mhd-document-reference
  resource: DocumentReference (ePA MHD; Inhalt z. B. eArztbrief)
  path: DocumentReference.category.coding = BRI (Brief; REQUIRED epa-xds-class-code-vs); DocumentReference.type.coding
    = BERI (Arztberichte; REQUIRED epa-xds-type-code-vs); KDL-Code (z. B. ED110112) in DocumentReference.context.event.coding;
    Dokument in DocumentReference.content.attachment
  notes: de.gematik.epa.mhd 1.1.3. Der ePA MHD Service definiert für DocumentReference nur Suche und Abruf
    (search-type, read). type und category nehmen IHE-D-Codes an, keine KDL-Codes.
- standard: hl7-cda
  profile_or_url: https://download.hl7.de/documents/cdar2-arztbrief/ArztbriefPlus-v312.pdf
  resource: CDA R2 ClinicalDocument „Arztbrief Plus“ (templateId 1.2.276.0.76.10.1020)
  path: ClinicalDocument/templateId/@root = 1.2.276.0.76.10.1020; ClinicalDocument/code = LOINC 11490-0
  notes: HL7 Deutschland, Version 3.12, Standard zur Probe (STU). Deckt Entlassbriefe nach stationärem
    Aufenthalt und ärztliche Berichte nach ambulantem Besuch ab; der Dokumentcode ist fest 11490-0 (Discharge
    summarization note [physician]).
- standard: ihe-xds
  profile_or_url: http://ihe-d.de/ValueSets/IHEXDStypeCode
  resource: 'XDS DocumentEntry (FHIR-Pendant: DocumentReference über MHD)'
  path: DocumentEntry.classCode = BRI (Brief; http://ihe-d.de/ValueSets/IHEXDSclassCode); DocumentEntry.typeCode
    = BERI (Arztberichte); KDL-Code (z. B. ED110112, AD010115) in DocumentEntry.eventCodeList (http://ihe-d.de/ValueSets/IHEXDSeventCodeList)
  notes: IHE-D-Value-Sets aus de.ihe-d.terminology 3.0.1; die KDL ist über die eventCodeList eingebunden.
