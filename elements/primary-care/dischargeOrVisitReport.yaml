issues:
- 'Das Element führt KDL-, LOINC- und SNOMED-Dokumentcodes (ED110112, AD010115, AD010109, AD010110, AD010111,
  18842-5, 11488-4, 373942005). Die Zielformate verlangen andere Codes: XDS und ePA IHE-D classCode BRI
  und typeCode BERI (KDL nur in eventCodeList bzw. context.event), CDA Arztbrief Plus fest LOINC 11490-0.
  Zu entscheiden: IHE-D-Codes und LOINC 11490-0 in den value_set aufnehmen oder nur als Mapping-Regel
  führen; außerdem, ob MII Dokument (https://www.medizininformatik-initiative.de/fhir/ext/modul-dokument/StructureDefinition/mii-pr-dokument-dokument,
  type.coding:KDL) als nationales FHIR-Ziel ergänzt werden soll.'
