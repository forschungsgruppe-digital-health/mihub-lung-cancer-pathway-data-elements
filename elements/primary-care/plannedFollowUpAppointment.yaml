issues:
- 'Der Datentyp dateTime deckt die Definition nur teilweise ab. „Vorgemerkte Überweisungen“ sind kein
  Datum; sie sind inhaltlich über dependsOn referralOrder verknüpft. Auch ein ggf. für „Lücken erkennen“
  benötigter Terminstatus (booked / fulfilled / noshow) lässt sich nicht abbilden. Prüfen: Reference(Appointment)
  mit Appointment.start, Appointment.basedOn (ServiceRequest) und optional Appointment.status (z. B. noshow;
  alternativ Lückenerkennung durch Abgleich mit dokumentierten Kontakten) oder definition_de auf das Termindatum
  einschränken. Außerdem beziehen trigger und responsible_role die Hausarztpraxis bzw. Hausärzt:in ein,
  die data_flows sehen für das PVS aber nur read vor und keinen capture für hausärztliche Wiedervorstellungen.'
