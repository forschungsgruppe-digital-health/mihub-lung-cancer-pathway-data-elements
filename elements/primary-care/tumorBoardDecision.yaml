issues:
- 'Das Element ist als Freitext (datatype text) definiert; das nationale Profil mii-pr-onko-tumorkonferenz
  und oBDS 18/19 verlangen kodierte Angaben (Konferenztyp, Therapieempfehlung nach oBDS-Codes, Abweichung
  auf Patientenwunsch). Zu entscheiden: kodierte Teil-Elemente (Konferenztyp, Empfehlungstyp, Abweichung)
  ergänzen oder das Element als Freitext bzw. Dokument (CarePlan.description, MII Dokument) belassen.'
