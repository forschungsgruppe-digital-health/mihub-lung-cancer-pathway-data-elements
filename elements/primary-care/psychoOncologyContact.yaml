evidence:
  guideline_references:
  - source: Expert:innen-Erhebung MiHUB
    version: Excel-Erhebung Allgemeinmedizin, Stand 2026-10-13 (Kontakt AK; Vorlage datenelement-erhebung
      (1)-Amed.xlsx)
    section: DE-007 Psychoonkologische Gespräche
    recommendation_grade: n/a
    evidence_level: n/a
    locator: docs/reviews/2026-10-13-erhebungen.md#amed-de-007
    quote: Psychoonkologische Gespräche … psychischen und emotionalen Unterstützung von Krebspatienten
      und Angehörigen, Ängste, Informationen
    accessed: '2026-10-15'
  - source: S3-LL Lungenkarzinom
    version: 5.1 (Juli 2026, AWMF 020-007OL)
    url: https://www.leitlinienprogramm-onkologie.de/leitlinien/lungenkarzinom
    section: 'Empf. 8.77 (Kap. 8.6.1 NSCLC Stadium IV; EK, geprüft 2026, Starker Konsens: Möglichkeiten
      der psychoonkologischen Unterstützung sollten angesprochen werden); Empf. 16.1 und 16.2 (EK, geprüft
      2026, Starker Konsens: strukturierter Nachsorge- bzw. Verlaufsplan sollte geeignet sein, den Bedarf
      an Psychoonkologie zu erkennen); Empf. 7.6 (Kap. 7.3.1 Diagnosemitteilung; EK, geprüft 2026, Konsens:
      Angehörige sollen nach ihren Bedürfnissen gefragt und bei Bedarf zum Annehmen von Unterstützungsangeboten
      ermutigt werden); Kap. 11 (Verweis auf S3-LL Psychoonkologie, ohne eigene Empfehlungen)'
    recommendation_grade: EK
    evidence_level: n/a
    quote: Neben der medizinischen Behandlung sollten die Möglichkeiten zur Rehabilitation, psychoonkologischen
      Unterstützung, Sozialberatung bzw. Unterstützung … angesprochen werden. … Der strukturierte Nachsorgeplan
      sollte geeignet sein, … den Bedarf an Psychoonkologie und Sozialberatung zu erkennen
    accessed: '2026-10-15'
    locator: Kap. 8.6.1, Empf. 8.77, S. 287; Kap. 16.1, Empf. 16.1 (und 16.2), S. 492
  - source: OCP Lung (AU)
    version: 2nd ed. 2021 (Update 07/2025)
    url: https://www.cancer.org.au/assets/pdf/ocp/lung-cancer-2nd-edition
    section: Principle 4 Supportive care (Screening/Bedarfserhebung bei Patient:innen und Familien; Key
      review points); Appendix B Psychological needs (Überweisungsanlässe; Unterstützung für Angehörige)
    recommendation_grade: n/a
    evidence_level: n/a
    quote: 'For health professionals, supportive care involves: • screening and assessing patients and
      families for their supportive care needs … • support for the carer – encourage referrals to psychosocial
      support from a social worker, psychologist or general practitioner'
    accessed: '2026-10-15'
    locator: Principle 4 Supportive care, S. 13; Appendix B Psychological needs, S. 58
