id: mihub.lung.surveillance.therapyLineNumber.v0.1
uuid: 486f2b80-a2c1-59ca-8ea7-baf8c1204ba6
name: therapyLineNumber
label_de: Therapielinie
definition_de: Nummer der aktuellen Systemtherapielinie (1 = Erstlinie).
phase: surveillance
tumor_entity:
- NSCLC
- SCLC
category: medikation
datatype: integer
cardinality: 0..1
value_set:
  codings: []
  standard_binding_status: n/a
  notes: 'Kein Standard-Elementcode für die Liniennummer. Optionale codierte Darstellung: SNOMED CT 708255002
    |First line treatment|, 708256001 |Second line treatment|, 708257005 |Third line treatment| (procedure);
    ab der 4. Linie gibt es kein SNOMED-Konzept, daher ist der Integerwert führend.'
constraints_de: 'Wertebereich 1..n (1 = Erstlinie). NSCLC: Zählung ab der ersten Systemtherapie im metastasierten
  bzw. palliativen Setting (Stadium IV inkl. metastasiertem Rezidiv sowie Stadium III ohne Indikation
  zur definitiven Lokaltherapie). SCLC: Die Systemtherapie der Primärbehandlung aller Stadien (bei LD
  auch im Rahmen der Radiochemotherapie) ist die Erstlinie, die erste systemische Rezidivtherapie die
  Zweitlinie. Der Zähler erhöht sich beim Wechsel auf eine neue Systemtherapie wegen Progression oder
  Unverträglichkeit. Keine neue Linie: Erhaltungs- bzw. Konsolidierungstherapie im Anschluss an Induktion
  oder Radiochemotherapie (Teil derselben Linie) sowie Fortführung der laufenden Systemtherapie bei Oligoprogression
  bzw. lokaler Progression mit lokaler Therapie.'
care_process:
  trigger: bei Therapiestart
  frequency_pattern: per-line
  responsible_role: Onkologe
evidence:
  guideline_references:
  - source: S3-LL Lungenkarzinom
    version: 5.1 (Juli 2026, AWMF 020-007OL)
    url: https://www.leitlinienprogramm-onkologie.de/leitlinien/lungenkarzinom
    section: 'Kap. 16.1 (Hintergrundtext: real-world vs. Studienergebnisse, Evidenzgrad IIa) — kein formales
      Statement'
    recommendation_grade: n/a
    evidence_level: 2a
    quote: Möglicherweise ist durch die frühzeitige Erfassung von Nicht-Wirksamkeit der Therapien eine
      Durchführung der Umstellung auf Zweit- bzw. Drittlinientherapien in mehr Fällen möglich [1861],
      [1862].
    accessed: '2026-10-15'
    locator: Kap. 16.1 Allgemeines, Hintergrundtext, S. 491–492
  - source: S3-LL Lungenkarzinom
    version: 5.1 (Juli 2026, AWMF 020-007OL)
    url: https://www.leitlinienprogramm-onkologie.de/leitlinien/lungenkarzinom
    section: Kap. 16.4 (Therapiewechsel in die Zweitlinientherapie unter Verlaufskontrolle) / Empf. 16.9
    recommendation_grade: EK
    evidence_level: n/a
    quote: In den klinischen Studien wurden dann alle 6 bis 9 Wochen Kontroll- CTs (CT-Thorax und CT Abdomen/Becken)
      durchgeführt um die Therapie notfalls in eine Zweitlinientherapie zu ändern.
    accessed: '2026-10-15'
    locator: Kap. 16.4 Verlaufsuntersuchungen/Follow-up unter laufender Systemtherapie, S. 498
  - source: Onkopedia NSCLC
    version: Stand April 2025
    url: https://www.onkopedia.com/de/onkopedia/guidelines/lungenkarzinom-nicht-kleinzellig-nsclc
    section: Kap. 6.1.6.2.2.1 Erstlinientherapie / 6.1.6.2.2.2 Zweitlinientherapie
    recommendation_grade: n/a
    evidence_level: n/a
    quote: Die Optionen für die Zweitlinientherapie von Pat. ohne Nachweis genetischer Marker für eine
      molekular zielgerichtete Therapie sind vielfältig.
    accessed: '2026-10-15'
    locator: Kap. 6.1.6.2.2.2 Zweitlinientherapie
