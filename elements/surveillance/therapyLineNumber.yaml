name: therapyLineNumber
label_de: Therapielinie
definition_de: Nummer der aktuellen Systemtherapielinie (1 = Erstlinie).
phase: surveillance
tumor_entity:
- NSCLC
- SCLC
category: medikation
datatype: integer
cardinality: 0..1
value_set:
  codings: []
  standard_binding_status: n/a
  notes: 'Kein Standard-Elementcode für die Liniennummer. Optionale codierte Darstellung: SNOMED CT 708255002
    |First line treatment|, 708256001 |Second line treatment|, 708257005 |Third line treatment| (procedure);
    ab der 4. Linie gibt es kein SNOMED-Konzept, daher ist der Integerwert führend.'
constraints_de: 'Wertebereich 1..n (1 = Erstlinie). NSCLC: Zählung ab der ersten Systemtherapie im metastasierten
  bzw. palliativen Setting (Stadium IV inkl. metastasiertem Rezidiv sowie Stadium III ohne Indikation
  zur definitiven Lokaltherapie). SCLC: Die Systemtherapie der Primärbehandlung aller Stadien (bei LD
  auch im Rahmen der Radiochemotherapie) ist die Erstlinie, die erste systemische Rezidivtherapie die
  Zweitlinie. Der Zähler erhöht sich beim Wechsel auf eine neue Systemtherapie wegen Progression oder
  Unverträglichkeit. Keine neue Linie: Erhaltungs- bzw. Konsolidierungstherapie im Anschluss an Induktion
  oder Radiochemotherapie (Teil derselben Linie) sowie Fortführung der laufenden Systemtherapie bei Oligoprogression
  bzw. lokaler Progression mit lokaler Therapie.'
