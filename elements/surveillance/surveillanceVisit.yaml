label_de: Verlaufskontroll-Visite unter Systemtherapie (Anamnese und körperliche Untersuchung)
definition_de: Datum der festgelegten Wiedervorstellung unter bzw. nach Systemtherapie im Stadium IV,
  an der Beschwerdebild (Anamnese), körperliche Untersuchung, Nebenwirkungen und Ansprechen evaluiert
  werden. Erste Evaluation einen Monat nach Abschluss der Induktionsbehandlung (postInductionEvaluationDate),
  danach mindestens alle 3–6 Wochen unter laufender Erhaltungstherapie.
