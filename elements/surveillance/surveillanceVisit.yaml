issues:
- 'Anamnese-Komponente der Verlaufskontroll-Visite fehlt: S3-LL Lungenkarzinom 5.1, Empf. 16.9 nennt Anamnese
  und körperliche Untersuchung als Basis der Evaluation, die Expert:innen-Erhebung führt die Anamnese
  als Surveillance-Datenelement (DE-042); surveillanceVisit (dateTime) trägt selbst keinen Befund. Die
  körperliche Untersuchung ist über physicalExaminationFinding angebunden (Trigger und isPartOf surveillanceVisit),
  die Anamnese nicht: followUpHistoryFinding ist nur an followUpVisitDate gekoppelt (siehe dort den offenen
  Punkt „Surveillance-Asymmetrie“). Zu entscheiden: followUpHistoryFinding um Trigger und isPartOf surveillanceVisit
  erweitern (analog physicalExaminationFinding) oder ein eigenes Surveillance-Anamnese-Element anlegen;
  in beiden Fällen hier per hasPart verknüpfen und gegen patientReportedSymptomWeb (PROM) und adverseEventCtcae
  abgrenzen. Erst danach entscheiden, ob die Codings 84100007 ''History taking'' und 5880005 ''Physical
  examination'' im Visiten-Wertebereich bleiben.'
