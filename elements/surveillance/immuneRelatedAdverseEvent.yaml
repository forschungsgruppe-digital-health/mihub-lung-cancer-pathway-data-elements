id: mihub.lung.surveillance.immuneRelatedAdverseEvent.v0.1
uuid: 80f92429-8ac9-5868-bbb5-4a6362a8d988
name: immuneRelatedAdverseEvent
label_de: Immunvermittelte Nebenwirkung (irAE)
definition_de: Spezifische immunvermittelte Toxizität unter Checkpoint-Inhibitor-Therapie (Pneumonitis,
  Kolitis, Hepatitis, Endokrinopathie, Hautreaktion).
phase: surveillance
tumor_entity:
- NSCLC
- SCLC
category: befund
datatype: CodeableConcept
cardinality: 0..*
value_set:
  binding_strength: extensible
  codings:
  - system: snomed-ct
    code: '62014003'
    display: Adverse reaction to drug
  - system: snomed-ct
    code: '427046006'
    display: Drug-induced pneumonitis
  - system: snomed-ct
    code: '235876009'
    display: Drug-induced hepatitis
  - system: snomed-ct
    code: '1345085000'
    display: Immune checkpoint inhibitor therapy induced enterocolitis
  - system: snomed-ct
    code: '237539004'
    display: Drug-induced thyroiditis
  - system: snomed-ct
    code: '28926001'
    display: Eruption caused by drug
  standard_binding_status: mapped
care_process:
  trigger: Verdachtsfall unter Checkpoint-Inhibitor
  frequency_pattern: per-encounter
  responsible_role: Onkologe
evidence:
  guideline_references:
  - source: S3-LL Lungenkarzinom
    version: 5.1 (Juli 2026, AWMF 020-007OL)
    url: https://www.leitlinienprogramm-onkologie.de/leitlinien/lungenkarzinom
    section: 'Kap. 16.3 Einleitung (Textpassage: „immun-bezogene Komplikationen“ als Nachsorgeparameter
      nach lokal ablativer Therapie; keine Empfehlungsbox)'
    recommendation_grade: n/a
    evidence_level: n/a
    quote: 'Die Nachsorge beinhaltet mehrere Parameter. Dazu gehören zunehmend auch die Erfassung posttherapeutischer
      Komplikationen (Stichworte: Post-Pneumonektomiesyndrom nach OP, Strahlenfibrose nach CTx/RTx, immun-bezogene
      Komplikationen)'
    accessed: '2026-10-15'
    locator: Kap. 16.3 Nachsorge im Anschluss an eine lokal ablative Therapie, Einleitungstext, S. 493
  - source: Onkopedia NSCLC
    version: Stand April 2025
    url: https://www.onkopedia.com/de/onkopedia/guidelines/lungenkarzinom-nicht-kleinzellig-nsclc
    section: 'Kap. 6.2.3.2 Immuntherapie (6.2.3.2.1–6.2.3.2.5, 6.2.3.2.7: irAE durch autoimmun-vermittelte
      Entzündung, Erkennung/Management nach aktuellen Leitlinien); Kap. 6.1.6.2.2.1.2.1 (hepatische, kutane
      und endokrine Toxizitäten der Immunkombinationstherapie)'
    recommendation_grade: n/a
    evidence_level: n/a
    quote: Im Verlauf einer ICI-basierten Therapie können immunvermittelte Nebenwirkungen (irAE) durch
      autoimmun-vermittelte Entzündung verschiedener Gewebe bzw. Organe auftreten. … Die Nebenwirkungen
      der Immunkombinationstherapie … betreffen vor allem hepatische, kutane und endokrine Toxizitäten.
    accessed: '2026-10-15'
    locator: Kap. 6.2.3.2.1–6.2.3.2.5, 6.2.3.2.7 (je gleichlautend); Kap. 6.1.6.2.2.1.2.1 Nicht-Plattenepithelkarzinom
  - source: Onkopedia SCLC
    version: Stand August 2026
    url: https://www.onkopedia.com/de/onkopedia/guidelines/lungenkarzinom-kleinzellig-sclc
    section: Kap. 8.3.1.7 Durvalumab („Auf immuntherapiebedingte Nebenwirkungen ist zu achten.“); Kap.
      8.3.1.13 Serplulimab (autoimmunbedingte Nebenwirkungen wie Pneumonitis, Colitis oder Hepatitis)
    recommendation_grade: n/a
    evidence_level: n/a
    quote: Auf immuntherapiebedingte Nebenwirkungen ist zu achten. … Bei der Anwendung sind auf die auch
      für andere PD1-/PD-L1-Inhibitoren relevanten, vor allem autoimmunbedingten, Nebenwirkungen wie Pneumonitis,
      Colitis oder Hepatitis zu achten.
    accessed: '2026-10-15'
    locator: Kap. 8.3.1.7 Durvalumab; Kap. 8.3.1.13 Serplulimab
  - source: S3-LL Lungenkarzinom
    version: 5.1 (Juli 2026, AWMF 020-007OL)
    url: https://www.leitlinienprogramm-onkologie.de/leitlinien/lungenkarzinom
    section: 'Empf. 16.2 (EK, geprüft 2026: strukturierter Verlaufs-/Follow-up-Plan unter Systemtherapie
      Stadium IVA/IVB zur Erkennung von Komplikationen und Toxizitäten der Therapie)'
    recommendation_grade: EK
    evidence_level: n/a
    quote: Im Verlauf einer systemischen Therapie (Stadium IVA, IVB) sollte für jeden Patienten ein strukturierter
      Verlaufsplan/Follow-up-Plan erstellt werden. … Komplikationen und Toxizitäten der Therapie
    accessed: '2026-10-15'
    locator: Kap. 16.1, Empf. 16.2 (EK, geprüft 2026, Starker Konsens), S. 492
  - source: S3-LL Lungenkarzinom
    version: 5.1 (Juli 2026, AWMF 020-007OL)
    url: https://www.leitlinienprogramm-onkologie.de/leitlinien/lungenkarzinom
    section: Kap. 12 Supportive Behandlung (Verweiskapitel auf S3-LL Supportive Therapie, Thema „Immunvermittelte
      Nebenwirkungen (irAE) durch Immuncheckpoint-Inhibitoren“; keine eigene Empfehlung)
    recommendation_grade: n/a
    evidence_level: n/a
    quote: 'In der S3-Leitlinie zur supportiven Therapie von onkologischen Patienten wird auf die folgenden
      Themen detailliert eingegangen: … Immunvermittelte Nebenwirkungen (irAE) durch Immuncheckpoint-Inhibitoren'
    accessed: '2026-10-15'
    locator: Kap. 12 Supportive Behandlung beim Lungenkarzinom (Verweis auf S3-LL Supportive Therapie),
      S. 471
