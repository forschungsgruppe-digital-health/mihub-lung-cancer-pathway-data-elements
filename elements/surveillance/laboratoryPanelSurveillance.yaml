issues:
- Onkopedia nennt unter Therapie keine Laborfrequenz; „per-cycle“ ist eine Praxisableitung (UNSICHER).
- 'Codings mit gemischten Achsen: 15220000 (Prozedur), LOINC 11502-2 (CLASS DOC.MISC = Berichts-/Dokumenttyp)
  und KDL LB120107 (Dokumentklasse). Für den Mapping-Pfad Observation.code (ObservationLab) sind 11502-2/LB120107
  ungeeignet. Zu prüfen: panel- bzw. analytspezifische LOINC-Codes (TermServ 2026-10-14 aktiv: 58410-2
  ''CBC panel - Blood by Automated count'', 24326-1 ''Electrolytes 1998 panel - Serum or Plasma'', 34714-6
  ''INR in Blood by Coagulation assay'', 3173-2 ''aPTT in Blood by Coagulation assay''; LDH 2532-0 ist
  DISCOURAGED) oder ein Mapping auf einen Laborbefund-Bericht (DiagnosticReport) statt Observation. Die
  US-Panels ''… 2000 panel'' (Renal/Hepatic) decken sich nicht 1:1 mit ''Nieren-/Leberparameter''.'
