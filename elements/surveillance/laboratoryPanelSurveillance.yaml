name: laboratoryPanelSurveillance
label_de: Basislabor unter Systemtherapie
definition_de: Symptom- und therapieorientiertes Basislabor unter Systemtherapie im Stadium IV (Blutbild,
  Elektrolyte, Nierenparameter, Leberparameter, LDH, Gerinnung; Zusammensetzung gemäß Onkopedia NSCLC
  Tab. 2, auf die Kap. 6.1.6.2 für das Stadium IVB verweist). Zeitpunkt und Frequenz sind in der S3-LL
  Lungenkarzinom und in Onkopedia NSCLC/SCLC für die Verlaufsbeobachtung unter Systemtherapie nicht festgelegt;
  in der Praxis meist vor jedem Therapiezyklus bzw. bei jeder Verlaufskontrolle (Praxisableitung, nicht
  leitlinienbelegt). Kein Nachsorge-Standard nach kurativer Therapie.
