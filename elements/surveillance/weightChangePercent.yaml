issues:
- 'Vorzeichen- und Bezugskonvention festlegen: Der Name ''weightChangePercent'' (Änderung) passt nicht
  zu Label, Definition und Code ''Gewichtsverlust'' (SNOMED 248349002 ''Percentage weight loss''). Werden
  Zu- und Abnahme vorzeichenbehaftet erfasst, passt das verifizierte Elternkonzept SNOMED 248347000 ''Percentage
  change in weight (observable entity)''; andernfalls den Constraint ''Verlust ≥ 0 %, Zunahme nicht erfasst''
  ergänzen.'
