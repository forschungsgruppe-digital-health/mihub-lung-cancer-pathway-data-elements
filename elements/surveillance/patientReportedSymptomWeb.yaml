name: patientReportedSymptomWeb
label_de: Web-basierte Selbsteinschätzung von Symptomen (PROM)
definition_de: Wöchentliche, web-basierte Selbsteinschätzung von Symptomen (z. B. Atemnot, Schmerz, Husten,
  Müdigkeit) durch den Patienten zwischen Restaging-Untersuchungen. Verbessert OS bei NSCLC (Denis 2017).
