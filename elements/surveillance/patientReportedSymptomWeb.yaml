    code: 89194-5
    display: Patient reported outcome measure score
  - system: snomed-ct
    code: '840297006'
    display: Assessment of patient reported outcome measures
standard_mappings:
- standard: fhir-mii-kds
  profile_or_url: https://www.medizininformatik-initiative.de/fhir/ext/modul-pro/StructureDefinition/mii-pr-pro-questionnaire-response
  resource: QuestionnaireResponse
  path: QuestionnaireResponse.item
  notes: MII KDS PRO 2026.7.0 (MII_PR_PRO_QuestionnaireResponse, SDC-basiert). QuestionnaireResponse.questionnaire
    (1..1, MS) ist Pflicht und verweist per Canonical auf einen SDC-Fragebogen; die MII-Instrumente sind
    nach https://www.medizininformatik-initiative.de/fhir/ext/modul-pro/StructureDefinition/mii-pr-pro-questionnaire
    profiliert (Questionnaire.code 1..*, Slices snomed/loinc/mii). authored 1..1; Antworten in item.answer.value[x].
    Die Element-Codes (LOINC 89194-5, SNOMED 840297006) haben in der QuestionnaireResponse keinen Platz;
    das Instrument ist noch festzulegen (siehe Issue).
