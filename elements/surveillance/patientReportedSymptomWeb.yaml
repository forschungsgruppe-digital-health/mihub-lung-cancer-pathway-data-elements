name: patientReportedSymptomWeb
label_de: Web-basierte Selbsteinschätzung von Symptomen (PROM)
definition_de: Wöchentliche, web-basierte Selbsteinschätzung von Symptomen (z. B. Atemnot, Schmerz, Husten,
  Müdigkeit) durch den Patienten zwischen Restaging-Untersuchungen. Verbessert OS bei NSCLC (Denis 2017).
phase: surveillance
tumor_entity:
- NSCLC
- SCLC
category: prom
datatype: CodeableConcept
cardinality: 0..*
value_set:
  binding_strength: extensible
  codings:
  - system: loinc
    code: 89194-5
    display: Patient reported outcome measure score
  - system: snomed-ct
    code: '840297006'
    display: Assessment of patient reported outcome measures
standard_mappings:
- standard: fhir-mii-kds
  profile_or_url: https://www.medizininformatik-initiative.de/fhir/ext/modul-pro/StructureDefinition/mii-pr-pro-questionnaire-response
  resource: QuestionnaireResponse
  path: QuestionnaireResponse.item
  notes: MII KDS PRO 2026.7.0 (MII_PR_PRO_QuestionnaireResponse, SDC-basiert). QuestionnaireResponse.questionnaire
    (1..1, MS) ist Pflicht und verweist per Canonical auf einen SDC-Fragebogen; die MII-Instrumente sind
    nach https://www.medizininformatik-initiative.de/fhir/ext/modul-pro/StructureDefinition/mii-pr-pro-questionnaire
    profiliert (Questionnaire.code 1..*, Slices snomed/loinc/mii). authored 1..1; Antworten in item.answer.value[x].
    Die Element-Codes (LOINC 89194-5, SNOMED 840297006) haben in der QuestionnaireResponse keinen Platz;
    das Instrument ist noch festzulegen (siehe Issue).
- standard: fhir-r4-base
  resource: QuestionnaireResponse
  path: QuestionnaireResponse.item
constraints_de: 'Population lt. Onkopedia: Patient:innen in fortgeschrittenen Stadien ohne Krankheitsprogress
  (Denis et al., JNCI 2017, HR 0,32).'
care_process:
  trigger: Beginn der Nachsorge nach medikamentöser Erstlinientherapie in palliativer Situation (fortgeschrittenes
    Stadium ohne Krankheitsprogress)
  frequency_pattern: weekly
  responsible_role: Patient (PROM); Onkologie-Triage
evidence:
  guideline_references:
  - source: Onkopedia NSCLC
    version: Stand April 2025
    url: https://www.onkopedia.com/de/onkopedia/guidelines/lungenkarzinom-nicht-kleinzellig-nsclc
    section: Kap. 8.2 (web-basierte wöchentliche Symptom-Selbsteinschätzung; Denis P et al., JNCI 109:djx029,
      2017)
    recommendation_grade: n/a
    evidence_level: n/a
    quote: Pat. in fortgeschrittenen Stadien ohne Krankheitsprogress zwischen einer wöchentlichen, Web-basierten
      Selbsteinschätzung und einer standardisierten 3-bzw. 6-monatlichen CT Kontrolle randomisiert. Pat.
      im experimentellen Arm hatten ein signifikant längeres, medianes Überleben
    accessed: '2026-10-15'
    locator: Kap. 8.2 Nicht-kurativ intendierte Therapie
  - source: OCP Lung (AU)
    version: 2nd ed. 2021 (Update 07/2025)
    url: https://www.cancer.org.au/assets/pdf/ocp/lung-cancer-2nd-edition
    section: 'Principle 2: Safe and quality care — Patient-reported experience and outcome measures (PROMs
      online erhoben; PROM-Erhebung mit klinischer Reaktion verlängert das Überleben)'
    recommendation_grade: n/a
    evidence_level: n/a
    quote: PROMs measure aspects of a person’s health status such as symptoms, quality of life and needs
      and are collected directly from patients either online, … Collecting PROMs, and then instigating
      an appropriate clinical response, has been shown to prolong survival
    accessed: '2026-10-15'
    locator: 'Principle 2: Safe and quality care – Patient-reported experience and outcome measures'
