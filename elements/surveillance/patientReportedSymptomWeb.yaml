issues:
- 'Modellierung klären: Das Element ist eine wöchentliche PROM-Selbsteinschätzung (FHIR QuestionnaireResponse),
  der datatype aber CodeableConcept ohne Symptom-Antwortwerte, und die Codings mischen Score- und Prozedurachse.
  Optionen: (a) datatype Reference mit Zieltyp QuestionnaireResponse (in standard_mappings dokumentiert)
  und Element-Code 840297006 (Prozedur) bzw. LOINC 89194-5, falls ein Score erhoben wird; oder (b) je
  Symptom ein Antwort-Value-Set (Symptomcodes für Atemnot, Schmerz, Husten, Müdigkeit; vor Aufnahme per
  TermServ zu verifizieren) plus Schweregrad, z. B. als Observable SNOMED CT 405162009 „Symptom severity
  level“ mit Antworten aus den Nachfahren von SNOMED CT 162465004 „Symptom severity“.'
- 'Instrument der wöchentlichen PROM-Erfassung festlegen (ergänzend zum offenen Punkt „Modellierung klären“):
  Das MII-PRO-Profil mii-pr-pro-questionnaire-response (pros 2026.7.0) verlangt QuestionnaireResponse.questionnaire
  (1..1) als Canonical eines konkreten Fragebogens (targetProfile sdc-questionnaire; die MII-Instrumente
  sind nach mii-pr-pro-questionnaire profiliert, Questionnaire.code 1..*). Das Element legt kein Instrument
  fest; seine generischen Codes (LOINC 89194-5, SNOMED 840297006) sind in der QuestionnaireResponse nicht
  abbildbar und als Instrument-Code ungeeignet. Zu entscheiden: welches Instrument die wöchentliche Web-Selbsteinschätzung
  nutzt – ein eigener MiHUB-Fragebogen in Anlehnung an Denis 2017 oder ein vorhandenes MII-Instrument
  aus pros 2026.7.0 (jeweils Status draft): mii-qst-pro-pro-ctcae-onkologisches-basisscreening (u. a.
  Schmerzen, Müdigkeit, Kurzatmigkeit) oder mii-qst-pro-midos-midos2 (u. a. Schmerz, Luftnot, Müdigkeit);
  Husten enthält keines der beiden.'
