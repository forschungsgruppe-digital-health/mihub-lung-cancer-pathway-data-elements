id: mihub.lung.surveillance.molecularResistanceFinding.v0.2
uuid: 96f79ba3-fbf4-58bf-a603-1ea0eff06d2a
name: molecularResistanceFinding
label_de: Molekulares Resistenzergebnis
definition_de: 'Codiertes Ergebnis der erneuten molekularen Testung (Gewebe-Rebiopsie und/oder Liquid
  Biopsy/ctDNA) bei akquirierter Resistenz bzw. Progression unter zielgerichteter Therapie (insbesondere
  TKI): nachgewiesener Resistenzmechanismus auf Konzeptebene (Gen + Alterationstyp), z. B. EGFR T790M,
  EGFR C797S, ALK G1202R, ROS1 G2032R, MET- oder HER2-Amplifikation.'
phase: surveillance
tumor_entity:
- NSCLC
- SCLC
category: laborbefund
datatype: CodeableConcept
cardinality: 0..*
value_set:
  binding_strength: extensible
  standard_binding_status: mapped
  codings:
  - system: loinc
    code: 21665-5
    display: EGFR gene mutations found [Identifier] in Blood or Tissue by Targeted gene mutation analysis
      Nominal
  - system: loinc
    code: 69548-6
    display: Genetic variant assessment
  - system: snomed-ct
    code: '124975008'
    display: Somatic mutation
  - system: kdl
    code: PT130102
    display: Molekularpathologiebefund
standard_mappings:
- standard: fhir-genomics
  profile_or_url: http://hl7.org/fhir/uv/genomics-reporting/StructureDefinition/variant
  resource: Observation (Variant)
  path: Observation.component:gene-studied.valueCodeableConcept; Observation.component:representative-protein-hgvs.valueCodeableConcept
  notes: HL7 Genomics Reporting STU3 (3.0.0). Observation.code ist per Pattern auf LOINC 69548-6 (Genetic
    variant assessment) festgelegt – das Element führt 69548-6 bereits; valueCodeableConcept REQUIRED
    an LL1971-2 (present/absent/no call). Gen in component:gene-studied (LOINC 48018-6, HGNC, extensible),
    Proteinveränderung in component:representative-protein-hgvs (LOINC 48005-3, HGVS, required), z. B.
    EGFR p.Thr790Met; DNA-Veränderung in component:representative-coding-hgvs (LOINC 48004-6, HGVS, required);
    Amplifikationen (MET, HER2) über component:copy-number (LOINC 82155-3). Die übrigen Element-Codes
    (LOINC 21665-5, SNOMED 124975008, KDL PT130102) taugen nicht als Observation.code. Die Resistenzaussage
    selbst über das Profil therapeutic-implication.
- standard: fhir-mii-kds
  profile_or_url: https://www.medizininformatik-initiative.de/fhir/ext/modul-molgen/StructureDefinition/variante
  resource: Observation
  path: Observation.component:gene-studied.valueCodeableConcept; Observation.component:representative-protein-hgvs.valueCodeableConcept
  notes: MII KDS Molekulargenetischer Befundbericht 2026.0.4 (MII_PR_MolGen_Variante, abgeleitet von genomics-reporting
    variant 3.0.x). Observation.code ist per Pattern auf LOINC 69548-6 festgelegt (im Element vorhanden);
    Gen in component:gene-studied (HGNC), Mutation über die HGVS-Komponenten (representative-protein-hgvs,
    representative-coding-hgvs, genomic-hgvs), Amplifikationen über component:copy-number (LOINC 82155-3);
    alle genannten Komponenten sind MS. Die Resistenz über das Profil https://www.medizininformatik-initiative.de/fhir/ext/modul-molgen/StructureDefinition/therapeutische-implikation.
- standard: obds
  profile_or_url: https://www.basisdatensatz.de/basisdatensatz
  resource: 23 Genetische Variante (XSD Menge_Genetik; bei Progression in der Meldung Verlauf oder Pathologie)
  path: 'Menge_Genetik/Genetische_Variante/Bezeichnung (23.1, Freitext) und Auspraegung (23.2: M Mutation/positiv,
    W Wildtyp, P Polymorphismus, N nicht bestimmbar, U unbekannt); optional Datum'
  notes: 'XML-Schema oBDS 3.0.5 (https://basisdatensatz.de/xml/oBDS_v3.0.5.xsd, Menge_Genetik_Typ); Feldseite
    23.1: https://basisdatensatz.de/feld/262/genetische-variante-name (Link aus der Feldliste). Ein ''Modul
    Genetische Veränderungen'' gibt es nicht. oBDS kennt nur Name und Ausprägung der Variante, keinen
    Resistenzmechanismus: Gen und Mutation (z. B. ''EGFR T790M'') als Bezeichnung mit Ausprägung M; alternativ
    Sonstige_Auspraegung als Freitext.'
- standard: fhir-mii-kds
  profile_or_url: https://www.medizininformatik-initiative.de/fhir/ext/modul-molgen/StructureDefinition/therapeutische-implikation
  resource: Observation
  path: Observation.component:therapeutic-implication.valueCodeableConcept; Observation.component:medication-assessed.valueCodeableConcept;
    Observation.derivedFrom:variant
  notes: MII KDS Molekulargenetischer Befundbericht 2026.0.4 (MII_PR_MolGen_TherapeutischeImplikation).
    Die Resistenzaussage als therapeutische Implikation (z. B. LOINC LA6676-6 'Resistant', extensible
    genetic-therapeutic-implications-vs), Substanz in component:medication-assessed (LOINC 51963-7), derivedFrom:variant
    (MS) → MII-Variante, die den Resistenzmechanismus (Gen + Alteration) trägt.
- standard: fhir-genomics
  profile_or_url: http://hl7.org/fhir/uv/genomics-reporting/StructureDefinition/therapeutic-implication
  resource: Observation (TherapeuticImplication)
  path: Observation.component:therapeutic-implication.valueCodeableConcept; Observation.component:medication-assessed.valueCodeableConcept;
    Observation.derivedFrom:variant
  notes: 'HL7 Genomics Reporting STU3 (3.0.0). Resistenz als therapeutische Implikation: component:therapeutic-implication
    extensible an genetic-therapeutic-implications-vs (u. a. LOINC LA6676-6 ''Resistant'', LA9660-7 ''Presumed
    resistant''), betroffene Substanz in component:medication-assessed (LOINC 51963-7), derivedFrom (1..*)
    → Variant-Observation.'
instruction_de: 'Hier nur Konzeptebene (Gen + Alterationstyp). Variantenspezifische Angaben strukturiert
  als Komponenten der Variant-Observation erfassen (Gen: LOINC 48018-6 „Gene studied [ID]“; 48004-6 „DNA
  change (c.HGVS)“; 48005-3 „Amino acid change (pHGVS)“), nicht als Freitext. Ergebnis im molekularen
  Tumorboard besprechen.'
care_process:
  trigger: nach ctDNA- oder Re-Biopsie-Test bei Progression
  frequency_pattern: ad-hoc
  responsible_role: Molekularpathologie / Onkologie
evidence:
  guideline_references:
  - source: OCP Lung (AU)
    version: 2nd ed. 2021 (Update 07/2025)
    url: https://www.cancer.org.au/assets/pdf/ocp/lung-cancer-2nd-edition
    section: Step 6.1.1 Recurrent disease (re-biopsy; molecular/immunological biomarker testing; ctDNA)
    recommendation_grade: n/a
    evidence_level: n/a
    quote: Re-biopsy should be considered if feasible. Perform molecular and immunological biomarker testing
      to inform further therapies (or, if available, blood samples for circulating tumour DNA [ctDNA]
      molecular testing).
    accessed: '2026-10-15'
    locator: Step 6.1.1 Recurrent disease
  - source: S3-LL Lungenkarzinom
    version: 5.1 (Juli 2026, AWMF 020-007OL)
    url: https://www.leitlinienprogramm-onkologie.de/leitlinien/lungenkarzinom
    section: 'Kap. 8.6.4.2 (Tab. 36; Hintergrund Resistenzmechanismen EGFR T790M, C797S, MET-/HER2-Amplifikation)
      i. V. m. Kap. 6.6.10 Empf. 6.65/6.66; ALK G1202R: Hintergrund Kap. 8.6.5.3/8.6.5.4'
    recommendation_grade: EK
    evidence_level: n/a
    quote: Beispiele für on-target Mechanismen sind die C797S und die G428S EGFR-Mutation, off-target
      Mechanismen umfassen MET Amplifikationen, HER2 (ERBB2) Amplifikationen, … wiesenen ALK-Resistenzmutation
      (z.B. die Gatekeeper G1202R Mutation in ca. 35%
    accessed: '2026-10-15'
    locator: Kap. 8.6.4.2, Hintergrund nach Tab. 36, S. 357; Kap. 8.6.5.4, S. 369
  - source: Onkopedia NSCLC
    version: Stand April 2025
    url: https://www.onkopedia.com/de/onkopedia/guidelines/lungenkarzinom-nicht-kleinzellig-nsclc
    section: Kap. 6.1.6.2.1.3.1 (Resistenzbiopsie bei Progress unter EGFR-TKI; MET-Amplifikation häufigster
      Mechanismus), 6.1.6.2.1.3.4 (T790M), 6.1.6.2.1.9 (ROS1 G2032R), 5.3.3.2 (Rebiopsie inkl. MET-/HER2-Amplifikation)
    recommendation_grade: n/a
    evidence_level: n/a
    quote: eine MET Amplifikation als häufigster Resistenzmechanismus … Findet sich eine G2032R-Mutation
      im ROS1 Gen … Im Progress unter einer zielgerichteten Therapie sollte die molekulare Analyse der
      Rebiopsie zusätzlich Amplifikationen im MET- und HER2-Gen beinhalten.
    accessed: '2026-10-15'
    locator: Kap. 6.1.6.2.1.3.1; Kap. 6.1.6.2.1.9 ROS1-Translokationen; Kap. 5.3.3.2 Stadium IV
