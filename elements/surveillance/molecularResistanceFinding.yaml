issues:
- 'tumor_entity SCLC prüfen: Resistenztestung und -befund unter TKI betreffen das NSCLC. Die SCLC-Transformation
  EGFR-mutierter NSCLC ist ein histologischer Befund der Gewebe-Rebiopsie und wird leitliniengemäß im
  NSCLC-Kontext behandelt (Onkopedia SCLC Kap. 2.5; S3 5.1 Empf. 8.122 im NSCLC-Kapitel 8.6.4.2).'
- 'Repräsentation Resistenzbefund: Die Variant-Profile (MII variante, genomics-reporting variant) legen
  Observation.code per Pattern auf LOINC 69548-6 fest (im Element vorhanden) und binden valueCodeableConcept
  REQUIRED an LL1971-2 (present/absent/no call). Die übrigen Element-Codes (LOINC 21665-5 EGFR-spezifisch,
  SNOMED 124975008 Somatic mutation, KDL PT130102 Dokumentklasse) taugen dort nicht als Observation.code.
  Der Konzeptwert des Elements (Gen + Alterationstyp, z. B. EGFR T790M) hat im Profil keinen eigenen Werteplatz:
  Gen in component:gene-studied (HGNC), Mutation in den HGVS-Komponenten (wie instruction_de bereits vorsieht),
  Amplifikationen in component:copy-number; die Resistenz selbst als therapeutische Implikation (z. B.
  LA6676-6 Resistant mit medication-assessed, derivedFrom → Variante). Zu entscheiden: ob das Element
  auf Konzeptebene bleibt und diese Zerlegung nur als Mapping dokumentiert wird oder ob ein Antwort-Value-Set
  für Resistenzmechanismen aufgenommen wird, und wie die achsengemischten Codings (Test-, Befund-, Dokumentklassen-Code)
  bereinigt werden. Für oBDS ist festzulegen, wie Gen und Mutation in der Freitext-Bezeichnung (23.1)
  notiert werden.'
