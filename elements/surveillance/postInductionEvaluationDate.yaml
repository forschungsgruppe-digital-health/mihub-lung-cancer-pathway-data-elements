id: mihub.lung.surveillance.postInductionEvaluationDate.v0.1
uuid: 6bf9c8ee-f77b-5052-b7dd-5484bec67f48
name: postInductionEvaluationDate
label_de: Basisevaluation nach Abschluss der Induktionsbehandlung
definition_de: Datum der Evaluation von Ansprechen, Nebenwirkungen und Beschwerdebild einen Monat nach
  Abschluss der (Induktions-)Behandlung im Stadium IVA/B — mit Anamnese, körperlicher Untersuchung und
  CT Thorax/Abdomen/Becken (MRT Schädel bei Verdacht).
phase: surveillance
tumor_entity:
- NSCLC
- SCLC
category: kontakt-visite
datatype: dateTime
cardinality: 0..1
value_set:
  binding_strength: extensible
  standard_binding_status: mapped
  codings:
  - system: snomed-ct
    code: '390906007'
    display: Follow-up encounter
standard_mappings:
- standard: fhir-mii-kds
  profile_or_url: https://www.medizininformatik-initiative.de/fhir/core/modul-fall/StructureDefinition/KontaktGesundheitseinrichtung
  resource: Encounter
  path: Encounter.period.start
care_process:
  trigger: 1 Monat nach Abschluss der Induktionsbehandlung unter Systemtherapie im Stadium IV (S3 Empf.
    16.9; NSCLC und SCLC) – abzugrenzen von der Zwischen-Verlaufskontrolle während der Induktion (NSCLC
    nach 2, spätestens 3 Zyklen – S3 Empf. 8.84/8.100; SCLC nach frühestens 2, i. d. R. 3–4 Zyklen – Onkopedia
    SCLC Kap. 6.1.1.4.1.7), die über restagingImagingDate/recistResponse erfasst wird
  frequency_pattern: once-per-line
  responsible_role: Onkolog:in
evidence:
  guideline_references:
  - source: S3-LL Lungenkarzinom
    version: 5.1 (Juli 2026, AWMF 020-007OL)
    url: https://www.leitlinienprogramm-onkologie.de/leitlinien/lungenkarzinom
    section: Empf. 16.9 (EK, geprüft 2026)
    recommendation_grade: EK
    evidence_level: n/a
    quote: Unter einer Systemtherapie im Stadium IVA/B sollten Ansprechen, … Beschwerdebild einen Monat
      nach Abschluss der Behandlung durch das den Patienten betreuende Team evaluiert werden. Als Basis
      sind dabei Anamnese, körperliche Untersuchung, CT-Thorax/Abdomen/Becken
    accessed: '2026-10-15'
    locator: Kap. 16.4, Empf. 16.9 (EK, geprüft 2026, Starker Konsens), S. 499
  - source: Onkopedia SCLC
    version: Stand August 2026
    url: https://www.onkopedia.com/de/onkopedia/guidelines/lungenkarzinom-kleinzellig-sclc
    section: Kap. 6.1.1.4.1.7 (Ansprechensbeurteilung nach 2–4 Zyklen Chemo-Immuntherapie)
    recommendation_grade: n/a
    evidence_level: n/a
    quote: Das Ansprechen auf die Chemo- und Immuntherapie kann nach frühestens 2 Therapiezyklen, in der
      Regel nach 3 bis 4 Zyklen, beurteilt werden.
    accessed: '2026-10-15'
    locator: Kap. 6.1.1.4.1.7 Durchführung der Therapie und Therapiedauer
