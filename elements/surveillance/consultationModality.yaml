issues:
- 'Evidenzkontext kennzeichnen: Greer et al. 2024 (Onkopedia NSCLC Lit. [46]) verglich laut Titel Telehealth
  und Präsenz in der frühen palliativmedizinischen Mitbetreuung bei fortgeschrittenem Lungenkarzinom.
  Die Übertragung auf onkologische Verlaufskontrollen unter Systemtherapie ist eine Extrapolation (Studiendetails
  lokal nicht geprüft, UNSICHER).'
