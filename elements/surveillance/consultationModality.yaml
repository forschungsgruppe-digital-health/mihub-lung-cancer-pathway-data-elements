id: mihub.lung.surveillance.consultationModality.v0.1
uuid: a431278a-a6cf-560c-833d-f5a6054f5544
name: consultationModality
label_de: Kontaktform der Verlaufskontrolle (Präsenz / Video / Telefon)
definition_de: 'Form des Patientenkontakts einer Verlaufskontrolle unter bzw. nach Systemtherapie. Onkopedia:
  Patientenzufriedenheit von Video-Sprechstunden bei fortgeschrittenem NSCLC der persönlichen Sprechstunde
  nicht unterlegen (Greer et al., JAMA 2024).'
phase: surveillance
tumor_entity:
- NSCLC
- SCLC
category: kontakt-visite
datatype: code
cardinality: 0..1
value_set:
  binding_strength: required
  standard_binding_status: mapped
  codings:
  - system: snomed-ct
    code: '1269515004'
    display: Face to face consultation with patient
  - system: snomed-ct
    code: '719410009'
    display: Consultation via video conference
  - system: snomed-ct
    code: '386472008'
    display: Telephone consultation
standard_mappings:
- standard: fhir-mii-kds
  profile_or_url: https://www.medizininformatik-initiative.de/fhir/core/modul-fall/StructureDefinition/KontaktGesundheitseinrichtung
  resource: Encounter
  path: Encounter.type
  notes: MII KDS Modul Fall (seit 2026 im Paket de.medizininformatikinitiative.kerndatensatz.base, 2026.0.1);
    derselbe Encounter wie surveillanceVisit. Die Kontaktform als zusätzliches Encounter.type-CodeableConcept
    mit dem SNOMED-Code des Elements; das Slicing von Encounter.type ist offen, die Slices Kontaktebene
    und KontaktArt bleiben unberührt. Encounter.class (1..1) ist REQUIRED an http://fhir.de/ValueSet/EncounterClassDE
    gebunden (HL7 v3 ActCode, z. B. AMB) und nimmt die SNOMED-Codes nicht auf.
- standard: fhir-r4-base
  resource: Encounter
  path: Encounter.class / Encounter.type
constraints_de: 'Videosprechstunden können als digitale Kontaktform ergänzend zur Präsenz-Verlaufskontrolle
  erwogen werden (S3-LL Lungenkarzinom 5.1, Kap. 7.2, Hintergrundtext: digitale Anwendungen „können erwogen
  werden, um die Versorgung zu ergänzen“). Die Übermittlung schwerwiegender Diagnosen sollte grundsätzlich
  im persönlichen Kontakt erfolgen; eine telefonische oder digitale Mitteilung ist zu vermeiden (ebd.).'
care_process:
  trigger: bei jedem Kontakt der Verlaufskontrolle (surveillanceVisit)
  frequency_pattern: per-encounter
  responsible_role: Onkolog:in
evidence:
  guideline_references:
  - source: Onkopedia NSCLC
    version: Stand April 2025
    url: https://www.onkopedia.com/de/onkopedia/guidelines/lungenkarzinom-nicht-kleinzellig-nsclc
    section: Kap. 8.2 (Video-Sprechstunden bei fortgeschrittenem NSCLC; Greer JA et al., JAMA 332:1153,
      2024)
    recommendation_grade: n/a
    evidence_level: n/a
  - source: S3-LL Lungenkarzinom
    version: 5.1 (Juli 2026, AWMF 020-007OL)
    url: https://www.leitlinienprogramm-onkologie.de/leitlinien/lungenkarzinom
    section: Kap. 7.2 Patientenzentrierte Kommunikation, Hintergrundtext (Videosprechstunden/DiGA ergänzend;
      schwerwiegende Diagnosen grundsätzlich im persönlichen Kontakt)
    recommendation_grade: n/a
    evidence_level: n/a
