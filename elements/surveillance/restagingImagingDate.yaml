name: restagingImagingDate
label_de: Restaging-Bildgebung Datum
definition_de: Datum des CT Thorax/Abdomen/Becken zur Verlaufskontrolle unter laufender Systemtherapie
  und in der therapiefreien Beobachtung nach Erstlinientherapie; Körperregionen über die OPS-/SNOMED-Codings
  differenzierbar.
phase: surveillance
tumor_entity:
- NSCLC
- SCLC
category: bildgebung
datatype: dateTime
cardinality: 0..*
value_set:
  binding_strength: preferred
  standard_binding_status: mapped
  codings:
  - system: snomed-ct
    code: '169069000'
    display: CT of chest
  - system: snomed-ct
    code: '169070004'
    display: CT of abdomen
  - system: snomed-ct
    code: '169071000'
    display: CT of pelvis
  - system: ops
    code: 3-222
    display: Computertomographie des Thorax mit Kontrastmittel
  - system: ops
    code: 3-225
    display: Computertomographie des Abdomens mit Kontrastmittel
  - system: ops
    code: 3-226
    display: Computertomographie des Beckens mit Kontrastmittel
  - system: kdl
    code: DG020103
    display: CT-Befund
care_process:
  trigger: 'NSCLC: erste radiologische Verlaufskontrolle unter Erstlinientherapie nach 2 Zyklen (6 Wochen),
    spätestens nach 3 Zyklen (9 Wochen) (S3 Empf. 8.84/8.100); SCLC: Ansprechensbeurteilung nach frühestens
    2, i. d. R. 3–4 Induktionszyklen (Onkopedia SCLC Kap. 6.1.1.4.1.7); Basisevaluation 1 Monat nach Abschluss
    der Induktionsbehandlung (S3 Empf. 16.9); danach unter laufender System-/Erhaltungstherapie alle 6–9
    Wochen (S3 Empf. 16.9, Kap. 16.4 – NSCLC und SCLC); NSCLC in der therapiefreien Beobachtung nach Erstlinientherapie
    alle 6–8 Wochen (Onkopedia NSCLC Kap. 8.2, 6.1.6.2.2.1.2.1)'
  frequency_pattern: 'NSCLC-Erstlinie: erste Kontrolle nach 2, spätestens 3 Zyklen (6–9 W; S3 Empf. 8.84/8.100)
    · Q6-9W unter laufender System-/Erhaltungstherapie, NSCLC und SCLC (S3 Empf. 16.9, Kap. 16.4) · Q6-8W
    in der therapiefreien Beobachtung nach Erstlinientherapie, NSCLC (Onkopedia NSCLC Kap. 8.2) · SCLC-Induktion:
    Ansprechensbeurteilung nach frühestens 2, i. d. R. 3–4 Zyklen (Onkopedia SCLC Kap. 6.1.1.4.1.7)'
  responsible_role: Radiologie
evidence:
  guideline_references:
  - source: S3-LL Lungenkarzinom
    version: 5.1 (Juli 2026, AWMF 020-007OL)
    url: https://www.leitlinienprogramm-onkologie.de/leitlinien/lungenkarzinom
    section: Empf. 16.9 (EK, geprüft 2026); Kap. 16.4 (CT Thorax und CT Abdomen/Becken alle 6–9 Wochen
      in Studien)
    recommendation_grade: EK
    evidence_level: n/a
    quote: Als Basis sind dabei Anamnese, körperliche Untersuchung, CT-Thorax/Abdomen/Becken … Bei Patienten
      unter laufender Systemtherapie sind CT Kontrollen im Verlaufsintervall von 6 bis 9 Wochen sinnvoll.
    accessed: '2026-10-15'
    locator: Kap. 16.4, Empf. 16.9 (EK, geprüft 2026), S. 499
  - source: Onkopedia NSCLC
    version: Stand April 2025
    url: https://www.onkopedia.com/de/onkopedia/guidelines/lungenkarzinom-nicht-kleinzellig-nsclc
    section: 'Kap. 8.2 (6–8-wöchige Intervalle nach Erstlinientherapie); Kap. 6.1.6.2 / Tab. 2 (symptom-
      und therapieorientierte Diagnostik: CT Thorax/Oberbauch mit KM oder FDG-PET-CT)'
    recommendation_grade: n/a
    evidence_level: n/a
    quote: Die S3 Leitlinie empfiehlt im Expertenkonsens die Verkürzung der dreimonatigen auf kürzere,
      6-8wöchige Intervalle [117].
    accessed: '2026-10-15'
    locator: Kap. 8.2 Nicht-kurativ intendierte Therapie
  - source: Onkopedia SCLC
    version: Stand August 2026
    url: https://www.onkopedia.com/de/onkopedia/guidelines/lungenkarzinom-kleinzellig-sclc
    section: Kap. 6.1.1.4.1.7 (Ansprechensbeurteilung nach 2–4 Zyklen); Modalität/Intervall unter Erhaltung
      nicht spezifiziert
    recommendation_grade: n/a
    evidence_level: n/a
    quote: Das Ansprechen auf die Chemo- und Immuntherapie kann nach frühestens 2 Therapiezyklen, in der
      Regel nach 3 bis 4 Zyklen, beurteilt werden.
    accessed: '2026-10-15'
    locator: Kap. 6.1.1.4.1.7 Durchführung der Therapie und Therapiedauer
  - source: S3-LL Lungenkarzinom
    version: 5.1 (Juli 2026, AWMF 020-007OL)
    url: https://www.leitlinienprogramm-onkologie.de/leitlinien/lungenkarzinom
    section: 'Kap. 8.6.2.1 Empf. 8.84 / Kap. 8.6.3.1 Empf. 8.100 (EK, Starker Konsens, geprüft 2026):
      radiologische Verlaufskontrolle beim NSCLC Stadium IV nach 2 Zyklen (6 Wochen), spätestens nach
      3 Zyklen (9 Wochen)'
    recommendation_grade: EK
    evidence_level: n/a
    quote: In aller Regel sollte bei NSCLC im Stadium IV nach 2 Zyklen Therapie (6 Wochen), … spätestens
      aber nach 3 Zyklen (9 Wochen) eine radiologische Verlaufskontrolle erfolgen.
    accessed: '2026-10-15'
    locator: Kap. 8.6.2.1 Empf. 8.84 (S. 293) / Kap. 8.6.3.1 Empf. 8.100 (S. 313); EK, Starker Konsens,
      geprüft 2026
