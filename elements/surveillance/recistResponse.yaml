issues:
- 'Wertebereich vs. Definition klären: recistResponse ist als RECIST-1.1-Kategorie definiert (CR/PR/SD/PD/NE),
  required gebunden ist aber der Wertebereich des mCODE-ValueSets ConditionStatusTrend (bewusste Umstellung,
  audit-log §13). Dessen SNOMED-Konzepte sind Patientenzustands-Befunde (268910001, 359746009, 271299001,
  709137006; Parent 418138009 ''Patient condition finding'') bzw. ein Qualifier (260415000 ''Not detected'',
  Parent 272519000 ''Absence findings''), keine Ansprechkategorien; RECIST-Schwellenwerte sind nicht abgebildet.
  In mCODE STU4 (4.0.0) enthält ConditionStatusTrendVS nur die vier Zustands-Befunde (nicht 260415000)
  und ist an CancerDiseaseStatus nur ''preferred'' gebunden. Vier der fünf SNOMED-Codes führt auch das
  generalisierende Element currentTumorStatus; die Abgrenzung beider Elemente ist offen. KDL SD150103
  ''Tumorkonferenzprotokoll'' ist eine Dokumentklasse und gehört nicht in das Antwortset. Die Leitlinien
  geben für die Routine kein Bewertungsschema vor (S3-LL Lungenkarzinom 5.1, Empf. 16.9: Ansprechen wird
  „evaluiert“; Onkopedia NSCLC/SCLC erwähnen RECIST nicht). Zu entscheiden: (a) Element als klinische
  Ansprechens-/Tumorstatus-Beurteilung (ggf. nach RECIST 1.1) umdefinieren und den mCODE-Wertebereich
  beibehalten oder (b) an einen Standard-Kategoriensatz binden – LOINC 88040-1 ''Response to cancer treatment''
  mit Antwortliste LL4721-8 (LA28366-5 Complete response, LA28369-9 Partial response, LA28371-5 Stable
  disease, LA28370-7 Progressive disease, LA9348-9 Not assessed ≈ NE, nicht deckungsgleich) oder das MII-KDS-Onkologie-CodeSystem
  mii-cs-onko-verlauf-gesamtbeurteilung (V Vollremission/CR, T Teilremission/PR, K keine Änderung/SD,
  P Progression, U Beurteilung unmöglich u. a.; entspricht dem oBDS-Mapping) –, mit mCODE/SNOMED (z. B.
  399056007 Complete therapeutic response, 399204005 Partial therapeutic response, 399178002 Static therapeutic
  response, 1371415000 Malignant neoplastic disease progression) als Abbildung; ein projekt-lokales CodeSystem
  ist damit entbehrlich. Bindungsstärke (bisher required) und Datentyp (bisher code) mit entscheiden.'
