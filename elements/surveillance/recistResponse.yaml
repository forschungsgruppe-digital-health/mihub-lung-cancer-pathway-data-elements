    2, i. d. R. nach 3–4 Zyklen Chemo-Immuntherapie'
  frequency_pattern: Q6-9W (S3) · Q6-8W (Onkopedia NSCLC) · per-cycle (SCLC, nach 2–4 Zyklen)
  responsible_role: Onkologe / Radiologie
