    (S3 Empf. 16.9) bzw. alle 6–8 Wochen in der therapiefreien Beobachtung nach Erstlinientherapie (Onkopedia
    NSCLC Kap. 8.2); SCLC nach frühestens 2, i. d. R. 3–4 Zyklen Chemo-Immuntherapie (Onkopedia SCLC Kap.
    6.1.1.4.1.7), danach alle 6–9 Wochen unter laufender Immunerhaltung (S3 Empf. 16.9, Kap. 16.4)'
  frequency_pattern: 'per-imaging-event (gekoppelt an restagingImagingDate): NSCLC-Erstlinie erstmals
