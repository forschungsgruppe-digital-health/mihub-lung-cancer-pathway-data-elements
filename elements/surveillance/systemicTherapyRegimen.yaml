name: systemicTherapyRegimen
label_de: Aktuelles Systemtherapie-Regime
definition_de: Codiertes aktuelles tumorspezifisches Systemtherapie-Regime (Chemotherapie, zielgerichtete
  Therapie, Immuntherapie inkl. Checkpoint-Inhibitoren und bispezifischer T-Zell-Engager wie Tarlatamab,
  Kombinationen) einschließlich Erhaltungs- und Konsolidierungstherapie.
phase: surveillance
tumor_entity:
- NSCLC
- SCLC
category: medikation
datatype: CodeableConcept
cardinality: 0..*
value_set:
  binding_strength: extensible
  codings:
  - system: atc
    code: L01FF02
    display: Pembrolizumab
  - system: atc
    code: L01FF05
    display: Atezolizumab
  - system: atc
    code: L01FF03
    display: Durvalumab
  - system: atc
    code: L01EB03
    display: Afatinib
  - system: atc
    code: L01EB04
    display: Osimertinib
  - system: atc
    code: L01ED03
    display: Alectinib
  - system: atc
    code: L01CD01
    display: Paclitaxel
  - system: atc
    code: L01XA02
    display: Carboplatin
  - system: atc
    code: L01CB01
    display: Etoposid
  - system: atc
    code: L01FX33
    display: Tarlatamab
  standard_binding_status: mapped
  notes: Die gelisteten ATC-Codes (BfArM ATC) sind Beispiele; vorgesehen sind Wirkstoffe der ATC-Gruppe
    L01 „Antineoplastische Mittel“. Ein Kombinationsregime wird als mehrere Werte dieses Elements abgebildet
    (Kardinalität 0..*; je Wirkstoff ein CodeableConcept mit einem ATC-Coding bzw. eine MedicationStatement),
    nicht als mehrere Codings innerhalb eines CodeableConcept (diese gelten in FHIR als alternative Codierungen
    desselben Konzepts). Der Protokollname kann ergänzend als Text erfasst werden.
standard_mappings:
- standard: fhir-mii-kds
  profile_or_url: https://www.medizininformatik-initiative.de/fhir/ext/modul-onko/StructureDefinition/mii-pr-onko-systemische-therapie-medikation
  resource: MedicationStatement
  path: MedicationStatement.medicationCodeableConcept
  notes: MII KDS Onkologie 2026.0.3 (MII_PR_Onko_Systemische_Therapie_Medikation, abgeleitet von https://www.medizininformatik-initiative.de/fhir/core/modul-medikation/StructureDefinition/MedicationStatement).
    Je Substanz ein MedicationStatement; ATC in medicationCodeableConcept.coding:atcClassDe (http://fhir.de/CodeSystem/bfarm/atc,
    REQUIRED mii-vs-medikation-atc) bzw. :atcClassEn (http://www.whocc.no/atc). MedicationStatement.partOf
    (1..*, Slice systemischeTherapie) verweist auf das Regime als Procedure mii-pr-onko-systemische-therapie.
- standard: fhir-mii-kds
  profile_or_url: https://www.medizininformatik-initiative.de/fhir/ext/modul-onko/StructureDefinition/mii-pr-onko-systemische-therapie
  resource: Procedure
  path: 'Procedure (Regime als Ganzes); Procedure.usedCode (Protokoll); Kontext: Procedure.extension:Intention
    (1..1), Procedure.performedPeriod.start (1..1), Procedure.code.coding:systemische_therapie_art (MS)'
  notes: 'MII KDS Onkologie 2026.0.3 (MII_PR_Onko_Systemische_Therapie, abgeleitet von MII Prozedur).
    Das Regime als Ganzes ist eine Procedure. Procedure.usedCode (0..*, MS) ist extensible an mii-vs-onko-systemische-therapie-protokolle
    gebunden (z. B. PE, CarboTax, Gem-Cis) und entspricht dem Regime-/Protokollnamen, den das Element
    bisher nur als Freitext vorsieht. Pflichtangaben des Profils, die das Element nicht trägt (siehe Issue):
    Procedure.extension:Intention (1..1, REQUIRED mii-vs-onko-systemische-therapie-intention: K/P/S/X)
    und performedPeriod.start (1..1). Die Therapieart steht in Procedure.code.coding:systemische_therapie_art
    (0..1, MS, REQUIRED mii-vs-onko-systemische-therapie-art, u. a. CH Chemotherapie, IM Immun-/Antikörpertherapie,
    ZS zielgerichtete Substanzen, CI Chemo- + Immun-/Antikörpertherapie, CZ, CIZ, IZ). Die Substanzen
    (ATC) hängen als MedicationStatement (mii-pr-onko-systemische-therapie-medikation) über partOf an
    dieser Procedure.'
