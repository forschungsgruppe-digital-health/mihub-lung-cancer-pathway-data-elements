id: mihub.lung.surveillance.systemicTherapyRegimen.v0.1
uuid: 948cb11a-1e41-550d-bc52-0b2fd3c348b0
name: systemicTherapyRegimen
label_de: Aktuelles Systemtherapie-Regime
definition_de: Codiertes aktuelles tumorspezifisches Systemtherapie-Regime (Chemotherapie, zielgerichtete
  Therapie, Immuntherapie inkl. Checkpoint-Inhibitoren und bispezifischer T-Zell-Engager wie Tarlatamab,
  Kombinationen) einschließlich Erhaltungs- und Konsolidierungstherapie.
phase: surveillance
tumor_entity:
- NSCLC
- SCLC
category: medikation
datatype: CodeableConcept
cardinality: 0..*
value_set:
  binding_strength: extensible
  codings:
  - system: atc
    code: L01FF02
    display: Pembrolizumab
  - system: atc
    code: L01FF05
    display: Atezolizumab
  - system: atc
    code: L01FF03
    display: Durvalumab
  - system: atc
    code: L01EB03
    display: Afatinib
  - system: atc
    code: L01EB04
    display: Osimertinib
  - system: atc
    code: L01ED03
    display: Alectinib
  - system: atc
    code: L01CD01
    display: Paclitaxel
  - system: atc
    code: L01XA02
    display: Carboplatin
  - system: atc
    code: L01CB01
    display: Etoposid
  - system: atc
    code: L01FX33
    display: Tarlatamab
  standard_binding_status: mapped
  notes: Die gelisteten ATC-Codes (BfArM ATC) sind Beispiele; vorgesehen sind Wirkstoffe der ATC-Gruppe
    L01 „Antineoplastische Mittel“. Ein Kombinationsregime wird als mehrere Werte dieses Elements abgebildet
    (Kardinalität 0..*; je Wirkstoff ein CodeableConcept mit einem ATC-Coding bzw. eine MedicationStatement),
    nicht als mehrere Codings innerhalb eines CodeableConcept (diese gelten in FHIR als alternative Codierungen
    desselben Konzepts). Der Protokollname kann ergänzend als Text erfasst werden.
standard_mappings:
- standard: fhir-mii-kds
  profile_or_url: https://www.medizininformatik-initiative.de/fhir/ext/modul-onko/StructureDefinition/mii-pr-onko-systemische-therapie-medikation
  resource: MedicationStatement
  path: MedicationStatement.medicationCodeableConcept
  notes: MII KDS Onkologie 2026.0.3 (MII_PR_Onko_Systemische_Therapie_Medikation, abgeleitet von https://www.medizininformatik-initiative.de/fhir/core/modul-medikation/StructureDefinition/MedicationStatement).
    Je Substanz ein MedicationStatement; ATC in medicationCodeableConcept.coding:atcClassDe (http://fhir.de/CodeSystem/bfarm/atc,
    REQUIRED mii-vs-medikation-atc) bzw. :atcClassEn (http://www.whocc.no/atc). MedicationStatement.partOf
    (1..*, Slice systemischeTherapie) verweist auf das Regime als Procedure mii-pr-onko-systemische-therapie.
- standard: fhir-mii-kds
  profile_or_url: https://www.medizininformatik-initiative.de/fhir/ext/modul-onko/StructureDefinition/mii-pr-onko-systemische-therapie
  resource: Procedure
  path: 'Procedure (Regime als Ganzes); Procedure.usedCode (Protokoll); Kontext: Procedure.extension:Intention
    (1..1), Procedure.performedPeriod.start (1..1), Procedure.code.coding:systemische_therapie_art (MS)'
  notes: 'MII KDS Onkologie 2026.0.3 (MII_PR_Onko_Systemische_Therapie, abgeleitet von MII Prozedur).
    Das Regime als Ganzes ist eine Procedure. Procedure.usedCode (0..*, MS) ist extensible an mii-vs-onko-systemische-therapie-protokolle
    gebunden (z. B. PE, CarboTax, Gem-Cis) und entspricht dem Regime-/Protokollnamen, den das Element
    bisher nur als Freitext vorsieht. Pflichtangaben des Profils, die das Element nicht trägt (siehe Issue):
    Procedure.extension:Intention (1..1, REQUIRED mii-vs-onko-systemische-therapie-intention: K/P/S/X)
    und performedPeriod.start (1..1). Die Therapieart steht in Procedure.code.coding:systemische_therapie_art
    (0..1, MS, REQUIRED mii-vs-onko-systemische-therapie-art, u. a. CH Chemotherapie, IM Immun-/Antikörpertherapie,
    ZS zielgerichtete Substanzen, CI Chemo- + Immun-/Antikörpertherapie, CZ, CIZ, IZ). Die Substanzen
    (ATC) hängen als MedicationStatement (mii-pr-onko-systemische-therapie-medikation) über partOf an
    dieser Procedure.'
care_process:
  trigger: Therapieinitiierung / Linienwechsel
  frequency_pattern: per-line
  responsible_role: Onkologe
evidence:
  guideline_references:
  - source: S3-LL Lungenkarzinom
    version: 5.1 (Juli 2026, AWMF 020-007OL)
    url: https://www.leitlinienprogramm-onkologie.de/leitlinien/lungenkarzinom
    section: Kap. 16.4 / Empf. 16.9
    recommendation_grade: EK
    evidence_level: n/a
    quote: So ist die Standardtherapie für diese Patienten mittlerweile die primäre Induktionschemotherapie
      mit Chemoimmuntherapie für 4-5 Chemotherapiekurse und danach die Erhaltungstherapie mit entweder
      Chemoimmunerhaltung (Non-squamous NSCLC) oder alleiniger Immunerhaltungstherapie (Sqamous NSCLC,
      SCLC).
    accessed: '2026-10-15'
    locator: Kap. 16.4 Verlaufsuntersuchungen/Follow-up unter laufender Systemtherapie, S. 498
  - source: Onkopedia NSCLC
    version: Stand April 2025
    url: https://www.onkopedia.com/de/onkopedia/guidelines/lungenkarzinom-nicht-kleinzellig-nsclc
    section: Kap. 6 Therapie
    recommendation_grade: n/a
    evidence_level: n/a
    quote: Die aktuellen Empfehlungen basieren auf prädiktiven histologischen, immunhistochemischen und
      genetischen Markern.
    accessed: '2026-10-15'
    locator: Kap. 6.1.6.2 Stadium IVB mit multiplen Metastasen (innerhalb Kap. 6 Therapie)
  - source: Onkopedia SCLC
    version: Stand August 2026
    url: https://www.onkopedia.com/de/onkopedia/guidelines/lungenkarzinom-kleinzellig-sclc
    section: Kap. 6.1.1.4.1.6 (Immun-Erhaltung ≥ 2 Jahre oder bis Progress); Kap. 6.1.1.2.1 (Durvalumab-Konsolidierung
      LD, 2 Jahre)
    recommendation_grade: n/a
    evidence_level: n/a
    quote: Nach kombinierter Chemo-Immuntherapie sollte die Immuntherapie als Erhaltung gemäß Zulassung
      für mindestens 2 Jahre oder bis zum Progress weitergeführt werden.
    accessed: '2026-10-15'
    locator: Kap. 6.1.1.4.1.6 Erhaltungstherapie
  - source: S3-LL Lungenkarzinom
    version: 5.1 (Juli 2026, AWMF 020-007OL)
    url: https://www.leitlinienprogramm-onkologie.de/leitlinien/lungenkarzinom
    section: 'Kap. 9.6.1 Empf. 9.19 (SCLC Stadium IV: Chemo-Immuntherapie Platin/Etoposid + PD-L1-/PD-1-Antikörper;
      modifiziert 2026)'
    recommendation_grade: A
    evidence_level: ⊕⊕⊕⊕
    quote: Patienten mit fernmetastasiertem kleinzelligen Lungenkarzinom soll, sofern keine … Kontraindikationen
      bestehen, primär eine Chemo-Immuntherapie mit Platin/Etoposid und einem PD-L1-Antikörper (Atezolizumab
      oder Durvalumab) oder PD-1 Antikörper (Serplulimab oder Tislelizumab) angeboten werden.
    accessed: '2026-10-15'
    locator: Kap. 9.6.1 Empf. 9.19 (Empfehlungsgrad A, Evidenzlevel ⊕⊕⊕⊕, Starker Konsens, modifiziert
      2026), S. 430
  - source: S3-LL Lungenkarzinom
    version: 5.1 (Juli 2026, AWMF 020-007OL)
    url: https://www.leitlinienprogramm-onkologie.de/leitlinien/lungenkarzinom
    section: Kap. 9.6.2 Empf. 9.23 (Tarlatamab als systemische Zweitlinientherapie des SCLC; neu 2026)
    recommendation_grade: B
    evidence_level: ⊕⊕⊕⊕
    quote: Als systemische Zweitlinientherapie des SCLC sollte die Gabe von Tarlatamab angeboten werden.
    accessed: '2026-10-15'
    locator: Kap. 9.6.2 Rezidivtherapie, Empf. 9.23 (Empfehlungsgrad B, Evidenzlevel ⊕⊕⊕⊕, Konsens, neu
      2026), S. 437
