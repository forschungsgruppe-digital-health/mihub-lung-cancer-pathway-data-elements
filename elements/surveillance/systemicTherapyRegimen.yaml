issues:
- 'Repräsentation Regime: Im MII-Onko-Modell ist das Regime eine Procedure (mii-pr-onko-systemische-therapie)
  mit Therapieart (code.coding:systemische_therapie_art, MS, REQUIRED mii-vs-onko-systemische-therapie-art,
  z. B. CH, IM, ZS, CI, CZ, CIZ, IZ), Pflicht-Intention (extension:Intention 1..1, K/P/S/X), Beginn (performedPeriod.start
  1..1) und optional kodiertem Protokoll (usedCode, extensible mii-vs-onko-systemische-therapie-protokolle).
  Die Substanzen sind einzelne MedicationStatements (mii-pr-onko-systemische-therapie-medikation), die
  über partOf (1..*) auf diese Procedure verweisen. Das Element enthält nur ATC-Substanzcodes; den Protokollnamen
  sieht es nur als Freitext vor (value_set.notes). oBDS trennt ebenso Therapieart (16.3), Protokoll (16.4,
  Freitext) und Substanz (16.6, ATC oder Bezeichnung). Zu entscheiden: ob Therapieart und Protokoll als
  eigene Kodierung im Element (oder in eigenen Elementen) geführt bzw. aus den ATC-Codes abgeleitet werden,
  und ob die Intention über das Element treatmentIntent (Phase primarycare) verknüpft wird.'
