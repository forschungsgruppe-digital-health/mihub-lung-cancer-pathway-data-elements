issues:
- 'tumor_entity SCLC prüfen: Molekulares Retesting bei Progression unter zielgerichteter Therapie betrifft
  das NSCLC (EGFR/ALK/ROS1/RET). Die SCLC-Transformation EGFR-mutierter NSCLC wird leitliniengemäß im
  NSCLC-Kontext behandelt (Onkopedia SCLC Kap. 2.5).'
