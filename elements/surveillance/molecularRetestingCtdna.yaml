id: mihub.lung.surveillance.molecularRetestingCtdna.v0.1
uuid: 4563f447-9bd5-531d-a0e5-dd88e2d1f2b5
name: molecularRetestingCtdna
label_de: Molekulares Retesting (ctDNA / Re-Biopsie)
definition_de: Erneute molekulare Charakterisierung (Liquid-Biopsy ctDNA oder Re-Biopsie) bei Progression
  unter zielgerichteter Therapie zur Identifikation von Resistenzmechanismen.
phase: surveillance
tumor_entity:
- NSCLC
- SCLC
category: laborbefund
datatype: CodeableConcept
cardinality: 0..*
value_set:
  binding_strength: extensible
  standard_binding_status: mapped
  codings:
  - system: loinc
    code: 107453-3
    display: Circulating tumor DNA [Interpretation] Narrative
  - system: snomed-ct
    code: '405825005'
    display: Molecular genetic test
  - system: kdl
    code: PT130102
    display: Molekularpathologiebefund
instruction_de: Gewebe-Rebiopsie einer progredienten Manifestation bevorzugen (höhere Sensitivität; erfasst
  auch eine SCLC-Transformation). Liquid Biopsy (NGS-Panel an ctDNA) ergänzend bei negativer oder klinisch
  nicht vertretbarer Biopsie bzw. als Alternative; bei negativer Liquid Biopsy Gewebeentnahme anstreben.
  Umfassendes Panel (Mutationen, Amplifikationen inkl. MET/HER2, Fusionen).
care_process:
  trigger: bei akquirierter Resistenz/Progression unter zielgerichteter Therapie (insbesondere EGFR-,
    ALK-, ROS1-, RET-TKI), vor Wechsel der Systemtherapie; Zeitpunkt eher klinisch als nach RECIST
  frequency_pattern: ad-hoc
  responsible_role: Onkologe / Pathologie / Molekularpathologie
evidence:
  guideline_references:
  - source: OCP Lung (AU)
    version: 2nd ed. 2021 (Update 07/2025)
    url: https://www.cancer.org.au/assets/pdf/ocp/lung-cancer-2nd-edition
    section: Step 6.1.1 Recurrent disease (re-biopsy; molecular/immunological biomarker testing; ctDNA)
    recommendation_grade: n/a
    evidence_level: n/a
    quote: Re-biopsy should be considered if feasible. Perform molecular and immunological biomarker testing
      to inform further therapies (or, if available, blood samples for circulating tumour DNA [ctDNA]
      molecular testing).
    accessed: '2026-10-15'
    locator: Step 6.1.1 Recurrent disease
  - source: S3-LL Lungenkarzinom
    version: 5.1 (Juli 2026, AWMF 020-007OL)
    url: https://www.leitlinienprogramm-onkologie.de/leitlinien/lungenkarzinom
    section: Kap. 6.6.10 Empf. 6.65 und 6.66 (geprüft 2026); vgl. Tab. 36 (Kap. 8.6.4.2), Empf. 8.127
      (ALK) und 8.136 (ROS1)
    recommendation_grade: EK
    evidence_level: n/a
    quote: Bei akquirierter TKI-Resistenz und negativer Biopsie oder klinisch nicht vertretbarer Biopsie
      in Bezug auf den Resistenzmechanismus sollte ergänzend eine Liquid Biopsy zur Bestimmung von Resistenzmechanismen
      durchgeführt werden.
    accessed: '2026-10-15'
    locator: Kap. 6.6.10, Empf. 6.66 (EK, geprüft 2026, Konsens), S. 177; ebenso Tab. 36, S. 356
  - source: Onkopedia NSCLC
    version: Stand April 2025
    url: https://www.onkopedia.com/de/onkopedia/guidelines/lungenkarzinom-nicht-kleinzellig-nsclc
    section: 'Kap. 6.1.6.2.1.3.1 (Progress unter EGFR-TKI: Gewebe-Rebiopsie bzw. Liquid Biopsy, Paneldiagnostik),
      6.1.6.2.1.3.4 (T790M: Rebiopsie oder Liquid Biopsy; bei negativer Liquid Biopsy Gewebe), 6.1.6.2.1.1
      (ALK)'
    recommendation_grade: n/a
    evidence_level: n/a
    quote: Bei Progress unter TKI und Verdacht auf Resistenz sollte der Resistenzmechanismus durch eine
      Gewebe-Rebiopsie bzw. durch eine Liquid Biopsy umfassend, z. B. mittels Paneldiagnostik, untersucht
      werden … Bei negativer Liquid Biopsy sollte eine Gewebeentnahme erfolgen.
    accessed: '2026-10-15'
    locator: Kap. 6.1.6.2.1.3.1; Kap. 6.1.6.2.1.3.4 T790M Mutation (UC II)
