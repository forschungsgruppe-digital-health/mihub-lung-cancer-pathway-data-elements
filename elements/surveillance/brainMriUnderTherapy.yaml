issues:
- 'SNOMED-Kodierung der Schädel-MRT gemeinsam mit brainMriHighRisk entscheiden: Beide Elemente führen
  denselben Coding-Satz mit 241601008 ''MRI of head'', einem Gruppierungskonzept, das weitere Kopf-MRT-Untersuchungen
  umfasst. Untersucht wird das Gehirn (S3-LL Lungenkarzinom 5.1, Empf. 9.26: „MRT-Kontrolle des Gehirns“;
  Empf. 8.132 ff.: „Bildgebung des ZNS“); dazu passt das engere, aktive Kindkonzept 816077007 ''MRI of
  brain'' (Parents 241601008 und 441986001 ''Imaging of brain''), deckungsgleich mit LOINC 24590-2 ''MR
  Brain''. In brainMriHighRisk war 241601008 ursprünglich mit dem Anzeigetext ''MRI of brain (procedure)''
  erfasst; bei der Terminologie-Verifikation vom 2026-10-13 wurde nur der Anzeigetext angeglichen und
  derselbe Code hier ergänzt. Für 241601008 spricht der Wortlaut der OPS-Codes 3-800/3-820 („des Schädels“).
  Zu entscheiden: 241601008 in beiden Elementen durch 816077007 ersetzen oder in beiden beibehalten; eine
  Änderung in nur einem Element ließe die beiden Schädel-MRT-Elemente auseinanderlaufen.'
related_elements:
