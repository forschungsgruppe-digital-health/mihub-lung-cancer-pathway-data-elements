    url: https://www.leitlinienprogramm-onkologie.de/leitlinien/palliativmedizin
    section: Kap. 5.5 Gleichzeitigkeit von Palliativversorgung und tumorspezifischer Therapie, Empf. 5.32
      (konsensbasiert, neu 2026, Starker Konsens)
    recommendation_grade: EK
    evidence_level: n/a
    quote: Optionen der tumorzentrierten onkologischen Therapie und der Palliativversorgung sollen systematisch
      und patient:innenindividuell in der Behandlungsplanung berücksichtigt werden.
    accessed: '2026-10-15'
    locator: Kap. 5.5 Gleichzeitigkeit von Palliativversorgung und tumorspezifischer Therapie, Empf. 5.32
      (EK, neu 2026, Starker Konsens), S. 98
  - source: OCP Lung (AU)
    version: 2nd ed. 2021 (Update 07/2025)
    url: https://www.cancer.org.au/assets/pdf/ocp/lung-cancer-2nd-edition
    section: 'Step 4.3 Palliative care + Step 6.5 Palliative care (frühe, bedarfs- statt prognosebasierte
      Überweisung); Step 6.1.3 (ab Diagnose: supportive care, ACP, symptombezogene Interventionen)'
    recommendation_grade: n/a
    evidence_level: n/a
    quote: Early referral to palliative care can improve the quality of life for people with cancer …
      Referral should be based on need rather than prognosis. … From the time of diagnosis, the team should
      offer patients appropriate psychosocial care, supportive care, advance care planning
    accessed: '2026-10-15'
    locator: Step 4.3 Palliative care; Step 6.5 Palliative care; Step 6.1.3 Metastatic disease (Managing
      metastatic disease)
  - source: S3-LL Lungenkarzinom
    version: 5.1 (Juli 2026, AWMF 020-007OL)
    url: https://www.leitlinienprogramm-onkologie.de/leitlinien/lungenkarzinom
    section: 'Statement 8.6 (EK, modifiziert 2026: regelmäßiges standardisiertes Symptomassessment + frühzeitige
      Palliativberatung); Empf. 16.2 (EK: Bedarf an Palliativmedizin im Verlaufsplan erkennen)'
    recommendation_grade: EK
    evidence_level: n/a
    quote: Neben einer frühzeitigen Palliativberatung sollte ein standardisiertes Symptomassessment regelmässig
      durchgeführt werden, um eine bedarfsorientierte In-tegration von Palliativversorgung zu ermöglichen.
      … den Bedarf an Psychoonkologie, Palliativmedizin und Sozialberatung zu erkennen.
    accessed: '2026-10-15'
    locator: Kap. 8.2, Statement 8.6 (EK, modifiziert 2026, Starker Konsens), S. 203; Empf. 16.2 (EK,
      geprüft 2026), S. 492
  - source: S3-LL Lungenkarzinom
    version: 5.1 (Juli 2026, AWMF 020-007OL)
    url: https://www.leitlinienprogramm-onkologie.de/leitlinien/lungenkarzinom
    section: 'Kap. 8.2 Konzept der frühzeitigen Integration palliativmedizinischer Versorgung, Empf. 8.2
      (evidenzbasiert, geprüft 2026, Konsens: frühzeitiges Angebot der Integration von Palliativberatung
      und -versorgung nach Diagnosestellung)'
    recommendation_grade: A
    evidence_level: '3'
    quote: Patienten mit einer nicht-heilbaren Lungenkarzinomerkrankung sollen nach Diagnosestellung frühzeitig
      das Angebot einer Integration von Palliativberatung und - versorgung erhalten.
    accessed: '2026-10-15'
    locator: Kap. 8.2, Empf. 8.2 (Empfehlungsgrad A, Evidenzlevel 3, Konsens, geprüft 2026), S. 202
  - source: S3-LL Lungenkarzinom
    version: 5.1 (Juli 2026, AWMF 020-007OL)
    url: https://www.leitlinienprogramm-onkologie.de/leitlinien/lungenkarzinom
    section: 'Kap. 8.2, Empf. 8.3 (evidenzbasiert, geprüft 2026, Konsens: Angebot innerhalb der ersten
      2 Monate nach Diagnosestellung)'
    recommendation_grade: B
    evidence_level: '3'
    quote: Das Angebot zur Integration von Palliativberatung und -versorgung bei Patienten … mit einer
      nicht-heilbaren Lungenkarzinomerkrankung sollte frühzeitig (innerhalb der ersten 2 Monate) nach
      Diagnosestellung erfolgen.
    accessed: '2026-10-15'
    locator: Kap. 8.2, Empf. 8.3 (Empfehlungsgrad B, Evidenzlevel 3, Konsens, geprüft 2026), S. 202
  - source: S3-LL Palliativmedizin
    version: 3.0 (Juli 2026, AWMF 128-001OL)
    url: https://www.leitlinienprogramm-onkologie.de/leitlinien/palliativmedizin
    section: Kap. 5.3 Bestimmung der Komplexität der Situation und Indikation für Intensität der Palliativversorgung,
      Empf. 5.3 (konsensbasiert, neu 2026, Starker Konsens)
    recommendation_grade: EK
    evidence_level: n/a
    quote: Bei Patient:innen soll nach der Diagnose einer nicht-heilbaren Krebserkrankung … regelmäßig
      die Komplexität der Bedürfnisse und Probleme (niedrig/mittel/hoch) evaluiert und die Indikation
      der Versorgungsstufe … gestellt werden.
    accessed: '2026-10-15'
    locator: Kap. 5.3 Bestimmung der Komplexität der Situation und Indikation für Intensität der Palliativversorgung,
      Empf. 5.3 (EK, neu 2026, Starker Konsens), S. 55
  - source: S3-LL Palliativmedizin
    version: 3.0 (Juli 2026, AWMF 128-001OL)
    url: https://www.leitlinienprogramm-onkologie.de/leitlinien/palliativmedizin
    section: 'Kap. 5.4.3 Spezialisierte Palliativversorgung (SPV), Empf. 5.7 (evidenzbasiert, geprüft
      2026, Konsens: hohe Komplexität → SPV)'
    recommendation_grade: A
    evidence_level: '3'
    quote: Patient:innen mit einer nicht-heilbaren Krebserkrankung und einer hohen Komplexität ihrer Situation
      sollen eine spezialisierte Palliativversorgung erhalten.
    accessed: '2026-10-15'
    locator: Kap. 5.4.3 Spezialisierte Palliativversorgung (SPV), Empf. 5.7 (Empfehlungsgrad A, Evidenzlevel
      3, Konsens, geprüft 2026), S. 60
