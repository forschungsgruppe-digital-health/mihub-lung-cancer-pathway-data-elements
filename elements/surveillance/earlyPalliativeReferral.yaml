id: mihub.lung.surveillance.earlyPalliativeReferral.v0.1
uuid: d0e10eac-70a7-53f8-9f8f-47c9e7e21673
name: earlyPalliativeReferral
label_de: Frühzeitige palliativmedizinische Mitbetreuung
definition_de: Anbindung an eine palliativmedizinische Mitbetreuung (Palliativberatung und -versorgung)
  parallel zur tumorspezifischen Therapie bei nicht-heilbarer Lungenkarzinomerkrankung. Patient:innen
  sollen nach Diagnosestellung frühzeitig das Angebot einer Integration von Palliativberatung und -versorgung
  erhalten (S3-LL Lungenkarzinom 5.1, Empf. 8.2, A); das Angebot sollte innerhalb der ersten 2 Monate
  nach Diagnosestellung erfolgen (Empf. 8.3, B). Optionen der tumorzentrierten onkologischen Therapie
  und der Palliativversorgung sollen systematisch und patient:innenindividuell in der Behandlungsplanung
  berücksichtigt werden (S3-LL Palliativmedizin 3.0, Empf. 5.32, EK). Neben einer frühzeitigen Palliativberatung
  sollte regelmäßig ein standardisiertes Symptomassessment durchgeführt werden, um eine bedarfsorientierte
  Integration der Palliativversorgung zu ermöglichen (S3-LL Lungenkarzinom 5.1, Statement 8.6, EK, modifiziert
  2026).
phase: surveillance
tumor_entity:
- NSCLC
- SCLC
category: mitbetreuung
datatype: boolean
cardinality: 1..1
