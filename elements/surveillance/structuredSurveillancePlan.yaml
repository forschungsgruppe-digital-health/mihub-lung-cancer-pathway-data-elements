name: structuredSurveillancePlan
label_de: Strukturierter Verlaufsplan vorhanden (Stadium IV)
definition_de: Vorhandensein eines strukturierten Verlaufs-/Follow-up-Plans unter Systemtherapie im Stadium
  IVA/IVB, der Progression/Rezidive, Zweitkarzinome, Komplikationen und Toxizitäten der Therapie sowie
  den Bedarf an Psychoonkologie, Palliativmedizin und Sozialberatung adressiert.
phase: surveillance
tumor_entity:
- NSCLC
- SCLC
category: versorgungsplanung
datatype: boolean
cardinality: 1..1
value_set:
  binding_strength: extensible
  standard_binding_status: mapped
  codings:
  - system: kdl
    code: SD150101
    display: Follow up-Bogen
  - system: snomed-ct
    code: '736252007'
    display: Cancer care plan
standard_mappings:
- standard: fhir-r4-base
  resource: CarePlan
  path: CarePlan.category
care_process:
  trigger: Beginn der Systemtherapie im Stadium IVA/B; Aktualisierung bei Linienwechsel
  frequency_pattern: per-line
  responsible_role: Onkolog:in
evidence:
  guideline_references:
  - source: S3-LL Lungenkarzinom
    version: 5.1 (Juli 2026, AWMF 020-007OL)
    url: https://www.leitlinienprogramm-onkologie.de/leitlinien/lungenkarzinom
    section: Empf. 16.2 (EK, geprüft 2026)
    recommendation_grade: EK
    evidence_level: n/a
    quote: Im Verlauf einer systemischen Therapie (Stadium IVA, IVB) sollte für jeden … ein strukturierter
      Verlaufsplan/Follow-up-Plan erstellt werden. … Komplikationen und Toxizitäten der Therapie und den
      Bedarf an Psychoonkologie, Palliativmedizin und Sozialberatung zu erkennen.
    accessed: '2026-10-15'
    locator: Kap. 16.1, Empf. 16.2 (EK, Starker Konsens, geprüft 2026), S. 492
  - source: S3-LL Lungenkarzinom
    version: 5.1 (Juli 2026, AWMF 020-007OL)
    url: https://www.leitlinienprogramm-onkologie.de/leitlinien/lungenkarzinom
    section: 'Kap. 16.4 / Empf. 16.9 (Systemtherapie Stadium IVA/B: Evaluation einen Monat nach Behandlungsabschluss;
      festgelegte Wiedervorstellungen bei laufender Erhaltungstherapie mind. alle 3–6 Wochen; CT-Kontrollen
      im Intervall von 6–9 Wochen)'
    recommendation_grade: EK
    evidence_level: n/a
    quote: Danach sollten festgelegte Wiedervorstellungen bei laufender Erhaltungstherapie (NSCLC, SCLC)
      mindestens alle 3-6 Wochen erfolgen. Bei Patienten unter laufender Systemtherapie sind CT Kontrollen
      im Verlaufsintervall von 6 bis 9 Wochen sinnvoll.
    accessed: '2026-10-15'
    locator: Kap. 16.4, Empf. 16.9 (EK, Starker Konsens, geprüft 2026), S. 499
