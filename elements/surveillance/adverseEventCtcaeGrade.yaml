issues:
- 'standard_mappings[0].resource ''Observation'' entspricht nicht dem MII-KDS-Onkologie-Modell: Der CTCAE-Grad
  liegt in AdverseEvent.seriousness (required an mii-vs-onko-nebenwirkung-ctcae-grad) im Profil mii-pr-onko-nebenwirkung-adverse-event
  (2027.0.0-ballot.1). Das Mapping ist zentral zusammen mit profile_or_url zu korrigieren. Zudem leitet
  value_set.uri (ctep.cancer.gov/…/ctc.htm) per HTTP 301 auf https://dctd.cancer.gov/research/ctep-trials/trial-development
  um (Abruf 2026-10-14, UNSICHER).'
