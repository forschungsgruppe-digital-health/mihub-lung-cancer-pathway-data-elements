id: mihub.lung.surveillance.adverseEventCtcaeGrade.v0.2
uuid: 0da2cffb-e8ad-5cd6-b6ed-bea3a1adea4a
name: adverseEventCtcaeGrade
label_de: CTCAE-Grad
definition_de: Schweregrad eines therapieassoziierten unerwünschten Ereignisses nach NCI Common Terminology
  Criteria for Adverse Events (CTCAE) v5.0/v6.0. Wertebereich 1 (mild) bis 5 (Tod). Ergänzt das Datenelement
  'adverseEventCtcae'.
phase: surveillance
tumor_entity:
- NSCLC
- SCLC
category: assessment
datatype: CodeableConcept
cardinality: 0..*
value_set:
  binding_strength: required
  standard_binding_status: mapped
  codings:
  - system: snomed-ct
    code: '255604002'
    display: Mild
  - system: snomed-ct
    code: '6736007'
    display: Moderate severity
  - system: snomed-ct
    code: '24484000'
    display: Severe
  - system: snomed-ct
    code: '442452003'
    display: Life threatening severity
  - system: snomed-ct
    code: '399166001'
    display: Fatal
  uri: https://ctep.cancer.gov/protocoldevelopment/electronic_applications/ctc.htm
  notes: 'Nationale Referenzkodierung (oBDS 2021, 15.1; MII KDS Onkologie 2027.0.0-ballot.1, AdverseEvent.seriousness,
    required): ValueSet https://www.medizininformatik-initiative.de/fhir/ext/modul-onko/ValueSet/mii-vs-onko-nebenwirkung-ctcae-grad
    (CodeSystem mii-cs-onko-nebenwirkung-ctcae-grad: 1 mild, 2 moderat, 3 schwerwiegend, 4 lebensbedrohlich,
    5 tödlich, U unbekannt, K keine; MII TermServ v2025.1.0, geprüft 2026-10-14). Die SNOMED-CT-Schweregrade
    (255604002, 6736007, 24484000, 442452003, 399166001) dienen als Zweitkodierung in Anlehnung an die
    MII-ConceptMap mii-cm-onko-nebenwirkung-sct (laut eigener Beschreibung weder offiziell endorsed noch
    final qualitätsgesichert; erstellt gegen SNOMED CT 20240401). Abweichend davon ist für Grad 2 bewusst
    6736007 ''Moderate severity'' (Parent 272141005 Severities, wie die übrigen Grade) statt 1255665007
    ''Moderate'' (Parent 35105006 Increased) gewählt.'
standard_mappings:
- standard: obds
  profile_or_url: https://www.basisdatensatz.de/basisdatensatz
  resource: 15 Nebenwirkungen von Strahlentherapie oder systemischer Therapie (Meldung SYST bzw. ST)
  path: '15.1 Nebenwirkungen nach CTCAE-Grad: SYST/Nebenwirkungen/Menge_Nebenwirkung/Nebenwirkung/Grad
    (3, 4, 5) mit Art (15.2: MedDRA_Code oder Bezeichnung) und Version (15.3); Grad ≤ 2 nur aggregiert
    über SYST/Nebenwirkungen/Grad_maximal2_oder_unbekannt (K, 1, 2, U)'
  notes: 'Pflichtmeldung gem. § 65c SGB V. Feldseite 15.1: https://basisdatensatz.de/feld/205/nebenwirkungen-nach-ctcae-grad
    (Link aus der Feldliste). XML-Schema oBDS 3.0.5 (https://basisdatensatz.de/xml/oBDS_v3.0.5.xsd, Nebenwirkung_Typ):
    Einzelereignisse werden nur ab Grad 3 gemeldet, Grad 1–2 nur als Maximalgrad je Therapie; zulässige
    CTCAE-Versionen 4, 4.03, 5.0 und ''Sonstige'' (CTCAE v6.0 → ''Sonstige''). Transformation: SNOMED-Schweregrad
    des Elements → oBDS-Grad (255604002→1, 6736007→2, 24484000→3, 442452003→4, 399166001→5). Für Strahlentherapie
    analog ST/Nebenwirkungen.'
- standard: fhir-mii-kds
  profile_or_url: https://www.medizininformatik-initiative.de/fhir/ext/modul-onko/StructureDefinition/mii-pr-onko-nebenwirkung-adverse-event
  resource: AdverseEvent
  path: AdverseEvent.seriousness
  notes: 'MII KDS Onkologie 2026.0.3 (MII_PR_Onko_Nebenwirkung_Adverse_Event); MII bildet Nebenwirkungen
    als AdverseEvent ab, nicht als Observation. AdverseEvent.seriousness (1..1, MS) ist REQUIRED an mii-vs-onko-nebenwirkung-ctcae-grad
    gebunden (CodeSystem https://www.medizininformatik-initiative.de/fhir/ext/modul-onko/CodeSystem/mii-cs-onko-nebenwirkung-ctcae-grad:
    1 mild, 2 moderat, 3 schwerwiegend, 4 lebensbedrohlich, 5 tödlich, U unbekannt, K keine). Transformation:
    SNOMED-Schweregrad des Elements → MII-Code (255604002→1, 6736007→2, 24484000→3, 442452003→4, 399166001→5).
    Der MII-Code ist Pflicht; der SNOMED-Code kann als zusätzliches Coding mitgeführt werden (seriousness.coding
    ist nicht gesliced). Die MII-ConceptMap mii-cm-onko-nebenwirkung-sct führt für Grad 2 den Code 1255665007,
    das Element bewusst 6736007 (siehe value_set.notes). Art des Ereignisses (MedDRA, AdverseEvent.event.coding:meddra)
    = Element adverseEventCtcae; AdverseEvent.suspectEntity (1..*) verweist auf die auslösende Therapie
    (Procedure bzw. MedicationStatement).'
constraints_de: Wertebereich 1..5 (1=mild, 2=moderat, 3=schwer, 4=lebensbedrohlich, 5=Tod); zulässige
  Grade sind termspezifisch gemäß CTCAE (z. B. Pruritus max. Grad 3; Confusion ohne Grad 5 in v5.0/v6.0).
  oBDS/MII sehen zusätzlich U (unbekannt) und K (keine) vor.
care_process:
  trigger: bei jedem Auftreten eines unerwünschten Ereignisses
  frequency_pattern: per-event
  responsible_role: Onkologe
