issues:
- 'value_set.uri prüfen: https://ctep.cancer.gov/protocoldevelopment/electronic_applications/ctc.htm leitet
  per HTTP 301 auf https://dctd.cancer.gov/research/ctep-trials/trial-development um (Abruf 2026-10-14,
  UNSICHER); ggf. auf die aktuelle CTCAE-Seite des NCI umstellen.'
- 'Repräsentation CTCAE-Grad: Das Element kodiert den Grad als CodeableConcept mit fünf SNOMED-Schweregraden
  (255604002, 6736007, 24484000, 442452003, 399166001). Die nationale Referenzkodierung (MII-CodeSystem
  mii-cs-onko-nebenwirkung-ctcae-grad: 1–5, U, K) steht nur in value_set.notes. MII Onkologie 2026.0.3
  verlangt in AdverseEvent.seriousness (1..1, REQUIRED) einen Code dieses CodeSystems; SNOMED ist dort
  nur als zusätzliches Coding möglich. oBDS 3.0.5 meldet Grad 3–5 je Ereignis (Menge_Nebenwirkung/Nebenwirkung/Grad)
  und Grad ≤ 2 nur aggregiert als Maximalgrad je Therapie (Grad_maximal2_oder_unbekannt: K/1/2/U). Zu
  entscheiden: (a) ob die MII-Codes 1–5 als zusätzliche Codings ins Element aufgenommen werden oder die
  Abbildung SNOMED → MII-Code nur als Transformation im Mapping dokumentiert bleibt; (b) wie U (unbekannt)
  und K (keine) abgebildet werden – in constraints_de erwähnt, aber ohne Coding (MII-ConceptMap: U→261665006,
  K→260413007); (c) wie für oBDS der Maximalgrad ≤ 2 je Therapie aus den Einzelereignissen gebildet wird.
  Die Grad-2-Abweichung (6736007 statt ConceptMap-Ziel 1255665007) ist in value_set.notes bereits begründet.'
