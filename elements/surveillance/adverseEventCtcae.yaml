name: adverseEventCtcae
label_de: Unerwünschtes Ereignis (CTCAE)
definition_de: Therapieassoziiertes unerwünschtes Ereignis nach NCI CTCAE v5.0/v6.0 mit Grad 1–5.
phase: surveillance
tumor_entity:
- NSCLC
- SCLC
category: befund
datatype: CodeableConcept
cardinality: 0..*
value_set:
  binding_strength: extensible
  uri: https://ctep.cancer.gov/protocoldevelopment/electronic_applications/ctc.htm
  codings:
  - system: meddra
    code: '10061229'
    display: Lung infection
  - system: meddra
    code: '10035742'
    display: Pneumonitis
  - system: meddra
    code: '10010300'
    display: Confusion
  standard_binding_status: mapped
  notes: 'MedDRA ist auf dem MII TermServ nicht verfügbar (Lizenz). Codes geprüft (2026-10-14) gegen MII
    KDS Onkologie 2027.0.0-ballot.1 (ValueSet mii-vs-onko-nebenwirkung-art = MedDRA-Codes der CTCAE v4.03;
    ConceptMap mii-cm-onko-nebenwirkung-meddra-sct) und NCI CTCAE v5.0/v6.0 (Excel-Fassungen): Lung infection
    10061229, Pneumonitis 10035742, Confusion 10010300 (Grad 5 in v4.03 vorhanden, ab v5.0 gestrichen).
    In CTCAE v6.0 ist ''Lung infection'' gestrichen und durch ''Pneumonia'' (10035664) ersetzt; 10035664
    ist nicht im v4.03-basierten MII-ValueSet enthalten. CTCAE-Begriffe sind MedDRA-LLT-basiert.'
care_process:
  trigger: bei jedem Kontakt unter Therapie
  frequency_pattern: per-encounter
  responsible_role: Onkologe
