issues:
- 'CTCAE-Version je Ereignis mitführen: MII KDS Onkologie 2027.0.0-ballot.1 (Extension mii-ex-onko-nebenwirkung-ctcae-version,
  required gebunden; in 2026.0.3 noch nicht enthalten) bzw. oBDS 2021 (15.3) kennen nur die CTCAE-Versionen
  4, 4.03, 5.0 und ''Sonstige''. CTCAE v6.0 (NCI, Juli 2025) wäre daher nur als ''Sonstige'' meldbar,
  obwohl sich der Termbestand unterscheidet (z. B. v6.0: ''Lung infection'' 10061229 gestrichen, ersetzt
  durch ''Pneumonia'' 10035664). Standard-Mapping auf mii-pr-onko-nebenwirkung-adverse-event ergänzen
  (AdverseEvent.event.coding:meddra, required an mii-vs-onko-nebenwirkung-art); dieses ValueSet enthält
  nur die MedDRA-Codes der CTCAE v4.03 (10035664 nicht enthalten). value_set.uri (ctep.cancer.gov/…/ctc.htm)
  leitet per HTTP 301 auf https://dctd.cancer.gov/research/ctep-trials/trial-development um (Abruf 2026-10-14,
  UNSICHER).'
