    section: Empf. 16.9 (Toxizitäten)
    recommendation_grade: EK
    evidence_level: n/a
    quote: Unter einer Systemtherapie im Stadium IVA/B sollten Ansprechen, … Beschwerdebild einen Monat
      nach Abschluss der Behandlung durch das den Patienten betreuende Team evaluiert werden.
    accessed: '2026-10-15'
    locator: Kap. 16.4, Empf. 16.9 (EK, geprüft 2026, Starker Konsens), S. 499
  - source: S3-LL Lungenkarzinom
    version: 5.1 (Juli 2026, AWMF 020-007OL)
    url: https://www.leitlinienprogramm-onkologie.de/leitlinien/lungenkarzinom
    section: 'Empf. 16.2 (EK, geprüft 2026: strukturierter Verlaufs-/Follow-up-Plan unter Systemtherapie
      Stadium IVA/IVB zur Erkennung von Komplikationen und Toxizitäten der Therapie)'
    recommendation_grade: EK
    evidence_level: n/a
    quote: Der strukturierte Verlaufsplan/Follow-up-Plan sollte geeignet sein, Progression/Rezidive, Zweitkarzinome,
