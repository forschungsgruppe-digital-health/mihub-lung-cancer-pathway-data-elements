issues:
- 'Instrumentenwahl, Trigger und Frequenz sind nicht leitliniengestützt: Keine eingeschlossene Leitlinie
  empfiehlt den EORTC QLQ-C30 (Globalskala) für die Routine-Verlaufskontrolle. ''In jeder Linie, bei Restaging''
  und ''Q6-9W oder Q3M'' sind durch die zitierten Stellen nicht belegt (allenfalls an das CT-Restaging
  alle 6–9 Wochen nach S3 Empf. 16.9 koppelbar) und sollten als MiHUB-Festlegung gekennzeichnet werden.
  Zusätzlich die Lizenz klären: Laut Scoring Manual (2001) darf der QLQ-C30 nur mit vorheriger schriftlicher
  Zustimmung des EORTC Data Center genutzt werden (aktuelle Lizenzbedingungen UNSICHER).'
