name: qolEortcQlqC30
label_de: EORTC QLQ-C30 Globalskala
definition_de: 'Score der Skala ''Global health status/QoL'' (QL2) des EORTC QLQ-C30 (Version 3.0): Mittelwert
  der Items 29 und 30 (je 1–7), linear transformiert auf 0–100 (S = (RS − 1)/6 × 100); höher = bessere
  Lebensqualität.'
phase: surveillance
tumor_entity:
- NSCLC
- SCLC
category: prom
datatype: decimal
cardinality: 0..*
unit: '{score}'
value_set:
  binding_strength: preferred
  codings:
  - system: snomed-ct
    code: '273446001'
    display: European Organisation for Research and Treatment of Cancer - Quality of Life questionnaire
  - system: snomed-ct
    code: '709503007'
    display: Assessment of quality of life
  standard_binding_status: mapped
  notes: 'Kein LOINC- oder SNOMED-CT-Code für den Score der QLQ-C30-Globalskala (QL2): LOINC 2.83 enthält
    keine EORTC-QLQ-C30-Inhalte (TermServ-Expand ''QLQ-C30'' ohne Treffer, 2026-10-14); SNOMED CT bietet
    nur 273446001 (assessment scale, Instrument) und das generische 709503007 (procedure, Erhebungsakt).
    Die vorhandenen Codings bezeichnen daher Instrument bzw. Erhebungsakt, nicht den Messwert. National
    definiert das MII-KDS-Modul PRO (Paket de.medizininformatikinitiative.kerndatensatz.pros 2026.7.0)
    den Score-Code eortc-qlq-c30-ql ''EORTC QLQ-C30 Global Health Status / Quality of Life Score'' (CodeSystem
    https://www.medizininformatik-initiative.de/fhir/ext/modul-pro/CodeSystem/mii-cs-pro-score-catalogue;
    ObservationDefinition mii-obsdef-pro-eortc-qlq-c30-ql: Einheit {score}, decimalPrecision 2); auf dem
    MII TermServ am 2026-10-14 nicht auflösbar. Aufnahme als Coding bzw. Mapping prüfen.'
care_process:
  trigger: in jeder Linie, bei Restaging
  frequency_pattern: Q6-9W oder Q3M
  responsible_role: Onkologie / PROM-Plattform
